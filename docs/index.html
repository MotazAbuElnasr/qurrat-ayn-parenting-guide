باية بلاستيك","prep":"وقت لعب هادي في أوضته — مش بعد موقف كدب حقيقي، عشان اللعبة متتحسش إنها محاكمة.","run":"مثّل إن العروسة الصغيرة كسرت الكوباية (اقلبها جنبها) وخافت تقول لماما — وقّف المشهد واسأله: «تعمل إيه دلوقتي؟». مثّلوا الاعتراف سوا: العروسة تقول «أنا كسرتها»، وماما-العروسة ترد: «شكرًا إنك قلتي الحقيقة، تعالي نلمّها سوا». واختم بالجملة اللي بتربط اللعبة بالبيت: «كده بالظبط بيحصل عندنا في البيت»."}],"say":"قوللي اللي حصل، مش هتتعاقب على الصراحة.","deen":["الصادق الأمين","قريش كانت بتنادي النبي ﷺ بالصادق الأمين قبل ما ينزل عليه الوحي — احكيها لطفلك كحدوتة قبل النوم: «الناس كلها كانت بتقول عليه صادق لأنه عمره ما كدب». واربطها بقاعدة بيتكم العملية: اللي يقول الحقيقة عندنا عمره ما يتعاقب على صراحته. ولما يعترف بغلطة قوله فورًا: «قلت الحقيقة زي الصادق الأمين — تعالى نصلّحها سوا». التكرار في لحظة الاعتراف نفسها هو اللي بيربط الصدق بالأمان مش بالخوف."],"skill":"المساعدة في التسوق: في السوبرماركت ياخد مهمة محددة — «هات علبتين زبادي» — ويرجعلك يقول بالظبط لقى إيه ومالقاش إيه، تدريب يومي على الدقة وقول اللي حصل زي ما هو.","lvl":2,"ord":3,"tag":"الصدق والأمانة","src":[["قصة · مجاني","الاختيار الصعب","https://3asafeer.com/ar/read/706/الاختيار-الصعب"],["قصة · عصافير مميز","لا تخبر أحدًا","https://3asafeer.com/ar/read/576/لا-تخبر-أحدا"]],"mistakes":[{"m":"بتحكي كدبته للعيلة قدامه وانتو بتضحكوا — «تعالوا اسمعوا قال إيه النهارده» — الدرس اللي وصله: الكدبة الحلوة بتجيب جمهور واهتمام.","fix":"من غير احتفال ولا تكشيف: صحح على انفراد وبهدوء — «دي حدوتة حلوة من خيالك… طب إيه اللي حصل بجد؟»."},{"m":"بيعترف بالغلط وبعدين بتعاقبه عليه — اعترف إنه كسر الكوباية فاتحرم من التابلت: دفع تمن الصراحة مرتين، والمرة الجاية هينكر.","fix":"الاعتراف يقفل باب اللوم ويفتح باب الإصلاح: «شكرًا إنك قلت — تعالى نلم الكسر سوا». النتيجة الطبيعية (نصلّح اللي حصل) كفاية."},{"m":"بتلزق فيه التسمية — «انت كداب» في وشه أو قدام الناس — الوصف بيلزق، والطفل اللي اتسمى كداب بيعيش الدور.","fix":"صف الكلام مش الطفل: «اللي اتقال مش هو اللي حصل» — وافتح باب رجوع: «فكر تاني وقولي اللي حصل بجد» — وأول ما يرجع للحقيقة استقبلها بترحيب."}],"adapt":[{"kid":"الحساس","how":"مش بيكدب عشان يفلت — بيكدب عشان خايف يشوف الخيبة في عينيك: نظرة زعلك أتقل عليه من أي عقاب. طمنه قبل السؤال: «مهما اللي حصل، أنا مش هزعل منك انت — احكيلي»، وبعد ما يصارح اقفل الموضوع بسرعة من غير إعادة فتح."},{"kid":"العنيد","how":"المواجهة بالدليل بتحوّلها معركة كرامة — كل ما تقول «أنا شايف الشوكولاتة على بقك» بيزوّد إنكار. متحاصرهوش لإجابة فورية: قول اللي شايفه مرة واحدة وامشي — «أنا عارف اللي حصل، ولما تحب تحكيلي أنا موجود». الاعتراف بييجي لما مفيش جمهور ولا معركة."},{"kid":"عالي الشدة","how":"أول رد فعل وقت الخضة صريخ إنكار — «مش أنا! مش أنا!» — دي مش كدبة مدروسة، دي ذعر. متحاسبوش على أول جملة طلعت: اديله دقيقة يهدى وارجعله — «خد نفسك… دلوقتي احكيلي» — واحسب له الرواية التانية مش الأولى."}]},
{"name":"الأمانة","cat":"دين وأخلاق","age":[4,12],"how":"مواقف صغيرة متكررة: نرجّع المستعار، ونرد اللي لقيناه. القاعدة تتقال في الموقف مش في محاضرة.","steps":[{"t":"«ده بتاع مين؟» في البيت","d":"قبل ما يفهم الأمانة، لازم يفهم الملكية. وانتوا قاعدين في الصالة، شاور واسأله: «النضارة دي بتاعة مين؟ والشنطة دي؟ والعربية الحمرا؟» — نضارة بابا، شنطة ماما، لعبته هو. العبها كل كام يوم لحد ما خريطة «كل حاجة ليها صاحب» تثبت في دماغه — دي الأرضية اللي كل اللي جاي بيتبني عليها.","say":"النضارة دي بتاعة بابا — كل حاجة في البيت ليها صاحب."},{"t":"نستأذن قبل ما ناخد","d":"بعد ما فكرة الملكية ثبتت، حوّلها سلوك: عايز يلعب بموبايلك؟ «اسأل الأول: ممكن يا بابا؟». عايز عربية أخوه وأخوه مش موجود؟ «نستناه ونستأذنه — مش بنلعب بحاجة حد في غيابه». والجزء الأهم: طبّقها انت عليه بالمقلوب — استأذنه قبل ما تاخد كراسته ترسم فيها أو تعير لعبته لطفل ضيف. الطفل اللي حاجته بتتاخد من غير إذنه عمره ما هيفهم ليه هو اللازم يستأذن.","say":"مش بتاعنا؟ نستأذن الأول — حتى لو هنرجّعه بعد دقيقة."},{"t":"نرجّع المستعار في نفس اليوم","d":"أول ما حاجة مستعارة تخلص مهمتها — كتاب من مكتبة الحضانة، لعبة من ابن عمه — اقفل الدايرة فورًا: «الكتاب ده بتاع مين؟ خلصنا منه — نرجّعه إزاي؟». طفلك هو اللي يسلّمه بإيده لصاحبه ويقول شكرًا، مش انت اللي تسلّم بالنيابة عنه.","say":"المستعار بنرجّعه زي ما هو — دي أمانة."},{"t":"لقينا حاجة — نعمل إيه؟","d":"لما يلاقي لعبة مش بتاعته جت غلط في شنطة الحضانة، أو ورقة فلوس على أرض السوبرماركت، ده وقت الدرس الحقيقي مش وقت المحاضرة. اسأله بهدوء: «دي بتاعتنا؟ لأ — طب نوصّلها لصاحبها إزاي؟» وخليه هو اللي يسلّمها بإيده للمدرّسة أو لموظف الكاشير.","say":"دي مش بتاعتنا — نسلّمها عشان صاحبها يلاقيها."},{"t":"أمانتك انت قدامه","d":"أقوى درس في الأمانة هو اللي بيشوفه فيك. لو الكاشير ادّاك باقي زيادة، رجّعه قدامه وقول بصوت مسموع: «ده زيادة عن حقي — لازم أرجّعه». ولو استلفت مفك أو طبق من جارك، خد طفلك معاك وانت بترجّعه وسمّي الفعل: «دي كانت أمانة عندنا ورجعت لصاحبها».","say":"إحنا مبناخدش حاجة مش بتاعتنا — حتى لو محدش شاف."}],"mastery":"بيرجّع اللي مش بتاعه (لعبة صاحبه، حاجة لقاها) من نفسه.","acts":[{"t":"لعبة «السلة بتاعة مين؟»","mat":"سلة غسيل + حاجة لكل واحد في البيت: نضارة بابا، إيشارب ماما، جورب طفلك، الريموت","prep":"اجمع الحاجات في السلة قبل ما تناديه، في أي وقت لعب في الصالة.","run":"هو يطلّع من السلة حاجة حاجة، يقول بتاعة مين، ويروح يسلّمها لصاحبها بإيده. اختم كل تسليمة بجملة ثابتة: «رجّعت حاجة لصاحبها — كده الأمانة»."},{"t":"صندوق الأمانات","mat":"علبة كرتون + ألوان + رف واضح في الصالة","prep":"هو يلوّن العلبة وتكتبوا عليها سوا «الأمانات»، وحطوها على الرف مرة واحدة وخلاص.","run":"أي حاجة مستعارة أو ملقية — كتاب الحضانة، لعبة ابن عمه — تتحط فيها لحد ما ترجع لصاحبها، وهو المسؤول إنه يفتكر ويقول: «فيه حاجة في الصندوق لازم ترجع». وعلّق كل ما حاجة ترجع: «الصندوق ده مبتقعدش فيه حاجة كتير — الأمانة بترجع بسرعة»."}],"say":"ده مش بتاعنا، نرجّعه.","deen":["الأمانة في السيرة","احكيها لطفلك كحدوتة: حتى اللي كانوا بيعادوا النبي ﷺ كانوا بيسيبوا حاجتهم الغالية أمانة عنده، ولما هاجر ساب سيدنا علي مخصوص عشان يرجّع الودايع لأصحابها. وصلة الحدوتة بيوم طفلك فعل متكرر: أي حاجة مستعارة — كتاب الحضانة، لعبة ابن عمه — ليها معاد رجوع، ولما يرجّعها بإيده قوله: «رجّعتها زي ما النبي كان بيرجّع الأمانات». الربط ده بيتبني بالتكرار والفرحة، مش بالتحذير والتخويف."],"skill":"الحفاظ على حاجة مش بتاعته: ياخد كتاب من مكتبة الحضانة أو لعبة من صاحبه ويرجّعها سليمة في معادها — نفس الأمانة اللي هيتعامل بيها مع عهدة الفصل في المدرسة.","lvl":2,"ord":4,"tag":"الصدق والأمانة","src":[["مجاني","ودائع قريش","https://www.belarabyapps.com/%d8%a7%d9%84%d9%87%d8%ac%d8%b1%d8%a9-%d8%a7%d9%84%d9%86%d8%a8%d9%88%d9%8a%d8%a9-%d9%84%d9%84%d8%a7%d8%b7%d9%81%d8%a7%d9%84/"],["قصة · عصافير مميز","المقلمة","https://3asafeer.com/ar/read/1115/المقلمة"],["قصة · عصافير مميز","من بعثر أشيائي","https://3asafeer.com/ar/read/623/من-بعثر-أشيائي"]],"mistakes":[{"m":"بتدي لعبته أو هدومه لولاد قرايبك من غير ما تستأذنه — «ده بقى صغير عليك خلاص» — وبعدين تستغرب إنه بياخد حاجات غيره: هو شايف إن الملكية بتتداس أول ما الأكبر يقرر.","fix":"استأذنه حتى في اللي انت شايفه تافه: «ممكن ندي العربية دي لابن خالتك؟» — واستحمل إنه يرفض؛ الرفض ده هو نفسه اللي هيخليه يحترم رفض غيره."},{"m":"رجع من الحضانة بلعبة مش بتاعته وانت عديتها بضحكة — «معلش دي حاجة صغيرة» — الحاجة الصغيرة اللي عدت هي الدرس الكبير اللي وقع.","fix":"من غير كلمة «سرقة» ولا مشهد: «دي بتاعة مين؟ مش بتاعتنا — بكره نوديها للميس وانت اللي هتسلمها بإيدك»."},{"m":"انت نفسك بتاخد «الصغير المسموح» قدامه — بتدوق عنبة في السوبرماركت قبل الوزن، أو بتجيب أقلام الشغل البيت — وهو عينه عليك مش على كلامك.","fix":"قدامه بالذات خلي القاعدة صارمة عليك انت: «دي لسه متدفعتش — نستنى لما نحاسب». الدرس اللي بيتشاف أقوى من اللي بيتقال."}],"adapt":[{"kid":"العنيد","how":"أمر «رجّع اللعبة حالًا» بيخليه يقبض عليها أكتر. حوّل الترجيع من أمر لبطولة: «صاحبها أكيد بيدور عليها دلوقتي — انت اللي هتوصلهاله»، وسيبه يختار امتى النهارده: قبل الغدا ولا بعده. القرار الصغير ده بيفك القبضة."},{"kid":"الخجول","how":"التسليم بالإيد — للميس أو للكاشير — هو أصعب حتة عليه، فبتقع منه الخطوة الأهم. متسلمش بداله: اتقاسموا الدور — انت تفتح الكلام «لقينا دي على الأرض» وهو يمد إيده بالحاجة بس. ومع كل مرة وسّع حتته كلمة كلمة."},{"kid":"الحساس","how":"أول ما يفهم إن اللعبة اللي جابها لازم ترجع، بيحس إنه عمل حاجة وحشة وبيعيط. افصل بوضوح: «انت مش عملت حاجة وحشة — اللعبة بس بيتها مش عندنا وإحنا بنوصلها». وبعد التسليم سمّي الفعل: «رجّعتها بإيدك — دي الأمانة»."}]},
{"name":"الشكر والامتنان","cat":"دين وأخلاق","age":[3,12],"how":"سؤال ثابت يومي بيحوّل الامتنان لعادة عقلية: «أحلى 3 حاجات النهارده؟».","steps":[{"t":"سمّي النعمة وقت حصولها","d":"الحمد لله المرسلة بتعدي من غير أثر — الشكر المسمّى هو اللي بيثبت. على السفرة قول بصوت مسموع: «الحمد لله على الفراخ دي — كنت جعان أوي»، وفي العربية في عز الحر: «الحمد لله على التكييف ده». طفلك هيقلد الصيغة دي في كلامه قبل ما يفهمها بالكامل — وده المطلوب.","say":"الحمد لله على الأكل ده — كان لذيذ وشبعت."},{"t":"النعمة وراها ناس تعبت","d":"امسك رغيف العيش على الفطار واسأله: «العيش ده جه منين؟» وارجعوا بالسلسلة سوا: الفرّان اللي خبزه، السواق اللي وصّله للمحل، الفلاح اللي زرع القمح، وربنا اللي طلّعه من الأرض. كررها مع اللبن والموز في أيام تانية — لما يعرف إن ورا كل لقمة ناس تعبت، «الحمد لله» بتاخد معنى.","say":"ناس كتير تعبت عشان اللقمة دي توصلنا — الحمد لله."},{"t":"أحلى 3 حاجات قبل النوم","d":"بعد الحدوتة وقبل الدعاء، سؤال ثابت كل ليلة: «إيه أحلى 3 حاجات حصلت النهارده؟». ابدأ انت بإجابتك — «أحلى حاجة عندي إننا لعبنا سوا بعد المغرب» — عشان يشوف إن الإجابات حاجات صغيرة حقيقية مش عجايب. لو قال حاجة واحدة بس، كفاية — المهم إن السؤال ييجي كل ليلة من غير فوات.","say":"إيه أحلى حاجة حصلت في يومك النهارده؟"},{"t":"حتى اليوم الصعب فيه حاجة حلوة","d":"لما يرجع من الحضانة متضايق — وقع في الجنينة أو صاحبه خطف لعبته — احتوي زعله الأول وسمّيه، ومتستعجلش. بعد ما يهدى خالص، مش قبلها، دوروا سوا: «اليوم كان صعب فعلًا… طب فيه حاجة واحدة حلوة حصلت فيه؟». دي أعلى درجات الامتنان: يلاقي النعمة وسط الضيق.","say":"اليوم كان صعب، بس تعالى ندوّر على حاجة حلوة واحدة فيه."}],"mastery":"بيحكي حاجة حلوة حصلت في يومه لما تسأله — ومرات من غير ما تسأل.","acts":[{"t":"برطمان النعم","mat":"برطمان فاضي + ورق ملوّن مقصوص حتت صغيرة + أقلام","prep":"حطوا البرطمان في مكان ثابت في المطبخ، واتفقوا إن وقته كل يوم بعد المغرب.","run":"كل يوم يرسم حاجة حلوة حصلت في يومه — أو يقولها وانت ترسمها له — ويطبق الورقة ويحطها في البرطمان بإيده. يوم الجمعة افتحوه وقلّبوا في الأوراق سوا، وقول له: «بص كل النعم دي في أسبوع واحد — الحمد لله»."},{"t":"رحلة العيش من الأرض للسفرة","mat":"رغيف عيش من سفرتكم — بس","prep":"على الفطار، حط الرغيف في نص السفرة وقول: «نلعب رحلة العيش؟».","run":"مثّلوا الرحلة بالعكس: هو الفرّان بيعجن ويخبز، وانت السواق بتوصّل، وبعدين هو الفلاح بيزرع ويستنى. في الآخر ارفعوا إيديكم وقولوا سوا: «وكل ده بدأ بحبة قمح طلّعها ربنا من الأرض». نفس اللعبة تنفع مع اللبن والبيض في أيام تانية."}],"say":"أحلى حاجة حصلت النهارده إيه؟","deen":["الحمد على الرزق","النبي ﷺ قال إن ربنا بيرضى عن العبد لما ياكل الأكلة ويحمده عليها — رواه مسلم. خلّي الحمد حسّي مش نظري: على السفرة شاور على الأكل نفسه واسأله: «مين رزقنا العيش ده؟ جه منين؟» — واتتبعوا الرحلة سوا لحد ما توصلوا لربنا. واحمد انت بصوت مسموع وابتسامة حقيقية بعد كل أكلة — «الحمد لله» اللي بيسمعها منك مبسوطة بتتحفظ أعمق من مية تلقينة."],"skill":"العناية بنبتة: نبتة صغيرة على شباك المطبخ سقيها شغلانته كل يوم بعد الفطار — رعاية يومية بتعلّمه إن النعمة بتتصان بمجهود، مش بس بتتاخد.","lvl":2,"ord":5,"tag":"التعاطف والمساعدة","src":[["قصة · عصافير مميز","يوم مليء بالخير","https://3asafeer.com/ar/read/78/يوم-مليء-بالخير"],["قصة · عصافير مميز","نصف الكأس","https://3asafeer.com/ar/read/273/نصف-الكأس"]],"mistakes":[{"m":"بتحوّل الشكر لتلقين قدام الناس — «قول شكرًا لطنط! هو أنا مسمعتش شكرًا؟» — الكلمة بتطلع بالعافية والإحساس اللي وراها بيموت، والموقف بيتحول كسوف.","fix":"اشكر انت بصوت مسموع قدامه واستنى — ولو فاتته، فكّره بعدين على انفراد: «طنط عملتلك عصير امبارح — نقولها إيه لما نشوفها؟»."},{"m":"بتستخدم الامتنان سلاح ضد زعله — «في أطفال ملهمش لعب أصلًا وانت زعلان على عربية؟!» — كده الحمد لله بقت كلمة بتتقال عشان تسكته، وهيكرهها.","fix":"المشاعر الأول: سمّي زعله واحتويه، وسؤال «فيه حاجة حلوة؟» ييجي بعد ما يهدى خالص — مش بدال الاحتواء."},{"m":"الشكر عندك مربوط بالحاجات الكبيرة بس — رحلة، لعبة جديدة، مطعم — فبيتعلم إن العادي مش نعمة وإن الامتنان محتاج فلوس.","fix":"اشكر قدامه على الصغير المتكرر: المية الساقعة في الحر، إن بابا رجع بالسلامة، الفول الصبح — الامتنان اللي بيتبني على العادي هو اللي بيعيش."}],"adapt":[{"kid":"العنيد","how":"التلقين المباشر — «قول الحمد لله» — بيقفله. بطّل تلقين وزوّد نمذجة: قولها انت عن نفسك بصوت مسموع وسيبه، وفي سؤال الليل اديله الدفة: «تحب تبدأ انت ولا أبدأ أنا النهارده؟» — اللي بيختار بيشارك."},{"kid":"الحساس","how":"في اليوم الوحش، سؤال «طب فيه حاجة حلوة؟» وهو لسه متضايق بيوصله إن زعله مرفوض. معاه بالذات طوّل مرحلة الاحتواء: اقعد مع زعله لآخره، وممكن تأجل سؤال الحاجة الحلوة ليوم تاني خالص — الامتنان بيطلع من قلب متطمن، مش من قلب بيتدافع."},{"kid":"كثير الحركة","how":"طقس الليل الكلامي الطويل بيفلت منه بعد أول إجابة. خليه قصير ومحسوس: تلات صوابع مفرودة بيطويهم واحد واحد مع كل حاجة حلوة — وخلص. أو انقل السؤال لوقت حركة أصلًا: في العربية وانتو رايحين الحضانة الصبح."}]},
{"name":"الرفق بالحيوان والبيئة","cat":"دين وأخلاق","age":[4,12],"how":"مسؤولية حقيقية متكررة عن كائن حي — ده بيعلّم الرحمة أكتر من مية قصة.","steps":[{"t":"نلمس بإيد هادية","d":"أول ما تقابلوا قطة عند مدخل العمارة، ورّيه بإيدك انت الأول: إيد مفتوحة بطيئة على ضهرها، مش شدّ في ديلها ولا جري وراها. واقروا لغتها سوا: «شايف ودانها راجعة لورا؟ دي خايفة — نبعد شوية ونسيبها». الرفق بيبدأ من إنه يفهم إن الحيوان بيحس ويخاف زيه بالظبط.","say":"إيد هادية ومفتوحة — القطة بتحس وبتخاف زيك."},{"t":"لحظة القسوة درس مش فضيحة","d":"هييجي يوم تشوفه بيجري ورا الحمام عشان يطيّره، أو بيدوس على نملة، أو شد ديل قطة — إيده بتجرب، مش بتقصد الأذى غالبًا. امسك إيده بهدوء من غير خضة، انزل لمستواه، وسمّي إحساس الكائن مش صفة طفلك: «النملة دي عايشة وبتتوجع». من غير «انت قاسي!» ولا صريخ قدام الناس. وبعدها حوّل الفضول لمراقبة: «تعالى نتفرج عليها ماشية لحد بيتها».","say":"دي بتتوجع زيك ما بتتوجع — إيدنا متأذيش حاجة عايشة."},{"t":"كائن حي مسؤوليته هو","d":"اختار كائن حي واحد يبقى مسؤوليته هو — مش انت. في حر الصيف هنا: طبق مية لقطط الشارع عند مدخل العمارة بعد إذن البواب، هو اللي يشيل الازازة ويملاه كل يوم بعد الفطار. أو بذرة فول في كوباية زبادي على قطن مبلول في الشباك، يبص عليها كل صبح ويرشها لما القطن ينشف. لو نسي، فكّره بسؤال مش بلوم: «مين مستني ميته النهارده؟» — ولو النبتة نشفت، اتكلموا فيها بهدوء وازرعوا غيرها: ده كمان درس.","say":"فيه كائن عايش مستنيك النهارده — دي شغلانتك انت."},{"t":"الأرض أمانة في كل مكان","d":"عمّم الرفق من الحيوان للبيئة كلها بقواعد صغيرة ثابتة: نقفل الحنفية وإحنا بنغسل سنانّا، نطفي نور الأوضة اللي خرجنا منها، والعلبة الفاضية تفضل في إيدنا لحد أقرب سلة حتى في الحديقة. ولما يعملها لوحده، صف الفعل بالظبط: «انت قفلت الحنفية من غير ما حد يقولك».","say":"الأرض دي أمانة عندنا — منوسخهاش ومنضيعش خيرها."}],"mastery":"بيتعامل بهدوء مع الحيوانات ومبيرميش حاجة في الأرض — من نفسه.","acts":[{"t":"طبق المية اليومي للقطط","mat":"طبق بلاستيك قديم + ازازة مية","prep":"اختاروا سوا مكان في الظل — عند مدخل العمارة أو في البلكونة — وخلّوا الميعاد ثابت: كل يوم بعد الفطار.","run":"انزلوا سوا وهو اللي يملى الطبق بإيده، وفي اليوم اللي بعده لاحظوا سوا: المية قلّت؟ يبقى حد شرب. وقول له: «إحنا مش شايفين القطة وهي بتشرب، بس هي لقيت المية — إحنا بنرحمها وربنا بيحب اللي بيرحم»."},{"t":"مزرعة كوباية الزبادي","mat":"كوباية زبادي فاضية + قطن + حبتين فول أو حمص من المطبخ + ورقة وقلم","prep":"هو يفرش القطن ويبلّه ويحط الفول بإيده، وحطوا الكوباية في الشباك وعلّقوا جنبها الورقة.","run":"مهمته اليومية يسقيها نقط مية ويرسم علامة في الورقة عن كل يوم سقاها فيه. أول ما تطرح ورقة خضرا قول له: «شوف الرعاية بتعمل إيه — انت اللي خليتها تكبر»."}],"say":"الرحمة بتوصلنا رحمة.","deen":["الرحمة والسقيا","احكيله حديث الكلب العطشان ببساطة: «راجل شاف كلب عطشان أوي، نزل ملاه مية وسقاه — فربنا شكر له وغفر له» (رواه البخاري ومسلم). وبعد الحدوتة اربطها بفعل إيده هو: طبق مية القطط اللي بيملاه كل يوم هو نفس الفعل اللي ربنا حبه في الحديث. وكرر الجملة الجامعة في لحظة الفعل نفسها مش بعيد عنها: «اللي بيرحم، ربنا بيرحمه»."],"skill":"رعاية كائن حي: طبق مية القطط أو نبتة الشباك مسؤوليته اليومية — بيتعلم إن فيه كائن محتاجه فعلًا كل يوم، مش لعبة بيسيبها لما يزهق.","lvl":2,"ord":15,"tag":"الرفق والبيئة","src":[["مطبوعة","رسومات الرفق بالحيوان","https://www.belarabyapps.com/%d8%b1%d8%b3%d9%88%d9%85%d8%a7%d8%aa-%d8%b9%d9%86-%d8%a7%d9%84%d8%b1%d9%81%d9%82-%d8%a8%d8%a7%d9%84%d8%ad%d9%8a%d9%88%d8%a7%d9%86/"],["قصة · عصافير مميز","في بيتنا قطة","https://3asafeer.com/ar/read/1531/في-بيتنا-قطة"],["قصة · عصافير مميز","متجر الحيوانات الأليفة","https://3asafeer.com/ar/read/228/متجر-الحيوانات-الأليفة"]],"mistakes":[{"m":"كل ما قطة تقرب بتشده وبتزعق — «ابعد! دي هتعضك!» — بتزرع خوف مش رفق: الطفل اللي اتعلم إن كل الحيوانات خطر مش هيرحمها، ممكن كمان يرميها بالحجر عشان يحمي نفسه.","fix":"علّم قواعد الأمان بهدوء بدل الرعب: منقربش لحيوان منعرفوش، نسأل صاحبه الأول، ونقرا لغة جسمه — وانت اللي تقرّب الأول قدامه."},{"m":"بتضحك وبتصوّر وهو بيجري ورا الحمام في الحديقة — المنظر ظريف، بس اللي اتعلمه إن تخويف الكائنات لعبة بتضحّك بابا.","fix":"نفس الحماس وجّهه للمراقبة: «مين يقدر يعد الحمامات من غير ما يطيّرهم؟» — الهدوء ممكن يبقى لعبة برضه."},{"m":"طبق المية والنبتة بيتحولوا شغلانتك انت بعد أسبوع — بتملا وترش من وراه عشان «المهم القطط تشرب» — فالمسؤولية بقت ديكور اسمه عليها بس.","fix":"لو نسي، السؤال مش التنفيذ: «مين مستني ميته النهارده؟» واستنى هو اللي يقوم — ولو النبتة نشفت سيبها تنشف: درس النشفان بهدوء أنفع من رعاية مزيفة باسمه."}],"adapt":[{"kid":"كثير الحركة","how":"إيده أسرع من نيته — بيحضن القطة لحد ما تخربشه وبيرش النبتة لحد ما يغرقها. اديله الأدوار الحركية: هو اللي يجري يجيب الازازة ويشيل الطبق، وخلي اللمس بقاعدة عدّية: «صباع واحد، تلات مسحات، ونرفع إيدنا» — العيار بيتعلم بالعد."},{"kid":"الخجول","how":"خايف يقرب من الحيوانات أصلًا، فدرس اللمس مش هيبدأ منه. ابدأ من مسافة أمان: يملا الطبق والقطة مش موجودة، يرمي الأكل من بعيد، يتفرج عليك وانت بتقرّب — ومن غير «متخافش دي مش بتعمل حاجة» ولا استعجال: القرب بييجي لما الأمان يثبت."},{"kid":"الحساس","how":"لو النبتة نشفت أو لقيتوا عصفورة واقعة، ممكن يتهد ويفضل شايل إنه السبب. متكدبش عليه («العصفورة نايمة») — سمّي الحقيقة ببساطة وحوّل الحزن لفعل: تدفنوها سوا تحت الشجرة، تزرعوا بذرة جديدة تاني يوم. الفعل هو اللي بينقل الحساسية من وجع لرحمة."}]},
{"name":"المسؤولية","cat":"دين وأخلاق","age":[3,12],"how":"مهمة واحدة ثابتة ليها اسم ووقت، والنتيجة الوحشة مقبولة. لو صلّحت وراه هتفقد المعنى.","steps":[{"t":"شغلانة ليها اسم ووقت","d":"اختار مهمة واحدة حقيقية ثابتة وسمّيها باسمه: «انت مسؤول المية على السفرة» — قبل الغدا كل يوم، هو اللي يحط ازازة المية والأكواب. متغيّرش المهمة كل يوم، ومتعملهاش بداله لو اتأخر — فكّره بجملة واحدة واستنى، حتى لو الغدا اتأخر دقيقتين.","say":"السفرة مستنية مسؤول المية — ده انت."},{"t":"حاجته ترجع مكانها بإيده","d":"أول ما يدخل من الحضانة وقبل أي لعب: الجزمة على الرف الواطي، وشنطة الحضانة على الشماعة اللي في مستوى إيده. واقبل النتيجة مش المثالية: لو الجزمة اتحطت معووجة سيبها معووجة — لو ظبطتها وراه بتقول له إن شغله مبيتحسبش، وهيبطّل يعمله.","say":"الشنطة على الشماعة والجزمة على الرف — وبعدين العب براحتك."},{"t":"الدلق مش مصيبة — هو يمسح","d":"لما يدلق كوباية العصير، أول رد فعل منك بيحدد هيتعلم إيه: الزعيق بيعلّمه يستخبى ويكدب، والهدوء بيعلّمه يتصرف. خلّي فوطة صغيرة في مكان ثابت واطي يعرفه، وقول جملة واحدة: «العصير اتدلق — الفوطة في مكانها». لو الدلقة كبيرة كمّل معاه، بس متاخدش المهمة منه.","say":"مش مشكلة — هات الفوطة وامسحه، وأنا معاك لو احتجتني."},{"t":"المسؤولية بره البيت","d":"وسّع الدايرة من البيت للعالم: في السوبرماركت بعد ما تفضّوا العربية، هو اللي يرجّعها مكانها وانت ماشي جنبه. في الحديقة قبل ما تمشوا، هو اللي يلف يلم لعبه في الشنطة — مش انت بتلم وهو بيجري. وفي بيت تيتة نفس قاعدة البيت شغالة: اللي لعب بيه بيرجع مكانه. المسؤولية اللي بتشتغل في مكان واحد بس لسه متبنتش.","say":"العربية دي إحنا خدناها — وإحنا اللي بنرجّعها."},{"t":"شيل مسؤوليتك قدامه بصوت عالي","d":"خليه يسمعك وانت بتتحمل غلطتك: «أنا نسيت أنزل الزبالة — هنزلها دلوقتي» بدل ما تلوم ماما أو الزحمة. ولما تغلط في حقه هو — وعدته ونسيت — سمّيها زي ما بتطلب منه بالظبط: «دي غلطتي أنا، وأنا اللي هصلّحها». الطفل بيتعلم شيل المسؤولية من مشهد الكبير اللي بيقول «أنا غلطت» من غير ما الدنيا توقع.","say":"أنا نسيت، وأنا اللي هصلّحها — كل واحد مسؤول عن حاجته."}],"mastery":"بيرجّع حاجته مكانها (شنطة، جزمة، كوباية) من غير تذكير معظم الأيام.","acts":[{"t":"لوحة «شغلانتي» بالمشبك","mat":"ورقة + قلم + مشبك غسيل ملوّن + سلوتيب","prep":"اقسم الورقة نصين مكتوب عليهم «لسه» و«خلصت»، وارسموا عليها سوا رمز مهمته اليومية (ازازة المية)، وعلّقوها على التلاجة في مستوى نظره.","run":"كل يوم بعد ما يخلص مهمته، هو اللي ينقل المشبك بإيده من «لسه» لـ«خلصت» — النقلة دي نفسها هي المكافأة. وقول له أول مرة: «المشبك ده محدش بينقله غيرك — دي شغلانتك انت»."},{"t":"تدريب المسح قبل الدلقة الحقيقية","mat":"شوية مية + فوطة المطبخ","prep":"اختار وقت هادي على ترابيزة المطبخ — التدريب بيحصل قبل الدلقة الحقيقية مش وقتها.","run":"اسكب شوية مية مقصود وقول له: «تعالى نتعلم نمسح»، وورّيه الخطوات واحدة واحدة: نجيب الفوطة من مكانها، نمسح من بره لجوه، نعصرها في الحوض، نرجّعها مكانها — وبعدين خليه يعيدها لوحده من الأول للآخر. لما الدلقة الحقيقية تحصل هيبقى عارف يعمل إيه بالظبط — قول له وقتها: «انت متدرّب على دي»."}],"say":"دي شغلانتك انت.","deen":["الله جميل يحب الجمال","النبي ﷺ قال: «إن الله جميل يحب الجمال» — رواه مسلم. استخدمها في لحظة الفعل الحلو مش كأمر قبله: لما يرجّع لعبته مكانها أو ينقل طبقه قوله: «شوف المكان بقى جميل — وربنا بيحب الجمال». وخد بالك من الاتجاه العكسي: الكركبة عمرها ما تتربط بزعل ربنا ولا بالعقاب — الترتيب عبادة صغيرة بتتعمل بحب، ولو اتربطت بالخوف بقت شغلانة تقيلة بيهرب منها. وقدوتك أبلغ من كلامك: سمّي مسؤوليتك قدامه بصوت عالي: «أنا بشيل طبقي دلوقتي عشان دي شغلانتي»."],"skill":"خدمة نفسه على السفرة: يسكب المية في كوبايته من زجاجة صغيرة وينقل طبقه للحوض بعد الأكل — مهمتين يوميتين بيقولوله: حاجتك انت مسؤول عنها.","lvl":2,"ord":7,"tag":"المسؤولية والنظام","src":[["قصة · عصافير مميز","أعد أغراضك يا كرم","https://3asafeer.com/ar/read/195/أعد-أغراضك-يا-كرم"],["قصة · عصافير مميز","متى سترتب غرفتك؟","https://3asafeer.com/ar/read/341/متى-سترتب-غرفتك؟"]],"mistakes":[{"m":"بتظبط شغله وراه — بتعدل الجزمة المعووجة وترص الأكواب من تاني «على السريع» — الرسالة اللي وصلته: شغلك بروفة، والشغل الحقيقي بتاع ماما وبابا.","fix":"اقبل النتيجة الناقصة كاملة: جزمة معووجة على الرف أحسن من جزمة مظبوطة بإيدك. ولو حاجة لازم تتعدل، عدلها بعيد عن عينه."},{"m":"أول ما بتستعجل بتسحب المهمة — «سيبك انت، هتأخرنا! أنا هحط المية» — المهمة اللي بتتسحب وقت الجد، هو فاهم إنها لعبة مش مسؤولية بجد.","fix":"الاستعجال يتحل بالتبكير: نادي «مسؤول المية» بدري. ولو الوقت فات فعلًا قولها صريحة: «النهارده أنا هعملها بالنيابة عنك، وبكره ترجع لك» — المهمة لسه باسمه."},{"m":"بتربط المهمة بمكافأة — «لو حطيت المية هتاخد بسكوتة» — المسؤولية بقت صفقة، وأول يوم من غير بسكوتة هيسألك: «طب هاخد إيه؟».","fix":"المقابل الوحيد هو الوصف والمكانة: «السفرة كملت عشان مسؤول المية عمل شغله» — الانتماء للبيت هو الأجر."}],"adapt":[{"kid":"كثير الحركة","how":"مش بيتهرب من المهمة — بينساها: دماغه بتتخطف في نص السكة. اربط المهمة بمحطة محسوسة مش بساعة: «أول ما نغسل إيدينا قبل الغدا → المية»، وحط رسمة ازازة على باب التلاجة تفكّره بدل صوتك — التذكير الجاي من البيئة مبيتقاومش زي التذكير الجاي منك."},{"kid":"العنيد","how":"المهمة اللي نزلت عليه أمر هيرفضها أول يوم مزاجه يبقى وحش. خليه شريك في تأسيسها: يختار مهمته من اختيارين — «المية ولا المعالق؟» — ويختار لقبه بنفسه: «مسؤول» ولا «كابتن». اللي هو أسسه بإيده صعب يضرب عنه."},{"kid":"الحساس","how":"أول غلطة في مهمته — الازازة وقعت على السفرة — ممكن تكسره ويقول «أنا مش عارف، متبقاش شغلانتي». افصل الغلطة عن الأهلية: «الدلق بيحصل لأي مسؤول — والمسؤول هو اللي بيمسح ويكمّل». واحكيله عن غلطة غلطتها انت في شغلك وصلحتها — الكبار بيغلطوا وبيكمّلوا."}]},
{"name":"النظام والنظافة","cat":"دين وأخلاق","age":[4,12],"how":"البيئة بتعلّم: مكان واضح بصورة لكل حاجة، ووقت ترتيب قصير ثابت.","steps":[{"t":"لكل حاجة بيت بصورة","d":"النظام مش أوامر — النظام بيئة مجهزة. اقعدوا سوا وقسّموا اللعب على سلال: سلة العربيات، سلة المكعبات، سلة العرايس، وهو اللي يلزق على كل سلة صورة اللي جواها. من اللحظة دي «رتّب» بقت جملة واضحة ليها خطوات: كل حاجة تروح للسلة اللي عليها صورتها.","say":"كل لعبة ليها بيت — العربيات بيتها فين؟"},{"t":"5 دقايق ترتيب بساعة الرمل","d":"اقلبوا ساعة رملية كبيرة (أو تايمر مطبخ برنّة ثابتة) وسمّوها «وقت الترتيب»: أول ما الرمل يتقلب بنبدأ نلم، ولما يخلص بنقف — حتى لو فاضل حتة مش متلمّة. الإشارة الثابتة دي، مش صوتك، هي اللي بتبدأ الترتيب وبتنهيه، وده اللي بيشيل المعركة من بينكم.","say":"الرملة اتقلبت — يلا نلم لحد ما الرمل يخلص."},{"t":"اللي بيقع بنمسحه — من غير مصيبة","d":"كوباية العصير اتدلقت — دي أهم لحظة في تعليم النضافة. لو زعقت، بيتعلم يستخبى ويخبي. بدل كده: فوطة صغيرة في مكان ثابت هو عارفه — دُرج تحت الحوض أو على السلم الصغير جنب البوتاجاز — وأول ما حاجة تقع جملة واحدة هادية: «العصير اتدلق — هات فوطتك». هو اللي يمسح، وانت تكمّل وراه لو محتاج من غير تعليق. اللي اتدلق مش غلطة بتتحاسب — ده حاجة بتحصل وليها تصرف.","say":"مفيش مشكلة — العصير بيتدلق. فوطتك فين؟"},{"t":"يغسل حاجته بنفسه","d":"كرسي صغير ثابت قدام حوض المطبخ، وبعد كوباية اللبن أو طبق البسكوت، هو اللي يشطفهم: مية، وحركة دايرية بإيده، وعلى المصفاة. الغسيل مش هيبقى مثالي — لو محتاج شطفة تانية اعملها بعدين من غير ما يشوفك، لأن اللي بيتحسب قدامه هو شغله هو.","say":"انت شربت في الكوباية — يبقى انت اللي بتغسلها."},{"t":"النضافة تخرج معانا بره","d":"عمّم القاعدة بره البيت: في الحديقة، علبة العصير الفاضية تتمسك في الإيد لحد أقرب سلة مهما كانت بعيدة — من غير نقاش. وابدأوا فرز بسيط: البلاستيك في كيس لوحده، وهو اللي يرميه في حاوية إعادة التدوير اللي تحت العمارة ويسمع صوته وهو نازل.","say":"مفيش حاجة بتتساب على الأرض — نشيلها لحد أقرب سلة."}],"mastery":"بيلم اللعب في مكانه بعد اللعب بتذكيرة واحدة.","acts":[{"t":"يوم تصوير السلال","mat":"سلال أو علب كرتون بعدد أنواع اللعب، وموبايلك للتصوير أو ورقة وألوان للرسم.","prep":"في وقت هادي، جهّزوا سلة لكل نوع لعب، وحددوا سوا مكان ثابت لكل سلة في الأوضة.","run":"هو يختار عربية واحدة تصوّرها بموبايلك أو يرسمها، وتلزقوا الصورة على سلة العربيات — وهكذا صورة لكل سلة لحد ما كل نوع يبقى له بيت بصورة. آخر النشاط اعملوا بروفة: بعتر 5 لعب على الأرض وقول له: «ورّيني كل واحدة بتروح لبيتها إزاي»."},{"t":"تايمر الترتيب الليلي","mat":"تايمر المطبخ أو تايمر الموبايل بجرس مسموع.","prep":"اتفقوا مرة واحدة إن قبل العشا كل يوم فيه «وقت الترتيب»: 4 دقايق بالتايمر — نفس الوقت كل ليلة ومبيتغيرش.","run":"شغّل التايمر من غير أي أوامر، وارتب انت معاه بجد مش بتمثيل. أول ما الجرس يرن وقّفوا وبصوا للأوضة سوا وقول له: «بص الأوضة شكلها إيه — انت رجّعت كل حاجة لبيتها»."}],"say":"كل حاجة ليها مكان.","deen":["الطهارة شطر الإيمان","خلّي الوضوء نفسه لعبة ترتيب: اتوضى قدامه وسمّي الخطوات بالترتيب — إيدين، بق، مناخير، وش — وسيبه يقلدك خطوة بخطوة من غير تصحيح متشدد. ولما يلم لعبه أو يغسل إيده، اربطها بالمعنى بجملة واحدة: النبي ﷺ قال «الطُّهور شطر الإيمان» — رواه مسلم — يعني النضافة دي نص الإيمان، مش شغلة بيت وبس. التكرار الهادي ده بيخلي النظام والنضافة عنده عبادة صغيرة بيحبها، مش أوامر بيهرب منها."],"skill":"ترتيب المكان: يرجّع كل لعبة لسلتها بعد ما يخلص لعب من غير ما حد يقف على دماغه — نفس المهارة اللي بتتطلب منه في الحضانة لما المس تعلن وقت الترتيب.","lvl":2,"ord":8,"tag":"المسؤولية والنظام","src":[["قصة · مجاني","الوحش المرتّب","https://3asafeer.com/ar/read/223/الوحش-المرتب"],["قصة · عصافير مميز","يوم التنظيف","https://3asafeer.com/ar/read/1327/يوم-التنظيف"]],"mistakes":[{"m":"بترتب وراه بالليل بعد ما ينام، أو بتلم انت بسرعة لأنه بطيء — الرسالة اللي وصلته: «في حد تاني هيرتب».","fix":"استحمل البطء والسلة الغلط. العربية اللي راحت سلة المكعبات سيبها — النظام بتاعه هو، مش معرض بتاعك انت."},{"m":"الترتيب بقى عقوبة: «مش هتتفرج غير لما تلم الأوضة» بنبرة زعل — فالترتيب اترتبط في دماغه بالخنقة وبقى بيكرهه.","fix":"الترتيب معاد ثابت بساعة الرمل زي الأكل والنوم — بييجي كل يوم، اليوم الحلو واليوم الوحش، ومش مربوط بأي عقاب ولا مكافأة."},{"m":"اللعب أكتر من النظام: 50 لعبة برة مفيش سلال تلمها — الفوضى مضمونة والفشل مضمون مهما رتب.","fix":"قسّم اللعب: شوية ظاهرين وشوية متخزنين فوق الدولاب، وبدّلهم كل أسبوعين. القليل اللي ليه بيت بيترتب — الكتير اللي ملوش بيت مستحيل."}],"adapt":[{"kid":"كثير الحركة","how":"الترتيب كقعدة هادية مش هيحصل — حوّله حركة: «مين يوصّل العربيات لبيتها قبل ما أعدّ للعشرة؟» ومهمة واحدة كل مرة (سلة واحدة بس)، مش «رتب الأوضة» كلها مرة واحدة."},{"kid":"العنيد","how":"لو حس إن النظام نظامك انت هيقاومه — خليه هو اللي قسّم السلال ولزق الصور من أول يوم، ووقت الترتيب اديله اختيار جوه القاعدة: «تبدأ بالمكعبات ولا العرايس؟». اللي بيدافع عن نظامه هو مش بيكسره."},{"kid":"الحساس","how":"البرج اللي بقاله يومين بيتبني مش «كركبة» — لو لميته هيتجرح بجد. اعملوا «ركن الشغل الشغال» متفق عليه: اللي لسه بيتبني بيقعد فيه ومبيتلمش، والباقي بيروح لبيوته. وقبل الساعة الرمل."}]},
{"name":"بر الوالدين","cat":"دين وأخلاق","age":[4,12],"how":"90% قدوة: هو بيشوفك بتعامل أهلك إزاي. والباقي مواقف صغيرة تخطط لها.","steps":[{"t":"بيشوفك بتبر أهلك انت","d":"البر مبيتشرحش — بيتشاف. خلّي طفلك جنبك وانت بتكلم تيتة وجدو في مصر: بيسمعك بتقول «حاضر يا ماما» بصوت هادي، بتسأل على الدوا والصحة، وبتقفل بـ«وحشتوني». وبعد المكالمة سمّي اللي حصل: «أنا بطمّن على تيتة كل شوية — دي مامتي وليها حق عليّا».","say":"شفتني وأنا بكلم تيتة؟ دي مامتي — بسمع كلامها وبطمّن عليها على طول."},{"t":"الطلب بذوق — من الطرفين","d":"البر في السن ده بيبدأ من إزاي بيكلمكم. لما يزعق «هاتي مية!» متجيبش المية ومتزعقش برضه — قول الصيغة بهدوء واستنى: «ممكن مية يا ماما لو سمحتي». وأول ما يقولها بأي شكل، هات المية على طول وبفرحة — عشان يحس إن الكلمة الحلوة بتفتح الأبواب أسرع من الزعيق. ونفس القاعدة عليك انت: بتقول له «لو سمحت» و«شكرًا» لما تطلب منه حاجة.","say":"قولها بالطريقة الحلوة — ممكن يا ماما؟ — وأنا أجيبها لك طيارة."},{"t":"مهمة أسبوعية تفرّح ماما أو بابا","d":"كل أسبوع يختار هو حاجة صغيرة يعملها مخصوص عشان يفرّح ماما أو بابا: يجيب كوباية مية لبابا أول ما يوصل من الشغل، يشيل الكيس الخفيف من عربية السوبرماركت، يرص المخدات على الكنبة قبل ما تقعدوا. الشرط الوحيد إن النية تتقال بصوت عالي: «دي عشان ماما».","say":"نعمل إيه الأسبوع ده يفرّح ماما؟ اختار انت."},{"t":"نلاحظ جميل بعض بصوت عالي","d":"على سفرة العشا، لعبة قصيرة: كل واحد يقول حاجة حلوة عملها له حد من العيلة النهارده — «ماما عملتلي الساندوتش اللي بحبه»، «وانت جبتلي الشبشب من غير ما أطلب». لما يتعوّد يشوف اللي بيتعمله عشانه ويسمّيه، بر أهله بيبقى عادة يومية مش مناسبات.","say":"مين عمل لك حاجة حلوة النهارده؟ احكيلنا عليها."},{"t":"يدعي لكم بكلامه هو","d":"قبل النوم، علّمه «ربِّ ارحمهما كما ربياني صغيرًا» بالتقسيط على كام ليلة — وبعدها خليه يترجمها بكلامه: «يا رب خلي بابا وماما بخير». الدعاء بكلامه هو اللي بيربط قلبه بيكم، مش الحفظ لوحده. وادعي انت لأهلك قدامه بنفس الطريقة عشان يشوف السلسلة كاملة.","say":"ادعي لماما وبابا بكلامك انت — قول اللي في قلبك."}],"mastery":"بيعمل حاجات «عشان ماما وبابا» من نفسه وبيفرح بيها.","acts":[{"t":"مفاجأة الأسبوع لماما أو بابا","mat":"ورقة وألوان، أو طبق وشوية تمر من المطبخ.","prep":"اتفق معاه في السر على مفاجأة الأسبوع: هو اللي يختارها — رسمة ولا طبق تمر — وجهّزوها بعيد عن عين ماما أو بابا.","run":"يستخبى بالرسمة ورا ضهره ويطلّعها لماما فجأة، أو يرص التمر في الطبق ويقدّمه لبابا أول ما يدخل من الباب. علّمه جملة التقديم — هي اللي بتثبت القيمة: «دي عشانك انت مخصوص»."},{"t":"لعبة الأدوار المقلوبة","mat":"من غير مواد.","prep":"قبل النوم بشوية، اتفقوا تقلبوا الأدوار: هو يبقى «البابا» وانت الطفل.","run":"اطلب منه طلبات صغيرة بجد: «أنا عطشان… تجيبلي مية؟ تغطّيني؟ تحكيلي حدوتة؟» وسيبه يعتني بيك فعلًا. بعد اللعبة اقعدوا ثانية واسأله: «حسيت بإيه وانت بتخدمني؟ — أنا كمان ببقى فرحان كده لما تساعدني بجد»."}],"say":"ربِّ ارحمهما.","deen":["وبالوالدين إحسانًا","اديله مهمة يومية صغيرة «عشان ماما وبابا» — يجيب المية، يوصّل حاجة — وسمّيها بصوت مسموع: «ده بر الوالدين اللي ربنا بيحبه». واربطها بالآية من سورة الإسراء: «وبالوالدين إحسانًا» — ربنا وصّانا نحسن لماما وبابا. والأهم القدوة: خليه يشوفك بتتصل بجدوده وبتخدمهم، لأن البر اللي بيشوفه فيك هو اللي هيعمله معاك بكره. دايمًا بالفرحة والحضن، أبدًا مش بالواجب الثقيل."],"skill":"المساعدة والمبادرة: ينفّذ مهمة بيت يومية كاملة — يجيب ازازة المية للسفرة أو يوصّل حاجة لماما — من غير ما حد يعيد عليه، نفس المبادرة اللي بتظهر لما المس تطلب مساعد في الفصل.","lvl":2,"ord":12,"tag":"الأسرة","src":[["مجاني","بر الوالدين","https://www.belarabyapps.com/%d8%a7%d9%84%d8%b7%d9%81%d9%84-%d8%a7%d9%84%d9%85%d8%b3%d9%84%d9%85/%d8%a8%d8%b1-%d8%a7%d9%84%d9%88%d8%a7%d9%84%d8%af%d9%8a%d9%86/"],["قصة · عصافير مميز","ماما في غاية الروعة","https://3asafeer.com/ar/read/250/ماما-في-غاية-الروعة"],["قصة · عصافير مميز","كل شيء عن بابا","https://3asafeer.com/ar/read/303/كل-شيء-عن-بابا"]],"mistakes":[{"m":"بتحوّل البر لابتزاز عاطفي: «انت مش بتحبني» أو «ربنا بيزعل من اللي مبيسمعش كلام ماما» لما يرفض طلب — فالبر اترتبط عنده بالذنب والخوف مش بالحب.","fix":"الرفض بيتعامل معاه كموقف تربية عادي من غير سلاح الدين ولا الحب. البر بيتبني من القدوة والمهام الصغيرة اللي بيختارها — مش من التهديد بزعل حد."},{"m":"بتشتكي من أهلك انت قدامه: بتقفل السكة مع تيتة وتتنهد «أمي تعبتني بطلباتها» — فبيتعلم إن الوالدين لما بيكبروا بيبقوا عبء.","fix":"الشكوى من حقك — بس بعيد عن وداته. اللي بيوصل له عن جدوده بس: السؤال عليهم، والفرحة بصوتهم، و«ليهم حق علينا»."},{"m":"بتطلب منه الخدمات كأوامر ناشفة: «هات الريموت. شيل الطبق.» من غير نية مسماة — فبتتسجل عنده شغل بيتقال عليه، مش حاجة بيعملها عشان بيحب.","fix":"اربط الفعل بالنية بصوت عالي: «تعالى نعمل حاجة تفرّح بابا». النية المسماة هي الفرق بين الخدمة والبر."}],"adapt":[{"kid":"الخجول","how":"جولة «الجميل» على السفرة قدام الكل ممكن تعقده — ابدأها انتو الاتنين بس قبل النوم بصوت واطي، والدعاء نفسه ممكن يقوله همس في ودنك. لما يرتاح، انقلوها للسفرة."},{"kid":"العنيد","how":"أي مهمة «عشان ماما» لو وصلته كتكليف هيرفضها بالعند — اعرض اختيارين وهو اللي يقفل بينهم: «تجيب لبابا المية ولا الشبشب؟». القرار قراره، والمهمة اللي اختارها بنفسه بيخلصها."},{"kid":"كثير الحركة","how":"البر عنده أفعال مش قعدات كلام — المهام الحركية هي الباب: يجري يفتح الباب لبابا، يوصّل الموبايل لماما، يشيل الكيس. مهام قصيرة بتخلص بحركة، والقعدات الكلامية خليها أقصر ما يمكن."}]},
{"name":"صلة الرحم","cat":"دين وأخلاق","age":[4,12],"how":"روتين ثابت مش مناسبات: مكالمة أسبوعية في نفس اليوم، وهو اللي يبدأ.","steps":[{"t":"شجرة العيلة على الحيطة","d":"إحنا عايشين بعيد عن العيلة، فالعيلة لازم تبقى حاضرة بالصور: ورقة كبيرة عليها صور مطبوعة — تيتة وجدو في مصر، خالو، عمو، ولاد عمه — معلقة في أوضته في مستوى نظره. كل كام يوم قف قدامها معاه وشاور: «ده مين؟ ابن مين؟» لحد ما يعرف الأسامي كلها من غير مساعدة.","say":"دي عيلتنا — إحنا هنا وهما في مصر، بس إحنا مع بعض على طول."},{"t":"يوم المكالمة الثابت","d":"اختاروا يوم ووقت ثابتين — الجمعة بعد الغدا مثلًا — للفيديو كول مع تيتة وجدو، وعاملوه معاملة أي معاد مهم مبيتلغيش. الثبات هو اللي بيحوّل المكالمة من مجاملة لصلة: من يوم الخميس قول له «بكره يوم تيتة»، ووقت المعاد خليه هو اللي يدوس على زرار الاتصال بإيده.","say":"بكره يوم تيتة — تحب تحكيلها على إيه؟"},{"t":"هو اللي يحكي مش انت","d":"قبل المكالمة اتفقوا على حاجة واحدة هيحكيها: رحلة الحضانة، اللعبة الجديدة، سنّته اللي بتتحرك. وقت المكالمة اديله الموبايل وسيبه يتكلم — ولما تيتة تسأله متجاوبش بالنيابة عنه حتى لو سكت شوية، السكوت ده هو اللي بيدفعه يتكلم. الصلة بتبقى بتاعته هو لما صوته هو اللي بيوصل.","say":"احكي انت لتيتة — هي مستنية تسمعها منك انت."},{"t":"بوسطجي العيلة","d":"وسّع الدايرة من تيتة وجدو لباقي العيلة: مرة في الأسبوع يقف قدام شجرة العيلة ويختار حد — خالته، عمه، ابن عمه — ويبعت له حاجة بنفسه: فويس نوت بصوته، رسمة تصورها وتبعتها، فيديو ثواني وهو بيسلّم. كده بيتعلم إن الصلة عطاء بيبدأ مننا، مش بس استقبال.","say":"النهارده نبعت لمين من الشجرة؟ اختار وابعت له بصوتك."},{"t":"لما نتقابل بجد","d":"سفرية مصر في الأجازة، أو خالو لما يعدي على دبي — دي اللحظة اللي بتحوّل الوشوش اللي في الشاشة لناس بجد. قبلها بأسبوع ابدأ التجهيز: راجعوا على الشجرة مين اللي هنشوفهم، وخليه يختار حاجة صغيرة ياخدها معاه — رسمة لتيتة، كيس حلويات لولاد عمه. وأول ما توصلوا متستعجلش عليه: سيبه ياخد وقته ورا رجلك لحد ما يدفى — الوش اللي كان في التليفون محتاج شوية عشان يبقى حقيقي.","say":"فاضل 3 أيام ونشوف تيتة بجد — ناخد لها إيه معانا؟"}],"mastery":"بيسأل عن الجدود من نفسه («نكلم تيتة؟») وعارف أساميهم.","acts":[{"t":"نبني شجرة العيلة سوا","mat":"ورقة كبيرة أو ضهر كرتونة، صور مطبوعة للعيلة، صمغ وألوان.","prep":"اطبع صور أفراد العيلة، وارسم انت جذع شجرة بفروع فاضية على الورقة.","run":"هو اللي يلزق كل صورة في مكانها وانت بتحكيله عن كل واحد حكاية صغيرة حقيقية: «خالو كريم ده اللي كان بيشيلك وانت بيبي». علّقوها في أوضته واختم: «دي عيلتك — كلهم بيسألوا عليك»."},{"t":"صندوق بريد العيلة","mat":"علبة صغيرة، ألوان، وموبايلك للتصوير والإرسال.","prep":"هو يلوّن العلبة وتكتبوا عليها «بريد العيلة» وتتحط في أوضته.","run":"طول الأسبوع أي حاجة عايز يبعتها لحد — رسمة لتيتة، ورقة شجر حلوة لقاها لابن عمه — يحطها في الصندوق. يوم الجمعة تفتحوه سوا وتصوّروا كل حاجة وتبعتوها لصاحبها، وهو اللي يدوس زرار الإرسال. وبعدين ورّيه الرد: «شوف تيتة فرحت قد إيه لما وصلتها حاجتك»."}],"say":"مين اللي هنكلمه النهارده؟","deen":["صلة الرحم بركة في العمر والرزق","ثبّتوا مكالمة أسبوعية مع الجدود ليها يوم معروف، وطفلك هو اللي يدوس زرار الاتصال ويبدأ السلام بصوته. وبعد المكالمة قول له المعنى ببساطة: النبي ﷺ قال إن اللي بيوصل رحمه ربنا يبارك له في عمره ورزقه — حديث رواه البخاري. وخليه يشوفك انت بتسأل على خالاتك وأعمامك، لأن الصلة اللي بيشوفها عادة بيت هي اللي بتتورث. ولما يقول من نفسه «نكلم تيتة؟» افرح بيها قدامه — ده الزرع اللي طلع."],"skill":"آداب المكالمة: يبدأ مكالمة تيتة وجدو بالسلام ويسأل «عاملين إيه؟» ويستنى الرد — نفس مهارة الكلام في التليفون اللي هيحتاجها كل ما حد بعيد يسأل عليه.","lvl":3,"ord":9,"tag":"الأسرة","src":[["قصة · عصافير مميز","أربعة أيام في حديقة الجدة","https://3asafeer.com/ar/read/134/أربعة-أيام-في-حديقة-الجدة"],["قصة · عصافير مميز","قصة جدي","https://3asafeer.com/ar/read/330/قصة-جدي"]],"mistakes":[{"m":"«بوس عمك! احضن خالتك!» أول ما يشوفهم — الإجبار الجسدي بيخلي اللقاء العائلي حاجة بيخاف منها، والصلة بتتحول لإكراه.","fix":"اديله بدائل هو اللي يختار منها: سلام بالإيد، باي باي، ابتسامة من بعيد. الحضن هييجي لوحده لما يدفى — وساعتها هيبقى بتاعه هو."},{"m":"المكالمة بقت استجواب: تيتة بتسأل وانت واقف فوق دماغه «رد! قول لتيتة! سمّعها الأنشودة!» — فبقى يهرب كل ما الموبايل يرن.","fix":"حاجة واحدة متفق عليها قبل المكالمة هو عايز يحكيها، وممنوع التسميع. والمكالمة تقفل وهو لسه مبسوط — قصيرة ومشتهية أحسن من طويلة ومكروهة."},{"m":"العيلة بقت لجنة مقارنة: «شوف ابن خالتك بيحفظ إزاي» في نص المكالمة — فكل مكالمة بقت تهديد لصورته قدامكم، وكره الصلة نفسها.","fix":"ممنوع المقارنات في سياق العيلة نهائيًا. العيلة مكان بيتفرحوا بيه فيه — لو المقارنة موجودة، هو اللي هيقطع الصلة أول ما يقدر."}],"adapt":[{"kid":"الخجول","how":"الكاميرا المباشرة وعيون مستنياه عبء تقيل — ابدأ بفويس نوت بيسجلها براحته ويسمعها قبل ما تتبعت، أو خليه في المكالمة يوري حاجة في إيده (اللعبة، الرسمة) بدل ما يتكلم عن نفسه. الحاجة اللي في الإيد بتشيل نص التوتر."},{"kid":"كثير الحركة","how":"عشر دقايق قاعد قدام شاشة مش هتحصل — خلي المكالمة متحركة: هو اللي ماسك الموبايل وبياخد تيتة جولة في البيت «دي أوضتي، دي البلكونة». والمكالمة تخلص قبل ما يزهق، مش بعد ما يسيب الموبايل ويمشي."},{"kid":"الحساس","how":"هزار الكبار التقيل («هاكلك انا! انت مش بتحبني بقى؟») أو مكالمة اتقطعت فجأة ممكن يشيلهم جواه — بعد المكالمة سؤال واحد هادي: «إيه أحلى حاجة في المكالمة؟ في حاجة مضايقاك؟» ولو في حاجة، اشرحها ببساطة من غير ما تقلل من إحساسه."}]},
{"name":"إكرام الجار","cat":"دين وأخلاق","age":[4,12],"how":"أفعال محسوسة: طبق بإيده، وسلام بالاسم. المفهوم بيتبني من التكرار.","steps":[{"t":"نعرف جيرانا بأساميهم","d":"أول ما تقابلوا جار في الأسانسير أو على السلم، عرّف طفلك بيه قدامه: «ده عمو راشد جارنا اللي فوقنا على طول». وبالليل وانتو بتتعشوا اسأله: «مين الجار اللي قابلناه النهارده؟ ساكن فين؟». الجار اللي ليه اسم بيبقى شخص طفلك يهتم بيه، مش باب مقفول في الممر.","say":"ده جارنا عمو راشد — والجار ليه حق علينا"},{"t":"هو اللي يسلّم الأول","d":"قبل ما تفتحوا باب الشقة وتنزلوا، اتفقوا: «لو قابلنا جار في الأسانسير، انت اللي هتقول السلام عليكم الأول». ولما يعملها، صف الفعل بعدها بالظبط: «انت سلّمت على طنط أم خالد قبل ما تسلّم هي». لو اتكسف وسكت، متعلقش — سلّم انت قدامه وخلاص، المرة الجاية هيجرب.","say":"النهارده انت اللي هتسلّم الأول"},{"t":"نكرم الجار بالهدوء كمان","d":"في عمارة، أكبر إكرام للجار إنه يرتاح في بيته. اشرحها مرة واحدة بحاجة محسوسة: اقعدوا على أرضية الصالة وقول له «تحتنا بالظبط في أوضة زي دي ناس قاعدين، ولما بنجري وننط هما بيسمعوا الخبط فوق دماغهم». وبعدها قاعدة الليل: بعد المغرب الجري بيقف والنط من على الكنبة بيقف — مش عشان «عيب»، عشان «جيرانا بيريّحوا». ولو نسي وجري، جملة تذكير واحدة من غير زعيق.","say":"اللي تحتنا بيسمعونا — بعد المغرب رجلينا بتمشي مش بتجري"},{"t":"طبق يطلع بإيده هو","d":"أي أكلة بتعملها زيادة — صنية بسبوسة، شوربة، علبة تمر — خصص منها حتة للجيران وقول ده قدامه من أول التحضير. طفلك هو اللي يشيل الطبق، ويدوس الجرس، ويقول «ده من بيتنا» — انت واقف وراه بخطوة، مش بداله.","say":"انت اللي هتدّي الطبق وتقول: اتفضلوا، ده من بيتنا"},{"t":"نفتكر الجار من غير مناسبة","d":"خلي طفلك يسمعك بتفتكر الجار بصوت عالي: «عمو سامي بقاله كام يوم مش باين — ننزل نطمن عليه؟» أو «جارنا رجع من السفر، نعدي نسلم عليه». وبعدين ارمي السؤال له هو: «مين من جيرانا نعمل له حاجة حلوة الأسبوع ده؟» وخليه هو اللي يقترح.","say":"الجار بنسأل عليه من غير ما يكون فيه مناسبة"}],"mastery":"بيسلّم على الجيران وعارف إن ليهم حق علينا.","acts":[{"t":"طبق الجيران","mat":"طبق وأكلة أصلًا بتعملها النهارده — مهلبية، بسبوسة، حتى شوية بلح.","prep":"من أول التحضير قول قدامه «الحتة دي للجيران»، وخليه يساعد في تغطية الطبق.","run":"هو اللي يحمل الطبق لباب الجار، يدوس الجرس بنفسه، ويسلّمه بإيده — وانت وراه ساكت. قول له قبل الجرس: «انت صاحب الطبق — قول: اتفضلوا، ده علشانكم»."},{"t":"خريطة الجيران","mat":"ورقة كبيرة وألوان.","prep":"ارسموا باب شقتكم في نص الورقة، وحواليه أبواب الجيران — اللي فوق واللي تحت واللي قصادكم.","run":"اكتبوا سوا اسم كل جار تعرفوه، وحطوا علامة استفهام على اللي متعرفوش اسمه. المهمة المستمرة: كل ما تتعرفوا على جار جديد ترجعوا تكتبوا اسمه سوا في مكانه. اسأله كل فترة: «مين لسه معندوش اسم في الخريطة؟»."}],"say":"الجار ليه حق علينا.","deen":["ما زال جبريل يوصيني بالجار","خلّي طبق للجيران عادة شهرية ثابتة — وطفلك هو اللي يسلّمه بإيده ويقول «اتفضلوا». واحكي له وانتو بتجهّزوا إن النبي ﷺ قال إن جبريل فضل يوصّيه بالجار لحد ما افتكر إنه هيورّثه — حديث متفق عليه رواه البخاري ومسلم — يعني الجار عندنا قريب من القرايب. وخليه يسمعك بتسلّم على الجيران في الأسانسير وبتسأل عليهم — إكرام الجار بيتعلم بالمشاهدة قبل الكلام."],"skill":"آداب الزيارة: يخبط على الباب، يسلّم بصوت واضح، ويستأذن قبل ما يدخل — نفس التسلسل اللي هيستعمله على باب الجيران وباب أي فصل في المدرسة.","lvl":3,"ord":10,"tag":"الصداقة والجيرة","src":[["قصة · عصافير مميز","خيّاط الحي","https://3asafeer.com/ar/read/1336/خياط-الحي"],["قصة · عصافير مميز","من القادم الجديد","https://3asafeer.com/ar/read/578/من-القادم-الجديد"]],"mistakes":[{"m":"بتستخدم الجار للتخويف: «بطّل صوت هيجي عمو الجار يزعقلك» — فالجار بقى بعبع، وبعدين بتطلب منه يطلع له طبق ويسلم عليه؟","fix":"اسم الجار مايتقالش غير في سياق الخير: بنسلم عليه، بنطلع له طبق، بنطمن عليه. والهدوء سببه راحتهم — مش خوفنا منهم."},{"m":"بتنتقد الجيران قدامه: «دول رموا الزبالة قدام الباب تاني» — وبعدين بتستغرب إنه مش عايز يسلم عليهم.","fix":"ملاحظاتك على الجيران بينك وبين نفسك. اللي بيوصل وداته عنهم حاجة واحدة: إحنا هنعمل لهم إيه — مش هما عملوا إيه."},{"m":"بتصحّح له قدام الجار: سكت من الكسوف فقلت «قول السلام عليكو! معلش هو بيتكسف» — أهنته مرتين في موقف واحد، والمرة الجاية هيتخبى وراك.","fix":"لو سكت، سلّم انت عادي وكمّلوا — ولا كلمة قدام حد. في البيت بعدها احكوا الموقف من غير لوم: «المرة الجاية ممكن تجرب انت»."}],"adapt":[{"kid":"الخجول","how":"«سلّم الأول» على راجل غريب هدف بعيد أوي كبداية — ابدأ السلم من تحت: تلويحة بإيده، بعدين ابتسامة، بعدين «السلام عليكم» بصوت واطي وانت لاصق جنبه. والطبق أول مرتين تمسكوه انتو الاتنين مع بعض."},{"kid":"كثير الحركة","how":"سيبته على راحته هيدوس الجرس عشر مرات ويجري في ممر العمارة — اديله دور مسمى بحركات محددة قبل ما تطلعوا: «انت شايل الطبق بإيديك الاتنين، بتدوس الجرس مرة واحدة، وبتستنى». المهمة المحددة بتحوّل الطاقة لدور."},{"kid":"عالي الشدة","how":"لو طلعتوا بالطبق والجار مافتحش، ممكن الدنيا تقلب عياط — سمّي الاحتمالين قبل ما تخرجوا: «يا نلاقي عمو راشد يا نلاقيه مش موجود — لو مش موجود نسيب الطبق على الباب ونشوفه بكره». التوقع المسمى بيمنع الانهيار."}]},
{"name":"الصدقة","cat":"دين وأخلاق","age":[4,12],"how":"محسوسة وبإيده: حصّالة يشوفها ويفرّغها ويشارك في اختيار المستفيد.","steps":[{"t":"بيشوفك بتدّي الأول","d":"قبل أي حصالة، طفلك محتاج يشوف الصدقة بتحصل قدامه: بتحط في صندوق المسجد يوم الجمعة وهو ماسك إيدك، بتديله درهم يحطه هو في صندوق التبرعات اللي جنب كاشير السوبرماركت، بتنزل مية ساقعة للعامل اللي جه يصلح المكيف. من غير خطبة بعدها — لو سأل، جملة واحدة كفاية: «إحنا بنحب نشارك اللي معانا».","say":"خد — حط انت الدرهم في الصندوق."},{"t":"نجهّز الحصّالة سوا","d":"هاتوا برطمان شفاف — عشان يشوف الفلوس بتزيد بعينه — وخليه هو اللي يلزق عليه ورقة ويلوّنها، وحطوه في مكان ظاهر زي رف المطبخ. واشرح مرة واحدة وبهدوء: «الفلوس اللي هتدخل هنا مش بتاعتنا — دي لله، بنجمعها لحد محتاجها». التجهيز بإيده هو اللي بيخلي الحصالة بتاعته مش بتاعتك.","say":"اللي بيدخل هنا مش بتاعنا — ده لله"},{"t":"عملة كل يوم بإيده","d":"اختار لحظة ثابتة — بعد المغرب أو قبل حدوتة النوم — وادّيله عملة يحطها هو بإيده في البرطمان. الثبات أهم من المبلغ: درهم كل يوم في نفس الوقت بيبني عادة، وعشرة مرة واحدة بيتنسوا. لو نسي يوم متزعقش — فكّره بكرة في نفس الميعاد.","say":"جه وقت الحصّالة — حط سهمك النهارده"},{"t":"نختار المستفيد سوا","d":"لما البرطمان يقرب يتملى، اقعدوا قدامه واسأل سؤال حقيقي: «الفلوس دي نوديها لمين؟». اعرض خيارات محسوسة هو شافها بعينه: صندوق التبرعات اللي جنب الكاشير في السوبرماركت، مية للعمال في الحر، أكل لقطط الشارع. واسمع اقتراحه بجد حتى لو غريب — المهم إنه شريك في القرار مش متفرج.","say":"انت مين شايفه محتاجها أكتر؟"},{"t":"يسلّمها بإيده هو","d":"يوم التفريغ يوم كبير: هو اللي يفضّي البرطمان، تعدّوا الفلوس سوا على السجادة، وهو اللي يوصّلها بإيده للمكان اللي اختارتوه — يحطها في الصندوق، أو يدي شنطة المية للعمال بنفسه. الإحساس اللي في اللحظة دي هو الدرس كله — متاخدش منه اللقطة دي حتى لو أسرع إنك تحطها انت. وبعد ما ترجعوا، وصف من غير «برافو»: «فلوس حصالتك بقت مية ساقعة في إيد ناس تعبانة من الحر».","say":"إيدك انت اللي هتوصّلها"},{"t":"صدقة من حاجاته هو","d":"المرحلة الأصعب والأغلى: يدي من حاجاته هو، مش من فلوس انت جبتها. قبل العيد أو لما هدومه تصغر عليه، اقعدوا قدام دولاب اللعب: «في أطفال ملهمش لعب — نختار حاجة من بتاعتك تفرّحهم؟». القرار قراره بالكامل: اللي يختاره يتلف كويس ويتبعت، واللي مش قادر يفرط فيه ميتاخدش — واللعبة المفضلة ليها حصانة معلنة. لو اختار لعبة مكسورة أول مرة، خدها برضه من غير تعليق — السخاء بيكبر بالتدريج مش بالإحراج.","say":"انت اللي تختار — إيه اللي تحب طفل تاني يفرح بيه؟"}],"mastery":"بيحط في الحصالة من نفسه وبيسأل «هنوديها لمين؟».","acts":[{"t":"برطمان الصدقة الشفاف","mat":"برطمان زجاج أو بلاستيك شفاف، ورقة وألوان ولزق، وعملات معدنية.","prep":"هو يلوّن الورقة ويلزقها على البرطمان بنفسه، والبرطمان يتحط في مكان ظاهر ثابت زي رف المطبخ.","run":"كل يوم بعد المغرب يحط عملة بإيده، وهو بيشوف الكومة بتعلى من ورا الزجاج يوم ورا يوم. قول له وهو بيحط: «الفلوس دي أمانة عندنا لحد ما توصل لصاحبها»."},{"t":"كرتونة مية للعمال في الحر","mat":"كرتونة مية صغيرة من السوبرماركت.","prep":"في مشوار السوبرماركت، هو اللي يشيل الكرتونة من الرف ويحطها عند الكاشير بنفسه.","run":"وقت الضهر والجو نار، روحوا لعامل التوصيل أو عمال النظافة أو حارس العمارة، وطفلك هو اللي يمد إيده بالأزايز واحدة واحدة. قول له قبلها: «الجو حر أوي عليهم — المية دي صدقة منك انت»."}],"say":"دي مش بتاعتنا، دي لله.","deen":["الصدقة عن يد الطفل","حصالة صدقة شفافة في مكان ظاهر في البيت: يحط فيها بإيده كل يوم، يشوف الكومة بتكبر، وفي الآخر تتصرف قدامه لحد محتاج فعلًا — الدايرة لازم تكمل قدام عينه. واربطها بالمعنى ببساطة: النبي ﷺ علّمنا إن «اليد العليا خير من اليد السفلى» — حديث متفق عليه — يعني إحنا بنحب نكون الإيد اللي بتدي. وخليه يشوفك انت بتدي — لعامل، لمحتاج — لأن الكرم بيتاخد بالعين مش بالمحاضرة."],"skill":"الفرز واتخاذ القرار: يقلّب في لعبه ويقرر بنفسه «دي أحتفظ بيها ودي أدّيها لطفل محتاج» — نفس مهارة الاختيار والاستغناء اللي هيحتاجها كل ما دولابه يزحم.","lvl":3,"ord":11,"tag":"المال والقناعة","src":[["قصة · عصافير مميز","الحصّالة المخططة","https://3asafeer.com/ar/read/758/الحصالة-المخططة"],["قصة · عصافير مميز","أوفّر نقودي","https://3asafeer.com/ar/read/117/أوفر-نقودي"]],"mistakes":[{"m":"بتدي له «درس السخاء» غصب عنه: بتاخد لعبته المفضلة قدامه وتقول «هنديها للفقرا، أحسن ليك» — فاتعلم إن الصدقة مصادرة وخسارة، وبقى أبخل بحاجته.","fix":"هو اللي يختار من حاجاته، والمفضل ليه حصانة معلنة مايتلمسش. الصدقة اللي طلعت بقرار منه هي بس اللي بتبني — اللي اتاخدت بتهدم."},{"m":"الصدقة بتتقدم قدامه بنبرة تعالي أو تخويف: «ادي الفقير ده واحمد ربنا إنك مش زيه» — فالصدقة اتحولت من مشاركة لاستعلاء وتحصين من مصير مخيف.","fix":"اتكلم عن المحتاج باحترام كامل: «العمال دول تعبانين من الحر — نطلع لهم مية». الصدقة بنقدمها لحد ليه حق علينا، مش إحسان من فوق لتحت."},{"m":"الحصالة موسمية: بتتنسي شهر، وبعدين في رمضان تتحط فيها ورقة بمية مرة واحدة — فاتعلم إن الصدقة مناسبات ومن الفايض، مش عادة يومية.","fix":"درهم صغير كل يوم في معاد ثابت أقوى تربويًا من مبلغ كبير متقطع. الثبات هو اللي بيبني العادة — المبلغ تفصيلة."}],"adapt":[{"kid":"الحساس","how":"الكلام عن «ناس محتاجة» ممكن يفتح عنده قلق وأسئلة كبيرة («هما ليه معندهمش أكل؟ إحنا ممكن نبقى كده؟») — اختار مستفيدين قريبين ومطمنين: قطط الشارع، مية للعمال. وجاوب على أسئلته ببساطة ومن غير مشاهد قاسية: «ربنا بيرزق الناس ببعضها — وإحنا من الرزق ده»."},{"kid":"العنيد","how":"لو «وقت الحصالة» بقى أمر يومي هيقفل خالص — املّكه الطقس بالكامل: هو اللي يختار مكان البرطمان، هو اللي يفكّر البيت بالمعاد، وهو صاحب الكلمة الأخيرة في المستفيد. الصدقة اللي حاسس إنها مشروعه هيحميها بالعند نفسه."},{"kid":"كثير الحركة","how":"القعدات والشرح مش طريقه — خلي الصدقة حركة ومهمة: هو اللي ينزل شايل شنطة المية للعمال، هو اللي يحط أكل القطط في الطبق اللي تحت العمارة. الصدقة اللي فيها جري وتسليم بالإيد بتترسخ عنده أضعاف أي كلام."}]},
{"name":"الحياء والستر","cat":"دين وأخلاق","age":[4,12],"how":"يتعلّم كقيمة محبوبة بلا خجل من الجسم ولا تخويف — والقاعدة تطبّق على الكبار برضه.","steps":[{"t":"قواعد البيت تتقال بهدوء","d":"في وقت عادي هادي — مش وقت موقف محرج — قول قواعد البيت كأنها حقيقة بسيطة: «إحنا بنغيّر هدومنا في الأوضة والباب مقفول، وباب الحمام بيتقفل، وبنخبط قبل ما ندخل على حد». من غير كسوف ومن غير تخويف — دي قواعد زي «بنغسل إيدينا قبل الأكل» بالظبط.","say":"في بيتنا الهدوم بتتغيّر في الأوضة والباب مقفول — كلنا"},{"t":"التغيير في الأوضة كل مرة","d":"بعد الحمام أو وقت لبس هدوم الحضانة، بدل ما تغيّر له في الصالة قدام اللي فيها، خده الأوضة واقفل الباب وقول نفس الجملة — كل مرة بنفس الكلمات. بعد كام أسبوع سلّمه الخطوة: «انت اللي هتقفل الباب النهارده». التكرار الحرفي هو اللي بيحوّلها من أمر لعادة.","say":"ده وقت خاص — نغيّر في الأوضة"},{"t":"أسماء الجسم من غير كسوف","d":"لو سأل وقت الحمام عن جزء في جسمه، جاوب بالاسم الصحيح وبنفس النبرة اللي بتقول بيها «كوع» و«ركبة» — من غير ضحك ولا تهريب من السؤال. الحياء مش خجل من الجسم — بالعكس: اللي عارف جسمه بأساميه بيحترمه، ولو حصل حاجة يعرف يحكيها بكلام واضح.","say":"ده اسمه كذا — كل حتة في جسمنا ليها اسم زي إيدك وركبتك"},{"t":"قاعدة اللبس الداخلي — وباب الحكي مفتوح","d":"بعد ما عرف أسماء جسمه، ضيف القاعدة بنفس النبرة الهادية، وقت الحمام أو اللبس: «اللي بيغطيه اللبس الداخلي حتة خاصة بيك انت — محدش يشوفها ولا يلمسها، غير ماما وبابا في الحمام أو الدكتور وإحنا معاك». وبعدها الجملة الأهم، بوش مطمّن مش مرعوب: «ولو حد عمل حاجة خلتك مش مرتاح، تعالى قولي على طول — عمري ما هزعل منك، حتى لو قالك ده سر». الجملتين دول بيتعادوا كل فترة، بنفس هدوء «اغسل سنانك».","say":"جسمك بتاعك انت — ولو حاجة ضايقتك تيجي تقولي، وأنا مش هزعل منك أبدًا"},{"t":"القاعدة على الكبار كمان","d":"اخبط على باب أوضته قبل ما تدخل واستنى يقول «اتفضل» — حتى لو الباب مردود. واقفل انت باب أوضتك لما تغيّر هدومك. لما يشوف القاعدة شغالة عليك انت كمان، بيفهم إنها قيمة البيت كله مش تعليمات للصغيرين — ودي اللحظة اللي بيبتدي يطبّقها فيها من نفسه.","say":"هخبط الأول… ممكن أدخل؟"}],"mastery":"بيقفل الباب وبيغيّر هدومه في الأوضة من غير ما يتقاله.","acts":[{"t":"لعبة الخبط على الباب","mat":"من غير مواد — باب الأوضة بس.","prep":"هو جوه الأوضة وانت بره.","run":"اخبط وقول «ممكن أدخل؟» واستنى فعلًا لحد ما يرد «اتفضل» — وبعدين اتبادلوا الأدوار: هو اللي يخبط عليك ويستنى ردك قبل ما يفتح. اختموا بجملة: «محدش بيدخل على حد من غير ما يخبط — ولا حتى الكبار»."},{"t":"لعبة فين نعمل ده؟","mat":"من غير مواد — مواقف بالكلام.","prep":"اختار وقت هادي وقول له إنها لعبة تخمين سريعة.","run":"ارمي مواقف واحد ورا التاني وهو يجاوب «قدام الناس عادي» ولا «في الأوضة والباب مقفول»: نلبس الكوتشي؟ نمشط شعرنا؟ نغيّر المايوه المبلول بعد حمام السباحة؟ نلبس البيجاما؟ ولما يجاوب صح أكد المعلومة: «بالظبط — المايوه المبلول بيتغيّر في الكابينة أو الأوضة»."}],"say":"ده وقت خاص بينا وبين نفسنا.","deen":["الحياء شعبة من الإيمان","قواعد بيت ثابتة تتقال بنبرة عادية من غير تخويف ولا كسوف: بنغيّر هدومنا في الأوضة، وبنخبط قبل ما ندخل على حد — والقاعدة على الكبار قبل الصغار. ولما يلتزم من نفسه، سمّيها بالحلو: «ده حياء — والنبي ﷺ قال إن الحياء شعبة من الإيمان»، حديث متفق عليه. وإياك تربط جسمه بالعيب أو الفضيحة — الحياء بيتبني بالخصوصية المحترمة والتكرار الهادي، مش بالكسوف."],"skill":"الخصوصية الذاتية: يقفل باب الحمام ويغيّر هدومه في الأوضة من نفسه — نفس الوعي اللي هيحميه في كابينة النادي أو حمام الحضانة.","lvl":4,"ord":8,"tag":"","src":[["مجاني","آداب وسلوكيات","https://www.belarabyapps.com/%d8%a7%d9%84%d8%b7%d9%81%d9%84-%d8%a7%d9%84%d9%85%d8%b3%d9%84%d9%85/%d8%a7%d8%af%d8%a7%d8%a8-%d9%88%d8%b3%d9%84%d9%88%d9%83%d9%8a%d8%a7%d8%aa-ar/"],["قصة · عصافير مميز","جسدي","https://3asafeer.com/ar/read/128/جسدي"]],"mistakes":[{"m":"الفضيحة والضحك: خرج جري من الحمام من غير هدوم قدام الضيوف، فضحك الكل أو زعقت «عيب! استخبى!» — اللي اتعلمه مش الحياء، اتعلم إن جسمه فضيحة بيتضحك عليها.","fix":"من غير أي تعليق قدام حد — قوم خده الأوضة بهدوء وقول الجملة المعتادة: «الهدوم بتتلبس هنا». وخلاص — الموقف ميترمدش تاني قدام الضيوف."},{"m":"أسامي مضحكة وتهريب من الأسئلة: بتسمي أعضاء جسمه أسامي هزار أو بتغير الموضوع لما يسأل — فوصلته الرسالة: «جسمك حاجة مكسوفين منها ومنتكلمش عنها»، ودي بالظبط اللي بتسكّت الطفل لو حد ضايقه.","fix":"الاسم الصحيح بنفس نبرة «كوع» و«ركبة». الطفل اللي بيتكلم عن جسمه عادي مع أهله، هو اللي بيعرف يحكي لو حصل حاجة غلط."},{"m":"القاعدة عليه هو بس: يوم ما تكون مستعجل بتغيّر له في الصالة، وبتدخل أوضته من غير خبط — التناقض بيقول له إن دي تعليمات للصغيرين مش قيمة البيت.","fix":"القاعدة إما على البيت كله أو مش هتشتغل. استحمل الدقيقتين الزيادة وغيّر له في الأوضة حتى وانت مستعجل، واخبط على بابه حتى وهو مردود."}],"adapt":[{"kid":"الحساس","how":"لو حصل موقف محرج — اتشاف بالغلط أو حد علّق على جسمه — ممكن يتكسف بعمق ويفضل شايلها — صغّر الموقف في ثانية: «حصل، بيحصل لكلنا، خلاص» وغيّر الموضوع. وبعدها بيوم لو لسه باين عليه، افتح الكلام بهدوء وانتو لوحدكم."},{"kid":"كثير الحركة","how":"بيجري من الحمام للصالة من غير هدوم عشان مبسوط، مش عشان قلة حياء — متحولهاش معركة: حضّر الهدوم في الأوضة قبل الحمام، واعمل الخروج سباق: «مين يوصل الأوضة ويلبس الأول؟» — القاعدة بتتنفذ والضحكة موجودة."},{"kid":"الخجول","how":"ممكن ياخد الستر لأقصاه ويتكسف حتى منك وقت الحمام وتغيير الهدوم — طمنه إن مساعدة ماما وبابا مش ضد القاعدة: «إحنا بنساعدك لحد ما تكبر وتعمل كله لوحدك». واحترم أي خصوصية بيطلبها قد ما ينفع — لو طلب تستنى بره باب الحمام وهو بيخلع، ده مكسب مش مشكلة."}]},
{"name":"حب النبي ﷺ","cat":"دين وأخلاق","age":[4,12],"how":"موقف واحد من السيرة كل أسبوع مربوط بموقف حصل النهارده. القصة الطويلة بتتنسى، الموقف بيفضل.","steps":[{"t":"موقف واحد كل جمعة","d":"اختار وقت ثابت — ليلة الجمعة قبل النوم — واحكي موقف واحد قصير من السيرة في دقيقتين، مش قصة طويلة: النبي ﷺ كان بيبتسم لما يسلّم، كان بيرحم القطط، كان بيشيل الأطفال وهو بيصلي. نفس الموقف يتعاد طول الأسبوع لو طلبه — التكرار مش مشكلة، ده علامة إن الموقف وصل.","say":"ليلة الجمعة معادنا مع حدوتة النبي ﷺ"},{"t":"«صلى الله عليه وسلم» بالعدوى","d":"كل ما اسم النبي ﷺ يتقال — في حدوتة الجمعة، في أنشودة، لما تسمعوا في الأذان «أشهد أن محمدًا رسول الله» — قول انت «صلى الله عليه وسلم» بصوت مسموع وواضح. متطلبش منه يرددها — هتيجي لوحدها بالعدوى بعد كام أسبوع. وأول مرة يقولها من نفسه، سمّيها من غير مبالغة: «انت صليت على النبي». الطلب بيعمل ترديد — العدوى بتعمل عادة.","say":"سمعت اسم النبي؟ صلى الله عليه وسلم."},{"t":"اربط الموقف بيومه هو","d":"لما يحصل موقف شبه حدوتة الأسبوع، اربط في اللحظة نفسها: لعب مع قطة الجراج بهدوء → «فاكر النبي ﷺ عمل إيه مع القطة؟ انت عملت زيه دلوقتي». قسم البسكوت على ولاد عمه → «النبي ﷺ كان بيقسم بالعدل كده». الربط في اللحظة هو اللي بينقل الحدوتة من حكاية بتتسمع لقدوة بتتعاش.","say":"انت عملت زي النبي ﷺ حالًا"},{"t":"لوحة صفاته تكبر معاه","d":"علّق ورقة كبيرة في أوضته في مستوى نظره، وبعد كل حدوتة جمعة هو اللي يرسم أو يلزق رمز الصفة: ابتسامة، قطة، تمرة. كل أسبوع اللوحة بتزيد رمز، وكل رمز بيفكّره بحدوتة كاملة. راجعوها مع بعض كل فترة: «الرمز ده — فاكر حدوتته؟».","say":"نضيف إيه في لوحة النبي ﷺ النهارده؟"},{"t":"صفة الأسبوع للبيت كله","d":"اختاروا من اللوحة صفة واحدة «بنجرّبها الأسبوع ده» — والبيت كله بيجرّب مش الطفل لوحده: «الأسبوع ده كلنا هنبتسم لما نسلّم، زي النبي ﷺ». وانت لما تعمل حاجة قول سببها بصوت عالي: «بديت باليمين عشان النبي كان بيحب اليمين». الحب بيتنقل بالعدوى مش بالتسميع.","say":"الأسبوع ده كلنا هنعمل زي النبي ﷺ — نبتسم لما نسلّم"}],"mastery":"بيطلب قصص النبي بنفسه وبيقول «صلى الله عليه وسلم» لما يسمع اسمه.","acts":[{"t":"لوحة صفات النبي","mat":"كرتونة أو ورقة كبيرة، ألوان، صمغ أو لزق.","prep":"علّقوها في أوضته في مستوى نظره وهي لسه فاضية.","run":"بعد كل حدوتة جمعة، هو اللي يختار رمز الصفة ويرسمه أو يلزقه — ابتسامة للي بيبتسم، قطة للرحمة، تمرة للمشاركة — ويقول الصفة بصوته هو. اسأله وهو بيلزق: «الرمز ده هيفكرنا بإيه؟»."},{"t":"طبق التمر بالعدل","mat":"طبق فيه تمر على عدد اللي في البيت.","prep":"احكي الأول في دقيقة إن النبي ﷺ كان بيقسم بالعدل ومحدش بياخد أكتر من حد.","run":"طفلك هو اللي يقسم التمر — يلف على كل واحد في البيت ويديله نصيبه بإيده، واحدة واحدة. قول له وهو بيوزع: «انت بتقسم بالعدل زي ما النبي ﷺ كان بيعمل»."}],"say":"النبي كان بيعمل كده.","deen":["السيرة كحواديت","موقف قصير من السيرة مكان حدوتة النوم مرة في الأسبوع — رحمته بالأطفال والحيوان، لعبه مع الحسن والحسين — بالحب مش بالواجب. اختار المواقف اللي طفلك يشوف نفسه فيها: أنس خدم النبي ﷺ عشر سنين وقال «ما قال لي أف قط» — حديث رواه البخاري ومسلم — يعني النبي كان بيعامل الأطفال بذوق حتى لما يغلطوا. ولما تقول اسمه صلّي عليه بصوت مسموع — هياخدها منك بالعدوى مش بالأمر. الهدف إنه يحب الشخصية قبل ما يحفظ عنها."],"skill":"إعادة الحكي: يسمع موقف قصير ويعيد حكايته بكلامه هو وبترتيبه — نفس مهارة السرد اللي المس بتطلبها لما تسأل «مين يحكيلنا القصة؟».","lvl":2,"ord":13,"tag":"","src":[["مطبوعة","لوحة صفات النبي ﷺ","https://www.belarabyapps.com/%d9%84%d9%88%d8%ad%d8%a9-%d8%b5%d9%81%d8%a7%d8%aa-%d8%a7%d9%84%d9%86%d8%a8%d9%8a-%d9%85%d8%ad%d9%85%d8%af/"],["مجاني","أوراق عمل السيرة","https://www.belarabyapps.com/%d8%a3%d9%88%d8%b1%d8%a7%d9%82-%d8%b9%d9%85%d9%84-%d9%88%d8%ad%d8%af%d8%a9-%d8%a7%d9%84%d8%b3%d9%8a%d8%b1%d8%a9-%d8%a7%d9%84%d9%86%d8%a8%d9%88%d9%8a%d8%a9-pdf/"],["مجاني","قصص الأنبياء","https://www.belarabyapps.com/%d9%82%d8%b5%d8%b5-%d8%a7%d9%84%d8%a3%d9%86%d8%a8%d9%8a%d8%a7%d8%a1-%d8%a8%d8%a7%d9%84%d8%aa%d8%b1%d8%aa%d9%8a%d8%a8/"]],"mistakes":[{"m":"قصص تقيلة على سنه: الحروب والتعذيب ووفاة النبي ﷺ لطفل 4 سنين — فاسم النبي اترتبط عنده بالحزن والخوف بدل الابتسامة والرحمة.","fix":"في السن ده مواقف الرحمة والابتسامة والقطط والأطفال بس. الباقي حقيقي ومهم — بس ليه سن تاني وهييجي وقته."},{"m":"النبي ﷺ بقى سلاح تأنيب: «النبي هيزعل منك» لما يغلط — فحولت أحب شخص المفروض يحبه لمراقب بيحاسبه.","fix":"اسم النبي ﷺ بيتقال في اللحظات الحلوة بس: «انت عملت زيه حالًا». وقت الغلط ليه أدواته التانية — النبي مش واحدة منها."},{"m":"الحدوتة بقت تسميع: «قلنا إيه امبارح؟ ها؟ مين كان بيحب القطط؟» بنبرة امتحان — فالمتعة ماتت والحدوتة بقت واجب.","fix":"احكي ومتمتحنش. لو الموقف وصل، هو اللي هيرجعه لوحده في وسط اللعب — ودي علامة النجاح الحقيقية، مش الإجابة الصح."}],"adapt":[{"kid":"كثير الحركة","how":"دقيقتين قاعد ساكن بيسمع صعبين عليه — حوّل الحدوتة تمثيل: اعمل صوت القطة، مثّلوا الابتسامة والسلام على بعض، وخليه هو اللي يمثل النبي ﷺ وهو بيرحم القطة. الموقف اللي جسمه عاشه بيتسجل أعمق من اللي ودنه سمعته."},{"kid":"الحساس","how":"بيتأثر بالحواديت بعمق — ودي ميزة مش مشكلة: هو أول واحد هيعيش مواقف الرحمة بجد. بس لو سأل عن حاجة مؤلمة («النبي مات إزاي؟») أجّل بلطف وصدق: «دي حكاية كبيرة هحكيهالك لما تكبر شوية — النهارده عندي حكاية أحلى»."},{"kid":"العنيد","how":"«صفة الأسبوع» لو نزلت عليه كقرار من فوق هيرفضها — اقلب الأدوار: هو اللي يقف قدام اللوحة ويختار الصفة، وهو اللي يعلنها للبيت على السفرة، وهو اللي يفكّر اللي نسي منكم. صاحب القرار مبيعاندش قراره."}]},
{"name":"الدعاء كعادة","cat":"دين وأخلاق","age":[3,12],"how":"بصوته هو وبكلامه هو. الدعاء المحفوظ بيبقى ترديد، والدعاء بكلامه بيبقى علاقة.","steps":[{"t":"يسمعك بتدعي بكلامك","d":"خلي طفلك يسمعك بتكلم ربنا بكلام يومك العادي: وانت راكب العربية «يا رب وصّلنا بالسلامة»، لما تلاقي حاجة كانت ضايعة «الحمد لله يا رب». من غير ما تشرح ولا تلقّن — هو بس بيسمع إن الدعاء كلام حقيقي مع ربنا في وسط اليوم، مش نص محفوظ للمناسبات.","say":"يا رب يومنا النهارده يبقى حلو"},{"t":"دوره هو قبل النوم","d":"بعد حدوتة النوم، قول انت دعوة قصيرة بكلامك، وبعدين ادّيله الدور: «انت عايز تقول لربنا إيه النهارده؟». واقبل أي حاجة تطلع منه — «يا رب عايز أروح الملاهي» ده دعاء حقيقي مية في المية. متصححش ومتضحكش ومتلقّنش — الدعاء بكلامه هو اللي بيبني العلاقة.","say":"قول انت لربنا اللي في قلبك"},{"t":"دعاء المواقف في لحظتها","d":"اربط الدعاء باللحظات: قبل ما العربية تتحرك للحضانة دعاء الركوب بإيقاع كلامي ثابت، لما لعبته تضيع «يا رب ساعدنا نلاقيها»، قبل يوم فيه حاجة مقلقاه «يا رب تعدي حلوة». بعد فترة هتلاقيه هو اللي بيفتكر قبلك: «مقولناش دعاء الركوب!».","say":"استنى — قبل ما نتحرك ندعي سوا"},{"t":"يدعي لحد غيره","d":"لما حد قريب يتعب أو يسافر، اطلب دعوته هو: «جدو تعبان النهارده — تقول لربنا إيه عشانه؟». وخليه يسمعك انت بتدعي له هو كمان: «يا رب تحفظلي ابني». الدعاء للغير بينقل الدعاء عنده من قايمة طلبات لطريقة بيحب بيها الناس.","say":"قول: يا رب اشفي جدو"},{"t":"لما اللي دعيناه ماحصلش","d":"هييجي يوم يسألك: «أنا دعيت نروح الملاهي ومرحناش — ربنا مسمعنيش؟». السؤال ده مش أزمة — ده باب. متتوترش ومتلففش: «ربنا سمعك أكيد — بس ربنا زي ماما وبابا: ساعات بنقول أيوه، وساعات مش دلوقتي، وساعات عندنا حاجة أحسن مستنياك». وافتكروا سوا دعوة اتحققت فعلًا: «فاكر لما دعينا نلاقي الديناصور ولقيناه تحت السرير؟». الإجابة الهادية دي هي اللي بتخلي الدعاء يعيش معاه لما يكبر.","say":"ربنا سمعك — وساعات بيقول مش دلوقتي عشان مجهّز لك أحسن"}],"mastery":"بيدعي من نفسه في المواقف («يا رب») وبيقول دعاء الأكل والنوم من غير تلقين.","acts":[{"t":"طقس الدعوة قبل النوم","mat":"من غير مواد — بس نفس الترتيب كل ليلة.","prep":"الوقت الثابت: بعد الحدوتة وقبل ما تطفي النور.","run":"انت تقول دعوة قصيرة بكلامك العادي، وبعدين تديله الدور وتستنى — واقبل أي كلام يقوله من غير تعديل ولا تلقين. لو سكت، طمّنه: «ربنا بيحب يسمع صوتك انت — أي كلمة»."},{"t":"أذكار الصباح في العربية","mat":"صوتكم انتو الاتنين، أو مقطع أذكار صباح مقروء بصوت أطفال على موبايلك.","prep":"طريق الحضانة كل يوم — نفس المكان نفس الوقت.","run":"ابدأ انت بصوتك أو شغّل المقطع وهو يكمّل وراك، ومع أسابيع التكرار هتلاقيه بيسبقك بالذكر أول ما العربية تتحرك. ابدأها كل يوم بـ: «مين هيفتكر ذكر الصباح الأولاني؟»."}],"say":"قول انت لربنا اللي في قلبك.","deen":["الدعاء هو العبادة","ادعي قدامه بصوت مسموع وبكلامك العادي في المواقف الحقيقية: قبل المشوار «يا رب سهّلها»، ولما حد يتعب «يا رب يقوم بالسلامة» — طفلك بيقلد اللي بيسمعه مش اللي بيتلقنه. واقبل دعاءه بأي صيغة: لو دعا لعربيته أو للبسكوتة متضحكش ومتصححش — المهم إنه اتعود يكلم ربنا. والمعنى من حديث النبي ﷺ «الدعاء هو العبادة» — رواه الترمذي — كلمة لربنا في أي وقت هي عبادة كاملة. ولما اللي دعيتوه ميحصلش، قول له ببساطة: «ربنا سمعك وهيختارلك الأحسن»."],"skill":"الحفظ في سياقه: يقول دعاء الأكل قبل اللقمة الأولى ودعاء النوم قبل ما النور يتطفي من حفظه — ربط الكلمة المحفوظة بلحظتها الصح، مش تسميع من غير مكان.","lvl":1,"ord":11,"tag":"","src":[["قناة","عدنان معلم القرآن","https://www.youtube.com/@AdnanQuran"],["قصة · عصافير مميز","الأمنية","https://3asafeer.com/ar/read/1161/الأمنية"]],"mistakes":[{"m":"بتضحك على دعاءه أو بتعدّله: دعا «يا رب عايز أيس كريم» فضحكت أو قلت «لا، ده مش دعاء، ادعي صح» — فاتعلم إن كلامه هو مش نافع لربنا، وسكت واستنى التلقين.","fix":"أي حاجة يقولها لربنا في السن ده دعاء صحيح مية المية. العلاقة الأول — والصيغ الجميلة هتيجي بعدين لوحدها من السمع."},{"m":"الدعاء عندك تسميع سريع: «قول دعاء الأكل! قلنا قول!» وهو بيردد كلام مش فاهمه وعينه في الطبق — طقس فاضي هيقع أول ما يكبر.","fix":"النص المحفوظ ييجي جنبه معنى بكلامكم: بعد «اللهم بارك لنا» ضيف «يا رب الأكل ده يخلينا أقوياء». المعنى هو اللي بيثبّت النص، مش العكس."},{"m":"الدعاء بقى عقوبة: «ادخل أوضتك وادعي ربنا يسامحك على اللي عملته» — فالكلام مع ربنا اترتبط عنده بلحظات الذنب والتوبيخ.","fix":"الدعاء بيتربط باللحظات الحلوة والمحتاجة: الفرحة، والطلب، والقلق الطبيعي. وقت الغلط ليه أدواته — الدعاء مش عقوبة فيها."}],"adapt":[{"kid":"الخجول","how":"«ادعي بصوت عالي» قدام العيلة ممكن يقفله خالص — اديله السرية كخيار كامل: «قولها في قلبك — ربنا سامع اللي في القلب»، أو يهمس في ودنك انت بس. الدعاء اللي جوه دعاء كامل مش ناقص."},{"kid":"كثير الحركة","how":"قعدة دعاء متأملة مش هتحصل — خلي الدعاء ومضات مربوطة بحركة: جملة واحدة أول ما حزام العربية يتقفل، جملة أول ما الطبق ينزل على السفرة — ثانيتين وخلاص. الومضة المتكررة بتبني أكتر من القعدة الطويلة."},{"kid":"الحساس","how":"أسئلته هتبقى أعمق من سنه: «ربنا بيسمعني منين؟ هو فين؟» — متتوترش من السؤال ومتكتمهوش. إجابة بسيطة كفاية: «ربنا بيسمعنا في كل حتة، وأقرب لينا من أي حد». ولو اتضايق إن دعوة ماتحققتش، ارجعوا لخطوة «لما اللي دعيناه ماحصلش» كل ما يحتاجها."}]},
{"name":"الصلاة والوضوء","cat":"دين وأخلاق","age":[4,12],"how":"التقليد قبل التكليف: تقلّدك من غير إلزام ومن غير ما تقطع لعبها — لحد ما تطلبها هي.","steps":[{"t":"يشوفك بتصلي بلا دعوة","d":"صلّي في مكان مفتوح في البيت — الصالة مش ورا باب مقفول — وسيب لعبه شغال ومتقولش «تعالى صلّي». أقصى حاجة تقولها إعلان هادي مربوط بالأذان: أذان مسجد الكمبوند أو أذان الموبايل — «الأذان بينده». كده الصلاة بتبقى مشهد يومي مألوف ليه ميعاد بيسمعه بودنه زي الأكل والنوم — وده الأساس اللي كل اللي بعده مبني عليه.","say":"الأذان أذّن — أنا رايح أصلي وراجع لك"},{"t":"سجادة بتاعته — ودعوة من غير امتحان","d":"خده يختار سجادة صغيرة بنفسه باللون اللي يحبه، وخليها متتفرشش إلا وقت الصلاة جنب سجادتك. لو جه فرشها ووقف جنبك — أهلًا بيه من غير تصقيف ولا «شوفوا حبيبي بيصلي». ولو قلّد الحركات غلط، أو ضحك في النص، أو مشي بعد ركعة — كله مقبول من غير تصحيح ولا نظرة عتاب: اللي بيتبني دلوقتي علاقته بالسجادة، مش صحة الحركات. ولو كمّل لعب ومجاش أصلًا — عادي خالص. السجادة دعوة مفتوحة، مش التزام.","say":"دي سجادتك — لما تحب تفرشها جنبي"},{"t":"الوضوء لعبة ترتيب","d":"الزقوا جنب حوض الحمام صور خطوات الوضوء بالترتيب في مستوى نظره: إيدين، بق، مناخير، وش، دراعات، شعر، ودان، رجلين. قبل صلاة المغرب اعزمه: «تحب تعمل زي الصور؟» وسيبه يجرب بالترتيب — واللعب بالمية جزء من الحكاية مش مخالفة.","say":"بص على الصور — إيه الخطوة الجاية؟"},{"t":"جمعة حلوة سوا","d":"خده معاك صلاة الجمعة في يوم يكون فيه رايق ومش تعبان — والزيارة قصيرة على قد استحماله. وخلي بعد الصلاة عادة حلوة ثابتة: مشوار، عصير، قعدة سوا. مش مكافأة مشروطة على الصلاة — ده ربط بسيط: يوم الصلاة مع بابا يوم حلو. اللي بيتبني في السن ده هو الحب، والتكليف له وقته بعدين.","say":"النهارده الجمعة — انت وأنا"}],"mastery":"بييجي يقف جنبك في الصلاة من نفسه — من غير ما تناديه.","acts":[{"t":"سجادته الخاصة","mat":"سجادة صلاة صغيرة — والأحسن تنزلوا المحل وهو اللي يختارها بنفسه.","prep":"خصص لها مكان ثابت جنب سجادتك، ومتتفرشش إلا وقت الصلاة عشان تفضل ليها قيمتها.","run":"وقت ما تفرش سجادتك، بتاعته موجودة جنبك لو حب يفرشها ويقلّد حركاتك. من غير تصحيح لو غلط في الترتيب، ومن غير عتاب لو قام في نص الصلاة. قول له مرة واحدة بس: «دي بتاعتك — وقت ما تحب»."},{"t":"صور الوضوء جنب الحوض","mat":"ورق وألوان (أو صور مطبوعة لخطوات الوضوء) ولزق يستحمل المية.","prep":"ارسموا أو الزقوا سوا خطوات الوضوء بالترتيب جنب حوض الحمام في مستوى نظره — وخليه هو اللي يلزقهم بإيده.","run":"قبل صلاة المغرب اعزمه يجرب: يبص على الصورة، يعمل الخطوة، وينتقل للي بعدها لوحده من غير ما تمسك إيده. اسأله وهو بيغسل: «خلصنا الوش — إيه الخطوة الجاية؟»."}],"say":"دي سجادتك — لما تحب تفرشها جنبي.","deen":["التقليد قبل التكليف","قبل سن سبعة مفيش أمر بالصلاة أصلًا — النبي ﷺ قال «مُروا أولادكم بالصلاة لسبع» (رواه أبو داود)، يعني سنين 3-5 دي كلها تحبيب وتقليد حر. سجادة صغيرة جنب سجادتك، يقف معاك اللي يقدر عليه ويمشي في النص لو زهق — من غير إلزام ولا عتاب، ومن غير ما تقطع لعبه عشان يصلي. اللي بيتبني دلوقتي إن منظر الصلاة مربوط في دماغه بالدفا وقربه منك — والفريضة بعد كده هتتبني على المحبة دي مش على الخوف."],"skill":"الوضوء شبه المستقل: يشمّر هدومه ويغسل وشه وإيديه بالترتيب وانت بتدّي تعليمات كلامية بس — نفس تسلسل الخطوات اللي بيحتاجه في غسل الإيدين والاستعداد قبل الحضانة كل صبح.","lvl":3,"ord":12,"tag":"","src":[["قناة","عالم زيدو","https://www.youtube.com/@zidoworld3421/playlists"],["مجاني","الطفل المسلم","https://www.belarabyapps.com/%d8%a7%d9%84%d8%b7%d9%81%d9%84-%d8%a7%d9%84%d9%85%d8%b3%d9%84%d9%85/"]],"mistakes":[{"m":"بتقطع لعبه وتجرّه للسجادة بحجة «الصلاة أوقاتها» — فبيربط الصلاة بضياع اللعبة اللي كان مندمج فيها، وبيبتدي يتهرب لما يشوفك بتتوضى.","fix":"قبل سن التكليف الصلاة عرض مستمر مش طلب: صلّي قدامه وسيب الدعوة مفتوحة — اللي جه بمزاجه بيرجع تاني، واللي اتجر بيهرب."},{"m":"بتصحّح له وهو واقف جنبك: «إيدك غلط، بص لقدام، بطّل ضحك» — فالوقفة اللي كانت لعبة حلوة بقت امتحان، وبطّل ييجي أصلًا.","fix":"أي تقليد في السن ده مقبول بالكامل زي ما هو — التصحيح ليه سنين جاية. وظيفتك الوحيدة دلوقتي إن الوقفة جنبك تفضل حاجة بيحبها."},{"m":"بتستعمل التخويف: «اللي ميصليش ربنا يزعل منه ويعاقبه» — فبتزرع صورة مرعبة عن ربنا في سن مش بيفرق فيه بين المجاز والحقيقة.","fix":"اربط الصلاة بالحب: «بنكلم ربنا لأننا بنحبه، وبعد الصلاة قلبنا بيبقى مرتاح». الخوف بينفّر من السجادة، والحب بيخليها مكان حلو."}],"adapt":[{"kid":"كثير الحركة","how":"متستناش منه يقف ركعتين ساكن — ثواني هي أقصاه ودي طبيعية. اديله الأدوار الحركية: هو اللي يفرش السجادتين، يردد ورا المؤذن بصوته، يقف معاك للتكبيرة ويمشي — وكل ثانية زيادة جنبك مكسب مش فشل."},{"kid":"العنيد","how":"لو حس إن عينك عليه مستنياه ييجي، مش هييجي أبدًا. متبصلوش وانت بتصلي، وسيب سجادته مفرودة جنبك كدعوة صامتة من غير ولا كلمة — العنيد بييجي لما القرار يبقى قراره مية في المية."},{"kid":"الحساس","how":"أي تعليق قدام الضيوف — حتى المدح («تعالى وريهم بتصلي إزاي») — بيكسفه وبيخليه يعتزل. خلي كل حاجة تخص صلاته بينك وبينه بس، والوصف بصوت واطي: «انت وقفت جنبي ركعة كاملة»."}]},
{"name":"جسدي وحدودي","cat":"جسد وأمان","age":[4,9],"how":"يتقال بهدوء وبأسماء صحيحة ويتكرر كل كام شهر — مش مرة واحدة ومش وقت أزمة.","steps":[{"t":"أسماء الجسم الصحيحة","d":"وقت الحمام أو تغيير الهدوم، سمّي أجزاء الجسم بأساميها الحقيقية — بما فيها الأجزاء الخاصة — بنفس النبرة الهادية اللي بتقول بيها «كوع» و«ركبة». من غير أسامي تدليع ومن غير ضحك. الطفل اللي عنده الكلمات الصح يقدر يحكي لك أي حاجة بوضوح لو حصلت — والكلمة الصح دي خط الدفاع الأول.","say":"ده اسمه كذا — زي ما دي إيدك ودي ركبتك"},{"t":"قاعدة المايوه","d":"وقت لبس المايوه قبل حمام السباحة، قول القاعدة ببساطة: «الأجزاء اللي المايوه بيغطيها دي خاصة بيك انت — محدش يشوفها ولا يلمسها، إلا ماما وبابا وقت التنظيف، والدكتور وماما أو بابا واقفين جنبك». تتقال بهدوء كمعلومة مش كتحذير مرعب، وتتعاد كل كام شهر في نفس المواقف.","say":"اللي المايوه بيغطيه ده بتاعك انت بس"},{"t":"لأ بصوت جد — بالتمثيل","d":"درّبوا في وقت اللعب: «لو حد عايز يحضنك وانت مش عايز — تعمل إيه؟» وخليه يقولها بصوت عالي جد: «لأ! جسمي بتاعي» وبعدين «هقول لبابا وماما». عيدوا التمثيلية كل كام أسبوع بمواقف مختلفة — الرد اللي اتقال بالصوت في اللعب هو اللي بيطلع لوحده وقت الموقف الحقيقي.","say":"قولها بصوتك الجد: لأ! جسمي بتاعي"},{"t":"«لأ» بتاعته محترمة في العيلة","d":"الامتحان الحقيقي في العزومة: تيتا عايزة بوسة وهو مكشّر — متقولش «عيب كده، بوس تيتا». قول انت قدامه: «هو مش حابب بوس دلوقتي — سلّم بإيدك» واديله البديل المحترم. ونفس القاعدة جوه البيت: الدغدغة بتقف عند أول «بس» حتى لو لسه بيضحك، ولعب المصارعة مع بابا بيقف بنفس الكلمة. «لأ» اللي بتتداس في البيت والعيلة عمرها ما هتشتغل بره.","say":"هو مش حابب بوس دلوقتي — تحب تسلّم بإيدك؟"},{"t":"مفيش سر عن بابا وماما","d":"قول القاعدة وكرّرها كل كام شهر: «لو أي حد — أي حد خالص — قالك ده سر بيني وبينك متقولش لماما وبابا، دي بالذات لازم تيجي تحكيهالنا فورًا، ومش هتتعاقب أبدًا مهما كان». وطبّقها انت: لما يحكي لك أي حاجة، أول رد فعل منك شكر على إنه حكى — مش تحقيق ولا زعيق.","say":"مفيش سر عن بابا وماما — واللي بيحكي عمره ما بيتعاقب"}],"mastery":"بيقول «لأ، جسمي بتاعي» وعارف مين مسموح له بإيه.","acts":[{"t":"تمرين لأ وامشي واحكي","mat":"من غير مواد — تمثيل بجسمكم.","prep":"اختار وقت لعب هادي، وقول له إنكم هتلعبوا لعبة «الصوت الجد».","run":"مثّل مواقف بسيطة — «أنا هعمل إني بشدك للحضن وانت مش عايز» — وهو يطبّق التلات خطوات بجسمه فعلًا: يقول «لأ!» بصوت عالي، ياخد خطوة بعيد، ويجري يجيلك يحكي. بدّلوا المواقف كل مرة عشان الخطوات تتحفظ في جسمه مش في كلامه بس. قول له: «ورّيني صوتك الجد»."},{"t":"لعبة مين مسموح له","mat":"من غير مواد — أسئلة سريعة بالكلام.","prep":"بعد الحمام أو وقت لبس المايوه، والجو طبيعي مش متوتر.","run":"اسأله أسئلة قصيرة وهو يجاوب: «مين ينفع يساعدك في الحمام؟» (ماما وبابا) — «الدكتور يكشف عليك لوحدك؟» (لأ، لازم ماما أو بابا معايا) — «حد في الحضانة قالك ورّيني؟» (لأ وهحكي لماما وبابا). عشر ثواني للسؤال، والعبوها تاني كل كام شهر عشان الإجابات تفضل جاهزة. اختمها بجملة: «جسمك ملكك انت»."}],"say":"جسمي ملكي، ومفيش سر عن بابا وماما.","deen":["الحياء أمان مش كسوف","علّمه إن جسمه أمانة غالية من ربنا بنحافظ عليها — عشان كده بنغيّر هدومنا في الأوضة وبنقفل باب الحمام، من غير كلمة «عيب» ولا تخويف ولا خجل من الجسم نفسه. النبي ﷺ قال «الحياء شعبة من الإيمان» (متفق عليه من حديث أبي هريرة) — قدّمها له كده: الحياء حاجة حلوة بتحمينا، مش كسوف بيسكّتنا. والقدوة أهم من الشرح: لما يشوفك بتخبط على بابه وبتستأذن قبل ما تدخل، بيتعلم إن لجسمه ومساحته حرمة محترمة عند أقرب الناس ليه."],"skill":"الرفض الحامي: يقول «لأ» بصوت جد ويبعد ويجي يحكيلك لما حد يلمسه لمسة مش مريحاه — نفس المهارة اللي بتحميه في الحضانة والنادي ولمّة العيلة لما تكون انت مش موجود.","lvl":1,"ord":3,"tag":"الروتين والاستقلال","src":[["مجاني","طفولة آمنة","https://www.belarabyapps.com/%d8%b7%d9%81%d9%88%d9%84%d8%a9-%d8%a2%d9%85%d9%86%d8%a9/"],["قصة · عصافير مميز","جسدي","https://3asafeer.com/ar/read/128/جسدي"],["قصة · عصافير مميز","لا تقل: لا!","https://3asafeer.com/ar/read/1030/لا-تقل-لا"]],"mistakes":[{"m":"بتدرّبه الصبح على «جسمي بتاعي» وبالليل بتجبره يبوس عمو وطنط عشان «العيب» — فبيتعلم إن «لأ» بتاعته شغالة في التمثيلية بس، وأول ما حد كبير يصمم بيسلّم جسمه.","fix":"البديل المحترم بيحل المعادلة: سلام بالإيد أو باي باي من بعيد — تيتا مش هتزعل، وحدوده اتحفظت قدام عينه."},{"m":"بتسمّي الأجزاء الخاصة أسامي تدليع مضحكة عشان الكسوف — فلو حصلت حاجة لا قدر الله هيحكي بكلام مبهم محدش هياخده بجدية ولا هيفهمه.","fix":"الاسم الحقيقي بنفس نبرة «كوع» و«ركبة» — من غير ضحك ولا توتر. الكلمة الصح هي خط الدفاع الأول."},{"m":"بتكمّل دغدغة وهو بيصرخ «بس! بس!» بحجة إنه بيضحك — الضحك في الدغدغة رد فعل عضلي مش موافقة، وانت كده بتعلّمه إن كلامه عن جسمه مش بيوقّف حد.","fix":"أول «بس» بتوقف اللعب فورًا، وسمّيها: «قلت بس — وقفت على طول». دي أقوى بروفة عملية لحدوده."}],"adapt":[{"kid":"الخجول","how":"«لأ!» بصوت عالي في وش حد كبير فوق طاقته حتى بعد مية تمرين. اديله بدايل على مقاسه: يبعد بجسمه خطوة، يمسك إيدك، وإشارة سرية بينكم (يعصر إيدك مرتين يعني «مش مرتاح») — وانت اللي تتكلم بداله قدام الناس."},{"kid":"العنيد","how":"هيقلب القاعدة سلاح ضد كل حاجة: «مش هغسل سناني — جسمي بتاعي!». وضّح الفرق من الأول: «لأ» على الحضن والبوس والدغدغة محترمة دايمًا من غير نقاش — أما النضافة والدوا شغل ماما وبابا، وفيهم بياخد تحكم في الطريقة: أنهي معجون، مين يبدأ."},{"kid":"الحساس","how":"كلام الأجزاء الخاصة ممكن يقلقه ويفتح أسئلة مقلقة قبل النوم. صغّر الجرعة: جملة واحدة في سياقها الطبيعي — وقت الحمام أو لبس المايوه — بدل قعدة كلام طويلة، ولو سأل بقلق جاوب باختصار وطمّن: «دي قواعد بنعرفها وخلاص، زي قواعد المرور»."}]},
{"name":"السر الجميل والسر المؤذي","cat":"جسد وأمان","age":[4,9],"how":"التفرقة بتتدرّب بأمثلة كتير مش بتعريف. اديه 5 مواقف وخليه يصنّف.","steps":[{"t":"الفرق بأمثلة — مش بتعريف","d":"في وقت هادي — على السفرة أو قبل النوم، مش بعد موقف مقلق — ابدأ بمثالين من حياته: «إحنا مخبيين هدية عيد ميلاد ماما لحد الخميس — ده سر جميل: مفاجأة ليها يوم هنقولها فيه»، و«السر المؤذي حاجة بتضايقك في بطنك وحد بيقولك متحكيش لحد أبدًا». وبعدها بكام يوم العبوا لعبة التصنيف: خمس مواقف قصيرة يحكم عليها واحد واحد — «بابا مخبي هدية لماما»؟ «حد كبير إداك شوكولاتة وقال متقولش لماما»؟ «صاحبك كسر لعبة وقال متقولش للمس»؟ لو غلّط، رجّعه لسؤال المفتاح: «السر ده هيفرّح حد في يوم معين، ولا بيضايق ومطلوب يتخبى على طول؟».","say":"السر الجميل ليه يوم بنقوله فيه — واللي بيضايق بنحكيه على طول"},{"t":"قاعدة «اللي يضايقك بنقوله»","d":"قاعدة واحدة بتتكرر بنفس الكلمات كل ما الموضوع ييجي: أي سر مضايقك بنقوله لبابا وماما فورًا — حتى لو اللي قاله قال «هزعل منك». واربطها بقاعدة الجسم: «ومفيش حد خالص يقولك خبي حاجة عن بابا وماما». بنبرة قواعد البيت العادية — زي «بنغسل إيدينا قبل الأكل» — مش بنبرة تحذير مرعب.","say":"أي سر بيضايقك — تعالى قوله لبابا وماما على طول، مهما كان"},{"t":"وشّك وقت ما يحكي","d":"القاعدة كلها بتعيش أو تموت في أول مرة يجرّبها فعلًا: هييجي يحكيلك حاجة — ممكن تلاقيها محرجة أو مقلقة أو تافهة. وشّك لازم يفضل هادي، وأول جملة منك شكر مش تحقيق. الأسئلة بعدين وبهدوء، ومفيش «ليه سكتّ لحد دلوقتي؟!» ولا «وانت مالك ومال ده؟». أول رد فعل متنرفز بيقفل الباب اللي قضيت شهور بتبنيه — وهو مش هيفرّق المرة الجاية بين حاجة صغيرة وحاجة كبيرة: هيفتكر بس إن الحكي بيجيب مشاكل.","say":"كويس أوي إنك جيت حكيتلي — احكيلي كمان"},{"t":"تمثيلية الرد كل شهرين","d":"العب دور الشخص اللي بيجرّب: «تعالى أوريك حاجة، بس دي سر بيني وبينك متقولش لماما» — وخليه يتمرن يرد بصوت عالي: «أنا مبخبيش حاجة عن بابا وماما». الرد اللي اتقال بالصوت في اللعب هو اللي بيطلع لوحده وقت الموقف الحقيقي. وعيد التمرين كل شهرين تلاتة — الدرس اللي اتقال مرة واحدة وهو 3 سنين بيتنسى قبل ما يبقى 4.","say":"لو حد قالك «ده سر متقولوش لماما» — ترد تقول إيه؟"}],"mastery":"بيجاوب صح: «السر اللي يضايقني أحكيه لماما وبابا على طول».","acts":[{"t":"بطاقات الوشين","mat":"ورقتين كبار وقلم — ارسم على واحدة وش مبسوط وعلى التانية وش مضايق.","prep":"حط الورقتين على السجادة بمسافة بينهم، وجهّز في دماغك خمس مواقف قصيرة قبل ما تبدأوا.","run":"قول موقف موقف — هدية مخبية لماما، حد قال «متحكيش وإلا هزعل»، مفاجأة لجدو، صاحب كسر حاجة وطلب الكتمان — وطفلك ينط أو يحط إيده على الوش الصح. اختم كل جولة بنفس الجملة: «السر اللي يضايق مكانه مش في بطنك — مكانه عندي أنا وماما»."},{"t":"تمثيلية الرد الجاهز","mat":"من غير مواد.","prep":"خمس دقايق قبل النوم، والجو هادي ومطمّن.","run":"مثّل انت دور اللي بيجرّب: «خد البسكوتة دي بس متقولش لماما» — وهو يتمرن يقول رده بصوت واضح: «أنا مبخبيش حاجة عن بابا وماما». بعدين اقلبوا الأدوار: هو اللي يمثّل وانت اللي ترد. اختمها دايمًا بتطمين: «ولو نسيت ترد، عادي — المهم تيجي تحكيلي»."}],"say":"أي سر بيضايقك بنقوله على طول.","deen":["جسمك أمانة","قدّم الفكرة بالمعنى البسيط من غير نسبة نص معين: «ربنا إدّانا أجسامنا أمانة نحافظ عليها — واللي يضايقك فيها مبنخبيهوش، بنحكيه على طول». الجملة دي تتقال بهدوء وتتكرر في مواقف عادية — بعد الحمام، وقت اللبس — مش في لحظة خوف. وأهم من التكرار إن ربنا يتقدم له دايمًا كمصدر أمان: «ربنا بيحبك وعايزك في أمان، عشان كده بنحكي» — أبدًا مش «ربنا هيزعل لو خبيت»، عشان الحكاية تفضل مربوطة عنده بالطمأنينة مش بالذنب."],"skill":"التمييز والإفصاح: يفرّق بين المفاجأة الحلوة اللي ليها نهاية قريبة (هدية عيد ميلاد ماما) والسر اللي بيتقل على صدره — ولما حد يقول له «متحكيش» ييجي يحكيلك في نفس اليوم.","lvl":1,"ord":4,"tag":"الصدق والأمانة","src":[["مجاني","طفولة آمنة","https://www.belarabyapps.com/%d8%b7%d9%81%d9%88%d9%84%d8%a9-%d8%a2%d9%85%d9%86%d8%a9/"],["قصة · عصافير مميز","عندي سر خطير","https://3asafeer.com/ar/read/591/عندي-سر-خطير"],["قصة · عصافير مميز","سرٌّ تحت المخدّة!","https://3asafeer.com/ar/read/1686/سر-تحت-المخدة"]],"mistakes":[{"m":"بتستخدمه انت في تخبية حاجات صغيرة: «متقولش لماما إننا اشترينا شيبسي» — كده هدمت القاعدة بإيدك: أول حد علّمه إن فيه أسرار بتتخبى عن ماما هو انت.","fix":"ولا سر واحد يتشال عن أحد الوالدين، حتى الهزار. لو حاجة حلوة سمّيها بوضوح: «دي مفاجأة ليها يوم — الخميس هنقولها»."},{"m":"أول ما يقول «عندي سر ومش هقولك» بتعصره: «لأ لازم تقولي حالًا!» — فبيتعلم إن الحكي معاك تحقيق، ويخبي أكتر.","fix":"افتكر القاعدة بهدوء: «الأسرار الجميلة براحتك — اللي بيضايقك بس هو اللي بنحكيه»، وسيبله مساحة. غالبًا هييجي يحكي لوحده بعد شوية."},{"m":"بتشرح الموضوع بنبرة درامية مرعبة («فيه ناس أشرار هيقولولك...») — الطفل بياخد الرعب من صوتك ومبياخدش القاعدة، وممكن يبطل يحكي أصلًا عشان خايف.","fix":"نفس نبرة قواعد المرور: معلومة هادية بتتعاد كل كام شهر — التكرار الهادي بيبني، والجرعة المرعبة الواحدة بتخض وبتتنسي."}],"adapt":[{"kid":"الحساس","how":"أمثلة الأسرار المؤذية ممكن تفتح عنده باب قلق — يفضل يسأل «مين هيقولي سر وحش؟». خلي الأمثلة من عالم الأطفال (صاحب كسر لعبة، حد خبى حاجة في الحضانة) مش سيناريوهات كبار، واقفل كل تمرين بجملة أمان ثابتة: «انت في أمان — دي بس قاعدة بنعرفها»."},{"kid":"الخجول","how":"في التمثيلية مش هيطلع منه رد بصوت عالي — والمطلوب منه أصلًا مش الجهورية، المطلوب إنه يوصلك. درّبه على المجيء الصامت: يجي يمسك إيدك ويقول بصوت واطي «عندي حاجة أحكيهالك» — واعتبرها نجاح كامل وسمّيها كده."},{"kid":"كثير الحركة","how":"قعدة السفرة الهادية مش هتكمل معاه دقيقتين. وزّع التدريب على لحظات الحركة: سؤال تصنيف واحد سريع في العربية، موقف واحد وانتو ماشيين للحضانة — خمس لحظات صغيرة في الأسبوع أنفع من قعدة واحدة بيتململ فيها."}]},
