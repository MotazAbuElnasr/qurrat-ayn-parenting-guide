{"t":"تقويم التلاجة","mat":"ورقة A3 أو كرتونة، قلم تخين، ألوان.","prep":"اقسموا الورقة سبع خانات وارسموا سوا علامة لكل يوم من أسبوعكم الحقيقي: شنطة الحضانة، سجادة الجمعة، موجة البحر، تليفون تيتة — وعلقوها على التلاجة في مستوى نظره.","run":"كل ليلة هو اللي يشطب اليوم اللي خلص بالقلم بإيده، واسأله وهو بيشطب: «شطبنا النهارده — بكره يوم إيه؟». بالشطب اليومي بيشوف الأسبوع بيتحرك قدامه — والأيام بقت حاجة بيلمسها، مش كلام."},{"t":"رتب يومك بالصور","mat":"موبايلك للتصوير، أو أربع كروت ورق وألوان.","prep":"صوّر أربع لحظات من روتين الصبح الحقيقي بتاعه: البيجاما، فرشة السنان، اللبس، شنطة الحضانة — أو ارسموهم سوا على أربع كروت.","run":"اخلط الكروت وحطهم قدامه على السفرة وخليه يرتبهم: «إيه الأول؟ وبعدين؟». لما يخلص خليه يحكي يومه من الكروت زي حدوتة، واسأله في الآخر: «وبعد الشنطة بنروح فين؟»."}],"say":"ده هيحصل بكره مش النهارده.","deen":["الصلاة بتقسم اليوم","اربط مواعيد اليوم بالصلوات بدل الساعة: «بعد العصر بننزل نلعب، بعد المغرب بنقرا الحدوتة» — الطفل في السن دي بيحس بالوقت بالعلامات مش بالأرقام. ولما الأذان يأذّن قول قدامه: «أذّن المغرب — يبقى جه وقت الحدوتة»، وخليه يشوفك انت بتقوم تصلي على نفس العلامة. كده الصلاة بتترسخ عنده كإيقاع اليوم اللي بينظم حياة البيت كله — حاجة بنحبها وبنمشي بيها، مش أمر بيقطع اللعب."],"skill":"متابعة الجدول المصوّر لوحده: يبص على جدول اليوم ويقول اللي جاي من نفسه — نفس المهارة اللي هتخليه يمشي مع نظام يوم الحضانة من غير ما المس تشده لكل خطوة.","lvl":4,"ord":6,"tag":"","src":[["قصة · عصافير مميز","في خلال أسبوع","https://3asafeer.com/ar/read/1008/في-خلال-أسبوع"],["قصة · عصافير مميز","شهرًا بعد شهر","https://3asafeer.com/ar/read/1074/شهرا-بعد-شهر"]],"mistakes":[{"m":"«خمس دقايق» بتاعتك ساعة: بتقوله «خمس دقايق وجايلك» وتقعد على الموبايل نص ساعة — وحدات الوقت في بيتكم بقت كلام ساكت، ومتستغربش بعدها إن «استنى شوية» مبتجيبش نتيجة.","fix":"قول وحدة صادقة والتزم بيها، ولو مش عارف قول الصدق: «مش عارف هخلص إمتى — أول ما أخلص هنده عليك»."},{"m":"«بعدين» كرفض مؤدب: «هنشتري العجلة بعدين» وانت قصدك لأ — بيتعلم إن كلام المستقبل كله نصب مؤدب، وساعتها التقويم نفسه هيقع من عينه.","fix":"اللي هيحصل فعلًا خده على التقويم بيوم محدد، واللي مش هيحصل اسمه «لأ» واضحة بسببها — الرفض الصريح أرحم من بعدين الكدابة."},{"m":"تقويم بيموت في أسبوع: علقت الورقة بحماس، شطبتوا تلات أيام، وبعدين اتنست — التقويم الميت على التلاجة بيعلمه إن الأنظمة موضة بتعدي.","fix":"الشطب الليلي مسؤوليتك انت أول شهر مش مسؤوليته — علّقه على عادة موجودة أصلًا: بعد غسيل السنان على طول، القلم جنب التقويم دايمًا."}],"adapt":[{"kid":"كثير الحركة","how":"مش هيقف قدام تقويم يتأمل — خلّي الوقت حركة: هو اللي يجري يجيب القلم، يشطب واقف على الكرسي، وأسئلة «الأول وبعدين» اسألها وانتو طالعين السلم أو في العربية، مش في قعدة مذاكرة."},{"kid":"العنيد","how":"الترتيب اللي انت فرضته هيتقاوم لمجرد إنه بتاعك — سلّمه ملكية النظام: هو اللي يرسم علامات التقويم بإيده، وفي الخطوات اللي ترتيبها مش فارق اديله القرار: «سنان الأول ولا بيجاما الأول؟ انت اللي بترتب». الجدول اللي هو بناه بينفذه من غير معركة."},{"kid":"الحساس","how":"العد التنازلي ممكن ينقلب قلق أو خيبة كبيرة — متحطش على التقويم غير المضمون، ولو حاجة اتلغت بجد (يوم البحر وقع بسبب الجو) متمسحهاش في السر: اقعدوا سوا، سمّي الزعل، وارسموا نفس العلامة في مربع جديد قدامه — التأجيل المرئي بيتحمل، الاختفاء لأ."}]},
{"name":"المشاركة والدور","cat":"تعامل","age":[3,12],"how":"الدور قبل المشاركة. والملكية لازم تبقى مضمونة الأول: الطفل اللي واثق إن لعبته هترجع بيدي بسهولة.","steps":[{"t":"الملكية مضمونة الأول","d":"قبل أي زيارة أطفال — ولاد عمه جايين مثلًا — خليه يختار لعبتين «خاصين» ويطلعهم بإيده على رف عالي: دول مش للمشاركة النهارده. الباقي بقى متاح للكل. الطفل اللي متطمن إن أغلى حاجاته محفوظة بيدي الباقي بسهولة — الأمان بييجي قبل الكرم، مش بعده.","say":"من حقك تقول ده بتاعي — واللي هتشاركه هيرجعلك تاني"},{"t":"بتاعي وبتاعك وبتاع الكل","d":"نص خناقات المشاركة من خلط تلات خانات: عربيته «بتاعه» — محدش ياخدها غير بإذنه؛ موبايلك «بتاعك» — بيستأذن قبل ما يلمسه؛ ومرجيحة النادي «بتاعت كل الأطفال» — ودي بس اللي بتمشي بالدور والطابور. العبوها لعبة وانتو في البيت أو البلاي إريا: شاور على حاجة وهو يقولك بتاعت مين. لما الخريطة توضح، بيبطل يصرخ «بتاعي!» على مرجيحة، وبيبطل يتصدم إن لعبة صاحبه في بيت صاحبه ليها نفس الحق.","say":"المرجيحة بتاعت كل الأطفال — عشان كده بنركبها بالدور"},{"t":"دوري دورك معاك انت","d":"درّب الإيقاع معاك انت الأول، بحاجة هو مش متعلق بيها: كورة بترموها لبعض، مكعبات بتبنوا بيها برج واحد بالتبادل. سمّي كل تبديلة بصوت عالي: «دوري... دورك...» بإيقاع ثابت زي السجع. لما الكلمتين يبقوا في لسانه معاك، هيطلعوا لوحدهم مع الأطفال.","say":"دوري أنا... ودلوقتي دورك انت"},{"t":"التايمر بيحمي الدور","d":"لما هو وابن عمه يتخانقوا على السكوتر، حط تايمر رملي أو تايمر المطبخ على تلات دقايق قدام عنيهم الاتنين: «لما الرمل يخلص، الدور يتبدل». أهم لحظة هي رجوع السكوتر فعلًا لصاحب الدور — كده يتأكد إن التنازل عن الدور مش ضياع للحاجة، وده اللي بيخليه يسلّم المرة الجاية من غير معركة.","say":"لما الرمل يخلص السكوتر يروح لدوره — وبعدين يرجعلك تاني"},{"t":"لعب من غير حَكَم","d":"في البلاي إريا أو مع أطفال الجيران، اقعد بعيد وسيبهم يظبطوا الأدوار بنفسهم — متتدخلش أول ما الأصوات تعلى على المرجيحة، استنى شوية. لو سمعته بيقول «دورك» من نفسه، متعلقش في اللحظة: سمّيها له بالليل بوصف. الهدف النهائي إن «دوري ودورك» تشتغل من غيرك خالص.","say":"سمعتك بتقول لصاحبك دورك — انتو ظبطتوا اللعب لوحدكم"}],"mastery":"بيقول «دوري» و«دورك» في اللعب من غير تدخل منك.","acts":[{"t":"لعبة التايمر الرملي","mat":"تايمر رملي (من لعبة طاولة قديمة) أو تايمر الموبايل بجرس مسموع، ولعبة واحدة مرغوبة: سكوتر، تابلت رسم، عربية الريموت.","prep":"اختار وقت انتوا الاتنين رايقين فيه، واتفقوا على القاعدة قبل ما تبدأوا: كل واحد ياخد اللعبة لحد ما الرمل يخلص.","run":"العبوا انت وهو بالدور: اللي دوره خلص يسلّم اللعبة بإيده — مش تتاخد منه. سمّوا مع كل تبديلة «دوري — دورك»، وقول له في الآخر: «شايف؟ الدور بيرجع دايمًا»."},{"t":"رف الحاجات الخاصة","mat":"كرتونة أو رف عالي فوق الدولاب.","prep":"قبل أي زيارة أطفال لبيتكم، اقعدوا قدام دولاب اللعب وهو اللي يختار.","run":"خليه يختار لعبتين بس يحطهم في الرف العالي بإيده — «دول بتوعك مش للمشاركة النهارده» — والباقي كله بقى للعب المشترك. بعد ما الضيوف يمشوا نزلوهم سوا وقول له: «انت شاركت كل حاجة تانية، وكل حاجة رجعتلك زي ما هي»."}],"say":"دوري… دورك.","deen":["الله يحب الرفق","النبي ﷺ قال: «إن الله رفيق يحب الرفق في الأمر كله» (متفق عليه) — والمعنى ده بيوصل للطفل مربوط بموقف حصل قدامه، مش كدرس منفصل. لما يسلّم اللعبة بهدوء أو يدي أخوه دوره، قول له في اللحظة نفسها: «الحركة دي اسمها رفق — وربنا بيحب اللي بيترفق». ولما تشاركه انت حاجة من اللي في إيدك — لقمة من طبقك، مكان جنبك — سمّيها بنفس الكلمة قدامه. بالتكرار هيربط المشاركة بحب ربنا ليها، مش بإنها أمر مفروض عليه."],"skill":"الترتيب المشترك: يلم اللعب في السلة مع اللي لعب معاه بعد ما اللعب يخلص — نفس اللي بيحصل في الحضانة لما المس تقول «وقت الترتيب» وكل الأطفال بيلموا سوا.","lvl":1,"ord":8,"tag":"المشاركة والدور","src":[["قصة · عصافير مميز","من يلعب بالكرة؟","https://3asafeer.com/ar/read/1084/من-يلعب-بالكرة؟"],["قصة · عصافير مميز","واحدة لكِ، اثنتان لي","https://3asafeer.com/ar/read/267/واحدة-لك،-اثنتان-لي"]],"mistakes":[{"m":"أول ما طفل ضيف يعيّط على لعبة في إيد طفلك بتقول «اديهاله يا حبيبي، هو ضيف» — علّمته درسين غلط في جملة واحدة: اللي يصرخ ياخد، وملكيته مش مضمونة — فهيمسك في حاجاته أكتر مش أقل.","fix":"«دي في إيد ابني دلوقتي — أول ما يخلص دوره هتيجي لك». الضيف ليه اللعب المتاح، مش اللي في الإيد."},{"m":"بتسحب التابلت أو اللعبة من إيده فجأة من غير إنذار عشان «خلاص كفاية» — وبعدين مستغرب إنه بيخطف اللعب من الأطفال: انت بتدرّبه على الخطف بالقدوة.","fix":"حتى انت، إنذار قبل الأخذ: «آخر حلقة وبعدها هاخد التابلت» — الجملة اللي عايزه يقولها لصاحبه، اسمعهاله منك الأول."},{"m":"يوم عيد ميلاده بتجبره يشارك هداياه الجديدة فورًا، وبتكسفه قدام الضيوف لو رفض — اللعبة الجديدة لسه محضنهاش أصلًا.","fix":"اللعبة الجديدة ليها يوم أو يومين «حضن» قبل ما تدخل التشارك — وقول للضيوف قدامه: «دي جديدة لسه، العبوا باللعب التانية»."}],"adapt":[{"kid":"العنيد","how":"بيقول «بتاعي!» على كل حاجة — الغريزة تقولك قلل ملكيته، والصح العكس: زوّد ضمانها. زوّد عدد اللعب «الخاصة» على الرف، وخلي التايمر هو اللي بإيده يقلبه — الرمل حَكَم محايد، والعنيد بيقبل من الرمل اللي مش بيقبله منك."},{"kid":"الخجول","how":"مشكلته العكس: بيدي كل حاجة وبيتسحب — الأطفال بياخدوا من إيده وهو ساكت. درّبه في البيت معاك على جملة «أنا لسه بلعب بيها» بصوت مسموع، وفي البلاي إريا اقف قريب وسانده بنظرة لما يقولها — من غير ما تتكلم انت بداله."},{"kid":"عالي الشدة","how":"لحظة تبديل الدور بتنفجر — ضاعف الإنذارات قبلها: «كمان لفتين... لفة واحدة... الدور بيتبدل»، وابدأ تدريب الدور على حاجات هو مش متعلق بيها (كورة، مكعبات) مش على السكوتر بتاعه — ومتحاولش تشرح قيمة الدور وهو في عز النوبة."}]},
{"name":"التعاطف","cat":"تعامل","age":[3,12],"how":"بيتبني بسؤالين متكررين في كل قصة وكل موقف: هو حاسس بإيه؟ وهنعمل إيه عشانه؟","steps":[{"t":"بص وشه حاسس بإيه","d":"في حدوتة كل ليلة، وقّف عند صورة فيها وش واضح واسأل سؤالين بس: «حاسس بإيه؟ وعرفت منين؟» — خليه يشاور على البق النازل أو الدموع المرسومة. وبعد أسبوع انقل السؤال من الكتاب للحقيقة: طفل بيعيط في السوبرماركت، اسأله نفس السؤال بصوت واطي وانتو ماشيين.","say":"بص وشه كده — هو حاسس بإيه في رأيك؟"},{"t":"كل المشاعر مسموحة","d":"لما ابن عمه الصغير يعيط على بالونة طارت، امنع في البيت كله جملة «بيعيط على إيه ده» — وسمّي بدالها: «هو زعلان عشان البالونة، البالونة مهمة عنده». ونفس القاعدة على مشاعره هو: «مفيش حاجة تزعّل» ممنوعة. الطفل اللي مشاعره بتتقبل، بيقبل مشاعر غيره.","say":"هو زعلان — والزعل مش عيب، كلنا بنزعل"},{"t":"طب نعمل إيه عشانه","d":"بعد التسمية ييجي الفعل. ماما تعبانة نايمة على الكنبة؟ اسأله: «ماما تعبانة — نعمل إيه عشانها؟» واقبل اقتراحه حتى لو غريب — لو قال «أجيبلها ديناصوري»، نفّذوها: الديناصور من عنده هو أصدق تعاطف في العالم. ولما صاحبه يقع في الحضانة، اسأله بالليل: «وانت عملت إيه عشانه؟».","say":"هو متضايق — طب نعمل إيه عشانه؟"},{"t":"كائن حي مسؤوليته","d":"اديله كائن حي محتاجه بجد: نبتة على شباك المطبخ يسقيها، أو طبق مية لقطط الشارع تحت العمارة يملاه كل يوم بعد العصر. اربط بصوت عالي: «النبتة عطشانة زي ما انت بتعطش». الكائن اللي مش بيتكلم بيدرّب عينه يشوف الاحتياج من غير ما حد يقوله — ودي عضلة التعاطف نفسها.","say":"القطة مش بتعرف تقول أنا عطشانة — انت اللي بتاخد بالك منها"}],"mastery":"بيلاحظ من نفسه إن حد مضايق، ويسأل عليه أو يجيب له حاجة.","acts":[{"t":"وقفة الوش في الحدوتة","mat":"أي كتاب قصص مصور عندكم في البيت.","prep":"كل ليلة وقت الحدوتة، اختار صورة واحدة فيها شخصية باين عليها إحساس واضح.","run":"وقّف الحدوتة عند الصورة واسأله: «حاسس بإيه؟ عرفت منين؟» — وبعدين السؤال الأعمق: «ولو انت مكانه كنت هتحس بإيه؟». سؤالين وخلاص ومتحولهاش لدرس — الحدوتة لازم تفضل حدوتة. اختم بـ«تعالى نشوف عمل إيه» وكمّلوا."},{"t":"مهمة القطة أو النبتة","mat":"طبق بلاستيك وزجاجة مية — أو نبتة صغيرة وكوباية سقي على شباك المطبخ.","prep":"حددوا وقت ثابت — كل يوم بعد العصر — ومكان ثابت: طبق القطط عند مدخل العمارة، أو النبتة على الشباك.","run":"هو اللي ينزل معاك ويملى الطبق أو يسقي النبتة — إيده هي اللي بتصب، انت بس واقف جنبه. لما ينسى، فكّره بسؤال مش بلوم: «مين اللي مستني ميته النهارده؟». بعد شهر هتلاقيه هو اللي بيفكّرك."}],"say":"هو حاسس بإيه في رأيك؟","deen":["الرحمة بالخلق","النبي ﷺ قال: «الراحمون يرحمهم الرحمن، ارحموا من في الأرض يرحمكم من في السماء» (رواه الترمذي) — والطفل في السن دي بيفهم الرحمة بفعل مش بشرح. اليوم اللي تحكي له فيه قصة عن الرحمة، اربطها بفعل حقيقي في نفس اليوم: ينزل معاك يحط مية للقطط، أو يوصّل طبق أكل لجار. وقول له وإيده بتشتغل: «إحنا بنرحم اللي في الأرض، وربنا بيرحمنا». القصة لوحدها بتتنسي — القصة والفعل في نفس اليوم هما اللي بيبنوا القلب."],"skill":"تحضير سناك لغيره: يجهز بإيده بسكوتاية وكوباية عصير ويقدمها لحد تعبان أو مضايق في البيت — فيتعلم إن الاهتمام بالناس فعل بإيده، مش كلام بس.","lvl":2,"ord":2,"tag":"التعاطف والمساعدة","src":[["قصة · مجاني","ساعد الفيل الحزين","https://3asafeer.com/ar/read/49/ساعد-الفيل-الحزين"],["قصة · عصافير مميز","جزر يحتاج إلى عناق","https://3asafeer.com/ar/read/1278/جزر-يحتاج-إلى-عناق"]],"mistakes":[{"m":"«مفيش حاجة تزعّل، بطّل عياط» لما يعيط على حاجة شايفها انت تافهة — البسكوتة اتكسرت نصين مثلًا. الطفل اللي إحساسه بيتنكر بيتعلم ينكر إحساس غيره: التعاطف بيبدأ من إن مشاعره هو بتتاخد بجد.","fix":"سمّي قبل ما تصغّر: «انت زعلان عشان البسكوتة اتكسرت» — التسمية مش موافقة على العياط، بس هي اللي بتفتح باب التعاطف كله."},{"m":"بتجبره على مصالحة تمثيلية: «بوس أخوك وقول له بحبك» وهو لسه مغتاظ — بتعلّمه إن التعاطف أداء بيرضي الكبار، مش إحساس حقيقي بالتاني.","fix":"بدل البوسة بالعافية وجّه عينه: «بص أخوك حاسس بإيه؟ نعمل إيه عشانه؟» — وسيب الفعل يطلع منه هو، حتى لو خد وقت."},{"m":"«ماما هتزعل منك» و«بابا هيعيط لو عملت كده» كأداة طاعة — لما المشاعر الوهمية بتتستعمل للتحكم، بيتعلم إن كلام المشاعر لعبة ضغط وبيبطل يصدقه — حتى الصادق منه.","fix":"مشاعرك الحقيقية سمّيها وقت حدوثها بصدق: «أنا اتضايقت لما الكوباية اتكسرت» — ومتستعملش زعل حد كسلاح طاعة أبدًا."}],"adapt":[{"kid":"الحساس","how":"بيتعدي بمشاعر غيره — يعيط لما حد يعيط ويتشحن من مشاهد الكرتون الحزينة. علّمه الفصل مش التبلد: «انت حزنت عشانه — انت مش هو. نقدر نساعده من غير ما نغرق معاه»، وبعد أي موقف تقيل ساعده يرجع لنفسه: حضن، كوباية مية، لعبة. التعاطف اللي بيغرق صاحبه بيتقفل."},{"kid":"كثير الحركة","how":"مش هيقعد يتأمل وشوش في كتاب — حوّل التعاطف لمهمة حركة: «جدو تعبان — اجري هاتله كوباية المية»، «طبق القطط فاضي — انزل املاه». عضلة التعاطف عنده بتتبني بالرجلين، والأسئلة اسألها في العربية وعلى السلم مش في قعدة."},{"kid":"العنيد","how":"لما يكون هو اللي زعّل أخوه، المواجهة المباشرة («شوف عملت إيه في أخوك!») بتقفله على الدفاع — اسأله عن التاني مش عن نفسه: «أخوك حاسس بإيه دلوقتي؟» من غير نبرة اتهام. السؤال اللي مفيهوش محاكمة بيفتح اللي المواجهة بتقفله."}]},
{"name":"الاعتذار وإصلاح الخطأ","cat":"تعامل","age":[3,12],"how":"الإصلاح بالفعل قبل الاعتذار بالكلام. «آسف» المفروضة بالعافية بتعلّم أداء مش ندم.","steps":[{"t":"اعتذر انت قدامه","d":"أول درس إنك تغلط قدامه وتصلّح: دلقت كوباية الشاي على السفرة؟ قول بصوت مسموع «أنا دلقت الشاي — هجيب فوطة أمسح، وآسف يا ماما» وامسحها فعلًا. وعلى العشا احكيله عن غلطة حصلت في يومك وصلّحتها إزاي. كده هو شايف السلسلة كاملة: غلط، إصلاح، وبعدين كلمة.","say":"أنا غلطت — شوف هصلّحها إزاي."},{"t":"من غير تحقيق","d":"لما تلاقي العصير مدلوق وطفلك مستخبي ورا الكنبة، أول جملة منك بتحدد الباب كله: «مين عمل ده؟!» بصوت المحقق بتعلّمه إن الغلطة فضيحة — يبقى الحل يستخبى ويكدب. إنما «فيه عصير على الأرض — نجيب الفوطة» بتعلّمه إن الغلطة مشكلة ليها حل. الطفل مش هيقرّب من غلطة هو خايف من اللي بعدها — أمّن الطريق الأول، والإصلاح هييجي لوحده.","say":"أنا مش بدوّر على مين غلط — أنا بدوّر على مين هيساعدني نصلّح"},{"t":"الإصلاح بالفعل الأول","d":"لما يدلق العصير أو يهد برج مكعبات صاحبه، متطلبش «قول آسف» — اسأل «نعمل إيه عشان نصلّح؟» وناوله الفوطة يمسح بإيده هو، أو خليه يساعد صاحبه يبني البرج تاني. الإصلاح بالفعل هو اللي بيعلّم إن الغلط ليه تصليح، مش فضيحة نستخبى منها.","say":"نعمل إيه عشان نصلّح ده؟"},{"t":"إصلاح القلب مش بس الحاجة","d":"مش كل غلطة ليها فوطة: لما يقول لأخوه «انت وحش» ويعيّطه، أو يهد له البرج بعمد، اللي اتكسر مش حاجة تتمسح. اسأله: «قلب أخوك اتوجع — إيه اللي يصلّحه؟» وسيبه يقترح هو: يجيب له دبدوبه، يرسمه رسمة، يقعد جنبه شوية. الإصلاح اللي طالع من دماغه — مهما كان غريب — بيعلّم أعمق من أي جملة تلقّنهاله.","say":"قلبه اتوجع من الكلمة — إيه اللي يخليه يتصلّح؟"},{"t":"آسف تيجي بعد الإصلاح","d":"بعد ما يمسح اللي دلقه أو يبني اللي هده، اسأله بهدوء: «تحب تقول لأخوك حاجة؟». لو قال آسف من نفسه، سمّي الفعل: «انت صلّحت واعتذرت». لو مقالهاش متعصرهاش منه — آسف بالعافية بتعلّم تمثيل مش ندم، والإصلاح نفسه كان أهم رسالة.","say":"انت صلّحت — تحب تقول له كمان حاجة؟"},{"t":"قبول اعتذار الغير","d":"الدايرة بتكمل لما يتعلم يستقبل الاعتذار كمان: أخوه خبطه بالغلط وقال آسف؟ درّبه على الرد: «ولا يهمك» أو «خلاص، عادي». وانت لما حد يعتذرلك قدامه — الجرسون اتأخر واعتذر — اقبل بهدوء. اللي بيتعلم يقبل الاعتذار بيبقى أسهل عليه يقدّمه.","say":"هو قال آسف — نقول له: ولا يهمك."}],"mastery":"بعد الغلط بيروح يصلّح (يلم اللي وقع، يجيب منديل) — مش بس يقول آسف.","acts":[{"t":"صندوق الإصلاح","mat":"فوطة صغيرة، مناديل، شريط لاصق، صمغ، وصندوق يلمّهم.","prep":"جهّزوا الصندوق سوا مرة واحدة، وحطوه في رف واطي يوصله لوحده.","run":"أول ما حاجة تتدلق أو ورقة تتقطع، هو اللي يجري يجيب الصندوق ويصلّح بإيده — وانت جنبه بتساعد، مش بتاخد منه. قول وانتوا بتقفلوه: «الغلط بنصلّحه، مش بنستخبى منه»."},{"t":"مسرحية العروستين","mat":"عروستين أو شخصيتين من لعبه، ومكعبات يتبني منها برج.","prep":"في وقت لعب هادي، جهّز المشهد: عروسة هتهد برج التانية بالغلط.","run":"مثّل المشهد قدامه، وقّفه واسأله: «تعمل إيه دلوقتي؟» — وخليه يمثّل بإيده الإصلاح الأول (يبنوا البرج سوا) وبعدين كلمة الاعتذار. بدّلوا الأدوار: مرة هو اللي غلط، ومرة هو اللي بيقبل الاعتذار. اختم بجملة: «اللي يغلط يصلّح»."}],"say":"نعمل إيه عشان نصلّح ده؟","deen":["أستغفر الله","بعد ما الغلط يتصلّح بالإيد — اللي وقع اتلم، اللي اتدلق اتمسح — ضيف الجملة الصغيرة: «ونقول أستغفر الله»، بنبرة عادية هادية زي أي كلام حلو، من غير أي تخويف. وخليه يسمعك انت بتقولها على غلطاتك: «أنا اتأخرت على وعدي — أستغفر الله، وهصلّحها دلوقتي». والمعنى ده أصله حديث النبي ﷺ: «كل بني آدم خطّاء وخير الخطائين التوابون» (رواه الترمذي) — كلنا بنغلط، والشاطر اللي يرجع ويصلّح. كده الاستغفار بيتربط عنده بالراحة والإصلاح، مش بالخوف."],"skill":"ترتيب سريره كل صبح: يظبط اللحاف والمخدة بإيده قبل ما يخرج من الأوضة — نفس مبدأ «اللي بعترته برجّعه» اللي بيتدرب عليه في إصلاح الغلط.","lvl":1,"ord":9,"tag":"الاعتذار والإصلاح","src":[["قصة · عصافير مميز","آسف… لقد نسيت!","https://3asafeer.com/ar/read/1048/آسف-لقد-نسيت"],["قصة · عصافير مميز","من أوقع الجسر؟","https://3asafeer.com/ar/read/1039/من-أوقع-الجسر؟-مستوى-أول"]],"mistakes":[{"m":"بتقبل «آسف» السريعة كصكة براءة: يقولها وهو جاري من غير ما يبص وتعدي — «آسف» بقت كلمة سحرية بتلغي الغلط بدل ما تختمه.","fix":"بعد الآسف السريعة رجّعه بهدوء: «شكرًا على آسف — والعصير لسه على الأرض، تعالى نجيب الفوطة». الكلمة بتختم الإصلاح، مش بتعوّضه."},{"m":"بتزعق له بالغلط، تكتشف إنه ماعملش حاجة، وتعدّيها بسكوت أو بـ«خلاص ولا يهمك» — لو عمره ما شافك بتعتذر لطفل، هيفهم إن الاعتذار للصغيرين بس وإن الكبير فوق الغلط.","fix":"اعتذار كامل وبالتفصيل: «أنا زعقتلك وانت ماعملتش حاجة — أنا آسف، كان لازم أسأل الأول». الاعتذار ده هيتحفظ عنده أكتر من مية درس."},{"m":"بتفتح أرشيف غلطاته: «زي ما كسرت الكوباية الأسبوع اللي فات برضه» — الغلطة اللي اتصلحت ورجعت تتذكر بتعلّمه إن الإصلاح مبيقفلش الملف، يبقى ليه يتعب فيه أصلًا؟","fix":"الغلطة اللي خلص إصلاحها اتقفلت — ماتتجابش تاني، لا في العتاب ولا قدام الضيوف كحكاية مضحكة."}],"adapt":[{"kid":"الحساس","how":"الغلطة الصغيرة بتقلب انهيار على نفسه («أنا وحش!») قبل ما تفتح بقك — قبل أي طلب إصلاح، صغّر الغلطة بنبرتك: «ده عصير اتدلق — بيحصل عندنا كلنا»، وافصل الفعل عن الشخص بوضوح. الإصلاح يستنى شوية لحد ما يهدى — الطفل اللي بيجلد نفسه محتاج يشوف إن الغلطة عادية، مش محتاج محاسبة."},{"kid":"العنيد","how":"بينكر والدليل على هدومه («مش أنا!») — متدخلش معركة انتزاع اعتراف: هتخسرها وهيتعلم يكابر أكتر. شيل المحاسبة من النص وروح للإصلاح على طول: «مش مهم مين — الأرض مبلولة ومحتاجة فوطة، تعالى نمسح سوا». الاعتراف بييجي لما الخوف من المحاسبة يختفي، مش قبله."},{"kid":"عالي الشدة","how":"ساعة الغلطة بيدخل نوبة دفاعية — يرمي اللي في إيده ويزعق. ساعتها قواعد ضبط الغضب الأول: أمان وكلام قليل، ولا كلمة عن الغلطة نفسها. الإصلاح بعد ساعة أو حتى تاني يوم إصلاح كامل: «فاكر اللبن اللي اتدلق الصبح؟ تعالى نشوف المكان محتاج إيه» — الإصلاح المتأخر بيعلّم نفس الدرس من غير معركة."}]},
{"name":"الكرم والعطاء","cat":"تعامل","age":[3,12],"how":"العطاء بيتعلّم بإيده هو: يختار ويسلّم بنفسه. العطاء بالنيابة عنه مش بيعلّم حاجة.","steps":[{"t":"يشوفك وانت بتدي","d":"قبل ما تطلب منه يدي، خليه يشوفك: وانت بتجهّز طبق أكل لجيرانكم أو شنطة هدوم لحد محتاج، نده عليه يقف جنبك وسمّي اللي بيحصل: «الجاكيت ده بقى صغير علينا، وفيه طفل هيدفّيه». العطاء اللي بيحصل بعيد عن عينه مش بيعلّمه حاجة.","say":"احنا عندنا كتير — نفرّح بيه مين؟"},{"t":"هو يختار ويسلّم","d":"قبل العيد أو مع تغيير الموسم، افتحوا دولاب اللعب سوا وقوله: «اختار لعبة لسه حلوة نديها لطفل تاني». الشرط: هو اللي يختار مش انت، والحاجة تكون سليمة — العطاء الحقيقي مش تخلص من الكراكيب. وهو اللي يسلّمها بإيده، لبواب العمارة لولاده أو لمكان التبرعات.","say":"اختار انت اللعبة اللي هتفرّح طفل زيك."},{"t":"يدي من اللي بيحبه","d":"المستوى الأصعب: العطاء من الحاجة اللي في إيده دلوقتي، مش من الفايض. في النادي ومعاه كيس بسكوت وصاحبه واقف من غير؟ اقترح بهدوء وسيب القرار له. وقدّم انت النموذج قبلها: قسّم برتقانتك نصين على الغدا وادّيله نص وقول «أحلى حتة ليك».","say":"صاحبك معهوش — تحب تقسم معاه؟"},{"t":"هدية من مجهوده","d":"علّمه إن العطاء مش بس حاجات — وقت ومجهود كمان. عيد ميلاد صاحبه في الحضانة؟ يرسمله كارت بإيده. تيتا تعبانة؟ يعملها رسمة ويسلّمهالها بنفسه في الزيارة. الهدية المصنوعة بإيده بتعلّمه إن اللي بنديه من تعبنا أغلى من اللي بنشتريه.","say":"اعملها بإيدك — هتبقى أغلى هدية."}],"mastery":"بيعرض من حاجته (حتة بسكوت، لعبة) من نفسه من غير ما حد يطلب.","acts":[{"t":"شنطة العطاء الشهرية","mat":"شنطة قماش أو كرتونة مكتوب عليها «شنطة العطاء».","prep":"أول كل شهر، افتحوا دولاب اللعب والهدوم سوا.","run":"هو اللي يختار حاجة أو اتنين لسه بحالة كويسة ويحطهم في الشنطة بإيده. آخر الشهر ينزل معاك يسلّمها بنفسه — لأسرة تعرفوها أو نقطة تبرعات. قول له وهو بيسلّم: «إيدك انت اللي بتدي»."},{"t":"ورشة الهدية","mat":"ورق أبيض، ألوان، شريط لزق، قصاصات ورق ملون.","prep":"قبل عيد ميلاد صاحبه في الحضانة أو زيارة الجدود، اقعدوا على الترابيزة وقول له: «هنعمل الهدية بإيدينا».","run":"هو يرسم الكارت أو الرسمة، ويساعدك تلفوها بالورق الملون، وهو اللي يسلّمها بإيده ويشوف فرحة اللي خدها. قول بعدها: «شفت فرحته؟ دي من شغل إيدك»."}],"say":"نديه لمين؟","deen":["الصدقة","خصص حصّالة صدقة في البيت — هو اللي يحط فيها الدرهم بإيده كل جمعة، وهو اللي ينزل معاك يفرّغها ويسلّمها: لعامل، لتبرعات المسجد، لأسرة تعرفوها. الإيد اللي بتدي هي اللي بتتعلم — لو انت اللي بتدي وهو بيتفرج، الدرس مبيوصلش. وعلّمه معنى قول النبي ﷺ: «اليد العليا خير من اليد السفلى» (متفق عليه) — اللي بيدي أحسن من اللي بياخد، وربنا بيزود اللي بيدي مش بينقصه. وخليها مربوطة بيوم ثابت زي الجمعة، عشان الكرم يترسخ بالتكرار مش بالمناسبات."],"skill":"تجهيز السفرة للكل: يحط الأطباق والمعالق لكل اللي في البيت مش لنفسه بس — نفس حركة الإيد اللي بتشتغل عشان غيرها، واللي بيقدّم بيها للضيف ولصاحبه.","lvl":3,"ord":1,"tag":"الكرم والعطاء","src":[["قصة · عصافير مميز","البالون الهديّة","https://3asafeer.com/ar/read/1432/البالون-الهدية"],["قصة · عصافير مميز","أحلى هدية من عمتي بهية","https://3asafeer.com/ar/read/959/أحلى-هدية-من-عمتي-بهية"]],"mistakes":[{"m":"بتدي بالنيابة عنه: بتاخد لعب من أوضته وتنزل بيها للتبرعات وهو مش موجود — وبعدين يدوّر على العربية الحمرا ويكتشف إنها «اتوهبت». علّمته إن العطاء خطف مؤدب وإن حاجاته مش في أمان.","fix":"مفيش حاجة بتاعته تخرج من البيت إلا بإيده وبقراره — حتى لو اختار لعبة أقل من اللي انت كنت ناوي عليها."},{"m":"بتجبره يدي وقدام الناس كمان: «ادي صاحبك من البسكوت، متبقاش بخيل» — العطاء بالعافية بيعلّم كره العطاء نفسه، وكلمة «بخيل» بتتلزق فيه وبيبتدي يصدقها.","fix":"اقترح وسيب القرار: «صاحبك معهوش — تحب تقسم معاه؟» ولو قال لأ، سيبها تعدي من غير تعليق — وكرر النموذج قدامه: كرمك المتكرر أقوى من أمرك المباشر."},{"m":"بتكافئه بحاجة على كل عطاء: «عشان ادّيت أخوك هشتريلك بسكوت» — حوّلت الكرم لصفقة، وهيبطل يدي أول ما المكافأة تختفي.","fix":"خليه يشوف أثر عطائه بدل المكافأة: «انت قسمت البسكوت — بص صاحبك فرحان إزاي». وش التاني المبسوط هو الجايزة اللي بتبني."}],"adapt":[{"kid":"الحساس","how":"بيتعلق بالحاجة وممكن يندم بعد ما يديها ويعيّط عليها بالليل — متستعجلوش: اللعبة اللي اختار يديها تستنى يوم كامل («اتأكد لبكره»)، ولو الندم جه بعد التسليم سمّيه من غير تراجع: «وحشاك وانت فرحان إنها بتلعّب طفل تاني — الاتنين بيحصلوا مع بعض عادي»."},{"kid":"العنيد","how":"أي اقتراح عطاء منك هيترفض لمجرد إنه جاي منك — حضّر المشهد وسيب الفكرة تطلع منه: جهّز كرتونة الهدوم قدامه من غير ما تطلب منه حاجة، وسؤال «فيه لعبة عندك ممكن تفرّح طفل؟» يتقال مرة ويتساب. لو جاب لعبة بعد يومين، ده كرمه هو — مش تنفيذ لأوامرك."},{"kid":"الخجول","how":"بيحب يدي بس تسليم الحاجة بإيده لحد غريب بيرعبه — متلغيش خطوة التسليم ومتسلّمش انت بداله: درّجها. أول مرة يسلّم وهو ماسك إيدك، أو يسلّم لحد يعرفه — جارتكم، تيتا — قبل الغريب. الكرم يثبت الأول، والجرأة بتلحقه بعدين."}]},
{"name":"أدب الكلام مع الكبير","cat":"تعامل","age":[4,12],"how":"القدوة أولًا: الطفل بيسمع إزاي بتكلم أهلك والخدمة والناس، وبيقلّد ده مش الكلام اللي بتقوله له.","steps":[{"t":"هو بيسمعك انت","d":"المنهج الحقيقي هو كلامك قدامه: بتقول إيه لعامل التوصيل لما يسلّمك الأوردر؟ وللبواب؟ أسبوع كامل خلّي تعاملك قدامه مع أي حد بيخدمكم فيه «لو سمحت» و«شكرًا» وبالاسم. لو بتتكلم مع الخدمة بنبرة أمر ناشفة، مفيش كلام هتقوله له هيصلّح اللي بيشوفه.","say":"شكرًا يا عم حسن، تعبناك معانا."},{"t":"ينادي الناس باحترام","d":"درّبه على النداء الصح: «عمو» و«طنط» و«ميس» مع الاسم — مش «انت» ولا إشارة بالصباع. والتحضير يبقى قبل الموقف مش قدام الناس: قبل ما تخرجوا من الباب قوله «لو قابلنا طنط منى في الأسانسير هنقولها إيه؟». التلقين قدام الناس بيكسف، والتحضير قبلها بيمكّن.","say":"لو قابلنا طنط منى — هنقولها إيه؟"},{"t":"لو سمحت في كل طلب","d":"على السفرة لما يقول «هات مية!»، متتجاهلوش ومتوبخوش — قدّم الصيغة الصح وخليه يعيدها. أول ما يقولها ناوله المية عادي، من غير محاضرة ولا تصقيف. التكرار الهادي ده كل يوم لأسابيع هو اللي بيحوّلها من قاعدة محفوظة لعادة لسان.","say":"نجرّبها تاني: ممكن المية لو سمحت؟"},{"t":"المقاطعة ليها إشارة","d":"انت بتتكلم مع ضيف أو في التليفون وهو بيشد هدومك ويزن «بابا! بابا!» — متتجاهلوش للآخر ومتقطعش كلامك فورًا كمان. اتفقوا وهو هادي على إشارة: يحط إيده على دراعك، وانت تحط إيدك فوق إيده يعني «شايفك — ثواني وأنا معاك»، وبعدين لازم تيجي له فعلًا في أقرب وقفة. لما إشارته تشتغل كل مرة، هيبطل صريخ المقاطعة لأن عنده طريقة أضمن منه.","say":"حط إيدك على دراعي وأنا هسمعك أول ما أخلّص الجملة دي."},{"t":"الاعتراض بأدب مسموح","d":"الأدب مش سكوت — علّمه إن من حقه يرفض ويزعل، بس بكلام محترم. تيتا عايزة تبوسه وهو مش عايز؟ من حقه يقول «مش عايز بوسة دلوقتي» بهدوء. زعلان منك؟ يقول «أنا زعلان منك يا بابا» بدل ما يرمي اللعبة. كده بيفهم إن الاحترام طريقة كلام، مش إلغاء لرأيه.","say":"اعترض براحتك — بس بكلام محترم."}],"mastery":"بيقول «لو سمحت» و«شكرًا» وبيسلّم من نفسه في أغلب المواقف.","acts":[{"t":"لعب أدوار الضيف","mat":"من غير مواد — تمثيل بس.","prep":"قبل أي عزومة حقيقية بيوم أو اتنين، في أوضته: اتفقوا إنكم هتلعبوا «ضيف وصاحب بيت».","run":"اطرق على باب الأوضة كأنك ضيف، وهو يفتح ويقول «أهلًا، اتفضل» ويمشي قدامك للصالون ويقعّدك. بعدين اقلبوا الأدوار: هو الضيف اللي بيسلّم ويستأذن قبل ما يدخل. اختم كل جولة بجملة: «الكلام الحلو بيفرّح اللي بيسمعه»."},{"t":"لعبة نقولها بأدب","mat":"عروسة أو شخصية من لعبه.","prep":"في وقت لعب هادي، هات العروسة واتفقوا إنها «بتقول جمل ناشفة» ومهمتكم تصلّحوها.","run":"خلّي العروسة تقول جمل ناشفة: «هاتي مية!»، «عايز أنزل!» — ومهمة طفلك يصلّح الجملة: «ممكن مية لو سمحت؟». بعد كام جملة اقلبوا الأدوار: هو يقول الجملة الغلط بصوت مضحك وانت تصلّحها، وانت بتلعبوا كرر السؤال: «نقولها بأدب إزاي؟». خمس جمل وضحكتين كفاية — الصيغة المؤدبة بتترسّخ من غير محاضرة واحدة."}],"say":"نستنى لحد ما الكلام يخلص.","deen":["بر الوالدين","أدب الكلام مع الكبير بيتعلم بالفرجة مش بالمحاضرة: خلّي طفلك يشوفك بتكلم أبوك وأمك بصوت حنيّن، بتقوم تسلّم عليهم، وبتقول «حاضر يا ماما» قدامه. اربطها بالقرآن ببساطة: ربنا قال عن الوالدين «وقل لهما قولًا كريمًا» (سورة الإسراء) — قولها له وانتو خارجين لزيارة الجدود: «إحنا بنتكلم مع تيتة وجدو كلام كريم عشان ربنا وصّانا». ولما يقول جملة مؤدبة لحد كبير، علّق بحب: «الكلمة دي فرّحت جدك وبتفرّح ربنا» — التكرار الحلو ده بيثبّت أكتر من أي أمر."],"skill":"الرد على التليفون بأدب: لما تيتة تتصل يقول «أهلًا يا تيتة، إزيك؟» بجملة واضحة قبل ما يديك السماعة — نفس أدب الكلام اللي بيسلّم بيه على مدرّسته كل صبح.","lvl":1,"ord":10,"tag":"أدب الكلام","src":[["قصة · عصافير مميز","من فضلك يا طبل!","https://3asafeer.com/ar/read/104/من-فضلك-يا-طبل"],["قصة · عصافير مميز","لا تنادِ الحيوانات بصوت عالٍ","https://3asafeer.com/ar/read/1402/لا-تناد-الحيوانات-بصوت-عال"]],"mistakes":[{"m":"بتلقّنه قدام الضيوف: «قول صباح الخير لطنط! قول!» وهو ساكت متكسف — التلقين العلني بيحوّل الأدب لامتحان قدام جمهور، وبيكرّهه في لحظة السلام نفسها.","fix":"التحضير قبل الموقف: في الأسانسير قبل ما الباب يفتح «هنقول إيه لطنط منى؟». ولو سكت في اللحظة، سلّم انت وعدّيها من غير تعليق — المرة الجاية بتبقى أقرب."},{"m":"بتطلب منه «لو سمحت» وهو بيسمعك بتكلم عامل الدليفري بنبرة أوامر ناشفة: «حط هنا. ماشي.» — بيتعلم إن الأدب بيطلع للأقوى بس، واللي بيخدمنا مش بياخد أدب.","fix":"نفس الصيغة اللي بتطلبها منه استعملها انت مع كل حد بيخدمكم — بالاسم و«لو سمحت» و«شكرًا» — وهو سامع."},{"m":"بتجبره يبوس ويحضن الضيوف: «بوس طنط! اديله حضن!» وهو شادد جسمه بعيد — بيتعلم إن الأدب معناه إن جسمه ملكية عامة للكبار.","fix":"اديله بدائل محترمة يختار منها: سلام بالإيد، باي من بعيد، أو «أهلًا» — الأدب بالكلام، والبوس والحضن باختياره هو."}],"adapt":[{"kid":"الخجول","how":"السلام على الضيوف عنده جبل. اتفق معاه قبل الزيارة على تحية واحدة صغيرة — يسلّم بإيده من غير كلام مثلًا — واعتبرها النجاح الكامل النهارده. وقدّمه انت للناس: «ده يوسف» بدل ما تستنى هو يتكلم. الجرعة بتزيد مع الأمان، مش مع الضغط."},{"kid":"العنيد","how":"أمر مباشر «قول لو سمحت!» هيقابله بسكوت عنيد. حوّلها قاعدة بيت على الكل مش أمر ليه هو: «في بيتنا كلنا بنقول لو سمحت» — ولما ينسى، قول انت الصيغة الصح في كلامك عادي من غير ما توقفه. أول ما تبطل تبقى معركة، هيلحقها لوحده."},{"kid":"عالي الشدة","how":"وقت الزعل بيصرخ في وش الكبار. قدّم خطوة «الاعتراض بأدب» على كل الخطوات التانية، ودرّبوا جملة «أنا زعلان منك» وهو رايق — الطفل اللي عنده طريقة مسموحة يعترض بيها مش محتاج يصرخ."}]},
{"name":"العدل والإنصاف","cat":"تعامل","age":[4,12],"how":"العدل مش دايمًا تساوي. علّمه إن كل واحد بياخد اللي يحتاجه، وده أهم من التقسيم الحسابي.","steps":[{"t":"يقسم بإيده بالتساوي","d":"كل سفرة فرصة: طبق البسكوت أو البرتقانة المقسومة شرائح — خليه هو اللي يوزّع: «واحدة لبابا، واحدة لماما، واحدة ليّا». يعد اللي قاعدين ويعد الحتت بصباعه. العدل في السن ده بيتفهم بالإيد والعين مش بالشرح، والقسمة الحسية دي هي الأساس.","say":"وزّعها بالعدل — واحدة لكل واحد."},{"t":"الدور بالترتيب دايمًا","d":"المرجيحة في الحديقة وفيه طفل مستني؟ «خمس مرجحات وبعدين دوره». مين يختار قصة النوم؟ يوم ليه ويوم ليك بنظام ثابت. لما الدور بيمشي بترتيب واضح ومحدش بيكسره — ولا انت — بيتعلم إن العدل في الوقت زي العدل في الحاجات بالظبط.","say":"دورك خلص — دلوقتي دور مين؟"},{"t":"اسمع الاتنين قبل ما تحكم","d":"الخناقة على الريموت أو العربية الحمرا بينه وبين أخوه أو ابن عمه هي حصة العدل الحقيقية: قبل ما تحكم، اسمع الاتنين بالترتيب — «انت قول حصل إيه… وبعدين انت» — حتى لو شايف اللي حصل بعينك. وبلاش الحكم الجاهز: «انت الكبير استحمل» أو الحكم لصالح اللي عيّط أعلى. الطفل اللي بيتسمع قبل الحكم بيتعلم إن العدل بيسمع الأول — وبيقلّد ده في لعبه.","say":"مش هحكم غير لما أسمعكم انتو الاتنين — واحد واحد."},{"t":"ده مش عدل — بالكلام","d":"اديله الجملة اللي يدافع بيها عن حقه: لما صاحبه ياخد دورين ورا بعض في الزحليقة، بدل العياط أو الشد يقول «ده مش عدل — ده دوري». والأهم: لما يقولهالك انت، خد كلامه بجدية — لو القسمة فعلًا كانت ظالمة صلّحها قدامه وقول «عندك حق». الجملة بتموت لو محدش بيسمعها.","say":"قول: ده مش عدل — وأنا هسمعك."},{"t":"العدل مش دايمًا تساوي","d":"بعد ما فكرة التساوي تثبت، افتح الاستثناء في مواقف حقيقية: «البيبي بياخد لبن في ببرونة وانت بتاكل مكرونة — كل واحد على قد احتياجه». «انت ليك كورة كبيرة وهو ليه خشخيشة». كده بيكبر عنده المفهوم الأعمق: الإنصاف إن كل واحد ياخد اللي يحتاجه، مش نسخة من بتاع التاني.","say":"كل واحد بياخد اللي يحتاجه."}],"mastery":"بيقسم بالعدل (حلوى، أدوار) حتى لما القسمة مش في صالحه.","acts":[{"t":"موزّع السفرة","mat":"طبق فاكهة العشا نفسه — من غير أي حاجة زيادة.","prep":"على العشا، عيّنه «موزّع السفرة» قبل ما حد يبدأ ياكل.","run":"خليه يعد اللي قاعدين — «احنا أربعة» — ويقسم الفراولة بالتساوي بإيده. لو العدد مش مظبوط (سبع فراولات على أربعة) متحلهاش له بسرعة: سيبه يتنقّع في المشكلة شوية وفكّروا سوا — نقطّع الزيادة حتت صغيرة؟ قول في الآخر: «قسمتها بالعدل — محدش خد أكتر من حد»."},{"t":"عادلة ولا مش عادلة؟","mat":"من غير مواد — لعبة حُكم بالكلام.","prep":"في العربية أو على السفرة، اتفقوا على الإشارة: صباع لفوق يعني عادلة، لتحت يعني مش عادلة.","run":"احكيله خمس مواقف قصيرة وهو يحكم بصباعه: «ولد خد البسكوت كله لوحده»، «بنت صغيرة خدت حتة أصغر عشان بطنها صغيرة»، «واحد لعب تلات أدوار ورا بعض» — واسأله مع كل موقف: «عادلة ولا مش عادلة؟ وليه؟». اتوقفوا عند الأمثلة الصعبة واتناقشوا: الحتة الأصغر للأصغر دي ظلم ولا عدل؟ هنا بالظبط بيتبني إن العدل مش دايمًا تساوي."}],"say":"نقسمها إزاي عشان تبقى عادلة؟","deen":["العدل بين الأولاد","الطفل بيحس بالعدل قبل ما يفهمه — والمراجعة هنا عليك انت قبله: بتجيب حاجة لأخوه من غير ما تجيب له؟ بتقارن بينهم قدام الناس؟ النبي ﷺ قال: «اتقوا الله واعدلوا بين أولادكم» (متفق عليه من حديث النعمان بن بشير) — فلما تقسم حلوى أو وقت لعب قدامه، اقسم بالظبط وقول بصوت مسموع: «بالعدل، زي ما النبي وصّانا». الطفل اللي بيتعامل بالعدل جوه البيت بيطلع يعدل مع صحابه من غير ما حد يقول له — القدوة المتكررة هي الدرس."],"skill":"القسمة العادلة: يقسم حبات الفراولة أو البسكوت بالتساوي على اللي قاعدين — نفس المهارة اللي بيتقاسم بيها أدوات الرسم مع أصحابه في الحضانة من غير خناقة.","lvl":3,"ord":2,"tag":"العدل والخلاف","src":[["قصة · عصافير مميز","تقسيم كعكة العيد","https://3asafeer.com/ar/read/1320/تقسيم-كعكة-العيد"],["قصة · عصافير مميز","لِمَن هذه الكرة؟","https://3asafeer.com/ar/read/1042/لـمن-هذه-الكرة-؟"]],"mistakes":[{"m":"«سيبهاله هو صغير» في كل خناقة على لعبة — بتعلّمه إن القاعدة بتتكسر للأصغر وللأعلى عياطًا، وإن العدل كلام كبار مش حقيقة بتتنفذ.","fix":"احكم بالقاعدة مش بالسن: صاحب الدور ياخد دوره كامل حتى لو الصغير عيّط — والصغير ياخد دوره بعده بنفس الالتزام."},{"m":"أي شكوى «ده مش عدل» بترد عليها «الدنيا مش عادلة» أو «متجادلنيش» — بتموّت الجملة اللي انت أصلًا عايزه يستخدمها بدل العياط والخطف.","fix":"خد الشكوى بجدية كل مرة: بص في القسمة فعلًا، لو طلعت ظالمة صلّحها وقول «عندك حق»، ولو عادلة اشرح ليه بجملة واحدة."},{"m":"بتشتري نسختين متطابقتين من كل لعبة عشان تقفل باب الخناق — بيتعلم إن أي فرق ظلم، وأول موقف الدنيا متجيبش فيه نسختين هينهار.","fix":"ساوي في الأساسيات، وسمّي الفرق باحتياجه: «انت ليك مقص عشان بتعرف تقص — هو لسه بدري عليه»."}],"adapt":[{"kid":"الحساس","how":"«مش عدل» بتقعد في قلبه حتى بعد ما الموقف يعدي. لما تكتشف إنك حكمت عليه من غير ما تسمعه، الإصلاح لازم يتسمى بوضوح: «أنا حكمت قبل ما أسمعك ودي غلطتي أنا» — الجملة دي بتصلّح عنده أكتر من أي تعويض."},{"kid":"العنيد","how":"هيفاصل في كل قسمة ويعيد عد الحتت. بدل ما تفضل انت الحكم اللي بيتفاصل معاه، ثبّت نظام محايد: «واحد يقسم والتاني يختار الأول» — القاعدة دي بتخلي القسمة العادلة في مصلحته هو، فبيعدل من غير أوامر منك."},{"kid":"عالي الشدة","how":"نهاية الدور بتولّع نوبة كاملة. الإنذار قبل النهاية مش رفاهية معاه: «كمان مرجحتين وبعدين دور الطفل التاني» — وحط تايمر رملي قدام عينه للدور الجاي، عشان يشوف بعينه إن حقه راجع مش ضايع."}]},
{"name":"حفظ اللسان","cat":"تعامل","age":[4,12],"how":"القاعدة لازم تشمل الكبار. لو فيه ألقاب بين الكبار في البيت، مفيش كلام هيفرق.","steps":[{"t":"قاعدة تشمل الكبار","d":"اتفقوا بصوت عالي: «في بيتنا مفيش ألقاب ولا سخرية» — والاختبار الحقيقي عليك انت. لو قلت «يا غبي» للسواق اللي قطع عليك وطفلك في الكرسي الخلفي، القاعدة وقعت. ولو فلتت منك، صحّح نفسك بصوت مسموع: «أنا قلت كلمة مش حلوة — آسف». تصحيحك لنفسك قدامه أقوى درس في الباب ده.","say":"في بيتنا مفيش ألقاب — ولا احنا الكبار."},{"t":"كلمة الحضانة الجديدة — من غير جمهور","d":"هيرجع يوم من الحضانة بكلمة وحشة ويقولها على السفرة — دي لحظة الاختبار: لو ضحكت بقت فقرة كوميدية هيعيدها لكل ضيف، ولو انفجرت فيه بقت سلاح مضمون يولّعك في ثانية. الرد الصح: وش محايد وصوت ممل — «دي كلمة مش بنقولها في بيتنا» — وكمّل الكلام عادي. الكلمة اللي ملقتش جمهور، لا ضحك ولا صدمة، بتموت لوحدها في كام يوم.","say":"دي كلمة مش بنقولها في بيتنا — المهم، عملتوا إيه النهارده في الحضانة؟"},{"t":"الكلمة بتوجع زي الخبطة","d":"وقت الموقف نفسه: قال لأخوه «انت وحش» وأخوه عيّط؟ ودّيه يبص في وشه وقول بهدوء: «شوف وشه — الكلمة دي وجعته زي الخبطة بالظبط، بس من جوه». الربط بين الكلمة والوجع اللي باين على وش التاني هو اللي بيبني الوعي — مش الزعيق فيه ولا تكسيفه قدام الناس.","say":"بص في وشه — الكلمة وجعته زي الخبطة."},{"t":"بديل وقت الغضب","d":"الغضب مسموح، الكلمة الجارحة لأ — بس لازم تديله البديل وتتمرنوا عليه وهو هادي، مش وقت النوبة. اقعدوا وقت اللعب واتفقوا: لما تزعل قول «أنا زعلان منك!» أو «مش عاجبني كده!» بصوت عالي براحتك. ولما ينطق البديل في الخناقة الجاية بدل الكلمة الوحشة، سمّيها: «انت قلت زعلك بكلام من غير ما تجرح».","say":"قول: أنا زعلان — من غير كلمة تجرح."},{"t":"كلمة حلوة كل يوم","d":"اللسان اللي اتعوّد الحلو بيتقل عليه الوحش. عادة يومية صغيرة: يقول كلمة حلوة حقيقية لحد حقيقي — «رسمتك حلوة» لصاحبه في الحضانة، «الأكل جميل يا ماما» على الغدا. افتحها معاه الصبح وهو بيلبس وخليه هو اللي يختار هيقولها لمين.","say":"هنقول لمين كلمة حلوة النهارده؟"}],"mastery":"الكلمة الوحشة اختفت من كلامه — ولو سمعها بيقول «دي كلمة مش حلوة».","acts":[{"t":"تجربة معجون الأسنان","mat":"أنبوبة معجون أسنان وطبق.","prep":"في وقت هادي في المطبخ — مش بعد موقف كلمة جارحة، عشان التجربة تبقى درس مسبق مش عقاب.","run":"اعصر شوية معجون على الطبق وقوله: «رجّعه جوه الأنبوبة تاني» — هيحاول بصوابعه ومش هيعرف. ساعتها قول الجملة: «الكلام زي المعجون — بيطلع في ثانية وعمره ما بيرجع، عشان كده بنفكر قبل ما نتكلم». تجربة دقيقتين بتتفتكر سنين — ورجّعها بكلمة واحدة كل ما كلمة جارحة تطلع: «فاكر المعجون؟»."},{"t":"برطمان الكلمات الحلوة","mat":"برطمان فاضي وورق ملون مقصوص حتت صغيرة.","prep":"حطوهم على رف في المطبخ يوصله كل حد في البيت، واشرحوا القاعدة للعيلة كلها مرة واحدة.","run":"كل ما حد في البيت يسمع كلمة حلوة من حد — طفلك قال لماما «سفرتك حلوة»، انت قلت له «انت ساعدتني بجد» — اللي سمعها يحط ورقة في البرطمان ويقول: «دي كلمة حلوة تتحسب». آخر الأسبوع بصّوا عليه سوا وافتكروا الكلمات نفسها. مفيش جايزة ولا حلوى — البرطمان المليان نفسه هو الفرحة."}],"say":"الكلمة بتوجع زي الخبطة.","deen":["الكلمة الطيبة صدقة","علّمه إن الكلمة الحلوة عبادة ليها ثواب زي الصدقة بالفلوس: النبي ﷺ قال «والكلمة الطيبة صدقة» (متفق عليه من حديث أبي هريرة). حوّلها لعادة يومية: «صدقة النهارده كلمة حلوة — هنقولها لمين؟» واقترحوا سوا: لماما على الأكل، لعم الأمن تحت العمارة. والأهم إن لسان الطفل نسخة من لسان البيت — لو الكلمة الوحشة مش موجودة في كلامك انت وقت غضبك، هتختفي من كلامه هو. الكلمة الحلوة بتتحب وبتتقلد — مش بتتفرض بالتخويف."],"skill":"الاعتذار عن الكلمة الجارحة: لو قال كلمة وحشة لأخوه يرجع يقول «آسف، الكلمة دي وحشة» — نفس المهارة اللي هتحمي صداقاته في الحضانة لما لسانه يسبقه.","lvl":3,"ord":3,"tag":"أدب الكلام","src":[["قصة · عصافير مميز","لا مزيد من المضايقات","https://3asafeer.com/ar/read/1083/لا-مزيد-من-الـمضايقات"],["قصة · عصافير مميز","مجرّد كلمة","https://3asafeer.com/ar/read/1633/مجرد-كلمة"]],"mistakes":[{"m":"أول مرة قال كلمة وحشة العيلة ضحكت — «شوفت بيقول إيه» — وبعد أسبوع بقيتوا بتعاقبوه على نفس الكلمة اللي صقّفتوله عليها.","fix":"من أول مرة: وش محايد وصوت عادي «دي كلمة مش بنقولها» وغيّر الموضوع — الكلمة من غير جمهور بتموت في أيام."},{"m":"عقاب كبير على الكلمة — حرمان من التابلت أسبوع أو زعيق قدام الضيوف — كده الكلمة بقت أقوى ورقة في إيده: مضمونة إنها تولّعك في ثانية.","fix":"الرد البارد الممل هو اللي بيسحب قوتها. الشغل الحقيقي على بديل وقت الغضب: «قول أنا زعلان بأعلى صوتك — دي مسموحة»."},{"m":"الكبار في البيت بيتريقوا على بعض «هزار» — ألقاب بين بابا وماما، تقليد لهجة حد في المكالمات — وبعدين بتحاسبوه هو على كلمة.","fix":"قاعدة اللسان على الكل بلا استثناء، ولو فلتت منك قدامه صحّح نفسك بصوت مسموع: «قلت كلمة مش حلوة — آسف»."}],"adapt":[{"kid":"عالي الشدة","how":"الكلمة الجارحة بتطلع منه وقت الانفجار مش عن قصد. اشتغل على تنفيس الغضب نفسه الأول — نفس، ركن هدوء، و«أنا زعلان!» بأعلى صوته مسموحة — وبعد ما جسمه يتعلم يهدى، لسانه هيلحق. محاسبته على اللفظ وهو في نص النوبة بتزود النار بس."},{"kid":"العنيد","how":"لو اكتشف إن الكلمة بتولّعك هيكررها كأداة في المعركة. اسحب الجايزة: نفس الرد الممل بالظبط كل مرة، من غير وش مصدوم ولا مفاوضات — الكلمة اللي مش بتجيب حاجة بتتساب لوحدها."},{"kid":"الخجول","how":"غالبًا مش هو اللي بيقول الكلمة — هو اللي بتتقال له في الحضانة وبيسكت ويبلعها. درّبه على رد جاهز: «دي كلمة مش حلوة — أنا مش بحبها» بصوت ثابت، والعبوها تمثيل في البيت لحد ما تبقى سهلة على لسانه."}]},
{"name":"الوفاء بالوعد","cat":"تعامل","age":[4,12],"how":"وعودك أنت هي المنهج. طفل اتوعد ومااتنفذش مش هيفهم قيمة الوعد مهما شرحت.","steps":[{"t":"كلمة وعد ليها وزن عندك انت","d":"«هننزل الحديقة بعد العصر» — دي عندك كلمة عابرة وعنده وعد مقدس. فرّق قدامه بين الاتنين بلسانك: لو مش متأكد قول «مش هوعدك — لو خلصت شغلي بدري هننزل»، ولو واعد قولها بوضوح «أنا بوعدك» ونفّذ. ولو ظرف حقيقي كسر الوعد، اعتذر بجد وحدد بديل بميعاد: «وعدتك ومقدرتش — بكره بعد الحضانة على طول». وبلاش نهائي جمل التطنيش زي «بكره نشوف» — دي بتعلّمه إن الكلام سايح والوعود بتتنسي.","say":"أنا مش بوعد غير لما أكون متأكد — ولو وعدت بنفّذ."},{"t":"هو كمان يوعد","d":"خليه يقف على الناحية التانية: «توعدني تلم المكعبات بعد القصة؟». لو نفّذ، سمّي الفعل: «انت وعدت ونفّذت — ده اسمه وفاء بالوعد». لو نسي، فكّره من غير لوم ولا تريقة: «انت وعدت — والوعد بننفّذه»، وقف جنبه لحد ما يخلصها. الوعد الصغير المنفّذ هو اللي بيبني عادة الكلمة.","say":"انت وعدت ونفّذت — ده الوفاء بالوعد."},{"t":"الوعد يتشاف ويتشطب","d":"حوّل الوعد من كلام في الهوا لحاجة تتشاف: ورقة على التلاجة، أي وعد يتقال في البيت — منك أو منه — يترسم له رمز صغير (كورة يعني هنلعب كورة). ولما يتنفّذ، اللي وعد يشطبه بإيده قدام الكل. بعد أسبوعين هيبقى عنده دليل مرئي إن الكلام في بيتكم بيتنفّذ.","say":"اتنفّذ الوعد — تعالى نشطبه سوا."}],"mastery":"بيفتكر الوعود: «انت وعدت» — وبينفّذ اللي هو وعد بيه.","acts":[{"t":"وعد الصبح","mat":"من غير مواد.","prep":"على الفطار كل يوم، اختار وعد واحد صغير ومحدد وقابل للتنفيذ في نفس اليوم.","run":"اوعده على الفطار: «بوعدك نقرا قصتين قبل النوم النهارده». وساعة التنفيذ بالليل افتكرها بصوت عالي: «فاكر وعد الصبح؟ أهو بيتنفّذ». أسبوعين على النظام ده بيبنوا جواه يقين إن الكلمة في بيتكم ليها قيمة."},{"t":"لوحة الوعود","mat":"ورقة كبيرة وقلم ومغناطيس على التلاجة.","prep":"قسّم الورقة عمودين — «وعود بابا وماما» و«وعود» باسم طفلك — وعلّقوها على التلاجة.","run":"أي وعد يتقال في البيت يترسم له رمز بسيط هو اللي يختاره. ولما الوعد يتنفّذ، اللي وعد يشطبه بإيده قدام الكل. مرة في الأسبوع بصّوا على اللوحة سوا وقول: «في بيتنا اللي بنقوله بنعمله»."}],"say":"أنا وعدت، يبقى هعمل.","deen":["إن شاء الله","في بيوت كتير «إن شاء الله» بقت طريقة مؤدبة لقول لأ — ومهمتك ترجّعها لمعناها الحقيقي قدام طفلك: أنا ناوي بجد، وبستعين بربنا. ربنا علّمنا في القرآن إننا منقولش هنعمل حاجة بكره من غير «إن شاء الله» (سورة الكهف). فقولها وانت ناوي فعلًا ونفّذ، وعلّق بعد التنفيذ: «قلنا إن شاء الله وربنا سهّلها — أهو حصل». ولو ظرف حقيقي منع التنفيذ اشرح له: «كنت ناوي بجد بس ربنا قدّر غير كده — نعوضها بكره» — كده بيتعلم إنها صدق واستعانة، مش باب هروب من الوعد."],"skill":"التخطيط والتنفيذ: يقرر الصبح حاجة صغيرة — «هرسم رسمة لتيتة النهارده» — وينفذها فعلًا قبل النوم، نفس عضلة «كلمتي بتتنفذ» اللي هيسلّم بيها واجباته في المدرسة بعدين.","lvl":3,"ord":4,"tag":"","src":[["قصة · عصافير مميز","ماذا تريد ماما؟","https://3asafeer.com/ar/read/1330/ماذا-تريد-ماما؟"],["قصة · عصافير مميز","لا تنسَ أن","https://3asafeer.com/ar/read/1136/لا-تنس-أن"]],"mistakes":[{"m":"بتستخدم الوعد مسكّنة في المحل: «هنجيبها بكره» وانت ناوي تنسى — بتشتري سكوت اللحظة بثقته في كلمتك كلها، وبعد كام مرة «بكره» هتبقى عنده معناها «أبدًا».","fix":"قول الحقيقة واستحمل الزعل: «مش هنشتريها» — زعل ساعة أهون من طفل مبقاش مصدق وعدك."},{"m":"بتوعد بشروط سايحة مستحيل تتقاس: «لو فضلت كويس طول الأسبوع هجيبلك عجلة» — محدش عارف يعني إيه كويس، وآخر الأسبوع بتبقى خناقة تفسير مش وفاء.","fix":"وعود صغيرة قريبة محددة: «لو لميت المكعبات قبل العشا نقرا حدوتتين بدل واحدة» — بتتقاس وبتتنفذ في نفس اليوم."},{"m":"لما ينسى وعده بتسجّل عليه نقطة: «شفت؟ انت كمان بتنسى!» — حوّلت الوعد لمباراة تصيّد بينكم بدل قيمة مشتركة.","fix":"فكّره من غير شماتة: «انت وعدت تلم المكعبات — يلا أقف معاك لحد ما تخلص»."}],"adapt":[{"kid":"الحساس","how":"الوعد اللي وقع بيتسجل عنده جرح مش موقف عابر. «معلش بقى» مش بتصلّح — الاعتذار لازم يسمّي: «أنا وعدتك بالحديقة ومروحناش، وده ضايقك» + بديل بميعاد محدد بيتنفذ فعلًا."},{"kid":"كثير الحركة","how":"بيوعد بحماس وينسى بعد دقيقتين — النسيان مش استخفاف. خلي لوحة التلاجة ذاكرته الخارجية: أول ما يوعد ارسموا رمز الوعد فورًا، ولما ينسى شاور على الورقة بدل اللوم: «بص على التلاجة — فيه وعد مستنيك»."},{"kid":"العنيد","how":"لو «انت وعدت!» بقت عصاية بتلزّقه بيها كل يوم، هيبطل يوعد أصلًا. خلي الوعد اختيار حقيقي: اسأله «توعد ولا لسه مش متأكد؟» واحترم «مش متأكد» زي ما بتحترم الوعد — الوعد اللي طلع بإرادته هو اللي بينفّذه."}]},
{"name":"التعاون","cat":"تعامل","age":[4,12],"how":"مهام محتاجة اتنين بالضرورة — لو يقدر يعملها لوحده مش هيتعلم التعاون منها.","steps":[{"t":"مهمة محتاجة اتنين","d":"اختار مهام مستحيلة لوحده بطبيعتها: طيّ الملاية — واحد ماسك طرف وواحد طرف، لوحده هتقع على الأرض. شيل الكرتونة الكبيرة، فرد مفرش السفرة. لو المهمة ينفع يعملها لوحده مش هيتعلم منها تعاون — الاحتياج الحقيقي للتاني هو الدرس نفسه.","say":"دي محتاجة اتنين — تعالى نمسكها سوا."},{"t":"أدوار قبل ما نبدأ","d":"قبل أي شغل مشترك، وقفة اتفاق نص دقيقة: «مين يعمل إيه؟ انت تناولني المشابك وأنا أنشر». الاتفاق المسبق بيمنع الخناق في النص وبيعلّمه إن الشغل الجماعي بيتخطط مش بيتخبط. ولو حب يبدّل دوره في النص، الاتفاق يتجدد بالكلام: «طيب نبدّل — انت تنشر الشرابات وأنا أناول».","say":"مين يعمل إيه؟ نتفق قبل ما نبدأ."},{"t":"سمّي التعاون لحظته","d":"الوعي بيبدأ بالتسمية وقت الحدوث: وانتوا طالعين شنط السوبرماركت من العربية — «أنا شيلت التقيل وانت شيلت العيش، شفت خلصنا بسرعة إزاي؟ ده اسمه تعاون». الكلمة اللي بتتقال والإحساس بالإنجاز المشترك لسه سخن هي اللي بتترسّخ — مش محاضرة بعدها بساعة.","say":"خلصنا بسرعة عشان اتعاونّا."},{"t":"لعب هدفه مشترك","d":"حوّل اللعب من «مين يكسب» لـ«احنا ضد المهمة»: نبني أطول برج مكعبات سوا قبل ما التايمر الرملي يخلص، نلم كل حاجة حمرا في الأوضة احنا الاتنين ضد الساعة. لما تنجحوا قول «كسبنا احنا الاتنين». الفوز الجماعي ده بينقل التعاون من شغل البيت للعب — ومن البيت للحضانة.","say":"احنا فريق — كسبنا سوا."},{"t":"مهمة سوا مع طفل تاني","d":"بعد ما التعاون اشتغل معاك، انقله لطفل تاني: ابن عمه جاي؟ اديهم مهمة واحدة بأدوار متفق عليها قبل ما تسيبهم — «انت تمسك الكيس وهو يحط المكعبات»، «واحد يفرش الملاية وواحد يحط المخدات لبيت الخيمة». اقف قريب أول مرة وسمّع الأدوار، وبعدين ابعد بالتدريج. ولو اتخانقوا في النص متحلش بدالهم — رجّعهم للاتفاق: «انتو اتفقتوا مين يعمل إيه؟».","say":"انتو الاتنين فريق واحد — اتفقوا مين يعمل إيه وابدأوا."}],"mastery":"بيكمل في الشغل الجماعي (يسلّم المشابك، يشيل معاك) لحد ما المهمة تخلص.","acts":[{"t":"نشر الغسيل بأدوار","mat":"سبت الغسيل والمشابك والمنشر.","prep":"اتفقوا على الأدوار قبل البدء: هو يناولك قطعة قطعة ومعاها مشبكين، وانت تنشر.","run":"نفذوا الأدوار المتفق عليها لحد ما السبت يفضى. بعد أسبوع بدّلوا: هو ينشر الحاجات الصغيرة — الشرابات والمناديل — على رف واطي وانت تناوله. قول وانتوا بتخلصوا: «انت بتناول وأنا بنشر — من غيرك كنت هتأخر»."},{"t":"سلطة الفريق","mat":"خيار وطماطم، مصفاة، سكينة ليك انت، طبق ومعلقة.","prep":"قبل ما تبدأوا، قسّموا الأدوار بصوت عالي: هو يغسل في المصفاة، انت تقطّع بالسكينة، هو يحط في الطبق ويقلّب بالمعلقة.","run":"نفذوا الأدوار بالترتيب: هو يغسل الخيار والطماطم، انت تقطّع، وهو يرصّ في الطبق ويقلّب بالمعلقة. لما السلطة تنزل السفرة سمّوها «سلطة الفريق» باسمكم الاتنين، وقول قدام الكل: «من غيره السلطة دي مكنتش هتخلص»."}],"say":"دي محتاجة اتنين.","deen":["وتعاونوا على البر والتقوى","اربط التعاون بالدين من خلال موقف حصل فعلًا في اليوم، مش بدرس نظري: لما تشيلوا سوا سبت الغسيل قول: «ربنا قال في القرآن وتعاونوا على البر والتقوى (سورة المائدة) — إحنا كده بنعمل اللي ربنا بيحبه». واحكيله إن النبي ﷺ نفسه كان بيساعد في شغل بيته — «كان في مهنة أهله» زي ما روى البخاري — يعني أعظم إنسان كان بيتعاون في بيته بإيده. لما المساعدة تتربط بالحب والاقتداء بالنبي، بتبقى فخر مش تكليف."],"skill":"إتمام دوره في مهمة جماعية: يفضل يناولك المشابك واحد واحد لحد ما آخر قطعة غسيل تتنشر — نفس المهارة اللي هيشتغل بيها مع مجموعته في أنشطة الحضانة.","lvl":2,"ord":9,"tag":"المشاركة والدور","src":[["قصة · عصافير مميز","من صنع الفطيرة؟","https://3asafeer.com/ar/read/231/من-صنع-الفطيرة؟"],["قصة · عصافير مميز","حكاية حبل","https://3asafeer.com/ar/read/899/حكاية-حبل"]],"mistakes":[{"m":"بتسحب المهمة منه في النص لما يبطّأ: بيطوي الملاية بالعكس فبتاخدها — «هات أنا أخلص» — الرسالة اللي وصلته: مشاركتك شكلية، أنا بستحملك مش محتاجك.","fix":"استحمل الطية العوجة والبطء — البطء ده هو التدريب نفسه، والملاية مش لازم تطلع مظبوطة."},{"m":"التعاون في بيتكم اتجاه واحد: هو بيساعدك انت في شغلك، وعمره ما شافك بتدخل تساعده في مهمته هو بشروطه هو.","fix":"اعكسها مرة في الأسبوع: ادخل جراج العربيات بتاعه واسأله «تحب أساعدك في إيه؟» وسيبه هو اللي يوزّع الأدوار عليك."},{"m":"بتحوّل الشغل المشترك لسلسلة أوامر: «هات. امسك. لا مش كده. ادي» — ده تنفيذ تعليمات مش تعاون، ومفيهوش قرار واحد ليه هو.","fix":"الاتفاق قبل البداية: «مين يعمل إيه؟» وخليه يختار دوره بنفسه — حتى لو اختار الأصعب عليه."}],"adapt":[{"kid":"كثير الحركة","how":"المهمة الطويلة الثابتة هتفقده في دقيقة. اديله الأدوار الحركية — يجري يجيب المشابك، يوصّل الأطباق للسفرة — وقسّم الشغل لجولات قصيرة بنهاية بتتشاف: «الجولة دي المخدات بس»."},{"kid":"العنيد","how":"«أنا لوحدي!» جملته المفضلة. متتخانقش مع الاستقلال — استخدمه: اختار مهام مستحيلة فيزيائيًا لوحده (طرفين الملاية، الكرتونة التقيلة)، وسيبه يجرب لوحده الأول ويكتشف بنفسه إنها محتاجة اتنين — بعدها عرضك للمساعدة بيبقى إنقاذ مش فرض."},{"kid":"الخجول","how":"التعاون مع أطفال تانيين هو الجزء الصعب عليه. ابدأ بطفل واحد بس يعرفه كويس — ابن عمه — وبأدوار انت وزعتها جاهزة قبل ما يبدأوا، عشان مايتحطش في موقف تفاوض هو لسه مش قده."}]},
{"name":"احترام الاختلاف","cat":"تعامل","age":[4,12],"how":"بالتعرّض مش بالشرح: أطفال مختلفين، أكل مختلف، لهجات مختلفة، وتعليق إيجابي بسيط.","steps":[{"t":"«شبه ومختلف» في العيلة","d":"ابدأ بحد قريب منه: افتح صور الموبايل وطلّع صورة له وصورة لابن عمه أو لبابا، واسأله: «انتو شبه بعض في إيه؟ ومختلفين في إيه؟». هيقول حاجات زي «احنا الاتنين بنحب الكورة» و«هو أطول مني» — كده الاختلاف بقى حقيقة عادية بيلعب بيها، مش حاجة غريبة بيتكسف منها.","say":"انت وابن عمك شبه بعض في إيه؟ ومختلفين في إيه؟"},{"t":"كلامك عن الناس هو المنهج","d":"طفلك بياخد نظرته للناس المختلفة من كلامك على السفرة وفي العربية، مش من أي درس. لو بيسمعك بتقلّد لهجة حد «هزار» أو بتقول «بتوع البلد الفلانية كذا»، هيقلّد. اعكسها: اسبقه بالتعليق الإيجابي — صاحبه في الحضانة بيكلم مامته بلغة تانية؟ قول قدامه «صاحبك بيتكلم لغتين؟ ده جامد». وسلّم على عامل الدليفري وعم الأمن بنفس احترامك لصحابك — تعليقاتك الصغيرة دي هي اللي بتحدد نظرته.","say":"صاحبك بيتكلم لغتين — ده شيء جامد."},{"t":"عيشوا الاختلاف بدل ما تشرحه","d":"حواليكم في الإمارات فرصة مش موجودة في أي حتة: جرّبوا سوا أكلة من مطبخ صاحبه — برياني أو نودلز — وقول «دي أكلة بيت صاحبك، نجرّبها؟». اتعلموا سوا كلمة «شكرًا» بلغة زميله في الحضانة ويقولهاله تاني يوم. واعزم زميل مختلف يلعب في بيتكم. الطفل اللي الاختلاف جزء من أكله ولعبه مش محتاج محاضرة عن التسامح.","say":"تعالى نتعلم يعني إيه شكرًا بلغة صاحبك — ونقولهاله بكره."},{"t":"التعليق الجارح يتصلّح بهدوء","d":"لو شاور في المول على حد شكله مختلف — لابس لبس مختلف أو قاعد على كرسي متحرك — وقال بصوت عالي «ليه ده كده؟»، متكسفوش قدام الناس ومتزعقلوش. انزل لمستوى عينيه وقول بهدوء «الناس أشكال وده طبيعي»، وفي البيت ارجعوا للموقف: بنسأل بأدب، ومنشاورش على حد بصوابعنا.","say":"الناس مختلفين في شكلهم وكلامهم — وده اللي بيخلّي الدنيا حلوة."}],"mastery":"بيتعامل عادي مع طفل مختلف (شكل، لغة، أكل) من غير تعليق جارح.","acts":[{"t":"لعبة «شبه ومختلف» بالصور","mat":"موبايلك وعليه صور أفراد العيلة وصحابه في الحضانة.","prep":"في وقت هادي على الكنبة، اجمع الصور قبلها في ألبوم واحد عشان التقليب يبقى سلس.","run":"اعرض عليه الصور صورة صورة، وكل صورة اسأله سؤالين: «ده شبهك في إيه؟» و«مختلف عنك في إيه؟». ساعده يطلع حاجات من جوه («بيحب الرسم زيي») مش بس الشكل. اختم كل مرة بنفس الجملة: «كلنا مختلفين، وده حلو»."},{"t":"سفرة من بلد تانية","mat":"أكلة من بلد تاني — برياني هندي أو نودلز من أي مطعم جنبكم.","prep":"اختار يوم ثابت في الأسبوع تجيبوا فيه الأكلة، وحطها على السفرة جنب أكلكم العادي.","run":"وانتو بتاكلوا اسأله: «مين في حضانتك بياكل الأكل ده في بيتهم؟». وقول له: «احنا بناكل ملوخية وهما بياكلوا برياني — كل بيت وليه أكله، ونجرب من بعض»."}],"say":"كلنا مختلفين، وده حلو.","deen":["وجعلناكم شعوبًا وقبائل لتعارفوا","الآية دي جاهزة للموقف: ربنا قال «وجعلناكم شعوبًا وقبائل لتعارفوا» (سورة الحجرات) — يعني الاختلاف مش غلطة، ده مقصود عشان نتعرف على بعض. وانتو في الإمارات عايشين الآية دي كل يوم: قدام أي اختلاف يلاحظه طفلك — لون، لغة، أكل، لبس — قول بنبرة إعجاب مش تبرير: «ربنا خلقنا مختلفين عشان نتعرف على بعض». كرر نفس الجملة في كل موقف حقيقي، وهتلاقيه هو اللي بيقولها قدام الاختلاف الجاي — الاحترام بيتبني بالتكرار الحي مش بمحاضرة."],"skill":"التعارف: يسلّم على طفل جديد، يقول اسمه ويسأله عن اسمه — نفس المهارة اللي بيكوّن بيها صحاب في حضانة فيها أطفال من بلاد مختلفة.","lvl":3,"ord":5,"tag":"الصداقة والجيرة","src":[["قصة · عصافير مميز","متشابهون ولكنّا مختلفون","https://3asafeer.com/ar/read/211/متشابهون-ولكنا-مختلفون"],["قصة · عصافير مميز","عين مختلفة","https://3asafeer.com/ar/read/1427/عين-مختلفة"]],"mistakes":[{"m":"لما يسأل بصوت عالي في المول «ليه الراجل ده قاعد على كرسي بعجل؟» بتشششش عليه وتجرّه بعيد بوش مكسوف — اتعلم إن الاختلاف حاجة مخيفة ممنوع نتكلم فيها.","fix":"جاوب في اللحظة ببساطة وصوت عادي: «رجليه تعبانة والكرسي بيساعده يتحرك» — الإجابة الهادية بتقوله إن سؤاله مشروع والموضوع طبيعي."},{"m":"بتقلّد لهجات قدامه «هزار» — لهجة الشغالة، نطق زميلك الهندي للعربي — وبعدين بتتصدم لما يعملها هو في الحضانة في وش صاحبه.","fix":"قاعدة واحدة تبدأ بيك انت: لهجات الناس ولغاتهم مش نكتة في بيتكم — ولو فلتت منك، صحّح نفسك قدامه بصوت مسموع."},{"m":"بتحاضر بالمجردات: «كلنا إخوات والناس كلها زي بعضها» — كلام بيتبخر لأنه ملوش صورة، وبيتكسر أول ما يشوفك بتتعامل بعكسه.","fix":"بدّل المحاضرة بتعليق صغير في موقف حقيقي: «صاحبك بياكل بإيده واحنا بناكل بالمعلقة — كل بيت وطريقته»."}],"adapt":[{"kid":"عالي الشدة","how":"ملاحظاته بتطلع بأعلى صوت وفي وش صاحبها. علّمه قاعدة «السؤال في ودني»: الأسئلة عن شكل الناس نقولها لبابا بصوت واطي أو نستناها للبيت — مش عشان عيب، عشان ممكن تضايق. ودرّبوها كلعبة همس في البيت قبل ما تخرجوا."},{"kid":"الخجول","how":"مش هيعلّق جارح — هو هيستخبى ورا رجلك من الطفل المختلف. متجبروش يسلم عليه — قرّبه بالتعرّض البطيء: لعب متوازي جنب الطفل التاني من غير طلب تفاعل، وسيب الفضول ياخد وقته."},{"kid":"كثير الحركة","how":"قعدة صور الموبايل مش هتكمل معاه دقيقتين. العب «شبه ومختلف» في الحركة: في العربية على الرايح للحضانة أو وانتو ماشيين في الحديقة — «مين شبه مين في إيه؟» — أسرع وأخف وبنفس الأثر."}]},
{"name":"الضيافة","cat":"تعامل","age":[4,12],"how":"تُمارَس مش تُشرَح. اديه دور حقيقي وقت الضيوف: يفتح الباب أو يقدّم المياه.","steps":[{"t":"التجهيز للضيف سوا","d":"قبل ما عمو أو طنط يوصلوا بساعة، نادِ طفلك للمطبخ: هو اللي يرص التمر في الطبق ويحط البسكوت في الصحن. وانتو بتجهزوا قول له ليه بنعمل كده: «الضيف عندنا غالي، بنجهز له أحسن حاجة عندنا». التجهيز بإيده بيخليه شريك في الإكرام مش متفرج عليه.","say":"عندنا ضيف النهارده — تعالى نجهّز له سوا."},{"t":"دور تقديم ثابت ليه","d":"اديله دور واحد محدد في كل زيارة: هو اللي يقدّم المياه. حط ازازتين مياه صغيرين على صينية بلاستيك خفيفة، وامشي جنبه أول مرة لحد ما يوصلها للضيف. بعد كام زيارة الدور ده هيبقى بتاعه من غير ما حد يقول له.","say":"انت اللي هتقدّم المياه لطنط — امسك الصينية بإيدك الاتنين."},{"t":"السلام والتوديع من شغله","d":"خليه يقف جنبك عند الباب لما الضيف يدخل ويقول «السلام عليكم، اتفضل»، وفي آخر الزيارة يمشي معاكم لحد الباب ويقول «مع السلامة». دايرة الضيافة الكاملة — استقبال وتقديم وتوديع — هي اللي بتثبّت المعنى، مش التقديم لوحده.","say":"تعالى نوصّل عمو للباب ونقول له: مع السلامة، نوّرتنا."},{"t":"ضيفه الصغير هو","d":"لما الضيوف جايين بأطفالهم، طفلك عنده ضيافة من نوع تاني: قبل ما يوصلوا، خليه يختار لعبتين غاليين عليه يطلعهم بإيده على رف عالي، والباقي متاح لضيفه الصغير. ولما يوصلوا، هو اللي ياخد الطفل التاني لركن اللعب ويوريه اللعب — زي ما بابا بيقعّد عمو على الكنبة بالظبط. كده الضيافة بقت بتاعته هو، مش بتاعة الكبار بس.","say":"ده ضيفك انت — ورّيه اللعب واختاروا تلعبوا بإيه."},{"t":"يتدرّب وهو الضيف","d":"لما تزوروا حد، اقلب الدور: قبل ما تخبطوا الباب فكّره «احنا دلوقتي ضيوف — بنستأذن قبل ما ناخد حاجة، ومنفتحش أوض من غير إذن». ولما صاحب البيت يقدّم له عصير، فكّره ياخده ويقول شكرًا. اللي اتدرّب عليه كمضيف في بيتكم بيفهمه أعمق لما يعيشه كضيف عند الناس.","say":"احنا ضيوف هنا — بنستأذن الأول، وناخد الحاجة ونشكر."}],"mastery":"لما ييجي ضيف بيقوم من نفسه يسلّم ويقدّم حاجة.","acts":[{"t":"حفلة عرايس بضيافة كاملة","mat":"العرايس والدباديب بتوعه، صينية صغيرة، كوبايات بلاستيك وبسكوت.","prep":"في أوضته وقت اللعب: رصّوا العرايس على المرتبة كأنهم ضيوف، وجهّزوا الصينية سوا.","run":"هو يخبط لهم الباب الوهمي ويقول «اتفضلوا»، يقدّم لكل ضيف من الصينية، وفي الآخر يودّعهم عند باب الأوضة. العب انت دور ضيف واطلب «كوباية مية لو سمحت» عشان يتمرن على الرد والتقديم."},{"t":"صينية التقديم الحقيقية","mat":"صينية بلاستيك خفيفة وازازتين مياه صغيرين.","prep":"قبل أول زيارة جاية لبيتكم، جهّز معاه الصينية واتفقوا إن التقديم ده دوره هو.","run":"أول ما الضيف يقعد، اديله الصينية وقول قدام الضيف: «اتفضل يا عمو، ده صاحب البيت الصغير». لو وقعت منه ازازة متعلقش على الوقعة — قول «نجيب غيرها» وكمّلوا عادي."}],"say":"الضيف عندنا نكرمه.","deen":["إكرام الضيف من الإيمان","النبي ﷺ ربط الضيافة بالإيمان نفسه: «من كان يؤمن بالله واليوم الآخر فليكرم ضيفه» (متفق عليه من حديث أبي هريرة) — قولها لطفلك ببساطة: «إحنا بنكرم ضيفنا عشان ده من إيماننا بربنا». وخليها فعل مش كلام: قبل ما أي حد ييجي، مهمة ثابتة ليه — يحط التمر في الطبق أو يوزع العصير بإيده. ولما يقدّم، اربط الفرحة بالدين قدامه: «شفت الضيف فرح؟ ربنا بيحب اللي يكرم ضيفه» — بالتكرار، الضيافة بتبقى جزء من هويته مش واجب اجتماعي وبس."],"skill":"التقديم للضيف: يمسك الصينية ويقدّم المية أو التمر لكل ضيف بإيده — نفس الثقة اللي بيقف بيها قدام ناس كبار ويتصرف، بدل ما يستخبى ورا رجلك.","lvl":3,"ord":6,"tag":"الصداقة والجيرة","src":[["قصة · مجاني","حفلة في الغابة","https://3asafeer.com/ar/read/26/حفلة-في-الغابة"],["قصة · عصافير مميز","تسعة وثلاثون ضيفًا!","https://3asafeer.com/ar/read/708/تسعة-وثلاثون-ضيفا"]],"mistakes":[{"m":"بتحوّل الضيوف لمسرح عرض: «ورّي طنط بتعد للعشرة! اعرض اللي بتعرفه!» — الزيارة بقت امتحان أداء، وهيبتدي يستخبى في أوضته أول ما الجرس يرن.","fix":"دوره في الزيارة خدمة ليها معنى — يقدّم المياه، يفتح الباب — مش فقرة استعراض. ولو الضيوف طلبوا العرض، انت اللي تقول: «لو حب هو يورّيكم»."},{"m":"زعقتله قدام الضيوف لما وقّع صينية المياه — من اللحظة دي التقديم بقى مخاطرة مرعبة، والضيافة اتربطت في دماغه بالإحراج.","fix":"وقت الغلطة قدام الناس: لملم بهدوء وكمّل عادي — «مفيش حاجة، هنجيب غيرها». الكلام يبقى بعد ما يمشوا، وبنبرة تعليم مش عتاب."},{"m":"أول ما الضيوف يوصلوا: «روح العب في أوضتك» — بيتعلم إن الضيافة شغلانة كبار وهو عنصر إزعاج المفروض يختفي.","fix":"اديله دوره الثابت في أول ربع ساعة — استقبال وتقديم — وبعدها يروح يلعب براحته: مشاركة قصيرة حقيقية أحسن من حضور طويل بالعافية."}],"adapt":[{"kid":"الخجول","how":"التقديم قدام صف ضيوف عذاب ليه. ابدأ بالضيوف المألوفين — تيتة وخالته — وبدور من غير كلام: يحط طبق التمر على الترابيزة ويمشي. السلام بالكلام مرحلة جاية بعد شهور من النجاحات الصغيرة، مش مطلوبة من أول زيارة."},{"kid":"كثير الحركة","how":"صينية المياه في إيده مغامرة. طوّع طاقته بدل ما تحاربها: هو اللي يجري يفتح الباب، يوصّل الأطباق واحد واحد في رحلات متعددة، يجيب الشبشب للضيف — مهام حركية قصيرة متتابعة بدل «اقعد عدل قدام الضيوف»."},{"kid":"عالي الشدة","how":"لو الضيف الصغير كسر لعبته أو خطف حاجة من إيده، النوبة هتولع قدام الكل. التحضير قبل الزيارة هو الحماية: اللعب الغالية تطلع الرف العالي بإيده هو، واتفقوا على جملة نجدة يجيلك بيها — «محتاجك يا بابا» — بدل ما ينفجر في ضيفه."}]},
{"name":"الشكر للناس","cat":"تعامل","age":[4,12],"how":"يبدأ منك: هو بيشوفك بتشكر مين؟ الشكر للي بيخدمنا أقوى درس في الباب ده.","steps":[{"t":"اشكر انت بصوت مسموع","d":"طفلك بيتعلم الشكر من ودانه مش من المحاضرات. خليه يسمعك بتشكر عامل الدليفري عند الباب، والكاشير في السوبرماركت، وعم الأمن في الكمبوند — بصوت واضح وابتسامة. أسبوع واحد من ده أقوى من مية مرة «قول شكرًا».","say":"شكرًا يا كابتن، تعبناك معانا."},{"t":"سلّمه الدور بالتدريج","d":"بعد ما شافك بتشكر مرات كتير، ابدأ سلّمه هو الموقف: الدليفري جه؟ خليه هو اللي ياخد الكيس ويقول شكرًا. الجرسون حط العصير قدامه؟ بص له وقول «قول له انت». لو اتكسف متضغطش — اشكر انت وعدّيها، المرة الجاية هتيجي منه لوحدها.","say":"قول له انت شكرًا بصوتك."},{"t":"سؤال العشا الثابت","d":"كل يوم على سفرة العشا نفس السؤال: «مين ساعدنا النهارده؟». ابدأ انت بإجابتك عشان يفهم اللعبة: «سواق الباص وصّلك بالسلامة، والمدرّسة علمتك حاجة جديدة». مع التكرار هيبتدي هو يلاحظ الناس اللي بيخدموه — والملاحظة دي هي أصل الشكر.","say":"مين ساعدنا النهارده؟ أنا هقول الأول."},{"t":"شكر بيتلمس بإيده","d":"وسّع الشكر من كلمة عابرة لفعل: يرسم كارت لمدرّسته في نهاية الأسبوع ويسلمهوله بإيده، أو يقول لعم الأمن «شكرًا إنك بتخلي بالك مننا». وجوه البيت اشكره انت بوصف الفعل — «انت شلت طبقك للحوض، شكرًا» — فيتعلم إن الشكر بيتقال لأي حد عمل حاجة، صغير أو كبير.","say":"تعالى نرسم كارت شكر للمس ونديهولها بكره."}],"mastery":"بيقول شكرًا لعم الأمن وعامل التوصيل والمدرّسة من غير تلقين.","acts":[{"t":"كارت شكر مرسوم بإيده","mat":"ورقة وألوان شمع.","prep":"في وقت هادي آخر الأسبوع، اسأله سؤال واحد: «مين ساعدك الأسبوع ده؟».","run":"هو يرسم اللي يحبه، وانت تكتب تحت الرسمة الجملة اللي يمليها عليك («شكرًا يا مس عشان بتعلميني»). المهم إنه هو اللي يسلّم الكارت بإيده — لحظة التسليم دي هي نص التمرين."},{"t":"لعبة «مين ساعدنا النهارده؟»","mat":"من غير مواد — التزام يومي على سفرة العشا.","prep":"اتفقوا إن السؤال ده بقى فقرة ثابتة على العشا كل يوم.","run":"كل واحد بالدور يقول حد ساعده النهارده وإيه اللي عمله: انت الأول عشان تدّي النموذج، وبعدين ماما، وبعدين هو. لو قال «محدش»، ساعده بأسئلة صغيرة: «مين وصّلك الحضانة؟ مين عمل لك الأكل ده؟»."}],"say":"قول له انت شكرًا بصوتك.","deen":["من لا يشكر الناس لا يشكر الله","النبي ﷺ قال: «لا يشكر اللهَ من لا يشكر الناس» (رواه أبو داود والترمذي من حديث أبي هريرة) — يعني شكر الناس مش مجاملة، ده طريقنا لشكر ربنا نفسه. بسّطها لطفلك: «اللي يعملك حاجة حلوة قوله شكرًا — وده بيفرّح ربنا». والقدوة قبل الكلمة: خليه يسمعك انت بتشكر عامل التوصيل وعم الأمن وماما على الأكل بصوت واضح، وهيقلدك من غير تلقين. ولما يشكر حد من نفسه، علّق بحب: «كلمتك دي فرّحته وفرّحت ربنا»."],"skill":"الشكر التلقائي: يقول «شكرًا» من نفسه لعم الأمن اللي فتح له الباب وللمدرّسة آخر اليوم — من غير ما حد يهمس له «قول شكرًا»، وهي نفس المهارة اللي بتخلي الناس تحب تساعده.","lvl":3,"ord":7,"tag":"التعاطف والمساعدة","src":[["قصة · عصافير مميز","رائع!","https://3asafeer.com/ar/read/1339/رائع"],["قصة · عصافير مميز","من أجل أمي","https://3asafeer.com/ar/read/322/من-أجل-أمي"]],"mistakes":[{"m":"«قول شكرًا! هه؟ مش سامع؟» قدام الجرسون والطفل مطنّش — التلقين العلني بيحوّل الشكر لطاعة مُرة مربوطة بالإحراج، مش لملاحظة جميل حد عمله.","fix":"اشكر انت بصوت واضح وعدّي الموقف. النموذج المتكرر من غير ضغط بيطلّع الشكر منه لوحده بعد أسابيع — والشكر اللي جه من جواه متأخر أغلى من اللي اتعصر منه فورًا."},{"m":"الشكر عندكم للغرباء بس: بتشكر الجرسون والدليفري، وجوه البيت ماما بتحط الأكل وتشيل الأطباق ومحدش بينطق — بيتعلم إن خدمة أهل البيت تحصيل حاصل مش بتستاهل كلمة.","fix":"اشكر شريك بيتك قدامه بوصف الفعل: «الأكل ده واخد وقت يا ماما — تسلم إيدك». شكر البيت هو اللي بيتعاش كل يوم."},{"m":"لما يتكسف ويسكت بتعتذر عنه قدام الناس: «معلش هو خجول» — اللقب اللي بيتقال قدامه بيلزق، وبيبقى عنده إذن دايم إنه ميتكلمش.","fix":"من غير تعليق ولا لقب: اشكر انت وعدّيها، وفي البيت اتكلموا عن الموقف بهدوء بعيد عن أي جمهور."}],"adapt":[{"kid":"الخجول","how":"«قول شكرًا بصوتك» قدام غريب ممكن تكون أصعب جملة في يومه. اقبل شكر من غير صوت في الأول: يسلّم الكارت بإيده، يهز راسه ويبتسم، أو يقول شكرًا لك انت وانتو خارجين — وسمّيها: «انت شكرت المس بالكارت». الصوت بييجي بعد الأمان."},{"kid":"كثير الحركة","how":"بيخطف الكيس من الدليفري ويجري — اللحظة بتفوته من السرعة مش من قلة الأدب. خلي الشكر جزء من الحركة نفسها: اتفقوا إن التسليمة متتحسبش غير بكلمة شكرًا — «الكيس + شكرًا = المهمة خلصت»."},{"kid":"الحساس","how":"لو اتصحح قدام الناس («قول شكرًا الأول!») بيتجرح وبينسحب من الموقف كله. صحّح بالنموذج مش بالأمر: اشكر انت بصوت واضح جنبه، وارجعوا للموقف بالليل في الهادي — «افتكرت لما الجرسون جابلك العصير النهارده…»."}]},
{"name":"حسن الاستماع","cat":"تعامل","age":[4,12],"how":"بيتعلّم لما يتسمع. قاطعه مرة وهيتعلم المقاطعة؛ استمع له وهيستمع.","steps":[{"t":"اسمعه للآخر قبل ما تطلب منه يسمع","d":"أول ما يرجع من الحضانة وييجي يحكي، اقلب الموبايل على وشه وانزل لمستوى عينيه واسمع الحكاية كاملة — حتى لو واخدة وقت وبيلف ويدور فيها. وقبل ما ترد، لخّص كلامه هو: «يعني صاحبك خد الكورة وانت زعلت» — كده بيشوف شكل الاستماع الحقيقي بعينه ويقلّده. لو بتقاطعه انت عشان مستعجل، هو اللي هيتعلم المقاطعة: الطفل اللي بيتسمع هو اللي بيسمع.","say":"أنا سامعك، كمّل — وبعدين حصل إيه؟"},{"t":"ودانه بتتمرن باللعب","d":"الاستماع عضلة بتتدرب بلعبتين ثابتين: في البلكونة أو المطبخ اقفلوا عنيكم دقيقة وكل واحد يقول تلات أصوات سمعهم — عربية، عصفورة، الخلاط، التكييف. وبعد حدوتة النوم سؤال واحد عن اللي اتحكى: «الأرنب عمل إيه في الآخر؟» — وفي ليلة تانية اقلبها: هو اللي يحكيلك الحدوتة. التركيز اللي بيتبني في الصوت والحدوتة هو نفسه اللي هيركّز بيه في كلامك.","say":"اقفل عينيك… سمعت إيه؟"},{"t":"تعليمة من خطوتين","d":"اديله كل يوم تعليمة فيها خطوتين وسيبه ينفذها لوحده: «هات الكوباية من على السفرة وحطها في الحوض» أو «اقلع الجزمة وحطها في الرف». لو نفّذ خطوة ونسي التانية، متعملهاش انت بداله — قول بهدوء: «كان فيه حاجتين، افتكر التانية إيه؟». ولما الخطوتين يبقوا سهلين عليه، جرّب تلاتة.","say":"اسمعني للآخر الأول… خلصت؟ يلا نفّذ."}],"mastery":"بيسمعك للآخر وبينفّذ تعليمة من خطوتين من أول مرة — أغلب الوقت.","acts":[{"t":"لعبة الأصوات مغمّضين","mat":"تايمر الموبايل بس","prep":"اقعدوا في البلكونة أو قدام شباك المطبخ في أي وقت هادي، وحط تايمر الموبايل على دقيقة واحدة.","run":"اقفلوا عنيكم انتوا الاتنين لحد ما التايمر يرن. بعدها كل واحد يقول تلات أصوات سمعهم — عصفورة، عربية، تكييف — واللي يقول صوت محدش سمعه غيره «يكسب» الجولة. اختمها بجملة: «شفت ودانك بتسمع قد إيه لما تركّز؟»."},{"t":"التليفون المكسور","mat":"من غير مواد","prep":"محتاجة تلاتة على الأقل — انت وطفلك وماما أو أخوه — فخططها لوقت ما تكونوا كلكم في البيت، بعد العشا مثلًا.","run":"اهمس في ودن طفلك جملة قصيرة زي «البطة لبست جزمة حمرا»، هو يهمسها للي بعده، والأخير يقولها بصوت عالي — واضحكوا سوا على اللي اتغيّر فيها. وقول في الآخر: «الجملة بتوصل صح بس لما كل واحد يسمع كويس» — دي فكرة اللعبة وهي بتوصل لوحدها."}],"say":"أنا سامعك، كمّل.","deen":["«وإذا قرئ القرآن فاستمعوا له وأنصتوا»","الآية دي من سورة الأعراف، وطفلك هيعيشها مش هيحفظها: كل يوم في وقت ثابت — بعد المغرب مثلًا — شغّلوا سورة قصيرة زي الإخلاص أو الفلق واقعدوا دقيقة واحدة ساكتين، وانت الأول اللي تسكت قبل ما تطلب منه. لما يشوفك بتنصت للقرآن بجد هيقلدك من غير أمر واحد. وبعد السورة اسأله بحب: «سمعت كلمة إيه؟» — فضول سوا مش امتحان. دقيقة واحدة يوميًا بالحب أقوى من ربع ساعة بالعافية."],"skill":"الاستماع والتنفيذ: يسمع تعليمة من خطوتين — «هات جزمتك وحطها جنب الباب» — وينفذها من أول مرة، وهي نفس المهارة اللي المدرّسة هتعتمد عليها منه كل يوم في الحضانة.","lvl":2,"ord":10,"tag":"أدب الكلام","src":[["قصة · عصافير مميز","صوت من هذا؟","https://3asafeer.com/ar/read/269/صوت-من-هذا؟"],["قصة · عصافير مميز","من يتكلم؟؟","https://3asafeer.com/ar/read/1256/من-يتكلم؟؟"]],"mistakes":[{"m":"بتناديله من الأوضة التانية وهو غرقان في اللعب، وبعدين بتحكم عليه إنه «مبيسمعش الكلام» — هو فعلًا مش سامعك: دماغه في السن دي بتقفل على حاجة واحدة.","fix":"انزل له، المس كتفه، استنى عينه تبص في عينك، وبعدين قول التعليمة — وخليه يعيدها بلسانه قبل ما ينفذ."},{"m":"بتكرر التعليمة أربع وخمس مرات بصوت أعلى كل مرة — كده بتدرّبه إن أول تلات مرات مش لازم يسمعهم، لأن الجد بييجي في الآخر.","fix":"قولها مرة واحدة وانت قريب منه، ولو منفذش اسأله: «أنا قلت إيه؟» — السؤال بيشغّل ودنه أكتر من التكرار."},{"m":"بتطالبه يسمعك للآخر وانت نفسك بترد على الواتساب وهو بيحكيلك — اللي بيتعلمه إن الاستماع كلام بيتقال مش حاجة بتتعمل.","fix":"أول دقيقتين بعد الحضانة قاعدة عليك انت: موبايل مقلوب وعين في عين — قبل ما تطلب ودنه، اديله ودنك."}],"adapt":[{"kid":"كثير الحركة","how":"القعدة مغمض العينين مش هتحصل — العب لعبة الأصوات وانتو ماشيين في الشارع أو في العربية، وخلي التعليمات نفسها حركية: «نط هات الجزمة وحطها في الرف». جسمه لما بيتحرك، ودنه بتفتح."},{"kid":"الخجول","how":"بيسمع كويس، بس لما تقوله «احكيلي الحدوتة» بيتكسف ويسكت فتفتكره مش مركز. اديله اختيارات بدل السؤال المفتوح: «الأرنب زعل ولا فرح في الآخر؟» — وسيبه يزوّد لما يرتاح."},{"kid":"العنيد","how":"بيسمع التعليمة كويس وبيرفض ينفذها لأنها جت أمر — المشكلة مش في ودنه، في مين ماسك القرار. خليه هو صاحب المهمة: «مين اللي هيفتكر الحاجتين لوحده؟» وخليه يعيدهم بصوته هو قبل ما يتحرك."}]},
{"name":"حل الخلاف بالكلام","cat":"تعامل","age":[4,12],"how":"دورك وسيط مش قاضي: كل واحد يحكي، وبعدين «نعمل إيه؟» بدل «مين غلطان؟».","steps":[{"t":"الجُمل البديلة عن الإيد","d":"وقت الهدوء — مش وقت الخناقة — درّبه على الكلمات اللي بتحل: «ده بتاعي»، «دوري»، «مش عاجبني كده»، «هقول لماما». قول له صريح: «لما حد ياخد لعبتك، إيدك مش هي اللي بترجّعها — صوتك هو اللي بيرجّعها». كرروا الجمل دي كلعبة لحد ما تبقى جاهزة على لسانه قبل ما يحتاجها.","say":"لما حد يضايقك، قول له بصوتك: لأ، ده بتاعي."},{"t":"مسرح العرايس بيتخانق","d":"قبل ما يقابل أطفال، مثّلوا الموقف: عروستين بيتخانقوا على كورة واحدة، واحدة خطفت والتانية صرخت. وقّف المشهد في نصه واسأله: «نعمل إيه؟». ونفّذوا الحل اللي هو يقترحه فعلًا — دور بالعد، أو يلعبوا سوا. التمثيل بيدّيله سيناريو جاهز في دماغه قبل الموقف الحقيقي.","say":"العروستين زعلانين… انت قول لهم يعملوا إيه."},{"t":"افصل الإيدين واسمع الاتنين","d":"خناقة حقيقية مع ابن عمه على العربية الريموت؟ متبدأش بـ«مين اللي بدأ؟» — السؤال ده بيفتح محكمة. افصل الإيدين الأول وخد نفس، وبعدين كل واحد يحكي اللي حصل من غير مقاطعة، والتاني ساكت لحد ما صاحبه يخلص. مجرد إن كل طفل حس إن حكايته اتسمعت للآخر بينزل نص الغضب — قبل أي حل.","say":"واحد واحد — كل واحد هيحكي وأنا سامعه للآخر."},{"t":"«نعمل إيه؟» مش «مين غلطان؟»","d":"بعد ما الاتنين حكوا، اسأل السؤال اللي بيغيّر كل حاجة: «طيب نعمل إيه دلوقتي عشان نرجع نلعب؟» واسكت واستنى. اقبل الحل اللي يطلع منهم حتى لو مش مثالي — دور بالعد لعشرة، يلعبوا بيها سوا، واحد ياخد الريموت والتاني العربية — ونفّذوه بالحرف. الحل اللي طلع منهم بيتنفذ؛ الحل المفروض منك بيتفك أول ما تدير ضهرك.","say":"طيب — نعمل إيه دلوقتي عشان نرجع نلعب؟"},{"t":"خلافات الكبار قدوة","d":"لما تختلف انت وماما قدامه على حاجة بسيطة — نطلب أكل ولا نطبخ — خليه يسمع الحوار الهادي والحل: «طيب النهارده رأيك وبكره رأيي». ولما يحل هو خناقة بالكلام، صف اللي عمله بالظبط: «انت قلت بصوتك ومضربتش — ده اللي الكبار بيعملوه».","say":"أنا وماما اختلفنا، اتكلمنا، وحلّينا — كده بنعمل في بيتنا."}],"mastery":"أول رد فعل في الخناقة بقى كلام («ده بتاعي! دوري!») مش إيد.","acts":[{"t":"مسرحية العروستين","mat":"عروستين أو دبدوبين + كورة صغيرة من لعبه","prep":"اختار وقت لعب هادي — مش بعد خناقة حقيقية — واقعدوا على الأرض في أوضته.","run":"مثّل قدامه: عروسة خطفت الكورة والتانية عيّطت — وقّف المشهد واسأله: «نعمل إيه؟»، وجرّبوا حلّه فعلًا بالعرايس مهما كان. بعدين بدّلوا الأدوار: هو يمثّل الخناقة وانت اللي تقترح الحل، وشوف هيقبل اقتراحك ولا هيعدّل عليه — التعديل ده نفسه تمرين على التفكير في الحلول."},{"t":"قاعدة «كل واحد يحكي»","mat":"من غير مواد","prep":"في وقت صفا اتفقوا على طريقة البيت الثابتة لأي خناقة: نقعد على الكنبة، كل واحد يحكي، وبعدين نفكر سوا.","run":"طبّقها في أول خناقة حقيقية — مع أخوه أو ابن عمه على لعبة: كل واحد يحكي نسخته من غير مقاطعة، وبعدين اسأل سؤال واحد بس: «نعمل إيه دلوقتي؟» — مش «مين اللي غلطان؟». وامدح التزامه بالطريقة مش نتيجتها: «انت حكيت واستنيت دورك»."}],"say":"نتكلم بدل ما نخبط.","deen":["«والصلح خير»","كلمتين من سورة النساء بيتربّى عليهم البيت كله: بعد أي خناقة — مع أخوه أو ابن عمه — استنى لما يهدى واسأله بحب: «نروح نصالحه؟ الصلح خير». وخلّي المصالحة بإيده هو: يمد إيده أو يرجّع اللعبة بنفسه، مش انت اللي تصالح بالنيابة عنه. ولما تختلف انت مع حد قدامه وتتصالح، قول الجملة نفسها بصوت مسموع — الكلمة بتترسّخ بالتكرار في المواقف الحقيقية، مش بالشرح."],"skill":"التعبير وقت الخلاف: أول ما حد يخطف لعبته يقول «أنا متضايق، ده بتاعي» بدل ما يضرب — الجملة اللي بتحل معظم خناقات الحضانة قبل ما تكبر.","lvl":3,"ord":8,"tag":"العدل والخلاف","src":[["قصة · عصافير مميز","القتال","https://3asafeer.com/ar/read/1279/القتال"],["قصة · عصافير مميز","أخْ!","https://3asafeer.com/ar/read/1388/أخ"]],"mistakes":[{"m":"بتدخل قاضي بحكم جاهز — «انت الكبير سيبهاله» أو «اديها له خلاص» — الخناقة بتخلص، بس الاتنين متعلموش غير إن الحل بييجي من بره.","fix":"انزل درجة من قاضي لوسيط: سؤالك الوحيد «نعمل إيه؟» — والحكم يطلع منهم هما."},{"m":"بتتدخل من أول صوت عالي — الصوت العالي مش دايمًا خناقة، ولو دخلت كل مرة عمرهم ما هيجربوا يتفاوضوا لوحدهم.","fix":"اسمع من بعيد واستنى دقيقة — متتحركش غير لو إيد اترفعت أو حد بيتظلم بجد. وكل خناقة اتحلت من غيرك، سمّيها بالليل: «انتو ظبطتوها لوحدكم»."},{"m":"بتصادر اللعبة اللي اتخانقوا عليها — «محدش هيلعب بيها خلاص!» — الخناقة سكتت، لكن الدرس اللي وصل: الخلاف نهايته إن الكل يخسر.","fix":"حطها قدامهم على الترابيزة وقول: «اللعبة مستنية لما تتفقوا» — الرجوع ليها بييجي من اتفاقهم مش من إيدك."}],"adapt":[{"kid":"عالي الشدة","how":"وقت الولعة مفيش كلام بيدخل دماغه — بروتوكول «كل واحد يحكي» ميبدأش غير بعد التهدئة: ابعده مسافة، نفسين، وبعدين افتح الحكي. ودرّبه على الجمل البديلة وقت الهدوء ضعف أي طفل تاني — هو محتاجها تطلع أوتوماتيك."},{"kid":"الخجول","how":"في الخناقة صوته بيختفي وبيسيب حقه وييجي يعيط لك بعدها — مشكلته مش الإيد، إن الجملة مش بتطلع. درّبه على جملة واحدة بس «ده بتاعي» بصوت عالي كلعبة في البيت، وفي مسرح العرايس خليه هو اللي ينطقها بدل العروسة المظلومة."},{"kid":"العنيد","how":"في مرحلة «نعمل إيه؟» بيتمسك بحل واحد: «هو اللي يمشي!». متتفاوضش على حله — وسّع الاختيارات: «ده مش هيحصل. عندنا اتنين: دور بالساعة الرملية ولا تلعبوا بيها سوا؟» — اللي اختار بنفسه بيلتزم."}]},
{"name":"عدم المقاطعة","cat":"تعامل","age":[4,12],"how":"إشارة متفق عليها بدل الزعيق، مع استجابة سريعة أول ما يستخدمها — وإلا هيسيبها.","steps":[{"t":"اتفقوا على الإشارة","d":"في وقت هادي اشرح له: «لما تلاقيني بتكلم في التليفون أو مع حد وانت عايزني، محتاجش تزعّق — حط إيدك على دراعي، وأنا هحط إيدي على إيدك يعني شفتك وجايلك». جربوها فورًا كلعبة تلات مرات ورا بعض عشان تثبت قبل أول موقف حقيقي.","say":"حط إيدك على دراعي وأنا هرد عليك — من غير مناداة."},{"t":"رد فوري الأول… وبعدين طوّل بالراحة","d":"أول أسبوع، أول ما يستخدم الإشارة رد عليه في ثواني حتى لو في نص مكالمة — قول للي معاك «ثانية واحدة» وبص له؛ الإشارة بتكسب ثقته لما تشتغل بسرعة، ولو طنشتها هيرجع للزعيق وهو معذور. بعد ما تثبت، ابدأ طوّل المسافة: حط إيدك على إيده وخلّص جملتك (١٠ ثواني)، بعدين فكرتك (٣٠ ثانية)، بعدين دقيقة كاملة — إيدك على إيده بتقول له «أنا فاكرك». وبعد ما ترد اوصف: «استنيت لحد ما خلصت كلامي».","say":"شفت إيدك — ثواني وأنا معاك."},{"t":"الحاجة المهمة بتقاطع على طول","d":"عشان القاعدة تبقى عادلة لازم يعرف استثناءاتها: حد اتعور، حاجة بتقع، مية سايحة في الحمام — دي مش مقاطعة، دي نجدة. قوله بوضوح: «لو فيه حاجة خطر أو حد اتعور — متستناش، قاطعني على طول وقول: بابا ده مهم!». ومثّلوها مرة: انت في مكالمة وهمية وهو يجري يقولك إن المية سايحة. الطفل اللي عارف امتى من حقه يقاطع، بيستحمل الانتظار في الباقي أسهل.","say":"حاجة خطر أو حد اتعور؟ قاطعني على طول وقول: ده مهم."},{"t":"تمرين المكالمة الحقيقية","d":"رتّب مكالمة فيديو قصيرة مع تيتة وقول له قبلها: «هتكلم خمس دقايق — لو احتجت حاجة استخدم الإشارة». حط جنبك حاجة تشغله (ورق وألوان)، ولو استنى فعلًا اختم بوصف اللي حصل: «اتكلمت للآخر وانت مقاطعتنيش — ده اسمه احترام الكلام».","say":"أنا داخل مكالمة دلوقتي — فاكر إشارتنا؟"}],"mastery":"بيستخدم إشارة الإيد أو بيستنى ثواني لما تكون بتتكلم مع حد — معظم المرات.","acts":[{"t":"تمثيلية الإشارة","mat":"موبايل مقفول بس","prep":"وقت لعب عادي في الصالة — التدريب بيحصل قبل ما تجرّبوا الإشارة في مكالمة حقيقية.","run":"اعمل نفسك بتتكلم في التليفون، وهو ييجي يحط إيده على دراعك؛ حط انت إيدك على إيده، خلّص جملة واحدة، وبعدين بص له ورد عليه. اعكسوا الأدوار كمان — هو «اللي بيتكلم» وانت اللي بتحط إيدك — عشان يحس الإشارة من الناحيتين. كرروها تلات مرات وقول له: «إيدك على إيدي يعني أنا شايفك — ثواني وهاجيلك»."},{"t":"لعبة مستويات الصوت","mat":"من غير مواد","prep":"اتفقوا الأول على تلات مستويات صوت بأساميها: صوت بره (عالي)، صوت البيت (متوسط)، صوت السر (همس).","run":"العبوها في الأوضة: «قول اسمك بصوت بره… دلوقتي بصوت السر»، وبدّلوا بسرعة واضحكوا على الفرق. بعدين اربطها بالمواقف الحقيقية واسأله: «لما حد نايم أو أنا بتكلم في التليفون — بنستخدم أنهي صوت؟»."}],"say":"حط إيدك واستنى وأنا هرد.","deen":["أدب المجلس","من أدب الإسلام في المجلس إن اللي بيتكلم ياخد حقه ومحدش يقطع كلامه — وده بيتعلّم بالقدوة قبل الكلام: لما طفلك يحكيلك، متقاطعوش انت كمان وسيبه يخلّص لآخر جملته. واتفقوا على إشارة رحيمة: يحط إيده على إيدك لو عايز يتكلم وانت بتكلم حد، وانت تمسك إيده يعني «شايفك، ثواني وهاجيلك» — كده هو مش متجاهَل وانت مش متقاطع. والوفاء بالإشارة شرط: أول ما تخلّص جملتك بص له فعلًا، لأن لو الإشارة ضاعت منه مرتين هيرجع يقاطع."],"skill":"انتظار الدور في الكلام: على سفرة العشا يستنى اللي بيتكلم يخلّص وبعدين يحكي هو — نفس الأدب اللي هيخليه يرفع إيده في الفصل بدل ما يقاطع المدرّسة.","lvl":2,"ord":11,"tag":"أدب الكلام","src":[["قصة · عصافير مميز","شششش","https://3asafeer.com/ar/read/1592/ششش"],["قصة · عصافير مميز","هدوووء","https://3asafeer.com/ar/read/1662/هدوووء"]],"mistakes":[{"m":"الإشارة شغالة وانت رايق وبتقع وانت مضغوط — بيحط إيده على دراعك في نص مكالمة الشغل وبتنفض له، فبيرجع للزعيق وهو معذور: الإشارة اللي بتشتغل ساعات هي إشارة ميتة.","fix":"الإشارة عقد ملزم ليك انت الأول — في أصعب مكالمة رد ولو بإيدك على إيده من غير ما تبص، ولو اتأخرت اعتذر بعدها: «انت عملت إشارتنا وأنا اللي اتأخرت»."},{"m":"انت بتقاطعه هو براحتك — بيحكيلك عن الحضانة وبتقطع حكايته في النص: «قول لطنط مساء الخير» — فالقاعدة بقت على الصغير بس، ومفيش طفل بيحترم قاعدة الكبار مستثنيين منها.","fix":"خلي القاعدة على البيت كله: هو كمان جملته بتخلص قبل ما حد ياخد الكلمة — ولو قطعته صحح قدامه: «آسف، أنا قاطعتك — كمّل»."},{"m":"بتطلب منه يستنى مكالمة ساعة من غير تجهيز ولا حاجة في إيده، وبعدين بتحكم عليه إنه «مش بيطول باله» — اللي فوق طاقة سنه مش قلة أدب.","fix":"قبل المكالمة قوله هتاخد قد إيه، وحط في إيده حاجة تشغله (ورق وألوان) — وطوّل الانتظار بالدقايق مش بالساعات."}],"adapt":[{"kid":"كثير الحركة","how":"الوقفة الساكنة جنبك أصعب حاجة عليه — الإشارة لوحدها مش هتكفي. اربط الانتظار بحركة: «حط إيدك على دراعي، وبعدين روح هات الألوان لحد ما أخلص» — الانتظار اللي فيه مهمة بيعدي، واللي واقف فيه ساكت بينفجر زن."},{"kid":"الحساس","how":"لو عمل الإشارة وطنشتها مرة، مش هيزن — هينسحب وياخدها على إن «بابا مش شايفني»، وممكن يبطل يستخدمها خالص. اعترافك بعد كل تأخيرة هو اللي بيصلح الإشارة: «انت عملتها صح وأنا اللي اتأخرت — تعالى قولي دلوقتي»."},{"kid":"عالي الشدة","how":"«محتاجك» عنده يعني «حالًا» — فبيفوّت الإشارة ويصرخ. متكافئش الصريخ بالرد: قول بهدوء «فاكر إشارتنا؟» واستنى إيده تيجي على دراعك ورد فورًا. وابدأ معاه بانتظار ٥ ثواني بس وزوّد نقطة نقطة — النجاحات الصغيرة المتكررة هي اللي بتبني عنده الكبح."}]},
{"name":"الصدق","cat":"دين وأخلاق","age":[3,12],"how":"الصراحة لازم تبقى آمنة. لو الاعتراف بيجيب عقاب، بتعلّمه يكدب أحسن.","steps":[{"t":"«حدوتة ولا حقيقي؟»","d":"في السن ده الخيال والحقيقة لسه مخلوطين — اللي شكله كدب ساعات بيكون حدوتة من دماغه. علّمه الفرق باللعب: قول جمل زي «القطة بتطير بجناحات» و«احنا اتغدينا مكرونة النهارده» وهو يحكم: حدوتة ولا حقيقي؟ كده بيتعلم التمييز من غير ما يتوصم إنه كداب.","say":"دي حدوتة ولا حقيقي؟"},{"t":"خلّي الاعتراف مأمون","d":"الكوباية اتدلقت والمية على الأرض؟ بدل «مين عمل ده؟!» بنبرة تحقيق — اللي بتعلّمه يستخبى — قول بهدوء: «المية اتدلقت، نجيب المماسح». ولما يقول «أنا اللي دلقتها»، أول جملة منك تكون شكر على الصراحة، وبعدين تصلّحوا سوا. الطفل بيصارح اللي مش بيعاقبه على المصارحة.","say":"شكرًا إنك قلت لي الحقيقة — تعالى نمسحها سوا."},{"t":"متحطهوش في اختبار كدب","d":"لو الشوكولاتة على بقه وهو بينكر، متسألوش «انت كلت الشوكولاتة؟» وانت شايف الإجابة — السؤال ده بيدرّبه على الكدب. قول اللي شايفه على طول: «أنا شايف الشوكولاتة على بقك — أنا مش زعلان من الأكل، أنا عايز نقول الحقيقة». افصل دايمًا بين الغلطة الصغيرة وبين إنكارها.","say":"أنا شايف اللي حصل — الحقيقة عندنا أهم من الغلطة."},{"t":"صدقك انت المنهج","d":"هو بيسمعك في التليفون: لو قلت «قول له بابا مش موجود» وانت قاعد جنبه، وقع الدرس كله. ولو وعدته بالحديقة بعد الحضانة، نفّذ أو قول من الأول «مش متأكد». واحكيله عن غلطة اعترفت بيها انت: «نسيت أجيب اللبن، قلت لماما ونزلنا جبناه سوا» — يشوف إن الكبار بيقولوا الحقيقة حتى في غلطهم.","say":"في بيتنا بنقول الحقيقة — أنا وانت وكلنا."}],"mastery":"بيحكيلك اللي حصل حتى لما يكون هو الغلطان — لأنه متطمن إن الصراحة مش بتتعاقب.","acts":[{"t":"لعبة «حدوتة ولا حقيقي؟»","mat":"من غير مواد","prep":"تتلعب في أي مكان — على السفرة أو في العربية في سكة الحضانة.","run":"قولوا جمل بالتبادل وهو يحكم بصوت عالي: «الفيل بينط على السرير» (حدوتة)، «احنا رحنا الحضانة النهارده» (حقيقي). بعدين اقلبوا الأدوار: هو يألّف جملة وانت تخمّن — وهيحاول يضحك عليك، ودي نص متعة اللعبة. اسأله مع كل جملة: «دي حدوتة ولا حقيقي؟»."},{"t":"مشهد العروسة اللي اعترفت","mat":"عروستين + كو
