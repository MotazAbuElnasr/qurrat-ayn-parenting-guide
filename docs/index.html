{"t":"بيقاطع الكلام","group":"اجتماعي وإخوات","why":"كبح الاندفاع مهارة تنفيذية مركزها الفص الجبهي — آخر جزء بينضج في المخ — فـ«استنى دقيقة» طلب بيولوجي صعب مش قلة أدب. وكمان الطفل عايش في اللحظة: الفكرة اللي في دماغه دلوقتي لو ماقالهاش حاسس إنها هتضيع للأبد. وورا معظم المقاطعات سؤال واحد بسيط: «هل أنا لسه موجود عندك وانت مشغول؟»","now":[{"d":"أول ما يقاطع، رد بالإشارة المتفق عليها: يحط إيده على دراعك، وانت تحط إيدك على إيده من غير ما تقطع كلامك — لمستك بتقوله «شايفك وجايلك».","say":"«حسّيت بإيدك — ثانية واحدة وأنا معاك.»"},{"d":"أنهي فكرتك بسرعة فعلًا وارجعله في وقت يقدر يستحمله — لو قلت «ثانية» وخدت عشر دقايق، الإشارة بتفقد معناها.","say":"«خلّصت، أنا كلي ودان دلوقتي — كنت عايز تقولي إيه؟»"},{"d":"لو قاطع بصوت عالي برضه، متزعقش ومتردش على مضمون اللي قاله فورًا — ذكّره بالطريقة بهدوء وارجع لكلامك.","say":"«عايز أسمعك أوي. حط إيدك على دراعي وأنا هاجيلك بسرعة.»"}],"after":"في وقت هادي اعكسوا الأدوار كلعبة: هو يحكي لعروسته حكاية وانت تقاطعه، وخليه يحس الفرق ويعلّمك هو الإشارة الصح. ودرّبوا عضلة الانتظار بالتدريج كلعبة بعدّاد: 10 ثواني، بعدين 30، بعدين دقيقة — ولما ينجح سمّيها: «استنيت لحد ما خلّصت كلامي — ده اسمه صبر».","mistake":"التجاهل الكامل «عشان يتعلم إن المقاطعة غلط» — بيرفع الصوت والإلحاح لأنه فهم إن الطريق الهادي مش بيوصّل. والنقيض برضه غلط: إنك تقطع كلامك وتسمعه فورًا كل مرة — بيعلّمه إن المقاطعة شغالة تمام. الحل في النص: اعتراف فوري باللمسة، واستجابة قريبة مش فورية.","schools":"<b>السلوكية:</b> إشارة ثابتة + تعزيز فوري: استجابتك السريعة لما يستخدم الإشارة هي المكافأة اللي بتثبّتها. <b>سيجل:</b> اللمسة اتصال بيطمّن الجزء العاطفي في مخه («أنا موجود عندك») — وده اللي بيخلي الانتظار ممكن أصلًا. <b>مونتيسوري:</b> ضبط النفس بيتبني بالتمرين في وقت هادي منفصل، مش بالتوبيخ وقت الموقف.","prevent":"قبل مكالمة أو زيارة، املا الخزان: 10-15 دقيقة انتباه كامل قبلها بيقللوا المقاطعة أكتر من أي تدريب. وجهّز «سلة المكالمات»: لعب مخصوصة مش بتظهر غير وقت انشغالك عشان تفضل مشوقة. وقول التوقع قبلها بوضوح: «هتكلم في التليفون شوية — لو احتجتني حط إيدك على دراعي وأنا هحس بيك».","vals":["عدم المقاطعة","الصبر والانتظار","حسن الاستماع"]},
{"t":"بيرمي ويخرّب","group":"سلوك مؤذي","why":"الرمي في السن ده «سكيما» حركية: الطفل بيستكشف الجاذبية والمسافة وقوة إيده — مخه بيتعلم فيزياء بجسمه. أما التخريب فغالبًا رسالة مش هدف: ملل، تعب، إحباط مكتوم، أو طلب انتباه. والفرق بين الاستكشاف والتخريب لسه مش واضح عنده: هو مش شايف قيمة الحاجة اللي بتتكسر، شايف تجربة ممتعة ليها صوت ونتيجة.","now":[{"d":"وقّف الفعل بجسمك مش بصوتك: امسك إيده بهدوء أو شيل القابل للكسر من قدامه.","say":"«مش هسيبك ترمي الطبق. الأطباق بتتكسر وبتوجع.»"},{"d":"اديله البديل في نفس اللحظة — المنع من غير بديل بيحوّل الطاقة لحاجة تانية هتتكسر برضه.","say":"«الطبق لأ — الكورة أيوه. تعالى نرمي الكورة في السبت.»"},{"d":"لو حاجة اتكسرت أو اتبعترت، شاركه في الإصلاح بهدوء، من غير عقاب ومن غير ما تعملها انت لوحدك.","say":"«اتكسرت. هات المقشة ونلمّ الحتت مع بعض — ده شغلنا دلوقتي.»"}],"after":"بعد الهدوء اتكلموا عن القاعدة مش عن الذنب: «إيه اللي بيترمى في بيتنا؟ الكورة والمخدة. وإيه اللي لأ؟». ولو خرّب حاجة بتاعة حد تاني، الإصلاح بفعل ملموس: يصلّحها معاك أو يرسم بديل ويقدّمه بإيده. وراقب اليومين الجايين: الرمي بيحصل امتى بالظبط؟ قبل الغدا؟ آخر النهار؟ — التوقيت المتكرر هو التشخيص الحقيقي.","mistake":"الزعيق بعد ما الحاجة خلاص اتكسرت — الرسالة بتضيع في الانفعال، وهو بيسجّل «العرض» المثير اللي حصل مش القاعدة، وساعات بيكرر الرمي مخصوص عشانه. والمقلب التاني: وصفه «انت مخرّب» — الوصف بيتحوّل لهوية الطفل بيشتغل على تأكيدها بدل ما يغيّرها.","schools":"<b>مونتيسوري:</b> البيئة المعدّة بتمنع المشكلة قبل ما تبدأ: القابل للكسر بعيد عن إيده، والمسموح رميه متاح — عدّل البيئة قبل ما تحاول تعدّل الطفل. <b>روس جرين:</b> دوّر على الظرف اللي بيسبق السلوك (جوع، ملل، إحباط) وحِل الظرف — السلوك عرَض مش المرض. <b>السلوكية:</b> المشاركة في التنضيف نتيجة طبيعية متسقة كل مرة، مش عقاب مهين.","prevent":"وفّر منافذ مشروعة يومية: ركن رمي بكور وأكياس قماش، سلة تصويب، ووقت حركة برّه بيصرف الطاقة قبل ما تتصرف في العفش. وحط الهش والغالي فوق مستوى إيده أصلًا — طفل 4 سنين مش هيفتكر القاعدة وقت الحماس. ولاحظ التوقيت المتكرر وسدّه: لو التخريب دايمًا قبل الأكل، سناك في وقته أنفع من ميت خطبة.","vals":["المسؤولية","النظام والنظافة","الاعتذار وإصلاح الخطأ"]},
{"t":"بيرد بـ«لأ» على كل حاجة","group":"انفعالات ومشاعر","why":"بين 2 و4 سنين الطفل بيكتشف إنه شخص منفصل عنك، و«لأ» هي إعلان الاستقلال ده: بيجرب إن كلمته ليها أثر في العالم — وده نمو صحي مش تحدي ليك. وساعات «لأ» بتطلع أوتوماتيك قبل ما يسمع الطلب أصلًا، لأن الرفض نفسه هو التمرين مش مضمون الكلام. وافتكر: الطفل اللي عمره ما اتسمحله يقول «لأ» في بيته، هيصعب عليه يقولها لغريب أو لصاحب بيضغط عليه بعدين.","now":[{"d":"متاخدش الـ«لأ» على محمل شخصي ومتدخلش في مواجهة فورية — استنى كام ثانية، كتير من الـ«لأ» الأوتوماتيكية بتتبخر لو ملقتش مقاومة.","say":"«سمعتك. خد وقتك وأنا هنا.»"},{"d":"حوّل الأمر المباشر لاختيار بين بديلين انت موافق عليهم الاتنين — الاختيار بيديله السيطرة اللي بيدوّر عليها من غير ما تتنازل عن الوجهة.","say":"«هنلبس وننزل — تحب التيشيرت الأحمر ولا الأزرق؟»"},{"d":"في اللي مش بيتفاوض عليه (الأمان، النوم، حزام العربية)، اعترف برفضه ونفّذ بهدوء وحزم في نفس الوقت.","say":"«انت مش عايز تقعد في الكرسي، وأنا هربط الحزام لأن ده أمان. تحب تمسك لعبتك وأنا بربطه؟»"},{"d":"استخدم صيغة «لما... يبقى...» بدل التهديد — بتحوّل التسلسل لقانون طبيعي مش معركة إرادات.","say":"«لما نلمّ المكعبات، يبقى ننزل الجنينة.»"}],"after":"بعد يوم مليان «لأ»، راجع نفسك انت الأول: عدّ كام أمر مباشر قلته النهارده — غالبًا هتتفاجئ بالعدد. واعمل مساحات «لأ» مشروعة: في اللبس والأكل واللعب خليه صاحب القرار فعلًا وقولها له صريحة: «هنا انت اللي بتختار». الطفل اللي بيحس بسيطرة كفاية في حتت من يومه، بيبطّل يحتاج يخطفها في كل حتة.","mistake":"تحويل كل «لأ» لمعركة كرامة — «هتعمل اللي بقولك عليه!» — هتكسب المعركة بالصوت وتخسر الحرب: يا إما طفل مطيع خواف بيقول أيوه لأي حد أعلى صوت منه، يا إما تصلّب أعند. والمقلب التاني: الضحك على «لأ» مرة والزعل منها مرة — التذبذب بيخليه يزوّد التجارب عشان يفهم القاعدة فين.","schools":"<b>أدلر:</b> ده صراع سلطة والخطوة الأولى إنك تخرج منه — الاختيار المحدود بيحقق له انتماء وأهمية من غير فوضى. <b>روس جرين:</b> في المواقف المتكررة شاركه في الحل («إيه اللي يخلي لبس الصبح أسهل؟») بدل ما تفرضه عليه. <b>مونتيسوري:</b> استقلال حقيقي في بيئة معدّة — هدومه في رف يوصله، بياكل بنفسه — بيشبع الجوع اللي الـ«لأ» بتعبّر عنه.","prevent":"قسّم يومه: أغلب اللحظات فيها اختيار حقيقي ليه، وشوية قواعد ثابتة معروفة ومش بتتغير — العناد بيزيد لما القواعد كتير أو متقلبة. ومتسألش سؤال انت مش قابل إجابته: بدل «تيجي تاكل؟» لو الأكل مش اختيار، قول «الأكل جاهز — تحب تقعد جنبي ولا جنب ماما؟». والروتين الثابت بيقفل أبواب تفاوض كتير: اللي بييجي بعد اللعب معروف، فمفيش داعي لمعركة جديدة كل يوم.","vals":["الاستقلال","جسدي وحدودي","الاختيار وتحمّل النتيجة","الرفض وسط الأصحاب"]},
{"t":"رفض الدوا","group":"الروتين اليومي","why":"في السن ده الطفل بيكتشف إن جسمه ملكه، وحاجة بتتحط في بقه غصب عنه بتتسجل عنده كتهديد مش علاج. كمان حاسة التذوق عند الأطفال أحسّس للمرارة من الكبار — الطعم الوحش عنده وحش فعلًا مش دلع. فالرفض ده دفاع عن جسمه واستقلاله، مش عناد ضدك.","now":[{"d":"انزل لمستواه واعترف بالطعم بصدق — أول جملة بتحدد هيصدقك في الباقي ولا لأ.","say":"طعمه مش حلو، عندك حق. وبرضه لازم ناخده عشان جسمك يقوى ويخف."},{"d":"الدوا نفسه مش للنقاش، لكن اديله كل الاختيارات اللي حواليه — الاختيار جوا اللاخيار بيرجّعله الإحساس إنه مش مغصوب.","say":"الدوا هنشربه، بس انت اللي تقرر: بالمعلقة ولا بالسرنجة؟ وبعده مية ولا عصير؟"},{"d":"خليه شريك مش متلقي: يمسك السرنجة معاك أو يدوس على المكبس بنفسه، وعدّ بصوت واضح عشان يعرف إن فيه نهاية قريبة.","say":"إيدك على إيدي، هنعد لتلاتة وندوس مع بعض. واحد.. اتنين.. تلاتة."},{"d":"لو قفل بقه خالص متزغطهوش وهو بيعيط — خد بريك دقيقتين بهدوء وارجع بنفس الجملتين. الزغط ممكن يشرّقه وبيخلي كل مرة جاية أصعب.","say":"شكلك محتاج دقيقة. هستنى معاك، وبعدين هنرجع ناخده — الدوا مش بيتلغي."}],"after":"أول ما يبلعه اديله المية أو العصير اللي اختاره فورًا، ووصف اللي حصل من غير مبالغة: «ده كان طعمه وحش وانت بلعته — دي شجاعة». واربط معاد الدوا بحاجة ثابتة في اليوم (بعد الفطار، قبل الحدوتة) عشان يبقى جزء من النظام مش معركة جديدة كل مرة.","mistake":"إنك تقوله «دي حلاوة» أو «طعمه شوكولاتة». أول شفطة هيكتشف الكدبة فيبطل يصدقك، والأخطر: لو لقى علبة دوا لوحده ممكن ياكلها على إنها حلوى — تسمية الدوا حلوى خطر تسمم حقيقي مش غلطة تربوية بس. والغلطة التانية الزغط بالعافية وهو بيصرخ — خطر شرقان، وبيحوّل كل دوا جاي لحرب.","schools":"<b>فابر ومازليش</b>: اعترف بالطعم الوحش بدل ما تنكره — الطفل اللي حد صدّق إحساسه بيقاوم أقل. <b>سيجل</b>: الرفض وقت الدوا ده دماغ سفلي خايف؛ الاختيارات الصغيرة بتشغّل الدماغ العلوي وترجّع الإحساس بالتحكم. <b>مونتيسوري</b>: المشاركة الحقيقية — يمسك ويدوس ويعد — بتحوله من ضحية لصاحب المهمة. <b>السلوكية</b>: الثبات: الدوا بيحصل في كل الأحوال وبنفس الطريقة الهادية، فالمقاومة بتقل لما يتأكد إنها مش بتلغيه.","prevent":"في الصيدلية اسأل عن نكهات بديلة لنفس المادة الفعالة — أغلب صيدليات الإمارات عندها شراب فراولة أو برتقان لنفس الدوا، وأحيانًا تركيز أعلى بجرعة أصغر. وفي أوقات الصحة العبوا دكتور وصيدلية: هو اللي يدي الدبدوب الدوا ويطمنه — اللعب بيبني السيناريو قبل ما يحتاجه بجد.","vals":["الصدق","الشجاعة وتجربة الجديد","الاستقلال"]},
{"t":"عند الدكتور والحقنة","group":"أماكن عامة وخروجات","why":"خيال الطفل في السن ده أكبر بكتير من منطقه — اللي مش فاهمه بيتملي بأسوأ صورة، فالمجهول أرعب من القرصة نفسها. وذاكرة الألم عنده قوية: زيارة واحدة اتكدب عليه فيها بتخلي كل العيادات مرعبة لسنين. والخوف من الحقن في قمته الطبيعية بين ٣ و٥ سنين.","now":[{"d":"حضّره نفس اليوم (مش من أسبوع) بمعلومة صادقة ومحددة — الصدق دلوقتي بيشتري ثقة كل الزيارات الجاية.","say":"هنروح الدكتور يشوف جسمك، وفيه حقنة. الحقنة بتقرص قرصة بجد بس بتخلص في ثواني، وأنا في حضنك طول الوقت."},{"d":"وقت الحقنة خليه قاعد في حضنك صدره على صدرك — وضعية الحضن دي بتقلل الألم والرعب أكتر بكتير من التمديد والتثبيت على السرير.","say":"تعالى في حضني، حوّط إيديك حواليا، وشاور على الحاجة اللي عايز تبصلها."},{"d":"وقت الشكة شغّله بالنفَس والعد — النفخ بيرخي الجسم، والعد بيقوله إن فيه نهاية معروفة.","say":"انفخ معايا كإننا بنطفي شمع عيد ميلاد.. واحد.. اتنين.. تلاتة.. خلصت."},{"d":"لو عيط سيبه يعيط في حضنك من غير «عيب، انت راجل» — الشجاعة إنه عملها وهو خايف، مش إنه ميحسش.","say":"قرصت وعيطت وعدّت. انت خفت وعملتها برضه — دي الشجاعة بعينها."}],"after":"في العربية خليه يحكي القصة بنفسه: «رحنا فين؟ حصل ايه؟ قرصت قد ايه؟» — إعادة الحكي بتحول الذكرى المخيفة لقصة مفهومة ليها آخر. وفي البيت طلّع شنطة الدكتور اللعبة وخليه هو اللي يكشف على الدبدوب ويديله الحقنة. وبلاش تقفل الموضوع بـ«خلاص انسى».","mistake":"جملتين بيخربوا كل حاجة: «مش هتحس بحاجة» — أول قرصة بتثبت إنك بتكدب، فيفقد الأمان في أصعب لحظة كان محتاجك فيها. و«لو متسمعش الكلام هوديك للدكتور ياخدك حقنة» — بتحول الدكتور لبعبع، وبعدين بتستغرب ليه بيترعب من الكشف العادي. الدكتور صديق الجسم، عمره ما يبقى تهديد.","schools":"<b>سيجل</b>: «سمّيه تروّضه» — الخوف اللي اتسمى بيصغر، وإعادة حكي القصة بعدها بتدمج الذكرى بدل ما تتخزن كرعب غامض. <b>فابر ومازليش</b>: متنكرش الإحساس — «انت خايف، والحقنة بتقرص فعلًا» بدل «مفيش حاجة تخوف». <b>أدلر</b>: الشجاعة بتتبني بالتجربة مع التشجيع مش بالإنكار — «عملتها وانت خايف». <b>السلوكية</b>: الطفل بيقرا وشك قبل ما يشوف الإبرة — أب هادي صوته ثابت بينقل أمان أكتر من ميت جملة طمأنة متوترة.","prevent":"شنطة دكتور لعبة في البيت والعب بيها في الأوقات العادية — سماعة وحقنة بلاستيك، هو الدكتور وانت العيان. قبل مواعيد التطعيم بيوم احكيله اللي هيحصل بنفس الصدق. وراقب لسانك في الحياة اليومية: الدكتور والحقنة ميتقالوش أبدًا في جملة تهديد.","vals":["الصدق","تسمية المشاعر","الشجاعة وتجربة الجديد","جسدي وحدودي"]},
{"t":"قص الشعر","group":"الروتين اليومي","why":"قصة الشعر بالنسبة لطفل ٣-٥ سنين: صوت ماكينة عالي جنب ودنه، شخص غريب ماسك راسه، وشعر بيقع منه قدام عينه في المراية. وفي السن ده أطفال كتير فاكرين إن الشعر جزء حي من جسمهم وإن قصه هيوجع — منطق «الشعر بيرجع تاني» لسه مش راسخ. فالصريخ ده خوف حسي حقيقي مش دلع.","now":[{"d":"اعترف بالحتة الحسية واديله معلومة الجسم اللي ناقصاه.","say":"صوت الماكينة عالي وبيلزلز، عندك حق. الشعر زي الضوافر — قصه مبيوجعش خالص، وبيطلع تاني."},{"d":"رجّعله التحكم باختيارات حقيقية: مكان القعدة والأداة والترتيب. القعدة في حضنك على كرسي الحلاق بتحل نص المشكلة.","say":"تقعد على الكرسي لوحدك ولا في حضني؟ نبدأ بالمقص ولا بالماكينة؟"},{"d":"اتفقوا على إشارة وقف قبل ما الحلاق يبدأ — إن إيده لما ترفع الدنيا تقف فعلًا، ده الأمان اللي بيخليه يكمّل.","say":"لو تعبت ارفع إيدك كده، وعم الحلاق هيقف ناخد نفس وبعدين نكمل."},{"d":"لو انهار خالص بلاش قصة كاملة بالعافية — خلصوا اللي اتعمل وكملوا في زيارة قريبة. قصة ناقصة أحسن من صدمة كاملة.","say":"خلاص، وقفنا النهارده. هنرجع نكمل بعد بكرة — وعد، وهيحصل."}],"after":"قدام المراية وصف اللي حصل مش الشكل بس: «الصوت كان عالي وانت قعدت لآخر واحدة — بص شعرك بقى عامل ازاي». وخليه يشوف الشعر المقصوص على الأرض أو يساعد في كنسه — بيتأكد بعينه إن مفيش حاجة اتوجعت ولا اتكسرت.","mistake":"التثبيت: أب ماسك دراعاته وحلاق بيقص في طفل بيصرخ — اللي اتعمل مش قصة شعر، ده درس إن جسمه ممكن يتمسك غصب عنه، والمرة الجاية هتبقى أوحش. ومعاه التريقة («راجل وبيعيط من قصة شعر؟») وقص شعره غدرًا وهو نايم — ساعتها بيفقد الأمان حتى في نومه.","schools":"<b>روس جرين</b>: الرفض ده مهارة ناقصة (تحمّل حسي) مش عناد — قلل المطلوب بدل ما تعلي الضغط. <b>السلوكية</b>: التعرض التدريجي: زيارة للفرجة بس، وبعدين قعدة على الكرسي، وبعدين قصة قصيرة — كل خطوة بتطفي شوية من الخوف. <b>مونتيسوري</b>: التحضير الواقعي — يشوفك بتحلق، يلمس المشط والمقص، يعرف الترتيب. <b>سيجل</b>: البروفة قبلها بتبني للدماغ خريطة للي جاي — والمجهول لما يتعرف بيصغر.","prevent":"خليه ييجي معاك حلاقتك مرتين يتفرج من غير ما حد يلمسه — الحلاق يبقى مكان معروف مش كمين. اختار وقت فاضي مش زحمة، وطفل شبعان مش نعسان. لو الصوت هو المشكلة اطلب مقص من غير ماكينة. والعبوا حلاق في البيت: مشط ومقص لعبة على الدبدوب وعليك انت كمان.","vals":["جسدي وحدودي","الشجاعة وتجربة الجديد","تقبّل التغيير والمرونة"]},
{"t":"الطيارة والسفر الطويل","group":"أماكن عامة وخروجات","why":"جسم طفل ٣-٥ سنين متصمم يتحرك — القعدة المربوطة ساعات فوق طاقته العضلية فعلًا، مش سوء أدب. ومفهوم الوقت لسه مش موجود: «ساعتين وهنوصل» جملة ملهاش معنى عنده. وضغط الودان في الإقلاع والهبوط بيوجع بجد وهو مش فاهم ليه. أغلب «قلة أدب الطيارة» احتياجات جسم حقيقية في مكان ضيق.","now":[{"d":"في الإقلاع والهبوط شغّل البلع: شفط عصير، مضغ، تثاؤب — البلع بيفتح قناة الودن ويوقف الوجع.","say":"ودنك بتزن عشان الطيارة بتطلع. خد شفطة ورا شفطة من العصير وهتسمع طق وترتاح."},{"d":"قطّع الرحلة لمحطات ملموسة بدل الساعات: أكل، فيلم، مشي، نوم — وكل محطة تخلص قوله فاضل كام.","say":"هناكل، بعدين فيلم، بعدين نتمشى في الطرقة، بعدين ننام — ولما نصحى نبقى قربنا نوصل."},{"d":"أول ما علامة الحزام تطفي خده جولة مشي في الطرقة قبل ما ينفجر مش بعدها — الحركة وقاية مش مكافأة.","say":"جسمك عايز يتحرك. تعالى نمشي لآخر الطيارة ونرجع، ونعد الشبابيك في السقف."},{"d":"لو حصل انهيار جوا الطيارة انزل لمستواه واتكلم واطي، وسيب نظرات الركاب برة الحسبة — انت بتربي ابنك مش بتطمّن الراكب اللي جنبك.","say":"انت زهقان وتعبان ومفيش مكان تجري فيه. أنا معاك — تعالى في حضني نتنفس ونشوف من الشباك."}],"after":"أول ما تنزلوا سمّي الإنجاز بحجمه الحقيقي: «قعدت ساعات طويلة في كرسي صغير وعدّيتها — السفر صعب وانت عندك أربع سنين وسافرت». وأول يوم بعد الوصول رجّع قواعد الشاشة بتاعة البيت بجملة هادية — انت أصلًا أعلنت الاستثناء قبل الطيارة، فمفيش مفاجأة ولا معركة.","mistake":"«خلاص هنوصل» وانتوا فاضلكم تلات ساعات — أول مرتين هيصدق، وبعدين كلامك كله يفقد قيمته. والتانية: تدي الشاشة طول الطيارة وانت حاسس إنك فشلت تربويًا، فتديها بذنب ومن غير إعلان — الاستثناء اللي اتقال قبلها قاعدة ذكية، والاستثناء اللي حصل تحت الضغط ثغرة هيحاول يفتحها تاني في البيت.","schools":"<b>سيجل</b>: دماغ سفلي جعان أو تعبان أو محبوس مش هيسمع أي منطق — أشبع الجسم الأول (أكل، حركة، نوم) وبعدين اطلب سلوك. <b>روس جرين</b>: الرحلة الناجحة بتتخطط قبلها مش بتتدار وقت الانفجار — خطة المحطات والشنطة بتتعمل قبل المطار. <b>السلوكية</b>: إعلان قاعدة الاستثناء مسبقًا («في الطيارة شاشة أكتر، في البيت نرجع لقواعدنا») بيحمي القاعدة الأصلية من الانهيار. <b>مونتيسوري</b>: شنطة أنشطة صغيرة هو اللي حضّرها بإيده بتشغله أضعاف لعبة جاهزة اتشرت له.","prevent":"قبل السفر بيوم حضّروا مع بعض شنطة ضهر صغيرة هو يشيلها: كراسة ستيكرز، ألوان، ولعبة صغيرة جديدة متتفتحش غير جوا الطيارة. في المطار سيبه يجري ويتحرك قبل الركوب — بلاش «اقعد ريح نفسك»، اللي هيقعد ساعات محتاج العكس دلوقتي. وقوله خطة اليوم بالترتيب: مطار، طيارة، بيت جدو — الصورة الواضحة بتقلل المقاومة.","vals":["الصبر والانتظار","إدارة الملل","احترام القواعد","تقبّل التغيير والمرونة"]},
{"t":"الزن في المطعم","group":"أماكن عامة وخروجات","why":"المطعم مجمّع كل الصعب: جوع مستني أكل بطيء، كرسي ممنوع يسيبه، وكلام كبار هو مش جزء منه. والزن نفسه أداة اتعلمها لأنها شغالة — الأهل بيستجيبوا للنبرة المزعجة أسرع من الطلب العادي، خصوصًا قدام الناس. يعني احتياج حقيقي فوق طاقته زائد استراتيجية مجرّبة وناجحة.","now":[{"d":"عالج الجوع فورًا قبل أي تربية — اطلب أكله هو مع المشروبات من أول لحظة، وحط قدامه حاجة يقرمشها.","say":"انت جعان والأكل بياخد وقت. خد العيش ده دلوقتي، وطلبت أكلك ييجي الأول."},{"d":"سمّي النبرة وارفض النبرة مش الطلب — وأهم خطوة: أول ما يعيدها بصوت عادي استجيب في ثانية. الصوت العادي لازم يكسب أسرع من الزن.","say":"ودني مش بتفهم صوت الزن. قولهالي بصوتك العادي.. أيوة كده، سمعتك — تعالى نشوف."},{"d":"اديله وجود حقيقي على الترابيزة: مهمة، لعبة بالعين، ودخّله في الكلام كل شوية — الطفل المشغول والمشارك مبيزنش.","say":"انت مسؤول النهارده تحط لكل واحد فوطته. وبعدها العب معايا: دوّر على حاجة لونها أحمر في المطعم."},{"d":"لو وصل للصريخ اخرج بيه برة المطعم دقيقتين — استراحة جسم مش عقاب — وارجعوا لما يهدا.","say":"جسمك تعب من القعدة. تعالى نتمشى لحد الباب نشوف العربيات ونرجع نكمل."}],"after":"في العربية وصف اللي نجح بالتحديد عشان يتكرر: «لما زهقت قلتهالي بصوتك العادي، وقعدت معانا لحد ما خلصنا». ولو الخروجة كانت صعبة راجعوها مع بعض من غير لوم: «ايه اللي كان صعب النهارده؟ نعمل ايه المرة الجاية؟» — هتتفاجئ إنه هو نفسه هيقولك حلول.","mistake":"إنك تقول «لأ» وبعدين توافق لما يعلّي الزن قدام الناس — كده علّمته إن الزن في الأماكن العامة هو المفتاح السحري، والجرعة المطلوبة هتزيد كل مرة. والوش التاني لنفس الغلطة: الموبايل من أول ثانية قعدة كل مرة — بيتعلم إن السفرة مكان شاشة مش مكان ناس، وبعدين بتستغرب إنه مش عارف يقعد من غيرها.","schools":"<b>السلوكية</b>: السلوك اللي بينجح بيتكرر — لو الزن جاب نتيجة مرة من عشرة هيفضل يجرب، ولو الصوت العادي بيكسب دايمًا وأسرع هيتحول ليه. <b>أدلر</b>: ورا الزن احتياج انتماء — الطفل اللي ليه دور وحد بيكلمه على الترابيزة مش محتاج يزعج عشان يتشاف. <b>فابر ومازليش</b>: اوصف («الأكل بياخد وقت وانت جعان») بدل سيل الأوامر («اسكت، اقعد، بطل»). <b>مونتيسوري</b>: الدور الحقيقي على الترابيزة أنفع من عشر ألعاب إلهاء.","prevent":"اختار معاد يناسبه: بدري قبل النعس، ومطعم مش بطيء. لو المكان هيطول اديله سناك صغير قبل الخروج — طفل جوعه وصل للقاع مش هيتربى في المطعم. جهزوا «شنطة المطعم»: كام لعبة صغيرة وألوان بتظهر في المطاعم بس فبتفضل مشوقة. وفي العربية قول التوقعات: «هنقعد على ترابيزة، الأكل ممكن يتأخر، ولو زهقت قولي بصوتك العادي وأنا هساعدك».","vals":["آداب الأكل والشرب","الصبر والانتظار","إدارة الملل"]},
{"t":"حادث حمام بعد ما اتدرب","group":"الروتين اليومي","why":"التحكم في المثانة مهارة عصبية لسه طرية في سن ٣-٥ — الإشارة اللي بتقول «محتاج الحمام» بتضيع بسهولة لما الطفل يكون غرقان في اللعب أو متوتر. والانتكاسة بعد التدريب طبيعية ومتوقعة، وغالبًا بتيجي مع ضغط جديد: أخ صغير، حضانة جديدة، سفر، أو حتى دور برد. دي مش عناد ولا كسل — ده جهاز عصبي لسه بيتمرن على قراءة إشارات الجسم.","now":[{"d":"أول ثانية بتحدد كل حاجة: وشك محايد وصوتك عادي تمامًا، كأن كوباية مية اتكبت. من غير شهقة ولا تنهيدة ولا نظرة استياء — الطفل بيقرا وشك قبل كلامك.","say":"حصل حادث بسيط. هنغيّر وخلاص."},{"d":"خده الحمام ونضفه بهدوء وخصوصية — بعيد عن عيون إخواته أو الضيوف. الكرامة قبل النضافة، ومحدش يعرف غيركم انتو الاتنين.","say":"تعالى معايا، هنشيل الهدوم المبلولة ونلبس نضيف."},{"d":"خليه يشارك في خطوة صغيرة من التصليح — يحط الهدوم في السلة أو يمسك المناديل معاك — كمسؤولية عادية بصوت عادي، مش كعقاب.","say":"حط البنطلون في السلة وأنا هجيب الممسحة. إحنا بنصلح مع بعض."},{"d":"اقفل الموقف بتفسير بيطمّنه على جسمه بدل ما يكسّفه منه.","say":"جسمك بعت الإشارة متأخر شوية، بيحصل. المرة الجاية أول ما تحس ببطنك اجري على الحمام — وأنا كمان هفكرك."}],"after":"قبل النوم، جملة واحدة تقفل الموضوع من غير ما تفتحه تاني: «اللي حصل النهارده بيحصل لكل الأطفال وهما بيتعلموا، وجسمك بيتعلم كل يوم». لو الحوادث اتكررت أسبوع كامل، دوّر على الضغط اللي وراها — تغيير في البيت؟ حاجة في الحضانة؟ — وارجع لروتين تذكير هادي: «وقت الحمام» كل ساعتين كإعلان عادي، مش سؤال «عايز حمام؟» اللي إجابته دايمًا لأ.","mistake":"التوبيخ أو التكسيف: «انت كبير على كده!» أو «تاني؟! عيب» — الخزي بيخلي الطفل يخبي الحادث الجاي أو يمسك نفسه عمدًا، وده بيعمل إمساك ومشاكل جسمية حقيقية. والرجوع للحفاضة فجأة كرد فعل بيقول له «فشلت» — فالانتكاسة بتطول بدل ما تقصر.","schools":"<b>سيجل</b> يشرح إن التوتر بيقفل الجزء من المخ اللي لسه بيتعلم يقرا إشارات الجسم — علشان كده الانتكاسة وقت الضغط متوقعة مش مقصودة، والعلاج أمان مش عقاب. <b>مونتيسوري</b> بتتعامل مع الحادث كجزء طبيعي من تعلم العناية بالذات: الطفل يشارك في التنضيف بكرامة ومن غير دراما. <b>السلوكية</b> بتوصي: لا عقاب ولا اهتمام زيادة — روتين حمام بمواعيد ثابتة، وتعليق وصفي هادي على النجاحات: «جسمك بعت الإشارة وانت سمعتها وجريت».","prevent":"اعمل مواعيد حمام ثابتة (الصحيان، قبل الخروج، قبل النوم) وعند «نقط التحويل» — قبل ما يبدأ لعبة جديدة أو فيلم، لأن الطفل الغرقان في اللعب مش هيقطعه بإرادته. لبّسه هدوم سهلة القلع — أستك مش زراير وحزام. ولو في ضغط جديد في حياته زي أخ جديد أو حضانة، زوّد جرعة الحضن والوقت الفردي — مش جرعة المراقبة والأسئلة.","vals":["النظام والنظافة","طلب المساعدة","المسؤولية","أذكار اليوم: النوم والحمام والعطاس"]},
{"t":"بيقاطعك في الشغل من البيت","group":"الروتين اليومي","why":"في سن ٣-٥ الطفل مش قادر يستوعب إنك «موجود جسمًا وغايب فعليًا» — هو شايفك قدامه فمخه بيقول: ماما أو بابا هنا يبقى متاحين ليا. وإحساسه بالوقت لسه مش متكوّن: «ساعة واحدة» بالنسبة له زي «سنة». وأغلب المقاطعات أصلًا مش عايزة حاجة محددة — هي طلب اطمئنان: «انت لسه شايفني؟»","now":[{"d":"متردش وانت مديله ضهرك من على المكتب. لو مش في اجتماع، انزل لمستواه واديله ١٠ ثواني اتصال كامل بعينيك — أسرع وأشبع من ١٠ دقايق نص انتباه متقطع.","say":"أنا شايفك وسامعك. قولي اللي عايزه في ١٠ ثواني."},{"d":"سمّي الموقف وحدد نهايته بعلامة يشوفها بعينه مش بوقت يسمعه — ساعة رملية أو تايمر مرئي جنبه.","say":"أنا شغال دلوقتي. لما الرملة دي تخلص، أنا بتاعك انت بس."},{"d":"لو في اجتماع: إشارة اليد المتفق عليها قبل كده (إيد مفرودة يعني «شايفك ومستنيك»)، وإيدك على كتفه ثانية — اللمسة الهادية بتطمّن أكتر من همس «امشي بقى». وأول ما تخلص، سمّي اللي عمله.","say":"شفتك لما جيت، وشفتك استنيت لحد ما خلصت. أنا فاضي دلوقتي — ورّيني اللي كنت عايز توريهولي."}],"after":"نفّذ الوعد فورًا وحرفيًا — أول ما التايمر يخلص اقفل اللابتوب وروح له انت قبل ما يجيلك: «الرملة خلصت، جيتلك زي ما قلت». اللحظة دي بالذات هي اللي بتخلي الانتظار الجاي ممكن — لو الرملة خلصت وانت كملت شغل، التايمر كله بيفقد معناه. ولو اليوم كان طويل عليه، سمّيهاله: «النهارده كان يوم شغل تقيل وانت استنيت كتير — تعالى ناخد وقتنا مع بعض».","mistake":"الرد المتقطع — «ثانية واحدة… ثانية واحدة…» عشر مرات — بيعلّمه إن المقاطعة شغالة بس محتاجة إصرار أطول. والزعيق من على المكتب بيديله اللي جاي علشانه أصلًا — انتباهك — بس بنكهة وحشة، فبيرجع تاني. وتوقّع إن طفل ٤ سنين يسلّي نفسه ٣ ساعات متواصلة لوحده — ده فوق قدرة مخه، مش قلة أدب منه.","schools":"<b>فابر ومازليش</b>: اعترف بالرغبة قبل ما ترفضها — «انت عايزني دلوقتي» مسموعة بتهدي أكتر من «مش دلوقتي» مرفوضة. <b>السلوكية</b> بتبني الانتظار كمهارة تدريجية: علامة مرئية للوقت، فترات قصيرة بتطول شوية شوية، وانتباهك الفوري بعد الانتظار هو المكافأة الطبيعية اللي بتثبت المهارة. <b>أدلر</b> بيديله انتماء ودور بدل دور المتفرج المنسي: «انت مسؤول الرسم لحد ما أخلص، وهتوريني إنتاجك». <b>مونتيسوري</b>: البيئة المجهزة بتشتغل بدالك — رف أنشطة يقدر يديره لوحده من غير ما يحتاجك كل دقيقتين.","prevent":"املا الكوباية قبل ما تطلب منها: ١٠-١٥ دقيقة لعب بتركيز كامل قبل بلوك الشغل بتشتري ساعة هادية بعدها. جهّز «صندوق الشغل» — أنشطة مميزة بتنزل بس وقت اجتماعاتك فبتفضل محتفظة بسحرها. وعلّق كارت على المكتب: أحمر يعني اجتماع، أخضر يعني ممكن تيجي — وعرّفه على النظام بلعبة في وقت هادي، مش وسط الأزمة.","vals":["الصبر والانتظار","عدم المقاطعة","إدارة الملل","آداب الاستئذان"]},
{"t":"«أنا غبي» — كلام سلبي عن نفسه","group":"انفعالات ومشاعر","why":"في السن ده الطفل بيبني صورته عن نفسه من مرايتين: كلام الكبار عنه، وإحساسه لحظة الفشل. «أنا غبي» غالبًا ترجمة حرفية لـ«أنا محبط ومش عارف أعمل الحاجة دي» — قاموسه الانفعالي لسه صغير، فبدل ما يوصف اللحظة بيحكم على نفسه كلها. وساعات بتكون جملة مسموعة ومتكررة — من أخ أكبر، من الحضانة، أو منك انت على نفسك.","now":[{"d":"قاوم رغبتك ترد فورًا بـ«لا انت ذكي!» — النفي السريع بيقفل الحوار وبيعلّمه يقول الجملة علشان ياخد الطبطبة. الأول اسمع الإحساس اللي تحت الكلمة.","say":"انت متضايق أوي إن البازل مش راكب. الحاجة لما مش بتظبط بتبقى مقفلة فعلًا."},{"d":"افصل الحكم عن الموقف — رجّع الجملة من «أنا» لـ«الحاجة دي».","say":"انت مش غبي. انت واقف قدام حاجة صعبة لسه بتتعلمها. دول حاجتين مختلفتين خالص."},{"d":"هات دليل ملموس من تاريخه هو — مش مدح عام، ذكرى محددة هو فاكرها بجسمه.","say":"فاكر لما السوستة كانت مستحيلة؟ جرّبت كتير وبعدين إيدك عرفت لوحدها. ده نفس اللي بيحصل مع البازل دلوقتي."},{"d":"قدّم له كلمة «لسه» كأداة يمسكها ويستخدمها بنفسه المرة الجاية.","say":"انت مش عارف تركبه... لسه. كلمة «لسه» معناها إن مخك شغال بيتعلم دلوقتي أهو."}],"after":"دوّر على مصدر الجملة: سمعها منين؟ وراقب كلامك انت على نفسك قدامه — «أنا غبي نسيت المفاتيح» بتتسجل عنده حرفيًا كطريقة الكلام مع النفس. خلي تعليقك اليومي وصف للفعل مش حكم على الشخص: «ركّبت الركن الصعب ده لوحدك وجربت تلات طرق» بدل «انت عبقري». ولو الجملة بقت يومية ومعاها انسحاب من أي محاولة، اسأل في الحضانة — ممكن في مقارنات أو معاكسات بتحصل هناك.","mistake":"المدح المضاد المبالغ فيه — «انت أذكى واحد في الدنيا!» — بيعلّمه حاجتين وحشتين: إن كلامك مش مصدّق (هو حاسس بالفشل قدامه أهو)، وإن في فعلًا حكم اسمه «ذكي/غبي» بيتوزع على الناس — وده نفس الفخ اللي واقع فيه. والضحك أو «بطّل دلع بقى» بيخليه يبطل يقول الجملة قدامك — مش يبطل يحسها.","schools":"<b>سيجل</b>: «سمّيها تروّضها» — الاعتراف بالإحباط بينزل التوتر الأول، لأن المنطق والإقناع مش بيوصلوا لمخ متعصب. <b>فابر ومازليش</b>: متتجادلش مع إحساس — اقبله الأول، وبعدين ساعده يوصف الموقف بدقة بدل ما يحكم على نفسه. <b>أدلر</b> بيفرّق بين التشجيع والمدح: المدح («انت ذكي») بيربط قيمته بالنتيجة فبيتكسر مع أول فشل، التشجيع («جربت تلات طرق») بيربطها بالمجهود — ودي المناعة الحقيقية ضد «أنا غبي». <b>مونتيسوري</b>: راجع مستوى الصعوبة — نشاط أصعب بكتير من قدرته بيصنع الجملة دي، والنشاط المظبوط على مستواه بيمحيها.","prevent":"اعمل ثقافة بيت واضحة: الغلط خطوة في التعلم مش فضيحة. اغلط انت قدامه بصوت عالي وصلّح: «حطيت ملح مرتين! ماشي، أول مرة أعملها، هعدّلها». وتعمّد تجيب له أنشطة في «منطقة النجاح بمجهود» — صعبة كفاية يحس بالإنجاز، وسهلة كفاية ينجح فيها أغلب الوقت.","vals":["تسمية المشاعر","الثقة بالمحاولة","الإصرار وإتمام العمل"]},
{"t":"رفض الحضانة الصبح","group":"انفعالات ومشاعر","why":"قلق الانفصال في سن ٣-٥ حقيقي وطبيعي — مخ الطفل مصمم يعترض لما يبعد عن مصدر أمانه. الرفض بيشتد بعد الإجازات والعيّات والسفر لأن الروتين اتكسر، وذروته لحظة الوداع نفسها مش اليوم كله — أغلب الأطفال بيهدوا خلال دقايق من مشي الأهل وبيلعبوا عادي. لكن لو الرفض جديد ومفاجئ بعد فترة حب للحضانة، ساعتها يستاهل تحقيق هادي: ممكن في حاجة بتحصل هناك.","now":[{"d":"سمّي إحساسه من غير ما تلغي الخطة — التعاطف والحزم في نفس الجملة، لأن التعاطف لوحده بيتفهم إن الباب لسه مفتوح.","say":"انت مش عايز تسيبني النهارده، والوداع صعب. وإحنا رايحين الحضانة زي كل يوم."},{"d":"نفّذ طقس وداع قصير وثابت بنفس الترتيب كل يوم: حضن، بوسة في كف إيده يقفل عليها («بوسة الجيب»)، تسليم للميس، ومشي واثق. الأمان بييجي من ثبات الطقس مش من طول الوقفة.","say":"بوسة الجيب أهي — لو وحشتك افتح إيدك تلاقيها. أنا جاي أخدك بعد ما تلعب وتاكل. بحبك، سلام."},{"d":"سلّمه للميس بالاسم قدامه وامشي وماترجعش — حتى لو عيّط. الرجوع بعد المشي بيعلّم مخه إن العياط بيرجّعك، فمشهد بكرة بيبقى أطول. الميس شايفة اللحظة دي كل يوم وعارفة تحتويها.","say":"ميس منى، أحمد معاكي دلوقتي، وأنا جاي الساعة اتنين."}],"after":"لحظة ما تستلمه، اقفل الدايرة بصوت واضح: «أنا رجعتلك زي ما وعدتك». الوعد المنفذ ده هو رصيد وداع بكرة. وبالليل وهو هادي، اسأل أسئلة محددة بتفتح الكلام: «مين قعد جنبك النهارده؟ إيه أحلى حاجة عملتوها؟» — مش «الحضانة حلوة؟» اللي إجابتها كلمة واحدة. لو الرفض استمر أسابيع أو ظهرت معاه كوابيس أو حوادث حمام، اقعد مع الميس واسأل عن تفاصيل يومه.","mistake":"التسلل — تستنى يتلهي في اللعب وتختفي. بيوفّر مشهد النهارده وبيدمر أمان بكرة: الطفل اللي اكتشف إن ماما ممكن تختفي في أي لحظة بيبطل يستغرق في اللعب وبيفضل ماسك رجلها طول الوقت. والمفاوضات الطويلة على الباب («خمس دقايق كمان؟ طيب اتنين؟») بتقول له إن القرار لسه مفتوح — فبيفاوض أكتر وأعلى.","schools":"<b>سيجل</b>: الأمان بييجي من التوقع — لما الطفل يعرف حكاية يومه («هتلعب، تاكل، تنام شوية، وأنا أجي») مخه بيتعامل مع الانفصال كخطة معروفة مش كخطر مفاجئ. <b>فابر ومازليش</b>: الاعتراف بالإحساس («الوداع صعب») مش بيزود العياط زي ما الناس فاكرة — بيقصّره، لأن المشاعر المسموعة بتعدي أسرع. <b>السلوكية</b>: الوداع القصير الثابت بيطفي الاعتراض مع الأيام، والوداع الطويل المتردد بيغذيه — كل دقيقة زيادة على الباب استثمار في مشهد بكرة. <b>أدلر</b>: روتين الصبح المصوّر بيحوّل سلسلة الأوامر لخريطة هو ماشي عليها بنفسه.","prevent":"حضّر اليوم من بليلته: «بكرة نصحى، نفطر، تلبس، وأوصلك لميس منى» — المخ اللي عارف الخطة بيقاوم أقل. حط حاجة منك معاه: صورة العيلة في الشنطة أو منديل بريحتك. وأهم بند: ١٠ دقايق حضن ولعب هادي الصبح قبل الخروج — لأن العجلة والزعيق الصباحي بيوصلوا للحضانة متلبسين في صورة «رفض حضانة».","vals":["الروتين والأمان","تسمية المشاعر","الوفاء بالوعد","تقبّل التغيير والمرونة"]},
{"t":"قواعد بيت الجدود المكسورة","group":"اجتماعي وإخوات","why":"طفل ٣-٥ قادر فعلًا يتعلم إن لكل مكان قواعده — زي ما عارف إن الجري مسموح في النادي وممنوع في المسجد. اللخبطة مش بتيجي من اختلاف القواعد بين بيتك وبيت جدو، بتيجي لما قواعد بيتك نفسها بتتغير حسب مزاجك وتعبك. ولما بيقول «جدو بيسمحلي» هو مش بيتمرد عليك — بيختبر سؤال واحد: القاعدة دي ثابتة ولا بتتفاوض؟","now":[{"d":"لما يحتج «بس جدو بيسمحلي!»، اعترف بالحقيقة بدل ما تنكرها — هو صادق، جدو فعلًا بيسمح، وإنكار الواضح بيعلّمه إن كلامك مش دقيق.","say":"عندك حق، عند جدو بتتفرج أكتر وبتاكل شوكولاتة قبل الغدا. دي قواعد بيت جدو."},{"d":"ثبّت قاعدة بيتك بجملة واحدة هادية ومن غير خطبة دفاعية — الشرح الطويل بيقول له إن القاعدة محتاجة تبرير، يبقى ممكن تتناقش.","say":"وفي بيتنا الشاشة بعد الغدا. كل مكان وله قواعده — زي ما المسجد ليه قواعد والنادي ليه قواعد."},{"d":"لو استمر في الزن، اديله اللي عايزه في الخيال بدل ما تدخل جدال منطقي مع طفل ٤ سنين.","say":"يا سلام لو الدنيا كلها ماشية بقواعد جدو — كنا عملنا غدا شوكولاتة أصلًا! تعالى نشوف الغدا الحقيقي فيه إيه."}],"after":"الكلام مع الجدود بيحصل بعيد عن ودانه خالص. اقعد معاهم واتفق على ٢-٣ خطوط حمرا بس — الأمان، النوم بدري في ليالي الحضانة، وممنوع التخويف والإحراج — وسيب الباقي عمدًا: شوية دلع زيادة عند الجدود مش هيكسر تربيتك، ده جزء من علاقة ليها قيمتها في حياته. وافتكر إن طريقة كلامك انت مع أبوك وأمك قدامه هي درس بر الوالدين الحقيقي اللي بيتسجل عنده.","mistake":"تحويل الجدود لخصم — «جدو بيبوظ تربيتك» قدام الطفل، أو مطالبتهم يطبقوا كل قواعد بيتك حرفيًا. الأول بيمزق ولاء الطفل بين ناس بيحبهم كلهم وبيعلّمه إن الكبير بيتنقد قدام الصغير، والتاني بيحوّل بيت الجدود من حضن لفرع تفتيش من بيتك. والغلطة العكسية: تستسلم في بيتك «خلاص زي ما بيحصل عند جدو» — ساعتها فعلًا مبقاش في قواعد، بقى في مزاج.","schools":"<b>أدلر</b>: الحزم والود مع بعض — تثبت قاعدتك من غير معركة، ومن غير ما تخلي الطفل يحس إنه غلطان لمجرد إنه جرّب يفاوض. <b>السلوكية</b> عندها خبر مطمئن: الأطفال بيتعلموا «التمييز بين السياقات» بسهولة — بيعرفوا إن الزن بيجيب نتيجة عند تيتة ومش بيجيب عند ماما، بشرط كل بيئة تكون ثابتة جوه نفسها. <b>فابر ومازليش</b>: اقبل الرغبة وامنع السلوك، والخيال («غدا شوكولاتة!») بيفك الزنقة اللي الجدال بيعقدها. <b>سيجل</b>: التحضير قبل الزيارة بيدي المخ خريطة، فصدمة الرجوع للقواعد بتقل.","prevent":"قبل الزيارة جهّزه بجملة بتحط الإطار: «إحنا رايحين بيت جدو — هناك في حاجات مسموحة أكتر، ولما نرجع بيتنا نرجع لقواعد بيتنا». وبعد الزيارة توقّع يوم «إعادة ضبط»: نوم بدري وروتين ثابت، ومتتعاملش مع نكديته كسوء أدب — ده جهاز بيرجع لوضعه الطبيعي. ومرة كل فترة راجع الخطوط الحمرا مع الجدود بلطف — بيسمعوا أحسن بكتير لما يحسوا إنك مقدّر دورهم مش بتفتش عليهم.","vals":["احترام القواعد","صلة الرحم","بر الوالدين","تقبّل التغيير والمرونة"]},
{"t":"بيصحى بالليل ويجي سريركم","group":"الروتين اليومي","why":"مخ طفلك بيصحى طبيعي بين دورات النوم، وأول حاجة بيدور عليها هي الأمان — وانت الأمان بالنسبة له. في السن ده كمان الخيال بيكبر بسرعة، فبتظهر مخاوف الليل والأحلام المزعجة. مجيّه لسريركم مش تدليع ولا مؤامرة، ده جهاز تعلّق شغال صح — بس ممكن نعلّمه يلاقي نفس الأمان في سريره هو.","now":[{"d":"أول ما ييجي جنب سريركم متزعقش ومتفتحش نقاش. قوم بهدوء واعترف بخوفه في جملة واحدة","say":"أنا هنا يا حبيبي. شكلك خفت. تعالى أوصلك لسريرك وأقعد معاك شوية."},{"d":"رجّعه لسريره بنفسك (الترجيع الهادي): امشي معاه، دفّيه، طبطب دقيقة، واخرج قبل ما يغمض — علشان يتعلم يكمل نومه لوحده","say":"سريرك دافي ومستنيك. أنا في أوضتي جنبك على طول، والصبح أول ما تصحى هشوفك."},{"d":"لو رجع تاني وتالت، كرر نفس الترجيع بس بكلام أقل كل مرة — هدوء ممل، من غير مفاوضات ومن غير نور قوي. الملل هو اللي بينجح مش الزعل","say":"وقت نوم. سريرك مستنيك."},{"d":"لو الخوف واضح وشديد (كابوس)، اقعد جنبه في أوضته هو لحد ما جسمه يهدى — الأمان ييجي لسريره، مش هو اللي يروح للأمان","say":"الحلم خلص وانت صاحي دلوقتي وفي أمان. أنا قاعد جنبك لحد ما جسمك يهدى."}],"after":"الصبح اتكلموا عن الليل من غير لوم، وقدّم نظام «كارت النوم»: كارت واحد كل ليلة يستخدمه لزيارة واحدة — حضن أو شربة مية — وبعد ما يستخدمه بنستنى للصبح. لما يصحى والكارت لسه معاه، صِف اللي حصل: «نمت الليل كله في سريرك وكارتك لسه معاك — جسمك بيتعلم يطمّن نفسه». التقدم بياخد أسابيع مش أيام، والليلة اللي يرجع فيها مش فشل — كمّل بنفس الهدوء.","mistake":"تقفل عليه الباب بالمفتاح، أو تهدده («لو جيت تاني هزعل منك»)، أو تعيّره («انت كبير وعيب») — الخوف مبيتعالجش بخوف أكبر ولا بكسوف. والغلطة الأكتر انتشاراً: العشوائية — مرة تسمح له ينام جنبكم ومرة ترفض على حسب تعبك، فبتعلمه إن المحاولة كل ليلة ليها أمل.","schools":"<b>دان سيجل</b> بيقول «اتواصل الأول بعدين وجّه»: الخوف بالليل حقيقي في مخ الطفل، والطبطبة السريعة مش دلع — دي بتهدي جهاز الإنذار في مخه وبعدها الترجيع للسرير بينفع. <b>التربية الإيجابية (أدلر)</b> بتوصي بالحزم والحنان مع بعض: بترجّعه كل مرة بنفس الهدوء، من غير عقاب ومن غير استسلام. <b>السلوكية</b> بتشدد على الثبات الممل: لو مرة نام معاكم ومرة لأ، ده تعزيز متقطع بيخلي المحاولة تستمر شهور — وكارت النوم أداة سلوكية ممتازة. <b>مونتيسوري</b> بتظبط البيئة: سرير يقدر ينزل منه، نور ليلي خافت، مية في متناوله — علشان الاستقلال بالليل يبقى ممكن أصلاً.","prevent":"روتين نوم ثابت ومهدي بنفس الترتيب كل يوم: حمام دافي، قصة، أذكار النوم، حضن. نور ليلي خافت ومية جنب السرير علشان ميحتاجكش لكل حاجة. لو بيخاف من العتمة اعملوا «جولة الأمان» قبل النوم تتفقدوا الأوضة مع بعض وهو اللي يمسك الكشاف. وبلاش شاشات قبل النوم بساعة — بتصعّب الدخول في النوم العميق وبتزود الصحيان.","vals":["الروتين والأمان","الاستقلال","أذكار اليوم: النوم والحمام والعطاس","الشجاعة وتجربة الجديد"]},
{"t":"فطام اللهاية والببرونة","group":"الروتين اليومي","why":"اللهاية والببرونة بالنسبة له مش أدوات — دي «حضن متنقل»: أول وسيلة تهدئة ذاتية عرفها في حياته، وبيرجع لها وقت النعس والتعب والقلق. بعد سن 3 المص المستمر بيبدأ يزق السنان الأمامية ويأثر على سقف الحلق والنطق، والببرونة في السرير بتسوّس السنان. فالفطام ضروري فعلاً — بس لازم يحصل كوداع محترم لحاجة بيحبها، مش كمصادرة.","now":[{"d":"اختار أسلوبك واثبت عليه: تدريجي (اللهاية تبقى للسرير بس، وبعد أسبوعين ولا مرة) أو وداع واحد نهائي بطقس. الاتنين بينجحوا — اللي بيفشل هو التذبذب بينهم","say":"من النهارده اللهاية بقت بتنام في السرير بس. هي بتستناك هناك وقت النوم."},{"d":"اديله السبب الحقيقي ببساطة — معلومة الدكتور، مش تخويف ولا «عيب»","say":"دكتور السنان قال إن اللهاية بقت بتزق سنانك وهي بتكبر. سنانك محتاجة مكانها علشان تطلع مظبوطة."},{"d":"اعمل طقس وداع هو اللي يختار شكله، وحط مكانها بديل تهدئة جديد يختاره بنفسه","say":"انت اللي هتقرر: نغلفها هدية لبيبي صغير محتاجها، ولا نحطها في علبة الذكريات؟ وبعدين هنختار مع بعض رفيق نوم جديد يكون بتاعك انت بس."},{"d":"أول ليالي هتبقى صعبة — اعترف بالوحشة من غير ما ترجع في كلامك، وعوّض بحضورك: قصة أطول وحضن أكتر","say":"واحشاك اللهاية، صح؟ صعب الواحد يسيب حاجة بيحبها. أنا جنبك، وهحكيلك النهارده حكايتين مش واحدة."}],"after":"الشغل الحقيقي في أول 3-5 أيام: زوّد الحضن والروتين، وقلل أي تغييرات تانية في نفس الفترة. لما يعدي ليلة، صِف من غير مبالغة: «نمت من غير لهاية — جسمك عرف يهدي نفسه لوحده». الببرونة نفس المنطق: كوباية جديدة هو اللي اختارها من المحل، واللبن بقى قبل غسيل السنان مش في السرير. ولو في حدث كبير جاي (أخ جديد، حضانة جديدة، سفر) أجّل الفطام لبعد ما الدنيا تستقر.","mistake":"تحط شطة أو حاجة مرة على اللهاية، أو تخبيها وتكذب («ضاعت خلاص») — المرار بيربط الفطام بالعقاب، والكذبة بتتكشف وبتكسر ثقته فيك. والسخرية («انت لسه بيبي؟») بتحوّل الفطام لخزي. وأكبر غلطة على الإطلاق: ترجّعهاله بعد ليلة عياط طويلة — كده علمته إن العياط الطويل هو مفتاح الرجوع.","schools":"<b>فابر ومازليش</b> بيعترفوا بالفقد وبيحققوا الأمنية في الخيال: «نفسك اللهاية تفضل معاك على طول، حتى لما تكبر وتسوق عربية!» — الاعتراف ده بيكسر المقاومة. <b>مونتيسوري</b> بتقدّم السبب الحقيقي باحترام (كلام الدكتور عن السنان) لأن الطفل بيتعاون مع المعلومة أكتر من الأمر، وبتفضّل الكوباية المفتوحة من بدري. <b>التربية الإيجابية (أدلر)</b> بتشرّكه في القرار والطقس علشان يخرج من التجربة حاسس إنه قادر مش مغلوب على أمره. <b>السلوكية</b> بتحذر من التعزيز المتقطع: مرة ترجّعها ومرة لأ — ده اللي بيطوّل المعركة شهور.","prevent":"قبل الفطام بأسابيع ضيّق الاستخدام: اللهاية للسرير بس مش في الشارع والتلفزيون، والببرونة تتبدل بكوباية في وجبات النهار. متشتريش احتياطي جديد — لما تتقطع أو تضيع دي فرصة طبيعية للوداع. لو في أخ رضيع بيستخدم لهاية، سمّي الفرق بوضوح: «دي بتاعة البيبي — انت بقى عندك رفيق النوم بتاعك». وجهّز أدوات تهدئة بديلة من بدري: بطانية، لعبة نوم، حضن طويل قبل ما ينام.","vals":["الاستقلال","تقبّل التغيير والمرونة","الشجاعة وتجربة الجديد","الاختيار وتحمّل النتيجة"]},
{"t":"معركة اللبس الصبح","group":"الروتين اليومي","why":"في سن 3-5 اللبس هو ساحة إعلان الاستقلال: «أنا اللي أقرر شكلي». المعركة نادراً ما تكون عن التيشيرت نفسه — هي عن مين صاحب القرار. وكمان مخه لسه مبيستوعبش معنى «هنتأخر»، فاستعجالك مالوش معنى عنده، بينما إحساسه بالسيطرة على جسمه وشكله معنى وجودي بالنسبة له.","now":[{"d":"قدّم اختيار من اتنين — انت اللي صفّيتهم فالاتنين مناسبين للجو، وهو اللي بيقرر بينهم","say":"الجو النهارده حر. التيشيرت الأزرق ولا الأصفر؟ قرارك انت."},{"d":"لو رفض الاتنين، متفتحش الدولاب كله — اثبت على الاختيارين وحوّل الطاقة للعب بدل الجدال","say":"الاختيارين دول هما اللي موجودين النهارده. تحب تلبس لوحدك ولا نعمل سباق: انت والبنطلون قبل ما المنبه يرن؟"},{"d":"افصل الثابت عن المرن بوضوح: قاعدة الجو مش للنقاش، والشكل والألوان ملكه هو","say":"قاعدة اللبس عندنا واحدة: على قد الجو. الشمس حرقانة فالكاب لازم — بس انت اللي تختار أنهي كاب."},{"d":"لو اختار حاجة غريبة بس آمنة ومناسبة للجو — سيبه يكسب. الاستقلال أهم من التنسيق","say":"مش متطابقين؟ ماشي، ده ستايلك انت النهارده."}],"after":"انقل المعركة كلها لوقت مفيش فيه ضغط: بالليل قبل النوم اعملوا طقس «كرسي الهدوم» — هو يختار من اتنين وهو رايق ويحط اللبس على الكرسي، فالصبح مفيش قرارات خالص. ولما يلبس لوحده صِف الفعل: «لبست البنطلون وقفلت السوستة لوحدك — إيدك بقت أسرع». ولو يوم اضطريت تلبّسه انت علشان متأخرين، سمّيها بصراحة: «النهارده أنا ساعدتك علشان مستعجلين، بكرة ترجع تلبس لوحدك».","mistake":"تدخل عناد في عناد وتلبّسه بالعافية وهو بيصوّت — كسبت خمس دقايق وخسرت أسابيع من المقاومة. أو تسخر من اختياره («هتنزل بالمنظر ده؟») فتعلّمه إن ذوقه غلط. أو العكس: تفتح الدولاب كله وتقول «البس اللي انت عايزه» — الاختيار المفتوح بيغرق مخ الطفل في السن ده؛ الاختيار من اتنين هو اللي بيريحه وبيخلص المعركة.","schools":"<b>أدلر/التربية الإيجابية</b> هي صاحبة فكرة الاختيار المحدود: اختيارين انت راضي عنهم، والروتين هو «الريّس» مش انت — «الروتين بيقول إيه دلوقتي؟». <b>مونتيسوري</b> بتحضّر البيئة: دولاب واطي في متناوله فيه هدوم الموسم بس، وقطع يقدر يلبسها لوحده — أستك بدل زراير صعبة، فتحات رقبة واسعة. <b>فابر ومازليش</b> بيكسروا التوتر بالهزار: الجزمة اللي «بتعيّط علشان عايزة رجلك». <b>روس جرين</b> بينبّه: لو المعركة يومية رغم كل ده، في مشكلة مش محلولة — ممكن تيكة بتوجعه أو خامة مضايقاه، اسأله في وقت هادي بدل ما تفترض العند.","prevent":"التحضير بليل عادة يومية مش حل طوارئ. رتّب الدولاب بحيث كل اللي في متناوله مناسب للموسم — التصفية بتحصل مرة في الشهر، مش مفاوضات كل صبح. اختار هدوم يقدر يتصرف فيها لوحده. وابدأ الصبح 10 دقايق أبدر — نص معارك اللبس سببها الحقيقي ضيق الوقت مش الطفل. ولو الرفض بيتكرر على نفس القطع، افحص: تيكة، سوستة بتخربش، خامة مضايقاه.","vals":["الاستقلال","الاختيار وتحمّل النتيجة","الروتين والأمان","تنظيم الوقت البسيط"]},
{"t":"مصمصة الصباع وقضم الأظافر","group":"انفعالات ومشاعر","why":"مصمصة الصباع وقضم الأظافر مش عناد ولا قلة أدب — دي أدوات تهدئة ذاتية: جهازه العصبي بيدور على حاجة تنظّمه وقت التوتر أو الملل أو النعس. المص بيرجّعه لأول إحساس أمان عرفه في حياته. العادة نفسها عَرَض؛ اللي محتاج انتباهك هو الضاغط اللي وراها: حضانة جديدة؟ أخ صغير؟ خناقات بيسمعها؟","now":[{"d":"متشدش إيده من بقه ومتعلقش قدام الناس. لو هتقول حاجة، قولها على انفراد وبنبرة ملاحظة مش أمر","say":"واخد بالي إن صوابعك في بقك كتير النهارده. في حاجة تاعباك ولا مضايقاك؟"},{"d":"سمّي وظيفة العادة قدامه — ده بيساعده يفهم نفسه — وقدّم بديل بيدي نفس الإحساس","say":"صباعك بيساعدك تهدى لما تقلق. تعالى نجرب حاجات تانية بتهدي: تعصر الكورة الطرية دي ولا تاخد حضن طويل؟"},{"d":"دوّر على الضاغط في وقت هادي، مش في لحظة العادة نفسها","say":"قولي: إيه أحلى حاجة حصلت النهارده في الحضانة؟ وإيه أصعب حاجة؟"},{"d":"اتفقوا على إشارة سرية بينكم بدل التنبيه العلني اللي بيكسف","say":"تعالى نعمل اتفاق سري: لو شفت صوابعك في بقك هلمس كتفك كده — دي إشارتنا احنا بس، محدش تاني يعرفها."}],"after":"راقب أسبوع واكتب إمتى بتحصل: قدام الشاشة؟ قبل النوم؟ بعد الحضانة؟ النمط هيوريك الضاغط الحقيقي. قص أظافره قصيرة بانتظام — الأظافر القصيرة بتقلل القضم تلقائياً من غير أي كلام. ولما يهدي نفسه بطريقة تانية، صِفها: «كنت متضايق ورحت جبت البطانية بدل صباعك — لقيت طريقة جديدة تهدي بيها نفسك». لو العادة زادت فجأة دوّر على تغيير حصل قريب. ولو استمرت بشدة بعد سن 5-6 أو بدأت تأثر على سنانه أو جلد صوابعه، استشير دكتور سنان أو أخصائي — بهدوء ومن غير ما يحس إنه «مشكلة».","mistake":"المناكير المر والشطة والقفاز العقابي — كلها بتحارب العَرَض بزيادة التوتر اللي هو أصل المشكلة، فالعادة إما تزيد أو تتحول لعادة تانية مستخبية. والتعليق العلني قدام الضيوف («شيل إيدك من بقك! عيب!») بيضيف خزي فوق القلق. وأخطر غلطة في فهمها: تعاملها كتحدي ليك — هو مش بيتحداك، هو بيهدي نفسه بالطريقة الوحيدة اللي يعرفها لحد دلوقتي.","schools":"<b>دان سيجل</b> بيفسرها إن السلوك رسالة من الجهاز العصبي مش قلة أدب: هدّي الجهاز الأول وبعدين فكّر في العادة. <b>روس جرين</b> بيقول «الطفل بيعمل كويس لو قادر» — العادة علامة على ضغط مش محلول، فشغلك تدوّر على الضاغط مش تحارب الصباع. <b>السلوكية</b> عندها أسلوب عكس العادة بشكل لطيف: بديل حسي بيدي نفس الراحة + إشارة متفق عليها، ووصف النجاحات بدل عقاب الزلات. <b>أدلر</b> بينبّه إن التركيز الزايد على العادة نفسها بيغذيها — اهتم بالطفل، مش بصباعه.","prevent":"قلل مصادر التوتر اللي في إيدك: خناقات قدامه، استعجال دايم، شاشات كتير قبل النوم. جهّز «ركن تهدئة» فيه بدايل حسية جاهزة: كورة ضغط، بطانية ناعمة، لعبة تتقلب في الإيد. ثبّت الروتين اليومي — العشوائية بتقلق الأطفال أكتر مما نتخيل. واضمنله 10 دقايق يومياً حضن ولعب معاك مش مشروطة بأي سلوك — التعبئة العاطفية المنتظمة بتقلل احتياجه للتهدئة الذاتية أصلاً.","vals":["تسمية المشاعر","طلب المساعدة","الروتين والأمان"]},
{"t":"بيلمس أعضاؤه قدام الناس","group":"الروتين اليومي","why":"في سن 3 لـ5 ده استكشاف طبيعي للجسم، زي ما اكتشف صوابعه ورموشه قبل كده — مش سلوك جنسي ولا قلة أدب. اللمس ده كمان بيبقى وسيلة تهدئة ذاتية زي مص الصابع بالظبط، وبيزيد وقت الملل أو التوتر أو النعس. ومفهوم «الخصوصية» نفسه لسه بيتبني عنده، فهو مش مدرك أصلًا إن فيه حاجات متتعملش قدام الناس.","now":[{"d":"متشدش إيده ومتعلقش قدام الناس — اقرب منه بهدوء واشغل إيديه بحاجة تانية فورًا.","say":"تعالى شوف إيه اللي معايا... امسك ده."},{"d":"خده على جنب لوحدكم، وقول القاعدة بجملة قصيرة محايدة — بنفس نبرة أي قاعدة تانية، من غير وش مصدوم.","say":"الأجزاء اللي بتغطيها الهدوم دي خاصة بيك انت. الحاجة الخاصة مش بنعملها قدام الناس — دي بتبقى في أوضتك أو في الحمام بس."},{"d":"اقفل الموضوع فورًا ورجعوا للقعدة عادي — الإطالة بتحول الموقف لحدث كبير.","say":"يلا بينا نرجع نكمل."},{"d":"لو اتكرر في نفس القعدة، متزودش الكلام — قدم شغلانة للإيدين.","say":"إيديك زهقانة؟ تعالى ركب معايا المكعبات دي."}],"after":"في وقت هادي بعدها — مش نفس اللحظة — العبوا لعبة «خاص ولا عام؟»: أوضة النوم؟ خاص. الصالة والضيوف؟ عام. الحمام؟ خاص. وفي نفس السياق أكد له إن جسمه ملكه ومحدش ليه يلمس الأجزاء الخاصة دي. وراقب امتى السلوك بيزيد — لو مرتبط بالملل أو التوتر أو النعس، عالج السبب مش السلوك: نوم كفاية، لعب حر، وقعدات أقصر من غير حاجة في إيده.","mistake":"رد الفعل الكبير: تشد إيده بعنف، تزعق «عيب! حرام!»، أو حتى تضحك قدام الناس. الخزي بيربط عنده الجزء ده من جسمه بالعار، وده بالظبط اللي بيخلي الطفل بعدين يخاف يحكيلك لو حد لمسه غلط. والرد الكبير كمان بيثبت السلوك لأنه جاب انتباه — والموضوع أصلًا مش أخلاقي في السن ده، ده فضول جسم عادي.","schools":"<b>مونتيسوري</b>: ده استكشاف حسي طبيعي، والعلاج توجيه الإيدين لنشاط هادف مش المنع الجاف. <b>سيجل</b>: اتصل قبل ما توجه — القرب الهادي بيخلي مخه قابل يتعلم القاعدة، والزعيق بيقفله. <b>أدلر/التربية الإيجابية</b>: حزم ولطف — علّم قاعدة «الخاص في المكان الخاص» من غير ما تلزق في الطفل وصمة. <b>السلوكية</b>: أي رد فعل قوي — حتى الضحك — بيعزز السلوك؛ إعادة التوجيه الهادية مع شغل الإيدين هي أسرع طريق لإطفائه.","prevent":"علّمه أسماء أعضاء جسمه الحقيقية ومفهوم الخاص والعام في أوقات الروتين الهادية (الحمام وتغيير الهدوم) — الطفل اللي عنده كلمات لجسمه بيتكلم بدل ما يستكشف قدام الناس. قبل القعدات الطويلة جهز حاجة تشغل إيديه. ولو السلوك زايد عن استكشاف عابر — متكرر بإلحاح أو شكله تقليد لحاجة شافها — راجع بهدوء إيه اللي بيتفرج عليه ومين بيخالطه، واستشير مختص من غير دراما.","vals":["جسدي وحدودي","الحياء والستر"]},
{"t":"ودود بزيادة مع الغرباء","group":"أماكن عامة وخروجات","why":"الود نفسه مش مشكلة — ده مزاج اجتماعي جميل ومهارة هتفيده طول عمره. المشكلة إن مخه في السن ده بيحكم على الناس من الابتسامة والشكل، ومفيش عنده رادار للنوايا — فالطفل الدافي بيبقى أسهل في الاستدراج مش أصعب. الهدف مش نطفي الود، الهدف نركب جنبه قاعدة أمان بسيطة بتشتغل أوتوماتيك.","now":[{"d":"لو لقيته بيتكلم مع غريب أو بيمشي معاه، متصرخش ومتكسفوش قدام الناس — اقرب بهدوء، حط إيدك على كتفه، وادخل في الموقف بابتسامة.","say":"أهلًا! تعالى يا حبيبي، محتاجينك معانا."},{"d":"بعد ما تبعدوا، افتح الموضوع من ناحية الود الحلو مش من ناحية الغلط.","say":"انت بتحب الناس والناس بتحبك، ودي حاجة حلوة فيك. بس عندنا قاعدة: قبل ما نمشي مع حد أو ناخد منه حاجة — حتى لو لطيف قوي — بنسأل ماما أو بابا الأول."},{"d":"درّبه بلعبة «لو حصل كده تعمل إيه؟» بنبرة لعب مش تخويف.","say":"لو حد قالك تعالى معايا أوريك قطط صغيرة في عربيتي، تقول إيه؟... صح: لازم أسأل ماما الأول!"},{"d":"ثبت قاعدة المدى البصري في الأماكن العامة كقاعدة ليكم انتوا الاتنين.","say":"قاعدتنا في المول: عينك تشوفني وعيني تشوفك — ولو مش شايفني، بتقف مكانك وتنده عليا."}],"after":"كمّل البناء على مهل: علّمه اسمه بالكامل واسمك ورقم موبايلك بالتدريج كأغنية. اعملوا تمرين «لو تهنا نطلب مساعدة من مين؟» — أم معاها أطفال، موظف لابس يونيفورم المحل، أمن المول — علشان يبقى عنده خطة إيجابية مش بس ممنوعات. وكرر لعبة «لو حصل كده» في العربية كل فترة، دايمًا بنبرة لعب.","mistake":"تزرع الرعب: «الغرباء بيخطفوا الأطفال!» — فيتحول الطفل الودود لطفل قلقان من كل الناس، ومن غير فايدة حقيقية لأن معظم الأذى أصلًا بييجي من ناس معروفة مش غرباء. المفهوم الأصح: مفيش «شكل وحش» — فيه تصرفات غلط: كبير بيطلب مساعدة من طفل، أو بيدي هدية من ورا ماما وبابا، أو بيقول «متقولش لحد» — دي العلامات، مش الشكل.","schools":"<b>سيجل</b>: التخويف بينشط جهاز الإنذار في المخ ويعطل التفكير — إحنا عايزين مخ يفتكر القاعدة وقت الموقف، مش مخ مشلول من القلق. <b>فابر ومازليش</b>: بدل المحاضرة، خلي القاعدة تطلع منه بالأسئلة: «لو حد عرض عليك شوكولاتة، قاعدتنا إيه؟». <b>أدلر/التربية الإيجابية</b>: التدريب المسبق بلعب الأدوار في وقت هادي بيبني قدرة حقيقية، أنجح بكتير من التحذير وقت الخطر. <b>السلوكية</b>: البروفة المتكررة هي اللي بتحول «نسأل ماما الأول» لاستجابة تلقائية — التكرار بيثبت، مش قوة التحذير.","prevent":"خليها طقس ثابت قبل أي خروجة — في العربية اسأله: «إيه قاعدتنا؟» لحد ما يقولها من غير ما تسأل. واتفق مع كل المحيطين إن محدش يقول له «دي سر بيني وبينك» حتى للهزار — السر اللي بيتخبى عن ماما وبابا ده سر مؤذي. وعلّمه إن الكبير الطبيعي مش بيطلب مساعدة من الأطفال — الكبار بيطلبوا المساعدة من كبار زيهم.","vals":["الأمان مع الغرباء","السر الجميل والسر المؤذي","طلب المساعدة"]},
{"t":"بيرفض يسلم على الضيوف","group":"اجتماعي وإخوات","why":"التحفظ مع الضيوف في السن ده مش قلة أدب — مخه محتاج دقايق يتأكد إن الشخص ده آمن قبل ما يقرب منه، ودي غريزة حماية سليمة مش عيب. وكمان جسمه ملكه: البوسة والحضن بالعافية بيعلموه إن راحة الكبار أهم من إحساسه بجسمه — ورسالة زي دي بتضعف قدرته يقول «لأ» لأي لمسة مش مرتاح لها بعدين.","now":[{"d":"قبل وصول الضيوف، جهزه بمين جاي وإديله اختيارات محدودة لشكل السلام — الاختيار بيديله تحكم فبيقلل الرفض.","say":"طنط منى وعمو أحمد جايين النهاردة. تحب تسلم بإيدك، ولا تعمل هاي فايف، ولا تقول أهلًا وانت واقف جنبي؟"},{"d":"لو استخبى ورا رجلك، متجبروش ومتقولش «عيب» — جملة محايدة للضيف، وجملة أمان ليه بصوت واطي.","say":"للضيف: «هو بياخد وقته الأول وبعدين بييجي يسلم» — وليه: «خد وقتك، وانت جاهز تعالى»."},{"d":"لو ضيف حب ياخده بالحضن والبوس غصب عنه، ادعم حدود جسمه بأدب وقدّم البديل فورًا.","say":"إحنا بنسيبه يختار طريقة السلام اللي تريحه — جرّب معاه هاي فايف، بيحبها قوي!"},{"d":"أول ما يعمل أي شكل سلام — حتى تلويحة من بعيد — صفه وصف هادي من غير مبالغة ولا تصقيف.","say":"انت لوّحت لطنط وقلت أهلًا — ده اسمه إفشاء السلام."}],"after":"بعد ما الضيوف يمشوا، افتكروا اللحظة الحلوة: «شفت وش عمو لما سلمت عليه؟ انبسط قوي». واتفقوا مع بعض على «خطة السلام» بتاعته للزيارة الجاية وثبتوها. الطفل اللي بيتسمحله يقرب بسرعته بيوسع دايرته لوحده مع الوقت — والإجبار بيعمل العكس: بيطول مدة الرفض.","mistake":"تجبره على البوس والأحضان أو تفضحه قدام الضيوف: «بقى ده كلام؟ عيب عليك!» — الرسالة اللي بتوصله: جسمك مش ملكك وإرضاء الكبار واجب حتى لو مش مرتاح، ودي عكس أول قاعدة في حمايته من التحرش. وكمان وصفه قدام الناس بـ«ده خجول» بيثبت عليه الدور فبيعيشه.","schools":"<b>سيجل</b>: الطفل المستخبي ورا رجلك مخه في حالة إنذار — محتاج أمان الأول، والأوامر بتزود الإنذار مش بتحله. <b>أدلر/التربية الإيجابية</b>: حزم ولطف مع بعض — السلام على الضيوف قيمة ثابتة مش اختيارية، وشكله اختياره هو؛ الاختيار المحدود بيحقق الاتنين. <b>فابر ومازليش</b>: خليك واعي للأدوار — «هو خجول» بتتحول لهوية بيعيشها؛ اوصف لحظات نجاحه بدل ما تلزق صفة. <b>مونتيسوري</b>: آداب التحية بتتبني بالتمرين والنمذجة في البيت (دروس اللباقة والكياسة)، مش بالاختبار المفاجئ قدام الضيوف.","prevent":"العبوا «لعبة الضيوف» في البيت: خبط على الباب، «أهلًا وسهلًا»، سلام بالإيد، هاي فايف — بروفة مرحة من غير ضغط بتبني المهارة قبل الموقف. وخليه يشوفك انت بتستقبل الضيوف بحرارة — النمذجة أقوى من مية تعليمة. واتفق مع العيلة الكبيرة مرة واحدة وبوضوح: محدش يجبره على بوسة أو حضن — وده مش دلع، ده حماية لجسمه.","vals":["إفشاء السلام","جسدي وحدودي","الضيافة"]},
{"t":"جاب من الحضانة لعبة مش بتاعته","group":"سلوك مؤذي","why":"في سن 3 لـ5 مفهوم الملكية لسه بيتكوّن — «أنا عايزها» في مخه أعلى صوت بكتير من «دي بتاعت مين». ده مش سرقة ولا عيب في أخلاقه، ده اندفاع طبيعي مع فهم لسه ناقص لقواعد الملكية. الجزء من المخ اللي بيأجل رغبة «دلوقتي حالًا» لسه بيتبني، ودورك تبني معاه القاعدة وطريقة الإصلاح — مش تحاكمه.","now":[{"d":"لما تلاقي اللعبة، ابدأ بفضول هادي مش استجواب — نبرتك هي اللي بتحدد هيصارحك ولا يخبي.","say":"شايف لعبة جديدة في شنطتك — دي منين دي؟"},{"d":"اعترف برغبته الأول — ده اللي بيفتح ودانه لباقي الكلام.","say":"عجبتك قوي وحبيت تفضل معاك في البيت. أنا فاهمك."},{"d":"قول القاعدة بجملة قصيرة، من غير كلمة «سرقة» ولا «حرامي».","say":"بس اللعبة دي بتاعت الحضانة. الحاجة اللي مش بتاعتنا بترجع لصاحبها."},{"d":"خططوا الترجيع مع بعض، وخليه هو اللي ينفذه بإيده — الإصلاح بإيده هو الدرس نفسه.","say":"بكرة الصبح هنوديها مع بعض، وانت اللي هتديها للمس بإيدك وتقولها: اللعبة دي كانت معايا وجيت أرجعها."}],"after":"بعد ما يرجعها فعلًا، صف اللي حصل وصف هادي: «رجعت اللعبة لصاحبها — ده اسمه أمانة». واقفل الموضوع خالص — متحكيهوش قدام العيلة كنكتة ولا فضيحة. لو الموضوع بيتكرر كتير، دور على اللي وراه: يمكن نفسه في لعبة زيها، أو بيجرب الحدود، أو بيدور على انتباه — عالج السبب مش بس اللعبة.","mistake":"وصمة «حرامي»، أو تحقيق طويل («ليه؟ مين علمك كده؟»)، أو اعتذار مُذل قدام كل أطفال الحضانة — النتيجة إنه يتعلم يخبي أحسن المرة الجاية، مش إنه يرجّع. والعكس برضه غلط: تسكت خالص وتسيب اللعبة معاه («أصله لسه صغير») — كده اتعلم إن اللي بيجيبه بيبقى ليه، وضاعت فرصة يتعلم إن الغلط بيتصلح.","schools":"<b>روس جرين</b>: ده نقص مهارة (ضبط الاندفاع وفهم الملكية) مش نقص أخلاق — والمهارة بتتعلم، مش بتتعاقب. <b>أدلر/التربية الإيجابية</b>: ركز على الإصلاح مش اللوم — اللي بيصلح غلطه بإيده بيتعلم مسؤولية، واللي بيتهان بيتعلم يستخبى. <b>فابر ومازليش</b>: اعترف بالرغبة قبل القاعدة — إنكار «بس أنا عايزها» بيولد مقاومة، والاعتراف بيها بيسهل التسليم. <b>مونتيسوري</b>: الملكية بتتبني بالممارسة اليومية المحسوسة: «ده بتاعك، ده بتاع أخوك، ده بتاع البيت». <b>السلوكية</b>: الترجيع لازم يحصل فعلًا — لو اللعبة قعدت في البيت ولو مرة، الرسالة اللي اتثبتت هي إن الاحتفاظ بينفع.","prevent":"خلي مراجعة الشنطة والجيوب طقس خروج ثابت من أي مكان — الحضانة أو بيت أصحابه: «نشوف — معانا حاجة مش بتاعتنا؟» بنبرة روتين عادية مش تفتيش. علّمه جملة الاستعارة: «ممكن أستعير اللعبة دي؟» واسأل المس لو الحضانة عندها نظام استعارة. والعبوا في البيت لعبة «بتاع مين؟» — تصنيف الحاجات على أصحابها بيثبت مفهوم الملكية بدري.","vals":["الأمانة","الاعتذار وإصلاح الخطأ","الصدق"]},
{"t":"بيقلد كلام وسلوك وحش","group":"سلوك مؤذي","why":"طفلك في السن ده إسفنجة: بيقلد أي حاجة جديدة عشان يجرب تأثيرها، مش عشان فاهم معناها. الكلمة الوحشة بتاخد قوتها من ردة فعلك — صدمة أو ضحكة أو زعقة، كلها بتقوله «الكلمة دي ليها مفعول سحري» فيكررها. التقليد نفسه مهارة تعلم طبيعية وصحية، المشكلة في المصدر مش في طفلك.","now":[{"d":"أول مرة تسمع الكلمة، خلي وشك محايد تمامًا وحوّل انتباهه لحاجة تانية من غير أي تعليق — الكلمة اللي ملهاش جمهور بتموت لوحدها.","say":"تعالى نشوف هنلعب إيه دلوقتي."},{"d":"لو كررها، اقعد على مستواه في وقت هادي وسمّي المصدر بهدوء من غير اتهام ولا استجواب — إنت بتفهمه إن الكلمة ليها أثر، مش إنه هو وحش.","say":"انت سمعت الكلمة دي في الحضانة ولا في فيديو؟ الكلمة دي بتضايق اللي بيسمعها، واحنا في بيتنا مش بنستخدمها."},{"d":"اديله بديل جاهز ليه نفس القوة — الطفل بيسيب الكلمة أسهل بكتير لما يلاقي حاجة تانية تقول نفس الإحساس.","say":"لما تتضايق قول: أنا زعلان جامد! أو قول: يا خبر أبيض!"},{"d":"لو اللي بيقلده فعل مؤذي زي ضربة شافها في كرتون، وقف الفعل بجسمك بهدوء وافصل له بين الخيال والحقيقة.","say":"مش هسمح بالضرب. اللي في الكرتون بيضحّك، بس في الحقيقة الضرب بيوجع."}],"after":"دور على المصدر: اقعد اتفرج معاه على اللي بيشوفه، واسأل المدرّسة بلطف مين بيقول إيه في الحضانة، وبدّل المحتوى بهدوء من غير ما تربط التغيير بعقوبة. لو قال الكلمة قدام ضيوف ما تكسفوش قدامهم — قول جملة عابرة زي «دي كلمة لسه بنتعلم إننا ما نقولهاش» وكمّل عادي، والكلام الحقيقي يبقى بعدين على انفراد. ولما يعبّر عن ضيقه بكلام مقبول، صف اللي عمله: «اتضايقت وقلت أنا زعلان — كده فهمتك على طول.»","mistake":"الضحك أول مرة وبعدين العقاب لما تتكرر. كده الكلمة كسبت مرتين: مرة كانت ترفيه بيضحّك ماما وبابا، ومرة بقت سلاح يجيب انتباهك وقت ما هو عايز. ردة الفعل الكبيرة هي الوقود — من أي نوع كانت.","schools":"<b>السلوكية</b> أوضح مدرسة هنا: سلوك من غير تعزيز بينطفي، والانتباه أقوى تعزيز — فالتجاهل الأول مش إهمال، ده علاج. <b>فابر ومازليش</b> يوصفوا الأثر بدل مهاجمة الطفل: «الكلمة دي بتضايق» مش «انت قليل الأدب». <b>سيجل</b> يفكرك إن التقليد بيسبق الفهم عند الطفل، فالشرح الهادي هو اللي بيربط الكلمة بمعناها. <b>مونتيسوري</b> تشتغل على تجهيز البيئة: المحتوى والصحبة اللي حوالين الطفل هما المنهج الحقيقي. <b>روس جرين</b> يقول لو التكرار مستمر دور على المهارة الناقصة — غالبًا مش لاقي كلمات تانية للضيق. <b>أدلر/التربية الإيجابية</b> تشوف إن الطفل بيدور على أثر وانتماء: اديله طريقة يتشاف بيها من غير الكلمة.","prevent":"اتفرج بنفسك مرة على أي قناة أو لعبة قبل ما تبقى متاحة له، واقفل التشغيل التلقائي اللي بينط من فيديو مضبوط لفيديو مش مضبوط. واعملوا مع بعض «قاموس بيتنا»: كلمات إحنا بنقولها وقت الضيق — والعبوها بهزار وهو رايق، عشان تكون جاهزة على لسانه وقت الغضب الحقيقي.","vals":["حفظ اللسان","تسمية المشاعر","ضبط الغضب"]},
{"t":"خسر قدام أصحابه وقلبها عياط","group":"اجتماعي وإخوات","why":"في سن 3-5 الطفل لسه بيربط قيمته كلها بالنتيجة: الخسارة قدام أصحابه مش لعبة ضاعت، دي إحساس «أنا وحش» وقدام جمهور كمان. الجزء اللي بينظم الانفعالات في المخ لسه في أول تكوينه، فالدموع دي رد فعل حقيقي مش دلع ولا قلة أدب. تحمّل الخسارة مهارة بتتبني بالتكرار، مش صفة بيتولد بيها.","now":[{"d":"اقرب منه وانزل على مستواه، ومن غير ما تكسفه قدام أصحابه سمّي اللي حصل — التسمية بتهدي الدماغ أسرع من أي نصيحة.","say":"انت خسرت الجولة دي وزعلان. وجع الخسارة حقيقي."},{"d":"ما تقلبش الحقيقة: ما تقولش «لا انت اللي كسبان» وما تطلبش من أصحابه يخسروا مخصوص. ثبّت الحقيقة وافتح باب المحاولة، وخد معاه نفس عميق.","say":"خسرت الجولة دي، وممكن تكسب الجولة الجاية. تعالى ناخد نفس طويل مع بعض."},{"d":"اديله مخرج بكرامة: دور صغير يرجّعه وسط اللعب من غير ما يبقى محور الموقف هو العياط.","say":"تعالى انت اللي توزع الورق الجولة الجاية — وانت صاحب البيت، شوف مين عايز عصير."},{"d":"لو العياط اتحول لضرب أو رمي اللعبة، وقف الفعل بهدوء وخده خطوة على جنب لحد ما جسمه يهدى، وبعدين رجّعه.","say":"مش هسيبك ترمي اللعبة. تعالى نقف جنب بعض دقيقة لحد ما جسمك يهدى وبعدين نرجع نكمل."}],"after":"بعد ما الأصحاب يمشوا — مش قدامهم — ارجعوا للحكاية في وقت هادي: «افتكرت لما خسرت وزعلت وبعدين رجعت لعبت تاني؟ ده اللي بيعمله اللعّيب الجدع.» والعبوا في البيت ألعاب قصيرة كتير، بحيث يكسب ويخسر عشر مرات في ربع ساعة فتبقى الخسارة حدث عادي مش كارثة. واخسر انت قدامه بصوت عالي: «آه خسرت! متضايق شوية... طب هجرب تاني» — إنت بتوريه التمثيلية اللي المفروض يقلدها.","mistake":"إنك تخليه يكسب دايمًا عشان ما يعيطش. كده بتأجل المشكلة وبتكبّرها: أول خسارة حقيقية برا البيت هتيجي قدام أطفال مش هيراعوه، وساعتها هيقابلها من غير أي تدريب.","schools":"<b>سيجل</b>: اتواصل قبل ما توجّه — الدماغ العاطفي لازم يهدى الأول، وبعدين يبقى فيه ودن تسمع كلام عن الروح الرياضية. <b>فابر ومازليش</b>: اعترف بالمشاعر بدل ما تنكرها — «الخسارة صعبة» أنفع بكتير من «ولا يهمك، دي لعبة». <b>أدلر/التربية الإيجابية</b>: اديله مكانة ودور (يوزع، يضيّف) — الانتماء بيداوي إحساس «أنا أقل من أصحابي». <b>روس جرين</b>: العياط المتكرر عند الخسارة معناه مهارة مرونة ناقصة — بتتبني بالتدريب مش بالعقاب ولا بالإحراج. <b>مونتيسوري</b> تنصح بألعاب تعاونية جنب التنافسية في السن ده، عشان اللعب مايبقاش كله معركة. <b>السلوكية</b>: صف بالكلام سلوك «رجع كمّل اللعب بعد الخسارة» — ده بالظبط اللي عايزه يتكرر.","prevent":"قبل ما الأصحاب ييجوا اعمل «كلمة قبل الماتش»: «هنلعب ألعاب فيها كسب وخسارة. لو خسرت هتحس بضيق — ده عادي، وبنقول: يلا جولة تانية.» ودرّبوا الجملة دي فعليًا وهو رايق. وخليه هو «المضيف»: يختار اللعبة ويجهز الحاجات ويقدم العصير — الدور بيديله قيمة ثابتة مش معتمدة على الفوز.","vals":["تحمّل الخسارة","تسمية المشاعر","الثقة بالمحاولة","الضيافة"]},
{"t":"كسر حاجة غالية وانت اتنرفزت جامد","group":"انفعالات ومشاعر","why":"اللحظة دي فيها حدثين مش حدث واحد: طفل كسر حاجة — غالبًا بإيد تحكمها الحركي لسه ضعيف وفضول طبيعي — وأب اتملى بغضب حقيقي. طفلك في السن ده مش بيفرّق بين «بابا زعلان من الفازة» و«بابا زعلان مني أنا»، فالانفجار الجامد بيتسجل عنده كتهديد للعلاقة نفسها. والخبر الكويس اللي بيقوله علم النفس: اللي بيبني الأمان مش إنك ما تغلطش أبدًا، لكن إنك تصلّح بعد ما تغلط.","now":[{"d":"وقف نفسك الأول: لو حاسس إنك هتكمل انفجار، ابعد خطوة وقول اللي جواك بصوت مسموع — دي مش ضعف، ده أقوى درس عملي في ضبط الغضب هيشوفه في حياته.","say":"أنا متنرفز جامد ومحتاج دقيقة أهدى فيها، وبعدين هرجع أكلمك."},{"d":"ارجع واصلح انت الأول: انزل على مستواه واعتذر عن الزعيق تحديدًا — مش عن زعلك من الكسر — وطمّنه على العلاقة.","say":"أنا زعقت بصوت عالي أوي وده خوّفك. أنا آسف على الزعقة. أنا بحبك حتى وأنا غضبان."},{"d":"بعد ما الاتنين تهدوا، رجّع المسؤولية من غير رعب: هو يشارك في إصلاح النتيجة بإيده، وانت معاه مش فوقه.","say":"الفازة اتكسرت وانت بتلعب جنبها. تعالى نلم مع بعض — انت هتمسك المقشة وأنا هشيل القطع الكبيرة عشان ما تتجرحش."},{"d":"اقفل الموقف بقاعدة واضحة للمستقبل، مش بتهديد ولا تذكير دايم بالغلطة.","say":"الحاجات اللي بتتكسر بنبص عليها بعنينا، ولو عايزين نمسكها بنسأل الأول."}],"after":"لما تلاقيه بعدها بيسأل قبل ما يلمس حاجة، صف اللي عمله: «سألت قبل ما تمسك — كده الحاجات بتفضل سليمة.» ولو الحاجة اللي اتكسرت ليها قيمة عاطفية وانت لسه متضايق، قول الحقيقة ببساطة: «أنا لسه حزين على الفازة، بس أنا مش زعلان منك» — كده بتعلمه إن المشاعر بتاخد وقت وده طبيعي، وإن الحزن على حاجة مش معناه سحب الحب من حد.","mistake":"إن إحساس الذنب من انفجارك يخليك تلغي المحاسبة خالص: «معلش يا حبيبي ولا يهمك» من غير ما يشارك في الإصلاح. اعتذارك عن الزعقة حاجة، وإصلاحه هو للي اتكسر حاجة تانية — الاتنين لازم يحصلوا، وكل واحد لوحده.","schools":"<b>سيجل</b> هو صاحب مفهوم «التمزق والإصلاح»: العلاقة مش بتتجرح من الغلطة، بتتجرح من الإصلاح اللي ما حصلش — واعتذار الأب لطفله بيبني في دماغ الطفل دايرة تنظيم المشاعر نفسها. <b>فابر ومازليش</b>: صف المشكلة بدل الاتهام — «الفازة اتكسرت» مش «انت خربت البيت». <b>أدلر/التربية الإيجابية</b>: ركز على الحلول مش على اللوم — السؤال الوحيد المفيد هو «نصلّح إزاي؟». <b>روس جرين</b>: الطفل اللي بيكسر كتير غالبًا عايش في بيئة مليانة حاجات فوق قدرته الحركية — عدّل البيئة قبل ما تعدّل الطفل. <b>مونتيسوري</b> أصلًا بتدي الأطفال أدوات حقيقية قابلة للكسر عشان يتعلموا الحرص، ومعاها طقس واضح للكسر: نلم، نمسح، نكمل من غير دراما. <b>السلوكية</b> تنبه: لو الانفجار هو أعلى جرعة انتباه بيوصله، الكسر ممكن يتكرر — خلي انتباهك الأكبر للسلوك الحريص مش للحادثة.","prevent":"بيت فيه طفل 3-5 محتاج هندسة مش حراسة: الغالي والقابل للكسر يطلع فوق أو يدخل ورا ضلفة، وفي متناوله تفضل حاجات مسموح يستكشفها براحته — كده بتقلل المواجهات من أساسها. ولنفسك: اعرف «إشارة الغليان» بتاعتك — سخونة في وشك؟ صوتك بدأ يعلى؟ — واتفق مع نفسك على حركة ثابتة: نفس عميق وخطوة لورا، قبل أي كلمة تطلع.","vals":["الاعتذار وإصلاح الخطأ","ضبط الغضب","المسؤولية"]},
{"t":"مش بيسمع غير لما تزعق","group":"سلوك مؤذي","why":"ده مش عند ولا مشكلة في ودانه — ده تدريب حصل بالغلط: طفلك اتعلم إن الطلبات الهادية الأولانية «مسودة» مش لازم تتنفذ، وإن الجد الحقيقي بيبدأ لما الصوت يعلى. وكمان طفل 3-5 لما يكون غرقان في اللعب بيحصل عنده انتباه انتقائي حقيقي — النداء من أوضة تانية فعلًا مش بيوصله. يعني المشكلة في طريقة توصيل الطلب، مش في الطفل.","now":[{"d":"بطّل نداء من بعيد: قوم واقرب منه، انزل على مستوى عينه، حط إيدك على كتفه بهدوء واستنى عينه تبص لعينك قبل ما تتكلم.","say":"محتاجك تبصلي ثانية عشان أقولك حاجة مهمة."},{"d":"تعليمة واحدة بس، قصيرة، بصيغة الفعل المباشر — مش شرح طويل ولا ثلاث طلبات ورا بعض.","say":"العب دلوقتي بتتحط في الصندوق."},{"d":"اطلب منه يرجّع اللي سمعه بكلامه هو — لو قدر يقولها يبقى سمع فعلًا، ودي لحظة الفارق الحقيقية.","say":"قولّي: إيه اللي هتعمله دلوقتي؟"},{"d":"نفّذ بجسمك بدل ما تعيد بصوتك: لو ما اتحركش، امشي له وابدأوا مع بعض — صوتك يفضل عادي، رجليك هي اللي بتتحرك.","say":"تعالى نعملها مع بعض — تحب تبدأ انت ولا أبدأ أنا؟"}],"after":"راقب نفسك أسبوع واحد: كل مرة الزعقة تيجي على لسانك، افتكر إنها بتشتري سمع النهارده وبتبيع سمع بكرة — لأن الجرعة محتاجة تزيد كل مرة. ولما ينفذ من أول طلب هادي، صف بالظبط: «قلتلك مرة واحدة وقمت عملتها على طول — كده وفرنا وقت للحدوتة.» ولو يوم فلت منك وزعقت، صلّح قدامه: «أنا زعقت، وكان ممكن أقرب منك وأقولك بصوت عادي.»","mistake":"تكرار الطلب من مكانك خمس مرات بصوت بيعلى تدريجيًا. كده انت حرفيًا بتدرّبه إن أول أربع مرات ببلاش ومفيش داعي يتحرك غير عند مستوى صوت معين — المشكلة مش في ودانه، في نظام التدريب اللي اتعود عليه.","schools":"<b>السلوكية</b> بتشرح الفخ بالظبط: الزعيق اتعزز عندك انت لأنه بيجيب نتيجة فورية، واتعزز عنده هو كإشارة البداية الحقيقية — والحل تغيير الإشارة (قرب + عين في عين) مش رفع الجرعة. <b>سيجل</b>: الزعيق بيحط دماغ الطفل في وضع دفاع، والدماغ المدافع مش بيسمع ولا بيتعلم أصلًا. <b>فابر ومازليش</b> يوصوا بالكلمة الواحدة بدل المحاضرة: «اللعب!» مع الإشارة بإيدك — أقصر بكتير وأنجح بكتير. <b>مونتيسوري</b>: الصوت الواطي بيخلي الطفل هو اللي يقرب ليك — جرب تهمس وشوف اللي هيحصل. <b>أدلر/التربية الإيجابية</b>: حنية وحزم مع بعض — أفعال متابعة هادية أكتر من كلام متكرر. <b>روس جرين</b>: لو «عدم السمع» بيحصل عند طلبات معينة بس زي قفل اللعب أو اللبس، فدي صعوبة انتقال مش عناد — التنبيه المسبق بيحلها.","prevent":"قلل عدد الأوامر في اليوم أصلًا — الطفل اللي بيسمع مية تعليمة بيعمل فلترة عشان يستحمل. خلي الروتين هو اللي يأمر بدالك: جدول صور للصبح وقبل النوم، وسؤالك يبقى «إيه اللي بعد كده في الجدول؟» بدل أمر جديد منك. واستخدم تنبيه الانتقال دايمًا: «خمس دقايق وبنقفل الألعاب» — بيقلل المقاومة قبل ما تبدأ.","vals":["حسن الاستماع","احترام القواعد","الروتين والأمان"]}
];

<h2 class="sec">3 · دور الأب والأم — والفروق بنت/ولد</h2>
<div class="panel"><h3>دور الأب</h3><ul>
<li><b>اللعب الخشن الآمن</b> (المصارعة والرفع) — ده اللي بيدرّب على تنظيم الإثارة ومعرفة حدود الجسم.</li>
<li><b>دفع محسوب نحو المخاطرة الآمنة</b> — التسلق والتجربة. الأطفال اللي بياخدوا ده بيطلعوا أجرأ.</li>
<li><b>نموذج للرجولة في التعامل</b> — طفلك بياخد منك نموذج الراجل: بيقلّد طريقتك في الكلام، واحترامك لأمه، وتصرفك وقت الغضب — ودي اللي هتبقى مرجعيته في تعامله مع الناس لما يكبر.</li>
<li><b>الحضور اليومي البسيط</b> أهم من الأنشطة الكبيرة النادرة.</li>
</ul>
<h3>دور الأم</h3><ul>
<li>غالبًا القاعدة الآمنة الأساسية في السن ده — والتنظيم الانفعالي بيتعلم من التهدئة المتكررة.</li>
<li>اللغة والحوار اليومي، وده أقوى متنبئ باللغة والقراءة بعدين.</li>
</ul>
<p><b>الأهم من التقسيم ده:</b> الأدوار دي مش بيولوجية بالكامل ومتبادلة. الطفل محتاج <b>الاتنين</b> يقدّموا: دفء + حدود. الأب اللي بيهدّي والأم اللي بتلعب خشن — ده كويس مش مشكلة.</p>
<div class="warn"><b>التنسيق:</b> متعارضوش قدامه. الاختلاف يتحل بعدين على انفراد. الطفل اللي بيلاقي إجابتين بيتعلّم يلعب على الاتنين، ودي بداية مشاكل حقيقية.</div></div>

<div class="panel"><h3>فيه فروق حقيقية بين تربية البنت والولد؟</h3>
<p class="big">معظم اللي بيتقال في الموضوع ده ثقافي مش علمي.</p>
<ul>
<li><b>الفروق المتوسطة صغيرة والتداخل ضخم:</b> الفروق بين طفلين من نفس النوع أكبر بكتير من الفرق المتوسط بين البنات والولاد. مفيش «طريقة للبنات» و«طريقة للولاد».</li>
<li><b>اللي عليه أدلة فعلًا هو إن معاملتنا إحنا بتختلف:</b> البنت بتتحذّر أكتر وبتتمنع من المخاطرة → ثقة أقل في قدرتها الجسدية. والولد بياخد قاموس مشاعر أقل وبيتقاله «الرجالة متعيطش» → تعبير انفعالي أضعف وغضب أكتر.</li>
<li><b>فروق التوقيت:</b> البنات في المتوسط بيسبقوا شوية في اللغة، والولاد بيحتاجوا حركة أكتر — بس ده متوسط، ومش قاعدة تتبني عليها معاملة.</li>
<li><b>اللي فعلًا بيختلف عمليًا:</b> توقيت البلوغ (البنات أبكر بحوالي سنتين، فحديث الجسد لازم يبدأ أبكر)، والمحتوى المجتمعي اللي بيتوجه لكل نوع (شكل الجسم للبنت، والقوة للولد).</li>
</ul>
<p><b>الخلاصة العملية:</b> اسأل نفسك — «هل كنت هقول نفس الكلام لو كان من النوع التاني؟». لو الإجابة لأ، غالبًا ده تحيز مش تربية.</p></div>

<h2 class="sec">4 · الحماية الاجتماعية: الدفاع عن النفس والبُليز</h2>
<div class="panel"><h3>تدرّج الرد — علّمهوله بالترتيب ده</h3><ol>
<li><b>الصوت:</b> «لأ! سيبني» بصوت عالي وواقف معتدل. أغلب المضايقات بتقف هنا.</li>
<li><b>المغادرة:</b> يمشي ويروح لمكان فيه ناس. المشي مش جبن — ده اختيار ذكي.</li>
<li><b>إبلاغ كبير:</b> «إبلاغ» مش «وشاية». علّمه الفرق: الوشاية عشان حد يتعاقب، الإبلاغ عشان حد يتحمي.</li>
<li><b>الدفاع الجسدي:</b> آخر خيار، ولما يكون محبوس أو الأذى بيحصل فعلًا — والهدف <b>يفك نفسه ويجري</b>، مش ينتقم.</li>
</ol>
<p><b>ردًا على سؤالك «إمتى لازم يبقى عنيف»:</b> مفيش «لازم». فيه حالة واحدة مقبولة — إنه يوقف أذى واقع عليه دلوقتي ومفيش طريق خروج، وبالحد الأدنى اللازم للهروب. أي حاجة بعد كده انتقام مش دفاع. والفرق ده لازم يتقال بوضوح، لأن الطفل اللي بيتقاله «اضرب اللي يضربك» بيتحول لطفل بيضرب الأول عشان يحمي نفسه استباقيًا.</p>
<div class="warn">المدارس والحضانات في الإمارات بتطبّق سياسات صارمة ضد العنف بغض النظر عن مين بدأ. فعلّمه التدرّج، واتفق مع المدرسة على آلية إبلاغ واضحة بدل ما تعتمد على رده الفردي.</div></div>
<div class="panel"><h3>البُليز (التنمر) — الفرق ومتى تتدخل أنت</h3><ul>
<li><b>مش كل خلاف بُليز.</b> البُليز = تكرار + قصد + اختلال قوة. الخلاف العابر مش كده.</li>
<li><b>علامات:</b> رفض مفاجئ للحضانة، كوابيس، رجوع لسلوك أصغر من سنه، حاجات بتضيع، صمت غير معتاد.</li>
<li><b>ردك:</b> صدّقه من غير درامية، ومتقولش «متخليش حد يزعلك». وثّق (تاريخ ووصف)، وروح للإدارة بطلب إجراء مكتوب مش شكوى شفهية.</li>
<li><b>الحماية الحقيقية = أصدقاء.</b> الطفل اللي معاه صاحب واحد على الأقل أقل عرضة بكتير. استثمر في الصداقات أكتر من التدريب على الرد.</li>
<li><b>والعكس مهم:</b> لو هو اللي بيضايق غيره — ده مش «شقاوة». اتعامل معاه بجدية من أول مرة.</li>
</ul></div>
<div class="panel"><h3>الشهامة والشجاعة — إزاي تتعلم فعلًا</h3><ul>
<li><b>الشجاعة مش عدم الخوف</b>، هي إنه يخاف ويعمل الحاجة برضه. سمّي ده بالاسم لما يحصل.</li>
<li><b>الشهامة بتتعلم بالقدوة والمواقف الصغيرة:</b> يدافع عن طفل أصغر، يساعد حد وقع، يقول الحق لما يبقى ضده.</li>
<li><b>«المتفرّج» هو المفتاح:</b> في مواقف التنمر، الطفل اللي بيتدخل بجملة واحدة («بلاش كده») بيغيّر الموقف. درّبه على الجملة دي بالاسم.</li>
<li><b>متكافئش الشجاعة بالكلام الكبير</b> — كافئها بالوصف: «قلت رأيك رغم إن ده كان صعب».</li>
</ul></div>

<h2 class="sec">5 · اتفادى إيه</h2>
<div class="panel"><ul>
<li><b>العقاب البدني.</b> الأدلة متسقة إنه بيزوّد العدوان والمشاكل السلوكية وبيقلل الثقة، ومفيش دليل إنه بيحسّن السلوك على المدى الطويل. وقانونيًا في الإمارات، قانون «وديمة» لحماية الطفل بيجرّم الإساءة الجسدية والنفسية.</li>
<li><b>التهديد اللي مش هتنفّذه</b> («هسيبك هنا»، «هرمي لعبك») — بيهدّ مصداقيتك ويزوّد قلقه.</li>
<li><b>التصنيف والألقاب</b> — «عنيد»، «شقي»، «خجول». الطفل بيعيش الوصف.</li>
<li><b>المقارنة</b> بالإخوات أو الأقارب — بتخلق تنافس مش دافع.</li>
<li><b>الشرح الطويل وقت النوبة</b> — مفيش استيعاب وقت الانفعال العالي.</li>
<li><b>عدم الاتساق</b> — أخطر من الشدة نفسها.</li>
<li><b>الرشوة المتكررة</b> — بتشتري دقيقتين وبتكلّفك شهور.</li>
<li><b>الحماية الزايدة</b> — كل مرة تحلّ له مشكلة يقدر يحلها، بتاخد منه ثقة.</li>
<li><b>الشاشة كمهدّئ أساسي</b> — بتمنع تعلّم التهدئة الذاتية.</li>
<li><b>التربية قدام الناس</b> — الإحراج العلني بيخلق مقاومة مش تعديل.</li>
</ul></div>

<h2 class="sec">6 · حاجات بتفرق وبتتنسى</h2>
<div class="panel"><h3>مزاج الطفل — ليه نصيحة نفعت مع طفل وفشلت مع تاني</h3>
<p>الأطفال بيتولدوا بمزاج مختلف، وده بيغيّر الأسلوب:</p><ul>
<li><b>الطفل الحساس:</b> بيتأثر بالصوت والزحمة والملمس. محتاج تحضير مسبق وانتقالات أبطأ ومساحة هدوء.</li>
<li><b>كثير الحركة:</b> محتاج تفريغ حركي قبل أي مهمة قعاد — مش عقاب.</li>
<li><b>بطيء التأقلم:</b> محتاج وقت مراقبة قبل الدخول، والدفع بيعكس النتيجة.</li>
<li><b>عالي الشدة:</b> فرحه عالي وغضبه عالي. الهدف تنظيم مش تهدئة كاملة.</li>
</ul></div>
<div class="panel"><h3>المكافآت والجداول — امتى تنفع وامتى تضر</h3><ul>
<li><b>بتنفع مؤقتًا</b> لسلوك محدد وواضح (الأسنان، ترتيب اللعب) ولفترة قصيرة.</li>
<li><b>بتضر</b> لما تُستخدم لحاجات المفروض تبقى داخلية (الكرم، القراءة، المساعدة) — الدراسات بتوري إن المكافأة بتقلل الدافع الداخلي.</li>
<li><b>القاعدة:</b> استخدمها لإطلاق عادة، وشيلها بالتدريج لما تثبت، وحوّل التركيز للوصف: «انت عملتها لوحدك».</li>
</ul></div>
<div class="panel"><h3>لما أنت تغلط — الإصلاح</h3>
<p>هتزعق وهتفقد أعصابك. ده بيحصل من كل الأهل. الفرق مش في إنك متغلطش، الفرق في الإصلاح:</p>
<ol><li>ارجع بعد ما تهدى أنت الأول.</li><li>سمّي فعلك: «أنا زعقت، وده كان غلط».</li><li>متبررش بسلوكه («عشان انت…») — ده بيلغي الاعتذار.</li><li>قول اللي هتعمله المرة الجاية.</li></ol>
<p>الأبحاث في التعلق بتقول إن العلاقة الآمنة مش اللي مفيهاش تصدّع — دي اللي بيحصل فيها إصلاح متكرر.</p></div>
<div class="panel"><h3>علامات إن ده مش عناد عادي</h3><ul>
<li>نوبات غضب شديدة جدًا وطويلة (أكتر من 20–25 دقيقة) ومتكررة يوميًا بعد سن 4.</li>
<li>عدوان بيسبب أذى حقيقي متكرر، أو إيذاء نفسه.</li>
<li>تأخر واضح في الكلام، أو فقدان مهارات كانت موجودة، أو ضعف شديد في التواصل البصري.</li>
<li>سلوك متغيّر فجأة مع انسحاب أو كوابيس أو رجوع للتبول اللاإرادي.</li>
</ul><p>دي مش حاجات تتحل بجدول — دي تتعرض على طبيب أطفال أو أخصائي نفسي أطفال. التدخل المبكر بيفرق جدًا.</p></div>


<h2 class="sec">7 · النوم</h2>
<div class="panel"><ul class="pts">
<li>الطفل من ٣ لـ٥ سنين محتاج من ١٠ لـ١٣ ساعة نوم في اليوم، والقيلولة محسوبة منهم — دي توصية الأكاديمية الأمريكية لطب النوم واعتمدتها أكاديمية طب الأطفال الأمريكية AAP. احسبها بالمقلوب: لو بيصحى ٦:٣٠ عشان الحضانة، يبقى المفروض يكون نايم من ٧:٣٠ لـ٨:٣٠ بالليل.</li>
<li><b>روتين النوم الثابت أقوى أداة عندك:</b> نفس ٣-٤ خطوات، بنفس الترتيب، كل ليلة، في حدود نص ساعة. الأبحاث بتقول الأطفال اللي عندهم روتين ثابت بيغفوا أسرع وبيناموا أطول وبيصحوا أقل بالليل — والفرق بيبان في كام ليلة بس.</li>
<li><b>صيغة AAP البسيطة:</b> «سنان → كتاب → سرير»: غسيل سنان، حدوتة، وبعدين السرير. ممكن تضيف حمام دافي قبلهم وتختم بأذكار النوم — المهم نفس الترتيب كل يوم عشان جسمه ياخد الإشارة إن النوم قرب.</li>
<li><b>ساعة هدوء قبل النوم:</b> قفل كل الشاشات قبل النوم بساعة على الأقل، ومفيش تليفزيون ولا تابلت في أوضة النوم أصلاً. نور خافت، لعب هادي — مفيش جري ولا زغزغة قبل السرير على طول.</li>
<li>اقفل كل «الأعذار» قبل ما تطفي النور: حمام، شربة مية جنب السرير، الدبدوب أو البطانية بتاعته. وخليه يختار حاجات صغيرة بنفسه (البيجاما دي ولا دي؟ الكتاب ده ولا ده؟) — الاختيار بيقلل العند.</li>
<li>اخرج من الأوضة وهو نعسان بس لسه صاحي — دي أهم نقطة في الموضوع كله. اللي بيغفو وانت جنبه، لما يصحى الساعة ٣ الفجر هيدور عليك عشان يعرف يرجع ينام. اللي اتعلم يغفو لوحده، بيرجع ينام لوحده.</li>
<li><b>لو بيقاوم النوم وبيطلع من الأوضة كتير:</b> جرب «تذكرة النوم» — كارت واحد كل ليلة يديله حق طلب واحد بس (شربة مية، حضن زيادة). خلص الكارت؟ بترجعه لسريره من غير أي كلام. نام من غير ما يستعمله؟ ياخد مكافأة صغيرة الصبح. الطريقة دي مجربة في دراسات محكّمة وقللت العياط والخروج من الأوضة لحد الصفر تقريباً.</li>
<li><b>نقله لسريره أو أوضته لوحده:</b> اختار فترة هادية (مش مع تدريب الحمام ولا أخ جديد ولا أول أسبوع حضانة)، وخليه شريك — يختار الملاية ومكان السرير. وبعدين انسحب بالتدريج: أول ليالي اقعد جنب السرير لحد ما يغفو، بعدين كرسي أبعد شوية، بعدين عند الباب، بعدين برة الأوضة. التعود بياخد من كام أسبوع لشهرين — الثبات هو السر.</li>
<li><b>لو بييجي سريركم في نص الليل:</b> «الرجوع الصامت» — رجّعه سريره بهدوء ومن غير مناقشة، غطيه وامشي. كل مرة، بنفس الطريقة، حتى لو عشر مرات في الليلة. لو استحملته مرة واحدة الساعة ٣، هو اتعلم إن الإصرار بينجح. لو ثبتّ، غالباً بتتظبط في أقل من أسبوع.</li>
<li>الكابوس: بيحصل في النص التاني من الليل. الطفل بيصحى مرعوب، فاكر الحلم، وبيندهلك. روح له بسرعة، احضنه وطمنه، وقوله إن الحلم مش حقيقي وخلص. نور نوم خافت عادي. والصبح ممكن يرسم الحلم وتألفوا له نهاية مضحكة — بياخد قوته منه.</li>
<li><b>ذعر الليل حاجة تانية خالص:</b> بيحصل في أول ساعة-ساعتين من النوم. الطفل بيصرخ أو بيرفس وعينيه ممكن تكون مفتوحة، بس هو نايم — مش شايفك، ومش هيفتكر أي حاجة الصبح. متصحيهوش ومتمسكوش بالعافية إلا لو هيأذي نفسه. اقعد جنبه بهدوء لحد ما تعدي (دقايق، وممكن توصل ٤٥ دقيقة) وسيبه يكمل نومه. المنظر مرعب ليك انت — هو مش حاسس بحاجة.</li>
<li><b>أكتر حاجة بتجيب ذعر الليل:</b> قلة النوم والإرهاق. أول علاج حقيقي هو تبدير معاد النوم. ولو بيتكرر كل ليلة في نفس الساعة تقريباً، NHS بتنصح بـ«الصحيان المجدول»: صحّيه صحيان خفيف قبل المعاد المعتاد بربع ساعة، كل ليلة لمدة أسبوعين — بيكسر الدورة عند أطفال كتير.</li>
<li><b>الخوف من الضلمة طبيعي جداً في السن ده:</b> نور نوم خافت دافي اللون مقبول ومش هيبوظ النوم، والباب مفتوح حبة عادي. والعبوا في الضلمة بالنهار — خيال ظل بالكشاف، لعب بعصاية مضية — عشان الضلمة تبقى مألوفة مش مرعبة.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«خلصنا سنان وحدوتة وأذكار. تصبح على خير يا حبيبي، أشوفك الصبح.»</li>
<li>«معاك تذكرة واحدة الليلة. تحب تستعملها دلوقتي في شربة المية، ولا تحوشها وتاخد مفاجأة الصبح؟»</li>
<li>بعد كابوس: «أنا هنا، خلاص. ده كان حلم، والحلم زي الرسمة — مش حقيقي. انت في سريرك، في أمان، وأنا جنبك.»</li>
<li>وانت بترجّعه لسريره بالليل — جملة واحدة ثابتة ومن غير زيادة: «وقت نوم. سريرك هنا يا حبيبي.»</li>
<li>نقلة السرير الجديد: «ده سريرك انت اللي اخترت ملايته بنفسك. هقعد جنبك لحد ما تغمض، وكل شوية هتلاقيني قاعد أبعد حبة — عشان انت بتكبر.»</li>
<li>وعد الطمأنة: «هعدي عليك بعد ٥ دقايق أطمن عليك» — وتعدي فعلاً قبل ما يندهلك، عشان يصدق إن مفيش داعي ينده.</li>
</ul></div>
<div class="warn">روح لدكتور الأطفال لو: بيشخر بصوت عالي معظم الليالي أو بتلاحظ وقفات في نفسه وهو نايم (ممكن تكون انسداد تنفسي أثناء النوم)؛ الكوابيس شبه يومية أو مستمرة بعد حدث صعب عدى عليه؛ ذعر الليل ابتدى جديد بعد سن ٥ أو بيتكرر أكتر من مرة في الليلة؛ نعسان ومرهق بالنهار رغم إنه بينام ساعات كفاية؛ أو مشاكل النوم بقت مأثرة على مزاجه وتركيزه وسلوكه بالنهار.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.healthychildren.org/English/ages-stages/preschool/Pages/Nightmares-and-Night-Terrors.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Nightmares, Night Terrors & Sleepwalking in Children</a> · <a href="https://www.nhs.uk/conditions/night-terrors/" target="_blank" rel="noopener">NHS — Night terrors and nightmares</a> · <a href="https://www.sleepfoundation.org/children-and-sleep/bedtime-routine" target="_blank" rel="noopener">Sleep Foundation — Perfecting Your Child's Bedtime Routine</a> · <a href="https://publications.aap.org/aapnews/news/6630/AAP-endorses-new-recommendations-on-sleep-times" target="_blank" rel="noopener">AAP News — AAP endorses AASM recommendations on sleep times (10–13h for ages 3–5)</a> · <a href="https://jcsm.aasm.org/doi/10.5664/jcsm.6288" target="_blank" rel="noopener">AASM Consensus Statement, J Clin Sleep Med 2016 — Recommended Amount of Sleep for Healthy Children</a> · <a href="https://www.healthychildren.org/English/healthy-living/sleep/Pages/bedtime-trouble.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Toddler Bedtime Trouble: 7 Tips for Parents</a> · <a href="https://www.healthychildren.org/English/healthy-living/oral-health/Pages/Brush-Book-Bed.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Brush, Book, Bed</a> · <a href="https://www.healthychildren.org/English/healthy-living/sleep/Pages/Big-Kid-Beds-When-To-Make-the-Switch.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Big Kid Beds: When to Make the Switch</a> · <a href="https://www.sleepfoundation.
