/* Two things sit at the top and hide the target unless we stop short of them:
   the page header, and the tab's own index bar that parks right under it. */
function stickyTop(){
 const top=document.querySelector(".top");
 const bar=document.querySelector("section.view.on .navbar");
 return (top?top.offsetHeight:0)+(bar?bar.offsetHeight:0)+12;
}
/* Landing on a heading is not one jump, which is why aiming once never worked.
   The distance we measure describes a page that does not exist yet: skipped
   blocks are still at their placeholder height, the sub-page swap has not
   happened, the web font has not landed. Every one of those moves the target
   after we aimed, and the jump ends up thousands of pixels off.
   So: put the skipped blocks back, reveal the target, aim — then keep re-aiming
   until the target holds still for three frames. */
let __cvOff=0,__jump=0;
window.scrollToEl=el=>{
 if(!el)return;
 const mine=++__jump;                      // a newer jump owns the scroll; this one lets go
 if(window.openSub)openSub(el);            // a target on a closed sub-page has no position
 // picking from the index names one thing. If the age filter is what's hiding it,
 // the reader lands on an empty list instead, so the filter gives way and says so.
 const amin=+(el.dataset||{}).amin,amax=+(el.dataset||{}).amax,sel=document.getElementById("ageSel");
 if(sel&&window.AGE&&amin&&!(amin<=window.AGE&&window.AGE<=amax)){
  sel.value="0";sel.dispatchEvent(new Event("change"));
 }
 clearTimeout(__cvOff);
 document.documentElement.classList.add("nocv");
 void document.body.offsetHeight;          // resolve the placeholders before measuring
 const aim=()=>{
  const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
  return Math.max(0,Math.min(max,el.getBoundingClientRect().top+scrollY-stickyTop()));
 };
 const first=aim();
 // a smooth glide reads well next door and is just a long wait across the tab
 window.scrollTo({top:first,behavior:Math.abs(first-scrollY)<innerHeight*1.2?"smooth":"auto"});
 // the moment the reader scrolls themselves, the landing is theirs to finish.
 // touchmove, not touchstart — a finger landing on the screen is not a scroll,
 // and treating every tap as one strands the jump wherever it had got to.
 const ac=new AbortController();let taken=false;
 ["wheel","touchmove","keydown"].forEach(t=>
  addEventListener(t,()=>{taken=true;},{passive:true,signal:ac.signal}));
 let n=0,hold=0,last=-1;
 const settle=()=>{
  if(taken||mine!==__jump)return stop();
  if(scrollY===last){                      // only correct once the scroll is at rest
   const y=aim();
   if(Math.abs(y-scrollY)<=1)hold++;else{hold=0;window.scrollTo(0,y);}
  }else hold=0;
  last=scrollY;
  if(hold<3&&++n<90)requestAnimationFrame(settle);
  else __cvOff=setTimeout(finish,200);
 };
 // handing the page back to content-visibility can nudge it, so aim once more
 // afterwards — where we come to rest is measured on the page the reader gets
 const finish=()=>{
  const y0=scrollY,ours=mine===__jump;stop();
  void document.body.offsetHeight;
  if(!taken&&ours){const y=aim();if(Math.abs(y-y0)>1)window.scrollTo(0,y);}
  // a web font arriving late re-flows every heading under it, and Safari has no
  // scroll anchoring to absorb that. Re-aim once when the fonts are really in —
  // but only if they arrive while the reader is still where we put them.
  if(document.fonts&&document.fonts.status!=="loaded"){
   const by=Date.now()+4000;
   document.fonts.ready.then(()=>{
    if(taken||mine!==__jump||Date.now()>by)return;
    const y=aim();if(Math.abs(y-scrollY)>1)window.scrollTo(0,y);
   });
  }
 };
 // only the jump that still owns the scroll hands content-visibility back
 const stop=()=>{ac.abort();if(mine===__jump)document.documentElement.classList.remove("nocv");};
 requestAnimationFrame(settle);
};

/* per-tab index model: groups of {label, sub, run()} */
function indexFor(id){
 const v=$(id);
 const label=h=>h.textContent.replace(/\(.*?\)/g,"").replace(/^[0-9]+ · /,"").trim();
 const scrollTo=elm=>{window.__navLock=Date.now()+2000;scrollToEl(elm);};
 if(id==="values"){
  const LVNAME={1:"الأساس",2:"البناء",3:"التوسع",4:"العمق"};
  return [1,2,3,4].map(l=>({g:`المستوى ${l} — ${LVNAME[l]}`,
   items:VALUES.filter(x=>x.lvl===l).sort((a,b)=>a.ord-b.ord).map(x=>({
    label:x.name,sub:`${x.cat} · ${x.age[0]}–${x.age[1]} سنين`,
    run:()=>goVal(x.name)}))}));
 }
 if(id==="sits"){
  const groups=[...new Set(SITS.map(x=>x.group))];
  return groups.map(g=>({g,items:SITS.filter(x=>x.group===g).map(x=>({
   label:x.t,
   run:()=>{const a=[...v.querySelectorAll("article.sit")].find(y=>y.querySelector("h3").textContent===x.t);if(a)scrollTo(a);}}))}));
 }
 const secs=[...v.querySelectorAll("h2.sec")];
 if(secs.length<3)return null;
 const cfg=TOC2[id];
 if(cfg){
  const groupOf=h=>{for(const gn of Object.keys(cfg))if(cfg[gn].some(x=>h.textContent.includes(x)))return gn;return Object.keys(cfg)[0];};
  return Object.keys(cfg).map(gn=>({g:gn,items:secs.filter(h=>groupOf(h)===gn).map(h=>({label:label(h),run:()=>scrollTo(h)}))}))
   .filter(x=>x.items.length);
 }
 return [{g:"",items:secs.map(h=>({label:label(h),run:()=>scrollTo(h)}))}];
}

/* shared API: show/hide the active-filter chip */
window.navFilter=(tabId,text)=>{const n=NAVS[tabId];if(!n)return;
 if(text){n.chipTxt.textContent=text;n.chip.classList.add("on");}else n.chip.classList.remove("on");};
/* "you are here" label follows the scroll */
TABS.forEach(([id])=>{const n=NAVS[id];if(!n)return;const v=$(id);

 const obs=new IntersectionObserver(es=>{if(Date.now()<(window.__navLock||0))return;
  es.forEach(e=>{if(!e.isIntersecting)return;
   n.here.textContent=e.target.textContent.replace(/\(.*?\)/g,"").replace(/^[0-9]+ · /,"").trim();});},
  {rootMargin:"-12% 0px -78% 0px"});
 marks.forEach(h=>obs.observe(h));});

tt.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});document.body.appendChild(tt);
addEventListener("scroll",()=>{tt.style.display=scrollY>600?"block":"none"});
window.openSub=node=>{
 const box=node&&node.closest&&node.closest(".subpage");
 if(!box||box.classList.contains("on"))return;
 const wrap=box.parentNode,nav=wrap.querySelector(".subnav");if(!nav)return;
 [...wrap.querySelectorAll(".subpage")].forEach(x=>x.classList.toggle("on",x===box));
 [...nav.children].forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===box.dataset.p)));
};
window.secGo=(tab,match)=>{go(tab);setTimeout(()=>{const h=[...$(tab).querySelectorAll("h2.sec")].find(x=>x.textContent.includes(match.replace(/^[0-9]+ · /,"")));if(h){window.__navLock=Date.now()+2000;scrollToEl(h);}},90);};
const setTop=()=>document.documentElement.style.setProperty("--toph",document.querySelector(".top").offsetHeight+"px");
setTop();addEventListener("resize",setTop);
/* the header changes height after boot too — the dialect picker appears, the web
   font lands — and a stale --toph parks the index bar over the text it points at */
if(window.ResizeObserver)new ResizeObserver(setTop).observe(document.querySelector(".top"));
/* ===== sub-pages: turn one long tab into a few short ones ===== */
const SUBPAGES=B.nav.subpages;
Object.entries(SUBPAGES).forEach(([tab,pages])=>{
 const v=$(tab);if(!v)return;
 [...v.children].forEach(k=>{
  if(k.tagName==="DIV"&&!k.className&&k.querySelector("h2.sec")){
   while(k.firstChild)v.insertBefore(k.firstChild,k);
   k.remove();}
 });
 const kids=[...v.children];
 // everything before the first grouped heading is the tab's own intro and stays put
 const startOf=h=>pages.findIndex(([,marks])=>marks.some(m=>h.textContent.includes(m)));
 const boxes=pages.map(([name])=>el(`<div class="subpage" data-p="${name}"></div>`));
 let cur=-1,intro=[];
 kids.forEach(k=>{
  if(k.tagName==="H2"&&k.classList.contains("sec")){const i=startOf(k);if(i>=0)cur=i;}
  if(k.tagName==="FOOTER")return;
  if(cur<0)intro.push(k);else boxes[cur].appendChild(k);
 });
 // numbers ran 1..27 across the whole tab, so a page would read 4, 12, 16, 21 —
 // the page name locates the section now
 boxes.forEach(b=>b.querySelectorAll("h2.sec").forEach(h=>{
  const t=h.firstChild;if(t&&t.nodeType===3)t.nodeValue=t.nodeValue.replace(/^\s*[0-9]+ · /,"");}));
 const nav=el(`<div class="subnav">${pages.map(([n],i)=>`<button data-i="${i}" aria-pressed="${i===0?"true":"false"}">${n}</button>`).join("")}</div>`);
 const after=intro[intro.length-1]||v.firstChild;
 after.after(nav);
 boxes.forEach((b,i)=>{if(i===0)b.classList.add("on");nav.after(b);});
 // keep source order: nav, then page 1..n
 boxes.slice().reverse().forEach(b=>nav.after(b));
 nav.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  [...nav.children].forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  boxes.forEach((x,i)=>x.classList.toggle("on",i===+b.dataset.i));
  scrollToEl(nav);};

});

const DIALECT_NAMES={msa:"العربية الفصحى",eg:"مصري",sham:"شامي",gulf:"خليجي",maghreb:"مغربي"};
const CONTENT_V=1;
const DIALECTS_AVAILABLE=["msa","eg"]; /* build:dialects */
function shellMsg(html){
 const el=document.getElementById("shellState");
 if(el)el.innerHTML=html;
}
function paintDialects(current){
 if(DIALECTS_AVAILABLE.length<2)return;
 const bar=document.getElementById("dialectBar"),sel=document.getElementById("dialectSel");
 if(!bar||!sel)return;
 sel.innerHTML=DIALECTS_AVAILABLE.map(d=>
  '<option value="'+d+'"'+(d===current?" selected":"")+'>'+DIALECT_NAMES[d]+'</option>').join("");
 bar.hidden=false;
 sel.onchange=()=>{
  localStorage.setItem("dialect",sel.value);
  // the whole page is built from the bundle, so swapping it means building again
  location.reload();
 };
}
async function pickDialect(){
 const saved=localStorage.getItem("dialect");
 if(saved&&DIALECT_NAMES[saved])return saved;
 try{
  const r=await fetch("/api/dialect",{headers:{accept:"application/json"}});
  if(r.ok){const j=await r.json();if(DIALECT_NAMES[j.dialect])return j.dialect;}
 }catch(e){}
 return "msa";
}
async function load(dialect){
 shellMsg("<p>بنحمّل المحتوى…</p>");
 const r=await fetch("/content/"+dialect+".json?v="+CONTENT_V);
 if(!r.ok)throw new Error("HTTP "+r.status);
 const B=await r.json();
 if(!B||!B.data||!B.data.VALUES)throw new Error("حزمة ناقصة");
 return B;
}
(async()=>{
 let d=await pickDialect();
 try{
  let B;
  try{B=await load(d);}
  catch(e){ if(d!=="eg"){d="eg";B=await load(d);} else throw e; }
  window.DIALECT=B.dialect||d;
  document.getElementById("shellState").remove();
  boot(B);
  paintDialects(window.DIALECT);
 }catch(e){
  shellMsg('<p>مش قادر أحمّل المحتوى دلوقتي.</p><p><button type="button" onclick="location.reload()">جرّب تاني</button></p>');
  console.error("content load failed",e&&e.message);
 }
})();
