const att=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
/* prose fields read as a wall — cut them into sentence chunks with a light
   marker so the eye has somewhere to land. presentation only: the words are
   untouched. splits never happen inside «...», and a field with unbalanced
   quotes just stays whole. */
const cutAt=(t,min)=>{
 t=String(t);const out=[];let cur="",q=0;
 const end=i=>i+1===t.length||t[i+1]===" ";
 for(let i=0;i<t.length;i++){
  const c=t[i];cur+=c;
  if(c==="«")q++;
  else if(c==="»"){q&&q--;
   /* «قول: «...جملة.»» — the sentence ends inside its quote, so the cut
      lands right after the quote closes, not never */
   if(!q&&/[.؟!]/.test(t[i-1]||"")&&cur.trim().length>=min&&end(i)){out.push(cur.trim());cur="";}}
  else if((c==="."||c==="؟"||c==="!")&&!q&&cur.trim().length>=min&&end(i)){out.push(cur.trim());cur="";}

const EVN=/ممارسة شائعة|مش دليل|مفيش دراسة|مفيش دليل|توصية طبية/;

    the same chunk as the note stays up in the list where it belongs */
 const ss=cutAt(t,1);
 let note="";
 while(ss.length>1&&ss[ss.length-1].length<130&&EVN.test(ss[ss.length-1]))
  note=ss.pop()+(note?" "+note:"");
 const rest=ss.join(" ");
 const cs=chunks(rest);
 const body=cs.length<2?mark(rest):`<ul class="brk">${cs.map(c=>`<li>${mark(c)}</li>`).join("")}</ul>`;
 return body+(note?`<div class="evnote">${mark(note)}</div>`:"");
};

/* Two things sit at the top and hide the target unless we stop short of them:
   the page header, and the tab's own index bar that parks right under it. */
function stickyTop(){
 const top=document.querySelector(".top");
 const bar=document.querySelector("section.view.on .navbar");
 return (top?top.offsetHeight:0)+(bar?bar.offsetHeight:0)+12;
}
/* Landing on a heading is not one jump, which is why aiming once never worked.
   The distance we measure describes a page that does not exist yet: skipped
   blocks are still at their placeholder height, the sub-page swap has not
   happened, the web font has not landed. Every one of those moves the target
   after we aimed, and the jump ends up thousands of pixels off.
   So: put the skipped blocks back, reveal the target, aim — then keep re-aiming
   until the target holds still for three frames. */
let __cvOff=0,__jump=0;
window.scrollToEl=el=>{
 if(!el)return;
 const mine=++__jump;                      // a newer jump owns the scroll; this one lets go
 if(window.openSub)openSub(el);            // a target on a closed sub-page has no position
 // a pick from the index may still be narrowing the tab, and a cross-link can
 // point at one of the parts it put away — the pick gives way, same as the age filter
 const hid=el.closest&&el.closest(".ixhide"),hv=hid&&el.closest("section.view");
 if(hv&&window.ixReset)ixReset(hv.id.slice(2));
 // picking from the index names one thing. If the age filter is what's hiding it,
 // the reader lands on an empty list instead, so the filter gives way and says so.
 const amin=+(el.dataset||{}).amin,amax=+(el.dataset||{}).amax,sel=document.getElementById("ageSel");
 if(sel&&window.AGE&&amin&&!(amin<=window.AGE&&window.AGE<=amax)){
  sel.value="0";sel.dispatchEvent(new Event("change"));
 }
 clearTimeout(__cvOff);
 document.documentElement.classList.add("nocv");
 void document.body.offsetHeight;          // resolve the placeholders before measuring
 const aim=()=>{
  const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
  return Math.max(0,Math.min(max,el.getBoundingClientRect().top+scrollY-stickyTop()));
 };
 const first=aim();
 // a smooth glide reads well next door and is just a long wait across the tab
 window.scrollTo({top:first,behavior:Math.abs(first-scrollY)<innerHeight*1.2?"smooth":"auto"});
 // the moment the reader scrolls themselves, the landing is theirs to finish.
 // touchmove, not touchstart — a finger landing on the screen is not a scroll,
 // and treating every tap as one strands the jump wherever it had got to.
 const ac=new AbortController();let taken=false;
 ["wheel","touchmove","keydown"].forEach(t=>
  addEventListener(t,()=>{taken=true;},{passive:true,signal:ac.signal}));
 let n=0,hold=0,last=-1;
 const settle=()=>{
  if(taken||mine!==__jump)return stop();
  if(scrollY===last){                      // only correct once the scroll is at rest
   const y=aim();
   if(Math.abs(y-scrollY)<=1)hold++;else{hold=0;window.scrollTo(0,y);}
  }else hold=0;
  last=scrollY;
  if(hold<3&&++n<90)requestAnimationFrame(settle);
  else __cvOff=setTimeout(finish,200);
 };
 // handing the page back to content-visibility can nudge it, so aim once more
 // afterwards — where we come to rest is measured on the page the reader gets
 const finish=()=>{
  const y0=scrollY,ours=mine===__jump;stop();
  void document.body.offsetHeight;
  if(!taken&&ours){const y=aim();if(Math.abs(y-y0)>1)window.scrollTo(0,y);}
  // a web font arriving late re-flows every heading under it, and Safari has no
  // scroll anchoring to absorb that. Re-aim once when the fonts are really in —
  // but only if they arrive while the reader is still where we put them.
  if(document.fonts&&document.fonts.status!=="loaded"){
   const by=Date.now()+4000;
   document.fonts.ready.then(()=>{
    if(taken||mine!==__jump||Date.now()>by)return;
    const y=aim();if(Math.abs(y-scrollY)>1)window.scrollTo(0,y);
   });
  }
 };
 // only the jump that still owns the scroll hands content-visibility back
 const stop=()=>{ac.abort();if(mine===__jump)document.documentElement.classList.remove("nocv");};
 requestAnimationFrame(settle);
};

/* ===== one behaviour for the index, whatever tab it is opened in =====
   Picking a name narrows the tab down to that one thing, and the pick sits in
   the bar as a chip — taking the chip off brings the whole tab back. The values
   tab always worked this way and everywhere else the same tap only scrolled, so
   the reader who used the index in two tabs got two different things from it. */
const ixLabel=h=>h.textContent.replace(/\(.*?\)/g,"").replace(/^[0-9]+ · /,"").trim();
/* the frame of a tab — its title, its bar, its pages — is not part of what narrows */
const ixFurniture=n=>n.tagName==="H1"||n.tagName==="FOOTER"||n.classList.contains("lede")
 ||n.classList.contains("navbar")||n.classList.contains("subnav")||n.classList.contains("subpage");
const ixOn=v=>!!v.querySelector(".ixhide");
window.ixReset=id=>{const v=$(id);if(!v)return;
 v.querySelectorAll(".ixhide").forEach(x=>x.classList.remove("ixhide"));
 if(v.clearFilter)v.clearFilter();else if(window.navFilter)navFilter(id,"");};
/* a tab written as sections narrows to one section: the heading and everything
   under it up to the next heading stays, the rest is put away */
window.ixSection=(id,h)=>{const v=$(id);if(!v||!h)return;
 v.querySelectorAll(".ixhide").forEach(x=>x.classList.remove("ixhide"));
 if(window.openSub)openSub(h);
 const kids=[...h.parentNode.children],from=kids.indexOf(h);
 let to=from+1;
 while(to<kids.length&&!(kids[to].tagName==="H2"&&kids[to].classList.contains("sec")))to++;
 kids.forEach((k,i)=>{if((i>=from&&i<to)||ixFurniture(k))return;k.classList.add("ixhide");});
 if(window.navFilter)navFilter(id,ixLabel(h));
 window.__navLock=Date.now()+2000;scrollToEl(h);};

/* per-tab index model: groups of {label, sub, run()} */
function indexFor(id){
 const v=$(id);
 if(id==="values"){
  const LVNAME={1:"الأساس",2:"البناء",3:"التوسع",4:"العمق"};
  return [1,2,3,4].map(l=>({g:`المستوى ${l} — ${LVNAME[l]}`,
   items:VALUES.filter(x=>x.lvl===l).sort((a,b)=>a.ord-b.ord).map(x=>({
    label:x.name,sub:`${x.cat} · ${x.age[0]}–${x.age[1]} سنين`,
    run:()=>goVal(x.name)}))}));
 }
 if(id==="sits"){
  /* the page orders its sections by a curated list — read the order off the
     rendered headings so the index never disagrees with the filter bar */
  const groups=[...v.querySelectorAll("h2.sec")].map(h=>h.dataset.g).filter(Boolean);
  return groups.map(g=>({g,items:SITS.filter(x=>x.group===g).map(x=>({
   label:x.t,run:()=>goSit(x.t)}))}));
 }
 const secs=[...v.querySelectorAll("h2.sec")];
 if(secs.length<3)return null;
 const cfg=TOC2[id];
 if(cfg){
  const groupOf=h=>{for(const gn of Object.keys(cfg))if(cfg[gn].some(x=>h.textContent.includes(x)))return gn;return Object.keys(cfg)[0];};
  return Object.keys(cfg).map(gn=>({g:gn,items:secs.filter(h=>groupOf(h)===gn).map(h=>({label:ixLabel(h),run:()=>ixSection(id,h)}))}))
   .filter(x=>x.items.length);
 }
 return [{g:"",items:secs.map(h=>({label:ixLabel(h),run:()=>ixSection(id,h)}))}];
}

async function pickDialect(){
 /* الاختيار المحفوظ والـworker الاتنين ممكن يقولوا لهجة اتحجزت — الفلتر
    على DIALECTS_AVAILABLE مش على قايمة الأسامي، وإلا الزائر القديم يفضل
    شايف حزمة مش منشورة. */
 const has=d=>DIALECTS_AVAILABLE.includes(d);
 const saved=localStorage.getItem("dialect");

 try{
  const r=await fetch("/api/dialect",{headers:{accept:"application/json"}});
  if(r.ok){const j=await r.json();if(has(j.dialect))return j.dialect;}

}

 if(!B||!B.data||!B.data.VALUES)throw new Error("حزمة ناقصة");

}

 /* a reference section is a heading plus whatever follows it until the next one */
 function sectionNodes(h){
  const out=[];let n=h.nextElementSibling;
  while(n&&!n.matches("h2.sec")){if(!n.classList.contains("cardbar"))out.push(n);n=n.nextElementSibling;}
  return out;
 }
 /* the card's text as a person would paste it, not as the DOM holds it */
 function cardText(card){
  if(card.matches("h2.sec"))
   return [card.innerText.trim()].concat(sectionNodes(card).map(n=>(n.innerText||"").trim()))
    .filter(Boolean).join("\n").replace(/\n{3,}/g,"\n\n").slice(0,2500);
  const out=[];
  card.querySelectorAll("h3,h4,h5,.row,p,li,.act1,.wk").forEach(n=>{
   if(n.closest(".cardbar"))return;
   const t=(n.innerText||"").trim();
   if(t&&!out.some(x=>x.includes(t)))out.push(t);
  });
  return out.join("\n").replace(/\n{3,}/g,"\n\n").slice(0,2500);
 }
 const linkTo=(type,id)=>location.origin+location.pathname+"#go="+type+":"+encodeURIComponent(id);

 /* ── share ─────────────────────────────────────────────────────────────── */
 async function share(card){
  const type=card.dataset.fbt,id=card.dataset.fbi;
  const body=cardText(card)+"\n\n"+linkTo(type,id);
  if(navigator.share){try{await navigator.share({title:id,text:body});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(body);toast(L().copied||"اتنسخ");}
  catch(e){toast(L().nocopy||"مقدرناش ننسخ");}
 }

 /* ── landing on a shared link ──────────────────────────────────────────── */
 function jump(){
  const m=/^#go=([a-z]+):(.+)$/.exec(location.hash||"");
  if(!m)return;
  const type=m[1],id=decodeURIComponent(m[2]);
  // the first call happens while the bundle is still loading — no go(), no cards
  // to look for. giving up here is safe: boot() calls back once the tabs are built
  if(!TAB[type]||typeof window.go!=="function")return;
  // this one tab change is the link landing, not a page the reader asked for, and
  // its push would take the hash with it — see the guard in go()
  window.__deepLink=1;window.go(TAB[type]);window.__deepLink=0;
  setTimeout(()=>{
   const card=[...document.querySelectorAll("[data-fbi]")]
    .find(c=>c.dataset.fbt===type&&c.dataset.fbi===id);
   if(!card)return;
   const d=card.closest("details");if(d)d.open=true;
   // cards are content-visibility:auto, so aiming once lands on a page that is not
   // laid out yet — scrollToEl re-aims until the target holds still
   if(window.scrollToEl)scrollToEl(card);else card.scrollIntoView({block:"center"});
   card.classList.add("jumped");setTimeout(()=>card.classList.remove("jumped"),1800);
  },260);
 }
 window.QAjump=jump;

  +'<div class="fbquote" id="mkQ"></div>'
  +'<div class="fbkinds" id="mkK"></div>'
  +'<textarea id="mkNote" maxlength="800" placeholder="الملاحظة — اختيارية. اللي وحش فيها بالظبط."></textarea>'
  +'<p class="mkdone" id="mkCount"></p>'
  +'<div class="fbrow"><button type="button" id="mkNo">إلغاء</button>'
  +'<button type="button" class="go" id="mkYes">احفظ</button></div></div>';
 document.body.appendChild(mw);
 const mq=id=>mw.querySelector("#"+id);
 MK_KINDS.forEach(k=>{
  const x=document.createElement("button");x.type="button";x.textContent=k;
  x.setAttribute("aria-pressed","false");
  x.onclick=()=>{mkPicked=k;[...mq("mkK").children].forEach(y=>y.setAttribute("aria-pressed",String(y===x)));};
  mq("mkK").appendChild(x);
 });
 const closeMk=()=>{mw.classList.remove("on");mkQuote="";mkCard=null;mkPicked="";};
 mq("mkNo").onclick=closeMk;
 mw.addEventListener("click",e=>{if(e.target===mw)closeMk();});
 mq("mkYes").onclick=()=>{
  if(!mkPicked){toast("اختار النوع");return;}
  const marks=readMarks();
  marks.push({t:Date.now(),kind:mkPicked,note:mq("mkNote").value.trim(),quote:mkQuote,
   type:mkCard?mkCard.dataset.fbt:"",id:mkCard?mkCard.dataset.fbi:"",dialect:curDialect()});
  writeMarks(marks);mkN();
  const sel=window.getSelection();if(sel)sel.removeAllRanges();
  pill.classList.remove("on");
  closeMk();toast("اتسجلت — "+marks.length);
 };

 /* the pill that follows a selection, because a phone has no keyboard */
 const pill=document.createElement("button");
 pill.type="button";pill.className="mkpill";pill.textContent="علّم";
 document.body.appendChild(pill);
 function showPill(){
  if(!marksOn()){pill.classList.remove("on");return;}
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||String(sel).trim().length<3){pill.classList.remove("on");return;}
  const r=sel.getRangeAt(0).getBoundingClientRect();
  if(!r||(!r.width&&!r.height)){pill.classList.remove("on");return;}
  pill.classList.add("on");
  const top=r.top+window.scrollY-46;
  pill.style.top=(top<window.scrollY+8?r.bottom+window.scrollY+8:top)+"px";
  pill.style.insetInlineStart=Math.max(8,r.left+window.scrollX)+"px";
 }
 document.addEventListener("mouseup",()=>setTimeout(showPill,10));
 document.addEventListener("touchend",()=>setTimeout(showPill,10));
 document.addEventListener("selectionchange",()=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)pill.classList.remove("on");
 });
 pill.onclick=e=>{e.preventDefault();markSelection();};

 function markSelection(){
  const sel=window.getSelection();
  const text=String(sel).trim();
  if(text.length<3){toast("حدد الجملة الأول");return;}
  const node=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement);
  mkCard=node&&node.closest?node.closest("[data-fbi]"):null;
  mkQuote=text.slice(0,600);mkPicked="";
  mq("mkWhere").textContent=mkCard?(T[mkCard.dataset.fbt]||"")+": "+mkCard.dataset.fbi:"بره الكروت";
  mq("mkQ").textContent="«"+mkQuote+"»";
  mq("mkNote").value="";
  mq("mkCount").textContent=readMarks().length+" علامة متسجلة قبل دي";
  [...mq("mkK").children].forEach(y=>y.setAttribute("aria-pressed","false"));
  pill.classList.remove("on");
  mw.classList.add("on");
 }
 bar.querySelector("#mkCopy").onclick=async()=>{
  const marks=readMarks();
  if(!marks.length){toast("مفيش علامات");return;}
  const out=marks.map((m,i)=>[
   (i+1)+" · "+m.kind+(m.id?"  ["+(T[m.type]||m.type)+": "+m.id+"]":""),
   "  النص: "+m.quote,
   m.note?"  الملاحظة: "+m.note:""
  ].filter(Boolean).join("\n")).join("\n\n");
  const head=marks.length+" علامة · "+curDialect()+"\n\n";
  try{await navigator.clipboard.writeText(head+out);toast("اتنسخوا كلهم");}
  catch(e){
   /* some browsers refuse the clipboard without a gesture they recognise; give
      the text back in something a person can select instead of a prompt */
   mq("mkWhere").textContent="كل العلامات";
   mq("mkQ").textContent="";
   mq("mkNote").value=head+out;
   mq("mkCount").textContent="المتصفح رفض النسخ. حدد الكلام ده وانسخه بإيدك.";
   mw.classList.add("on");mq("mkNote").select();
  }
 };
 bar.querySelector("#mkClear").onclick=()=>{
  if(!readMarks().length)return;
  if(window.confirm("تمسح كل العلامات؟")){writeMarks([]);mkN();}
 };
 bar.querySelector("#mkOff").onclick=()=>{
  try{localStorage.setItem("qaMark","0");}catch(e){}
  bar.classList.remove("on");toast("وضع التعليم اتقفل");
 };

 /* ── wiring ────────────────────────────────────────────────────────────── */
 function bars(){
  /* the reference is prose, so its headings become the anchors */
  document.querySelectorAll("#v-ref h2.sec:not([data-fbi])").forEach(h=>{
   h.dataset.fbt="ref";h.dataset.fbi=h.textContent.trim();
  });
  document.querySelectorAll("[data-fbi]").forEach(card=>{
   if(card.matches("h2.sec")){
    const nx=card.nextElementSibling;
    if(nx&&nx.classList.contains("cardbar"))return;
   }else if(card.querySelector(":scope > .cardbar"))return;
   const b=document.createElement("div");b.className="cardbar";
   const t=L();
   b.innerHTML='<button type="button" data-act="share">'+(t.share||"شارك")+'</button>'
    +'<button type="button" data-act="fb">'+(t.fb||"في حاجة مش مظبوطة؟")+'</button>';
   if(card.matches("h2.sec")){b.dataset.for=card.dataset.fbi;card.after(b);}
   else card.appendChild(b);
  });
 }
 document.addEventListener("click",e=>{
  const b=e.target.closest(".cardbar button");
  if(b){const own=b.parentElement.dataset.for;
   const card=own?b.parentElement.previousElementSibling:b.closest("[data-fbi]");
   if(!card)return;
   if(b.dataset.act==="share")share(card);else openFb(card,"");
   return;}
  const h=e.target.closest("[data-fbhome]");
  if(h){e.preventDefault();openFb(null,"");}
 });
 document.addEventListener("keydown",e=>{
  if(!marksOn())return;
  // one key, because the hand is already on the text
  if((e.key==="m"||e.key==="M"||e.key==="ء")&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))
   {e.preventDefault();markSelection();}
 });

 let pending=0;
 const sweep=()=>{clearTimeout(pending);pending=setTimeout(bars,60);};
 function boot(){
  bars();
  if(marksOn()){bar.classList.add("on");mkN();}
  // the content bundle arrives after this runs, and filters re-render on every
  // keystroke, so the only reliable signal is the DOM itself
  new MutationObserver(sweep).observe(document.body,{childList:true,subtree:true});
  jump();
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
 else boot();
 window.addEventListener("hashchange",jump);
 window.QAmark={on(){try{localStorage.setItem("qaMark","1");}catch(e){}bar.classList.add("on");mkN();},
  off(){try{localStorage.setItem("qaMark","0");}catch(e){}bar.classList.remove("on");},
  all(){return readMarks();}};
})();

</script>
</body>
</html>
