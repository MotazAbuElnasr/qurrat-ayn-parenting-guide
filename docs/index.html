<h2 class="sec">8 · المخاوف والقلق</h2>
<div class="panel"><ul class="pts">
<li><b>الخوف في سن ٣-٥ علامة نمو مش مشكلة:</b> خياله بيكبر بسرعة، فبيتخيل وحوش وضلمة وحاجات مش موجودة. أغلب المخاوف دي بتروح لوحدها مع الوقت لو اتعاملت معاها صح.</li>
<li><b>القاعدة الذهبية:</b> اعترف بالإحساس من غير ما تأكد الخطر. «شايفك خايف، وده إحساس صعب» — مش «مفيش حاجة تخوف، عيب». السخرية أو «انت راجل متخافش» بتعلمه يخبي خوفه، مش إنه يتغلب عليه.</li>
<li><b>والعكس برضه غلط:</b> الحماية الزيادة والتجنب بيكبّروا الخوف. كل مرة بنلغي الخطة عشان هو خايف، الخوف بياخد تأكيد إنه كان على حق. القاعدة: نطمّن ونساند — بس نكمّل.</li>
<li>قلق الانفصال على باب الحضانة طبيعي، خصوصاً مع حضانة جديدة أو بعد إجازة أو مرض. العياط في الغالب بيقف بعد ما تمشي بدقايق — اسأل المدرّسة بعدها قعد يعيط قد إيه، ومتتفرجش عليه من الشباك.</li>
<li>اعمل «طقس وداع» قصير وثابت: بوسة + حضن + هاي فايف + جملة ثابتة، وتسلّمه للمدرّسة وتمشي على طول. الوداع الطويل والرجوع لحضن تاني وتالت بيطوّل العذاب وبيزود القلق — قصاد كل دقيقة بتطوّلها، هو بيتوتر أكتر.</li>
<li>عمرك ما تزوغ من غير وداع — حتى لو بيعيط. التسلل بيريحك انت دقيقة، بس بيعلمه إن ماما وبابا ممكن يختفوا في أي لحظة، فبيبقى لازق فيك أكتر ومش واثق إنك هترجع. دي توصية صريحة من Zero to Three وAAP.</li>
<li><b>قوله هترجع إمتى بلغة الأطفال مش بالساعة:</b> «بعد ما تلعب وتاكل وتنام القيلولة، هتلاقيني جي» — والتزم بالمعاد بالظبط. كل مرة بترجع في معادك، رصيد الثقة بيزيد والوداع اللي بعده بيبقى أسهل.</li>
<li><b>حاجة صغيرة منك معاه بتفرق:</b> صورة العيلة في الشنطة، أو حتة قماش عليها ريحتك. وجهّزه باللعب: العبوا «حضانة» بالعرايس في البيت — العروسة بتتساب، بتلعب وتاكل، وماما بتيجي تاخدها في الآخر. كل مرة.</li>
<li><b>وشك هو البوصلة:</b> لو ودّعته وانت مبتسم وهادي وواثق، بيقرا إن المكان أمان. لو اتوترت أو دمّعت أو طوّلت، بيقرا إن في خطر فعلاً. لو انت اللي متضايق من الفراق، اتكلم مع حد كبير — بعيد عنه.</li>
<li><b>الخوف من الضلمة والوحوش:</b> قول الحقيقة بوضوح وحنية — «الوحوش مش حقيقية، دي صور من خيالك الشاطر» — وبعدين اديله أدوات تحكم: كشاف جنب السرير، نور نوم خافت، تفتيشة واحدة مطمّنة مع بابا وخلاص. وبالنهار اعملوا «سلم شجاعة»: كل كام ليلة خطوة — نور أخف شوية، الباب مقفول أكتر — مع مدح ونجمة لكل خطوة.</li>
<li>«بخاخ الوحوش» — الخبرا فعلاً مختلفين عليه: في أخصائيين نوم أطفال بيستخدموه لإنه بيدي الطفل إحساس بالسيطرة وبيهدي الليلة، وفي أخصائيين نفسيين بيحذروا إنه بيأكد للطفل إن الوحوش موجودة فعلاً ومحتاجة سلاح. الحل الوسط العملي: متبتدعهوش انت من نفسك؛ قول بوضوح إن الوحوش مش حقيقية، واديله أدوات اسمها شجاعة مش أسلحة. ولو مستخدمينه أصلاً وشغال والخوف بسيط — مش مصيبة، اسحبوه بالراحة.</li>
<li><b>المواقف الجديدة (دكتور، حفلة، مكان جديد):</b> التحضير المسبق نص الحل. احكيله هيحصل إيه خطوة خطوة، لو ينفع زوروا المكان قبلها، ومثّلوا الموقف في البيت (السماعة على الدبدوب). وروحوا بدري — اللي بيوصل قبل الزحمة بياخد وقته يسخّن، واللي بينزل في نص الدوشة بيتخض.</li>
<li><b>علّمه التنفس الهادي وهو رايق، مش في نص نوبة الخوف:</b> «شم الوردة» (شهيق من المناخير) و«اطفي الشمعة» (زفير طويل من البؤ). وعلّمه يسمّي الإحساس: «ده اسمه قلق — بييجي وبيمشي زي السحابة».</li>
<li><b>امدح الشجاعة بالاسم والتفصيلة:</b> «دخلت الفصل لوحدك النهاردة — دي شجاعة بجد». وعرّفه إن الشجاعة مش إن مفيش خوف — الشجاعة إنك تعمل الحاجة وانت خايف.</li>
<li><b>الفرق بين الطبيعي والمقلق:</b> الخوف الطبيعي مؤقت، بيهدى بالطمأنة، ومش بيوقف حياة الطفل. اللي يستدعي انتباه: قلق مستمر شهور وبيزيد، بيمنعه من الحضانة أو اللعب أو النوم، نوبات صعب جداً تتهدى، شكاوى جسمانية متكررة، أو رجوع لورا في حاجات كان أتقنها.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>طقس الوداع: «بوسة، حضن، هاي فايف! بحبك، وهاجي أخدك بعد القيلولة. يومك حلو يا بطل!»</li>
<li>لما يتعلق بيك وهو بيعيط: «شايف إنك زعلان، وده صعب. مس منى هتقعّدك مع أصحابك، وأنا جاي في معادي زي كل يوم. بوسة… وباي!» — وتمشي فعلاً.</li>
<li>الوحوش: «خوفك أنا فاهمه وحاسس بيه. بس هقولك الحقيقة: الوحوش مش حقيقية خالص — دي من خيالك الشاطر اللي بيرسم صور. تعالى نخلي خيالك يرسملنا وحش لابس طرطور وشكله مضحك!»</li>
<li>الضلمة: «الليلة هنلعب لعبة الشجاعة: النور الصغير نوّرناه، ولو عدّيت الليلة في سريرك، الصبح بنحط نجمة على الجدول.»</li>
<li>موقف جديد: «بكرة هنروح الدكتور: الأول هنقعد نستنى شوية، بعدين هيسمع صدرك بالسماعة، وبعدين نرجع. تعالى نجرب السماعة على الدبدوب الأول.»</li>
<li>التنفس: «خد نفس معايا: شم الوردة… واطفي الشمعة… برافو عليك، كمان مرة.»</li>
<li>المدح: «انت كنت خايف وبرضه جربت — ده اسمه شجاعة. الشجاع مش اللي مش بيخاف… الشجاع اللي بيعمل الحاجة وهو خايف.»</li>
</ul></div>
<div class="warn">اطلب رأي دكتور الأطفال أو أخصائي نفسي أطفال لو: قلق الانفصال لسه بنفس الشدة بعد ٤-٦ أسابيع من الانتظام في الحضانة من غير أي تحسن؛ الخوف بيمنعه من حاجات أساسية (رافض الحضانة خالص، مش بينام، بطّل يلعب)؛ نوبات ذعر شديدة صعب جداً تتهدى؛ شكاوى جسمانية متكررة (مغص، صداع، ترجيع) من غير سبب طبي — خصوصاً صباح أيام الحضانة؛ قلق على كل حاجة معظم الأيام؛ أو رجع لورا بشكل واضح (تبول لا إرادي بعد ما كان اتحكم، كلام بيبي). القلق في السن ده بيستجيب للعلاج كويس جداً — والتدخل البدري أسهل وأسرع.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.zerotothree.org/resource/separation-anxiety/" target="_blank" rel="noopener">Zero to Three — Separation Anxiety</a> · <a href="https://www.healthychildren.org/English/ages-stages/toddler/Pages/Soothing-Your-Childs-Separation-Anxiety.aspx" target="_blank" rel="noopener">AAP HealthyChildren — How to Ease Your Child's Separation Anxiety</a> · <a href="https://www.nhs.uk/mental-health/children-and-young-adults/advice-for-parents/anxiety-in-children/" target="_blank" rel="noopener">NHS — Anxiety in children (advice for parents)</a> · <a href="https://childmind.org/article/help-children-manage-fears/" target="_blank" rel="noopener">Child Mind Institute — How to Help Children Manage Fears</a> · <a href="https://childmind.org/article/separation-issues-in-young-children/" target="_blank" rel="noopener">Child Mind Institute — Helping Kids With Separation Anxiety</a> · <a href="https://www.childrenscolorado.org/just-ask-childrens/articles/fear-of-the-dark/" target="_blank" rel="noopener">Children's Hospital Colorado — What to Do When Kids Are Afraid of the Dark</a> · <a href="https://www.apa.org/pubs/books/supplemental/pediatric-sleep-problems/Monster_Spray.pdf" target="_blank" rel="noopener">APA clinical handout (Meltzer & Crabtree, Pediatric Sleep Problems) — Monster Spray (المعسكر المؤيد)</a> · <a href="https://nurturedfirst.com/toddler/monster-spray-alternatives/" target="_blank" rel="noopener" <h2 class="sec">9 · الأكل الانتقائي: طفلك مش هيجوّع نفسه</h2>
<div class="panel"><ul class="pts">
<li><b>القاعدة الذهبية (تقسيم المسؤولية بتاع إلين ساتر):</b> إنت مسؤول عن إيه الأكل، وإمتى، وفين — وطفلك هو المسؤول عن ياكل ولا لأ، وياكل قد إيه. لما كل واحد يلتزم بدوره، معارك السفرة بتنتهي.</li>
<li><b>يعني عمليًا:</b> 3 وجبات و2-3 سناكات في مواعيد شبه ثابتة، قاعدين على السفرة. بين الوجبات: مياه بس — لا بسكوتة ولا كوباية عصير ولا لبن. الطفل اللي بيلقط أكل طول اليوم عمره ما هيجوع وقت الوجبة.</li>
<li>الضغط بيجيب عكس النتيجة، ودي مش رأي — الأبحاث لقت إن الأطفال اللي بيتضغط عليهم ("كمّل الطبق"، "معلقتين كمان") بياكلوا أقل وبيكرهوا الأكلة نفسها، والأطفال اللي محدش ضغط عليهم أكلوا أكتر وتذمروا أقل.</li>
<li><b>الرشوة بالحلو بتضرب في الاتجاهين:</b> "كل الخضار عشان تاخد الشوكولاتة" بتعلّم الطفل إن الخضار حاجة وحشة بيتعوّض عليها، وإن الحلو هو الجايزة الغالية. قيمة الخضار بتنزل وقيمة الحلو بتعلى.</li>
<li><b>التعرض المتكرر المحايد هو السلاح الحقيقي:</b> الطفل ممكن يحتاج يشوف الأكلة الجديدة على السفرة 10-15 مرة أو أكتر قبل ما يقبل يدوقها. قدّمها، ماتعلقش، شيلها، وقدمها تاني الأسبوع الجاي. كل مرة بيشوفها فيها من غير ضغط هي خطوة لقدام حتى لو مالمسهاش.</li>
<li><b>حط دايمًا "أكلة أمان" واحدة على السفرة:</b> حاجة بسيطة الطفل عادة بياكلها — عيش، رز، زبادي، خيار، فاكهة — جنب أكل البيت العادي. كده هو عمره ما هيقوم من السفرة من غير حاجة يقدر ياكلها، وإنت مش مضطر تعمله وجبة مخصوص.</li>
<li><b>ماتبقاش مطبخ طلبات:</b> لو رفض الأكل، مفيش وجبة بديلة بتتعمل مخصوص ليه. "ده أكل النهارده" بهدوء ومن غير عقاب. اللي بيتعوّد إن الرفض بيجيب مكرونة بالجبنة هيرفض كل يوم.</li>
<li>الخوف من الأكل الجديد (food neophobia) طبيعي مية في المية من سن 2 لـ 6 وبيقل بعدها لوحده — ده جهاز حماية قديم في البني آدم، مش عناد ومش سوء تربية.</li>
<li><b>منحنى النمو أهم من أي وجبة:</b> لو الطفل ماشي على منحناه في متابعة الدكتور، يوم "ماكلش حاجة" ولا حتى أسبوع سيء مش مشكلة. شهية الطفل بتتقلب بشكل طبيعي لأن النمو بيبطأ بعد أول سنة — احسبها بالأسبوع مش باليوم.</li>
<li><b>خليك أنت القدوة:</b> كل نفس الأكل قدامه بسرور ومن غير محاضرة. الطفل بياكل زي ما بيشوف أهله بياكلوا، مش زي ما بيسمعهم بيقولوا.</li>
<li><b>خليه يغرف لنفسه:</b> حط الأطباق في نص السفرة وسيبه ياخد بإيده (أو ساعده). الإحساس إنه متحكم بيكسر نص المقاومة، حتى لو خد معلقة صغيرة.</li>
<li>بلاش تعليق على اللي بياكله خالص — لا مدح مبالغ ("شاطر! أكلت البروكلي!") ولا لوم. الأكل مش شطارة ومش قلة أدب، هو حاجة الجسم بيعملها.</li>
<li><b>الوجبة ليها آخر:</b> 20-30 دقيقة وبعدها الصحون بتترفع بهدوء، من غير تأنيب ومن غير بديل. الجعان هياكل كويس في السناك الجاية اللي في معادها — وده مش قسوة، ده اللي بيخلي جوعه الطبيعي يشتغل.</li>
<li><b>شرّكه في الأكل قبل السفرة:</b> يجي معاك السوبر ماركت يختار خضار، يغسله، يقلّب، يرص الطبق. الطفل اللي "عمل" الأكلة احتمال يدوقها أعلى بكتير.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>"مش لازم تاكلها. هي موجودة على السفرة لو حبيت."</li>
<li>"ده أكل النهارده. مش عايز؟ مفيش مشكلة خالص — السناك الساعة أربعة."</li>
<li>"إنت اللي تقرر تاكل قد إيه. جسمك هو اللي يعرف هو جعان ولا شبعان."</li>
<li>"جرّب لو حبيت، وسيبها لو مش حابب. ممكن تطلعها من بقك في المنديل لو مش عاجباك."</li>
<li>"خلصت؟ تمام يا حبيبي، ارفع طبقك." (من غير "بس إنت ماكلتش حاجة!")</li>
<li>بدل "تلات معالق كمان وخلاص": "أنا حطيت الأكل، وإنت تقرر."</li>
<li>لما يقول "مش بحب ده": "ماشي، مش لازم تاكله النهارده. ساعات بنحب الأكل بعد ما نشوفه كتير."</li>
</ul></div>
<div class="warn">روح للدكتور أو أخصائي تغذية أطفال لو: وزن الطفل واقف أو نازل أو خرج عن منحنى نموه؛ قايمة أكله أقل من 15-20 صنف وبتضيق مش بتوسع؛ بيرفض مجموعة أكل كاملة (كل البروتينات مثلًا) أو قوام معين بيخليه يهوّع أو يرجّع؛ في خوف ورعب حقيقي وعياط وقت الأكل مش مجرد رفض؛ أو في خمول وتعب وعلامات نقص تغذية. دي ممكن تكون علامات ARFID (اضطراب تجنب وتقييد الأكل) — ده محتاج تقييم متخصص، مش صبر أكتر ولا حزم أكتر.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.ellynsatterinstitute.org/satter-feeding-dynamics-model/" target="_blank" rel="noopener">Ellyn Satter Institute — The Satter Feeding Dynamics Model (Division of Responsibility)</a> · <a href="https://www.ellynsatterinstitute.org/wp-content/uploads/2016/03/Booklet-FWLGS-18-mo-thru-6-yr-Sample.pdf" target="_blank" rel="noopener">Ellyn Satter — Feeding with Love and Good Sense, 18 Months–6 Years (sample booklet, PDF)</a> · <a href="https://www.sciencedirect.com/science/article/abs/pii/S0195666306000195" target="_blank" rel="noopener">Galloway et al. 2006 — 'Finish your soup': Counterproductive effects of pressuring children to eat (Appetite)</a> · <a href="https://www.healthychildren.org/English/ages-stages/toddler/nutrition/Pages/Picky-Eaters.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — 10 Tips for Parents of Picky Eaters</a> · <a href="https://www.sciencedirect.com/science/article/abs/pii/S0195666307003716" target="_blank" rel="noopener">Dovey et al. 2008 — Food neophobia and 'picky/fussy' eating in children: A review (Appetite)</a> · <a href="https://www.nature.com/articles/1601541" target="_blank" rel="noopener">Wardle et al. 2003 — Modifying children's food preferences: effects of exposure and reward (Eur J Clin Nutr)</a> · <a href="https://www.sciencedirect.com/science/article/abs/pii/S0195666311005150" target="_blank" rel="noopener">Cooke et al. 2011 — Facilitating or undermining? The effect of reward on food acceptance (Appetite review)</a> · <a href="https://www.lebonheur.org/blogs/practical-parenting/picky-eater-or-eating-disorder-understanding-arfid-in-children" target="_blank" rel="noopener">Le Bonheur Children's Hospital — Picky Eater or Eating Disorder? Understanding ARFID in Children</a> · <a href="https://equip.health/articles/understanding-eds/arfid-vs-picky-eating" target="_blank" rel="noopener">Equip Health — ARFID vs. Picky Eating: Signs, Differences, and Support</a></p></details>

<h2 class="sec">10 · الشاشات</h2>
<div class="panel"><ul class="pts">
<li><b>منظمة الصحة العالمية (2019) للطفل من 3 لـ4 سنين:</b> أقصى وقت شاشة "قاعد" ساعة واحدة في اليوم، وكل ما قل كان أحسن. وفي المقابل: 3 ساعات حركة على الأقل في اليوم (منها ساعة حركة نشيطة) و10-13 ساعة نوم.</li>
<li><b>الأكاديمية الأمريكية لطب الأطفال (AAP) لسن 2-5:</b> ساعة أو أقل يوميًا من محتوى عالي الجودة، والشرط الأهم إنك تتفرج معاه وتتكلموا في اللي بتشوفوه — مش يقعد لوحده بالتابلت في أوضة.</li>
<li><b>AAP بقت تقيّم بـ"الخمس سيهات" (5 C's):</b> طفلك نفسه بيتأثر إزاي، المحتوى إيه، هل الشاشة بقت وسيلة التهدئة الوحيدة، الشاشة بتاكل وقت إيه (نوم؟ لعب؟ عيلة؟)، وهل بتتكلموا عن اللي بيشوفه.</li>
<li><b>المحتوى الكويس:</b> إيقاع بطيء، قصة واضحة، بيسأل الطفل يرد ويشارك. المحتوى الوحش: سريع ومتقطع ومليان مؤثرات صوتية وإعلانات — الطفل الصغير مش بيستوعب الإيقاع السريع وبيترهق بيه من غير ما يتعلم حاجة.</li>
<li><b>مشكلة اليوتيوب الحقيقية مش الحلقة، السلسلة:</b> الأوتوبلاي بيشغل فيديو ورا فيديو من غير قرار من حد، فالفرجة مبقالهاش آخر. قفل الأوتوبلاي بيحول الشاشة من بير من غير قاع لحلقة ليها نهاية معروفة.</li>
<li><b>قواعد ثابتة بتشتغل:</b> مفيش شاشة على السفرة خالص (ولا لك انت كمان)، مفيش شاشة قبل النوم بساعة على الأقل (CDC بتقول ساعة لساعتين)، ومفيش أي شاشة جوه أوضة نوم الطفل نهائي.</li>
<li><b>الشاشة مش المهدي الافتراضي:</b> لو كل زنة وكل زهقة حلها تابلت، الطفل عمره ما هيتعلم يهدي نفسه — وده تحذير AAP بالنص. لازم يتعلم طرق تانية: نفس عميق، حضن، ركن هادي، لعبة بيحبها.</li>
<li>مكالمات الفيديو مع تيتا وجدو في مصر مش محسوبة من وقت الشاشة — دي تفاعل حقيقي مش فرجة سلبية، وبتقوي اللغة والعلاقات.</li>
<li><b>الخروج من الشاشة من غير معركة بيبدأ قبل ما تفتحها:</b> اتفقوا الأول "حلقة واحدة وبعدين بنقفل"، إديه تحذير قبل النهاية بخمس دقايق، وخليه هو اللي يدوس زرار الإيقاف بنفسه — إحساسه بالتحكم بيقلل الانفجار.</li>
<li><b>جهّز النشاط اللي بعد الشاشة قبل ما تقفلها:</b> "بعد الحلقة هننزل الجنينة" بتنجح أكتر بكتير من "قوم بقى كفاية". الانتقال لحاجة حلوة أسهل من الانتقال للفراغ.</li>
<li><b>لو انفجر وعيّط بعد القفل:</b> كلام قليل وثبات. مش وقت شرح القواعد — طفل في نص الانهيار مش بيسمع منطق. جملة واحدة حنينة وحازمة، ومترجعش تفتح الشاشة عشان يسكت — لو رجعت، علمته إن العياط بيجيب التابلت.</li>
<li><b>إعدادات YouTube Kids المهمة:</b> اختار مستوى المحتوى "Preschool" (مخصوص لسن 4 وأقل)، فعّل Disable autoplay، اقفل خاصية البحث، وظبط تايمر من جوه التطبيق يقفل لوحده. أعلى درجة أمان: وضع "Approved content only" — الطفل مش بيشوف غير الفيديوهات والقنوات اللي انت وافقت عليها واحدة واحدة، والبحث بيتقفل تلقائي.</li>
<li>اعمل خطة ميديا مكتوبة للعيلة (Family Media Plan — أداة مجانية على healthychildren.org)، وطبّقها عليك انت الأول: CDC بتقولها صريحة — الطفل بيتعلم من الكلام واللعب والتفاعل مع البشر، مش من الشاشة.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«هنتفرج على حلقة واحدة بس، ولما تخلص إنت اللي هتقفلها بإيدك. اتفقنا؟»</li>
<li>«فاضل خمس دقايق وبعدين بنقفل. حضّر نفسك.»</li>
<li>«خلصت الحلقة. دوس انت على زرار الوقف... برافو عليك. يلا بينا نعمل اللي اتفقنا عليه.»</li>
<li>«أنا عارف إنك زعلان إن التابلت خلص. صعبة فعلًا. تعالى في حضني شوية.»</li>
<li>«التابلت مش بيقعد معانا على السفرة. بعد الأكل نشوف حاجة مع بعض.»</li>
<li>«مفيش شاشات قبل النوم. تحب نقرا حدوتة إيه النهارده؟»</li>
</ul></div>
<div class="warn">اتكلم مع طبيب الأطفال لو: الطفل مش بيقدر يهدى خالص بأي طريقة غير الشاشة، أو عنده تأخر كلام مع استخدام شاشات كتير، أو نومه باظ والشاشة موجودة قبل النوم، أو الانهيارات بعد قفل الشاشة عنيفة وطويلة كل يوم مهما عملت. دي من أول الحاجات اللي بتتراجع في أي تقييم كلام أو سلوك.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.who.int/news/item/24-04-2019-to-grow-up-healthy-children-need-to-sit-less-and-play-more" target="_blank" rel="noopener">WHO: To grow up healthy, children need to sit less and play more (2019)</a> · <a href="https://www.who.int/publications/i/item/9789241550536" target="_blank" rel="noopener">WHO Guidelines on physical activity, sedentary behaviour and sleep for children under 5</a> · <a href="https://www.healthychildren.org/English/family-life/Media/Pages/kids-and-screen-time-how-to-use-the-5-cs-of-media-guidance.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP): Kids & Screen Time — the 5 C's of Media Guidance</a> · <a href="https://www.healthychildren.org/English/family-life/Media/Pages/screen-time-and-temper-tantrums-helpful-tips-for-parents.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP): Screen Time & Temper Tantrums — Helpful Tips</a> · <a href="https://kidshealth.org/en/parents/screentime-preschool.html" target="_blank" rel="noopener">Nemours KidsHealth: Media Use Guidelines — Preschoolers</a> · <a href="https://publications.aap.org/pediatrics/article/138/5/e20162591/60503/Media-and-Young-Minds" target="_blank" rel="noopener">AAP Pediatrics: Media and Young Minds (policy statement)</a> · <a href="https://support.google.com/youtubekids/answer/6172308" target="_blank" rel="noopener">Google Support: Parental controls for YouTube Kids profiles</a> · <a href="https://www.cdc.gov/act-early/milestones/3-years.html" target="_blank" rel="noopener">CDC: Milestones by 3 Years (screen tips within)</a></p></details>

<h2 class="sec">11 · اللغة والثنائية اللغوية</h2>
<div class="panel"><ul class="pts">
<li><b>طفلك مش هيتلخبط. الأبحاث حسمتها:</b> مخ الطفل من أول سنة قادر يفرّق بين لغتين ويتعامل معاهم كنظامين منفصلين. جمعية التخاطب الأمريكية (ASHA) بتقولها صراحة: تعلّم أكتر من لغة لا بيسبب لخبطة ولا تأخر كلام.</li>
<li>الخلط بين اللغتين في نفس الجملة (يقول "عايز الـ ball") طبيعي 100% وعلامة نمو لغوي سليم مش علامة مشكلة. الكبار الثنائيي اللغة بيعملوا نفس الحاجة، واسمها code-mixing مش تشويش.</li>
<li><b>الثنائية مش بتسبب تأخر لغوي:</b> نسب اضطرابات اللغة واحدة عند أحادي وثنائي اللغة. التأخر الحقيقي بيظهر في اللغتين مع بعض مش في واحدة بس — ولو في شك، التقييم لازم يبقى باللغتين عند أخصائي فاهم ثنائية اللغة.</li>
<li>الخطر الحقيقي في وضعكم مش الإنجليزي — الإنجليزي مضمون لأن الحضانة والمدرسة والأصحاب والكرتون كلهم إنجليزي. الخطر هو ضياع العربي: أبحاث Wong Fillmore وغيرها وثّقت إن لغة البيت بتبدأ تضعف أول ما الطفل يدخل مدرسة بلغة تانية، ولو مفيش مجهود مقصود بيوصل لسن بيفهم فيها العربي بس مش بيتكلمه.</li>
<li><b>الحد الأدنى للتعرض:</b> أبحاث Pearson وزملائها بتقول إن الطفل محتاج يسمع اللغة على الأقل 20-25% من وقت صحيانه علشان يتكلمها فعلًا مش بس يفهمها — واستهدفوا 25-30% علشان تبقوا في الأمان. بالأرقام: لو صاحي 12 ساعة، ده حوالي 3 ساعات عربي حقيقي يوميًا — كلام وتفاعل وحوار، مش تلفزيون شغال في الخلفية.</li>
<li>استراتيجية "العربي في البيت كله" أقوى في حالتكم من "كل أب بلغة" (OPOL): دراسة De Houwer على آلاف العائلات لقت إن أعلى نسبة أطفال بيتكلموا لغة الأقلية فعلًا كانت لما الأب والأم الاتنين بيتكلموها في البيت. لما لغة أحد الوالدين هي نفسها لغة المدرسة، OPOL بتضعف ناحية العربي. المدرسة هتتكفل بالإنجليزي — أنتو اتكفلوا بالعربي.</li>
<li><b>جودة اللغة مهمة زي كميتها:</b> أبحاث Erika Hoff بتقول إن الكلام من متحدث أصلي أقوى أثرًا بكتير. اتكلموا معاه بالعربي اللي أنتو ممتازين فيه، ومتحاولوش "تدرّبوه" بإنجليزي مكسر — بتاخدوا من وقت العربي وبتدّوه إنجليزي أضعف من اللي بياخده في المدرسة.</li>
<li>لما يرد عليك بالإنجليزي متزعقش ومتقولش "اتكلم عربي!" — كده العربي بيبقى عقاب. استخدم إعادة الصياغة (recast): رد بالعربي وضمّن جملته في ردك كأنك بتكمل الكلام عادي. ده جوهر استراتيجيات Lanza للحوار الوالدي: بتوصّل رسالة "إحنا هنا بنتكلم عربي" من غير معركة.</li>
<li><b>درجة أعلى شوية لو العربي بدأ يضعف:</b> مثّل عدم الفهم بلطف مرة كل كام مرة ("نعم؟ مش سامعك... عايز إيه؟") علشان يضطر يحاول بالعربي — بس لو ضايق الطفل أو وقف الكلام خالص، ارجع لإعادة الصياغة. الهدف إنه يتكلم، مش إنه يسكت.</li>
<li><b>قراءة بالعربي كل يوم 10-15 دقيقة غير قابلة للتفاوض:</b> القراءة بصوت عالي هي أكبر مصدر مفردات مش بتيجي في الكلام اليومي، وهي كمان الجسر الوحيد الطبيعي للفصحى قبل المدرسة.</li>
<li><b>الفصحى والعامية:</b> العربي عمليًا لغتين، وأبحاث Saiegh-Haddad بتقول إن المسافة بين العامية والفصحى هي اللي بتصعّب تعلم القراءة بالعربي بعدين — والتعرض المبكر للفصحى (قصص بصوت عالي وكرتون مدبلج فصحى) في سن الحضانة بيبني "أذن فصحى" وبيسهّل القراءة أول ما تبدأ. اقرا القصة بالفصحى زي ما هي، ووضّح بالعامية بعد الجملة — متترجمش الكتاب كله لعامية.</li>
<li>وقت الشاشة المحدود (ساعة في اليوم لسن 2-5 حسب أكاديمية طب الأطفال الأمريكية) خليه استثمار في العربي: كرتون مدبلج بالفصحى بدل الإنجليزي. الشاشة مش بتعلّم لغة لوحدها — الحوار هو اللي بيعلّم — لكنها تعرض إضافي ببلاش ما دام هيتفرج أصلًا.</li>
<li>لو معظم نهار الطفل مع مربية مش عربية، ساعاتها بتتحسب ضد العربي في ميزان التعرض — دراسات في الإمارات والخليج وثّقت إن ده عامل رئيسي في ضعف العربي عند أطفال المنطقة. حط لغة المربية في الحساب وعوّض بالمساء والويكند (وشوف قسم تعدد المربيين).</li>
<li><b>الطفل اللي بيرفض العربي مش بيرفضك — بيستجيب للسوق:</b> شايف إن الإنجليزي هو لغة "المهم" في المدرسة. العلاج مش ضغط ولا محاضرات، العلاج إن العربي يبقى لغة الحاجات الحلوة: الحواديت قبل النوم، الهزار، الأسرار، اللعب مع بابا وماما.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>هو يقول: "I want water" — إنت ترد بهدوء: "عايز مية؟ حاضر يا حبيبي، خد المية." (إعادة صياغة من غير أي تعليق على لغته)</li>
<li>"إحنا في البيت بنتكلم عربي، وفي المدرسة بتتكلم إنجليزي — إنت شاطر عشان بتعرف الاتنين."</li>
<li>لو سأل "ليه بنتكلم عربي؟": "العربي لغتنا إحنا — لغة تيتا وجدو ولغة الحواديت بتاعتنا، ومش كل الأطفال بيعرفوا لغتين زيك."</li>
<li>وإنت بتقرا بالفصحى: تقرا الجملة زي ما هي — "انطلقَ الأرنبُ مسرعًا" — وبعدين: "يعني إيه؟ يعني الأرنب جري بسرعة!"</li>
<li>مرة كل كام مرة لو العربي بيضعف: "نعم؟ مش سامعك يا حبيبي... عايز إيه؟" (ولو اتضايق ارجع فورًا للرد العادي)</li>
<li>لما يحاول ويغلط: "برافو! قلتها بالعربي — تعالى نقولها مع بعض كمان مرة." (من غير تصحيح ثقيل ولا سخرية)</li>
</ul></div>
<div class="warn">اعرضوه على أخصائي تخاطب (بيقيّم باللغتين) لو: مش بيكوّن جمل من 3-4 كلمات عند 3 سنين، أو كلامه مش مفهوم لغير أهله عند 4 سنين، أو مفرداته قليلة في اللغتين مجموعتين مع بعض، أو فقد كلمات كان بيقولها. ده مالوش علاقة بالثنائية. وإوعوا حد يقولكم "وقّفوا العربي علشان يتحسن" — ده كلام ضد الأدلة العلمية وبيضر الطفل وعلاقته بيكم.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://helpingyoucommunicate.org/article/learning-more-than-one-language" target="_blank" rel="noopener">ASHA — Learning More Than One Language</a> · <a href="https://www.nationwidechildrens.org/family-resources-education/700childrens/2017/12/teaching-kids-a-second-language-can-it-cause-a-speech-delay" target="_blank" rel="noopener">Nationwide Children's — Can a Second Language Cause Speech Delay?</a> · <a href="https://pubs.asha.org/doi/10.1044/2023_JSLHR-23-00117" target="_blank" rel="noopener">JSLHR 2023 — Exploring Assumptions of the Bilingual Delay</a> · <a href="https://www.umass.edu/aae/Children_w_2_Langs_CUPHandbk_Pearson.pdf" target="_blank" rel="noopener">Pearson — Children with Two Languages (exposure threshold)</a> · <a href="https://www.cambridge.org/core/journals/applied-psycholinguistics/article/social-factors-in-childhood-bilingualism-in-the-united-states/CFC8ACE008981588CB28DF1FBF13EA5D" target="_blank" rel="noopener">Pearson et al. — Social factors in childhood bilingualism</a> · <a href="https://www.cambridge.org/core/journals/applied-psycholinguistics/article/abs/parental-language-input-patterns-and-childrens-bilingual-use/821A5852222197491F4E7ABC8AA4B099" target="_blank" rel="noopener">De Houwer 2007 — Parental language input patterns and children's bilingual use</a> · <a href="https://srcd.onlinelibrary.wiley.com/doi/abs/10.1111/cdep.12262" target="_blank" rel="noopener">Hoff 2018 — Bilingual Development in Children of Immigrant Families</a> · <a href="https://www.tandfonline.com/doi/abs/10.1207/s15430421tip3904_3" target="_blank" rel= <h2 class="sec">12 · أخ جديد والغيرة بين الإخوات</h2>
<div class="panel"><ul class="pts">
<li><b>قبل الولادة، احكيله بصدق ومن غير تجميل زيادة:</b> ماتقولش "جايلك أخ هتلعب معاه!" — قول "البيبي في الأول بينام ويعيّط وياكل بس، ومش هيعرف يلعب معاك غير بعد شهور". الوعود الوردية بتتكسر أول أسبوع وبتجيب خيبة أمل وغيرة.</li>
<li><b>شرّكه في التحضير:</b> يجي معاك تشتري حاجات البيبي، يختار هدمة أو لعبة، يساعد في ترتيب الأوضة. الطفل اللي حاسس إنه جزء من المشروع بيغير أقل من اللي اتفاجئ بيه.</li>
<li>ورّيه صوره وفيديوهاته وهو بيبي واحكيله كان عامل إزاي وإنتوا كنتوا بتعملوا معاه إيه — بيفهم منها البيبي بيبقى شكله إزاي، وبيتطمن إنه هو كمان خد نفس الحب ده. ممكن كمان يتمرن على الشيل والحضن بعروسة.</li>
<li>خلّص التغييرات الكبيرة (خلع البامبرز، النقل من السرير، دخول الحضانة) قبل الولادة بشهور — أو أجّلها لبعد ما الدنيا تهدى. ماينفعش الطفل يحس إن كل حاجة في حياته اتقلبت "بسبب البيبي".</li>
<li><b>جهزه ليوم الولادة:</b> مين هيقعد معاه، هينام فين، وإن ماما هتكون في المستشفى يومين وراجعة ومعاها البيبي. المفاجآت في السن ده مرعبة.</li>
<li><b>حيلة الهدية:</b> خلي البيبي "جايب" هدية لأخوه الكبير في المستشفى. واطلب من الضيوف يسلموا على الكبير الأول ويسألوا عنه قبل ما يطيروا على البيبي — وياريت حد منهم يجيب له هو كمان حاجة صغيرة.</li>
<li><b>وقت محمي واحد-لواحد كل يوم:</b> 10-15 دقيقة على الأقل مع الكبير لوحده — من غير بيبي ومن غير موبايل. سمّيها باسمها ("وقتنا إحنا الاتنين") وحافظ عليها زي معاد الشغل. دي أقوى حاجة بتطفي الغيرة.</li>
<li><b>خليه يساعد من غير إجبار:</b> يجيب البامبرز، يختار الهدمة، يغني للبيبي، يقعد جنبك وقت الحمام. ولو رفض: "عادي خالص، مش لازم دلوقتي" — المساعدة الغصب بتخلي البيبي عبء مش أخ.</li>
<li><b>النكوص طبيعي وهيعدي:</b> يرجع يتكلم بيبي، يطلب ببرونة، يعمل حوادث حمام بعد ما كان خلص منها. دي مش وقاحة — دي رسالة معناها "شيلني أنا كمان". لبّي الاحتياج اللي وراها من غير تريقة ولا "إنت كبير بقى!"، وهيرجع لطبيعته في أسابيع.</li>
<li><b>المشاعر المخلوطة مسموحة:</b> اسمح له يقول "أنا زعلان من البيبي" أو "رجّعوه" من غير كسوف ولا زعيق. الأبحاث بتقول إن تكسيف الطفل على مشاعره الطبيعية بيزود العدوان تجاه البيبي مش بيقلله. المشاعر كلها مقبولة — الإيذاء بس هو الممنوع.</li>
<li><b>العدوان على البيبي:</b> اتدخل فورًا بهدوء وثبات — امسك إيده من غير عصبية وقول "مش هسيبك توجع البيبي"، وورّيه اللمسة الصح. لو كرر، ابعده لنشاط تاني من غير خطبة. والقاعدة الذهبية: ماتسيبش طفل 3-5 سنين لوحده مع البيبي أبدًا، ولا لدقيقة.</li>
<li><b>ماتقارنش أبدًا — ولا حتى في السر:</b> "شوف أخوك بياكل إزاي" و"أختك كانت بتنام لوحدها". الأبحاث بتقول مقارنات الأهل بتزود الخناق والمنافسة بين الإخوات وبتكبّر الفروق بدل ما تصلحها. قيّم كل طفل بمقارنته بنفسه امبارح، مش بأخوه.</li>
<li><b>العدل مش التساوي:</b> مش لازم كل واحد ياخد نفس الحاجة بالظبط — لازم كل واحد ياخد اللي يحتاجه. الأبحاث بتقول اللي بيفرق مع الطفل مش إن المعاملة متطابقة، لكن إنه فاهم سبب الفرق وشايفه عادل. فاشرح: "إنت بتسهر أكتر لأنك أكبر — والبيبي بيتشال أكتر لأنه لسه ميعرفش يمشي".</li>
<li><b>متلينش القواعد بدافع الذنب:</b> نفس الحدود ونفس الروتين قبل البيبي وبعده. الثبات ده نفسه رسالة أمان — "الدنيا لسه ماشية زي ما هي، ومكانك زي ما هو".</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>"البيبي في الأول بينام ويعيّط بس — بس هو محظوظ إن عنده أخ كبير زيك هيعلّمه كل حاجة."</li>
<li>"صعب إنك تستنى وأنا برضّع أختك. أول ما أخلص هبني معاك البرج، متفقين؟"</li>
<li>"إنت زعلان إن البيبي واخد وقتي؟ أنا فاهمة يا حبيبي. تعالى في حضني — حبي ليك زي ما هو، ماحدش خده."</li>
<li>"مش هسيبك توجع البيبي. إيدك كده — بالراحة. تحب نلعب حاجة تانية؟"</li>
<li>"عايز تتشال زي البيبي؟ تعالى أشيلك — إنت برضه حبيبي وبتتشال."</li>
<li>"ده وقتنا إحنا الاتنين بس — لا بيبي ولا موبايل ولا حد."</li>
<li>"مش لازم تحب البيبي من دلوقتي. هو لسه جديد علينا كلنا، خد وقتك."</li>
<li>"مش عايز تساعد النهارده؟ ولا يهمك، لما تحب قوللي."</li>
</ul></div>
<div class="warn">الغيرة والنكوص الطبيعيين بيتحسنوا خلال أسابيع لما الطفل بياخد وقته واهتمامه. اتكلم مع دكتور الأطفال أو أخصائي نفسي أطفال لو بعد شهور لسه في: عدوان متصاعد ومقصود على البيبي رغم التدخل المستمر، أو انسحاب وحزن مستمرين، أو نكوص مش بيتحسن خالص (حمام، كلام، نوم)، أو رفض أكل شديد، أو اضطراب نوم وكوابيس مستمرة. دي علامات إن الضغط أكبر من قدرة الطفل ومحتاج دعم إضافي.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.healthychildren.org/English/ages-stages/prenatal/Pages/Preparing-Your-Family-for-a-New-Baby.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — Preparing Your Older Child for a New Baby: How to Help Siblings Adjust</a> · <a href="https://www.zerotothree.org/resource/when-is-he-going-back-in-your-belly-how-to-help-older-siblings-adjust-to-the-new-baby/" target="_blank" rel="noopener">Zero to Three — "When Is He Going Back in Your Belly?" How to Help Older Siblings Adjust to the New Baby</a> · <a href="https://news.byu.edu/news/parents-comparisons-make-siblings-different" target="_blank" rel="noopener">BYU News — Parents' comparisons make siblings different</a> · <a href="https://www.eurekalert.org/news-releases/607631" target="_blank" rel="noopener">EurekAlert — Fairness of sibling treatment key to its impact, study shows</a> · <a href="https://link.springer.com/article/10.1007/s10826-020-01811-4" target="_blank" rel="noopener">Journal of Child and Family Studies — Parental Differential Treatment of Siblings and Fairness Perception</a> · <a href="https://www.researchgate.net/publication/325820542_Parents'_Social_Comparisons_of_Siblings_and_Youth_Problem_Behavior_A_Moderated_Mediation_Model" target="_blank" rel="noopener">McHale et al. — Parents' Social Comparisons of Siblings and Youth Problem Behavior</a></p></details>

<h2 class="sec">13 · الأسئلة الصعبة: الموت، وربنا، و«أنا جيت منين؟»</h2>
<div class="panel"><ul class="pts">
<li><b>القاعدة الذهبية:</b> جاوب على السؤال اللي اتسأل بس، وبإجابة قصيرة. الطفل في السن ده مش عايز محاضرة — لو عايز يعرف أكتر هيسأل لوحده. الإجابة الطويلة بتلخبطه أكتر ما بتفهمه.</li>
<li><b>قبل ما تجاوب، اسأله:</b> «إنت فاكر إيه؟» — كتير السؤال يكون وراه فكرة غلط سمعها من الحضانة أو الكرتون. ساعتها بتصحح الفكرة دي بس، بدل ما تفتح مواضيع هو مش سأل عنها أصلًا.</li>
<li>«سؤال حلو قوي، هفكر وأقولك» إجابة محترمة ومقبولة تمامًا — بشرط ترجع فعلًا تجاوب. أحسن ألف مرة من إجابة مرتجلة غلط أو كذبة هتتكشف. ولو اتكسفت أو اتعصبت، الرسالة اللي بتوصله: «السؤال ده عيب» — وهيبطل يسألك وهيجيب إجاباته من برة.</li>
<li><b>في الموت:</b> قول كلمة «مات» بصراحة واشرحها بالجسم، لأن طفل ٣-٥ سنين بيفكر بالمحسوس وفاكر الموت حاجة مؤقتة زي الكرتون: «جسم جدو بطّل يشتغل خالص — مش بياكل ولا بيتحرك ولا بيحس بأي وجع، ومش هيرجع تاني». دي الصيغة اللي منظمات دعم الأطفال في الحداد (زي Winston's Wish) بتوصي بيها بالنص تقريبًا.</li>
<li>ممنوع نهائيًا «جدو نام» أو «سافر سفرة طويلة» أو «فقدناه» أو «ربنا خده عشان بيحبه». الطفل بياخد الكلام حرفي: اللي سمع «نام» ممكن يخاف ينام هو نفسه، واللي سمع «سافر» هيفضل مستني الرجوع ويحس إن جدو سابه من غير وداع، و«ربنا بياخد اللي بيحبه» ممكن تخليه يخاف إن ربنا ياخده هو أو ماما. الصراحة أرحم — ده إجماع منظمات حداد الأطفال وأكاديمية طب الأطفال الأمريكية.</li>
<li><b>الإطار الديني في السن ده يكون عن الرحمة مش الرعب:</b> «روح جدو رجعت عند ربنا اللي خلقه، وإحنا بندعيله ربنا يدخله الجنة — مكان حلو خالص مفيهوش تعب ولا وجع». الدعاء مع الطفل بيديله حاجة يعملها بدل الإحساس بالعجز. عذاب القبر والنار مش مواضيع لطفل ٣-٥ سنين.</li>
<li>استعد إنه يسأل نفس السؤال عشرين مرة، ويعيّط خمس دقايق ويروح يلعب عادي. ده مش قلة إحساس — ده شكل حزن الأطفال الطبيعي: جرعات صغيرة، وبيعالجوا الموضوع باللعب. جاوب كل مرة بنفس الإجابة الهادية، وطمّنه صراحة: «ده مش ذنبك، وإحنا هنا ومش هنسيبك».</li>
<li><b>موت الحيوان الأليف بنفس القواعد:</b> «القطة ماتت — جسمها بطّل يشتغل ومش هتصحى تاني». متقولش «هربت» ولا «ودّيناها مزرعة»: لما يعرف الحقيقة هيفقد الثقة فيك، وقبلها هيفضل يدوّر عليها ويستناها. اسمح له يزعل ويودّعها — فقد الحيوان تدريب مهم على الفقد الأكبر.</li>
<li>«ربنا فين؟»: إجابة قصيرة ودافية: «ربنا مش زي أي حاجة إحنا شايفينها، هو اللي خلق كل حاجة، ومعانا في كل مكان — شايفك وسامعك حتى لو إنت لوحدك». وإجابة «ربنا فوق في السما» بسيطة ومقبولة لطفل صغير. ده مش وقت فلسفة ولا درس عقيدة — الطفل عايز إحساس أمان.</li>
<li>«ربنا شكله إيه؟»: «محدش يقدر يشوف ربنا في الدنيا، بس بنشوف شغله: السما والبحر والقطط وإنت كمان» — زي ما بنعرف الرسام من الرسمة من غير ما نشوفه. ولو حب زوّد: «إن شاء الله في الجنة نشوفه». الأسئلة دي علامة ذكاء وفضول، مش قلة أدب — متزعقش أبدًا.</li>
<li>«أنا جيت منين؟»: «كبرت في بطن ماما، في مكان مخصوص اسمه الرحم، ولما بقيت جاهز خرجت للدنيا». خلاص — أغلب الأطفال في السن ده مكتفيين بكده. حكاية اللقلق و«اشتريناك من المستشفى» بترجع عليك: هيعرف الحقيقة من برة، وهيتعلم إن أسئلته ملهاش إجابة صادقة عندك.</li>
<li>لو زوّد وسأل «طب دخلت بطن ماما إزاي؟»: «ربنا بيخلق البيبي من حاجة صغيرة قوي من بابا وحاجة صغيرة قوي من ماما، بيتقابلوا في بطن ماما ويكبروا بيبي». كفاية كده لسن ٣-٥ — التفاصيل الكاملة ليها سن أكبر، والمهم إن كل إجابة قلتها تكون صح مش كذب.</li>
<li>علّمه الأسماء الصحيحة للأعضاء (قضيب للولد، فرج/مهبل للبنت) من دلوقتي، وبنفس نبرة «إيد» و«رجل» من غير أسماء تدليع ملغبطة. ده مش قلة حيا — ده حماية: خبراء حماية الطفل (ومنهم أكاديمية طب الأطفال الأمريكية) بيأكدوا إن الطفل اللي عارف الأسماء الصحيحة بيقدر يحكي بوضوح لو حد لمسه، والمتحرش نفسه بيبعد عن الطفل اللي باين إن أهله بيتكلموا معاه بصراحة.</li>
<li>«ليه أنا مختلف عن أختي؟»: جاوب عادي من غير توتر: «الولاد جسمهم فيه قضيب والبنات فيه فرج — ربنا خلقنا كده». واربطها بقاعدة الملابس الداخلية (زي قاعدة PANTS بتاعة NSPCC): المناطق اللي بتغطيها ملابسك الداخلية بتاعتك إنت بس، محدش يشوفها أو يلمسها غير في التنضيف أو عند الدكتور وإحنا معاك، ولو حد عمل كده تقول لماما وبابا فورًا — ومفيش «سر» بينك وبين حد كبير أبدًا.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«جدو مات يا حبيبي. يعني جسمه بطّل يشتغل خالص — مش بيتنفس ولا بيتحرك ولا بيحس بأي وجع، ومش هنشوفه تاني في الدنيا. وإحنا زعلانين عشان بنحبه، وعادي إننا نعيّط.»</li>
<li>«روح جدو رجعت عند ربنا، وإحنا بندعيله ربنا يدخله الجنة — مكان حلو خالص مفيهوش تعب ولا وجع. تعالى ندعيله مع بعض.»</li>
<li>«ربنا مش زي أي حاجة إحنا شايفينها. هو اللي خلق كل حاجة، ومعانا في كل مكان — شايفك وسامعك حتى لو إنت لوحدك في أوضتك.»</li>
<li>«محدش يقدر يشوف ربنا في الدنيا، بس بنشوف الحاجات الحلوة اللي عملها: السما والبحر والقطط. وإن شاء الله في الجنة نشوفه.»</li>
<li>«إنت كبرت في بطن ماما، في مكان مخصوص اسمه الرحم، ولما بقيت جاهز خرجت للدنيا — وكنا مستنيينك ومبسوطين بيك قوي.»</li>
<li>«الولاد جسمهم فيه قضيب والبنات فيه فرج. ربنا خلقنا كده، وكل واحد جسمه حلو زي ما هو.»</li>
<li>«المناطق اللي بتغطيها ملابسك الداخلية دي بتاعتك إنت بس. لو أي حد لمسها أو طلب يشوفها، تعالى قولّي فورًا — عمري ما هزعل منك. وأي حد يقولك ‹دي سر بيني وبينك› يبقى لازم تحكيلي على طول.»</li>
<li>«سؤالك ده حلو قوي وأنا عايز أجاوبك صح. هفكر شوية وأقولك النهارده بالليل، ماشي؟» — وارجع جاوب فعلًا.</li>
</ul></div>
<div class="warn">علامات إن الحزن محتاج متخصص (طبيب أطفال أو أخصائي نفسي أطفال): رجوع لورا مستمر (تبول لا إرادي بعد ما كان اتحكم، كلام بيبي)، مشاكل نوم أو كوابيس أو رفض أكل مستمرين، انسحاب من اللعب وأصحابه، خوف مبالغ فيه من إنك تسيبه ثانية واحدة، بطّل يتكلم خالص عن اللي مات أو مش بيتكلم غير عنه، أو بيكرر إنه «عايز يروح عند جدو». لو العلامات دي مستمرة شهور أو بتزيد مش بتقل — متستناش، اطلب مساعدة.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://winstonswish.org/how-to-explain-death-to-a-child/" target="_blank" rel="noopener">Winston's Wish — How to explain death to a child</a> · <a href="https://www.healthychildren.org/English/healthy-living/emotional-wellness/Building-Resilience/Pages/How-Children-Understand-Death-What-You-Should-Say.aspx" target="_blank" rel="noopener">AAP HealthyChildren — How Children Understand Death: What to Say</a> · <a href="https://sesameworkshop.org/topics/grief/" target="_blank" rel="noopener">Sesame Workshop — Grief resources for families</a> · <a href="https://www.aacap.org/AACAP/Families_and_Youth/Facts_for_Families/FFF-Guide/Children-And-Grief-008.aspx" target="_blank" rel="noopener">AACAP Facts for Families — Children and Grief</a> · <a href="https://www.aacap.org/AACAP/Families_and_Youth/Facts_for_Families/FFF-Guide/When-A-Pet-Dies-078.aspx" target="_blank" rel="noopener">AACAP Facts for Families — When a Pet Dies</a> · <a href="https://www.healthychildren.org/English/healthy-living/emotional-wellness/Building-Resilience/Pages/when-a-pet-dies-how-to-help-your-child-cope.aspx" target="_blank" rel="noopener">AAP HealthyChildren — When a Pet Dies: How to Help Your Child Cope</a> · <a href="https://www.plannedparenthood.org/learn/parents/preschool/what-should-i-teach-my-preschooler-about-pregnancy-and-reproduct" target="_blank" rel="noopener">Planned Parenthood — Talking with my preschooler about pregnancy & reproduction</a> · <a href="https://enoughabuse.org/why-we-should-teach-children-proper-names-f <h2 class="sec">14 · تعدد المربيين: الجدود والمربية وقواعد البيت</h2>
<div class="panel"><ul class="pts">
<li><b>المشكلة دي عند الكل مش عندكم بس:</b> استطلاع جامعة ميشيغان (Mott Poll) لقى إن حوالي 40% من الأهالي عندهم خلافات مع الجدود على التربية — الأكل والشاشات والعقاب — و43% اضطروا يطلبوا من الجدود صراحة يلتزموا بقواعدهم.</li>
<li>قسّموا القواعد لتلات سلال وريّحوا دماغكم. سلة غير قابلة للتفاوض مع أي راشد: الأمان (كرسي العربية، السباحة، الأدوية والمنظفات)، النوم (معاد النوم في أيام المدرسة)، والشاشات (الحد الأقصى، نوع المحتوى، ومفيش شاشة وقت الأكل ولا قبل النوم بساعة). سلة مرنة عادي: حلويات زيادة عند تيتا، سهرة نص ساعة في الويكند، فوضى لعب. وسلة مش معركتكم أصلًا: طريقة لعبهم معاه، الدلع، الهدايا.</li>
<li>الطفل في سن 3-5 بيستحمل إن لكل بيت قواعده — طالما كل بيت ثابت جوه نفسه. زي ما بيتأقلم مع مدرّسة لها نظام مختلف عن البيت. اللي بيكسر إحساسه بالأمان مش الاختلاف بين البيوت، التذبذب جوه نفس البيت: نفس الشخص يسمح النهارده ويمنع بكرة مزاجيًا.</li>
<li>عمرك ما تنقض قرار الراشد التاني قدام الطفل. لو ماما قالت لأ وبابا قال "ماشي خلاص" قدامه، الطفل اتعلم درسين غلط: إن "لأ" بتتكسر بالزن، وإن في صدع بين الكبار يلعب فيه. الاعتراض حقك — بس بعدين وعلى انفراد. نفس القاعدة مع الجدود ومع المربية.</li>
<li>مع الجدود ابدأوا بالتقدير مش بالمحاسبة — والكلام الصريح بيجيب نتيجة فعلًا: في استطلاع ميشيغان، لما الجدود غيّروا سلوكهم فعلًا الخلافات الكبيرة كانت 4% بس، لما وعدوا ومنفذوش بقت 15%، ولما رفضوا وصلت 25%.</li>
<li><b>الليست القصيرة للجدود:</b> متجوش بقايمة 20 بند — هتتقلب ضدكم وهيتجاهلوها. تلات بنود بس غير قابلة للتفاوض، والباقي سيبوه ليهم بالكامل. الجدود اللي حاسين إن لسه ليهم مساحة ودور بيلتزموا بالبنود المهمة أكتر بكتير.</li>
<li><b>المربية في بيتكم موظفة مش ضيفة:</b> من حقكم — ومن واجبكم — تدّوها تعليمات مكتوبة وواضحة ومعلّقة في المطبخ. في الإمارات دي بيئة الطفل الفعلية: دراسات الخليج بتوثّق إن أطفال كتير بيقضوا مع المربية ساعات أطول من اللي بيقضوها مع أي حد تاني، فتعليماتها مش تفصيلة — دي تربية.</li>
<li><b>برييف المربية — اللغة:</b> لو مش عربية، متطلبوش منها تكلمه عربي مكسر ولا حتى إنجليزي متكلف — الأفضل تتعامل معاه باللغة اللي هي أقوى فيها ببساطة، وأنتم تعوّضوا العربي بالمساء والويكند. ولو عربية، يبقى شرط شغل معلن: معاه بالعربي طول الوقت.</li>
<li><b>برييف المربية — الشاشة مش أداة تسكيت:</b> دراسة JAMA Pediatrics على أطفال 3-5 سنين لقت إن استخدام الموبايل لتهدئة الطفل المتضايق بيرجع بعد كده بتنظيم انفعالي أضعف وردود فعل أعنف — لأنه بيشتّت الطفل بدل ما يعلّمه يهدى. البديل المكتوب في التعليمات: حضن، تسمية المشاعر، لعبة، تغيير مكان.</li>
<li><b>برييف المربية — الأكل مش مكافأة ولا عقاب ولا تسلية:</b> "كل علشان تاخد شوكولاتة" و"بطّل عياط وخد بسكوتة" بيعلّموا الطفل الأكل العاطفي — دراسات طولية أثبتت إن أطفال 3-5 اللي اتربوا كده بياكلوا وقت الضيق أكتر وهم أكبر. لو مأكلش، الأكل بيتشال بهدوء والوجبة الجاية في معادها.</li>
<li><b>راجعوا متراقبوش:</b> 5 دقايق أسبوعيًا مع المربية — إيه اللي ماشي وإيه الصعب؟ ولو لقيتوا الطفل بيسمع كلامها ومش بيسمع كلامكم (أو العكس)، دي علامة إن حد في البيت بيكسر القواعد مش إن الطفل "بقى وحش".</li>
<li>لما يقول "بس تيتا بتسمحلي!" ده ذكاء مش خبث — بيختبر النظام. الرد ثابت وهادي ومن غير محاضرة ومن غير نقد لتيتا قدامه: "عارف، في بيت تيتا نظام تيتا، وهنا نظامنا." وخلاص، الموضوع اتقفل.</li>
<li>لو الجد أو الجدة بيكسروا بند أمان أو بند أساسي بشكل متكرر بعد كلام صريح، قللوا مدة الزيارات غير المُشرف عليها من غير ما الطفل يعرف السبب — 15% من الأهالي في استطلاع ميشيغان لجأوا لده. علاقة الطفل بجدوده كنز، فده آخر الحلول مش أولها.</li>
<li><b>الطفل مش ساعي بريد ولا حَكَم:</b> عمره ما يسمع "قول لتيتا إن ماما زعلانة" ولا ينسمع قدامه نقد للمربية أو للجدة. الطفل اللي شايف الكبار بيحترموا بعض بيحس بأمان — واللي شايفهم بيتصارعوا عليه بيتعلم يستثمر في الصراع.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>للطفل: "في بيت تيتا نظام تيتا، وفي بيتنا نظامنا — والاتنين بيحبوك."</li>
<li>للجدة: "يا ماما إحنا مبسوطين جدًا إنه بيقعد معاكي — محتاجينك معانا في 3 حاجات بس: ينام 8، الآيباد ساعة واحدة، ومفيش أكل قدام التلفزيون. غير كده دلّعيه براحتك."</li>
<li>للجد لما يقول "إحنا ربناكم كده وطلعتوا زي الفل": "صحيح والله وربنا يخليك لينا — بس دي حاجات الدكتور مشدد عليها، ساعدنا فيها علشان خاطره."</li>
<li>للمربية: "لو عيّط أو اتعصب: شيليه من المكان، احضنيه، وقوليله إنت زعلان/تعبان. الموبايل ممنوع في التهدئة نهائيًا — مش عقاب ليه، ده علشان يتعلم يهدى لوحده."</li>
<li>للمربية عن الأكل: "ممنوع نقول كل علشان تاخد حلوى، وممنوع بسكوتة علشان يسكت. لو مأكلش، شيلي الأكل بهدوء — هياكل الوجبة الجاية عادي."</li>
<li>بين الأب والأم لو اختلفتوا قدامه: "أنا وماما هنتكلم ونرد عليك." — والنقاش الحقيقي بعدين على انفراد، والرد بييجي منكم الاتنين بصوت واحد.</li>
<li>لما ينقل كلام بين البيوت: "دي حاجة بتاعة الكبار — أنا هكلم تيتا بنفسي."</li>
</ul></div>
<div class="warn">في حاجات مش "اختلاف أنماط تربية" وبتحتاج تدخل فوري: أي عقاب بدني أو تخويف أو تهديد من مربية أو أي راشد، أو طفل بقى بيكذب بشكل منتظم علشان يلعب على الاختلافات، أو تغير مفاجئ في النوم أو السلوك أو خوف من شخص معين بعد فترات معاه. ساعتها الموضوع بيتقفل مع الشخص ده فورًا، ولو السلوك استمر استشيروا أخصائي نفسية أطفال.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://mottpoll.org/reports/when-parents-and-grandparents-disagree" target="_blank" rel="noopener">Mott Poll (University of Michigan) — When parents and grandparents disagree</a> · <a href="https://www.michiganmedicine.org/health-lab/half-parents-report-butting-heads-childs-grandparent-over-parenting" target="_blank" rel="noopener">Michigan Medicine — Half of Parents Report Butting Heads with Grandparents</a> · <a href="https://www.psychologytoday.com/us/blog/the-age-overindulgence/202010/when-grandparents-undermine-parents-rules" target="_blank" rel="noopener">Psychology Today — When Grandparents Undermine Parents' Rules</a> · <a href="https://jamanetwork.com/journals/jamapediatrics/fullarticle/2799042" target="_blank" rel="noopener">Radesky et al., JAMA Pediatrics 2023 — Mobile Devices for Calming and Emotional Reactivity (ages 3-5)</a> · <a href="https://www.michiganmedicine.org/health-lab/frequently-using-digital-devices-soothe-young-children-may-backfire" target="_blank" rel="noopener">Michigan Medicine — Frequently using digital devices to soothe young children may backfire</a> · <a href="https://www.sciencedaily.com/releases/2016/04/160412090707.htm" target="_blank" rel="noopener">Rewarding children with food could lead to emotional eating (Aston/Birmingham study)</a> · <a href="https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.13819" target="_blank" rel="noopener">Gemini cohort, JCPP 2023 — Parental feeding practices and child eating behaviours</a> · <a href="https://www.aap.org/en/patient-care/media-and-children/center-of-excellence-on-social-media-and-youth-mental-health/qa-portal/qa-portal-library/qa-portal-library-questions/screen-time-limits-for-young-children/" target="_blank" rel="noopener">AAP — Screen Time Limits for Young Children (1 hr, ages 2-5)</a> · <a href="https://www.healthychildren.org/English/family-life/Media/Pages/kids-and-screen-time-how-to-use-the-5-cs-of-media-guidance.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — The 5 Cs of Media Guidance / Family Media Plan</a> · <a href="https://www.researchgate.net/publication/247757177_Maids_in_Arabia_The_impact_of_maids_as_carers_on_children's_social_and_emotional_development" target="_blank" rel="noopener">Roumani — Maids in Arabia: maids as carers and children's development (Gulf)</a> · <a href="https://www.tandfonline.com/doi/full/10.1080/01434632.2025.2527358" target="_blank" rel="noopener">UAE bilingual children's early linguistic environments: nannies and maids (2025)</a></p></details>

<h2 class="sec">15 · جاهزية المدرسة</h2>
<div class="panel"><ul class="pts">
<li><b>في الإمارات:</b> FS1 (المنهج البريطاني) بيبدأ سنة 3 سنين، وKG1/FS2 سنة 4 سنين — والشرط من العام الدراسي 2026-27 إن الطفل يكمّل السن قبل 31 ديسمبر من سنة القبول.</li>
<li><b>اللي بيتنبأ فعلًا ببداية كويسة مش الحروف والأرقام. الأبحاث ثابتة:</b> تنظيم الانفعالات والمهارات الاجتماعية بيتنبأوا بالتقدم في القراية والحساب أكتر من حفظ الـABC. المدرسة بتعلّم الحروف في شهور؛ التنظيم الذاتي بياخد سنين ومبيتعوضش بسرعة.</li>
<li><b>AAP بتقولها صريحة:</b> المهارات الاجتماعية-العاطفية والسلوكية بنفس أهمية الأكاديمي، والأطفال بيوصلوا للمهارات في أعمار مختلفة — فسيبك من درلينج الفلاش كاردز والقلق إن ابن الجيران بيعد للـ50.</li>
<li><b>تشيك ليست الاعتماد على النفس قبل أول يوم:</b> يدخل الحمام لوحده ويغسل إيده، يفتح اللانش بوكس وزجاجة المية والعلب لوحده، يلبس جزمته وجاكيتته، ياكل بالشوكة. كل حاجة بيعملها لنفسه بتزود ثقته وبتريّح يومه في الفصل.</li>
<li><b>تدريب اللانش بوكس أبسط تدريب وأكبر فرق:</b> قبل المدرسة بشهر، حط أكله في نفس العلبة ونفس الزجاجة اللي هتروح المدرسة، وخليه يفتحهم بنفسه كل يوم. أول أسبوع مدرسة بيبان فيه مين اتدرب ومين لأ.</li>
<li><b>تعليمات من خطوتين:</b> «هات كوبايتك وحطها في الحوض» — لو بينفذها، هيتعامل مع تعليمات الفصل. CDC بتنصح تديله تعليمات من 2-3 خطوات من سن 3 كتمرين يومي.</li>
<li><b>تحمل الفراق:</b> معيار CDC لسن 3 إنه يهدى خلال 10 دقايق بعد ما تمشي. قبل المدرسة بشهور، سيبه مع حد تثق فيه فترات قصيرة وطوّلها بالتدريج — بيتعلم إن "ماما بتمشي وبترجع" بالتجربة مش بالكلام.</li>
<li><b>يطلب بالكلام:</b> «عايز الحمام»، «ساعديني»، «مش عارف» — قدرته يطلب مساعدة من التيتشر أهم مية مرة من العد للعشرين.</li>
<li><b>قبل البداية بأسابيع:</b> زوروا المدرسة مع بعض أكتر من مرة لو ينفع، اتكلموا عن تفاصيل اليوم (هتعمل إيه، هتاكل فين، مين هييجي ياخدك)، العبوا "مدرسة" في البيت بتبادل الأدوار، وقدّموا معاد النوم والصحيان أسبوع-أسبوعين قبلها عشان أول يوم ميبقاش صدمة صحيان.</li>
<li><b>الوداع الصح:</b> قصير وثابت وبنفس الطقوس كل يوم — بوسة وحضن وحركة سرية وباي، وامشي على طول. أوعى تتسلل من غير وداع حتى لو بيعيط — التسلل بيكسر الثقة وبيخلي العياط أطول. ولما تقول هترجع بعد الغدا، ارجع فعلًا.</li>
<li><b>أول أسابيع:</b> تعب شديد بعد اليوم الدراسي، نق، تعلق زيادة، وأحيانًا رجوع لورا في البيت (حوادث حمام، عياط أسهل) — كله تكيف طبيعي بياخد أسابيع قليلة. ثبّت الروتين والنوم ومتزودش أنشطة تانية في الفترة دي.</li>
<li>العياط عند باب الفصل غالبًا بيقف بعد دقايق من مشيك. متفضلش واقف مكسوف قدام الباب — اسأل التيتشر بيهدى بعد قد إيه، ودي أصدق إجابة عن حالته من مشهد الوداع.</li>
<li><b>هدوءك انت نص المسألة:</b> الطفل بيقرا قلقك من وشك وصوتك قبل كلامك. ودّعه واثق ومبسوط حتى لو قلبك مقبوض، وسيب العياط قدام التيتشر مش قدامك.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«أنا ماشي دلوقتي، وهرجع آخدك بعد ما تلعبوا في الجنينة. باي يا بطل.» (نفس الجملة كل يوم)</li>
<li>«بوسة... حضن... هاي فايف... باي!» (طقس وداع ثابت وقصير، ثواني مش دقايق)</li>
<li>«لو احتجت أي حاجة، قول للمس [الاسم]: أنا عايز الحمام. ساعديني.»</li>
<li>«افتح العلبة لوحدك... جربت وقدرت! كده هتفتحها في المدرسة زي الجامدين.»</li>
<li>«هات شنطتك وحط الزجاجة جواها.» (تمرين التعليمات من خطوتين)</li>
<li>«النهارده هتلعب وتسمع حدوتة وتاكل مع أصحابك، وبعدها على طول بابا/ماما جاي ياخدك.»</li>
</ul></div>
<div class="warn">اتكلم مع التيتشر وطبيب الأطفال لو: بعد 4-6 أسابيع مفيش أي تحسن في الفراق، أو الفراق بيجيب أعراض جسمانية (ترجيع، غثيان، نهجان)، أو كوابيس متكررة عن الفراق والضياع، أو رفض أكل وشرب طول اليوم الدراسي، أو التراجع في المهارات بيزيد مش بيقل. ممكن يكون قلق انفصال محتاج مساعدة متخصصة — وده بيتعالج كويس لما بيتمسك بدري.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.healthychildren.org/English/ages-stages/preschool/Pages/Is-Your-Child-Ready-for-School.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP): Is Your Preschooler Ready for Kindergarten?</a> · <a href="https://kidshealth.org/en/parents/adjust-to-preschool.html" target="_blank" rel="noopener">Nemours KidsHealth: Helping Your Child Adjust to Preschool</a> · <a href="https://kidshealth.org/en/parents/sep-anxiety.html" target="_blank" rel="noopener">Nemours KidsHealth: Separation Anxiety</a> · <a href="https://www.healthychildren.org/English/ages-stages/toddler/Pages/Soothing-Your-Childs-Separation-Anxiety.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP): How to Ease Your Child's Separation Anxiety</a> · <a href="https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2021.717317/full" target="_blank" rel="noopener">Frontiers in Psychology: Self-Regulation in Preschool and pre-academic skills</a> · <a href="https://whichschooladvisor.com/uae/guides/age-requirements-for-uae-schools-a-guide" target="_blank" rel="noopener">WhichSchoolAdvisor: Age Requirements for UAE Schools</a> · <a href="https://www.moe.gov.ae/En/MediaCenter/News/Pages/UAE-announces-updated-age-cut-off-date-for-KG-Grade-1-admissions-starting-AY-2026-2027.aspx" target="_blank" rel="noopener">UAE MOE: Updated age cut-off for KG admissions AY 2026-2027</a></p></details>

<h2 class="sec">16 · جدول التطور 3→5</h2>
<p class="note">الجدول ده من CDC (النسخة المحدثة 2022): كل بند معناه إن 75% أو أكتر من الأطفال بيعملوه في السن ده. يعني البند مش "متوسط" — لو طفلك مش بيعمل بند من بنود سنه، دي إشارة تتكلم مع الدكتور، مش تستنى.</p>
<div class="panel"><h3>اللغة</h3><div class="wk" style="--mc:var(--c8)"><b>سن 3</b><div>بيتكلم معاك في حوار فيه رد وردّين على الأقل؛ بيسأل «مين، إيه، فين، ليه»؛ بيقول اسمه الأول لما تسأله؛ بيوصف اللي بيحصل في الصورة («بيجري»، «بياكل»)؛ وكلامه مفهوم للناس الغريبة أغلب الوقت.</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 4</b><div>بيقول جمل من 4 كلمات أو أكتر؛ بيردد كلام من حدوتة أو أنشودة بيسمعها؛ بيحكي حاجة واحدة على الأقل حصلت في يومه («لعبت كورة»)؛ بيجاوب على أسئلة بسيطة زي «الكوت بنعمل بيه إيه؟».</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 5</b><div>بيحكي حكاية سمعها أو ألّفها فيها حدثين على الأقل؛ بيجاوب أسئلة عن قصة اتقرت له؛ بيكمّل حوار أكتر من 3 تبادلات؛ بيستخدم أو بيميز السجع البسيط (قط-بط).</div></div></div>
<div class="panel"><h3>الحركة</h3><div class="wk" style="--mc:var(--c8)"><b>سن 3</b><div>بيلضم خرز كبير أو مكرونة في خيط؛ بيلبس بعض هدومه لوحده (بنطلون واسع أو جاكيت)؛ بيستخدم الشوكة.</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 4</b><div>بيمسك كورة كبيرة أغلب المرات؛ بيغرف لنفسه أكل وبيصب مية بمراقبتك؛ بيفك بعض الزراير؛ بيمسك القلم بين صوابعه وإبهامه مش بقبضة إيده كلها.</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 5</b><div>بيقفل بعض الزراير بنفسه؛ بينط على رجل واحدة.</div></div></div>
<div class="panel"><h3>اجتماعي-عاطفي</h3><div class="wk" style="--mc:var(--c8)"><b>سن 3</b><div>بيهدى خلال 10 دقايق بعد ما تسيبه (زي دروب أوف الحضانة)؛ بيلاحظ الأطفال التانيين وبينضم يلعب معاهم.</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 4</b><div>بيلعب تمثيل (تيتشر، سوبرهيرو، قطة)؛ بيطلب يلعب مع أطفال («أروح ألعب مع آدم؟»)؛ بيواسي اللي زعلان أو اتعور؛ بيتجنب الخطر (مش بينط من مطالع عالية)؛ بيحب يكون "المساعد"؛ وبيغير سلوكه حسب المكان (مسجد، مكتبة، ملعب).</div></div><div class="wk" style="--mc:var(--c8)"><b>سن 5</b><div>بيمشي على قواعد اللعبة وبياخد دوره مع الأطفال؛ بيحب يقدّم لك عرض: تمثيل أو حكاية قدامك؛ بيعمل مهام بسيطة في البيت (يفرز الشرابات، يلم السفرة بعد الأكل).</div></div></div>
<div class="panel"><ul class="pts"><li><b>معرفي واعتماد على النفس — سن 3:</b> بيرسم دايرة لما توريه إزاي؛ بيبعد عن الحاجات السخنة (زي البوتاجاز) لما تحذره.</li>
<li><b>معرفي واعتماد على النفس — سن 4:</b> بيسمي كام لون؛ بيقول إيه اللي جاي في حدوتة معروفة ليه؛ بيرسم شخص له 3 أجزاء جسم أو أكتر.</li>
<li><b>معرفي واعتماد على النفس — سن 5:</b> بيعد للـ10؛ بيسمي بعض الأرقام من 1 لـ5 لما تشاور عليها؛ بيستخدم كلمات الزمن (امبارح، بكرة، الصبح، بالليل)؛ بيركز 5-10 دقايق في نشاط زي حدوتة أو أشغال يدوية (وقت الشاشة مش محسوب)؛ بيكتب بعض حروف اسمه؛ بيسمي بعض الحروف لما تشاور عليها.</li>
<li><b>امتى تطلب تقييم — قاعدة CDC:</b> أي بند ناقص من سن الطفل، أو فقدان مهارة كان بيعملها = اتكلم مع الدكتور واطلب فحص تطور (developmental screening) بأداة معتمدة، مش مجرد ملاحظة في الكشف. ولو القلق مستمر بعد الفحص، اطلب تحويل لأخصائي تخاطب أو تطور. فقدان مهارات في أي سن علامة حمرا عاجلة.</li>
<li><b>طفل اللغتين (عربي/إنجليزي في الإمارات):</b> تعلم لغتين مش بيسبب تأخر كلام — ده إجماع AAP وأخصائيي التخاطب (ASHA). احسب حصيلة كلماته باللغتين مع بعض، والتأخر الحقيقي بيظهر في اللغتين مش في واحدة بس. متسمعش نصيحة «بطلوا لغة عشان يتكلم».</li></ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes"><li>للدكتور: «ابني عنده 4 سنين ومش بيقول جمل من 4 كلمات. عايز فحص تطور developmental screening بأداة معتمدة، مش ملاحظة وخلاص.»</li>
<li>تمرين حكي يومي: «احكيلي حصل إيه النهارده في الحضانة؟ وبعدين؟ وبعدين إيه؟»</li>
<li>تمرين تعليمات من خطوتين وانتو بتلعبوا: «هات الجزمة وحط اللعبة في الصندوق.»</li>
<li>تمرين توقع أثناء القراية: «إيه اللي هيحصل بعد كده في الحدوتة في رأيك؟»</li></ul></div>
<div class="warn">علامات تستدعي تقييم من غير ما تستنى: فقدان أي مهارة كان بيعملها في أي سن؛ سن 3 وكلامه مش مفهوم لأغلب الناس أو مش بيكوّن جمل قصيرة أو مش بيلاحظ الأطفال خالص؛ سن 4 ومفيش جمل من 4 كلمات ولا لعب تخيلي؛ سن 5 ومش بيعرف يحكي حاجة حصلت ولا يركز 5 دقايق في نشاط من غير شاشة. متسمعش «استنى هو هيتكلم لوحده» — التدخل المبكر كل ما بدأ بدري كانت نتيجته أحسن، والفحص نفسه مش بيضر بحاجة.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.cdc.gov/act-early/milestones/3-years.html" target="_blank" rel="noopener">CDC: Milestones by 3 Years — Learn the Signs. Act Early.</a> · <a href="https://www.cdc.gov/act-early/milestones/4-years.html" target="_blank" rel="noopener">CDC: Milestones by 4 Years — Learn the Signs. Act Early.</a> · <a href="https://www.cdc.gov/act-early/milestones/5-years.html" target="_blank" rel="noopener">CDC: Milestones by 5 Years — Learn the Signs. Act Early.</a> · <a href="https://www.cdc.gov/act-early/milestones/index.html" target="_blank" rel="noopener">CDC: Developmental Milestones — overview and checklists</a> · <a href="https://www.nationwidechildrens.org/family-resources-education/700childrens/2017/12/teaching-kids-a-second-language-can-it-cause-a-speech-delay" target="_blank" rel="noopener">Nationwide Children's: Can a Second Language Cause a Speech Delay?</a></p></details>

<h2 class="sec">17 · الحمام: الحوادث والتبول الليلي والإمساك</h2>
<div class="panel"><ul class="pts">
<li><b>الحوادث بعد التدريب طبيعية مش نكسة:</b> الأكاديمية الأمريكية لطب الأطفال (AAP) بتقول إن الحوادث ممكن تفضل شهور بعد ما التدريب يخلص، حتى في سن 3 و4 سنين، والمفروض بس إنها تقل تدريجيًا خلال حوالي 6 شهور. يعني بقعة مبلولة في اللبس مش معناها إن اللي اتبنى اتهد — كمّل عادي.</li>
<li><b>بروتوكول صفر خزي وقت الحادثة:</b> صوتك عادي، وشك عادي، جملة واحدة محايدة زي «معلش، بيحصل»، تغيير هدوم هادي، وخلاص — من غير محاضرة ولا تنهيدة ولا نظرة. ممنوع نهائيًا: التأنيب، السخرية، المقارنة بأخوه أو ولاد العيلة، أو حكاية الموضوع قدام الضيوف أو في التليفون وهو سامع. الخزي بيزود القلق، والقلق بيزود الحوادث — دايرة مقفولة.</li>
<li><b>النكسة بعد أخ جديد أو تغيير كبير:</b> AAP بتحدد أسباب النكسة المعروفة: ولادة أخ، حضانة جديدة، انتقال بيت، مرض في العيلة، توتر بين الأب والأم. العلاج الحقيقي مش في الحمام — في المشاعر: خصص 15 دقيقة يوميًا لعب فردي معاه من غير موبايل ومن غير الرضيع، وسميها باسمه («وقت عمر»)، وخليه يساعدك في حاجات البيبي عشان يحس إنه كبر مش اتزاح.</li>
<li><b>أول خطوة في أي نكسة مفاجئة هي الدكتور:</b> AAP بتقول أول رد فعل لنكسة واضحة يكون كشف عند طبيب الأطفال لاستبعاد التهاب المسالك البولية أو الإمساك — خصوصًا لو في حرقان أو تنقيط أو ريحة غريبة. لما تطمن طبيًا، ساعتها اتعامل معاها كموضوع مشاعر وتعود، مش عناد.</li>
<li><b>ترجع البامبرز ولا لأ:</b> AAP بتقول البريك المؤقت مقبول لو واضح إنه هيريّح الطفل بجد، بس الاتجاه العام الأفضل إنك تكمّل قدام. حل وسط عملي شغال في بيوت كتير: بامبرز بالليل بس، وكيلوت بالنهار مع مواعيد حمام ثابتة — ومن غير ما تقدمها كعقاب («هنريح جسمك شوية» مش «رجعناك بيبي»).</li>
<li><b>التبول الليلي في سن 3-5 طبيعي تمامًا:</b> حوالي 15-20% من أطفال الخامسة لسه بيبللوا السرير، والسبب نضج المثانة والتواصل بين المخ والمثانة وقت النوم العميق — يعني حاجة جسمه لسه بيتعلمها، مش كسل ولا دلع ولا قلة تربية. الوراثة ليها دور: لو انت أو مامته كنتوا كده، غالبًا هو كمان.</li>
<li><b>مفيش علاج للتبول الليلي قبل خمس سنين:</b> AAP بتعتبر التبول الليلي «مشكلة» بس لما يستمر بعد سن 5، وقبل كده مفيش أي تدخل مطلوب أصلًا، ومعظم الأطباء ما بيفكروش في جهاز الإنذار أو الدوا قبل 6-7 سنين. فأي حد يقولك «جربوا دوا» لطفل 4 سنين — الكلام ده ضد الإرشادات الطبية.</li>
<li><b>تجهيز الليل عمليًا بدل المعركة:</b> غطاء مرتبة ووتربروف، بيجامة وملاية احتياطي جاهزين جنب السرير عشان التغيير الساعة 3 الفجر ياخد دقيقتين من غير أعصاب، وحمام آخر حاجة قبل النوم. ممنوع: منع المية كعقاب، أو تصحيته بالعافية كذا مرة في الليل (مش بيعلّم المثانة حاجة)، أو جملة «انت لسه بيبي». وقاعدة بيت معلنة: ممنوع أي حد يريّق عليه — إخوات ولا ضيوف.</li>
<li><b>افهم حلقة الإمساك والخوف قبل ما تحاربها:</b> خروجة واحدة صلبة وجعته → بقى يمسك نفسه → البراز بيتجمع ويكبر وينشف → أول خروجة بعدها أوجع → يمسك أكتر. NHS بتقول العلامات: أقل من 3 مرات في الأسبوع، براز كبير صلب، حزق ووجع، أو «تسريب» في الكيلوت. ومعلومة بتغيب عن ناس كتير: الإمساك نفسه بيعمل حوادث بول لأن المستقيم المليان بيضغط على المثانة.</li>
<li><b>اكسر الحلقة بالمية والأكل مش بالزن:</b> مية على مدار اليوم — كوباية مع كل وجلة وواحدة بعد كل خروجة برّه في حر الإمارات، لأن التكييف والحر الاتنين بينشفوا. فايبر حقيقي: بلح، تين، مشمشية، كمثرى، برتقان، خضار في الأكل، شوفان وعيش أسمر. وقلّل اللي بيمسك: شيبسي، بسكوت أبيض، وكمية اللبن لو زيادة عن كوبايتين. ولو الدكتور كتب ملين، NHS بتأكد إنه بياخد شهور وبيستمر فترة بعد التحسن — متوقفوش من نفسك أول ما يخف.</li>
<li><b>الكرسي الصغير تحت الرجلين مش رفاهية:</b> NHS بتوصي إن رجلين الطفل تكون مسنودة على الأرض أو على مسند — مش متعلقة في الهوا — عشان عضلات الخروج ترتخي. الترتيب العملي: قاعدة أطفال فوق التواليت + سلمة أو كرسي بلاستيك ثابت تحت رجليه، ركبه أعلى شوية من مستوى الحوض. غيّر الوضعية دي وهتلاقي فرق قبل أي دوا.</li>
<li><b>قعدة الحمام الروتينية بعد الأكل:</b> 5-10 دقايق قعدة على الحمام بعد الفطار وبعد العشا — الأمعاء بتتحرك طبيعي بعد الوجبات. من غير أوامر «اعمل بقى!»، خليها قعدة هادية معاه كتاب أو حدوتة منك. المطلوب والممدوح هو القعدة نفسها، حتى لو معملش حاجة — النتيجة هتيجي مع التكرار.</li>
<li><b>الحضانة شريك في نفس البروتوكول:</b> اتفق مع المس صراحة: تغيير هادي من غير أي تعليق قدام الأطفال، وإن الحادثة تتبعتلك في رسالة مش تتناقش قدامه عند باب الحضانة. جهزله شنطة فيها 2-3 أطقم هدوم كاملة بالشراب، وكيس بلاستيك للمبلول، واطلب مواعيد حمام ثابتة (قبل الفسحة وبعد الأكل) بدل انتظار إنه يطلب — الطفل الغرقان في اللعب بينسى.</li>
<li><b>امدح الخطوة اللي في إيده، وخلي الحادثة محايدة:</b> امدح السلوك اللي هو بيتحكم فيه: «قلتلي إنك عايز الحمام — ممتاز»، «قعدت لوحدك — شاطر»، مش «انت نضيف النهارده» — لأن النشفان مش قرار هو بياخده. المديح المبالغ فيه على اليوم الناشف بيخلي اليوم المبلول يتحس إنه فشل. ونفس المنطق ديني: علّمه دعاء دخول الحمام والاستنجاء بالشطاف كروتين حلو «لأن ديننا بيحب النضافة» — محبة وعادة، مش تخويف ولا ربط النجاسة بالعيب.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«معلش يا حبيبي، دي حادثة بسيطة وبتحصل لكل الأطفال. تعالى نغيّر مع بعض وخلاص.»</li>
<li>«جسمك هو اللي بيتعلم يصحى ناشف، مش انت اللي غلطان. لما مثانتك تكبر شوية هتصحى ناشف لوحدك — وأنا مش زعلان منك خالص.»</li>
<li>«أنا حاسس إن كل حاجة اتغيرت من ساعة ما البيبي جه. إيه رأيك ده وقتنا احنا الاتنين بس — انت اللي تختار نلعب إيه.»</li>
<li>«أنا عارف إن الخروج وجعك المرة اللي فاتت وإنك خايف. الدكتور ادانا حاجة هتخليه طري ومش هيوجع تاني — أوعدك، وأنا قاعد جنبك.»</li>
<li>«قعدت على الحمام بعد الفطار زي ما اتفقنا — دي هي الشطارة نفسها، حتى لو مطلعش حاجة النهارده.»</li>
<li>«في بيتنا محدش بيريّق على حد. سريرك اتبل؟ نغيّر الملاية سوا في دقيقة وننام تاني.»</li>
</ul></div>
<div class="warn">روح لطبيب الأطفال لو: حرقان أو وجع مع التبول، بول معكر أو فيه دم أو وردي، عطش مفاجئ وشرب مية غير معتاد، رجع يبلل نفسه بالنهار بعد ما كان نشفان 6 شهور أو أكتر، إمساك مستمر أكتر من أسبوعين رغم الأكل والمية، دم مع البراز أو وجع بطن شديد، أو تسريب براز متكرر في الكيلوت (غالبًا إمساك مزمن مش قلة أدب). أما التبول الليلي لوحده قبل سن 5 فمش سبب للقلق ولا للعلاج.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.healthychildren.org/English/ages-stages/toddler/toilet-training/Pages/Regression.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Potty Training Regression</a> · <a href="https://www.healthychildren.org/English/ages-stages/toddler/toilet-training/Pages/Bedwetting.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Bedwetting: 3 Common Reasons & What Families Can Do</a> · <a href="https://www.healthychildren.org/English/health-issues/conditions/genitourinary-tract/Pages/Nocturnal-Enuresis-in-Teens.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Nocturnal Enuresis in Children & Teens (تعريفه بعد سن 5)</a> · <a href="https://www.nhs.uk/conditions/baby/health/constipation-in-children/" target="_blank" rel="noopener">NHS — Constipation in children</a> · <a href="https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/Are-accidents-normal-or-the-sign-of-a-problem.aspx" target="_blank" rel="noopener">AAP HealthyChildren — Are accidents normal or a sign of a problem?</a></p></details>
<h2 class="sec">18 · سنان طفلك وعادات الفم</h2>
<div class="panel"><ul class="pts">
<li><b>فرشتين في اليوم ودقيقتين كاملتين، وأهم مرة اللي قبل النوم:</b> بالليل الريق بيقل فأي سكر فاضل على السنان بيشتغل طول الليل. حط ساعة رملية أو تايمر على الموبايل دقيقتين — الطفل في السن ده بيغسل 20 ثانية ويقول خلصت لو سبته.</li>
<li><b>انت اللي بتغسل مش هو لوحده لحد 7-8 سنين:</b> عضلات إيد طفل 3-5 سنين لسه ما بتعرفش تنضف صح. خليه يبدأ بنفسه عشان يتعود ويحس إنها بتاعته، وبعدين انت «تكمّل وتخلّص» — خصوصًا الضروس الورانية وعند خط اللثة. الـNHS بتقول استمر تساعده لحد 7 سنين على الأقل.</li>
<li><b>المعجون بالفلورايد وبحجم حبة البسلة:</b> من سن 3 لـ 6 الكمية الصح قد حبة بسلة من معجون فيه فلورايد 1000 جزء في المليون على الأقل (معجون العيلة العادي 1450 تمام). وعلّمه «يتف وما يشطبش» — لو شطب بمية كتير الفلورايد بيتغسل وما يحميش.</li>
<li>الطريقة: حركات دايرية صغيرة وفرشاة ناعمة: فرشاة صغيرة الرأس ناعمة الشعر، حركات دايرية خفيفة على كل الأسطح — برا وجوا وسطح المضغ — وعند اللثة. اقف وراه قدام المراية أو خلي راسه في حضنك عشان تشوف جوه بقه. غيّر الفرشاة كل 3 شهور أو لما شعرها يتفتح.</li>
<li><b>خليها لعبة وقدوة مش معركة:</b> هو يختار فرشته بنفسه من السوبرماركت، جدول ستيكرز على التلاجة، ولعبة «دوري ودورك» — هو يغسل لك سنانك وانت تغسل له. وأقوى حاجة إنه يشوفك انت وماما بتغسلوا سنانكم كل يوم — التقليد أقوى من ألف أمر.</li>
<li><b>اربط النضافة بحب النبي مش بالتخويف:</b> قوله إن سيدنا النبي ﷺ كان بيحب ينضف سنانه بالسواك، وقال: «لولا أن أشق على أمتي لأمرتهم بالسواك عند كل صلاة» (متفق عليه — البخاري 887). «إحنا بننضف سنانا زي ما النبي كان بيحب» أجمل بكتير من حكاية «الدودة اللي هتاكل سنانك» والتخويف.</li>
<li><b>لو عمره ما شاف دكتور أسنان، احجز الأسبوع ده:</b> التوصية العالمية (أكاديمية طب الأطفال الأمريكية AAP وأطباء أسنان الأطفال AAPD) إن أول زيارة تكون عند أول سنة من العمر. طفلك 3-5 سنين؟ يبقى اتأخرنا — خليها زيارة تعارف خفيفة: يقعد على الكرسي، يعد سنانه، ياخد هدية. وبعدها كشف دوري كل 6 شهور، وغالبًا الدكتور هيحط له فلورايد فارنيش للحماية.</li>
<li><b>عدد مرات الحلويات أهم من كميتها:</b> كل مرة سكر بيدخل البق بتحصل «هجمة حموضة» على السنان بتقعد وقت لحد ما الريق يعدلها. يعني قطعة شوكولاتة كاملة مرة واحدة بعد الغدا أخف ضررًا بكتير من كيس حلويات صغير متوزع تنقيت على طول اليوم. القاعدة في البيت: الحلو بعد الأكل على طول، مش بين الوجبات.</li>
<li><b>بين الوجبات مية وبس:</b> العصاير حتى الطبيعية والمشروبات اللي شكلها «صحي» فيها سكر بيعمل نفس الهجمة. العصير لو هيتشرب يبقى مع الأكل وفي كوباية. وخد بالك من اللصقة بالذات: التوفي والحلاوة والزبيب وحتى البلح بيقعدوا لازقين في السنان — بعديهم شربة مية كبيرة أو غسيل.</li>
<li><b>ببرونة اللبن في السرير = تسوس مضمون:</b> النوم والببرونة في البق (لبن أو عصير) هو السبب الكلاسيكي لتسوس السنان الأمامية العلوية عند الصغيرين (جمعية طب الأسنان الأمريكية ADA). القاعدة الثابتة: في السرير مفيش غير مية. اللبن قبل النوم عادي، بس الترتيب: لبن ← غسيل سنان ← سرير. وأصلًا في سن 3-5 الببرونة كلها المفروض اتودعت خلاص.</li>
<li><b>مص الصباع والتيتينة تهدئة ذاتية مش عيب:</b> دي طريقة الطفل يطمّن نفسه، وأغلب الأطفال بيسيبوها لوحدهم بين سنتين و4 سنين (AAP). الزن والضغط والعقاب بيزودوها مش بيقللوها. اسأل نفسك: بيمص صباعه امتى بالظبط؟ وقت التعب؟ الملل؟ أخ جديد؟ حضانة جديدة؟ عالج السبب اللي مقلقه — حضن أكتر، روتين نوم أهدأ — مش الصباع نفسه.</li>
<li><b>ممنوع المنكّر المر والشطة والتريقة:</b> ما تدهنش صباعه حاجة مرة ولا تتريق عليه قدام حد بـ«عيب، انت كبير» — ده بيكسر ثقته والتوتر الزيادة بيخلي العادة أقوى. اللي بيشتغل: امدحه في اللحظات اللي إيده مش في بقه، وشغّل إيديه بحاجة (عجين، مكعبات، كورة ضغط). لو العادة قوية ومستمرة بعد 3-4 سنين أو لاحظت سنانه الأمامية بتتزحزح، اذكرها لدكتور الأسنان في الكشف الدوري — من غير دراما قدام الطفل.</li>
<li><b>قضم الأظافر بنفس المنطق بالظبط:</b> عادة تفريغ توتر شائعة وغالبًا بتختفي لوحدها (AAP بتقول أول خطوة: تجاهلها). قص أظافره دايمًا قصيرة، ودوّر على مصدر التوتر أو الملل بدل ما تحارب العادة. التنبيه المستمر «شيل إيدك من بقك» بيثبتها مش بيشيلها.</li>
<li><b>فحص الأسنان في مدارس الإمارات حلو بس مش بديل الدكتور:</b> في برامج فحص أسنان مدرسية في دبي والإمارات الشمالية ضمن الصحة المدرسية، والعيادة المتنقلة لجامعة الشارقة بتعمل فحوصات ووقاية (فلورايد وحشوات وقائية) في مدارس الشارقة. لو الحضانة أو المدرسة بعتت ورقة فحص أسنان، اقراها كويس وخدها معاك للدكتور — بس افتكر إن الفحص المدرسي سريع وجماعي وما بيغنيش أبدًا عن الكشف الدوري كل 6 شهور.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«تعالى نغسل سنانا مع بعض قدام المراية — انت ابدأ الأول، وأنا بعدين أخلّص الحتت الصعبة اللي ورا.»</li>
<li>«سيدنا النبي ﷺ كان بيحب سنانه تكون نضيفة وكان بيستعمل السواك — تعالى ننضف سنانا زيه.»</li>
<li>«الحلو عندنا بعد الأكل على طول — اختار انت حاجة واحدة ناكلها بعد الغدا النهارده.»</li>
<li>«في السرير مفيش غير المية. نشرب اللبن دلوقتي، نغسل سنانا، وبعدين ننام.»</li>
<li>بدل «شيل صباعك من بقك!» قول: «شايفك مضايق شوية... تعالى في حضني احكيلي.»</li>
<li>«برافو عليك! فضلت تفرش لحد ما الرملة خلصت — ورّيني سنانك بتلمع إزاي.»</li>
<li>قبل عزومة العيلة: «هناكل حلو النهارده بعد الغدا، حاجة واحدة نختارها مع بعض — اتفقنا؟»</li>
</ul></div>
<div class="warn">بقع بيضا طباشيري أو بنية على السنان قرب اللثة (خصوصًا الأمامية العلوية) دي بداية تسوس — احجز دكتور أسنان بسرعة لأن التسوس المبكر بيتلحق. وجع سنان، ورم في الخد أو اللثة، أو سخونية مع وجع = ما تستناش ميعاد الكشف الدوري. ملحوظة تحقق: برامج الفحص المدرسي الموثقة في الإمارات بتغطي صفوف مدرسية معينة، وتغطية مرحلة الروضة بتختلف من مدرسة لمدرسة — اسأل مدرسة طفلك بنفسك.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.nhs.uk/live-well/healthy-teeth-and-gums/taking-care-of-childrens-teeth/" target="_blank" rel="noopener">NHS — Taking care of children's teeth (كمية المعجون، الفلورايد، المساعدة لحد 7 سنين، اتف وما تشطبش)</a> · <a href="https://www.healthychildren.org/English/healthy-living/oral-health/Pages/Brushing-Up-on-Oral-Health-Never-Too-Early-to-Start.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — Good Oral Health Starts Early (أول زيارة، فلورايد فارنيش)</a> · <a href="https://www.aapd.org/resources/parent/faq/" target="_blank" rel="noopener">AAPD — FAQ للأهل (أول زيارة عند أول سنة، كشف كل 6 شهور)</a> · <a href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Pacifiers-and-Thumb-Sucking.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — Pacifiers and Thumb Sucking (تهدئة ذاتية، بتروح لوحدها 2-4 سنين، الضغط بيضر)</a> · <a href="https://www.healthychildren.org/English/family-life/family-dynamics/communication-discipline/Pages/common-childhood-habits.aspx" target="_blank" rel="noopener">HealthyChildren.org (AAP) — Common Childhood Habits (قضم الأظافر: تجاهل العادة، العقاب بيزودها)</a> · <a href="https://www.mouthhealthy.org/all-topics-a-z/tooth-decay-with-baby-bottles" target="_blank" rel="noopener">ADA MouthHealthy — Tooth Decay with Baby Bottles (تسوس الببرونة، مية بس في السرير)</a> · <a href="https://www.actiononsugar.org/sugar-and-health/sugars-and-tooth-decay/" target="_blank" rel="noopener">Action on Sugar / Childsmile (NHS Scotland) — عدد مرات السكر أهم من الكمية، الحلو مع الوجبات</a> · <a href="https://sunnah.com/bukhari:887" target="_blank" rel="noopener">حديث السواك — صحيح البخاري 887 (متفق عليه)</a> · <a href="https://www.sharjah.ac.ae/Academics/Dentistry/University-Dental-Hospital-Sharjah/Mobile-Dental-Clinic" target="_blank" rel="noopener">University of Sharjah — Mobile Dental Clinic (فحص ووقاية أسنان لمدارس الشارقة)</a> · <a href="https://onlinelibrary.wiley.com/doi/10.1111/ipd.70074" target="_blank" rel="noopener">Int J Paediatric Dentistry (2026) — Dental caries among Dubai & Northern Emirates schoolchildren (برنامج الفحص المدرسي)</a></p></details>
<h2 class="sec">19 · المرض والدكتور والمستشفى</h2>
<div class="panel"><ul class="pts">
<li><b>يوم المرض قواعده مختلفة — الراحة الأول:</b> يوم ما طفلك يسخّن، التربية بتاخد إجازة جزئية. مهمتك النهارده ثلاثة بس: سوائل، نوم، حضن. مش وقت «خلّص أكلك» ولا تعليم أدب ولا مذاكرة حروف. جسمه محتاج طاقته كلها عشان يحارب، ومناعته مش هتتحسن بمعركة على طبق مكرونة.</li>
<li><b>سيب هيكل اليوم واقف حتى لو فاضي:</b> مش لازم الروتين كامل، بس علاماته تفضل موجودة: فطار حتى لو قضمتين، غسيل سنان، قيلولة على سريره حتى من غير نوم، ودعاء النوم زي كل ليلة. الهيكل ده رسالة مطمئنة لطفلك إن الدنيا لسه ماشية طبيعي حتى وهو تعبان.</li>
<li><b>الشاشة هتزيد يوم المرض؟ سمّيها بصراحة:</b> بدل ما تكسر قاعدتك في السر وتتحاسب عليها بعدين، قولها قدامه: «إنت عيان، فهنتفرج أكتر من العادي النهارده، وأول ما تخف نرجع لقاعدتنا». كده القاعدة فضلت محترمة والاستثناء له اسم وله نهاية — ومفيش معركة يوم ما يرجع للحضانة.</li>
<li><b>السخونية مش عدو — عالج طفلك مش الترمومتر:</b> الأكاديمية الأمريكية لطب الأطفال (AAP) بتقول إن هدف خافض الحرارة راحة الطفل مش تصفير الرقم. لو حرارته 38.5 وهو بيلعب وبيشرب، مش محتاج دوا. لو 38 وهو مكسّر ومخنوق ومش قادر ينام، اديله باراسيتامول بجرعة وزنه. بص على الطفل، مش على الشاشة الرقمية.</li>
<li><b>احفظ علامات الخطر بدل ما تعيش مرعوب من كل سخونية:</b> حسب NHS، اللي يوّدي الطوارئ فعلًا: صعوبة نفس أو شد في الضلوع، شفايف أو جلد مزرق/رمادي/مبقّع، طفح جلدي مش بيختفي لما تضغط عليه بجنب كوباية زجاف، خمول شديد مش بيصحى منه، تشنج، وعلامات الجفاف (مفيش حمام من ساعات طويلة، عياط من غير دموع، عينين غايرة). من غير العلامات دي: سوائل ومتابعة في البيت، وكلّم الدكتور لو السخونية كمّلت 5 أيام.</li>
<li><b>اعرف مستشفاك في الإمارات قبل ما تحتاجه:</b> الإسعاف في الإمارات 998. في الشارقة: مستشفى القاسمي للنساء والأطفال (حكومي — طوارئ أطفال). في دبي: مستشفى الجليلة للأطفال، أول مستشفى تخصصي أطفال في الإمارات وطوارئه شغالة 24/7. خزّن العنوانين في موبايلك دلوقتي وإنت رايق — مش الساعة 3 الفجر وإنت مرعوب وبتدور على جوجل بإيد بترتعش.</li>
<li><b>التشنج الحراري منظره مرعب لكنه غالبًا بيعدي على خير:</b> بيحصل لحوالي 3% من الأطفال بين 6 شهور و5 سنين. لو حصل: نيّمه على جنبه، متحطش أي حاجة في بقه، شوف الساعة وعدّ الدقايق، وبعدها اعرضه على دكتور. وخد بالك: خافض الحرارة مش بيمنع التشنج — فلو حصل، ده مش تقصير منك.</li>
<li>ممنوع كذبة «مش هتحس بحاجة» — بتتكشف في ثانية: إرشادات Nemours KidsHealth واضحة: قول الحقيقة بمقاس سنه. الحقنة بتوجع؟ قوله: «بتقرص قرصة صغيرة وبتخلص في ثواني، وأنا جنبك». الكذبة بتوفّرلك دقيقة النهارده وبتخسّرك ثقته في كل زيارة دكتور جاية — وهيدخل كل كشف متوتر لأنه مش مصدقك.</li>
<li><b>تحضير عملية أو مستشفى:</b> قبلها بيوم أو يومين، مش أسبوع: طفل 3-5 سنين خياله أوسع من صبره — لو عرف بدري هيقعد يبني سيناريوهات رعب. يومين كفاية: العبوا «دكتور» بالدبدوب، خليه يكشف عليه ويسمع قلبه، واحكي التسلسل بالترتيب: «هنلبس بيجامة المستشفى، الدكتور هيديك دوا ينوّمك نومة عميقة، ولما تصحى أنا أول حد هتشوفه». وجاوب على أسئلته كلها بصدق.</li>
<li><b>وشك هو جهاز قياس الخطر بتاع طفلك:</b> هو مش فاهم الترمومتر ولا كلام الدكتور — فاهم عينيك. لو شاف الرعب على وشك، هيتعلم إن المرض كارثة وإن جسمه مش أمان. لو حاسس إنك هتنهار: اطلع برا الأوضة دقيقة، خد نفس، وارجع بوش هادي. جملة واحدة بصوت ثابت أحسن من عشر طمأنات مرتعشة.</li>
<li><b>دعاء المريض حضن مش طقس:</b> حط إيدك على جبين طفلك وهو نايم أو تعبان وقول بصوت هادي: «أذهِبِ البأس ربَّ الناس، اشفِ وأنت الشافي، لا شفاء إلا شفاؤك، شفاءً لا يغادر سقمًا» (متفق عليه — البخاري ومسلم). بالتكرار، طفلك هيربط صوت الدعاء بالدفا والأمان — ودي التربية الدينية اللي إحنا عايزينها: ربنا بييجي في أحلى لحظات الطمأنينة، مش في التهديد أبدًا.</li>
<li><b>علّمه هو كمان دعاء الوجع — بيدّيه قوة:</b> من حوالي 4 سنين يقدر يتعلم يحط إيده على المكان اللي بيوجعه ويقول «بسم الله» 3 مرات، وبعدها «أعوذ بالله وقدرته من شر ما أجد وأحاذر» (رواه مسلم). ده بيحوّل إحساس العجز لإحساس إن في حاجة في إيده يعملها — وربط تاني جميل بين ربنا والراحة.</li>
<li><b>رفض الدوا له قسم كامل — بس دي القواعد السريعة:</b> اختيار وهمي بيكسر المعركة («بالسرنجة ولا بالمعلقة؟ قبل الحضن ولا بعده؟»)، ومتخبيش الدوا في أكله في السر (لو اكتشف هيبطل يأمن أكله كله)، والجرعة دايمًا بالوزن مش بالسن، وممنوع أسبرين نهائيًا للأطفال (خطر متلازمة راي). التفاصيل الكاملة في قسم رفض الدوا.</li>
<li><b>الرجوع لورا بعد المرض طبيعي ومؤقت:</b> بعد أسبوع عيان، عادي جدًا يرجع يعيّط عند الفراق، يعمل حادثة حمام وهو متعلم من زمان، أو يصحى بالليل عايز حضن. ده مش «اتدلع وباظ» — ده طفل استنفد طاقته. أسبوع لأسبوعين صبر ورجوع هادي للروتين وهيرجع زي ما كان. لو الرجوع لورا كمّل أكتر من كده بكتير، اسأل طبيب الأطفال.</li>
</ul></div>
<div class="panel"><h3>جمل جاهزة تقولها</h3><ul class="quotes">
<li>«إنت عيان النهارده، فشغلتنا الوحيدة إننا نرتاح ونشرب. وهنتفرج أكتر من العادي كمان — وأول ما تخف، نرجع لقاعدتنا زي الأول.»</li>
<li>«الحقنة بتقرص قرصة صغيرة كده وبتخلص في ثواني. أنا واقف جنبك وإيدك في إيدي، ولو عيّطت عادي خالص — العياط مش عيب.»</li>
<li>«الدكتور شغلته يساعد جسمك يخف. هيبص في ودنك بالنور الصغير ده — تحب نجرب الأول على الدبدوب؟»</li>
<li>(إيدك على جبينه): «أذهِبِ البأس ربَّ الناس، اشفِ وأنت الشافي، لا شفاء إلا شفاؤك، شفاءً لا يغادر سقمًا.»</li>
<li>«حط إيدك على المكان اللي بيوجعك وقول معايا: بسم الله، بسم الله، بسم الله… شاطر.»</li>
<li>«أنا شايف إنك تعبان وده صعب فعلًا. أنا هنا جنبك، مش رايح في أي حتة.»</li>
<li>«إنت خفيت، بس جسمك لسه بياخد وقته عشان يرجع قوي. تعال ننام في سريرك وأنا أقعد جنبك شوية.»</li>
</ul></div>
<div class="warn">روح أقرب طوارئ أطفال أو اتصل بـ998 فورًا لو ظهر على طفلك: صعوبة في النفس أو شد في الضلوع وهو بيتنفس، شفايف أو جلد مزرق/رمادي، طفح جلدي مش بيختفي لما تضغط عليه بجنب كوباية زجاج، تشنج، خمول شديد مش بيصحى منه، أو علامات جفاف واضحة. وأي رضيع أقل من 3 شهور حرارته 38 أو أكتر = طوارئ فورًا من غير تفكير — وصّل المعلومة دي لأي أب وأم حواليك.</div><details class="srcs"><summary>المصادر</summary><p class="src"><a href="https://www.nhs.uk/symptoms/fever-in-children/" target="_blank" rel="noopener">NHS — High temperature (fever) in children</a> · <a href="https://publications.aap.org/pediatrics/article/127/3/e20103852/65016/Fever-and-Antipyretic-Use-in-Children" target="_blank" rel="noopener">AAP Pediatrics — Fever and Antipyretic Use in Children</a> · <a href="https://kidshealth.org/en/parents/anesthesia-prepare.html" target="_blank" rel="noopener">Nemours KidsHealth — Helping Kids Get Ready for Surgery</a> · <a href="https://kidshealth.org/en/parents/dr-visits.html" target="_blank" rel="noopener">Nemours KidsHealth — Preparing Your Child for Visits to the Doctor</a> · <a href="https://www.mayoclinic.org/diseases-conditions/febrile-seizure/symptoms-causes/syc-20372522" target="_blank" rel="noopener">Mayo Clinic — Febrile seizure: symptoms and causes</a> · <a href="https://u.ae/en/information-and-services/justice-safety-and-the-law/handling-emergencies" target="_blank" rel="noopener">الحكومة الاتحادية الإماراتية — أرقام الطوارئ (الإسعاف 998)</a> · <a href="https://www.ehs.gov.ae/en/services/health-care-facilities/al-qassimi-womans-and-childrens-hospital" target="_blank" rel="noopener">مؤسسة الإمارات للخدمات الصحية — مستشفى القاسمي للنساء والأطفال، الشارقة</a> · <a href="https://services.dha.gov.ae/sheryan/wps/portal/home/medical-directory/facility-details?facilityId=0000812" target="_blank" rel="noopener">Dubai Health (DHA) — مستشفى الجليلة للأطفال، دبي</a> · <a href="https://dorar.net/aadab/1516" target="_blank" rel="noopener">الدرر السنية — الدعاء للمريض بالش
