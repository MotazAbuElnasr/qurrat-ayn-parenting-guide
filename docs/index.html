["فن","الرسم بالإسفنج","قطع إسفنج مقصوصة أشكال + ألوان.","25 د","تجهيز 5 د","هات إسفنجة مواعين جديدة وقصّها بالمقص أشكال بسيطة (دايرة، مربع، نجمة)، وحط 3 ألوان جواش أو ألوان مياه في طبق ورقي مسطح، وافرش مشمع أو كيس زبالة مفتوح على الترابيزة. خطوات التشغيل: ورّي طفلك مرة واحدة إزاي يغمس الإسفنجة في اللون غمسة خفيفة ويدوس بيها على الورقة ويرفع إيده على طول من غير ما يمسح، وبعدين سيبه هو يكمّل ويجرب كل الأشكال والألوان براحته. قول له: \"بص، لما تدوس وترفع إيدك بسرعة، الشكل بيتطبع لوحده زي الختم!\". لو النشاط سهل عليه، اطلب منه يعمل \"نمط\": دايرة، نجمة، دايرة، نجمة، وهو يكمل السلسلة — دي رياضيات حقيقية للسن ده.",[3,7]],
["فن","الطباعة بالخضار","نص بطاطسة أو بامية + لون.","25 د","تجهيز 5 د","قطّع بطاطسة نصين وانحت في نصها شكل بسيط بسكينة (قلب أو نجمة)، وهات كمان بامية أو نص فلفلة رومي — مقطعها بالعرض بيطلع شكل وردة، وحط الألوان في طبق مسطح والورق قدامه. خطوات التشغيل: امسك إيد طفلك في أول طبعة بس عشان يحس بقد إيه يدوس، وبعدين سيبه يطبع لوحده ويكتشف إن كل خضار بيسيب شكل مختلف. قول له: \"استنى، خمّن الأول: البامية دي هتطبع شكل إيه على الورق؟\". لو صعب عليه إنه يدوس بتوزيع مظبوط، هات له خضار أكبر (نص بطاطسة كبيرة من غير نحت) عشان المساحة الأوسع أسهل في المسك.",[3,7]],
["فن","الكولاج","قصاصات مجلات وورق ملون + صمغ.","30 د","تجهيز 5 د","جمّع مجلات أو بروشورات سوبر ماركت قديمة وورق ملون وصمغ ستيك (أسهل من الصمغ السايل للسن ده)، وهات ورقة كرتون أو غلاف علبة كورن فليكس يبقى هو اللوحة. خطوات التشغيل: خلّي طفلك يقطّع أو يقطّع بإيده صور وأشكال من المجلات — التقطيع بالإيد نفسه تمرين ممتاز للأصابع — وبعدين هو اللي يمسح الصمغ ويلزق فين ما يحب، وفي الآخر علّقوا اللوحة على الباب أو التلاجة. قول له: \"انت الفنان، انت اللي بتقرر كل حتة تتحط فين، مفيش صح وغلط هنا\". لو النشاط سهل عليه، اديله موضوع محدد: \"اعمل لوحة كل اللي فيها حاجات بناكلها\" أو \"حاجات لونها أحمر بس\".",[3,7]],
["فن","الرسم بالخيط","خيط مغموس في لون بتسحبه على الورق.","20 د","تجهيز 5 د","قصّ حتة خيط سميك (خيط صوف أو دوباره) طولها شبرين تقريبًا، وحضّر لون جواش مخفف بمية شوية في طبق، وورقة بيضا تتنى نصين وتتفتح تاني. خطوات التشغيل: خلّي طفلك يغمس الخيط كله في اللون ماسكه من طرفه الناشف، وبعدين يرصّه بأي شكل على نص الورقة وطرفه طالع برّه، واقفل الورقة عليه واضغط بإيدك فوقها خفيف، وخلّيه هو يسحب الخيط لبرّه وهي مقفولة وبعدين افتحوا سوا. قول له: \"اقفل عينيك وافتح الورقة... شايف الرسمة اللي الخيط عملها لوحده؟ شبه إيه في رأيك؟\". لو صعب عليه يسحب والورقة مقفولة، اعكسوا الأدوار: هو اللي يضغط على الورقة بإيديه الاتنين وانت اللي تسحب.",[3,7]],
["فن","تلوين بالثلج","لون مايي متجمّد في قوالب.","20 د","من امبارح","التجهيز من الليلة اللي قبلها: حط مية ملوّنة بألوان الطعام أو جواش مخفف في قالب تلج، واغرس في كل عين عود خشب صغير أو نص مصاصة قبل ما تحطه في الفريزر. خطوات التشغيل: تاني يوم طلّع المكعبات وحطها في طبق، وهات ورق مقوى (الورق العادي بيتبل بسرعة)، وخلّي طفلك يمسك المكعب من العود ويرسم بيه — هيلاقيه بيرسم أحسن كل ما يدوب. قول له: \"جرّب دلوقتي وجرّب كمان خمس دقايق... ليه بقى بيلوّن أحسن؟ عشان السخونة بتدوّبه!\". لو النشاط سهل عليه، اديله مكعبين لونين مختلفين وخلّيه يلوّن بيهم فوق بعض ويشوف اللون التالت اللي بيطلع.",[3,7]],
["فن","لوحة الطبيعة","ورق شجر وحصى جمعناهم من برّه.","30 د","تجهيز 5 د","النشاط ده جزئين: الأول انزلوا لفة قصيرة تحت البيت أو في الحديقة ومعاكم كيس صغير، ومهمة طفلك يجمع ورق شجر بأشكال مختلفة وحصوة أو اتنين وأي حاجة ناشفة حلوة. خطوات التشغيل في البيت: افرد كل اللي جمعتوه على الترابيزة وخلّيه يفرزه (الورق مع بعضه، الحصى مع بعضه)، وبعدين هات كرتونة وصمغ سايل وخلّيه يرصّ ويلزق اللي جمعه بالشكل اللي يعجبه. قول له وانتو بتجمعوا: \"دوّر على ورقة شجر مفيش زيها في الكيس — كل ورقة شكلها مختلف عن التانية\". لو صعب عليه اللزق بالصمغ السايل، انت اللي تحط نقطة الصمغ على الكرتونة وهو اللي يختار ويحط الحتة فوقها.",[3,7]],
["فن","الرسم على المرايا","ألوان مياه على السيراميك وهي تمسح.","25 د","تجهيز 5 د","التجهيز: ألوان مياه أو جواش مخفف وفرشة كبيرة، والمكان هو سيراميك الحمام أو المراية أو باب البانيو الزجاج، وحط فوطة قديمة على الأرض تحت مكان الشغل. خطوات التشغيل: خلّي طفلك يرسم على السيراميك أو المراية براحته — المساحة الرأسية الكبيرة دي بتقوّي عضلات الكتف والذراع اللي هو محتاجها بعدين للكتابة — ولما يخلص اديله بخاخة مية صغيرة أو إسفنجة مبلولة وخلّي المسح نفسه جزء من اللعبة. قول له: \"ارسم براحتك على الحيطة دي، هي المكان الوحيد في البيت المسموح نرسم عليه، وبعدين هنمسحها بالسحر\". لو النشاط سهل عليه، ارسم انت شكل ناقص (وش من غير عينين، بيت من غير باب) وخلّيه هو يكمّله.",[3,7]],
["مطبخ","بيتزا صغيرة","عجينة + صلصة + جبنة وهي اللي تحط.","40 د","تجهيز 10 د","التجهيز: عجينة جاهزة من السوبر ماركت أو أرغفة توست، وصلصة في طبق صغير ومعلقة، وجبنة موتزاريلا مبشورة وزيتون وقطع فلفل ملون كل واحدة في طبق لوحدها، وطفلك واقف على كرسي ثابت جنبك على مستوى الترابيزة. خطوات التشغيل: انت تفرد العجينة دواير صغيرة، وهو اللي يعمل كل الباقي بالترتيب: يفرد الصلصة بضهر المعلقة، يرش الجبنة، يوزّع الزيتون والفلفل زي ما يحب، وانت بس اللي تدخّلها الفرن وتطلّعها، وفي الآخر ياكل البيتزا اللي هو عملها. قول له: \"انت الشيف النهارده، انت اللي بتقرر البيتزا بتاعتك عليها إيه\". لو فرد الصلصة صعب عليه، ابدأ بالتوست بدل العجينة — أصغر وأصلب وأسهل في التحكم.",[3,8]],
["مطبخ","سيخ الفاكهة","قطع فاكهة على أعواد.","20 د","تجهيز 5 د","التجهيز: قطّع انت فاكهة طرية مكعبات كبيرة (موز، فراولة، شمام، عنب مقطوع نصين)، كل نوع في طبق لوحده، وهات أعواد خشب واقطع طرفهم المدبب بالمقص عشان الأمان — أو استخدم شاليمو سميك بداله. خطوات التشغيل: ورّيه مرة واحدة إزاي يدخّل العود في حتة الفاكهة وهو ماسكها، وبعدين اطلب منه يعمل \"نمط\": موز، فراولة، عنب، وتاني موز، فراولة، عنب — وفي الآخر يقدّم سيخ لكل واحد في البيت قبل ما ياكل بتاعه. قول له: \"شوف النمط بتاعك: موز وبعدين فراولة وبعدين عنب... اللي جاي إيه بقى؟\". لو التدخيل في العود صعب عليه، خلّيه يرصّ النمط في الطبق بس وانت اللي تدخّله في العود قدامه.",[3,8]],
["مطبخ","عجن العيش","عجينة تعجنها وتشكّلها.","45 د","تجهيز 10 د","التجهيز: في طبق كبير حط 2 كوب دقيق ومعلقة صغيرة خميرة فورية ورشة ملح ومعلقة سكر، وجنبهم كوباية مية دافية ومعلقتين زيت، والبس طفلك تيشيرت قديم واغسلوا إيديكم سوا. خطوات التشغيل: خلّيه هو اللي يكيل ويحط الحاجات الناشفة بالكوب والمعلقة، صبّ انت المية بالراحة وهو بيقلّب، وبعدين ييجي أحلى جزء: العجن نفسه — سيبه يدعك ويضرب ويقلب العجينة براحته حتى لو مش متقن، وبعد ما تخمر نص ساعة خلّيه يشكّلها أقراص صغيرة وانت اللي تخبزها، ولازم ياكل من العيش اللي عمله بإيده. قول له وانتو مستنيين العجينة: \"الخميرة دي كائن حي صغير بياكل السكر وينفخ العجينة بالراحة، تعالى نبص عليها كمان شوية نشوفها كبرت قد إيه\". لو النشاط صعب عليه، قسّم العجينة واديله حتة صغيرة قد الليمونة يعجنها هو وانت شغال في الحتة الكبيرة جنبه.",[3,8]],
["مطبخ","سلطة بإيدها","تغسل وتقطّع بسكينة أطفال.","25 د","تجهيز 5 د","جهّز خيارة وطماطم وخس وجزرة نص مسلوقة عشان تبقى طرية، وسكينة أطفال بلاستيك أو سكينة زبدة ولوح تقطيع وطبق كبير. اغسلوا الخضار سوا في الحوض، وانت قطّع الحاجات الناشفة أصابع طويلة، وسيب طفلك يقطّعها حتت صغيرة بسكينته ويرميها في الطبق، وفي الآخر هو اللي يحط الملح والليمون ويقلّب. قوله: \"انت اللي عملت السلطة دي كلها بإيدك — كلنا هناكل من شغلك النهارده.\" لو التقطيع صعب عليه خليه يقطّع الخس بإيده من غير سكينة، ولو سهل عليه علّمه يقشر الخيار بالقشارة وإيدك فوق إيده.",[3,8]],
["مطبخ","كوكيز شوفان","خلط وتشكيل وقياس بالكوب.","45 د","تجهيز 10 د","جهّز كوباية شوفان وموزة مستوية ومعلقتين عسل ومعلقتين زيت، وكوب قياس وطبق عميق وصنية عليها ورق زبدة. خلي طفلك يقيس الشوفان بالكوب ويكبّه في الطبق، وانت اهرس الموزة وهو يقلّب الخليط كله بإيده، وبعدين يكوّر العجينة كور صغيرة ويرصها على الصنية ويبطبطها براحة إيده. انت دخّلها فرن ١٨٠ درجة ربع ساعة وهو يتفرج عليها من إزاز الفرن. قوله: \"قيس بالظبط لحد ما الكوباية تتملي للآخر — انت مساعد الشيف الرسمي.\" لو التكوير صعب عليه كوّر انت وهو يبطبط بس، ولو سهل اديله تحدي يحط ٣ حبات زبيب بالظبط في كل كوكاية ويعدّهم.",[3,8]],
["مطبخ","سموذي","تحط الفاكهة وتشوف التغيّر.","15 د","بدون تجهيز","محتاج موزة وشوية فراولة أو مانجا وكوباية لبن والخلاط — من غير أي تجهيز تاني. خلي طفلك يقشر الموزة ويقطّعها بإيده ويرميها في الخلاط ويحط باقي الفاكهة واللبن، وانت اقفل الغطا كويس وخليه يدوس على الزرار وإيدك فوق إيده، ووقفوا اتفرجوا على الفاكهة وهي بتتحول لسايل. صب له في كوبايته وخليه يختار اسم للسموذي من دماغه. قوله: \"بص كويس في الخلاط — الموزة راحت فين؟ اتحولت لإيه؟\" لو عايز تزودها، اعملوا كوبايتين بلونين مختلفين واسأله يحصل إيه لو خلطناهم في كوباية واحدة وجربوا.",[3,8]],
["مطبخ","تزيين الكب كيك","تحكّم دقيق في الأصابع.","30 د","تجهيز 10 د","جهّز كب كيك جاهز أو حتى بسكوت سادة، وجبنة كريمي أو شوكولاتة بتتفرد، وأطباق صغيرة فيها زبيب وفواكه مقطعة صغيرة ومكسرات مجروشة، وسكينة زبدة. خلي طفلك يفرد الكريمة بنفسه حتى لو طلعت مش مظبوطة، وبعدين يلقّط الحبات الصغيرة بصوابعه ويرصها واحدة واحدة زي ما هو عايز. اعملوا واحدة مخصوص \"هدية\" لحد في البيت وهو اللي يروح يقدمهاله بنفسه. قوله: \"الحبة الصغيرة دي محتاجة صوابعك تمسكها بالراحة خالص — كأنك ماسك فراشة.\" لو تلقيط الحبات الصغيرة صعب عليه اديله قطع فاكهة أكبر، ولو سهل اطلب منه يعمل وش بعينين وبوق على الكب كيكة.",[3,8]],
["علوم","يطفو ولا يغرق","نتوقع الأول وبعدين نجرب.","25 د","تجهيز 5 د","املا طشت أو حوض المطبخ مياه، ولمّ ٨ حاجات من البيت: معلقة معدن، غطا بلاستيك، ليمونة، مفتاح، فلينة، لعبة صغيرة، حجر، مشبك غسيل. قبل كل حاجة اسأل طفلك \"تفتكر هتطفو ولا هتغرق؟\"، وخليه هو اللي يرميها في المياه بنفسه، وبعدين تتحط في كومة \"طفا\" أو كومة \"غرق\" على الترابيزة، وفي الآخر عدّوا كام توقع طلع صح. قوله: \"توقعك طلع غلط؟ عادي خالص — العلما بيغلطوا كتير وده اللي بيخليهم يكتشفوا.\" لو اللعبة سهلة عليه اسأله سؤال أصعب: \"نعمل إيه عشان الحاجة اللي غرقت تطفو؟\" وجربوا تركّبوها فوق الغطا البلاستيك كأنه مركب.",[3,8]],
["علوم","بركان الخل والبيكنج صودا","تفاعل بسيط بتطلبه 20 مرة.","20 د","تجهيز 5 د","حط قزازة أو كوباية صغيرة في نص صنية عميقة عشان الفورة متلخبطش، وجهّز ٣ معالق بيكنج صودا ونص كوباية خل، ولو عندك نقطة لون طعام ونقطة صابون سايل هيخلوا الرغوة أحلى. خلي طفلك يحط البيكنج صودا في القزازة بالمعلقة بنفسه، وبعدين امسك إيده وهو بيصب الخل مرة واحدة واستعد للصريخ الفرحان، وسيبه يعيد التجربة بنفسه — وجهّز خل زيادة لأنه هيقولك \"كمان مرة\" عشر مرات. قوله: \"البودرة والخل لما بيتقابلوا بيطلّعوا فقاقيع كتير — ده اسمه تفاعل.\" لو عايز تجدد اللعبة تاني يوم، اعملوا حوالين القزازة جبل من الصلصال أو ادفنها في رمل يبقى شكله بركان بجد.",[3,8]],
["علوم","الألوان بتختلط","3 أكواب مياه ملونة ونخلط.","20 د","تجهيز 5 د","جهّز ٣ كوبايات شفافة فيهم مياه وألوان طعام أحمر وأصفر وأزرق، وكام كوباية فاضية ومعلقة (أو قطارة لو عندك)، وافرش فوطة تحت الشغل. لوّنوا التلات كوبايات سوا، وقبل كل خلطة اسأل طفلك \"الأحمر مع الأصفر هيعملوا إيه؟\"، وخليه هو اللي ينقل بالمعلقة من كوبايتين لكوباية فاضية ويقلّب ويكتشف اللون الجديد، وسمّوا كل لون بيطلع: برتقاني، أخضر، بنفسجي. قوله: \"انت لسه عملت لون جديد مكانش موجود على الترابيزة — انت اللي صنعته بإيدك.\" لو اللعبة سهلة عليه اديله تحدي: \"طلعلي اللون البني\" وسيبه يجرب خلطات لوحده لحد ما يوصلها.",[3,8]],
["علوم","نزرع بذرة","فول في قطن مبلول ونتابعها.","10 د + متابعة","تجهيز 5 د","انقع كام حبة فول من المطبخ من بليل، وجهّز كوباية بلاستيك شفافة وشوية قطن ومياه. خلي طفلك يبل القطن ويرصه في الكوباية ويحط الفولة بين القطن وجدار الكوباية عشان يشوفها من برّه، وحطوها جنب الشباك. اعملوا \"موعد الفولة\" كل يوم الصبح: هو اللي يبص عليها ويقطّر مياه لو القطن نشف، وكل كام يوم ارسموا شكلها في ورقة عشان يشوف التغيير بعينه. قوله: \"الفولة دي انت المسؤول عنها — من غير رعايتك مش هتكبر.\" لو الاستنى صعب عليه، ازرعوا ٣ فولات في ٣ كوبايات واعملوها سباق مين تنبت الأول، ولما يطلع الورق انقلوها سوا في أصيص تراب.",[3,8]],
["علوم","الظلال","كشاف وحاجات والظل بيكبر ويصغّر.","20 د","بدون تجهيز","محتاج كشاف الموبايل وأوضة مضلمة وحيطة فاضية وكام لعبة — من غير تجهيز. اقفلوا النور وحطوا اللعبة بين الكشاف والحيطة، وخلي طفلك يقرّبها من النور ويشوف الظل بيكبر ويبعّدها ويشوفه بيصغر، وبعدين اديله هو الكشاف يتحكم فيه بنفسه. اعملوا حيوانات بصوابعكم على الحيطة، وخليه يقف قدام النور ويحاول \"يهرب\" من ظله. قوله: \"قرّب اللعبة من النور كمان — بص الظل بقى عملاق أكبر منك انت نفسك.\" لو حب اللعبة، لزّق ورقة كبيرة على الحيطة وثبّت انت اللعبة وخليه يرسم حوالين حدود الظل بالقلم ويلونه الصبح.",[3,8]],
["علوم","المغناطيس","إيه اللي بيلزق وإيه اللي لأ.","25 د","بدون تجهيز","هات أقوى مغناطيس على تلاجتك، وجهّز صنية فيها خليط حاجات: معلقة معدن، مشبك ورق، مفتاح، عملة معدنية، معلقة بلاستيك، فلينة، لعبة صغيرة. قبل كل حاجة خلي طفلك يتوقع \"هتلزق ولا لأ؟\" وبعدين يجرب بنفسه ويقسم الحاجات كومتين، وبعد ما يخلص اسأله \"إيه اللي شبه بعضه في كومة اللزق؟\" ووصلوا سوا إن المغناطيس بيحب المعدن. بعدها اطلقه يلف البيت يدور على حاجات تانية تلزق: الحلة، باب التلاجة، إيد الباب. قوله: \"انت دلوقتي محقق المعادن — لف البيت وارجعلي قولي المغناطيس بيحب إيه.\" لو اللعبة سهلة عليه، حط مشبك ورق فوق ورقة والمغناطيس تحتها وخليه يمشّي المشبك من غير ما يلمسه.",[3,8]],
["علوم","الوردة الملونة","وردة بيضا في مياه ملونة.","10 د + متابعة","تجهيز 5 د","جهّز وردة بيضا (أو عود كرفس لو مفيش ورد)، كوباية مياه، وألوان طعام من المطبخ. حط عشر نقط لون في المياه، وخلّي طفلك هو اللي يختار اللون ويحط الوردة في الكوباية بنفسه، واسأله الأول: تفتكر المياه هتطلع فين؟ قوله: \"الوردة بتشرب بساقها زي الشاليموه بالظبط، تعالى نبص عليها بكرة الصبح نشوف لونها اتغيّر ولا لأ\". لو النشاط سهل عليه، شق الساق نصين وحط كل نص في كوباية بلون مختلف — الوردة هتطلع نصها لون ونصها لون تاني.",[3,8]],
["علوم","الثلج بيدوب امتى","مكعب في الشمس ومكعب في الظل.","20 د","بدون تجهيز","هات مكعبين ثلج من الفريزر وحطهم في طبقين متشابهين. خلّي طفلك يحط طبق في الشمس على البلكونة أو جنب الشباك وطبق في الظل جوه الأوضة، واسأله يتوقع الأول: مين هيدوب قبل التاني؟ بصّوا عليهم كل خمس دقايق، وقوله: \"شايف؟ الشمس سخنة فالثلج بيدوب أسرع — الحرارة هي اللي بتدوّب\". لو سهل عليه زوّد طبق تالت جوه التلاجة ورتّبوا مين داب الأول والتاني والتالت، ولو زهق بسرعة اديله مكعب يمسكه في إيده ويحسه وهو بيدوب.",[3,8]],
["حركة","مسار حركة بالشريط اللاصق","خطوط ودواير ومحطة توازن.","30 د","تجهيز 5 د","كل اللي محتاجه شريط لاصق ورقي (أي شريط ميسيبش أثر على الأرض). الزق على أرض الصالة: خط طويل مستقيم، خط متعرج، دواير متباعدة، ومربع في الآخر. اشرحله المسار: يمشي على المستقيم كعب ورا صوابع، ينط جوه الدواير برجليه الاتنين مع بعض، وفي المربع يقف على رجل واحدة ويعد لخمسة. قوله: \"انت ماشي على كوبري رفيع فوق نهر، ركّز عشان متقعش!\". لو صعب عليه وسّع الدواير وسيبه يمشي عادي، ولو سهل خليه يعدّي المسار وهو شايل وسادة على راسه أو يمشيه بالعكس.",[3,7]],
["حركة","الأرض حمم","وسائد مينفعش تنزل بينها.","20 د","بدون تجهيز","انشر وسايد الكنبة والخداديات على أرض الصالة بمسافات طفلك يقدر ينطها. القاعدة واحدة: الأرض بقت حمم سخنة ومينفعش حد يلمسها، والوسايد هي الصخور الأمان. ابدأ انت الأول ونط قدامه عشان يفهم اللعبة، وبعدين قوله: \"بسرعة اطلع على الصخرة، الحمم جاية وراك!\". اللي رجله تلمس الأرض يرجع لأول المسار ويبدأ من تاني. لو سهل عليه بعّد الوسايد شوية أو شيل وسادة كل جولة، ولو صعب قرّبهم لغاية ما تبقى نطة صغيرة يقدر عليها.",[3,7]],
["حركة","بولينج بقزايز فاضية","6 قزايز وكورة ونعدّ.","25 د","تجهيز 5 د","اجمع 6 قزايز مياه بلاستيك فاضية وحط في كل واحدة شوية مياه أو رز عشان متقعش لوحدها، وهات أي كورة موجودة في البيت. صفّ القزايز على شكل مثلث في آخر الطرقة، وحدد خط بشريط لاصق يقف عنده طفلك ويدحرج الكورة على الأرض — دحرجة مش شوت. بعد كل رمية اسأله: \"وقّعت كام واحدة؟ تعالى نعدهم بصوابعنا، وفاضل كام واقفين؟\". خليه هو اللي يصفّ القزايز تاني بنفسه — ده نص اللعبة. لو صعب عليه قرّب الخط وقلل القزايز لتلاتة، ولو سهل بعّد الخط أو خليه يرمي بإيده التانية.",[3,7]],
["حركة","سباق الملعقة والكورة","توازن وتركيز وضحك.","20 د","بدون تجهيز","هات معلقتين كبار من المطبخ وحاجة صغيرة مدوّرة لكل واحد: ليمونة، كورة بينج بونج، أو بيضة بلاستيك. حددوا خط بداية وخط نهاية في الصالة، وكل واحد يمسك المعلقة بإيد واحدة والكورة فوقها ويمشي من غير ما توقع — واللي توقع منه يقف مكانه، يرجّعها، ويكمل. امشي انت بالراحة بالقصد عشان يحس إنه قادر يسبقك، وقوله: \"بصّ على المعلقة مش على رجليك، وامشي بالراحة — السلحفاة الهادية هي اللي بتكسب\". لو صعب عليه اديله معلقة أكبر أو حتة عجين متتدحرجش بدل الكورة، ولو سهل خلوها ذهاب وعودة أو لفة كاملة حوالين الترابيزة.",[3,7]],
["حركة","يوجا الحيوانات","القطة، الكلب، الشجرة.","20 د","بدون تجهيز","مش محتاج غير مساحة فاضية في الصالة وبطانية أو سجادة على الأرض. العبوها كلعبة تقليد الحيوانات: قول اسم حيوان واعمل الوضع قدامه وهو يقلّدك — القطة (على إيديه وركبه ويقوّس ضهره لفوق)، الكلب (إيديه ورجليه على الأرض ونصه مرفوع لفوق)، الشجرة (واقف على رجل واحدة وإيديه مفرودين لفوق زي الفروع). التحدي إنه يثبت في كل وضع وانتوا بتعدوا لخمسة مع بعض بصوت عالي. قوله: \"خليك شجرة عالية، جذورك متغرزة في الأرض ومحدش يقدر يهزك\". لو وضع الشجرة صعب عليه امسك إيده يتوازن بيها أو عدّوا لتلاتة بس، ولو سهل خليه هو اللي يخترع حيوان جديد وانت اللي تقلّده.",[3,7]],
["حركة","الفقاقيع","نفخ ومطاردة.","20 د","تجهيز 5 د","اعمل المحلول بنفسك: كوباية مياه + 3 معالق صابون مواعين + معلقة سكر (السكر بيخلي الفقاعة أقوى)، وهات شاليموه أو اعمل حلقة من سلك رفيع. اطلعوا البلكونة أو اقفوا في مكان سهل تمسحه: انت تنفخ وطفلك يجري يفرقع بصباعه، وبعدين اعكسوا الأدوار وخليه هو اللي ينفخ. قوله: \"استنى... سيب الفقاعة دي تطير لفوق خالص وبعدين اجري وراها!\". لو النفخ صعب عليه (بيشفط بدل ما ينفخ) دربه الأول ينفخ على إيدك المفتوحة عشان يحس بالهوا، ولو سهل اديله تحديات: يفرقع بكوعه بس أو برجله، أو يخلي فقاعة تنزل على إيده من غير ما تفرقع.",[3,7]],
["حركة","الكنز المخبّى","نخبّي 5 حاجات ونديها خيوط.","30 د","تجهيز 5 د","اختار 5 حاجات صغيرة طفلك بيحبها (عربية، مكعب، بسكوتة) وخبّيهم في أماكن مختلفة في البيت من غير ما يشوفك، وجهّزله سلة فاضية اسمها سلة الكنز. نادي عليه وقوله: \"في كنز مخبي في المكان اللي بنقعد فيه كلنا بالليل... تفتكر فين؟\"، وكل ما يقرب قوله \"سخن\" وكل ما يبعد قوله \"بارد\". كل ما يلاقي حاجة يحطها في السلة وتعدوا مع بعض: وصلنا كام من خمسة؟ لو سهل عليه خلي الخيوط أوصاف بدل أماكن (\"حاجة حمرا جنب الحاجة اللي بتبرّد الأكل\")، ولو صعب سيب طرف من الحاجة باين مش مخبية خالص. وفي الآخر اعكسوا الأدوار: هو يخبي وانت تدور — وصفه للأماكن بكلامه ده تدريب لغة من غير ما يحس.",[3,7]],
["علوم","الأصوات دي بتاعة إيه","نسجل أصوات البيت وهي تخمّن.","20 د","تجهيز 5 د","لف البيت قبلها بخمس دقايق وسجّل على موبايلك 6 أو 7 أصوات من يوم طفلك العادي: المياه من الحنفية، الخلاط، جرس الباب، باب التلاجة، مفتاح النور، رنة موبايلك. اقعدوا جنب بعض وشغّل صوت صوت وهو يخمّن، وقوله قبل أول صوت: \"ودانك هي البطل النهارده — اقفل عينيك وركّز، الصوت ده بتاع إيه؟\". كل ما يخمّن صح خدوه على المكان نفسه وخليه يطلّع الصوت بنفسه للتأكيد. لو صعب عليه اديله اختيارين (\"ده الخلاط ولا الجرس؟\")، ولو سهل سجّل أصوات من برّه البيت زي العصافير والعربيات، أو اعكسوا: هو يسجّل أصوات وانت اللي تخمّن.",[3,8]],
["بناء وحسّي","صندوق الرز الحسّي","رز ناشف + معالق وحاجات مخبية.","35 د","تجهيز 5 د","افرش ملاية قديمة على الأرض وحط عليها طشت واسع فيه 2 كيلو رز ناشف، وخبّي جواه 5 حاجات صغيرة (عربية، خرزة كبيرة، معلقة، حيوان بلاستيك، غطا برطمان) من غير ما طفلك يشوف. حط جنب الطشت معالق وأكواب وقمع لو عندك، وسيبه يغرف ويصب ويدوّر على الكنوز بإيده. قوله: \"جوه الرز في 5 كنوز مستخبية — شوف هتطلّع كام واحد؟\" لو بقى سهل عليه خليه يدوّر وهو مغمّض ويعرف الحاجة من ملمسها قبل ما يطلّعها، ولو الرز بيتكب كتير انقلوا البلكونة أو حط الطشت جوه طشت أكبر.",[3,6]],
["بناء وحسّي","مدينة الكراتين","علب وكراتين فاضية.","40 د","بدون تجهيز","اجمع علب الكرتون الفاضية من المطبخ (علب شاي، كرتونة أحذية، علب مناديل) وهات سكوتش وألوان فلوماستر وعربيات طفلك الصغيرة. اقعدوا على الأرض واسأله: المدينة محتاجة إيه؟ بيت، جامع، سوبر ماركت، جراج — وابنوا كل علبة تبقى مبنى وارسموا عليها شبابيك وأبواب، وبعدين افردوا شريط لاصق على الأرض يبقى شارع للعربيات. قوله: \"انت المهندس — قوللي نبني إيه جنب البيت؟\" لو مش عارف يبدأ، ابني انت أول بيت وسيبه يزوّد عليه، ولو النشاط سهل عليه خليه يعمل إشارات مرور من ورق ويحكي مين ساكن في كل مبنى.",[3,6]],
["بناء وحسّي","برج الكاسات","كاسات بلاستيك نبني ونهد.","25 د","بدون تجهيز","هات 15-20 كاسة بلاستيك متشابهة (بتوع الحفلات) واقعدوا على أرضية مستوية. وريله إزاي يرص صف كاسات مقلوبة جنب بعض، وبعدين يبني الدور اللي فوقه أقل بواحدة لحد ما يبقى هرم — واشتغلوا بالتبادل: كاسة منك وكاسة منه. لما البرج يخلص اديله الإذن يهدّه بكورة أو بإيده، لأن الهد ده نص المتعة ومتزعلش منه. قوله وهو بيحط: \"بالراحة... بالراحة... هنوصل للدور اللي فوق؟\" لو بقى سهل عليه، اتسابقوا مين يخلّص هرم من 6 كاسات الأول، ولو بيقع منه كتير ابدأوا بهرم صغير من 3 كاسات بس.",[3,6]],
["بناء وحسّي","العجينة","صلصال أو عجين بيتي.","30 د","تجهيز 10 د","لو مفيش صلصال جاهز اعمل عجينة بيتي في 10 دقايق: كوباية دقيق + نص كوباية ملح + معلقة زيت + مية بالتدريج لحد ما تبقى طرية مش لازقة، واقسمها قطع. اقعد جنبه واشتغل انت في قطعة وهو في قطعة، وابدأوا بالسهل: كورة، تعبان طويل، رغيف عيش — وهاتله أدوات حقيقية من المطبخ زي غطا برطمان يقطع بيه دواير وشوكة يعمل بيها خطوط. قوله: \"اعمللي تعبان أطول من بتاعي — يلا نشوف مين تعبانه أطول!\" لو النشاط سهل عليه خبّي خرزة جوه كورة عجين وخليه يفتّحها يدوّر عليها، ولو صعب اكتفوا بالفرد والتقطيع بالغطا.",[3,6]],
["بناء وحسّي","خيمة الملاءة","ملاءة على كرسيين + وسادة.","45 د","تجهيز 5 د","هات ملاية كبيرة وكرسيين حط ضهرهم لبرا وبينهم مسافة، وافرد الملاية فوقهم وثبّتها بمشابك الغسيل أو بكتب تقيلة على الكراسي، وحط جوه وسادتين وبطانية وكشاف صغير. ابنوها سوا وخليه هو اللي يقرر الوسادة فين والكشاف فين، وبعدين ادخلوا اقروا حدوتة بنور الكشاف أو كلوا سناك خفيف جوه \"البيت\". سيب الخيمة قايمة باقي اليوم لأنه هيرجعلها يلعب لوحده وده مكسب في حد ذاته. قوله وانتوا جوه: \"ده بيتنا السري — محدش يعرف مكانه غيري وغيرك.\" لو عايزها أصعب سيبه هو اللي يصمم ويجرب لحد ما تقف، ولو الضلمة بتقلقه سيبوا طرف الملاية مفتوح والنور والع.",[3,6]],
["بناء وحسّي","صب ونقل المياه","إبريق وكوبين وفوطة.","20 د","تجهيز 5 د","حط على ترابيزة صينية بحرف عالي، وفوقها إبريق صغير خفيف مليان مية لحد تلته بس، وكوبين شفافين، وفوطة مطبقة جنبهم. وريله مرة واحدة بس إزاي يمسك الإبريق بإيديه الاتنين ويصب بالراحة، وبعدين ارجع لورا وسيبه ينقل من الإبريق للكوباية ومن كوباية لكوباية زي ما هو عايز. لما المية تتكب — وهي هتتكب — متتنرفزش، ده جزء من النشاط: وريله ينشّف بالفوطة بنفسه. قوله: \"اتكبّت؟ عادي خالص — هات الفوطة ونشّفها زي الكبار.\" لو بقى سهل عليه زوّد التحدي بقمع وقزازة ضيقة يصب فيها، أو نقّط نقطة لون طعام في المية يشوفها وهي بتتنقل.",[3,6]],
["بناء وحسّي","الفوم والصابون","رغوة في حوض + أدوات.","30 د","تجهيز 5 د","حط في حوض المطبخ أو طشت على الأرض شوية مية دافية وشفطة صابون سايل أو شامبو أطفال، واضرب بمضرب البيض اليدوي لحد ما الرغوة تعلى وتبقى جبل فوم. حط جوه الفوم لعب بلاستيك وأكواب ومعالق، وسيبه يغرف ويدفن ويطلّع، أو حوّلها \"مغسلة عربيات\": كل عربياته الصغيرة تتغسل بالفوم وتتشطف في كوباية مية وتتنشف على فوطة. قوله: \"العربيات اتوسخت خالص — افتح المغسلة يا أسطى!\" لو عايز تزوّد اللعبة، اعمل كوبين فوم وحط في كل واحد نقطة لون طعام مختلفة وخليه يخلطهم بإيده ويشوف اللون الجديد.",[3,6]],
["بناء وحسّي","الخرز والمكرونة","تدخّل مكرونة في خيط بإشراف.","20 د","تجهيز 5 د","هات مكرونة قلم ناشفة وخيط سميك أو رباط جزمة، واعقد في آخره مكرونة واحدة عشان الباقي ميقعش، ولفّ الطرف التاني بسكوتش يبقى ناشف زي الإبرة — والنشاط كله قدامك على الترابيزة لأن المكرونة الناشفة متتاكلش. وريله أول واحدة إزاي تدخل في الخيط، وبعدين سيبه يكمل لوحده واحدة واحدة، ولما يخلص اعقد الطرفين وخليها \"سلسلة\" يلبسها أو يهديها لحد بيحبه. قوله: \"كل مكرونة بتدخل السلسلة بتطول — عدّ معايا، وصلنا كام؟\" لو سهل عليه لوّنوا المكرونة قبلها بالألوان وخليه يلضم بنمط (أحمر، أصفر، أحمر)، ولو صعب استبدل الخيط بماصة ناشفة أو مكرونة أوسع.",[3,6]],
["تمثيل ولغة","عيادة الدكتور","نعالج العرايس.","30 د","بدون تجهيز","التجهيز كله من البيت: دبدوب أو عروسة \"عيانة\"، مناديل أو شاش يتلف بيه، معلقة تبقى ترمومتر، ورقة وقلم للروشتة، وشنطة صغيرة تبقى شنطة الدكتور. ابدأ انت اللعبة: اخبط على \"باب العيادة\" وقول إن الدبدوب سخن وبطنه بتوجعه، وسيب طفلك يكشف عليه ويقيس الحرارة بالمعلقة ويلف الشاش ويشخبط روشتة، وبعد شوية اتبدلوا الأدوار: هو العيان وانت الدكتور. قوله: \"يا دكتور، الدبدوب سخن ومش عايز ياكل — نعمل إيه؟\" اللعبة دي كمان بتجهزه لزيارة الدكتور الحقيقية فمتستعجلش عليها. لو اللعبة بقت مكررة دخّل حالة جديدة: عيان رجله مكسورة محتاجة جبيرة من كرتونة، أو حالة طوارئ جت بالليل.",[3,7]],
["تمثيل ولغة","بقالة","علب فاضية وفلوس ورق.","35 د","تجهيز 5 د","اجمع علب فاضية حقيقية من المطبخ (علبة صلصة، كرتونة شاي، قزازة مية فاضية، كيس مكرونة) ورصّها على ترابيزة واطية تبقى المحل، وقصّوا ورق صغير يبقى فلوس، وهاتوا كيس أو شنطة تسوق. هو البقال وانت الزبون: ادخل قول \"صباح الخير، عندك إيه النهارده؟\" واشتري 3 حاجات، واسأله \"دي بكام؟\" وخليه ياخد الفلوس ويحطها في \"الدرج\" ويحط مشترياتك في الكيس، وبعدين اتبدلوا الأدوار. قوله: \"عايز أحلى علبة شاي عندك يا أسطى — بكام دي؟\" لو الحساب صعب عليه خلي كل حاجة بورقة واحدة بس، ولو سهل اديله قايمة مشتريات مرسومة يجيبلك اللي فيها بالترتيب ويحسب كل حاجة بكام ورقة.",[3,7]],
["تمثيل ولغة","مسرح العرايس","جوارب قديمة ومسرح من كرتونة.","30 د","تجهيز 10 د","هات جوربين قدام نضاف وارسم عليهم عيون وبق بقلم ماركر، وقص فتحة مستطيلة في كرتونة كبيرة وحطها على طرف الترابيزة تبقى هي المسرح. البس انت جورب وطفلك جورب، وابدأ انت الحوار: العروسة بتاعتك تسأل والعروسة بتاعته ترد، ومثّلوا حدوتة قصيرة من يومه — راح الحضانة، زعل من صاحبه وبعدين اصطلحوا. قوله: \"العروسة بتاعتي عايزة تعرف: انت عملت إيه النهارده في الحضانة؟\". لو الحوار صعب عليه، خليه الجمهور الأول ومثّل انت لوحدك دقيقتين وبعدين اديله الجورب يقلّدك، ولو سهل اطلب منه حدوتة فيها مشكلة وحل (العروسة ضيّعت لعبتها).",[3,7]],
["تمثيل ولغة","صندوق الحواديت","5 لعب في كيس وتحكي عنها.","20 د","بدون تجهيز","هات كيس قماش أو كيس مخدة وحط جواه 5 لعب صغيرة مختلفة (عربية، حيوان، معلقة، أي حاجة من البيت). خليه يسحب لعبة واحدة من غير ما يبص، وابدأ انت الحدوتة بـ\"كان فيه...\"، وكل لعبة جديدة تطلع من الكيس لازم تدخل في نفس الحدوتة، وكمّلوا بالتبادل لحد ما الخمس لعب يخلصوا. قوله: \"اسحب من غير ما تبص... طلع إيه؟ طب ده هيدخل في الحدوتة إزاي؟\". لو صعب عليه، احكي انت كل حاجة وخليه بس يسحب ويسمّي اللعبة، ولو سهل خليه هو الراوي وانت بس تسأل \"وبعدين حصل إيه؟\".",[3,7]],
["تمثيل ولغة","كتاب من عملها","نرسم ونلزق ونكتب اللي بتقوله.","40 د","تجهيز 5 د","اطوي 4 أو 5 ورقات بيضا نص ودبسهم من النص يبقوا كتاب صغير، وجهّز ألوان وصمغ وقصاصات. اسأل طفلك الكتاب هيبقى عن إيه (عن نفسه، عن حيوان، عن يومه)، سيبه يرسم كل صفحة، وبعد كل رسمة اسأله \"احكيلي إيه اللي بيحصل هنا؟\" واكتب كلامه بالحرف تحت الرسمة، وفي الآخر يرسم الغلاف واكتب اسمه عليه كمؤلف. قوله: \"انت بقيت مؤلف — قولي أكتب إيه تحت الصورة دي؟\". لو تركيزه قصير، خلي الكتاب 3 صفحات بس وكمّلوه يوم تاني، ولو سهل عليه خليه \"يقرا\" كتابه بصوت عالي للعيلة قبل النوم.",[3,7]],
["تمثيل ولغة","التليفون","علبتين وخيط ونتكلم بجمل.","20 د","تجهيز 5 د","هات علبتين زبادي فاضيين نضاف، اخرم قاع كل واحدة خرم صغير، ودخّل خيط طوله 3-4 متر واعقده من جوه في العلبتين. شد الخيط كويس بينكم — واحد يتكلم في العلبة والتاني حاططها على ودنه — وابدأ انت بسؤال بسيط واستنى إجابة بجملة كاملة، وبعدين اتبادلوا الأدوار. قوله: \"ألو؟ مين معايا؟ احكيلي أحلى حاجة حصلت النهارده.\". لو بيرد بكلمة واحدة، اديله اختيارات مضحكة (\"انت بتكلمني من البيت ولا من القمر؟\")، ولو سهل اعملوا مكالمة تمثيل: هو الدكتور وانت العيان اللي بيتصل يحجز.",[3,7]],
["تمثيل ولغة","مطعم في البيت","تاخد الطلبات وتقدّم وتحسب.","35 د","بدون تجهيز","التجهيز بسيط: ورقة وقلم يبقوا \"نوتة الطلبات\"، فوطة على دراعه زي الجرسونات، وأكل حقيقي خفيف جاهز (بسكويت، عصير، فاكهة مقطعة) وشوية فلوس ورق. اقعد انت على الترابيزة كزبون، وخليه ييجي ياخد طلبك ويرسمه في النوتة (دايرة يعني عصير، خط يعني بسكويت)، يروح \"المطبخ\" يرص الصينية، يقدّمهالك، وفي الآخر يجيبلك الحساب وتدفعله، وبعدين اعكسوا الأدوار. قوله: \"يا أسطى لو سمحت، إيه أحلى أكل عندكو النهارده؟\". لو اللعبة سهلة عليه، خلي الحساب حقيقي بأرقام صغيرة: \"البسكوتة بـ2 والعصير بـ1 — المجموع كام؟\" وخليه يعد الفلوس بإيده.",[3,7]],
["خروجة","المكتبة العامة","ركن الأطفال وجلسة الحكي.","90 د","تخطيط","قبلها بيوم دور على أقرب مكتبة عامة فيها ركن أطفال واعرف معاد جلسة الحكي من موقعهم أو بالتليفون (معظم المكتبات العامة في الإمارات فيها جلسات مجانية)، وجهّز شنطة صغيرة للكتب. أول ما توصلوا خليه هو اللي يختار 3 كتب بنفسه من الرف، اقروا واحد منهم سوا في ركن الأطفال، واحضروا جلسة الحكي لو في معادها، وقبل ما تمشوا استلفوا كتاب أو اتنين هو اللي اختارهم عشان يبقى ليه \"كتابه\" في البيت. قوله: \"انت اللي هتختار — هات الكتاب اللي غلافه عجبك وتعالى نشوف جواه إيه.\". لو مش قادر يقعد للقراءة، خليها المرادي فرجة وتقليب في الكتب براحته، والقراءة الحقيقية تبقى في البيت قبل النوم.",[3,8]],
["خروجة","الحديقة الكبيرة","بدري الصبح أو بعد المغرب.","90 د","بدون تجهيز","جهّز قزازة مياه وقبعة وسناك خفيف، واختار الوقت بدري الصبح أو بعد المغرب عشان الحر. أول نص ساعة سيبه يجري ويتسلق براحته من غير أي توجيه منك، وبعدين اعملوا \"مهمة\": لموا سوا 5 حاجات من الطبيعة (ورقة شجر، حصوة، عود) في كيس صغير، وقبل الرجوع اقعدوا على النجيلة وسمّوا سوا اللي بتشوفوه حواليكم. قوله: \"مهمتنا النهارده نلاقي 5 كنوز من الجنينة — تفتكر أول كنز هيكون إيه؟\". لو عايز تحدي أكتر، زوّد سباقات قصيرة: \"توصل للشجرة دي قبل ما أعد لعشرة؟\".",[3,8]],
["خروجة","الشط","رمل ومياه — أغنى لعب حسّي.","120 د","تخطيط","جهّز جردل ومعالق بلاستيك من المطبخ (أو أدوات رمل لو عندك)، مياه شرب، واقي شمس، وهدوم غيار، وروحوا بدري الصبح أو قبل المغرب. ابدأوا في الرمل الناشف وبعدين انتقلوا للرمل المبلول جنب المية — اعملوا سوا قلعة أو حفرة كبيرة، وخليه يملى الجردل من البحر ويرجع يصبه في الحفرة ويشوف المية بتروح فين، وسيب آخر ربع ساعة لعب حر من غير أي توجيه. قوله: \"الرمل الناشف مش بيلزق — تعالى نجرب اللي جنب المية ونشوف الفرق.\". لو خايف من الموج، اقعدوا بعيد وخليها كلها لعب رمل، وقرّبوا من المية خطوة خطوة وهو ماسك إيدك.",[3,8]],
["خروجة","ملعب داخلي مكيّف","الصبح بدري قبل الزحمة.","90 د","تذكرة","روحوا أول ما المكان يفتح الصبح قبل الزحمة، ولبّس طفلك جوارب (أغلب الأماكن بتشترطها)، وخد مياه وسناك في الشنطة. أول ما تدخلوا لفوا لفة سريعة سوا عشان يشوف كل حاجة، وبعدين سيبه يختار يبدأ منين وانت قاعد قريب بتشجع من غير ما تتدخل، وادخل العب معاه بنفسك في حاجة واحدة على الأقل زي حمام الكور، وقبل الخروج بعشر دقايق نبّهه عشان ميتفاجئش. قوله: \"فاضل آخر عشر دقايق — تحب تختمهم على إيه؟\". لو متردد من الأجهزة الكبيرة، ابدأوا بحمام الكور واطلع معاه بنفسك أول مرة على الزحليقة وبعدين سيبه لوحده.",[3,8]],
["خروجة","الأكواريوم أو حديقة الحيوان","نسمّي الحيوانات ونتكلم بعدين.","120 د","تذكرة","احجز التذاكر أونلاين وروحوا بدري، وخد مياه وسناك، وقبلها بيوم اتفرجوا سوا على صور 3 حيوانات هتشوفوها عشان يروح متحمس وعارف بيدور على إيه. جوه متحاولش تخلص كل حاجة — اختاروا 5 أو 6 أحواض أو أماكن بس، واقفوا قدام كل واحد وقت كفاية: سمّوا الحيوان ولونه وبيعمل إيه، واسأله أسئلة بتخليه يفكر. قوله: \"بص القرش بيعوم إزاي — تفتكر بينام فين بالليل؟\". وفي العربية وانتو راجعين العبوا لعبة \"افتكر\": كل واحد يقول حيوان شافه لحد ما حد يقف. لو بيخاف من الحيوانات الكبيرة، ابدأوا بالسمك الصغير والطيور وسيبه هو اللي يقرر يقرّب امتى.",[3,8]],
["خروجة","السوبر ماركت كمهمة","قايمة مرسومة و3 أصناف.","45 د","بدون تجهيز","قبل ما تنزلوا، ارسم على ورقة صغيرة 3 أصناف بسيطة (موزة، عيش، لبن) وقول لطفلك إن دي قايمته هو. في السوبر ماركت اديله الورقة وخليه هو اللي يدوّر على كل صنف، يشاور عليه، ويحطه في العربية بنفسه، وعند الكاشير خليه يناول الحاجات. قوله: \"انت النهارده المسؤول عن المشتريات، القايمة دي أمانة معاك.\" لو المهمة سهلة عليه زوّد الأصناف لخمسة، ولو بيتوه أو بيزهق خليها صنف واحد بس هو اللي يجيبه من أوله لآخره.",[3,8]],
["خروجة","زيارة أطفال","أهم من أي نشاط في القايمة.","120 د","تخطيط","التجهيز الحقيقي هو الاتفاق: كلم أهل طفل قريب من سنه (من الجيران أو العيلة أو الروضة) وحددوا معاد، وخد معاك لعبة أو اتنين من بتوعه يشاركهم. قبل ما تخرجوا قوله رايحين فين وهيقابل مين، واتفقوا على قاعدة واحدة بس: اللعب بالمشاركة. أثناء الزيارة اقعد بعيد وسيبهم يتفاهموا، ومتتدخلش غير لو في ضرب. قوله قبل ما تدخلوا: \"لو صاحبك ماسك لعبة وانت عايزها، قوله: ممكن ألعب بعدك؟\" لو طفلك خجول، ابدأ بطفل واحد بس ومدة قصيرة ساعة، وافضل قاعد جنبه أول ربع ساعة لحد ما يندمج.",[3,8]],
["حركة","بولينج القزايز","قزايز بلاستيك فاضية + كورة جوارب. صفّهم واضرب.","15 د","تجهيز دقيقتين","هات 6 قزايز مياه بلاستيك فاضية واعمل كورة من جوز جوارب ملفوفين في بعض. صفّ القزايز شكل مثلث في آخر الطرقة، والزق شريط لاصق على الأرض يبقى خط الرمي، وخليه يرمي وبعد كل رمية تعدّوا سوا اللي وقع بصوت عالي وهو اللي يصفّهم تاني. قوله: \"وقّعت كام واحدة؟ اعدّهم معايا بصوابعك.\" لو اللعبة سهلة عليه، بعّد خط الرمي أو حط شوية مياه في القزايز تتقل، ولو صعبة قرّب الخط لحد ما يكسب.",[3,7]],
["حركة","سباق البنطلون","مين يلبس الأسرع؟ بتوقيت وضحك — لبس مستقل من غير ما تحس.","10 د","من غير تجهيز","هات بنطلونه وبنطلون بتاعك وحطوهم على الأرض قدام كل واحد فيكم. قول \"استعد... يلا!\" وابدأوا تلبسوا في نفس اللحظة، وانت اتلكك بالعمد — ارميه غلط، دخّل رجليك في فتحة واحدة — علشان يسبقك وهو بيموت من الضحك. لما يخلص قوله: \"مش معقول! لبست لوحدك أسرع مني أنا الكبير!\" اللعبة دي بتعلّمه يلبس لوحده من غير ما يحس إنك بتدرّبه. لو لسه بيتلغبط خليها بالشورت الواسع الأول، ولو بقى شاطر زوّدوا تيشيرت وجزمة يبقى سباق لبس كامل.",[3,7]],
["حركة","شد الفوطة الهادي","فوطة كبيرة — شد بالتبادل مع عد بصوت عالي.","10 د","فوطة","هات فوطة كبيرة واقعدوا انتوا الاتنين على الأرض قصاد بعض، كل واحد ماسك طرف بإيديه الاتنين. اشرح القاعدة: بنشد بس واحنا بنعدّ بصوت عالي من واحد لخمسة، وعند خمسة الكل يسيب ويرتاح — العد هو الفرملة اللي بتخليها لعبة قوة من غير خناقة. ابدأ وقوله: \"شد بكل قوتك لحد ما نوصل خمسة... واحد، اتنين، تلاتة!\" وسيب نفسك تتسحب شوية علشان يحس بقوته. لو بيكسب بسهولة أوي شد انت بإيد واحدة بس وخليه يحاول أكتر، ولو العد طويل عليه قصّروه لتلاتة.",[3,7]],
["حركة","كورة التمريرات بالأسماء","تمرير كورة والواحد يسمّي حاجة (مشاعر، فواكه) مع كل تمريرة.","15 د","كورة","هات أي كورة واقعدوا على الأرض قصاد بعض ورجليكم مفتوحة علشان الكورة متهربش. اختار موضوع وقوله القاعدة: كل واحد يدحرج الكورة للتاني ويقول حاجة من الموضوع من غير ما يعيد اللي اتقال، واللي يقف نغيّر الموضوع. ابدأ انت: \"موضوعنا حيوانات... أسد! دحرج وقول انت.\" لو الموضوع صعب عليه اختار حاجات من يومه (أكل بيحبه، ناس بيحبهم)، ولو سهل جرّب موضوع المشاعر: \"حاجة بتفرّحك... حاجة بتخوّفك\" — هتسمع منه كلام مهم.",[3,7]],
["علوم","لعبة الكشّاف","أوضة مطفية وكشّاف صغير: نلاقي الحاجات اللي بنسمّيها — بتأنّس من الضلمة كمان.","15 د","من غير تجهيز","هات كشاف صغير أو استخدم كشاف الموبايل، واستنوا المغرب أو ضلّم الأوضة بالستاير. اديله هو الكشاف — هو اللي ماسك النور دي نقطة مهمة — وقوله \"لاقيلي...\" وسمّي حاجة واحدة كل مرة: سريرك، الدبدوب، الشباك، وهو يدوّر عليها بالنور ويثبّت عليها. قوله وانتوا بتلعبوا: \"شايف؟ الضلمة هي نفس أوضتك بالظبط بس من غير نور.\" لو خايف، خلي باب الأوضة مفتوح ونور جاي من بره وامسك إيده التانية، ولو مبسوط اقلبوا الأدوار: هو يسمّي وانت تدوّر.",[3,8]],
["تمثيل ولغة","لعبة المرايا","قدام المراية: اعمل وش زعلان أو فرحان أو مندهش والطفل يقلّد ويسمّي.","10 د","من غير تجهيز","اقفوا انتوا الاتنين قدام مراية الدولاب أو مراية الحمام. اعمل وش واضح ومبالغ فيه — زعلان ببق مقلوب، مندهش ببق مفتوح — وقوله يقلّد نفس الوش في المراية ويقول اسمه، وبعد كام مرة اقلبوا الأدوار: هو يعمل الوش وانت تخمّن. قوله: \"بص لوشّي كويس... أنا حاسس بإيه دلوقتي؟\" لو التسمية صعبة عليه ابدأ بوشّين بس (فرحان وزعلان) وكرّرهم، ولو سهلة اربط الوش بموقف: \"اعمل وش واحد صاحبه خد لعبته من غير إذن.\"",[3,7]],
["فن","لوحة الوشوش الأربعة","ارسموا 4 وشوش (فرحان، زعلان، غضبان، خايف) وعلّقوها — تأشير يومي على الإحساس.","20 د","ورق وألوان","هات ورقة كبيرة وألوان، واقسمها 4 مربعات. ارسموا سوا في كل مربع وش: فرحان، زعلان، غضبان، خايف — انت ارسم الدايرة الفاضية وخليه هو اللي يحط العينين والبق، واكتب تحت كل وش اسمه. علّقوا اللوحة على الثلاجة أو باب أوضته، ومن يومها بقت أداة يومية: بعد الروضة أو قبل النوم اسأله يشاور على الوش اللي زيه. قوله: \"انت دلوقتي جنب أنهي وش؟ شاورلي عليه واحكيلي حصل إيه.\" لو الرسم صعب عليه ارسم انت الوشوش كاملة وخليه يلونها بس، ولو سهل زوّدوا مربع خامس لوش مندهش.",[3,7]],
["بناء وحسّي","لعبة محتاجة اتنين","ملاية تشيلوا بيها كورة سوا من غير ما توقع — تعاون إجباري.","15 د","ملاية وكورة","هات ملاية أو فوطة كبيرة وكورة خفيفة. امسك انت طرفين وهو الطرفين التانيين، حطوا الكورة في نص الملاية، والمهمة: توصّلوها ماشيين من باب الأوضة للسرير من غير ما توقع — ولو وقعت ترجعوا تبدأوا من الأول. هنا التعاون إجباري: لو حد فيكم اتحرك لوحده الكورة بتطير. قوله: \"أنا وانت فريق واحد — لو اتحركنا مع بعض الكورة عمرها ما هتقع.\" لو صعبة امشوا خطوة صغيرة وقفة، خطوة وقفة، ولو سهلة نططوا الكورة لفوق بالملاية والقطوها تاني أو حطوا كورتين مع بعض.",[3,6]],
["حركة","المشي على الخط","مهارة: توازن · مساحة: أوضة","10 د","شريط لاصق ورقي","الزق خط طويل على الأرض بشريط لاصق ورقي، وخلي الطفل يمشي عليه كعب ورا صوابع من غير ما ينزل عنه. صعّبها بإنه يمشي ورا ضهره أو وهو شايل لعبة بإيديه الاتنين. لو نزل عن الخط يرجع لأوله تاني.",[3,5]],
["حركة","تمثال الرجل الواحدة","مهارة: توازن · مساحة: أوضة","5 د","من غير تجهيز","اقفوا قدام بعض وكل واحد يرفع رجل ويفضل ثابت، وعدّوا بصوت عالي مين يستحمل أكتر. ابن ٤ سنين طبيعي يستحمل حوالي ٥ ثواني، وابن ٥ سنين المفروض يوصل ١٠ ثواني.",[4,5]],
["حركة","توصيلة كيس الأرز","مهارة: توازن · مساحة: صالة","10 د","كيس أرز صغير مقفول كويس أو شراب متلضم","حط كيس أرز صغير أو شراب متلضم على راس الطفل وخليه يمشي من ناحية للتانية من غير ما يقع منه. لو وقع يقف مكانه ويرجّعه ويكمل. صعّبها بإنه يقعد ويقوم وهو شايله على راسه.",[4,5]],
["حركة","الحجلة في الصالة","مهارة: قفز · مساحة: صالة","15 د","شريط لاصق ورقي + شراب متلضم","ارسم خانات الحجلة على الأرض بالشريط اللاصق، وارمي شراب متلضم على رقم، والطفل ينط على رجل واحدة في الخانات ويلم الشراب وهو راجع. لو لسه مش عارف ينط على رجل واحدة، خليه ينط برجليه الاتنين في كل خانة الأول.",[4,5]],
["حركة","الأرض دي مية","مهارة: قفز · مساحة: صالة","15 د","٥-٦ خدادي أو وسادات","فرّق الخدادي على أرض الصالة وقول للطفل إن الأرض بقت بحر ومينفعش يلمسها، ولازم ينط من خدادية لخدادية لحد ما يوصل للكنبة. بعّد المسافات شوية شوية كل ما ينط بسهولة.",[3,5]],
["حركة","سباق نط الضفدعة","مهارة: قفز · مساحة: صالة","10 د","من غير تجهيز","اقعدوا القرفصاء في آخر الأوضة، وكل واحد ينط لقدام زي الضفدعة، إيديه على الأرض ورجليه ينطوا مع بعض، لحد الحيطة التانية. اعملوها سباق ومين يوصل الأول.",[3,5]],
["حركة","نط الحواجز","مهارة: قفز · مساحة: صالة","10 د","٣-٤ فوط ملفوفة أو مخدات صغيرة","لف كام فوطة وحطهم على الأرض ورا بعض بمسافات، والطفل ينط فوق كل واحدة برجليه الاتنين مع بعض. لما ينط بسهولة علّي الحاجز بمخدة صغيرة.",[3,5]],
["حركة","البولينج بالأزايز","مهارة: رمي ومسك · مساحة: بلكونة","15 د","٦ أزايز مياه فاضية + كورة طرية + شوية رز للتتقيل","رص ٦ أزايز مياه فاضية في آخر البلكونة أو الطرقة، والطفل يدحرج الكورة من بعيد يوقّعهم. حط شوية رز أو مية في قاع كل إزازة عشان تثبت، وخليه هو اللي يجري يرصّهم تاني كل مرة.",[3,5]],
["حركة","ماتش الشرابات","مهارة: رمي ومسك · مساحة: أوضة","10 د","سلة غسيل + شرابات متلضمة + شريط لاصق","حط سلة الغسيل في نص الأوضة والضم كام شراب على شكل كور، وكل واحد يرمي من ورا خط معمول بالشريط اللاصق. قرّب الخط لابن ٣ سنين وبعّده لابن ٥، واللي يجيب ١٠ في السلة الأول يكسب.",[3,5]],
["حركة","مسك الكورة بالتدريج","مهارة: رمي ومسك · مساحة: صالة","10 د","كورة طرية أو كورة قماش","ابدأ دحرج الكورة الطرية على الأرض والطفل يمسكها، وبعدين نططها له نطة واحدة، وفي الآخر ارميها له في إيديه على طول. ابن ٣ سنين طبيعي يمسكها بدراعاته وصدره، وابن ٥ المفروض يمسكها بإيديه بس.",[3,5]],
["حركة","التصويب على الدواير","مهارة: رمي ومسك · مساحة: بلكونة","15 د","شريط لاصق ورقي + أكياس أرز صغيرة أو شرابات متلضمة","الزق على الأرض ٣ دواير بالشريط اللاصق، القريبة بنقطة والبعيدة بـ٣ نقط، والطفل يرمي عليها أكياس أرز صغيرة أو شرابات متلضمة. اللي يجمع ١٠ نقط الأول يكسب. تنفع في البلكونة أو الصالة.",[3,5]],
["حركة","أحمر.. أخضر","مهارة: جري وتوقف · مساحة: صالة","10 د","من غير تجهيز","اقف في آخر الصالة وضهرك للطفل، لما تقول أخضر يجري ناحيتك، ولما تقول أحمر وتلف لازم يقف ساكت خالص. اللي يتحرك بعد كلمة أحمر يرجع لخط البداية، واللي يلمسك ياخد دورك.",[3,5]],
["حركة","التجمد بالتسقيفة","مهارة: جري وتوقف · مساحة: صالة","10 د","من غير خامات (أو صفارة لو موجودة)","الطفل ينط ويجري في المكان زي ما هو عايز، ولما تسقّف تسقيفة واحدة (أو تضرب صفارة) يتجمد مكانه زي التمثال لحد التسقيفة اللي بعدها. اللي يتحرك وهو متجمد يعمل ٣ نطات ضفدعة ويرجع يلعب.",[3,5]],
["حركة","قال الكابتن","مهارة: جري وتوقف · مساحة: أوضة","10 د","من غير تجهيز","قول أوامر حركية بسرعة: قال الكابتن انط، قال الكابتن اجري في مكانك، قال الكابتن اقف على رجل واحدة. لو قلت الأمر من غير كلمة قال الكابتن ونفّذه، تبقى عليه نقطة. مع ابن ٣ سنين العبها أوامر بس من غير الخدعة.",[4,5]],
["حركة","سباق مشية الدب","مهارة: قوة · مساحة: صالة","10 د","من غير تجهيز","امشوا على الإيدين والرجلين والمؤخرة لفوق زي الدب من أول الصالة لآخرها، واعملوها سباق بينكم. المشية دي بتقوي الكتف والدراعات وعضلات البطن.",[3,5]],
["حركة","مشية الكابوريا","مهارة: قوة · مساحة: صالة","10 د","من غير خامات (لعبة خفيفة للتصعيب)","اقعد على الأرض، ارفع بطنك لفوق، وامشي على إيديك ورجليك زي الكابوريا. اعملوا سباق قصير، وصعّبها بإنك تحط لعبة خفيفة على بطنه يوصّلها للناحية التانية من غير ما تقع.",[4,5]],
["حركة","الكاروتة","مهارة: قوة · مساحة: صالة","5 د","من غير تجهيز","الطفل يحط إيديه على الأرض، وانت شيل رجليه من عند الفخدين، وخليه يمشي على إيديه مسافة قصيرة. امسك دايما من الفخدين مش من القدمين لأنها أسهل وأأمن للصغيرين، ووقف اللعبة فورا لو لقيت ضهره بيتقوس لتحت.",[4,5]],
["حركة","سباق السلة التقيلة","مهارة: قوة · مساحة: صالة","10 د","سلة غسيل + كتب أو ألعاب تقيلة","حط شوية كتب أو ألعاب تقيلة في سلة الغسيل، والطفل يزقها من أول الصالة لآخرها وبعدين يشدها راجع. الزق والشد التقيل ده بيقوي عضلات الجسم كله وبيهدّي الطفل لما تكون طاقته فايرة.",[3,5]],
["حركة","مسار العوائق الكبير","مهارة: تناسق · مساحة: صالة","20 د","كرسيين + مخدات + شريط لاصق + سلة غسيل + شرابات","اعمل مسار في الصالة: يزحف تحت كرسيين جنب بعض زي النفق، ينط فوق مخدة، يمشي على خط شريط لاصق، ويخلّص بحدفة شراب في سلة الغسيل. وقّت له وخليه يحاول يكسر رقمه، وغيّر ترتيب المحطات كل مرة عشان ميزهقش.",[3,5]],
["حركة","تنس البالونة","مهارة: تناسق · مساحة: صالة","15 د","بالونة (وممكن طبق كرتون + خشبة أكل كمضرب)","انفخ بالونة والعبوا مين يخليها في الهوا أطول وقت من غير ما تنزل الأرض، بضربها براحة الإيد. مع ابن ٤ و٥ سنين اعمل مضرب من طبق كرتون ملزوق في خشبة أكل وخليه يضربها بيه. اللعبة لازم تكون قدامك، ولو البالونة فرقعت شيل قطعها فورا لأنها خطر بلع.",[3,5]]

{"t":"ضربني","group":"سلوك مؤذي","why":"في سن 3-5 الجزء المسؤول عن كبح الاندفاع في المخ (القشرة الجبهية) لسه في أول البناء، فالغضب بيوصل للجسم قبل ما يوصل للكلام — الإيد بتتحرك قبل ما الجملة تتكوّن. وكونه بيضربك أنت بالذات مش قلة احترام: أنت أأمن شخص عنده، فبيفرّغ عندك اللي مش قادر يفرّغه في حتة تانية. ده تفريغ إحباط من طفل لسه مش قادر يترجم انفعاله لكلام، مش عدوان مقصود ولا تحدي لسلطتك.","now":[{"d":"امسك إيده من الرسغ بحزم هادي — من غير شدة ومن غير زعيق — عشان توقف الضربة الجاية جسديًا قبل أي كلام. الحماية أول خطوة، مش الشرح.","say":"«مش هسمح لإيدك تضربني.»"},{"d":"انزل لمستوى عينه وقول الحد في جملة واحدة قصيرة بصوت واطي وهادي — الصوت الواطي وقت الغضب بيوصل أسرع من العالي، والجملة الطويلة بتضيع.","say":"«الضرب بيوجع. أنا مش بضربك، ومش بتضرب.»"},{"d":"سمّي الإحساس اللي ورا الضربة بدل ما تحاكم الفعل — التسمية بتنقل الانفعال من الجسم للكلام، وده هو التدريب الحقيقي.","say":"«أنت غضبان جدًا عشان قفلت التابلت. الغضب مسموح، الضرب لأ.»"},{"d":"لو كرر المحاولة، ابعد جسمك خطوة مع الحفاظ على وجودك جنبه — أنت بتبعد عن الضرب، مش عنه هو.","say":"«أنا جنبك، ولما إيدك تهدى هقرّب تاني.»"}],"after":"بعد ما يهدى تمامًا — ممكن بعد ساعة أو حتى تاني يوم — ارجعوا للموقف باختصار: «إمبارح إيدك ضربت. لما تغضب تقدر تقول: أنا غضبان! أو تخبط على المخدة». ومثّلوها فعليًا كلعبة: هو يعمل وش غضبان ويقول الجملة، وأنت تستجيب فورًا: «شكرًا إنك قلتها بصوتك». التمرين وقت الهدوء هو اللي بيبني المسار البديل في مخه — مش الكلام وقت النوبة.","mistake":"إنك تضربه «عشان يحس باللي بيعمله» أو تمسك إيده وتضربه بيها. ده بيعلّمه قاعدة واحدة بس: الأقوى من حقه يضرب. والدراسات على مدى عقود ثابتة إن العقاب البدني بيزوّد العدوان والكدب والخوف، ومبيعلّمش ضبط النفس أبدًا — بيعلّم الطفل يستخبى مش يتحكم في نفسه.","schools":"<b>سيجل:</b> وقت الضربة المخ الانفعالي هو المسيطر — اتّصل الأول (انزل لمستواه، صوت هادي) وبعدين وجّه، لأن التعلّم مش بيحصل وقت الانفجار. <b>فابر ومازليش:</b> اعترف بالإحساس وامنع الفعل في نفس الجملة: «الغضب مسموح، الضرب لأ». <b>السلوكية:</b> نفس الرد الهادي كل مرة بلا استثناء — الاتساق هو اللي بيطفي السلوك، مش شدة رد الفعل.","prevent":"لاحظ إيه اللي بيسبق الضرب غالبًا — قفل شاشة؟ جوع؟ إرهاق آخر اليوم؟ — وجهّز له: إنذار قبل قفل الشاشة بخمس دقايق، وسناك قبل ساعة الانفجار المعتادة. وفي وقت الهدوء العبوا «لعبة الغضب»: بنعمل وش غضبان، بنقول «أنا غضبان!» بصوت عالي، بنخبط المخدة — التكرار كلعبة بيخلي البديل جاهز في إيده وقت ما يحتاجه.","vals":["ضبط الغضب","تسمية المشاعر"]},
{"t":"ضرب طفل تاني","group":"سلوك مؤذي","why":"في السن ده اللغة أبطأ من الانفعال: الخلاف على لعبة بيولّع الاندفاع قبل ما يلاقي الكلمة، فالجسم بيحل المشكلة بدل اللسان. كمان القدرة على تخيّل إحساس الطرف التاني (نظرية العقل) لسه بتتكوّن — هو مش حاسب بجد إن التاني بيتوجع زيه. يعني الضرب هنا نقص مهارة (تفاوض، انتظار دور، استلاف)، مش قسوة ولا سوء تربية.","now":[{"d":"اتحرك للطفل المضروب الأول واطمّن عليه قدام طفلك — دي رسالة صامتة قوية: الأذى مش بيجيب أضواء، والمتأذي هو اللي بياخد الاهتمام.","say":"«أنت كويس؟ آسفين إن ده حصل.»"},{"d":"ارجع لطفلك وشيله من الموقف بهدوء تام — من غير خطبة قدام الأطفال، لأن الإحراج العلني بيخليه يدافع عن نفسه بدل ما يفكر في اللي عمله.","say":"«الضرب بيوجع. هنقعد جنب بعض شوية لحد ما نهدى.»"},{"d":"بعد ما يهدى بدقيقة أو اتنين، سمّي المشكلة الأصلية اللي ورا الضربة وافتح باب الحل بداله — من غير توبيخ.","say":"«أنت كنت عايز العربية وهو كان واخدها. إيه اللي ينفع نعمله غير الضرب؟»"}],"after":"الإصلاح بفعل قبل الكلمة: يروح يشوف الطفل التاني محتاج إيه — يجيب له تلج، يساعده يبني البرج اللي وقع، يرجّع له لعبته. ولما الفعل يخلص، «آسف» بتيجي طبيعية وبمعناها. الترتيب ده مقصود: الفعل بيعلّم الندم الحقيقي، والكلمة بالعافية بتعلّم تمثيل الاعتذار. وبعدها بيوم، اتمرنوا في البيت على جملة التفاوض: «ألعب بيها بعدك؟» — قولها أنت وهو يردها، لحد ما تبقى جاهزة على لسانه.","mistake":"الخطبة الطويلة قدام الأطفال، وإجباره يقول «آسف» في نفس الثانية بالعافية. الاعتذار المُجبَر بيطلع أداء شكلي فاضي من أي ندم، والإحراج العلني بينقل كل تركيزه من «أنا عملت إيه؟» إلى «أنا اتفضحت» — فبيتعلم يستخبى مش يصلّح.","schools":"<b>أدلر/التربية الإيجابية:</b> إصلاح الخطأ بدل العقاب — الطفل اللي بيصلّح بيتعلم مسؤولية، واللي بيتعاقب بيتعلم يداري. <b>روس جرين:</b> اسأل «إيه المهارة الناقصة؟» — غالبًا التفاوض على الدور أو استلاف اللعبة، ودي بتتدرّب وقت الهدوء مش وقت الخناقة. <b>سيجل:</b> الاهتمام بالمضروب الأول مش بس عدل — ده بيقطع دايرة «الضرب بيجيب انتباه» من جذرها.","prevent":"قبل أي لعب مع أطفال، راجع الاتفاق معاه في جملتين وانتم على الباب: «لو حد واخد حاجة عايزها، بنقول: بعدك؟ أو بننده لبابا/ماما». وراقب ظروف ما قبل الانفجار — زحمة لعب على حتة واحدة، جوع، آخر ساعة قبل النوم — وتدخّل بدري بتقسيم الأدوار أو لعبة تانية. منع الظرف أسهل بكتير من إصلاح الضربة.","vals":["حل الخلاف بالكلام","المشاركة والدور","الاعتذار وإصلاح الخطأ"]},
{"t":"عناد ورفض مستمر","group":"انفعالات ومشاعر","why":"بين 2 و4 سنين فيه مهمة تطورية اسمها بناء الاستقلال: الطفل بيكتشف إنه شخص منفصل عنك وإن كلمته ليها أثر في العالم، و«لأ» هي إعلان الاكتشاف ده — مش تحدي ليك. وكل ما إحساسه بالسيطرة على يومه بيقل، كل ما بيحارب على حاجات أتفه: العناد بيبقى في ذروته لما كل القرارات نازلة من فوق. يعني الرفض المستمر مؤشر جوع للاستقلال، مش عيب في الطفل ولا فيك.","now":[{"d":"قبل ما ترد على الرفض، اسأل نفسك ثانية واحدة: الموضوع ده فعلًا مهم، ولا معركة رمزية؟ لو مش مهم، انزل عنها بوعي وبقرار — مش استسلام.","say":"«ماشي، دي أنت اللي بتقرر فيها.»"},{"d":"في الحاجات اللي لازم تحصل، متسألش سؤال إجابته ممكن تكون «لأ» — اعرض اختيارين أنت موافق على الاتنين، فيحس بالسيطرة وأنت واصل للي عايزه.","say":"«هنلبس دلوقتي — التيشيرت الأحمر ولا الأزرق؟»"},{"d":"الحدود القليلة غير القابلة للتفاوض (الأمان، النوم، كرسي العربية) قولها كحقيقة ثابتة هادية مش كطلب، وكررها بنفس الجملة من غير دخول في نقاش.","say":"«حزام الكرسي بيتقفل دايمًا. تقفله أنت ولا أقفله أنا؟»"}],"after":"بعد يوم مليان «لأ»، متقفلش اليوم بمحاضرة. في وقت هادي وصف له سلطته الحقيقية: «أنت النهارده اخترت لبسك، واخترت السناك بتاعك — أنت بتقرر حاجات كتير». الوصف ده بيشبع جوعه للسيطرة بشكل صحي، فخناقة بكرة بتقل. ولو رفض النهارده اتحوّل لنوبة كاملة، اتعامل مع النوبة الأول (هدوء ووجود)، وارجع للاختيارات بعد ما يعدّي.","mistake":"الدخول في صراع سلطة على كل «لأ» — «هتعملها يعني هتعملها». صراع السلطة مفيش فيه كسبان: لو غلبته اتعلم إن إرادته ملهاش قيمة، ولو غلبك اتعلم إن العناد بينفع. والأسوأ من الاتنين: إنك تتنازل وقت الصراخ بالذات — ساعتها بيتعلم إن الصوت العالي هو مفتاح التنازلات.","schools":"<b>أدلر:</b> العناد المتكرر غالبًا صراع سلطة — والحل مش إنك تكسبه، الحل إنك تخرج منه بإديه سلطة حقيقية في حاجات آمنة. <b>مونتيسوري:</b> «ساعدني أعمله بنفسي» — استقلال حقيقي يومي (يصب ميته، يلبس نفسه، يشيل طبقه) بيغني عن المعارك الرمزية. <b>روس جرين:</b> لو الرفض بيتكرر على نفس الموقف بالذات، فيه مشكلة غير محلولة — اقعدوا وقت الهدوء واسأله: «إيه الصعب في لبس الجزمة؟»","prevent":"قسّم يومه عمليًا: حوالي 80% من القرارات الصغيرة ليه (اللبس من اختيارين، ترتيب أكل الفطار، أي كتاب قبل النوم)، و20% قرارات ثابتة معروفة غير قابلة للتفاوض. والثبات على القليل أهم من التشدد في الكتير: الطفل اللي حاسس بسيطرة كافية على يومه مش محتاج يعلن حرب على كل حاجة — العناد بيقل لما الاستقلال بيزيد، مش لما الضغط بيزيد.","vals":["الاستقلال","الاختيار وتحمّل النتيجة","تنظيم الوقت البسيط"]},
{"t":"نوبة غضب في مكان عام","group":"أماكن عامة وخروجات","why":"النوبة مش ابتزاز ولا قلة أدب — دي انهيار تنظيم انفعالي: جهازه العصبي اتحمّل فوق طاقته وفقد القدرة على التنظيم، زي كوباية فاضت مش زي مفاوض بيساوم. والمولات بيئة مثالية للانهيار: إضاءة وصوت وزحمة وتكييف ومشي طويل ومواعيد — كل ده بيستنفد قدرة مخ صغير لسه بيتعلم ينظم نفسه. وإحساسك أنت بعيون الناس بيخليك تتصرف للجمهور بدل طفلك — ودي أخطر نقطة في الموقف كله.","now":[{"d":"أول قرار جواك: أنا بتصرف لطفلي مش للناس اللي بتتفرج. خد نفس، ولو الموقف سمح شيله بهدوء لركن أهدى — ممر جانبي أو العربية. تغيير المكان مش عقاب، ده تقليل مثيرات.","say":"«أنا شايلك لمكان أهدى. أنا معاك.»"},{"d":"قلل كلامك لأقصى درجة — المخ وقت النوبة مش بيستقبل منطق، والكلام الكتير وقود إضافي. جملة واحدة قصيرة بتتكرر بنفس النبرة الهادية.","say":"«أنا هنا. لما تخلص أنا جنبك.»"},{"d":"استنى الموجة تعدي — النوبة ليها قوس: بتعلى وبتنزل لوحدها خلال دقايق لو محدش غذّاها بانفعال أو تفاوض. وجودك الهادي الصامت هو دورك، مش إسكاته.","say":"«شايفك بتهدى. أنا حاسس بيك.»"},{"d":"لو النوبة سببها طلب اترفض (لعبة، حلوى)، افصل بين التعاطف والقرار: تعاطف كامل مع الإحساس، وثبات كامل على الحد — مهما علا الصوت.","say":"«فاهمك إنك عايزها أوي. والإجابة برضه لأ.»"}],"after":"بعد ما يهدى تمامًا: حضن قصير وجملة بسيطة — «كانت صعبة عليك، تعبت» — من غير محاضرة ومن غير «شفت عملت إيه قدام الناس؟»، لأن التخجيل بعد النوبة بيعلّمه إن مشاعره عيب، مش إنها ممكن تتنظم. وفي البيت بعدها بيوم، احكوا الحكاية بهدوء: «فاكر لما زعلنا في المول؟ إيه اللي كان ممكن يساعدك؟» — إعادة حكي الموقف وقت الأمان هي اللي بتبني التنظيم للمرة الجاية.","mistake":"الاستسلام في نص النوبة وشراء اللي كنت رافضه — درس واحد واضح: النوبة بتشتغل، وهتتكرر أقوى وأطول المرة الجاية. والغلطة التانية التهديد بالسيبان: «هسيبك وأمشي» — ده بيضيف رعب الهجر فوق الانهيار، فالنوبة بتطول وثقته في إنك أمانه بتتخدش.","schools":"<b>سيجل:</b> وقت الانهيار المخ الانفعالي مسيطر بالكامل — مفيش تعلّم ولا منطق بيحصل، فوظيفتك تهدئة مش تدريس، والكلام كله بييجي بعدين. <b>فابر ومازليش:</b> صدّق الرغبة من غير ما تحققها — «فاهمك إنك عايزها» بتنزّل التوتر من غير أي تنازل. <b>السلوكية:</b> اللي بيحدد تكرار النوبات مش اللي بتقوله خلالها، اللي بيحصل بعدها: لو جابت نتيجة بتتكرر، ولو عدّت بلا مكسب بتقل.","prevent":"الخروجة الناجحة بتتصمم قبلها: متخرجش وقت القيلولة ولا على معدة فاضية، وخد سناك ومية دايمًا في الشنطة. وقبل ما تدخلوا قول التوقعات في جملتين واضحتين: «هنشتري أكل بس، مش هنشتري لعب النهارده — تحب تمسك اللستة؟». وإديله دور حقيقي جوه المحل — يحط الحاجات في العربية، يشيّك على اللستة — الطفل المشغول بمهمة نادرًا ما بينهار.","vals":["ضبط الغضب","الصبر والانتظار","تسمية المشاعر"]},
{"t":"بيقول كلام وحش","group":"سلوك مؤذي","why":"في سن 3-5 الطفل بيكتشف قوة الكلمات زي ما بيكتشف أي أداة جديدة: بيجرب كلمة فيلاقي وش ماما اتغيّر أو الكل ضحك — ردة الفعل القوية دي هي الجايزة اللي بتخلي الكلمة تتكرر. غالبًا هو مش فاهم معنى الكلمة أصلًا، هو فاهم مفعولها. فالكلمة عنده تجربة صوتية بتجيب انتباه مضمون، مش قلة أدب مقصودة.","now":[{"d":"ثبّت وشك وصوتك — أي ضحك أو صدمة أو زعيق بيدّي الكلمة قوة ويضمن تكرارها. خد نفس واتكلم بنبرة عادية خالص وجملة واحدة قصيرة.","say":"الكلمة دي بتوجع الناس، إحنا في بيتنا مش بنقولها."},{"d":"متخليهوش يكررها ومتسألش «انت قلت إيه؟» — التكرار تثبيت. اديله البديل فورًا في نفس اللحظة، خصوصًا لو الكلمة طلعت وهو متنرفز.","say":"لو انت غضبان قول: أنا غضبان أوي!"},{"d":"اقفل الموضوع في 10 ثواني وكمّلوا اللي كنتوا فيه عادي — الوقفة الطويلة عند الكلمة هي نفسها انتباه بيثبّتها.","say":"خلاص، تعالى نكمّل اللي كنا بنعمله."}],"after":"في وقت هادي في نفس اليوم العبوا «لعبة الكلمات»: إيه الكلمات اللي بتفرّح الناس وإيه اللي بتوجعهم — واتفقوا على كلمة تفريغ مضحكة بتاعتكم انتو الاتنين (زي «باطاطس!») يقولها لما يتنرفز بدل الكلمة الوحشة. ولما تسمعه بيصحح نفسه، سمّيها له وصفًا: «سمعتك غيّرت الكلمة — ده اسمه حفظ اللسان.»","mistake":"التذبذب: الضحك أول مرة والزعيق تاني مرة — ده أقوى تثبيت ممكن لأن الكلمة بقت مضمونة النتيجة: يا هتضحّك يا هتولّع. والانفعال الشديد أو العقاب القاسي بيربط الكلمة بالخوف مش بالفهم، فبيبطل يقولها قدامك بس، وبيقولها في الحضانة وبعيد عنك.","schools":"<b>السلوكية:</b> السلوك اللي هدفه الانتباه بيموت بالتجاهل المخطط لردة الفعل مع تعليم بديل بياخد نفس الانتباه. <b>فابر ومازليش:</b> اعترف بالإحساس اللي ورا الكلمة («انت غضبان») وارفض الكلمة نفسها — الاتنين مع بعض. <b>سيجل:</b> وقت الانفعال مخه مش بيستقبل محاضرة — جملة واحدة قصيرة دلوقتي، والتعليم الحقيقي بعدين في الهدوء.","prevent":"دوّر على مصدر الكلمة وقفله: كارتون؟ يوتيوب؟ حد في البيت بيقولها وهو مضغوط؟ الطفل مرآة — لو الكلمة بتتقال حواليه هتفضل ترجع مهما عملت. واملى قاموسه بكلمات مشاعر كتير في الأيام العادية (غضبان، مضايق، مخنوق، متضايق) — اللي عنده كلام كفاية لإحساسه نادرًا ما يحتاج الكلام الوحش.","vals":["حفظ اللسان","أدب الكلام مع الكبير","تسمية المشاعر"]},
{"t":"بيكذب","group":"سلوك مؤذي","why":"قبل 5 سنين الحد الفاصل بين الخيال والحقيقة لسه بيتبني — «القطة هي اللي كسرت الكوباية» ممكن تكون قصة حقيقية في دماغه مش كذبة مقصودة. والنوع التاني من الكذب دفاع بدائي: مخه اتعلم إن الاعتراف بيجيب زعيق، فبينكر عشان يحمي نفسه مش عشان يضحك عليك. الكذب في السن ده علامة ذكاء اجتماعي بينمو، مش انحراف أخلاقي.","now":[{"d":"لو انت شايف الحقيقة بعينك متعملش سؤال فخ انت عارف إجابته («انت اللي كسرتها؟») — السؤال ده دعوة مفتوحة للكذب. قول الملاحظة كأنها خبر محايد.","say":"أنا شايف الكوباية اتكسرت والمية على الأرض."},{"d":"حوّل فورًا من «مين عمل؟» لـ«نعمل إيه؟» — خليه شريك في الحل مش متهم في محاكمة. لما مفيش قاضي، مفيش داعي للإنكار.","say":"تعالى نجيب الفوطة ونصلّح ده سوا."},{"d":"لو اعترف — حتى بعد إنكار — ثبّت الاعتراف الأول قبل أي كلمة عن الغلطة نفسها. اللحظة دي هي اللي بتحدد هيصدق معاك المرة الجاية ولا لأ.","say":"انت قلتلي الحقيقة — ودي حاجة صعبة وشجاعة."}],"after":"بعد الهدوء احكيله قاعدة البيت وانت قريب منه: «في بيتنا اللي يقول الحقيقة بنساعده، مش بنزعقله» — والتزم بيها فعلًا في أول موقف جاي عشان الكلمة تتصدق. والقصص أقوى من المواعظ: في وقت محايد مالوش علاقة بأي غلطة، احكوا قصص عن الصدق وإن النبي ﷺ كان اسمه «الصادق الأمين» قبل ما يبقى نبي.","mistake":"العقاب على الاعتراف: بيعترف إنه كسر فتعاقبه على الكسر — الدرس اللي وصله: «الصدق غبي، المرة الجاية أكدب أحسن». والوصمة («انت كداب») بتحوّل الفعل لهوية، والطفل بيعيش الهوية اللي بنسميهاله — فبيكدب أكتر لأنه هو كده.","schools":"<b>فابر ومازليش:</b> بلاش أسئلة انت عارف إجابتها — قول اللي شايفه وافتح باب الحل. <b>أدلر:</b> الطفل بيكدب لما تكلفة الحقيقة أعلى من تكلفة الكذب — مهمتك تنزّل تكلفة الحقيقة مش ترفع تكلفة الكذب. <b>سيجل:</b> الخلط بين الخيال والواقع طبيعي في مخ السن ده — فرّق له بين «حكاية حلوة من خيالك» و«اللي حصل بجد» من غير إدانة.","prevent":"خلّي الاعتراف دايمًا أرخص من الإنكار: كل مرة يعترف تكون النتيجة إصلاح هادي مش انفجار — دي المعادلة الوحيدة اللي بتبني الصدق. واحكي انت عن غلطاتك قدامه عادي («أنا نسيت المفتاح النهارده، هحط له مكان ثابت») — الطفل اللي شايف أبوه بيعترف بيتعلم إن الغلط مش فضيحة. وقلل الأسئلة الاختبارية في يومه عمومًا.","vals":["الصدق","الاعتذار وإصلاح الخطأ"]},
{"t":"بيتشبّط بحاجة في المحل","group":"أماكن عامة وخروجات","why":"السوبر ماركت مصمم بفلوس كتير عشان يغلب الكبار نفسهم — فما بالك بمخ 3-5 سنين قشرته الجبهية (مركز الفرملة وتأجيل الرغبة) لسه في أول تكوينها. اللعب والحلويات متحطوطة قصدًا على مستوى نظره بالظبط، والرغبة عنده إحساس جسدي فوري مش قرار بيتراجع فيه. التشبيط مش قلة أدب — ده اصطدام رغبة قوية بجهاز فرملة لسه صغير.","now":[{"d":"انزل لمستواه واعترف بالرغبة بحماس حقيقي قبل أي «لأ» — الاعتراف بيفرّغ نص الشحنة، ومش معناه الموافقة.","say":"واو، عربية حلوة فعلًا! عاجباك أوي، صح؟"},{"d":"فكّره بالاتفاق اللي اتقال قبل باب المحل، بنبرة حنينة مش منتصرة.","say":"فاكر اتفاقنا؟ النهارده جايين نشتري الأكل، مش لعب."},{"d":"حوّلها لـ«قايمة الرغبات» — طلّع موبايلك وصوّر الحاجة قدامه فعلًا، مش وعد في الهوا.","say":"تعالى نصوّرها ونحطها في قايمة أحلامك، ونتكلم عنها في البيت."},{"d":"لو صرخ برضه متتراجعش ومتدخلش في مفاوضة — كمّل مشوارك وهو معاك وصوتك هادي. الثبات الهادي هو الرسالة.","say":"أنا شايفك زعلان، وإحنا مكملين مشوارنا."}],"after":"في البيت افتحوا قايمة الرغبات واتكلموا عن الصورة — كتير هتكتشفوا إنه نسيها أصلًا، ودي أهم معلومة توصله: الرغبة بتعدي. ولو فضلت معاه، تتحط كفكرة هدية للعيد أو عيد ميلاده — الانتظار لمناسبة مش حرمان، ده تدريب. ولما يستحمل، سمّيها له وصفًا: «كنت عايز العربية واستحملت وسبناها — ده اسمه صبر.»","mistake":"الشراء عشان يسكت — خصوصًا في نص الصريخ — أغلى درس غلط ممكن تشتريه: «الصوت العالي في المحل بيجيب لعب». مرة واحدة كفاية إن المعركة تتكرر كل خروجة لأسابيع. والتذبذب (مرة أيوه ومرة لأ على حسب مزاجك أو مين شايفكم) أسوأ من اللين الثابت، لأنه بيخليه يجرب حظه كل مرة.","schools":"<b>فابر ومازليش:</b> «نفسك فيها أوي، صح؟» بتنزّل التوتر من غير شراء — وممكن تديهاله بالخيال: «يا ريت معانا فلوس نشتري الرف كله!». <b>السلوكية:</b> سلوكه في المحل النهارده هو نتيجة آخر مرة بالظبط — الاتساق أهم من الشدة. <b>أدلر:</b> الاتفاق المسبق بيحوّل الموقف من صراع بينك وبينه لالتزام مشترك انتو الاتنين جواه.","prevent":"القاعدة تتقال قبل باب المحل مش جواه، وبصوت هو اللي يعيدها: «داخلين نشتري إيه النهارده؟». ادخل بيه شبعان ومش تعبان — نص معارك المحلات سببها جوع أو إرهاق مش لعب. واديله دور جوه المحل: «انت مسؤول تلاقيلي الموز» — الطفل المشغول بمهمة مش فاضي يتشبّط.","vals":["القناعة: أحتاج ولا أريد","الصبر والانتظار"]},
{"t":"مش عايز يسيب اللعب","group":"الروتين اليومي","why":"اللعب بالنسبة له مش تسلية — ده شغله الحقيقي وأعمق حالة تركيز بيوصلها في يومه. لما تقطعه فجأة، ده عند مخه فقدان سيطرة مفاجئ، زي حد يقفلك شغل مهم في نصه بالظبط. ومفهوم الوقت نفسه («كمان 5 دقايق») لسه مجرّد عنده — هو محتاج يشوف الوقت بعينه مش يسمعه.","now":[{"d":"قرّب منه والمس كتفه واستنى يبصلك قبل ما تتكلم — النداء من أوضة تانية مش بيتحسب. وبعدين اديله إنذار بحاجة يشوفها: تايمر رملي أو تايمر ظاهر.","say":"لما الرملة تخلص في الساعة دي، وقت اللعب بيخلص — بصلها كل شوية."},{"d":"في آخر دقيقة اديله مهمة إنهاء بدل أمر توقف — «خلّص آخر حاجة» أسهل على مخه بكتير من «بطّل دلوقتي». وخليه هو صاحب آخر خطوة.","say":"آخر برج وبعده بنقفل — وانت اللي هتطفي التايمر بنفسك."},{"d":"اربط اللي بعد اللعب بحاجة ليها لازمة وامشي في اتجاهها فعلًا وانت بتتكلم — الجسم اللي اتحرك بيسحب الطفل معاه أكتر من الكلام.","say":"العربيات هتستنى في الجراج بتاعها، وإحنا رايحين نعمل العشا سوا."}],"after":"لو اتنرفز برضه وعدّت، بعد الهدوء سمّي اللي حصل من غير لوم: «كان صعب تسيب المكعبات وانت في نصها — أنا فاهم.» وابنوا سوا «ركن الشغل المفتوح»: مكان صغير يسيب فيه اللي بيبنيه من غير ما حد يلمّه، عشان يتعلم إن السيبان مش خسارة — بكرة بيكمّل من حيث وقف.","mistake":"الإنهاء المفاجئ («يلا قوم دلوقتي») بيضمنلك مقاومة، والتفاوض اللانهائي («طيب كمان 5... طيب آخر 5 بجد») بيعلّمه إن الإنذار مش حقيقي وإن الزن بيمدد الوقت. الاتنين بيخلوا الانتقال الجاي أصعب من اللي قبله.","schools":"<b>مونتيسوري:</b> التركيز مقدّس — لو ينفع تستنى دقيقتين يخلّص الدورة اللي في إيده، استنى، ده مش تدليع ده احترام للشغل. <b>السلوكية:</b> نفس الإشارة ونفس التسلسل كل مرة — التايمر والأغنية بيبقوا هما «الآمر» بدالك، فالمعركة الشخصية معاك بتختفي. <b>سيجل:</b> المخ بينتقل أسهل لما يعرف الجاي — سؤال «إيه اللي بعد اللعب؟» بيجهّز مخه للحركة قبل جسمه.","prevent":"خلّي كل انتقال ثابت في اليوم (أكل، حمام، نوم) ليه طقس ثابت حرفيًا: نفس الأغنية أو نفس الجملة كل يوم — الروتين بيقلل المقاومة أكتر من أي إقناع. وقلل عدد الانتقالات نفسها: يوم فيه 10 مقاطعات هيجيب 10 معارك، فخطط بلوكات لعب أطول وأقل عددًا. والتايمر خليه أداة يومية مألوفة، مش سلاح بيطلع وقت الأزمة بس.","vals":["الروتين والأمان","تقبّل التغيير والمرونة"]},
{"t":"رفض النوم","group":"الروتين اليومي","why":"مقاومة النوم في سن 3-5 نادرًا ما تكون عناد. الطفل في السن ده بيبدأ يفهم إن النوم فراق: انفصال عنك وعن اليوم واللعب، فبيقاومه زي ما بيقاوم أي وداع. ومخه لسه مش بيعرف ينتقل لوحده من التنشيط للهدوء — الجزء المسؤول عن التنظيم الذاتي لسه بيتبني — فمحتاج «سلم نزول» خارجي هو الروتين. ولو اليوم كان فيه شاشة متأخرة أو لعب مثير قبل السرير، هرمونات التنبيه بتفضل عالية فبيبقى تعبان ومنفوخ في نفس الوقت.","now":[{"d":"قبل الروتين بساعة: نور خافت، شاشة مقفولة، وإعلان مسبق بدل المفاجأة — الانتقال المعلن أسهل من الانتقال المفاجئ.","say":"«بعد ما نلم اللعب، هنعمل حمام وقصة وننام — زي كل يوم»"},{"d":"نفّذ الروتين بنفس الترتيب حرفيًا (حمام، بيجاما، أسنان، قصة، دعاء)، وحط جواه قرارات صغيرة بإيده هو عشان يحس بملكية مش استسلام.","say":"«أنت اللي تختار: قصة الأسد ولا قصة القمر؟»"},{"d":"لما يقوم من السرير أو ينده — الرجوع الهادي المتكرر: رجّعه من غير مناقشة ومن غير انفعال، بنفس الجملة بالظبط كل مرة مهما اتكررت.","say":"«وقت النوم. أنا جنبك، وهشوفك الصبح»"},{"d":"لو السبب خوف مش مقاومة: صدّق الإحساس بدل ما تنفيه، واديه أداة تحكم في إيده هو.","say":"«الضلمة صعبة ساعات. النور الصغير ده بتاعك، أنت اللي بتولّعه»"}],"after":"الصبح، اوصف اللي نجح مش اللي فشل: «امبارح خلصنا القصة ونمت في سريرك لوحدك — ده اسمه اعتمدت على نفسك». ولو الليلة كانت صعبة، اشتغلوا عليها بالنهار مش بالليل: ارسموا مع بعض «خريطة النوم» — صور خطوات الروتين بالترتيب معلقة جنب السرير، وهو اللي يأشّر على كل خطوة خلصها. الخوف من الضلمة برضه بيتحل بالنهار: ارسموا اللي بيخوفه وخلوه مضحك.","mistake":"التفاوض أو الزعيق أو الاستسلام إنه ينام قدام التلفزيون — التلاتة بيعلّموه إن المقاومة بتكسب وقت إضافي، فبتزيد بكرة. وأخطر منهم التهديد («لو مقمتش من السرير هزعل منك») لأنه بيربط السرير نفسه بالخوف والوحدة، فبيقاوم النوم أكتر مش أقل.","schools":"<b>سيجل:</b> الانتقال للنوم محتاج تهدئة الجزء السفلي من المخ الأول — الروتين الحسي (حمام دافي، نور خافت، صوت واطي) هو اللي بينزّل التنشيط، مش الأوامر والمواعظ. <b>السلوكية:</b> الرجوع الهادي المتسق بنفس الجملة كل مرة بيطفي سلوك القيام من السرير لأنه بطّل يجيب انتباه أو مكسب. <b>مونتيسوري:</b> خليه شريك في الروتين مش متلقي — هو اللي يجيب البيجاما ويختار القصة ويطفي النور، الملكية بتقلل المقاومة.","prevent":"التعب الزيادة عدو النوم مش صديقه: حركة كتير بالنهار (خصوصًا برّه)، قيلولة متأخرة تتلغي أو تتقدم، وميعاد نوم ثابت حتى في الويك إند — فرق ساعة بيبان على الأسبوع كله. وآخر ساعة قبل السرير «منطقة هدوء» ثابتة: بلا شاشات وبلا لعب مثير، نفس التسلسل كل ليلة لحد ما جسمه هو اللي يبدأ ينعس من أول خطوة في الروتين.","vals":["الروتين والأمان","أذكار اليوم: النوم والحمام والعطاس"]},
{"t":"الصراع على الشاشة","group":"الروتين اليومي","why":"الشاشة مصممة عشان توقف صعبة: كل حلقة بتسلم للي بعدها، والتحفيز في مخه بيفضل عالي طول المشاهدة. لما تقفلها، الطفل مش «بيتدلع» — ده هبوط فعلي في التحفيز، ومخه في السن ده لسه مش قادر ينظم الهبوط ده لوحده فبينفجر. يعني المعركة مش معركة إرادة بينك وبينه، دي معركة تصميم — والحل في نظام ثابت مش في اللوم ولا في قوة إرادته.","now":[{"d":"القاعدة تتقال قبل الفتح مش عند القفل، وبالعدد مش بالدقايق — العدد ملموس والطفل يقدر يعده، الوقت مجرد بالنسبة له.","say":"«حلقتين. لما التانية تخلص، التابلت بينام»"},{"d":"إنذار قبل النهاية — النهاية المعلنة أسهل من النهاية المفاجئة.","say":"«دي آخر حلقة — بعدها بنقفل»"},{"d":"خلي القفل بإيده هو مش بإيدك: هو اللي يدوس زرار القفل أو يحط التابلت في «مكان نومه». اللي بيقفل بإيده بيتدرب على تحكم، اللي بيتخطف منه بيتدرب على مقاومة.","say":"«أنت اللي بتقفله — دوس أنت»"},{"d":"لو انهار عند القفل: تعاطف مع الحد من غير ما تفتح تاني — الاتنين مع بعض مش واحدة منهم.","say":"«صعب نقفل حاجة بنحبها. القاعدة زي ما هي، وأنا جنبك»"}],"after":"بعد ما يهدى، اوصف اللحظة اللي نجح فيها حتى لو صغيرة: «أنت اللي قفلت التابلت بإيدك — ده صعب وعملته». وقبل المرة الجاية، اسأله قبل الفتح: «هنعمل إيه بعد ما نقفل؟» وخليه يختار النشاط اللي بعد الشاشة — لما يبقى فيه «بعد» واضح ومحبوب، القفل بيبقى أسهل بكتير، لأن معظم انهيارات القفل سببها الفراغ اللي بعده مش الشاشة نفسها.","mistake":"استخدام الشاشة كمكافأة («لو سمعت الكلام هديك التابلت») أو عقاب («هشيله أسبوع») — الاتنين بيرفعوا قيمتها في دماغه وبيحولوها لعملة صراع يومية. وكمان «خمس دقايق كمان» تحت ضغط الزن: تنازل واحد بيعلّمه إن الانهيار بيشتري وقت، وبيضمنلك معركة أكبر بكرة.","schools":"<b>السلوكية:</b> القاعدة الثابتة — نفس العدد، نفس الميعاد، نفس طقس القفل — بتلغي التفاوض اليومي، لأن المحاولات بتنطفي لما بتبطل تجيب نتيجة. <b>سيجل:</b> الانهيار عند القفل هبوط تحفيز حقيقي مش تمثيل — اتّصل الأول بتعاطف وقرب جسدي، وبعدين ثبّت الحد. <b>مونتيسوري:</b> اللي بينهي النشاط بإيده بيبني إرادة، اللي بيتنهي عنه بيبني عناد.","prevent":"الشاشة في ميعاد ثابت من اليوم (بعد الغدا مثلًا) مش «عند الطلب» — لما تبقى جزء من الروتين بيبطل يطلبها طول اليوم لأنه عارف ميعادها. وجهّز النشاط اللي بعدها قبل ما تبدأ (خروج، عجينة، مساعدة في المطبخ) عشان الفراغ ميستقبلوش. وراقب نفسك: موبايلك في إيدك طول الوقت بيهد أي قاعدة بتقولها بلسانك.","vals":["الصبر والانتظار","احترام القواعد"]},
{"t":"العض","group":"سلوك مؤذي","why":"العض في السن ده نادرًا ما يكون عدوان مقصود — ده غالبًا تفريغ لضغط حسي أو إحباط أكبر من لغته، أو دفاع عن لعبة ومساحة، وساعات حاجة حسية في الفك نفسه أو تسنين. الطفل في اللحظة دي مش «اختار» يعض: مسار «أنا متضايق ← أقول بكلام» لسه بيتبني، ومسار «أنا متضايق ← جسمي يتصرف» أسرع منه بكتير، فالسنان بتوصل قبل الكلمة.","now":[{"d":"أوقف بجسمك مش بصوتك: افصل بينه وبين المعضوض بهدوء وحزم، من غير شد ولا زعيق.","say":"«مش هسمح بالعض»"},{"d":"روح للمعضوض الأول واهتم بيه قدامه — ده بيعلّمه إن المتألم هو الأولوية، وبيمنع إن العض يبقى طريقة مضمونة لجذب انتباهك.","say":"«آسف إن ده حصل — تعالى نشوف إيدك ونحط عليها مية باردة»"},{"d":"ارجعله بجملة واحدة قصيرة بلا خطبة، ومتسألوش «ليه عضيت؟» — مش هيعرف يجاوب. اديله البديل في نفس الجملة.","say":"«الأسنان بتوجع. لما تغضب قول: سيبني!»"},{"d":"لو لسه مشحون، وجّهه لتفريغ حسي بديل بدل ما تطلب منه كلام هو مش قادر عليه دلوقتي.","say":"«تعالى نضغط العجينة دي بإيدينا سوا»"}],"after":"بعد الهدوء، إصلاح بفعل مش بإجبار على «قول آسف»: يجيب كمادة أو تلج للمعضوض، يرسمله رسمة، يسأله «كويس دلوقتي؟» — الإصلاح بالفعل بيبني ندم حقيقي، والاعتذار المحفوظ بالعافية بيبني تمثيل. وفي وقت هادي تاني خالص، اعملوا تمثيل بالعرايس: العروسة اتخانقت على اللعبة — تقول إيه؟ «سيبني!» ولا تعض؟ التمرين وقت الهدوء هو اللي بيحضر وقت الضغط.","mistake":"العض المضاد «عشان يحس بالوجع» — ده مش تعليم، ده أذى، ورسالته الفعلية إن الأقوى من حقه يعض. والغلطة التانية وصمه («أنت عضاض») — الوصف المتكرر بيتحول لهوية، والطفل بيعيش الاسم اللي بنسميهوله بدل ما يتغير.","schools":"<b>روس جرين:</b> العض ليه ظرف بيسبقه دايمًا — دوّر على النمط (زحمة؟ لعبة اتخطفت؟ جوع؟) وحل الظرف نفسه بدل ما تعاقب نتيجته. <b>سيجل:</b> لحظة العض المخ في وضع انفعالي بحت ومفيش أي تعلم بيحصل فيها — التهدئة الأول، والكلمتين بعدين. <b>السلوكية:</b> الاهتمام الفوري بالمعضوض مش بالعاضّ بيشيل أي مكسب انتباه من السلوك — والاتساق في ده كل مرة أنفع من أي عقاب.","prevent":"العض بيحصل في ظروف بتتكرر — سجّل أسبوع واحد: بيحصل امتى وفين ومع مين؟ هتلاقي نمط واضح (قبل الغدا، في الزحمة، مع طفل معين على لعبة معينة). امنع الظرف نفسه: سناك قبل اللعب الجماعي، مساحة أوسع، نسختين من اللعبة المتخانق عليها. ولو الحاجة حسية فعلًا — بيعض حتى وهو مبسوط — وفّرله بدايل مشروعة للمضغ (خضار مقرمش، لعبة مطاطية): الحاجة الحسية متتمنعش، بتتوجّه.","vals":["ضبط الغضب","تسمية المشاعر"]},
{"t":"الصراخ والزن المستمر","group":"انفعالات ومشاعر","why":"الزن سلوك متعلّم بامتياز: نفع مرة واحدة — طلب عادي اتجاهل وزنّة جابت استجابة — فالمخ سجّل «الصوت ده بيوصل». وبيزيد لما خزان الانتباه فاضي أو الطفل جعان وتعبان: يعني ساعات كتير الزن رسالته الحقيقية «أنا محتاجك» مش «أنا عايز الحاجة دي». ومهم تعرف إن الطفل مش بيسمع صوته زي ما انت بتسمعه — هو فعلًا مش واخد باله إنه بيزن.","now":[{"d":"انزل لمستواه وقول المطلوب بهدوء تام — من غير ما تنفذ الطلب ومن غير ما تعلق على الزن نفسه.","say":"«أنا عايز أسمعك. قولها بصوتك العادي»"},{"d":"قولها مرة واحدة بس وبعدين استنى في صمت هادي — تكرارها عشر مرات بيحولها لخلفية صوتية ملهاش معنى. لو طوّل، فكّره مرة واحدة بس.","say":"«أنا مستنيك — أول ما تقولها بصوتك العادي أنا معاك»"},{"d":"أول ما صوته العادي يظهر — حتى نص جملة — استجب فورًا وبوضوح، عشان يربط: الصوت العادي هو اللي بيوصل.","say":"«أهو! قلتها بصوتك العادي وسمعتك على طول — تعالى نشوف»"},{"d":"لو الطلب نفسه مرفوض، افصل بين الصوت والإجابة: امدح الطريقة وارفض الطلب — الاتنين مع بعض.","say":"«سمعتك كويس. الإجابة لأ، وأنا فاهم إن ده مضايقك»"}],"after":"في وقت هادي، اعملوا لعبة «الصوتين»: قول جملة بصوت زنان مبالغ فيه وخليه يضحك، وبعدين نفس الجملة بصوت عادي — وسيبه يجرب هو الاتنين. اللعبة دي بتديله الوعي بصوته اللي هو أصلًا مش واخد باله منه. وخلال اليوم، اوصف النجاح لما يحصل فعلًا: «طلبت المية بصوتك العادي وجت على طول — شفت إزاي وصلت بسرعة؟»","mistake":"الاستجابة بعد الزن — حتى مرة واحدة من كل عشرة — دي أقوى طريقة تثبيت ليه، لأن المكافأة المتقطعة بتثبت السلوك أكتر من الدايمة (زي ماكينة القمار بالظبط). والغلطة التانية الزعيق «بطّل زن!» — ده انتباه قوي للزن نفسه، والطفل اللي جعان انتباه بياخد الزعيق ويحسبه مكسب.","schools":"<b>السلوكية:</b> المعادلة لازم تكون كاملة: الزن مبيجبش حاجة أبدًا + الصوت العادي بيجيب استجابة فورية — التجاهل لوحده من غير تعزيز البديل بيولّد تصعيد مش هدوء. <b>فابر:</b> اعترف بالرغبة حتى وأنت رافضها — «نفسك في العصير أوي، صعب إنه مفيش» بتنزّل التوتر اللي الزن بيتغذى عليه. <b>أدلر:</b> الزن غالبًا طلب انتماء وانتباه بطريقة غلط — املأ الاحتياج في وقت تاني والطلب الملحّ هيقل لوحده.","prevent":"الوقاية الحقيقية اسمها «الخزان المليان»: 10-15 دقيقة انتباه ممتلئ يوميًا — انت وهو بس، هو اللي يختار اللعبة، الموبايل بعيد — بتقلل الزن أكتر من أي أسلوب رد. وراقب توقيتاته: معظمه ساعة الجوع والتعب ولحظة انشغالك (مكالمة، مطبخ) — قبل ما تنشغل جهّزله نشاط محدد وقوله: «أنا مشغول لحد ما المؤقت يرن، وبعدها أنا ليك أنت بس».","vals":["أدب الكلام مع الكبير","طلب المساعدة"]},
{"t":"الغيرة من أخ أو أخت","group":"اجتماعي وإخوات","why":"الغيرة مش علامة تربية غلط — دي رد فعل طبيعي لإحساس الطفل إن أهم مورد في حياته، اللي هو انتباهك انت، بقى مقسوم على اتنين. في سن 3-5 الطفل بيقيس قيمته بمقدار الوقت والحضن اللي بياخده، فأي اهتمام بأخوه مخه بيترجمه فورًا «أنا بقيت أقل أهمية». والمقارنة حتى لو بنية التشجيع بتحوّل الأخ من شريك لمنافس دائم.","now":[{"d":"لما تظهر الغيرة — شد لعبة، زقة، أو جملة «انت بتحبه أكتر» — سمّي الإحساس بدل ما تنفيه أو تستنكره. التسمية نفسها بتنزّل حرارته.","say":"انت زعلان عشان شايفني بشيل أخوك كتير، صح؟"},{"d":"متقارنش ومتحققش مين غلطان في اللحظة. حوّله من متهم لشريك مهم — اديله دور حقيقي جنبك.","say":"تعالى ساعدني — امسكلي الحاجة دي، وانت اللي هتختار بيجامة أخوك"},{"d":"لو فيه إيذاء جسدي لأخوه، افصل الاتنين بهدوء وامنع الفعل من غير وصمة ولا خطبة.","say":"مش هسمح حد يتأذى — وانا شايف إنك مضايق، تعالى معايا نتكلم"}],"after":"في نفس اليوم اقعد معاه 10 دقايق لوحدكم من غير أخوه، وسمّيها باسمه: «وقت فلان». اتفرجوا على صوره وهو رضيع واحكيله إزاي كنت شايله وبتسهر معاه بنفس الطريقة. ووقت الهدوء قوله الجملة اللي بتريّح: «ساعات بنحب حد وبنغير منه في نفس الوقت — ده طبيعي وبيحصل للكبار كمان».","mistake":"«انت الكبير، لازم تتنازل» — الجملة دي بتخلي وجود الأخ الصغير ضريبة بيدفعها، فبتزرع ضغينة هتطلع في شكل زق وعض من ورا ضهرك. والمقارنة («شوف أخوك أشطر») بتغذي نفس المنافسة اللي انت بتحاول تطفيها.","schools":"<b>فابر ومازليش</b> (كتاب «الإخوة بلا غيرة»): الإحساس السلبي تجاه الأخ لما يتسمّى ويتسمع بيعدي، ولما يتحرّم بيتخزن ويطلع سلوك. <b>أدلر</b>: كل طفل بيدوّر على مكانته المميزة في العيلة — اديله دور حقيقي مش لقب «الكبير». <b>سيجل</b>: سمّيها تروّضها — تسمية الإحساس بتهدّي العاصفة في مخه.","prevent":"وقت خاص يومي ثابت 10-15 دقيقة لكل طفل لوحده، باسمه، وهو اللي بيختار اللعبة — ده أقوى لقاح ضد الغيرة وأقوى من أي كلام عن العدل. وزّع أدوار الاهتمام بالصغير عليه كامتياز مش كواجب («انت بس اللي بتعرف تضحكه»). وامسح جملة «انت الكبير» من قاموس البيت نهائيًا.","vals":["الغيرة بين الإخوات","العدل والإنصاف","التعاطف","تسمية المشاعر"]},
{"t":"رفض الأكل","group":"الروتين اليومي","why":"بين 2 و4 سنين الشهية بتقل طبيعيًا لأن معدل النمو بيهدى، وبيظهر خوف فطري من الأكل الجديد اسمه النيوفوبيا — دي حماية تطورية مش دلع. والأكل من أوايل الساحات اللي الطفل بيكتشف إن ليه فيها سيطرة كاملة: تقدر تحط الطبق قدامه، لكن مستحيل تدخله بؤه غصب عنه — وكل ضغط منك بيحوّل الأكل من استجابة للجوع لمعركة إرادات هو كاسبها مقدمًا.","now":[{"d":"قسّم المسؤولية وثبّتها: انت بتقرر إيه وامتى وفين، وهو بيقرر ياكل ولا لأ وقد إيه. قدّم الوجبة وفيها صنف واحد على الأقل بيحبه، من غير طبق خاص ليه.","say":"ده أكلنا النهارده — كل اللي نفسك فيه"},{"d":"لو رفض، متعلقش ومتفاوضش ومتلحقهوش بالمعلقة. كمّل انت أكلك عادي قدامه — هو بيتعلم من بؤك انت مش من كلامك.","say":"مش جعان؟ ماشي — الأكلة الجاية على العشا"},{"d":"في نهاية الوقت شيل الطبق بلا دراما وبلا عقاب وبلا عرض بدائل.","say":"خلصنا يا حبيبي — هنشوفك على الوجبة الجاية"}],"after":"بعيد عن السفرة خالص، خليه شريك في الأكل: يغسل الخضار، يقلّب، يرص الطبق — الطفل اللي لمس الأكلة وشمّها بيقرب منها. وقدّم الصنف المرفوض تاني بعد كام يوم بشكل مختلف ومن غير أي تعليق: الصنف الجديد ممكن يحتاج 10-15 عرض قبل القبول، واللمس والشم في حد ذاتهم خطوة نجاح حقيقية تستاهل ملاحظة.","mistake":"الملاحقة بالمعلقة والرشوة («كل الخضار عشان تاخد الشوكولاتة») — الصفقة دي بترفع قيمة الحلو وبتخفض قيمة الخضار في دماغه، وبتعلمه إن الأكل تفاوض مش استجابة لجوعه. وطبخ وجبة بديلة كل مرة يرفض بيعلّمه إن الرفض بيجيب منيو.","schools":"<b>مونتيسوري</b>: شراكة حقيقية — يحضّر ويقدّم ويسكب لنفسه بأدوات على مقاسه؛ الاستقلال في الأكل بيفتح الشهية أكتر من أي إقناع. <b>أدلر</b>: السفرة أشهر ساحة صراع سلطة — انسحب من المعركة والرفض بيفقد وظيفته. <b>السلوكية</b>: اسحب الانتباه كله من لحظة الرفض (لا زعل ولا تعليق)، وخلّيه للحظات الأكل والتجربة.","prevent":"مواعيد أكل ثابتة — 3 وجبات وسناكين — من غير رعي مفتوح طول اليوم: الجوع الحقيقي أحسن فاتح شهية. اقفل العصاير واللبن بين الوجبات لأنها بتملا المعدة في السكوت. وكلوا مع بعض قد ما تقدروا — هو بياكل زي ما بيشوفك بتاكل، مش زي ما بتقوله.","vals":["الأكل الصحي كاختيار","الاستقلال","آداب الأكل والشرب"]},
{"t":"الخوف من الظلام والوحوش","group":"انفعالات ومشاعر","why":"بين 3 و5 سنين الخيال بينفجر — وده مكسب تطوري عظيم للعب والحكي — لكن الفلتر اللي بيفرق بين المتخيَّل والحقيقي لسه ضعيف: الوحش اللي مخه بيتخيله جسمه بيتعامل معاه كخطر حقيقي، بنبض أسرع وعرق فعلي. فخوفه مش تمثيل ومش دلع، ده إحساس خطر حقيقي عنده — وإنكاره بجملة «مفيش حاجة» بيسيبه لوحده مع الخوف.","now":[{"d":"صدّق الإحساس من غير ما تصدّق الوحش. انزل لمستواه وطمّنه بجسمك وحضنك قبل كلامك.","say":"انت خايف بجد — الخوف صعب، وانا هنا معاك"},{"d":"حط أداة سيطرة في إيده هو: كشاف صغير بيفتحه ويقفله بنفسه، أو نور نوم خافت هو اللي اختاره.","say":"ده كشافك انت — انت اللي بتتحكم في النور"},{"d":"لو طلب، اعملوا جولة فحص سريعة بجدية وبلا سخرية، وبعدها اقفل الموضوع بروتين النوم المعتاد من غير إطالة.","say":"بصينا سوا تحت السرير وورا الدولاب — الأوضة أوضتك، وانا جنبك برّه"}],"after":"الشغل الحقيقي على الخوف بيحصل بالنهار مش بالليل: ارسموا الوحش وخليه هو اللي يقرر شكله ويضيفله طرطور ونضارة مضحكة — لما الوحش ينتقل من مخه للورقة بيصغر. واحكوا حكاية إمبارح: «خفت، وبعدين عملنا إيه؟ وبعدين نمت إزاي؟» — إعادة الحكي بتنظم الذاكرة وبتفرغ شحنتها. وثبّتوا دعاء وأذكار النوم كطقس دفء بيختم اليوم: «ربنا معانا وبيحبنا» — طمأنينة، مش سلاح ضد الوحوش ولا تخويف.","mistake":"«مفيش وحوش، بطّل كلام فارغ» أو السخرية — الإنكار بيعلّمه إن إحساسه غلط، ومش هيوقف الخوف، هيوقف بس إنه يحكيلك عنه. وأسوأ منه استخدام الخوف نفسه للضبط: «هجيب لك العفريت لو ما نمتش» — ده بيبني مخزن رعب هتدفع تمنه سنين.","schools":"<b>سيجل</b>: حكي القصة بيوصّل نص المخ الشمال (اللغة والترتيب) بالنص اليمين (الصورة والانفعال) فشحنة الخوف بتقل — «سمّيها تروّضها». <b>فابر ومازليش</b>: اعترف بالإحساس حتى لو مش مقتنع بسببه — «انت خايف» مش معناها «فيه وحش فعلًا». <b>مونتيسوري</b>: أدوات سيطرة حقيقية في إيده — كشافه ونوره — بتنقله من ضحية الخوف لصاحب القرار.","prevent":"راقب المدخلات: مشهد كرتون واحد مخيف ممكن يشتغل في مخه أسابيع — راجع اللي بيتفرج عليه وخصوصًا قبل النوم. روتين نوم ثابت بنفس الترتيب كل ليلة — نور خافت، قصة هادية، أذكار النوم — لأن التوقع بيقتل القلق. وبالنهار العبوا لعبة «حقيقي ولا تمثيل؟» على شخصيات الكرتون عشان عضلة التفرقة تقوى.","vals":["تسمية المشاعر","الشجاعة وتجربة الجديد","أذكار اليوم: النوم والحمام والعطاس","الروتين والأمان"]},
{"t":"الخجل والانسحاب","group":"اجتماعي وإخوات","why":"التحفظ الاجتماعي مزاج فطري عند حوالي طفل من كل خمسة، مش عيب ولا نقص ثقة: جهازه العصبي بياخد وقت أطول في فحص الجديد قبل ما يحكم إنه آمن. والطفل الحذر ده بيتعلم بالمراقبة — وقوفه على الجنب مش وقت ضايع، ده جمع معلومات قبل الدخول. المشكلة الحقيقية بتبدأ لما الوصف يتحول لهوية: كل مرة يسمع «هو خجول» قدام الناس، بيصدقها وبيعيش الدور.","now":[{"d":"لو حد سأل قدامه «هو خجول ولا إيه؟» ردّ انت بوصف مؤقت إيجابي من غير لصق تسمية.","say":"هو بياخد وقته الأول — وبعدين بيلعب جامد"},{"d":"متزقهوش وسط الأطفال. خليك جنبه قاعدة آمنة، وحوّل المراقبة لمهمة ليها قيمة.","say":"خلينا نتفرج شوية سوا — وريني مين بيلعب إيه"},{"d":"لما تحس إنه اتأقلم، افتحله باب صغير: طفل واحد ونشاط محدد، وسيبه هو اللي ياخد الخطوة.","say":"الولد ده بيبني برج — تحب ناخدله المكعبات دي؟"}],"after":"بعد الخروجة وصّفله اللي حصل بالتفاصيل مش بالمدح العام: «انت راقبت الأول، وبعدين قعدت جنب الولد، وبعدين لعبتوا سوا» — الوصف ده بيبنيله خريطة نجاح يمشي عليها المرة الجاية. ودرّبوا في البيت باللعب بالعرايس على جملة دخول واحدة: «أنا اسمي فلان — ممكن ألعب معاكم؟» وبدّلوا الأدوار عشان يجرّبها وهو مرتاح.","mistake":"الدفع القسري قدام الناس («روح العب معاهم، متبقاش خجول!») — الضغط بيرفع التوتر، والتوتر بيزوّد الانسحاب، فبتوصل لعكس اللي عايزه بالظبط. والاعتذار عنه للناس («معلش هو كده خجول») بيلزق فيه اللقب وبيديله كمان مبرر جاهز يستخبى وراه.","schools":"<b>فابر ومازليش</b>: حرّر الطفل من الدور الملزوق فيه — اوصف اللحظات اللي كسر فيها الصورة («انت سلمت على عمو لوحدك») بدل ما تكرر اللقب. <b>أدلر</b>: الشجاعة بتتبني بالتشجيع على المحاولة مش بالحكم على النتيجة — قعدته جنب المجموعة محاولة تستاهل ملاحظة. <b>مونتيسوري</b>: المراقبة مرحلة تعلم مشروعة — الطفل اللي بيتفرج بيتعلم قبل ما يشارك.","prevent":"جهّزه قبل أي خروجة اجتماعية بمعاينة: مين هيكون موجود، وإيه اللي هيحصل، وهنقعد قد إيه — المعلومات المسبقة بتقلل مجهود الفحص اللي مخه بيعمله. اوصلوا بدري لما المكان لسه فاضي: الدخول على 3 أطفال أسهل بكتير من اقتحام 15. وخلّي اللقاء المتكرر مع نفس الطفل عادة — صداقة واحدة عميقة بتبني ثقة أكتر من عشر تجمعات غريبة.","vals":["الشجاعة وتجربة الجديد","تكوين الصداقات والانضمام للعب","الثقة بالمحاولة"]},
{"t":"مش بيشارك لعبه","group":"اجتماعي وإخوات","why":"قبل 4-5 سنين الطفل بيلعب «جنب» الأطفال مش «معاهم» — اللعب المتوازي مرحلة نمو طبيعية مش أنانية. ومفهوم الملكية عنده لسه بيتكوّن: اللعبة بالنسبة له امتداد لنفسه مش حاجة خارجية، فلما حد ياخدها بيحس إن حتة منه اتخطفت. المشاركة الحقيقية بتطلع من الأمان على الملكية، مش من الإجبار عليها.","now":[{"d":"انزل لمستواه وثبّت له حقه الأول قبل أي طلب — الاعتراف بالملكية هو اللي بيرخّي القبضة، مش الضغط عليها.","say":"«دي لعبتك انت، ومحدش هياخدها منك.»"},{"d":"حوّل «شارك» الغامضة لنظام دور ملموس بتايمر أو ساعة رملية — الدور حاجة يشوفها ويلمسها، المشاركة مفهوم مجرد أكبر من سنه.","say":"«هنلعب بالدور: خمس دقايق ليك، ولما التايمر يرن يبقى دور عمر، وبعدين ترجعلك تاني.»"},{"d":"لو رفض حتى الدور على لعبة غالية عليه، احترم الرفض من غير خطبة، ووجّه الطفل التاني لبديل.","say":"«هو مش جاهز يسلّف العربية دلوقتي. تعالى يا عمر نشوف المكعبات لحد ما ييجي دورك.»"},{"d":"لما يسلّم اللعبة بنفسه — حتى متأخر — صِف الفعل وأثره بدل المدح العام.","say":"«انت خلّصت دورك وإديت العربية لعمر — بص هو مبسوط إزاي.»"}],"after":"بعد ما الضيوف يمشوا، احكوا اللي حصل كقصة قصيرة بلا لوم: «كان صعب عليك تسيب لعبتك، وبعدين عملنا دور ونجحت». ولو كان هو اللي خطف لعبة غيره، الإصلاح بفعل: يرجّعها بإيده ويسأل صاحبها «تحب تلعب بإيه؟». وفي وقت هادي مثّلوا الدور بالعرايس — «دلوقتي دور الأرنب... خلص، دور القطة» — المهارة بتتبني بعيد عن ضغط الموقف.","mistake":"إنك تشيل اللعبة من إيده بالعافية وتديها للطفل التاني عشان «يتعلم الكرم» أو عشان الإحراج قدام أهله — ده بيعلّمه إن ملكيته مش محترمة وإن الكبير ممكن ياخد حاجته في أي لحظة، فبيتشبّث أكتر وبيبدأ يخبّي لعبه. الكرم بيطلع من الأمان، مش من الخوف.","schools":"<b>مونتيسوري:</b> الدور المنظم بأداة ملموسة (تايمر، رملية) بيحترم شغل الطفل ودورته — «شارك» أمر مجرد، أما «استنى دورك» مهارة بتتعلم. <b>أدلر:</b> الاحترام المتبادل: حقه في لعبته محترم بنفس قدر حق الضيف في اللعب — مفيش طرف بينكسر. <b>سيجل:</b> التشبث لحظة انفعال مش قرار — اتّصل بإحساسه («صعب تسيبها») قبل ما توجّه.","prevent":"قبل أي زيارة، خبّوا مع بعض 2-3 لعب «مش للمشاركة» في مكان مقفول — تقليل الصراع أذكى من إدارته. وجهّز لعب جماعية بطبيعتها (مكعبات، كور، عجينة) لأن الصراع عليها أقل بكتير. وقول التوقعات قبل ما الباب يخبط: «اللعب اللي برّه للكل بالدور، واللي خبّيناه ليك لوحدك».","vals":["المشاركة والدور","الصبر والانتظار","الكرم والعطاء"]},
