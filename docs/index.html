ستحمل الباقي.","say":"المكان بيتغير — وحاجاتنا وطقوسنا معانا"}],"mastery":"لما خطة تتقلب قدامه — مشوار اتلغى أو اللون اللي عايزه خلص — يقول من نفسه «طب نعمل إيه بدالها؟» أو يقترح بديل، من غير نوبة صريخ ومن غير ما حد يفتح له الموضوع.","acts":[{"t":"لعبة «الخطة اتغيرت»","mat":"تلات كروت ورق وألوان، والألعاب التلاتة نفسها: مكعبات، عجينة، كتاب حدوتة","prep":"حضّروا الكروت مع بعض قبلها — ارسموا على كل كارت نشاط من التلاتة — واختاروا وقت لعب رايق مش وقت تعب","run":"يسحب كارت وتبدأوا النشاط اللي عليه. بعد شوية ارفع انت كارت تاني وقول بصوت مسرحي: «الخطة اتغيرت!» وانتقلوا فورًا للنشاط الجديد. بالضحك بيتمرن على نفس النقلة اللي بتضايقه في الحقيقة. وبعدين اديله هو دور اللي يقلب الخطة عليك — وشوفه بيستمتع بيها."},{"t":"ألبوم «التغييرات اللي عدّيناها»","mat":"صور من موبايلك أو صور مطبوعة في ظرف: أول يوم حضانة، البيت القديم، سفرية مصر","prep":"اجمع الصور قبلها في ألبوم واحد أو ظرف، واختار وقت هادي — قبل النوم أو قعدة ويك إند","run":"اتفرجوا عليها مع بعض واسأله عند كل صورة: «افتكر أول يوم؟ كنت حاسس بإيه؟ وبعدين حصل إيه؟». بيشوف بعينه إنه عدّى تغييرات قبل كده وطلع منها كويس — ودي أقوى حجة معاه وقت التغيير الجاي: «فاكر أول يوم حضانة؟ عدّيتها وكسبت أصحاب»."}],"say":"الخطة اتغيرت — نعمل إيه بدالها؟","deen":["الرضا: اللي ربنا اختاره لينا فيه خير","لما الخطة تتغير قدامه — مشوار اتلغى، مطر منع الخروجة — خلي جملتك الهادية هي القدوة: «قدّر الله — ويمكن فيها خير»، من غير درس طويل. واحكي له بالمعنى المبسط حديث النبي ﷺ: «عجبًا لأمر المؤمن، إن أمره كله خير» (رواه مسلم) — المؤمن أي حاجة تحصله بيلاقي فيها خير. بالتكرار والقدوة هيربط التغيير بالطمأنينة مش بالخضة."],"skill":"الانتقال بين الأنشطة من غير معركة: يسمع تحذير «كمان خمس دقايق»، يقفل اللي في إيده لما المؤقت يرن، ويدخل اللي بعده — نفس النقلة اللي بتحصل كل يوم من اللعب للحمام ومن التابلت للسفرة","lvl":4,"ord":10,"tag":"المشاعر","src":[["قصص ونصائح","قصص الأسبوع التمهيدي لرياض الأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%B5-%D8%A7%D9%84%D8%A3%D8%B3%D8%A8%D9%88%D8%B9-%D8%A7%D9%84%D8%AA%D9%85%D9%87%D9%8A%D8%AF%D9%8A/"],["قصة (كاملة عبر تطبيق حكايات بالعربي المجاني)","توتة في الروضة — قصة عن أول يوم في الروضة","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%A9-%D8%A3%D9%88%D9%84-%D9%8A%D9%88%D9%85-%D9%81%D9%8A-%D8%A7%D9%84%D8%B1%D9%88%D8%B6%D8%A9/"]],"mistakes":[{"m":"بتخبي التغيير لآخر ثانية عشان تكسب هدوء دلوقتي — مش هيعرف إن الحضانة هتتغير غير على بابها، ولا إن النهارده مفيش نادي غير وهو لابس.","fix":"الزن المبكر أهون من انهيار اللحظة. قول بدري حتى لو هيفتح باب أسئلة وزن من دلوقتي — كل يوم تحضير بينقص من حجم النوبة يومها."},{"m":"أول دمعة على الكوباية الخضرا وانت نازل السوبرماركت تجيب واحدة زيها — الإنقاذ بيلغي التمرين كله وبيعلّمه إن العياط بيرجّع الخطة القديمة.","fix":"سمّي الضيق، وبعدين خطة ب من الموجود في البيت: «الخضرا في الغسالة — الحمرا ولا الصفرا؟». الدنيا مش بتتعدل على مزاجنا — بنتصرف باللي موجود."},{"m":"«ما هي كوباية زي بعضها — مفيش حاجة تستاهل» — إنكار إحساسه بيطوّل النوبة وبيعلّمه إن ضيقه غلط في حد ذاته.","fix":"الاعتراف الأول: «كنت مجهز نفسك ليها — من حقك تتضايق»، وبعدها البديل. الاعتراف مش بيكبّر الموضوع — بيقفله أسرع."}],"adapt":[{"kid":"الحساس","how":"أصغر تغيير عنده حدث ضخم — المعلقة المختلفة ممكن تبكيه بجد. قلل التغييرات الاختيارية، وضاعف جرعة التحضير للضروري منها، وبعد النوبة أوعى تقول «كل ده عشان كوباية؟» — السلم عنده أطول، بس بيطلعه."},{"kid":"العنيد","how":"أي خطة ب جاية منك مرفوضة لمجرد إن مصدرها انت. خليه هو مؤلف البديل بالكامل: «الخطة اتغيرت — انت صاحب خطة ب، نعمل إيه؟» ولو اقترح حاجة نص معقولة امشي معاها زي ما هي. خطته هو بيدافع عنها بنفس عند رفضه لخطتك."},{"kid":"عالي الشدة","how":"التغيير المفاجئ بيولع نوبة كاملة — صريخ ورمي. وقت الانفجار مفيش كلام عن بدائل ولا خطط: أمان وحضور بس، والكلام بعد الهدوء. والتمرين يبقى على تغييرات تافهة متعمدة وهو رايق — معلقة صفرا بدل الحمرا — قبل ما توصلوا للتغييرات الحقيقية."}]},
{"name":"الإبداع والخيال","cat":"عقل ومهارة","age":[3,10],"how":"الإبداع في السن دي مش موهبة رسم — ده عضلة اللعب الحر. بتتبني بخامة مفتوحة ووقت فاضي من غير توجيه، وبكبار بيستقبلوا الأفكار الغريبة بفضول مش بتصحيح. أكتر جملة بتقتله: «مش كده — اعمل كده».","steps":[{"t":"افتح رف الخامات المفتوحة","d":"خصص رف واطي أو كرتونة في أوضة القعدة فيها: ورق، ألوان، عجينة، مكعبات، شريط لزق، أغطية برطمانات، وكرتونة السوبرماركت الفاضية. الخامات دي ملهاش «طريقة صح» زي اللعبة الجاهزة — فكل مرة بيطلع منها حاجة مختلفة. اللعبة اللي بتنور وتتكلم وتعمل كل حاجة لوحدها بتسيب لخياله مساحة أقل.","say":"دي حاجاتك — اعمل بيها اللي في خيالك"},{"t":"ادخل لعبته التمثيلي كتابع مش كمخرج","d":"لما يقول «أنا الدكتور وانت العيان» — نام على الكنبة واتوجع بجد. عشر دقايق يوميًا هو القائد: هو اللي يوزع الأدوار ويقرر الدبدوب مريض بإيه. وأوعى تصحح الحدوتة: «الحصان مبيطيرش» جملة ممنوعة — في اللعب الحصان بيطير عادي.","say":"انت الكابتن — قولي أنا مين في الحدوتة"},{"t":"اسأل عن الحكاية، متحكمش على الشكل","d":"لما يجيلك بالرسمة، بدل «ده إيه؟» أو «برافو حلوة» — وصّف واسأل: «شايف دواير لولبي كتير هنا، والأحمر ده كله — احكيلي عملت إيه». وقبل النوم اقلب الأدوار: بدل ما تحكي له، قوله «احكيلي انت حدوتة من دماغك» وامشي ورا حدوتته مهما اتلخبطت.","say":"احكيلي — إيه الحكاية اللي هنا؟"},{"t":"فكّر قدامه بصوت عالي وجرّب أفكاره","d":"لما تقع مشكلة بيتية صغيرة — القمع ضايع وعايزين نملى القارورة، الخيط مش طايل يربط الكرتونة — قوله: «نعمل إيه؟ فكّر معايا». ولما يقترح فكرة غريبة جرّبها فعلًا حتى لو شايف إنها هتفشل: تجربة بتفشل بتعلّم أكتر من فكرة بتترفض. وسمّي حلولك انت كمان: «هعمل غطا للحلة من طبق — تفتكر هينفع؟».","say":"فكرة جديدة! يلا نجربها ونشوف"}],"mastery":"يقعد لوحده ربع ساعة مع ورق أو مكعبات أو كرتونة ويطلع منها حاجة من دماغه، وييجي يحكيلك حدوتتها — من غير ما يسأل «أرسم إيه؟» ولا يستنى تعليمات.","acts":[{"t":"الكرتونة السحرية","mat":"كرتونة طلبية السوبرماركت، شريط لزق، ألوان","prep":"أول ما كرتونة توصل متترميش — حطها زي ما هي في نص الصالة واستنى فضوله","run":"اسأله: «الكرتونة دي النهارده ممكن تبقى إيه؟» — عربية؟ بيت للدبدوب؟ مركب؟ هو اللي يقرر، وانت بس تجيب الشريط اللزق والألوان، وهو ينفذ ويلوّن بإيده. كل أسبوع كرتونة جديدة بشخصية جديدة — وسيب تصميمه زي ما هو حتى لو مش مفهوم."},{"t":"حدوتة التلات حاجات","mat":"تلات حاجات من البيت ملهمش علاقة ببعض: معلقة، دبدوب، كوباية بلاستيك","prep":"هاتهم وحطهم على الكنبة قدامكم — دقيقة تجهيز وخلاص، وتنفع قبل النوم أو أي وقت فاضي","run":"ابدأ انت بجملة واحدة: «كان فيه دبدوب صحي من النوم لقى...» وهو يكمل الحدوتة بشرط واحد: التلات حاجات لازم يظهروا فيها. متصححش خياله مهما اتلخبط — في الخيال مفيش صح وغلط. وبعدين اقلبوا الأدوار: هو يختارلك تلات حاجات وانت اللي تحكي."}],"say":"في الخيال مفيش صح وغلط — ورّيني فكرتك","deen":["التفكر: ربنا البديع اللي خلق كل حاجة","خيال طفلك ودهشته هما باب التفكر: على البلكونة بالليل اتأملوا القمر سوا، وعلى الأرض اتفرجوا على النملة الماشية، واسأل معاه بدهشة حقيقية: «مين خلق ده كله؟». واربطها بالقرآن: ﴿بديع السماوات والأرض﴾ (البقرة 117) — ربنا البديع أبدع كل حاجة من غير مثال قبلها. الدهشة المشتركة دي بتزرع حب الله في قلبه من غير تلقين جاف."],"skill":"شغل الإيد بالخامات: يقص بمقص أطفال ويلزق بشريط ويشكّل بالعجينة، ويحوّل كرتونة أو رول مناديل لحاجة من تصميمه هو — نفس المهارة اللي بتظهر في ركن الأشغال في الحضانة","lvl":3,"ord":18,"tag":"الفضول والعلوم","src":[["مقال أنشطة","أفكار أنشطة منتسوري للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A7%D9%81%D9%83%D8%A7%D8%B1-%D8%A7%D9%86%D8%B4%D8%B7%D8%A9-%D9%85%D9%86%D8%AA%D8%B3%D9%88%D8%B1%D9%8A-%D9%84%D9%84%D8%A7%D8%B7%D9%81%D8%A7%D9%84/"],["مقال أنشطة","91 فكرة أنشطة وألعاب مسلية للأطفال في المنزل — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A3%D9%86%D8%B4%D8%B7%D8%A9-%D9%88%D8%A3%D9%84%D8%B9%D8%A7%D8%A8-%D9%85%D8%B3%D9%84%D9%8A%D8%A9/"]],"mistakes":[{"m":"بتصحح شغله وهو شغال: تمسك إيده ترسم الشمس «الصح»، تظبط البرج المايل، تقوله «الشجرة خضرا مش موف» — فبيتعلم إن فيه طريقة واحدة صح وإن طريقته هو الغلط.","fix":"إيدك في حضنك. لو طلب مساعدة اسأله «عايزها تطلع شكلها إيه؟» ونفّذ فكرته هو — حتى الشجرة الموف."},{"m":"بتلم «الكركبة» أول ما يقوم: الخيمة اتفكت والصواريخ اللي من رولات المناديل راحت الزبالة قبل ما يرجع من الحضانة — فبيتعلم إن اللي بيعمله ملوش قيمة تستاهل تعيش ليوم تاني.","fix":"اتفقوا على مكان ووقت: الخيمة تعيش لبكره، والرسمة تتعلق على التلاجة أسبوع قبل ما تتبدل. اللي اتعمل بخياله يتشال باتفاق، مش يختفي وراه."},{"m":"بتملى وقته كله بأنشطة انت مجهزها وكورسات وشاشة — فمفيش ولا ساعة فاضية يقابل فيها خياله.","fix":"الإبداع محتاج فراغ. سيب في اليوم وقت من غير برنامج ومن غير شاشة، والرف المفتوح موجود — والزهق نفسه هو اللي هيشغّل الخيال."}],"adapt":[{"kid":"كثير الحركة","how":"مش هيقعد يرسم على الترابيزة — الإبداع عنده بالجسم كله. خامات كبيرة على الأرض: كراتين يدخل جواها، ملايات يبني بيها عشش، حدوتة بتتمثل بالجري مش بتتحكي بالقعاد. القعدة مش شرط للخيال."},{"kid":"العنيد","how":"لو حس إنها «نشاط انت مجهزه وعايزه يعمله» هيرفض من باب الرفض. متجهزش حاجة — سيب الخامات متاحة على الرف واشتغل انت في حاجتك جنبه. فضوله هيجيبه لوحده، وأول ما يمسك حاجة متتدخلش بأي توجيه."},{"kid":"الخجول","how":"لما تسأله «احكيلي» وشك في وشه بيتقفل. اقعد جنبه ارسم انت واتكلم عن رسمتك انت — هو هيبدأ يعلق لوحده. أو خلي الدبدوب هو اللي «بيسأل» عن الحكاية — الكلام لدبدوب أسهل من الكلام لكبير."}]},
{"name":"الاختيار وتحمّل النتيجة","cat":"عقل ومهارة","age":[4,10],"how":"المسؤولية بتتعلم من اختيارات صغيرة نتيجتها فورية ومحسوسة، مش من المحاضرات. القاعدة التلاتية: اختيارين بس وانت موافق عليهم الاتنين، النتيجة تتقال قبل الاختيار، وبعدين تحصل بجد — من غير إنقاذ ومن غير «قولتلك».","steps":[{"t":"حط اختيارين حقيقيين في يومه","d":"من الصبح للنوم في فرص جاهزة: التيشيرت الأحمر ولا الأزرق؟ تفاحة ولا موزة في شنطة الحضانة؟ تستحمى قبل العشا ولا بعده؟ الشرط الوحيد: الاتنين لازم يكونوا مقبولين عندك انت — متحطش «اختيار» انت ناوي ترفضه. ولما يختار سمّيها: «انت اخترت الأزرق — ده قرارك».","say":"انت اللي بتختار: ده ولا ده؟"},{"t":"سمّي النتيجة قبل الاختيار مش بعده","d":"قبل ما يمد إيده، اعرض الصفقة كاملة: «لو اخترت البسكوتة دلوقتي قبل الغدا، مفيش حلاوة بعد الأكل — تحب إيه؟». وعوّده هو نفسه يسأل السؤال: «لو عملت كده، هيحصل إيه؟». النتيجة لازم تكون قريبة ومحسوسة — نتيجة بكرة مش موجودة في دماغ ابن أربع سنين.","say":"لو اخترت دي هيحصل كده — قرارك إيه؟"},{"t":"خلّي النتيجة تحصل — من غير إنقاذ ومن غير شماتة","d":"اختار ميخدش الجاكيت وانتوا نازلين المول؟ هيبرد من التكييف — ومتطلعش جاكيت مخبي من شنطتك، وكمان متقولش «قولتلك». الاتنين بيبوظوا الدرس: الإنقاذ بيلغي النتيجة، والشماتة بتحوّل الدرس لمعركة. قول بس: «برد؟ إحنا اخترنا نسيب الجاكيت — المرة الجاية نفكر تاني»، وخلي بالك انت من الأول إن النتيجة تكون مأمونة ومناسبة لسنه.","say":"حصل اللي اتفقنا عليه — المرة الجاية نختار إزاي؟"},{"t":"فكّر قدامه بصوت عالي","d":"في السوبرماركت وهو قاعد في عربية التسوق، سمّي قرارك خطوة خطوة: «آخد العبوة الكبيرة ولا الصغيرة؟ الكبيرة أوفر بس تقيلة في الشيل — هاخد الصغيرة». كده بيشوف إن القرار له خطوات: بفكر في الاتنين، بوزن، بقرر — مش زر بيتداس. القدوة دي بتشتغل من غير ولا كلمة موجهة ليه.","say":"بفكر أهو: لو كده يحصل كده... خلاص، قررت"},{"t":"اديله قرارات العيلة الصغيرة","d":"كبّر الدايرة: سلّمه قرار بيمشي على البيت كله — يختار خضار العشا من اتنين، يختار نزلة الجمعة من اتنين. ولما قراره يتنفذ فعلًا على الكل، سمّيها قدامه: «إحنا في الحديقة النهارده عشان انت اخترت». لما اختياره بيلمس غيره، بيحس إن القرار حاجة كبيرة — ومسؤولية.","say":"قرارك النهارده بيمشي علينا كلنا — اختار"}],"mastery":"قدام اختيارين بيقرر في وقت معقول من غير لف، ولما النتيجة اللي اتقالت له تحصل فعلًا — البسكوتة اتاكلت فمفيش حلاوة — بيستحملها من غير معركة، وساعات تسمعه بيقول: «أنا اللي اخترت كده».","acts":[{"t":"محل البيت بتلات زراير","mat":"خمس ست حاجات من البيت (بسكوتة، كورة، كتاب...)، وزراير كعملة","prep":"افرش الحاجات على السفرة وحط لكل واحدة تمن معلن: البسكوتة بزرار، الكورة بتلاتة، حدوتة طويلة قبل النوم باتنين","run":"اديله تلات زراير بس — مش هتكفي كل حاجة، فلازم يختار ويسيب حاجة. سيبه يفكر ويشتري ويدفع بإيده من غير ما تلمح له بحاجة. ولما زرايره تخلص وهو عايز كمان قوله بهدوء: «الزراير خلصت — بكرة تشتري تاني». ده أول درس ميزانية في حياته."},{"t":"مفترق الطرق في الحدوتة","mat":"من غير مواد","prep":"في حدوتة النوم العادية بتاعتكم — بس ادخل وانت ناوي توقف عند لحظة قرار","run":"وقّف الحدوتة عند مفترق: «الأرنب لقى بوابتين... لو دخل من الغابة الضلمة هيحصل إيه؟ ولو خد الطريق الطويل؟». خليه يتنبأ بنتيجة كل طريق، وبعدين يختار للأرنب. كمّل الحدوتة بنتيجة اختياره فعلًا — حتى لو اختار الطريق اللي فيه مشكلة، الأرنب يواجهها ويتعلم منها، من غير ما تنقذه انت من اختياره."}],"say":"انت اللي اخترت — والاختيار ليه نتيجة","deen":["المسؤولية: كل واحد راعي على اللي في إيده","اديله حاجة صغيرة تبقى «رعيته» هو: زرعة البلكونة يسقيها، طبقه يشيله للحوض — وسمّيها قدامه بالاسم: «دي مسؤوليتك». واحكي له بالمعنى المبسط حديث النبي ﷺ: «كلكم راعٍ وكلكم مسؤول عن رعيته» (متفق عليه) — بابا مسؤول عن البيت، وانت مسؤول عن زرعتك. قدّمها كتشريف بيكبّره، مش كتخويف من العقاب أبدًا."],"skill":"اتخاذ القرار من بديلين والالتزام بيه: يختار في أقل من دقيقة — التيشرت الأحمر ولا الأزرق، التفاحة ولا الموزة — ومبيرجعش في اختياره كل شوية، نفس القرارات الصغيرة اللي بتقابله كل يوم الصبح","lvl":4,"ord":11,"tag":"","src":[],"mistakes":[{"m":"بتقدم اختيار مزيف: «تحب تلبس الجاكيت ولا لأ؟» وانت مش هتنزل من غيره — أول ما يقول لأ بتلبسهوله غصب، فبيتعلم إن اختياره ديكور.","fix":"اللي مش قابل للنقاش متحطوش كسؤال. قول: «الجاكيت لازم — اختار: الأزرق ولا بتاع الكابتشة؟». الاختيار الحقيقي جوه الإطار، مش على الإطار نفسه."},{"m":"«قولتلك!» بعد ما النتيجة تحصل — الشماتة بتنقل الدرس من «اختياري ليه نتيجة» لـ«بابا كسب وأنا خسرت»، فبيدافع بدل ما يتعلم.","fix":"جملة واحدة محايدة وخلاص: «حصل اللي اتفقنا عليه — المرة الجاية نفكر تاني». النتيجة نفسها بتتكلم، متتكلمش انت فوقها."},{"m":"بتستعمل كلمة «اختار» كتهديد متنكر: «اختار — يا تلم اللعب يا أقفل التلفزيون أسبوع» — ده إنذار مش اختيار، وبيحرق الأداة نفسها فمبيصدقش اختياراتك الحقيقية.","fix":"الاختيار الحقيقي طرفيه الاتنين مقبولين عندك فعلًا. الحزم له أدواته التانية — متلبسوش لبس الاختيار."}],"adapt":[{"kid":"العنيد","how":"بيرفض الاختيارين وبيطلب حاجة تالتة — وده اختبار للإطار مش للاختيار. ثبّت بهدوء من غير ما تضيف خيارات تحت الضغط: «الموجود دول الاتنين — ولو صعب عليك تختار، أنا هختار النهارده وانت تختار بكره». غالبًا هيمسك القرار قبل ما تكمّل الجملة."},{"kid":"الحساس","how":"النتيجة لما بتحصل — برد من غير جاكيت، البسكوتة راحت — بتقلب دموع طويلة وإحساس بالذنب. خلي النتايج الأولى صغيرة وقصيرة جدًا، وساعده يقفل الموقف بعدها: «حصلت وخلصت — مش هنفضل زعلانين، بكره فيه اختيار جديد»."},{"kid":"كثير الحركة","how":"بيختار قبل ما يسمع النتيجة أصلًا — إيده أسرع من ودنه. صغّر العرض لجملة قصيرة، وامسك الاختيارين في إيديك الاتنين قدامه: مبيلمسش اللي اختاره غير بعد ما يعيد النتيجة بلسانه هو — «لو أخدت البسكوتة يبقى إيه؟»."}]},
{"name":"قراءة مشاعر الناس","cat":"تعامل","age":[3,12],"how":"قبل التعاطف فيه خطوة اسمها القراءة: يبص في الوش والجسم ويطلع منهم المعلومة — الشخص ده حاسس بإيه. ودي بتتعلم بحاجتين: انت بتقرا وشوش الناس بصوت عالي قدامه كل يوم، وبتلعبوا تخمين مشاعر — مش بأسئلة امتحان وقت المشكلة.","steps":[{"t":"اقرا الوشوش بصوت عالي في يومكم","d":"خلي القراية الجاهرة عادة: في حدوتة قبل النوم وقّف عند الصورة وقول: «بص لوش الأرنب — عينيه مفتوحين قوي وبقه مفتوح... ده خايف ولا مبسوط؟». ولما بابا أو ماما ييجوا من الشغل: «بص، وشه تعبان النهارده». انت كده بتوريه إن الوشوش بتتقري زي الكتب.","say":"بص للوش ده — بيقولنا إيه؟"},{"t":"علّمه العلامات: الجسم بيتكلم","d":"اربط كل شعور بعلاماته المحسوسة: دموع وبق نازل يبقى زعلان، حواجب مقفولة وإيدين مشدودة يبقى غضبان، واقف بعيد وساكت وماسك في هدوم ماما يبقى خايف أو مكسوف. وقدام مراية الحمام اعملوا الأوشوش مع بعض: «اعمل وش غضبان... طب مندهش!» — وبعدين هو يعمل وانت تخمن.","say":"الدموع بتقول زعلان — والحواجب المقفولة بتقول غضبان"},{"t":"وقّفه لحظة القراءة قبل التصرف","d":"في اللعب مع ابن عمه أو في الحضانة، لما يشد اللعبة والتاني يعيط — قبل أي محاضرة قوله: «استنى... بص لوش عمر. شايف إيه؟» وخليه هو اللي يقرا ويقول «زعلان». وعلّمه كمان إن الناس بتحس مختلف عن بعض عن نفس الحاجة: «انت مبسوط بالمطر وأختك خايفة من الرعد — الاتنين عادي ومفيش حد غلط».","say":"استنى — بص له الأول: هو حاسس بإيه؟"},{"t":"خليه يقراك انت، واسأله عن يومه بالمشاعر","d":"في لحظة هادية قوله: «بص لوشي... أنا حاسس بإيه دلوقتي؟» — وانت فعلًا مبسوط بمكالمة حلوة أو تعبان بعد يوم شغل، وبعدها قوله عرف صح ولا لأ وعرف منين. وبدل «عملت إيه في الحضانة؟» اسأل: «مين كان مبسوط النهارده في الفصل؟ ومين كان زعلان؟ عرفت منين؟».","say":"بص لوشي انت بقى — أنا حاسس بإيه؟"}],"mastery":"يجيلك من نفسه بملاحظة عن مشاعر حد تاني: «ماما، صاحبي كان زعلان النهارده عشان...» — أو يلمح وشك متغير ويسألك من نفسه: «مالك؟ انت زعلان؟» من غير ما حد يلفت نظره.","acts":[{"t":"مرايا الأوشوش","mat":"مراية الدولاب — من غير مواد تانية","prep":"قفوا انتوا الاتنين قدام المراية في وقت رايق — دقيقتين تلاتة كفاية كل مرة","run":"واحد يعمل وش — زعلان، خايف، مندهش، غضبان — والتاني يخمن، وبالتبادل. لما يشطر صعّبها: مشاعر بالجسم بس من غير وش — «خمّن من جسمي: كتفين واطيين ودراعات مكتفة يعني إيه؟». وآخر مستوى: «وش برة وحاسة جوة» — ابتسامة وعينين زعلانين — واتكلموا إيه اللي كشفها."},{"t":"محقق المشاعر في القصة","mat":"قصة مصورة يعرفها من مكتبته","prep":"هاتها في وقت الحدوتة، وغطي الكلام بإيدك — النهارده هتتمشوا في الصور بس","run":"عند كل صورة اسأله: «الولد ده حاسس بإيه؟ عرفت منين — بص لإيديه وبقه». وبعدين التخمين الأصعب: «وحاسس كده ليه؟ حصل إيه قبلها؟». نفس القصة بتتلعب كذا مرة على أيام مختلفة — وإجاباته بتتطور كل مرة."}],"say":"بص في الوش — هو حاسس بإيه؟","deen":["النبي ﷺ كان بيقرا وشوش اللي حواليه","احكي له حكاية أبي عمير: النبي ﷺ لاحظ إن الولد الصغير وشه حزين، وعرف إن عصفوره الصغير «النغير» مات، فقعد يواسيه ويلاطفه ويقول له: «يا أبا عمير، ما فعل النغير؟» (متفق عليه). النبي شاف الحزن في الوش قبل ما حد يتكلم — وإحنا بنعمل زيه: نبص في وش اللي جنبنا ونشوف محتاج إيه. وطبّقها قدامه في البيت: «باين على ماما تعبانة — نجيب لها مية؟»."],"skill":"قراءة لغة الجسد: يقول الشخص حاسس بإيه من علامتين على الأقل — الوش والجسم — قبل ما يتصرف معاه، زي ما بيحتاج يلاحظ إن زميله في الحضانة مضايق ومش عايز يلعب دلوقتي","lvl":2,"ord":18,"tag":"المشاعر","src":[["قصة مصورة","قصة كيتي غاضبة — عن مشاعر الغضب — حكايات بالعربي","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%A9-%D9%85%D8%B5%D9%88%D8%B1%D8%A9-%D8%B9%D9%86-%D8%A7%D9%84%D8%BA%D8%B6%D8%A8-%D9%84%D9%84%D8%A7%D8%B7%D9%81%D8%A7%D9%84/"],["بطاقات للطباعة","بطاقات المشاعر لمرحلة ما قبل المدرسة — PDF مجاني — Giggle Academy","https://giggleacademy.com/blog/ar/learning/flashcards/emotions-flashcards-for-preschool-free-printable-pdf"]],"mistakes":[{"m":"بتحوّل القراءة لاستجواب وقت الخناقة: «شايف عملت إيه في صاحبك؟! بص له كده!» وهو لسه مولّع — مفيش قراءة بتحصل وجسمه في حالة دفاع.","fix":"وقت الموقف جملة واحدة هادية: «بص لوشه — شايف إيه؟» وبس. التدريب الحقيقي مكانه الحواديت والمراية ولحظات الصفا — مش نص المعركة."},{"m":"بتلغي مشاعر الناس قدامه عشان تريحه: صاحبه عيّط لما اللعبة اتاخدت منه — «سيبك منه، ده دلوعة» — فبيتعلم إن في مشاعر «مش محسوبة» ينفع نطنشها.","fix":"القراءة قبل الحكم، والاتنين بيتقالوا: «هو زعلان إن اللعبة اتاخدت منه — وبرضه كان غلط إنه خطفها». كل وش بيتقري، حتى وش اللي غلط."},{"m":"وشك بيقول حاجة وبقك بيقول التاني: هو شايفك متضايق وبتقوله «أنا كويس، مفيش حاجة» — فبتلخبط الجهاز اللي بيتعلم يقرا: يا يبطل يصدق عينيه، يا يفتكر إنه هو السبب.","fix":"الصدق البسيط المناسب لسنه: «أنا متضايق شوية من حاجة في الشغل — مش منك، وهعدي». كده قراءته اتأكدت، وحملها اتشال عنه."}],"adapt":[{"kid":"كثير الحركة","how":"مش بيبص في الوشوش أصلًا — بيجري جنب الموقف. خلي القراءة لعبة حركية: تمثيل المشاعر بالجسم كله («اعمل غضبان بجسمك كله! طب خايف!»)، ولحظة القراءة في المواقف الحقيقية خليها ثانية واحدة بجملة واحدة — مش وقفة طويلة مش هيستحملها."},{"kid":"الحساس","how":"بيقرا زيادة عن اللزوم وبيشيل اللي مش بتاعه — يشوف ماما متضايقة يفتكر إنه السبب ويقعد مكتوم. كمّل كل قراءة بتوضيح المصدر: «قريت صح، أنا متضايق — من حاجة في الشغل مش منك». وعلّمه إن إحساس الناس بنشوفه ونحس بيه — بس مش شغلتنا نصلحه كله."},{"kid":"الخجول","how":"بيقرا كويس جدًا من بعيد، بس عمره ما هيسأل «مالك؟» بصوته. اقبل الملاحظة الصامتة كنجاح كامل: لو جاب لك كوباية مية وانت متضايق من غير ولا كلمة، سمّيها بالليل: «انت شفت إني تعبان وعملت حاجة — ده اللي بيعمله الصاحب»."}]},
{"name":"الرفض وسط الأصحاب","cat":"تعامل","age":[4,12],"how":"في السن ده طفلك بيمشي ورا المجموعة بالفطرة، فالمحاضرة عن الصح والغلط مش هتشتغل وقت الموقف. اللي بيشتغل: قاعدة تمييز بسيطة بيعرف يطبقها لوحده، وجملة رفض محفوظة اتدرّب عليها بالتمثيل قبل ما يحتاجها بجد.","steps":[{"t":"نحدد يعني إيه «غلط» بعلامات ملموسة","d":"في وقت هادي — على العشا مثلًا، مش بعد مشكلة — اشرح القاعدة بتلات أسئلة بسيطة: الحاجة دي بتعوّر حد؟ بناخد بيها حاجة مش بتاعتنا؟ بنستخبى عشان نعملها؟ لو أي إجابة آه، يبقى غلط حتى لو أحسن صاحبه هو اللي قالها. جرّبها بالدبدوب: «الدبدوب قال نستخبى ورا الكنبة وناكل الشيكولاتة من غير ما ماما تعرف — بتعوّر؟ لأ. مستخبيين؟ آه. يبقى إيه؟».","say":"اللي بنستخبى عشان نعمله — ده غالبًا غلط"},{"t":"نحفظ جملة الرفض بالتمثيل","d":"مرة في الأسبوع، خمس دقايق تمثيل: الدبدوب بيقول لطفلك «تعالى ناخد عربية عمر من شنطته وهو مش واخد باله». درّبه على التلات خطوات بالترتيب: يقول «لأ» بصوت واضح وهو واقف معتدل، يمشي من المكان، يقول لكبير موثوق — انت أو الميس. واعكسوا الأدوار كمان: هو اللي يقترح وانت اللي ترفض، عشان يشوف الرفض بيتعمل إزاي بهدوء.","say":"لأ، أنا مش بعمل كده — وأمشي"},{"t":"سؤال المشوار بعد الحضانة","d":"في العربية وانتو راجعين، اسأل سؤال محدد مش عام: «حد النهارده طلب منك حاجة حسيت إنها غلط؟ عملت إيه؟». لو حكى إنه رفض، اوصف من غير مبالغة: «قلت لأ ومشيت — دي شجاعة بجد». ولو طلع ساير صاحبه، من غير عقاب ولا محاضرة — في البيت أعيدوا المشهد نفسه بالدبدوب: «طيب هو قال كده... انت تقول إيه المرة الجاية؟».","say":"قلت لأ ومشيت — دي شجاعة بجد"},{"t":"نرفض من غير ما نخسر الصاحب","d":"علّمه إن بعد اللأ في بديل: «مش هلعب اللعبة دي... تعالى نلعب عربيات». وخليه يشوفك انت بترفض بأدب في حياتك: في السوبرماركت لما حد يعرض عليك حاجة مش عايزها، قول قدامه «لأ شكرًا» بهدوء وثقة من غير توتر. كده بيفهم إن اللأ كلمة عادية بتتقال وبتخلص — مش خناقة ولا قطيعة.","say":"مش هلعب دي — تعالى نلعب حاجة تانية"}],"mastery":"بيحكيلك من نفسه عن موقف قال فيه لأ — «فلان قال نستخبى من الميس وأنا قلت لأ ومشيت» — من غير ما تسأله، وبتشوفه تاني يوم بيلعب مع نفس الصاحب عادي: رفض الفعل ومسابش الصداقة.","acts":[{"t":"لعبة لأ ولا ماشي؟","mat":"من غير مواد","prep":"تنفع في العربية في سكة الحضانة أو على السفرة — أي وقت انتوا الاتنين رايقين","run":"قول مواقف بسرعة والمطلوب رد فوري: «صاحبك قال نلعب كورة» → ماشي. «صاحبك قال ارمي رمل على زميلك» → لأ وأمشي. «صاحبك قال نستخبى تحت السلم من الميس» → لأ وأقول لكبير. عشر مواقف في الجلسة، وبعدين اعكسوا: هو اللي يألف مواقف ويمتحنك بيها — وهيحاول يلغبطك، ودي نص المتعة."},{"t":"مسرح الدبدوبين","mat":"دبدوبين أو عروستين من لعبه","prep":"اقعدوا على السجادة وقسّموا الأدوار: انت بتحرك دبدوب وهو بيحرك التاني","run":"دبدوبك يقترح حاجة غلط — ياخد لعبة مش بتاعته، يخبط التاني — وطفلك يحرك دبدوبه ويرد بصوته بجملة الرفض الكاملة: «ورّيني دبدوبك هيقول إيه؟». غيّروا السيناريو كل مرة، وخلّوا في مرات الدبدوب يقترح حاجة كويسة — عشان يتدرب يفرز مش يرفض كل حاجة."}],"say":"مش كل حاجة صحابي بيعملوها أعملها — لو غلط بقول لأ","deen":["الصاحب اللي بيشد للخير: حامل المسك ونافخ الكير","احكي له تشبيه النبي ﷺ في وقت اللعب مش وقت العتاب: الصاحب الكويس زي بياع المسك — تقعد جنبه تاخد من ريحته الحلوة، والصاحب اللي بيجرّك على الغلط زي نافخ الكير — يا شرارة تحرق هدومك يا ريحة دخان تعلق فيك (متفق عليه). ومن غير ما نوصف طفل معين بالوحش أبدًا: بنسمي الفعل غلط، والصاحب بيفضل صاحب."],"skill":"الجرأة في إعلان الرأي قدام مجموعة: يقول «لأ» واضحة لصحابه لما اللعبة غلط — من غير خناق ومن غير مسايرة — نفس العضلة اللي هيحتاجها بعدين في المدرسة وقدام الشاشات","lvl":4,"ord":12,"tag":"","src":[["قصة","قصة اختيار الصديق — نقطة اللمون في كوباية اللبن (بالعربي نتعلم)","https://www.belarabyapps.com/%D9%82%D8%B5%D8%B5-%D8%A7%D8%AE%D8%AA%D9%8A%D8%A7%D8%B1-%D8%A7%D9%84%D8%B5%D8%AF%D9%8A%D9%82/"]],"mistakes":[{"m":"لما بيحكيلك إنه ساير صاحبه في غلطة بتولّع: «إزاي تعمل كده؟! ده انت اللي هتتعاقب!» — النتيجة الوحيدة إنه بيبطل يحكي، وانت بتخسر خط الدفاع الأول.","fix":"نبرة هادية وفضول قبل أي حكم: «وبعدين حصل إيه؟ وانت كنت حاسس بإيه؟». الحكاية اللي بتوصلك هي عينك جوه الحضانة — متقفلهاش بإيدك."},{"m":"بتعلّمه «متسمعش كلام حد غير أنا» — دي مش تمييز، دي نفس الطاعة العمياء بس ليك انت. واللي اتربى يمشي ورا أعلى صوت، هيمشي ورا أعلى صوت في الرحلة لما تغيب.","fix":"علّمه القاعدة نفسها — بتعوّر؟ مش بتاعتنا؟ مستخبيين؟ — عشان يحكم هو بنفسه حتى وانت مش موجود. الهدف بوصلة جواه، مش سلك موصّل بيك."},{"m":"بتمنعه من الصاحب اللي «بيعلمه الغلط» بقرار فوقي — فبيتعلق بيه أكتر، أو بيقعد معاه في الحضانة من ورا ضهرك ومن غير حكي.","fix":"بدل العزل، كتّر المناعة: مشاهد الدبدوب، سؤال المشوار، وجملة الرفض الجاهزة. طفلك هيقابل النوعية دي طول عمره — محتاج يعرف يتعامل، مش يتخبى."}],"adapt":[{"kid":"الخجول","how":"«لأ» بصوت عالي قدام مجموعة فوق طاقته دلوقتي. اديله النسخة الأهدى وسمّيها نجاح كامل: يمشي من الموقف من غير إعلان، وييجي يحكيلك — المشي نفسه رفض كامل. ودرّبه على اللأ الهادية مع الدبدوب لحد ما صوته يقوى بالتدريج."},{"kid":"العنيد","how":"عنده «لأ» حديد جاهزة — بس شغالة عليك انت مش على أصحابه. استثمر العند بدل ما تحاربه: «انت لما تقول لأ محدش بيقدر يحركك — دي قوة، وهي دي نفسها اللي هتحميك مع أصحابك». وفرّق معاه بين لأ الحماية ولأ المعاندة."},{"kid":"عالي الشدة","how":"رفضه بييجي بدفع وصريخ — فبيتحول من رافض للغلط لمعتدي في ثانية. خلي التمثيل عندك على النبرة مش النص: «لأ» حازمة والإيدين جنبه، والمشي بدل الزق. وراجعها بالليل بوصف: «قلت لأ من غير ما تدفع حد؟ دي هي الشطارة»."}]},
{"name":"آداب الأكل والشرب","cat":"دين وأخلاق","age":[3,12],"how":"الحديث الأصلي نفسه اتقال لطفل قاعد على السفرة، مش في درس — فده أدب بيتعلم على الأكل نفسه: نفس الجمل في نفس اللحظات كل وجبة، وانت بتعملها قدامه قبل ما تطلبها منه. ابدأ بتلات سنن بس والباقي يركب بعدين.","steps":[{"t":"أسبوع قدوة صامتة — من غير ولا طلب","d":"قبل أي كلمة ليه، أسبوع كامل اعمل السنن قدامه انت: سمِّ بصوت مسموع قبل أول لقمة، كل بإيدك اليمين، اقعد وانت بتشرب حتى لو مستعجل، واحمد بصوت مسموع في الآخر — والموبايل بعيد عن السفرة خالص. هو بيصور اللي بتعمله مش اللي بتقوله، وأسبوع القدوة ده بيوفر عليك شهور أوامر.","say":"بسم الله... (بصوت مسموع — من غير ما تبص له أصلًا)"},{"t":"حكاية عمر الصغير على السفرة","d":"على العشا، احكيله: كان في ولد صغير زيك اسمه عمر، بياكل مع النبي ﷺ وإيده بتلف في الطبق في كل حتة، فالنبي قاله بحنية جملة واحدة: «يا غلام، سمِّ الله، وكل بيمينك، وكل مما يليك». خليه يعيد التلاتة على صوابعه: بسم الله — إيدي اليمين — من قدامي. كده هو عارف إن دي وصية النبي لطفل زيه بالظبط، مش أوامر من عندك.","say":"النبي ﷺ علّم ولد زيك بجملة واحدة: سمِّ الله، وكل بيمينك، وكل مما يليك"},{"t":"تلات سنن بس في الأول + إشارة صامتة","d":"اتفقوا إن السفرة ليها تلات قواعد بس دلوقتي: بسم الله قبل أول لقمة، الأكل بالإيد اليمين، وناكل من اللي قدامنا — لما يكون طبق المكرونة في نص الترابيزة، كل واحد ياخد من ناحيته. قبل أول لقمة اسأل: «نقول إيه الأول؟» واستنى هو اللي يقولها. ولو مسك المعلقة بالشمال، من غير كلام قدام الكل: مسة خفيفة على إيده اليمين — الإشارة الصامتة بتصحح من غير ما تكسف.","say":"بسم الله... وبإيدك اليمين يا بطل"},{"t":"نضيف الباقي ونعيّنه ريّس السفرة","d":"لما التلاتة يبقوا أوتوماتيك — أسابيع مش أيام — ضيف واحدة واحدة: غسيل الإيدين قبل الأكل، القعود وقت الأكل والشرب، والحمد لله في الآخر. وعيّنه «ريّس السفرة»: هو اللي يفكّر الكل قبل ما نبدأ — «غسلنا إيدينا؟ قلنا بسم الله؟». ولما تشوفه واقف قدام التلاجة بيشرب من الكوباية، بهدوء: «اقعد الأول... وبعدين اشرب».","say":"الحمد لله اللي أطعمنا وسقانا"},{"t":"نفس السنن في كل مكان","d":"في المطعم وعزومة العيلة وحفلة الحضانة نفس القواعد بالظبط — السنة مش نظام بيتنا اللي بيتشال على الباب. وعمّم على السناكس: البسكوتة في العربية والتفاحة في النادي ليهم بسم الله برضه، مش بس السفرة. أول ما يسمّي لوحده على بسكوتة برة البيت، اعرف إنها بقت بتاعته هو.","say":"إحنا بنسمّي في أي حتة — مش بس على السفرة"}],"mastery":"بيقول بسم الله لوحده قبل أول لقمة حتى على بسكوتة الحضانة، وبيمد إيده اليمين من غير تفكير، ولما بيعطش بيقعد الأول وبعدين يشرب — وساعات يصحح لضيف صغير بلطف: «قول بسم الله الأول».","acts":[{"t":"سفرة الدبدوب","mat":"الدبدوب والعروسة، وأطباق وكوبايات لعب أو بلاستيك صغيرة","prep":"افرشوا سفرة تمثيلية على الترابيزة أو السجادة، وقعّدوا الدبدوب والعروسة كضيوف","run":"هو الكبير في العزومة دي: يعلّم ضيوفه قواعد السفرة، ويصحح للدبدوب اللي «بياكل بشماله» واللي «بياخد من قدام غيره» — سيبه يقولها بنفسه: «قول بسم الله الأول، وكل بيمينك». اللي بيعلّم غيره بيثبت اللي اتعلمه أضعاف."},{"t":"لعبة من قدامي أنا","mat":"طبق فاكهة مقطعة كبير","prep":"حطه في نص الترابيزة على وجبة حقيقية، وأعلن القاعدة قبل ما تبدأوا: كل واحد ياكل من الحتة اللي قدامه بس","run":"اللي إيده تعدي للناحية التانية، الكل يقوله ضاحكين: «مما يليك!» ويرجّعها. جولة واحدة على الوجبة كفاية — تدريب حسي باللعب على أصعب قاعدة في الحديث، من غير أي زعيق."}],"say":"سمِّ الله، وكل بيمينك، وكل مما يليك","deen":["سنة السفرة: الحديث اللي النبي ﷺ قاله لطفل","التلقين هنا بييجي جوه اللحظة نفسها مش في درس منفصل: سمِّ بصوت مسموع في كل وجبة قدامه، واحكي له قصة عمر بن أبي سلمة الصغير على سفرة النبي ﷺ: «يا غلام، سمِّ الله، وكل بيمينك، وكل مما يليك» (متفق عليه: البخاري ومسلم). النبي صحح لعمر بجملة حانية واحدة مش بقايمة أوامر — فزوّد السنن لطفلك واحدة واحدة بنفس الحب، وسيب التكرار اليومي على السفرة يعمل شغله."],"skill":"الأكل المستقل المهذب: يقعد على أي سفرة — عزومة، حفلة حضانة، مطعم — وياكل لوحده بشكل مرتب من غير ما حد يقف فوق دماغه، نفس المهارة اللي هتظهر في أول عزومة تروحوها","lvl":2,"ord":19,"tag":"الأكل","src":[["مطبوعة","بطاقات تعليم الطفل آداب الطعام — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A8%D8%B7%D8%A7%D9%82%D8%A7%D8%AA-%D8%A2%D8%AF%D8%A7%D8%A8-%D8%A7%D9%84%D8%B7%D8%B9%D8%A7%D9%85/"],["مطبوعة","فلاش كارد آداب الطعام بالصور للطفل المسلم — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A2%D8%AF%D8%A7%D8%A8-%D8%A7%D9%84%D8%B7%D8%B9%D8%A7%D9%85-%D8%A8%D8%A7%D9%84%D8%B5%D9%88%D8%B1/"]],"mistakes":[{"m":"السفرة بقت محكمة: «إيدك اليمين! اقعد عدل! قول بسم الله! متلعبش في الأكل!» عشر تصحيحات في الوجبة الواحدة — فبقى الأكل معاك وقت متوتر، وهيكره السنن نفسها مش بس الأوامر.","fix":"قاعدة واحدة بتتصحح بإشارة صامتة، والباقي مؤجل لمرحلته. الوجبة اللي فيها ضحك وسنة واحدة مظبوطة أنجح من وجبة مظبوطة كلها من غير نفَس."},{"m":"بتصححله قدام الضيوف: «قول بسم الله! بص ابن طنط أدب إزاي» — التكسيف بيربط السنن بالإحراج، والمقارنة بتخليه يكره ابن طنط والسنة مع بعض.","fix":"قدام الناس: مسة صامتة على الإيد أو ولا حاجة خالص. التذكير كله في البيت، بينك وبينه."},{"m":"انت نفسك بتاكل واقف قدام التلاجة وبتتصفح الموبايل على السفرة — وبتستغرب إن كلامك عن القعود مش شغال.","fix":"هو بيقلد جسمك مش ودانه. أسبوع تعمل فيه السنن قدامه من غير ولا كلمة توجيه، أنفع من شهر تعليمات وانت مش بتعملها."}],"adapt":[{"kid":"كثير الحركة","how":"القعود طول الوجبة هو معركته الأصلية — متبنيش السنن فوق معركة خسرانة. قصّر القعدة المطلوبة: عشر دقايق حقيقية على السفرة أحسن من ساعة حرب. ودور «ريّس السفرة» اللي بيوزع الأطباق ويفكّر الكل — الدور الحركي بيمسكه في الترابيزة أكتر من أي أمر."},{"kid":"العنيد","how":"«كل بإيدك اليمين» المباشرة بتفتح جبهة على طول. معاه بلاش أوامر لحظية خالص: القدوة والإشارة الصامتة والحكاية بس. وحطه في كرسي المعلم: خليه هو اللي يفكّر بابا لو نسي يسمّي — العنيد بينفذ القاعدة اللي هو حارسها."},{"kid":"الحساس","how":"مسة الإيد الصامتة ممكن يحسها عتاب قدام الكل وتقلب كسوف ودموع على السفرة. اتفقوا عليها قبلها في وقت حلو: «دي إشارتنا السرية بيني وبينك — محدش يعرفها غيرنا». كده بتتحول من تصحيح مكشوف لسر بينكم بيضحكوا عليه."}]},
{"name":"إفشاء السلام","cat":"دين وأخلاق","age":[3,12],"how":"السلام بيتاخد قبل ما يتطلب: النبي ﷺ كان بيسلّم على الأطفال بنفسه — فطفلك محتاج ياخد منك السلام مئات المرات الأول، ومن غير إجبار ولا إحراج قدام الضيوف، لحد ما يطلع منه لوحده.","steps":[{"t":"املأ الخزنة الأول — وفهّمه إنها هدية","d":"ابدأ من بكرة: أول ما تدخل عليه أوضته الصبح قول «السلام عليكم يا حبيبي» قبل صباح الخير، ولما ترجع من الشغل سلّم عليه هو الأول قبل ما تحط الشنطة من إيدك — أسابيع كاملة من غير ما تطلب منه رد ولا تعلق لو سكت. وفي وقت لعب هادي فهّمه الكلمة: «لما بقولك السلام عليكم بقولك: بحبك وبدعيلك تفضل سالم بخير». واحكيله إن النبي ﷺ نفسه كان يعدي على العيال وهما بيلعبوا فيسلم عليهم. انت في المرحلة دي بتملى الخزنة بس — والرد بييجي فجأة لوحده.","say":"السلام يعني: بحبك وبدعيلك تبقى بخير"},{"t":"سلام الباب — نربطه بحدث ثابت","d":"اربط السلام بباب الشقة: كل ما ترجعوا من الحضانة أو السوبرماركت، وقفة ثانية واحدة قبل ما تفتح: «بنقول إيه وإحنا داخلين؟». لو نسي ابدأها انت: «السلام علي...» وسيبه يكملها هو. ونفس الحكاية في مكالمات الفيديو مع جده وستّه في مصر: هو اللي يفتتح المكالمة بالسلام عليكم قبل أي كلام. السلام المربوط بحدث ثابت بيبقى عادة زي حط الجزمة في مكانها.","say":"داخلين البيت نقول: السلام عليكم"},{"t":"برة البيت — من غير إحراج قدام الناس","d":"قبل العزومة جهّزه في العربية: «هنلاقي عمو حسن وطنط منى — تحب تسلم عليهم إزاي؟». لو وصلتوا واستخبى ورا رجلك، متقولش «سلّم! ماله مش بيتكسف عادةً» — سلّم انت عنه وكمّل من غير أي تعليق، وتاني يوم مثّلوا المشهد بالدبدوب في البيت. وكل سلام قاله لوحده اوصفه بالظبط: «دخلت وسلمت على الكل لوحدك — نوّرت القعدة».","say":"دخلت وسلمت لوحدك — نوّرت القعدة"}],"mastery":"بيدخل الشقة ويقول «السلام عليكم» زي ما بيحط جزمته في مكانها — عادة مش أمر — وبيرد «وعليكم السلام» على عمو البواب أو زميله في الأسانسير من غير ما حد يبصله.","acts":[{"t":"تمثيلية الضيف والمضيف","mat":"باب الأوضة والدبدوب — من غير مواد تانية","prep":"اتفقوا إن باب الأوضة بقى باب بيت، وجهّز الدبدوب يلعب دور ضيف تالت","run":"مرة هو الضيف اللي بييجي يزور ويسلم، ومرة هو صاحب البيت اللي بيرد ويقول «اتفضل». بعدين دخّلوا الدبدوب ضيف بيغلط — بيدخل من غير ما يسلم — وطفلك هو اللي يعلمه: «الأول نقول السلام عليكم». اللي بيصحح لغيره بيثبت العادة عنده هو."},{"t":"عداد السلامات","mat":"من غير مواد — صوابعكم بس","prep":"قبل ما تنزلوا مشوار الحضانة أو المول، اتفقوا على اللعبة: كل واحد سلمنا عليه أو رد علينا بنعدّه بصباع","run":"عدوا على صوابعكم طول المشوار، وفي آخره شوفوا مين جمع سلامات أكتر: «صوابعك وصلت كام النهارده؟». مش عشان جايزة — عشان اللعبة نفسها بتخلي عينه يدور على مين يسلم عليه بدل ما يستخبى وراك."}],"say":"السلام عليكم — أحلى تحية ندخل بيها أي مكان","deen":["إفشاء السلام: سنة النبي ﷺ مع الأطفال أنفسهم","القدوة قبل الطلب: النبي ﷺ نفسه كان يمر على الصبيان وهما بيلعبوا فيسلم عليهم (حديث أنس — متفق عليه)، وقال: «أفشوا السلام بينكم» (مسلم). فخلّي طفلك ياخد السلام منك يوميًا — سلّم عليه الصبح وعلى عمو البواب قدامه — بالحب والتكرار لحد ما يطلع منه هو. ومتجبروش عليه قدام الضيوف: الكسوف مش معصية."],"skill":"كسر الكسوف وبدء التواصل: يدخل مكان فيه ناس ويقول تحية واضحة ويرد على اللي بيحييه — من الأسانسير للحضانة — وهي أول مهارة تعارف هيستخدمها كل يوم","lvl":1,"ord":15,"tag":"أدب الكلام","src":[["مطبوعة","بطاقات تعليم تحية الإسلام وآداب السلام — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A8%D8%B7%D8%A7%D9%82%D8%A7%D8%AA-%D8%AA%D8%AD%D9%8A%D8%A9-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85/"],["مقال","تحية الإسلام — سلسلة علمني رسول الله ﷺ للأطفال (بالعربي نتعلم)","https://www.belarabyapps.com/%D8%A2%D8%AF%D8%A7%D8%A8-%D8%AA%D8%AD%D9%8A%D8%A9-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85-%D9%84%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84/"]],"mistakes":[{"m":"«سلّم على عمو! هو مش بيتكسف كده عادةً...» قدام الضيف نفسه — الإجبار بيربط السلام بالكسوف، والاعتذار عنه قدامه بيلزّقله وصف «الكسوف» اللي هيعيش فيه.","fix":"سلّم انت عنه وكمّل السهرة عادي من غير ولا تعليق — وتاني يوم العبوا المشهد بالدبدوب في البيت. التدريب في الأمان، مش قدام الجمهور."},{"m":"بتطلب منه اللي انت نفسك مش بتعمله: عمره ما شافك بتسلم على عمو البواب ولا عامل الديليفري، وعايزه يسلم على ضيوفك بحماس.","fix":"أسابيع من السلام قدامه — على البواب باسمه، وعلى الجيران في الأسانسير — قبل أي طلب. هو بينسخ اللي شافه مية مرة، مش اللي اتقاله مرة."},{"m":"بتحاسبه على الرد والخزنة لسه فاضية: «قولتلك السلام عليكم — رد! هو أنا بكلم نفسي؟» — فبيتحول السلام من هدية لواجب متفتش عليه.","fix":"املأ من غير ما تستنى رد خالص — شهر، اتنين، براحته. الرد بيطلع فجأة يوم ما تكون نسيت إنك مستنيه، وساعتها هيبقى بتاعه هو مش بتاعك."}],"adapt":[{"kid":"الخجول","how":"السلام على ضيوف العزومة أصعب مهمة اجتماعية في حياته دلوقتي. ابدأ بالأسهل: يسلم بإيده من غير كلام، أو يقولها لعمو البواب اللي بيشوفه كل يوم — قبل صالون مليان ضيوف. واحسب أي نص خطوة إنجاز كامل واوصفه: «سلمت بإيدك على عمو — هو فرح بيك»."},{"kid":"كثير الحركة","how":"بيطير جوه البيت أو العزومة قبل ما يفتكر أي حاجة اسمها سلام. حوّلها لجزء من الحركة نفسها: وقفة الباب ثانية واحدة بلعبة — «محدش يعدي من الباب غير بكلمة السر: السلام عليكم» — كلمة سر بتفتح الباب، مش قاعدة أدب بتوقف الجري."},{"kid":"عالي الشدة","how":"لو دخل معصب أو راجع مكشر من الحضانة مش هيسلم، ولو جبرته هتولع نوبة. سيب الطلب وقت العواصف خالص — وسلّم انت عليه حتى وهو مكشر: «السلام عليكم يا حبيبي» من غير ما تستنى رد. السلام اللي بيوصله وهو غضبان بيعلّمه إن السلام مش مشروط بالمزاج."}]},
{"name":"آداب الاستئذان","cat":"دين وأخلاق","age":[3,12],"how":"الاستئذان في السن ده تسلسل حركي بيتحفظ باللعب والتكرار: اخبط — قول اسمك — اسأل ممكن أدخل — استنى. وبيثبت لما يتطبق عليه هو كمان: لما انت بتخبط على باب أوضته، بيفهم إنها قاعدة احترام للكل مش قانون ضد الأطفال.","steps":[{"t":"نأسس القاعدة: الباب المقفول بنخبط عليه","d":"في وقت هادي، اشرح بسبب ملموس مش بأمر: «الأوضة المقفولة جواها ناس — ممكن يكونوا بيلبسوا أو نايمين، فبنخبط الأول عشان نحترمهم». وسمّوا الأبواب اللي عندكم واحد واحد: باب أوضة نومكم، باب الحمام، وباب أوضته هو كمان — القاعدة على الكل مش عليه لوحده.","say":"الباب المقفول منفتحوش — بنخبط ونستنى"},{"t":"تمرين الأربع خطوات على باب أوضتكم","d":"استغل لحظة ثابتة بتتكرر كل يوم: لما بييجي الصبح يصحيكم. درّبه على التسلسل: يخبط بشويش تلات خبطات — يقول «أنا فلان، ممكن أدخل؟» — يستنى يسمع «ادخل» — وبعدين يفتح. لو دخل زي الصاروخ زي كل يوم، من غير زعل: «لفة تانية يا بطل — من الخبطة»، وهيعيدها وهو مبسوط لأنها بقت لعبة.","say":"اخبط... قول أنا مين... اسأل ممكن أدخل؟... استنى"},{"t":"الاستئذان على الحاجات مش بس الأبواب","d":"وسّع القاعدة: قبل ما يمسك حاجة مش بتاعته — موبايلك من على الترابيزة، قلم ألوان أخوه، الريموت — يسأل صاحبها «ممكن آخد؟» ويستنى «آه» فعلًا قبل ما يمد إيده. ودرّبها كلعبة على السفرة: كل واحد يطلب حاجة من التاني بالصيغة دي، حتى انت: «ممكن آخد الملاحة يا جميل؟» — لما يشوف الكبار بيستأذنوا بعض، بتبطل قانون ضد الأطفال.","say":"سألت واستنيت الرد — ده الاستئذان بجد"},{"t":"اخبط انت على باب أوضته","d":"أقوى تثبيت إنه يشوف القاعدة بتتطبق ليه هو: قبل ما تدخل أوضته اخبط وقول «ممكن أدخل يا حبيبي؟» واستنى رده بجد حتى لو الباب نص مفتوح. ولو قالك «استنى» — استنى فعلًا: اللحظة اللي بيكتشف فيها إن كلمته بتوقّفك على الباب هي اللحظة اللي بيصدّق فيها القاعدة كلها. ونفس الحكاية مع حاجاته: «ممكن آخد عربيتك أوريها لعمو؟».","say":"ممكن أدخل يا حبيبي؟ — انت كمان ليك باب بيتخبط عليه"},{"t":"نفس الأربع خطوات برة البيت","d":"بعد ما تثبت في البيت، سافر بيها: باب أوضة جده في مصر لما تزوروا، شقة صاحبه في العمارة، عيادة الدكتور. قبل ما تدخلوا أي مكان جديد افتكرها معاه بسؤال مش تلقين: «هنعمل إيه الأول؟». ولما يستأذن قدام حد من غير ما تفكّره، اوصف بعدها من غير مبالغة: «خبطت واستنيت لوحدك — ده أدب حلو».","say":"خبطت واستنيت من غير ما حد يفكّرك — ده أدب حلو"}],"mastery":"بيخبط على باب أوضتكم المقفول ويستنى الرد فعلًا قبل ما يفتح — مش خبطة ودخول في نفس الثانية — وبيسأل «ممكن آخد؟» قبل ما يمد إيده على أي حاجة مش بتاعته، حتى شاحن موبايلك، من غير ما حد يفكره.","acts":[{"t":"لعبة الخبطة","mat":"مخدات وبطانيات من البيت + الدبدوب.","prep":"في وقت لعب هادي في الصالة، كل واحد يعمل لنفسه «بيت»: خيمة مخدات لطفلك، وحتة سجادة ليك انت.","run":"القاعدة المعلنة: محدش يزور بيت التاني غير بالتسلسل الكامل — خبط، قول اسمك، «ممكن أدخل؟»، واستنى الرد فعلًا. بعد كام جولة دخّل الدبدوب كضيف دايمًا بينسى ويقتحم من غير خبط، وطفلك هو اللي يوقفه ويعلّمه من الأول. قول له وسط اللعب: «الدبدوب نسي تاني! ورّيه بنعمل إيه قبل ما ندخل»."},{"t":"صندوق ممكن آخد؟","mat":"صندوق أو كرتونة + حاجات بتوع العيلة: نضارة بابا، توكة ماما، عربية أخوه.","prep":"اجمع الحاجات في الصندوق وقت ما يكون أصحابها موجودين في البيت، عشان مشهد الاستئذان يتمثّل مع صاحب الحاجة الحقيقي.","run":"طفلك يسحب حاجة من الصندوق ويروح لصاحبها يمثّل المشهد كامل: «ممكن آخد نضارتك؟». رتّبوا الردود قبلها في سركم: مرة «آه اتفضل» ومرة «لأ، دي بستخدمها دلوقتي» — عشان يتدرّب على قبول اللأ من غير زعل، وده نص المهارة. لما يقبل اللأ بهدوء قول له: «انت استأذنت زي الكبار، وقبلت اللأ زي الكبار كمان»."}],"say":"نخبط ونستأذن قبل ما ندخل، ونسأل قبل ما ناخد","deen":["الاستئذان: الأدب اللي نزلت فيه آية مخصوص للأطفال","ربنا خصّص في القرآن آية عن استئذان الأطفال جوه البيوت (سورة النور 58-59) — يعني ده أدب رباني مش مجرد ذوق اجتماعي. علّمه بالقدوة واللعب: اخبط انت على باب أوضته زي ما بتطلب منه بالظبط، وخلّي الاستئذان حاجة بتتكرر كل يوم بابتسامة مش أمر بيتقال بعصبية. ومن غير ما تشرح له تفاصيل الأوقات التلاتة اللي في الآية دلوقتي — الحركة الأول، والفقه لما يكبر."],"skill":"ضبط النفس واحترام ملكية الغير: يوقف إيده ثانية ويسأل «ممكن؟» قبل ما ياخد حاجة مش بتاعته — نفس العضلة اللي بتمنع خطف اللعب والخناق في الحضانة.","lvl":1,"ord":16,"tag":"أدب الكلام","src":[["قصة ومقال","قصص عن الاستئذان في الإسلام مكتوبة — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%B5-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%A6%D8%B0%D8%A7%D9%86-%D9%81%D9%8A-%D8%A7%D9%84%D8%A5%D8%B3%D9%84%D8%A7%D9%85/"]],"mistakes":[{"m":"بتخبط على باب أوضته وانت بتفتح في نفس الثانية — الخبطة الشكلية دي بتعلّمه إن الاستئذان حركة فاضية مش انتظار إذن","fix":"اخبط واستنى رده بجد حتى لو خدت ثواني، ولو قال «استنى» استنى فعلًا. هو بيتعلم من اللي بتعمله على بابه هو، مش من اللي بتقوله عن بابك انت."},{"m":"بيسأل «ممكن آخد؟»، بتقول «لأ»، يزن شوية فتقول «طب خد» — كده علّمته إن الاستئذان ديكور وإن الزن هو المفتاح الحقيقي","fix":"فكّر ثانية قبل ما ترد — ولو قلت لأ خليها لأ للآخر. ولو كنت هتوافق أصلًا، قول آه من أول مرة."},{"m":"بتاخد حاجاته هو من غير ما تسأله — تدي لعبته لابن خالته الزاير أو تاخد كراسة رسمه توريها لحد — بحجة إنه صغير","fix":"اسأله زي ما بتحب يسألك: «ممكن أوري رسمتك لتيتة؟» — القاعدة اللي بتحمي حاجاته هو هي اللي هيتمسك بيها."}],"adapt":[{"kid":"كثير الحركة","how":"مشكلته في «استنى» مش في الخبط — بيخبط ويفتح في نفس الحركة. خلّي الانتظار نفسه حركة: بعد الخبطة يحط كفه على الباب ويعد لتلاتة بصوت عالي قبل ما يسأل — العد بيشغل جسمه لحد ما الرد ييجي."},{"kid":"الخجول","how":"بيخبط بصوت القطة ومحدش بيسمعه، فيقف ساكت قدام الباب أو يمشي. العبوا وقت اللعب «خبطة القطة وخبطة الأسد»، ورد عليه بسرعة أول ما يخبط — الصوت اللي اتسمع واتجاوب هو اللي هيعلى المرة الجاية."},{"kid":"العنيد","how":"لو بدأت القاعدة كأوامر عليه هيفتح الأبواب عناد فيك. ابدأ من الناحية التانية: خليه هو صاحب الباب الأول — اخبط انت على بابه واستنى إذنه فعلًا كام يوم، ولما يذوق إن القاعدة بتحميه هو، هيطبّقها من نفسه."}]},
{"name":"أذكار اليوم: النوم والحمام والعطاس","cat":"دين وأخلاق","age":[3,12],"how":"الذكر في السن دي بيتعلم بالاقتران مش بالتسميع: كل ذكر مربوط بلحظته الثابتة — السرير، باب الحمام، العطسة — وطفلك بيلقطه من سماعك بتقوله قدامه كل يوم في نفس اللحظة. التقليد قبل التكليف: هو بيردد وراك، مش بيتحاسب.","steps":[{"t":"ابدأ بذكر واحد: ذكر النوم والنومة اليمين","d":"متحاولش تعلّمه كل الأذكار مرة واحدة — ابدأ بذكر النوم لأنه راكب على روتين موجود أصلًا. بعد الحدوتة وقبل ما تطفي النور، اقلبه بلطف على جنبه اليمين وحط إيده اليمين تحت خده وقوله إن النبي ﷺ كان بينام كده، وقول انت بصوت هادي مسموع: «باسمك اللهم أموت وأحيا». أسبوعين سماع بس من غير ما تطلب منه يعيد — هتلاقيه بدأ يقولها معاك لوحده، وساعتها بس انتقل للذكر اللي بعده.","say":"نام على جنبك اليمين زي ما النبي ﷺ علّمنا — باسمك اللهم أموت وأحيا"},{"t":"ذكر الصحيان: أول جملة في اليوم","d":"الصبح أول ما يفتح عينيه — قبل «يلا هنتأخر على الحضانة» وقبل أي كلام — قول انت وانت بتفتح الستارة: «الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور». نفس الجملة كل يوم في نفس اللحظة، لحد ما أول حاجة بيسمعها في يومه تبقى أول حاجة بيقولها هو. ولو هو اللي صحيك انت، قولها وانت بتفتح عينيك — هو بيراقب.","say":"الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور"},{"t":"دعاء الحمام راكب على تدريب الحمام","d":"طفلك أصلًا في سن التدريب على الحمام، فالأدب بيركب على المهارة وهي بتتعلم. وقّفه عند باب الحمام قبل ما يدخل وقولوا مع بعض: «اللهم إني أعوذ بك من الخبث والخبائث»، ولما يخرج: «غفرانك» وعلى طول غسيل الإيدين بالصابون. حط كارت مصور صغير على باب الحمام من بره يفكّره — الصورة بتشتغل أحسن من التنبيه المتكرر.","say":"قبل ما ندخل الحمام: اللهم إني أعوذ بك من الخبث والخبائث — ولما نخرج: غفرانك"},{"t":"العطسة: أدب ليه رد","d":"لما تعطس انت قدامه، غطّي بوقك بدراعك وقول «الحمد لله» بصوت واضح — وعلّمه إن اللي جنب العاطس بيرد: «يرحمك الله». أول ما يعطس هو ويقول الحمد لله من نفسه، رد عليه فورًا بابتسامة: «يرحمك الله يا حبيبي». كده الذكر بقى حوار بينكم على السفرة وفي العربية وعند جدو — مش واجب بيسمّعه.","say":"اللي يعطس يقول الحمد لله، واللي جنبه يرد: يرحمك الله"}],"mastery":"طفلك بيقول ذكر النوم من نفسه وهو بياخد نومته على الجنب اليمين، وبيقف عند باب الحمام يقول الدعاء من غير ما حد يفكّره، ولما حد يعطس جنبه يقول له «يرحمك الله» تلقائي.","acts":[{"t":"لعبة «الذكر بتاع إيه؟»","mat":"٣ كروت مرسومة أو مطبوعة: سرير، باب حمام، علبة مناديل — وألوان.","prep":"ارسموا الكروت سوا مرة واحدة، والعبوا بيها خمس دقايق قبل النوم — ده كل الوقت اللي محتاجه.","run":"اقلب الكروت على وشها على السجادة، وطفلك يسحب كارت ويقول الذكر بتاعه. لو جاب حتة منه صح، كمّلوا الباقي مع بعض بصوت واحد. قول له مع كل سحبة: «كارت السرير طلع! إحنا بنقول إيه قبل ما ننام؟»."},{"t":"لوحة الأذكار في مكانها","mat":"نفس التلات كروت + سلوتيب.","prep":"بعد ما الكروت تبقى مألوفة من اللعبة، خصصوا يوم تعلّقوها في أماكنها الحقيقية.","run":"علّقوا كل كارت في مكانه: كارت فوق السرير، كارت على باب الحمام من بره، كارت جنب علبة المناديل — هو اللي يختار نقطة اللزق بالظبط ويلزق بإيده. كل ما يعدي على الكارت هيفتكر الذكر من غير ما تقول كلمة واحدة. قول له وانتو بتخلصوا: «انت اللي علّقتهم — دول بقوا بتوعك انت»."}],"say":"لكل لحظة في يومنا كلمة حلوة بنقولها لربنا","deen":["الذكر بيربط يوم طفلك كله بربنا","بالاقتران والتكرار مش بالتسميع: كل ذكر له لحظته وله سنده — ذكر النوم «باسمك اللهم أموت وأحيا» (البخاري) والنومة على الشق اليمين (متفق عليه)، ودعاء دخول الخلاء (متفق عليه)، و«غفرانك» عند الخروج (رواه أبو داود والترمذي والترمذي)، وتشميت العاطس (البخاري). قول انت الذكر بصوت مسموع في لحظته قدامه كل يوم، ولو نسي متلومهوش — ابدأله بأول كلمة وهو هيكمّل لوحده."],"skill":"النظافة الذاتية: يغطي بوقه بدراعه وقت العطس ويغسل إيديه بالصابون بعد الحمام لوحده — نفس العادات اللي الحضانة والمدرسة بيطلبوها منه كل يوم، والأدب الشرعي راكب عليها.","lvl":2,"ord":20,"tag":"النوم","src":[["بطاقات مطبوعة","بطاقات آداب النوم للطفل المسلم — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A8%D8%B7%D8%A7%D9%82%D8%A7%D8%AA-%D8%A2%D8%AF%D8%A7%D8%A8-%D8%A7%D9%84%D9%86%D9%88%D9%85/"],["بطاقات مطبوعة","بطاقات آداب قضاء الحاجة للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A2%D8%AF%D8%A7%D8%A8-%D9%82%D8%B6%D8%A7%D8%A1-%D8%A7%D9%84%D8%AD%D8%A7%D8%AC%D8%A9-%D9%84%D9%84%D8%A7%D8%B7%D9%81%D8%A7%D9%84/"]],"mistakes":[{"m":"بتحوّل الذكر لتسميع: «قول ورايا... لأ غلط، من الأول» — فالذكر بقى امتحان والسرير بقى فصل","fix":"انت قول الذكر صح كل يوم في لحظته وهو هيلقطه زي ما لقط اسمه. التصحيح الوحيد المسموح إنك تكرر انت صح — من غير تعليق على غلطته."},{"m":"بتعلّمه أربع أذكار في نفس الأسبوع، فبيخلطهم ويقول دعاء الحمام وهو داخل ينام","fix":"ذكر واحد بس لحد ما يطلع منه لوحده من غير تفكير — أسبوعين تلاتة — وبعدين اللي بعده. السنة كلها قدامكم."},{"m":"بتقفل حاجة على الذكر: «مش هتنام غير لما تقول الدعاء» — فالذكر بقى بوابة عقاب مش كلمة بيحبها","fix":"لو مقالش، قولها انت عادي وطفي النور وخلاص. الاقتران بيشتغل بالسماع المتكرر — والضغط هو الحاجة الوحيدة اللي بتعطله."}],"adapt":[{"kid":"كثير الحركة","how":"مش هيقف عند باب الحمام وقفة مؤدبة — اقلبها كلمة سر: «الباب مش بيفتح غير بيها»، يخبط عليه ويقولها ويدخل. الذكر اللي راكب على حركة بيثبت عنده أسرع من اللي راكب على وقفة."},{"kid":"الخجول","how":"ممكن يبقى حافظ كويس وصوته ميطلعش قدام الناس — لما جدو يعطس وهو ساكت، متقولش «قول يرحمك الله» قدام الكل. اقبل إنه يوشوشها في ودنك وانت توصلها، وهتعلى لوحدها مع الوقت."},{"kid":"العنيد","how":"«قول الدعاء» هتتقابل ببوق مقفول. متطلبش خالص — قول انت الذكر في لحظته وامشي، وبعد أسبوع اديله الدور المعاكس: «فكّرني أنا لو نسيت». أول ما يصرخ «ماما نسيتي غفرانك!» تبقى وصلت."}]},
{"name":"آداب المسجد","cat":"دين وأخلاق","age":[4,12],"how":"الهدف الأول إن طفلك يحب المسجد — الآداب بتتقال قبل الباب مش بالزعيق جواه، والزيارة القصيرة اللي بتنتهي على لحظة حلوة أنفع من جمعة طويلة بتخلص بتوبيخ. النبي ﷺ صلى وهو شايل طفلة على كتفه — فوجود طفلك في المسجد أصل مش إزعاج.","steps":[{"t":"العبوا مسجد في الصالة الأول","d":"قبل أول زيارة بكام يوم، افرشوا سجادتين في الصالة والعبوا «مسجد»: بنمشي بشويش، بنتكلم بالوشوشة، وبنقف جنب بعض — وبدّلوا الأدوار: مرة هو الإمام ومرة انت. الطفل اللي جرّب القواعد بجسمه في اللعب بينفذها في المكان الحقيقي — اللي بيسمعها أول مرة على باب المسجد بينساها عند أول سجادة.","say":"تعالى نلعب مسجد — نشوف مين فينا يمشي أهدى واحدة؟"},{"t":"اتفقوا على القاعدتين قبل ما تخرجوا","d":"وانتو بتلبسوا لصلاة المغرب أو الجمعة، قوله رايحين فين ومتوقع منه إيه — قاعدتين بس مش ليستة: نمشي بشويش، ونقعد جنب بعض. خليه يعيدهم وراك وانتو في الأسانسير أو العربية. الطفل اللي عارف المطلوب قبل الباب بيقدر ينفذه — اللي بيتقاله «اسكت» جوه بيتلخبط.","say":"إحنا رايحين بيت ربنا — جواه بنمشي بشويش ونقعد جنب بعض"},{"t":"الرجل اليمين ودعاء الدخول","d":"عند باب المسجد وقّف ثانية، وادخل انت برجلك اليمين وقول بصوت مسموع: «اللهم افتح لي أبواب رحمتك». خليها لقطة ثابتة كل مرة — هو هيلاحظ ويقلّد. بعد كام زيارة اسأله قدام الباب: «مين فاكر بنقول إيه؟» وسيبه هو اللي يدخّلكم.","say":"برجلنا اليمين: اللهم افتح لي أبواب رحمتك"},{"t":"صلاة واحدة قصيرة وجنبك على طول","d":"ابدأ بمغرب أو عشا — مش جمعة طويلة. افرش له سجادته الصغيرة جنبك بالظبط وخليه يقلّد حركاتك: يركع لما تركع ويسجد لما تسجد حتى لو مش بيقول حاجة. لو اتحرك أو اتكلم، إيدك بهدوء على كتفه وإشارة «شش» بابتسامة — من غير شد ولا زعيق قدام الناس.","say":"افرش سجادتك جنبي — واعمل زيي"},{"t":"ادّيه دور صغير ثابت","d":"خلّي له مهمة بتتكرر كل زيارة: هو اللي يرص جزمكم في الرف، هو اللي يشيل سجادته بنفسه، وهو اللي يسلم على عمو جاركم في الصف بعد الصلاة. الدور الثابت بيحوله من طفل بيتقاله «اسكت» لواحد من أهل المسجد ليه شغلة فيه — والانتماء ده هو اللي بيطلّع الآداب من جواه.","say":"انت مسؤول الجزم النهارده — كلها تترص في الرف"},{"t":"اقفل الزيارة على لحظة حلوة","d":"اخرجوا وهو لسه مبسوط — قبل ما يتعب ويقلب — وفي طريق الرجوع اعملوا حاجتكم الثابتة: لفة على الكورنيش، عصير من السوبرماركت اللي جنب المسجد، أو حكاية في العربية. المسجد بيتخزن في دماغه بآخر خمس دقايق فيه: لو قفلتوا على ضحكة هيسألك «هنروح تاني إمتى؟»، ولو قفلتوا على توبيخ هيتلكك عشان ميروحش.","say":"انت صليت جنبي زي الكبار — نروح المسجد تاني إمتى؟"}],"mastery":"طفلك بيدخل المسجد برجله اليمين ويقول دعاء الدخول من نفسه، وبيكمل صلاة كاملة جنبك من غير جري ولا كلام عالي — وبيسألك من نفسه: «هنروح المسجد إمتى؟»","acts":[{"t":"مسجد البيت","mat":"سجادتين صلاة من البيت.","prep":"قبل أول زيارة حقيقية، افرشوا السجادتين في ركن الصالة واتفقوا إن مدخل الركن ده «باب» المسجد.","run":"مثّلوا الزيارة كاملة بالترتيب: نقف قدام الباب، ندخل بالرجل اليمين ونقول الدعاء، نمشي بشويش، نقعد جنب بعض. بعدين اقلبوا الأدوار: هو اللي يفهمك القواعد وانت تغلط غلطة مقصودة — تجري مثلًا — وهو يصحّحلك وهو مبسوط. قول له وانت بتغلط: «أنا نسيت! فكّرني — بنمشي إزاي في المسجد؟»."},{"t":"شنطة المسجد بتاعته","mat":"شنطة صغيرة على مقاسه + سجادته الصغيرة وطاقيته ومصحفه الصغير.","prep":"جهزوا الشنطة مع بعض مرة واحدة، وعلّقها في مكان يوصله لوحده.","run":"قبل كل زيارة هو اللي يجهز شنطته بنفسه ويشيلها — الاستعداد نفسه بيبقى طقس بيحبه. الشنطة بتحسسه إنه رايح مكان يخصه هو كمان، مش ماشي ورا الكبار وبس. قول له وانتو خارجين: «شنطتك جاهزة؟ يلا بينا لبيت ربنا»."}],"say":"المسجد بيت ربنا — بندخله فرحانين وبنمشي فيه بشويش","deen":["المسجد بيت الله وطفلك فيه أصل مش دخيل","بالفرح مش بالتحذيرات: النبي ﷺ صلى بالناس وهو شايل أمامة بنت بنته (متفق عليه)، وكان بيخفف الصلاة لما يسمع بكاء طفل (البخاري) — فوجود الأطفال في المسجد سنة قائمة مش إزعاج مسموح بيه. علّمه دعاء الدخول «اللهم افتح لي أبواب رحمتك» (مسلم) بإنك تقوله بصوت مسموع قدامه كل مرة. وخلّي كل زيارة قصيرة وآخرها حلو — عشان المسجد يتربط في قلبه بالفرحة."],"skill":"السلوك المناسب للمكان: يمشي هادي ويوطّي صوته في المكتبة والمستشفى زي المسجد بالظبط، ويحط جزمته في الرف من نفسه — مهارة هيحتاجها في أي مكان عام ليه قواعد.","lvl":3,"ord":19,"tag":"","src":[["بطاقات مطبوعة","بطاقات تعليم آداب المسجد للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A2%D8%AF%D8%A7%D8%A8-%D8%A7%D9%84%D9%85%D8%B3%D8%AC%D8%AF-%D9%84%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84/"],["قصة مصورة","قصة عن آداب المسجد للأطفال — حكايات بالعربي","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%A9-%D8%B9%D9%86-%D8%A2%D8%AF%D8%A7%D8%A8-%D8%A7%D9%84%D9%85%D8%B3%D8%AC%D8%AF-%D9%84%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D9%85%D8%B5%D9%88%D8%B1%D8%A9/"]],"mistakes":[{"m":"أول زيارة في حياته جمعة طويلة — فيقلب في نص الخطبة، وترجعوا متخانقين وتستنتج إنه «لسه صغير على المسجد»","fix":"الغلط في الجرعة مش في الطفل: ابدأ بمغرب — تلات ركعات وخروج على فرحة — وكبّر الجرعة على شهور زي ما بتكبّر أي عضلة."},{"m":"بتشدّه من دراعه أو بتزعقله بصوت مكتوم قدام الرجالة لما يتحرك — فالمسجد بيتربط عنده بالكسوف والتوتر","fix":"إيد هادية على الكتف وإشارة «شش» بابتسامة. ولو زاد عن حده، اخرجوا بهدوء وخلاص — انسحاب هادي أحسن من مشهد قدام الناس."},{"m":"بتستخدم المسجد كجايزة سلوك: «مش هاخدك النهارده عشان مسمعتش الكلام» — فبيتعلم إن المسجد بيتشال زي التابلت","fix":"الزيارة القصيرة بند ثابت مش مكافأة — السلوك ليه أدواته التانية، وبيت ربنا مبيتقفلش في وش طفل."}],"adapt":[{"kid":"كثير الحركة","how":"الوقفة الطويلة أصعب حاجة عليه — فضّي طاقته قبلها: اركنوا أبعد شوية وامشوا آخر حتة على رجليكم، وادّيله المهام الحركية كلها (فرش السجادتين، رص الجزم)، وابدأ بركعتين سنة مش الفرض كله — وزوّد ركعة ركعة."},{"kid":"الخجول","how":"السلام على صف رجالة غرابة عبء تقيل عليه — متلفوش عليهم واحد واحد. يكتفي بسلام واحد على عمو جاركم اللي يعرفه، واقعدوا في طرف الصف مش في نصه، وسيبه ماسك في هدومك أول زيارتين من غير تعليق."},{"kid":"الحساس","how":"صوت الميكروفون المفاجئ ممكن يخضّه ويعيّطه — جهّزه قبل الباب: «هتسمع صوت عالي في السماعة، ده الشيخ بيقرا قرآن». وخلّي أول زيارة في وقت هادي بين الأذان والإقامة، يلف ويشوف المكان فاضي على مهله."}]},
{"name":"حب القرآن وأدب المصحف","cat":"دين وأخلاق","age":[3,12],"how":"في السن دي القرآن بيدخل من الودن مش من الورق: سماع يومي قصير وترديد سماعي لقصار السور — من غير كتابة ولا إلزام. وأدب المصحف بينتقل بالقدوة: طفلك هيعامل المصحف زي ما بيشوفك بتعامله بالظبط.","steps":[{"t":"عرّفه إن المصحف مش أي كتاب","d":"خصصوا للمصحف رف عالي نضيف لوحده في مكتبة البيت، وورّي طفلك انت بتتعامل معاه إزاي: بتمسكه بإيدين نضيفة، مبتحطش عليه كوباية الشاي ولا الموبايل، وبترجعه مكانه. جملة واحدة تكفي: «ده كلام ربنا — أغلى كتاب في بيتنا». الرف العالي نفسه رسالة من غير كلام.","say":"ده كلام ربنا — أغلى كتاب في بيتنا"},{"t":"وقت سماع ثابت قصير","d":"اختار لحظة ثابتة موجودة أصلًا — الطريق للحضانة في العربية، أو قبل حدوتة النوم — وشغّل سورة قصيرة واحدة بس (الإخلاص مثلًا) بصوت قارئ واضح، وردد انت معاها بصوت مسموع. نفس السورة كل يوم لأسابيع — التكرار هو اللي بيحفّظ في السن دي، مش التسميع.","say":"دي سورتنا بتاعة الأسبوع — اسمعها معايا"},{"t":"الترديد آية آية","d":"لما تلاقيه بدأ يكمّل مقاطع لوحده، حوّلها لترديد: انت تقول الآية وهو يعيدها وراك، آية آية، وانتو قاعدين على سريره قبل النوم. لو غلط في كلمة متوقفوش وتصححله كل مرة — كمّلوا، وهو هيظبطها من السماع المتكرر. ولما يتقن السورة خليه يقولها معاك وانتو بتصلوا جنب بعض.","say":"أنا أقول الآية وانت تقولها ورايا"},{"t":"احكي حدوتة السورة","d":"الحب بييجي من الفهم مش من الصوت بس: سورة الفيل فيها حكاية طير صغير رمى حجارة على جيش كبير جاي يهد الكعبة — احكيها له كحدوتة قبل النوم، وبعدها شغّل السورة وشوف عينيه: الكلام بقى له صورة. اعمل كده مع كل سورة بيسمعها — الإخلاص («ربنا واحد»)، الفلق والناس («بنحتمي بربنا») — جملة أو حدوتة صغيرة تدي للسورة معنى.","say":"عارف السورة دي بتحكي عن إيه؟ تعالى أحكيلك"},{"t":"خليه يشوفك بتقرا","d":"أهم خطوة من غير كلام: اقعد على الكنبة بمصحفك واقرا بصوت هادي مسموع في وقت بيشوفك فيه — بعد الفجر أو قبل النوم. جيب له مصحف صغير يخصه هو، وسيبه يقعد جنبك يفتحه ويقلّدك حتى لو مش بيقرا حرف. اللي بيتخزن جواه إن القرآن جزء من البيت ده — مش واجب مدرسة.","say":"تعالى اقعد جنبي بمصحفك — كل واحد يقرا اللي يعرفه"}],"mastery":"طفلك حافظ ٣ أو ٤ سور قصار سماعيًا وبيقولها صح، وبيمسك المصحف بإيدين نضيفة ويرجعه لرفه من نفسه — ولو شاف حاجة متحطة فوق المصحف يشيلها ويقول: «ده كلام ربنا».","acts":[{"t":"كنز السور","mat":"برطمان شفاف + ورق صغير وألوان.","prep":"اكتبوا على البرطمان «كنز فلان» باسم طفلك، وحطوه على رف باين في مستوى نظره.","run":"كل سورة يحفظها، ارسموا مع بعض كارت صغير باسمها وهو اللي يحطه في البرطمان بإيده. كل فترة اقلبوا البرطمان واسحبوا بالدور — اللي يطلع كارته يقول سورته. البرطمان بيكبر قدام عينه فبيشوف إنجازه بنفسه، من غير جوايز ولا مقارنات. قول له وانتو بتقلّبوا: «بص كنزك مليان قد إيه — كل كارت هنا سورة في قلبك»."},{"t":"ركن المصحف ومسؤوليته","mat":"رف واطي يوصله + مفرش نضيف + مصحفه الصغير جنب مصحفك.","prep":"خصصوا الرف مرة واحدة مع بعض، وقول له إنه بقى مسؤوليته هو.","run":"هو اللي يفرش المفرش ويرص مصحفه الصغير جنب مصحفك، ويتطمن كل كام يوم إن مفيش تراب ولا حاجة متحطة فوق المصحف. المسؤولية الصغيرة دي بتحوّل الأدب من أوامر بتتقال لملكية بيحس بيها. قول له: «الرف ده رفك انت — انت اللي بتحافظ على كلام ربنا فيه»."}],"say":"القرآن كلام ربنا — بنسمعه بحب وبنمسك المصحف بأدب","deen":["القرآن غذاء قلب طفلك من الصغر","بالسماع والترديد والحب — من غير إجبار ولا مقارنة بولاد الجيران: النبي ﷺ قال «خيركم من تعلم القرآن وعلمه» (البخاري). خمس دقايق يومية ثابتة أحسن من ساعة كل أسبوع، ولو زهق يوم سيبه من غير عتاب. الأهم إن القرآن يفضل مربوط في قلبه بصوتك ووقتكم الحلو مع بعض — مش بالزنقة والتسميع."],"skill":"الذاكرة السمعية والنطق السليم: يسمع الجملة ويردّدها زي ما هي بمخارج حروف مظبوطة — نفس المهارة اللي هيتعلم بيها الحروف والقراية أول ما يدخل المدرسة.","lvl":3,"ord":20,"tag":"الكتب والقراءة","src":[["قصص مكتوبة","قصص للأطفال عن حب القرآن مكتوبة — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%B5-%D9%84%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D8%B9%D9%86-%D8%AD%D8%A8-%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86-%D9%85%D9%83%D8%AA%D9%88%D8%A8%D8%A9/"],["مقال وأنشطة","فضل تلاوة القرآن .. سلسلة علمني رسول الله ﷺ للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D9%81%D8%B6%D9%84-%D8%AA%D9%84%D8%A7%D9%88%D8%A9-%D8%A7%D9%84%D9%82%D8%B1%D8%A2%D9%86/"]],"mistakes":[{"m":"بتوقّفه قدام الضيوف: «سمّع لعمو سورة الإخلاص» — فالقرآن بيتحول من لحظة دفا بينكم لوقفة امتحان قدام جمهور","fix":"لو حب يسمّع من نفسه أهلًا — إنما عمرك ما تطلبها انت قدام حد. الحب لسه بيتبني، والكسوف بيهدم أسرع ما التكرار بيبني."},{"m":"بتصحّح كل كلمة بينطقها غلط: «مش كده! تاني: قل هو الله...» — فبيبطّل يردد أصلًا عشان ميغلطش","fix":"كمّل معاه من غير وقفة، وكرر انت السورة صح في السماع اليومي — نطقه بيتظبط من ودنه مش من تصحيحك، والطلاقة قبل الدقة في السن دي."},{"m":"مشغّل إذاعة القرآن في البيت طول اليوم كخلفية — فبقى صوت زي صوت التكييف: موجود ومحدش سامعه","fix":"سورة واحدة في لحظة ثابتة وانت بتردد معاها بصوت مسموع — عشر دقايق مقصودة أنفع من عشر ساعات خلفية."}],"adapt":[{"kid":"كثير الحركة","how":"منتظرش منه قعدة سماع مؤدبة على الكنبة — خلّي السماع في كرسي العربية في طريق الحضانة، والترديد وهو بيبني بالمكعبات. الودن شغالة والإيد مشغولة — والحركة وقت القرآن مش قلة أدب في السن دي."},{"kid":"الخجول","how":"بيردد بصوت العصفورة أو في سره — وده مش فشل: خلّي الترديد في حضنك قبل النوم، ودنك جنب بوقه، ومتطلبش منه يعلّي صوته. الصوت الواطي اللي بيحب بيكبر لوحده."},{"kid":"العنيد","how":"«قول ورايا» بتقفل بوقه على طول — متطلبش. قول انت الآية وسيبها ناقصة: «قل هو الله...» وبص له مستني — العنيد بيحب يكمّل اللي محدش أمره بيه. وخليه هو اللي يختار سورة الأسبوع من اللي بيعرفهم."}]},
{"name":"حب الله: ربنا بيحبنا","cat":"دين وأخلاق","age":[3,12],"how":"صورة ربنا عند طفلك بتتبني من جملك اليومية العابرة مش من الدروس: اربط كل حاجة حلوة بربنا اللي خلقها وادّاها. وقاعدة السن دي: ربنا بيحب ويدّي ويحمي بس — التخويف بربنا كأداة تأديب ممنوع نهائي.","steps":[{"t":"اربط الحلو بخالقه","d":"استغل اللحظات العابرة: القمر من شباك العربية، البحر يوم الأجازة، الفراولة اللي بيحبها على السفرة. جملة واحدة قصيرة وخلاص: «شوف القمر ده حلو إزاي! مين خلقه؟ ربنا». من غير درس ولا شرح — عشرين جملة عابرة في الأسبوع أقوى من محاضرة.","say":"كل حاجة حلوة حوالينا — ربنا اللي خلقها"},{"t":"الشكر يتوجه لربنا","d":"على السفرة اسأله: «الأكل الحلو ده جالنا منين؟» وساعده يوصل السلسلة: بابا اشتراه بفلوس شغله، وربنا اللي رزقنا بكل ده — نقول الحمد لله. وبعد يوم حلو — البحر، عيد ميلاد، لعبة جديدة — قبل النوم قولوا مع بعض: «الحمد لله على اليوم الجميل ده». الشكر اللي ليه عنوان بيحوّل «ربنا» من كلمة لعلاقة.","say":"ربنا اللي ادّانا كل ده — الحمد لله يا رب"},{"t":"أسئلته الكبيرة علامة صحة","d":"هييجي اليوم اللي يسألك: «ربنا فين؟ شكله إيه؟ مين خلق ربنا؟» — متتلخبطش ومتقولش «عيب». جاوب ببساطة وثقة: «ربنا فوق، بيشوفنا وبيسمعنا في كل حتة، وبيحبنا — ومحدش خلق ربنا، هو اللي خلق كل حاجة». ولو سؤال وقّفك، قول: «سؤال جميل — تعالى نسأل سوا». الطفل اللي أسئلته بتتقابل بترحيب هيفضل يجيبها لك انت مش لحد تاني.","say":"سؤالك جميل — اسأل براحتك وأنا هجاوبك"},{"t":"اللي عايزه يطلبه من ربنا","d":"علّمه ياخد احتياجاته لربنا على طول: تعبان — «يا رب اشفيني»، خايف من الضلمة — «يا رب احميني»، نفسه في حاجة — يطلبها من ربنا الأول. ارفعوا إيديكم مع بعض قبل النوم وسيبه يقول اللي في قلبه بكلامه هو — مفيش صيغة غلط في الدعاء.","say":"اللي نفسك فيه قوله لربنا — هو سامعك دلوقتي أهو"},{"t":"احمي الصورة وقت الغلط","d":"أصعب اختبار هو لحظة غلطه: لما يكسر كوباية أو يضرب أخوه، عمره ما يسمع منك «ربنا هيغضب منك» أو «هيوديك النار». للتأديب أدواته التانية — النتيجة المنطقية وإصلاح الغلط — إنما اسم ربنا يفضل عنده مربوط بالحب بس. ولو جد أو خالة خوّفه بربنا قدامك، صحّح بهدوء وهو سامع: «لأ، ربنا بيحبه — تعالى نصلح اللي حصل».","say":"ربنا بيحبك حتى وانت بتغلط — تعالى نصلح اللي حصل مع بعض"}],"mastery":"طفلك بيجيب سيرة ربنا من نفسه في لحظات الفرح («ربنا اللي خلق البحر ده؟»)، وبيقول الحمد لله لما يفرح، ولما يخاف أو يحتاج بيطلب من ربنا بتلقائية — واسم ربنا عنده مربوط بالحب مش بالتهديد.","acts":[{"t":"لعبة «مين خلق إيه؟»","mat":"من غير مواد.","prep":"العبوها في العربية أو البلكونة — أوقات الانتظار والمشاوير هي أحسن وقت ليها.","run":"بالتبادل: انت تقول «أنا شايف شجرة — مين خلقها؟» وهو يرد «ربنا!»، وبعدين دوره هو يلاقي حاجة ويسألك. سرّعوا الإيقاع وخلّوها مسابقة ضحك مش درس. الفكرة إن عينه تتعود تشوف خلق ربنا في كل حتة حواليه — فمرة وسّع السؤال: «مين خلق البحر ده كله؟» واستنى عينيه."},{"t":"نعمة النهارده","mat":"من غير مواد — ولو حابين: كراسة صغيرة وألوان تبقى «كراسة الشكر».","prep":"خصصوا دقيقتين ثابتين قبل النوم كل يوم — نفس الوقت ونفس المكان.","run":"كل واحد فيكم يقول حاجة حلوة حصلت له النهارده ويشكر ربنا عليها. ابدأ انت عشان يشوف الشكل: «أنا بشكر ربنا إننا اتغدينا مع بعض». ولو حابين، ارسموا نعمة كل يوم في كراسة الشكر — يرجع لها بعد أسابيع ويتفرج على نعمه كلها."}],"say":"ربنا خلقنا وبيحبنا وبيشوفنا في كل مكان","deen":["ربط القلب بالله: أول بذرة التربية الإيمانية","التحبيب قبل التكليف: النبي ﷺ قال لطفل صغير «يا غلام إني أعلمك كلمات... إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله» (الترمذي — حسن صحيح). قدّم لطفلك ربنا المحب الرازق الحافظ بالتكرار اليومي الهادي: «مين رزقنا الأكل ده؟»، «ربنا اللي خلق البحر ده». وامنع أي تخويف بالنار أو الغضب في السن دي — العلاقة اللي بتتبني بالرعب بتتهد، واللي بتتبني بالحب بتثبت."],"skill":"تسمية الاحتياج والخوف بالكلام: يقول «أنا خايف» أو «أنا محتاج كذا» بدل ما يكتمه جواه — والدعاء بكلامه الحر قبل النوم تمرين يومي على نفس المهارة.","lvl":1,"ord":17,"tag":"","src":[["قصة مصورة","قصة عن حب الله للأطفال: بسم الله أبدأ يومي — حكايات بالعربي","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%A9-%D8%B9%D9%86-%D8%AD%D8%A8-%D8%A7%D9%84%D9%84%D9%87/"],["قصة مصورة","قصة الله خالق كل شيء (قصص العقيدة) — حكايات بالعربي","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%B5-%D8%A7%D9%84%D8%B9%D9%82%D9%8A%D8%AF%D8%A9/"]],"mistakes":[{"m":"بتقول له «ربنا مش بيحب اللي بيعمل كده» لما يغلط — فحب ربنا بقى مشروط وبيروح وييجي مع سلوك طفل ٤ سنين","fix":"حب ربنا ثابت مبينقطعش — اربط الغلط بنتيجته: «الضرب وجع أخوك، تعالى نصلح» — واسم ربنا يفضل بره لحظة التأديب خالص."},{"m":"«ربنا شايفك!» بتتقال بس في لحظات الغلط وبنبرة تهديد — فالعين اللي بتشوفه بقت كاميرا مراقبة مش عين بتحرسه","fix":"قولها في الحلو أضعاف ما بتقولها في الغلط: «ربنا شايفك وانت بتساعد ماما وفرحان بيك» — عشان المراقبة تبقى أمان مش تربص."},{"m":"بتسكّت أسئلته: «عيب! الكلام ده ميتقالش» لما يسأل مين خلق ربنا — فبيتعلم إن ربنا موضوع مقفول ويبطل يسألك","fix":"استقبل أي سؤال بوش مبسوط مهما كان غريب — الإجابة البسيطة مع الترحيب أهم من الإجابة الكاملة."}],"adapt":[{"kid":"الحساس","how":"«ربنا بيشوفك في كل حتة» ممكن تقلقه بدل ما تطمنه، وذكر الموت في دعاء النوم ممكن يفتح أسئلة مخيفة. ركّز معاه على صور الحماية: «ربنا صاحي لك وانت نايم، بيحرسك» — ولو سأل عن الموت جاوب قصير وهادي من غير تفاصيل."},{"kid":"العنيد","how":"ممكن يستفزك بجمل زي «أنا مش شايف ربنا!» — متدخلش في مناظرة ومتعتبرهاش قلة أدب. جرّب الملموس: «شايف الهوا؟ لأ — بس بتحس بيه لما يلعب في شعرك». العنيد بيقتنع بالتجربة مش بالحسم."},{"kid":"عالي الشدة","how":"لما يدعي ربنا يجيب له عجلة ومتجيش، ممكن يزعق «أنا زعلان من ربنا!» — متتخضش ومتعاقبوش على الجملة. سمّي: «انت متضايق إن اللي طلبته مجاش»، واشرح ببساطة إن ربنا سامع كل دعا وساعات بيدينا أحسن منه بعدين — دي علاقة حقيقية بتتبني مش قلة أدب."}]},
{"name":"الرحمة بالأصغر والأضعف","cat":"دين وأخلاق","age":[3,12],"how":"الرحمة بتتعدى بالعدوى مش بالمحاضرة: طفلك بيرحم لما يتعامل هو نفسه برحمة ويشوفك بترحم قدامه. وفي السن دي بتتعلم بالإيد قبل الكلام — لمسة هادية ومهمة حقيقية بتدرّب القلب أكتر من ألف جملة «حن على أخوك».","steps":[{"t":"نسمّي الرحمة لما نشوفها قدامنا","d":"أول خطوة إن كلمة «رحمة» يبقى ليها صورة في دماغه. لما تشيل البيبي بالراحة، أو تشوفوا حد بيعدّي قطة من وسط الشارع، أو في القصة حد ساعد عصفور مكسور — وقّف اللقطة وسمّيها: «شفت شلته بالراحة إزاي؟ دي اسمها رحمة». جملة واحدة وكمّلوا — من غير درس.","say":"دي اسمها رحمة — القلب الكبير بيحنّ على الصغير"},{"t":"ندرّب إيده على اللمسة الهادية","d":"قدام البيبي — أو على دبدوب لو مفيش بيبي في البيت — علّمه اللمسة الصح عمليًا: كف مفتوح على الضهر بالراحة، مش خبط ولا قرص، وامسك إيده وحرّكها معاه أول مرتين. ولما البيبي يكون نايم اعملوا لعبة «الوشوشة»: نمشي على صوابعنا ونتكلم بصوت النملة لحد ما نعدّي الأوضة.","say":"اللي أصغر مننا — إيدنا عليه بالراحة وصوتنا واطي"},{"t":"نديله مهمة رحمة ثابتة بإيده هو","d":"الإحساس بيثبت لما يتحول لشغل حقيقي. خصّص له مهمة متتغيرش: هو اللي يجيب البامبرز وقت التغيير، هو اللي يغطي أخوه الصغير قبل النوم، أو هو اللي يحط المية للقطط اللي تحت العمارة. ولما يعملها صِف اللي حصل من غير تقييم: «غطيت أخوك وهو نايم — دي رحمة».","say":"إيدك الصغيرة دي بتعرف ترحم"},{"t":"الامتحان: لما الصغير يبوظ له حاجة","d":"هييجي اليوم اللي البيبي يهد له البرج اللي تعب فيه أو يشد لعبته من إيده — وهنا الرحمة بتتحن بجد. درّبوا الخطة وهو هادي مش وقت الموقف: الحاجة الغالية بتتحوّش على الرف العالي قبل ما البيبي يصحى، ولو خد حاجة من إيده منضربوش — ننادي: «ماما! البيبي واخد عربيتي!». ولما ينفذها بدل الضرب، سمّي: «اتضايقت ومضربتوش — ناديت».","say":"اللي أصغر منك مش بيفهم زيك — بنحوّش وبنندهلك، مش بنضرب"},{"t":"رحمتك بيه هي الدرس الأكبر","d":"طفلك بيتعلم رحمة الأقوى بالأضعف من طريقة معاملة أقوى واحد في حياته ليه هو: انت. لما يدلق العصير أو يكسر كوباية، نبرتك الهادية — «حصل خير، هات الفوطة نمسح» — بتتخزن جواه كقانون: الكبير بيرحم الصغير حتى في لحظة الغلط. ولما تشوفه بعدها بيعدّي غلطة أخوه الصغير بنفس الجملة، هتعرف إن الدرس وصل.","say":"إحنا الكبار — والكبير بيرحم حتى لو زعلان"}],"mastery":"بيوطّي صوته لوحده لما يعدّي جنب البيبي النايم، ولما اللي أصغر منه يبوظ له حاجة بينده لك أو يشيل لعبته بعيد بدل ما يضرب — من غير ما حد يفكّره.","acts":[{"t":"عيادة الدباديب","mat":"الدبدوب والأرنب من لعبه + إيشارب قديم يبقى رباط + أي حاجة صغيرة تعمل ترمومتر.","prep":"افتحوا «عيادة» في ركن الصالة، ورتّب المشهد: الدبدوب رجله مكسورة والأرنب سخن، والاتنين مستنيين الدكتور.","run":"طفلك هو الدكتور: يشيل العيان بالراحة، يقيس الحرارة، يلف الرباط، وينيمه ويغطيه. انت الممرض اللي بيناوله الأدوات وبيسأل الأسئلة اللي بتوجه إيده: «نشيله إزاي عشان رجله متوجعوش؟». ده تدريب مباشر على الحنية بالإيد — نفس الإيد اللي هتلمس البيبي بعدين."},{"t":"معاد القطط الأسبوعي","mat":"شوية أكل للقطط + ازازة مية + طبق قديم.","prep":"اختاروا يوم ثابت في الأسبوع تنزلوا فيه سوا تحت العمارة.","run":"طفلك هو اللي يحط الأكل والمية في الطبق، وبعدين يبعد خطوتين ويتفرج — من غير ما يلمس القطط ولا يجري وراها. قول له: «إحنا بندّي اللي محتاج ونسيبه في حاله — دي كمان رحمة». بيتعلم إن الرحمة مش حضن بس: ساعات الرحمة إنك تدّي وتبعد."}],"say":"اللي بيرحم اللي أصغر منه — ربنا بيرحمه.","deen":["الراحمون يرحمهم الرحمن","اربط رحمته بحب ربنا مش بالتخويف: لما يغطي أخوه أو يأكّل القطة قول له «اللي بيرحموا الناس ربنا بيرحمهم». والأصل حديث النبي ﷺ «من لا يَرحم لا يُرحم» — قالها لما راجل استغرب إنه بيبوس أحفاده (متفق عليه)، و«ليس منا من لم يرحم صغيرنا» (الترمذي). واحكي له إن النبي ﷺ كان بيخفف الصلاة لو سمع بيبي بيعيّط عشان ميتعبش قلب أمه (البخاري)."],"skill":"التعامل الآمن مع الأصغر: يلمس البيبي بكف مفتوح ويوطّي صوته جنب النايم، ولو الصغير غلط فيه ينادي كبير بدل ما يتصرف بإيده — نفس القواعد اللي هتحميه مع أطفال العيلة والحضانة.","lvl":2,"ord":21,"tag":"التعاطف والمساعدة","src":[["قصص مكتوبة","قصص عن خلق الرحمة للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/قصص-خلق-الرحمة-للاطفال/"]],"mistakes":[{"m":"بتجبره يبوس البيبي ويحضنه قدام الضيوف وهو مكشّر — الرحمة بالعافية بتطلع تمثيلية قدامك وقرصة من وراك","fix":"سيب اللمسة تيجي منه هو، ودرّبها في اللعب على الدبدوب — واكتفي قدام الضيوف إنه واقف جنب البيبي من غير مطالب."},{"m":"بتزعق بعنف عشان خبط البيبي: «انت مالكش قلب؟!» — بتطالبه بالرحمة بنبرة ملهاش رحمة، وهو بيتعلم من نبرتك مش من كلامك","fix":"امسك إيده بهدوء: «مش هسيبك توجعه — وريني اللمسة بالراحة اللي اتدربنا عليها»، والكلام الطويل يستنى لما تهدوا."},{"m":"كل مواقف «الرحمة» بتنتهي إنه هو اللي يتنازل: «سيب اللعبة للبيبي، انت الكبير» — فبيكره الكلمة نفسها لأنها دايمًا بتاخد منه","fix":"الرحمة متبقاش على حسابه دايمًا: حاجاته الغالية على رف عالي محفوظة، والبيبي كمان بيستنى دوره — الرحمة عطية منه مش غرامة عليه."}],"adapt":[{"kid":"كثير الحركة","how":"إيده أسرع من قصده — بيحضن البيبي فيطرحه. ده جسم لسه بيتعاير مش قسوة: درّب اللمسة على الدبدوب عشر مرات قبل ما تسمح بيها على البيبي، وحدد وضعية ثابتة: الحضن قاعد على الكنبة والبيبي بيتحط في حضنه — مش واقف."},{"kid":"عالي الشدة","how":"لما الصغير ياخد لعبته بينفجر ويضرب في ثانية — متستناش منه رحمة في عز النوبة. اشتغل بالوقاية: الحاجات الغالية على الرف قبل ما الموقف يبدأ، وجملة الاستغاثة «ماما! تعالي!» محفوظة ومتدرّب عليها في اللعب لحد ما تسبق إيده."},{"kid":"الحساس","how":"ساعات بيتقمص وجع الأضعف لدرجة إنه هو اللي يعيط — يشوف قطة عرجا فيقعد مكسور. ده استعداد رحمة عالي مش نقطة ضعف: حوّل التأثر لفعل صغير فورًا — «انت حاسس بيها، تعالى نحط لها مية» — الفعل بيطلّع الشحنة وبيعلّمه إن الرحمة شغل مش عياط."}]},
{"name":"الغيرة بين الإخوات","cat":"ذات","age":[3,8],"how":"الغيرة مش قلة أدب ولا قلة حب — دي خوف طفلك على مكانه عندك. ومبتتعالجش بجملة «لازم تحب أخوك»، لكن بتلاتة عمليين: نسمّي الشعور من غير ذنب، وقت محمي ليه لوحده كل يوم، ودور الأخ الكبير القادر — والمقارنة ممنوعة في البيت كله.","steps":[{"t":"نسمّي الغيرة من غير ذنب","d":"لما الضيوف يتلمّوا حوالين البيبي وهداياه، بص على وش طفلك — لو لقيت الضيق، قرّب واحضنه وسمّي: «شايفك متضايق إن كل الناس حوالين البيبي — عادي تحس كده». إوعى تقول «عيب، ده أخوك» — الجملة دي بتخلي الشعور عار يستخبى ويطلع بعدين قرصة في دراع البيبي. الشعور المسموح بيه بيتقال بالكلام؛ المكتوم بيطلع بالإيد.","say":"عادي تزعل وتغير — انت حبيبي زي ما انت، ومحدش خد مكانك"},{"t":"ربع ساعة يومية باسمه هو","d":"خصّص له وقت يومي ثابت ليه لوحده وسمّيه باسمه: «وقت فلان». عشر دقايق لربع ساعة، موبايلك في أوضة تانية، البيبي مع الطرف التاني أو نايم، وهو اللي يختار اللعبة. ولو البيبي عيّط في النص ومفيش خطر — اللي معاه يتصرف وانت كمّل، عشان طفلك يتأكد إن الوقت ده بجد بتاعه.","say":"ده وقتك انت بس — البيبي عنده حد شايله"},{"t":"الأخ الكبير القادر — مش اللي اتزاح من مكانه","d":"حوّل البيبي من منافس لمشروع هو شريك فيه: هو اللي يختار بيجامة البيبي، يجيب الببرونة من المطبخ، يمسك إيده في الصورة. واوصف قدرته: «انت اللي جبت البامبرز — البيبي محظوظ بأخ كبير زيك». ومن غير إجبار: لو رفض يساعد ده حقه، ولعبه الغالي من حقه يحطه على رف عالي — مش لازم يدي كل حاجته للبيبي عشان يثبت إنه «كبير».","say":"البيبي محظوظ إن ليه أخ كبير زيك"},{"t":"قانون البيت: ممنوع المقارنة — على الكل","d":"المقارنة هي وقود الغيرة، فامنعها من مصدرها: مفيش «بص أخوك خلّص أكله وانت لأ»، ومفيش «انت كبرت بقى» كرد على طلبه حضن. وبلّغ جدو وتيتة والضيوف قدامه إن هزار زي «هنسيبك وناخد البيبي» ممنوع في بيتكم. والعدل يبقى محسوس مش كلام: بوسة لده وبوسة لده، ولو في هدية للبيبي يبقى في هدية صغيرة ليه.","say":"كل واحد فيكم حبيبي لوحده — مفيش عندنا أحسن من التاني"},{"t":"لما إيده توصل للبيبي فعلًا","d":"لو حصلت القرصة، تصرفك في اللحظة بيحدد اللي بعدها: امنع بإيد هادية وجملة واحدة — «مش هسيبك توجع البيبي» — من غير صريخ ولا محاضرة. اطمن على الصغير بسرعة ومن غير مشهد درامي، وبعدها بشوية اقعد مع الكبير لوحدكم: «كنت مضايق قوي — إيه اللي حصل؟» وادّيله البديل: «لما تغير تعالى قولي: شيلني أنا». وإوعى تعاقبه بالبعد عنك — الغيرة أصلها خوف يفقد مكانه، والحرمان من حضنك بيثبت الخوف اللي عمل القرصة أصلًا.","say":"مش هسيبك توجعه — وانت لما تضايق تعالى لحضني وقول: شيلني أنا"}],"mastery":"لما البيبي يعيّط بييجي يقولك «البيبي بيعيّط» أو يجيب له اللهاية بدل ما يقرصه، وبيقول «أنا عايزك انت» أو «شيلني أنا كمان» بالكلام — من نفسه ومن غير تدخل.","acts":[{"t":"ألبوم «أنا كمان كنت بيبي»","mat":"صور طفلك وهو رضيع — من الموبايل أو الألبوم.","prep":"اختار وقت هادي مش وقت نوبة غيرة، واقعدوا لوحدكم انتو الاتنين.","run":"اتفرجوا على الصور مع بعض وقول له: «شوف، انت كمان كنا بنشيلك كده ونصحى بالليل عشانك، وكنت بتعيّط بالظبط زي أخوك». بيفهم بعينيه إن الاهتمام اللي البيبي واخده مش حاجة اتسرقت منه — ده نفس اللي هو خده وزيادة. اختموا بتصوير صورة جديدة ليهم هما الاتنين جنب بعض."},{"t":"الدبدوب البيبي بتاعه هو","mat":"دبدوب + بطانية صغيرة.","prep":"قدّم له الدبدوب في وقت هادي وقول له: «ده البيبي بتاعك انت».","run":"سيبه يغيّر له ويلفّه في البطانية ويشيله على كتفه ويطبطب وينيمه جنب سريره. وانت بتلعب معاه قلّد مشاهد من يومكم الحقيقي: «البيبي بتاعك بيعيّط — تعمل إيه؟». اللعب التمثيلي ده بيفرّغ الغيرة وبيدرّب الحنية في نفس الوقت."}],"say":"مكانك في قلبي محفوظ — محدش بياخد حتتك.","deen":["العدل بين الولاد سنّة نبوية","خلّي العدل حاجة تتشاف مش تتقال: بوسة قدام بوسة، وهدية جنب هدية. راجل جه للنبي ﷺ مفضّل ابنه بعطية فقال له: «اتقوا الله واعدلوا بين أولادكم» (متفق عليه). ولما يكبر شوية احكي له قصة إخوات سيدنا يوسف بلغة بسيطة: الغيرة اللي بتتكتم بتكبر وتوجع، واللي جوانا نقوله بالكلام — وآخر القصة يوسف سامحهم وحضنهم."],"skill":"طلب الاحتياج بالكلام: يقول «حضن» أو «شيلني أنا كمان» أو «العب معايا أنا» بدل القرص والتكسير أو الرجوع للببرونة والبامبرز — نفس المهارة اللي هيطلب بيها حقه وسط أي أطفال.","lvl":2,"ord":22,"tag":"الأسرة","src":[["قصص مصورة","قصص مصورة للأطفال عن العائلة (فيها دور الأخ مع أخوه الصغير) — بالعربي نتعلم","https://www.belarabyapps.com/قصص-مصورةعن-العائلة/"]],"mistakes":[{"m":"أول ما يقرص البيبي بتطير للبيبي بحضن وصوت عالي وزعيق للكبير — فبيكتشف إن القرصة أسرع طريقة يجيب كل عينيك عليه، حتى لو غضب","fix":"امنع بهدوء واطمن على البيبي من غير مشهد — والاهتمام الكبير خليه للقعدة مع الكبير على انفراد بعدها."},{"m":"بتحكي قدام الضيوف وهو سامع: «ده بقى بيغير من أخوه موت» — التوصيف قدام الناس بيثبّت عليه الدور وبيخليه يعيش فيه","fix":"غيرته متتحكيش قدامه لحد خالص — الكلام عنها معاه هو لوحدكم، أو مع شريكك بعيد عن وداناته."},{"m":"البيبي بقى سبب كل رفض: «مش دلوقتي عشان البيبي نايم»، «استنى عشان بضّع البيبي» — عشرين مرة في اليوم، فالبيبي في دماغه هو اللي خد منه كل حاجة","fix":"شيل البيبي من صيغة الرفض: بدل «عشان البيبي» قول «هخلص اللي في إيدي وجايلك على طول — انت التالي». نفس التأجيل، من غير ما تحط أخوه في الجملة."}],"adapt":[{"kid":"عالي الشدة","how":"غيرته مش تكشيرة — عضة أو نوبة كاملة وبسرعة. في فترة الذروة (أول شهور البيبي) متسيبهمش لوحدهم في أوضة أبدًا — دي حماية للاتنين مش عقاب — وقسّم وقته الفردي لجرعتين قصيرتين في اليوم بدل ربع ساعة واحدة."},{"kid":"الحساس","how":"مش هيقرص — هيرجع لورا في صمت: يبطل ياكل كويس، يرجع يطلب الببرونة، يعيّط على حاجات تافهة. ده غيرة بصوت واطي مش دلع: زوّد الحضن والشيل من غير تعليق على النكوص — لو طلب يتشال زي البيبي شيله وقول «حبيبي انت» من غير سخرية، وهيرجع لعمره لوحده لما يتطمن."},{"kid":"العنيد","how":"لو شمّ إن أدوار «الأخ الكبير» شغلانة انت فرضتها عليه هيرفضها كلها ويزود العند. اعرض ومتكلفش: «مين هيجيب البامبرز؟» بدل «هات البامبرز» — ولو قعد شهر رافض يساعد خالص، سيبه: بيتفرج وبيقرر لوحده إمتى يدخل، ودخلته اللي بمزاجه بتثبت أكتر من عشر مساعدات بالعافية."}]},
{"name":"الحركة كعادة يومية","cat":"جسد وأمان","age":[3,9],"how":"طفل تحت الخامسة محتاج ٣ ساعات حركة موزعة على اليوم (توصية NHS البريطانية) — وحر الإمارات معناه إن الشقة نفسها لازم تبقى ملعب. القاعدة: الحركة بند ثابت في اليوم زي الأكل والنوم مش رفاهية، والجسم ياخد حقه قبل أي قعدة تركيز أو شاشة.","steps":[{"t":"نسمّي الحركة زي ما بنسمّي الجوع","d":"لما تلاقيه بيتنطط على الكنبة ومش قادر يثبت، متقولش «اهدى» — قول «جسمك جعان حركة، تعالى نطعميه». وبعد جولة جري حط إيده على قلبه: «حاسس بيه بيدق؟ ده جسمك بيقولك شكرًا». كده بيتعلم يقرا إشارات جسمه ويطلبها بالكلام بدل ما يتشخبط على الحيطان.","say":"جسمك بيجوع للحركة زي ما بطنك بتجوع للأكل"},{"t":"دايرة الممر قبل أي قعدة — تلوين أو شاشة","d":"اعمل دايرة ثابتة في ممر الشقة: عشر نطات أرنب، زحف تحت كرسيين من كراسي السفرة، مشي على خط شريط لاصق رايح جاي. والقاعدة اللي بتشغّلها: الجسم ياخد حقه قبل أي قعدة — قبل الحضانة الصبح، قبل التلوين والحروف، وقبل الكرتون: «خلّص جولتك في الممر وتعالى افتح». قولها كترتيب هادي زي «الأكل قبل الحلو» مش كشرط بيتفاصل عليه — وجرّب أسبوع وشوف القعدة اللي بعد الدايرة أطول وأهدى قد إيه.","say":"نشغّل الجسم الأول — وبعدين نقعد نركّز"},{"t":"جولة برة لما الشمس تهدى","d":"الممر بيقوم بالواجب، بس الجري الحقيقي محتاج مساحة: بعد العصر لما الحرارة تنزل، انزلوا الجنينة اللي تحت العمارة أو الممشى — نص ساعة جري وكورة قبل المغرب. وفي عز الصيف اقلب المواعيد بدل ما تلغي: النزلة الصبح بدري قبل الحر، أو حمام السباحة، أو صالة الألعاب المكيفة — الحر عذر لتغيير التوقيت مش لإلغاء الحركة.","say":"الشمس هديت — يلا ناخد جولتنا قبل المغرب"},{"t":"انت بتتحرك معاه — مش بتأمره من على الكنبة","d":"«قوم اتحرك» وانت مبطّط بالموبايل مش هتشتغل. ادخل اللعبة: انت الحصان في سباق الزحف، وانت اللي بتعد النطات بصوت عالي. وفي الحياة اليومية: سلم العمارة بدل الأسانسير لو دور أو اتنين، وركنة العربية أبعد شوية عن باب المول عشان تمشوا. لما يشوف إن الحركة حاجة الكبار بيحبوها — هتبقى طبعه مش واجب عليه.","say":"يلا نتسابق لحد باب الأوضة — أنا وانت"}],"mastery":"بيقوم من نفسه يقول «هلف في الممر وأرجع» لما يحس إن جسمه مليان، وبيخلّص دايرة الصبح من غير تفكير، وبيقبل «الحركة قبل الشاشة» كترتيب طبيعي من غير مفاصلة.","acts":[{"t":"أوضة العوائق","mat":"مخدات + كراسي السفرة + شريط لاصق + الدبدوب.","prep":"ابني المسار في الصالة: مخدات ننط من فوقها، كراسي نزحف تحتها، وشريط لاصق على الأرض نمشي عليه زي الجسر — والبلاط اللي بره الخط «مية» ممنوع نقع فيها.","run":"المهمة: يوصّل الدبدوب من أول المسار لآخره من غير ما يقع في «المية». قول له وهو ماشي: «خلي بالك — اللي بره الخط ده مية!». كل مرة غيّر ترتيب العوائق عشان التحدي ميبطلش جديد."},{"t":"البالونة ما تقعش","mat":"بالونة واحدة.","prep":"انفخ البالونة واخلوا حتة صغيرة من الصالة — ومتقلقش، مفيش حاجة بتتكسر من بالونة.","run":"قاعدة واحدة: البالونة ممنوع تلمس الأرض. اضربوها لفوق بالإيد وبالراس وانتو بتعدّوا بصوت عالي — جولة ليه لوحده، وجولة ليكم سوا بتحاولوا تكسروا رقمكم اللي فات. قول له وانتو بتلعبوا: «وصلنا لعشرة — نقدر نكسر رقمنا؟». جري ونط ولقف، كله في مساحة صالة صغيرة وآمنة."}],"say":"جسمنا أمانة — بنحرّكه كل يوم عشان يفضل قوي.","deen":["المؤمن القوي أحب إلى الله","اربط الحركة بالدين بالفرح مش بالأوامر: النبي ﷺ قال «المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف» (مسلم)، وهو نفسه ﷺ اتسابق جري مع السيدة عائشة (أبو داود). فلما تتسابقوا في الممر قول له: «بنتقوى عشان ربنا بيحب القوي اللي بيقدر يساعد الناس» — كده الحركة في بيتكم سنّة مربوطة بالحب والخدمة."],"skill":"المهارات الحركية الأساسية لسنّه: النط برجلين وبرجل واحدة، التوازن على خط، الزحف، ورمي ولقف كورة خفيفة — الأساس اللي حصة الرياضة وأي لعبة جماعية بعد كده هتتبني عليه.","lvl":2,"ord":23,"tag":"","src":[["أفكار أنشطة","13 فكرة ألعاب حركية للأطفال في الروضة — بالعربي نتعلم (تجاهل اللعبة رقم 11 لأنها بأناشيد)","https://www.belarabyapps.com/أفكار-ألعاب-حركية-للأطفال/"]],"mistakes":[{"m":"حاطط كل الرهان على حصة السباحة أو الجيمناستك الأسبوعية — ساعة واحدة في الأسبوع وانت مطمّن، وهو محتاج تلات ساعات حركة كل يوم","fix":"الحصة إضافة حلوة مش الوجبة الأساسية — الأساس دايرة الممر اليومية وجولة بعد العصر، سبع أيام في الأسبوع."},{"m":"بتفتكر الحركة بس لما يقلب: «نزّلوه يجري بقى عشان هيهد الشقة» — فالحركة بقت مطافي بتطفي حريقة مش وجبة في معادها","fix":"الدايرة في مواعيدها الثابتة قبل ما ينفجر — الجسم اللي واخد حقه بدري مش بيحتاج يهد الكنب بالليل."},{"m":"بتشيل الحركة كعقاب: «مفيش نزلة تحت النهارده عشان اللي عملته» — بتحرم جسمه من احتياج أساسي زي الأكل والنوم بالظبط","fix":"زي ما مش بتعاقبه بحرمانه من الغدا، الحركة برضه متتشالش — العواقب ليها أدوات تانية بعيد عن احتياجات جسمه."}],"adapt":[{"kid":"كثير الحركة","how":"هو مش محتاج تشجيع — محتاج قنوات وقفلة: من غير الدايرة هيطلّع الطاقة في الكنب والسرير. زوّد له الجرعات، وحط في آخر الدايرة «محطة نهاية» ثابتة: نفسين عمار وكوباية مية — عشان جسمه يتعلم يقفل زي ما بيفتح."},{"kid":"الخجول","how":"في الجنينة بيقف على الجنب مش بيدخل وسط الأطفال — فبيرجع من غير ما اتحرك أصلًا. الحركة مش لازم تكون جماعية: سكوتر جنبك على الممشى، سباق انت وهو بس، ودايرة البيت هي رصيده المضمون — والدخلة وسط الأطفال هتيجي لما يبقى مليان طاقة، مش من دفعة."},{"kid":"العنيد","how":"«يلا اعمل الدايرة» بتتقابل بـ«مش عايز» حتى لو جسمه بيتنطط. اقلبها تحدي أو ملكية: «أنا هخلّص العشر نطات قبلك» — أو خليه هو اللي يصمم دايرة النهارده ويختار حركاتها. العنيد بينفذ خطته هو، مش خطتك."}]}
