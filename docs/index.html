{"name":"الأمان مع الغرباء","cat":"جسد وأمان","age":[4,9],"how":"سيناريو محدد ومتمرّن عليه أهم من التحذير العام: تعمل إيه بالظبط لو تهتِ.","steps":[{"t":"خطة «لو تهت» بتلات خطوات","d":"علّم طفلك الخطة في البيت وانتو رايقين، مش وسط زحمة المول: «لو بصيت ملقتنيش — واحد: اقف مكانك متتحركش. اتنين: نادي بصوت عالي: بابا! ماما! تلاتة: لو مجاش حد، دوّر على ماما معاها أطفال أو موظف لابس زي المحل». كررها لحد ما يقولها هو بالترتيب، وقدّمها كخطة زي تمرين الإخلاء في الحضانة — مش كتخويف.","say":"لو تهت: اقف مكانك، نادي عليا، دوّر على أم أو موظف بالزي"},{"t":"اسمه ورقمك لعبة العربية","d":"في مشوار الحضانة اليومي، اعملوا من اسمه الثلاثي ورقم موبايلك إيقاع كلامي بالتصفيق أو العد على الصوابع — مقطع مقطع، وكرروه كل يوم في نفس اللحظة من المشوار. بعد أسبوعين ابدأ الامتحانات الخفيفة في أوقات عشوائية: «لو حد سألك اسمك بالكامل تقول إيه؟».","say":"اسمك إيه بالكامل؟ ورقم بابا/ماما كام؟"},{"t":"بروفة حقيقية في السوبرماركت","d":"في كارفور أو المول، وقّف عربية التسوق جنب الرف واسأله فجأة وبنبرة لعب: «لو بصيت دلوقتي ملقتنيش — تعمل إيه؟». خليه يسمّع التلات خطوات ويشاور بإيده فعلًا: «مين هنا لابس زي المحل؟ فين الكاشير؟». دقيقتين في كل زيارة سوبرماركت بيثبتوا أكتر من محاضرة كل شهر.","say":"ورّيني بإيدك — مين هنا ينفع تطلب منه مساعدة؟"},{"t":"قاعدة «أستأذن الأول» مع الكل","d":"القاعدة الثابتة: محدش ياخده من مكانه أو يديله حاجة — حتى لو عمو جارنا أو حد قال «ماما بعتاني» — غير لما يستأذن بابا وماما الأول. مثّل المواقف: «تعالى معايا، عندي قطط صغيرة في العربية» وخليه يرد بصوت عالي: «أستأذن بابا وماما الأول». وسمّيها قاعدة الاستئذان مش «خطر الغرباء» — إحنا مش بنخوّفه من الناس، بنعلّمه قاعدة زي قواعد المرور.","say":"محدش ياخدك من مكانك — حتى لو تعرفه — غير لما تستأذن بابا وماما الأول"},{"t":"الكبير بيطلب من كبير","d":"علّمه علامة واحدة واضحة: الكبير اللي محتاج مساعدة بجد بيطلبها من كبير زيه — مش من طفل. فلو حد كبير قاله «تعالى ساعدني أدوّر على قطتي» أو «شيل معايا الكيس ده للعربية»، دي بالذات لحظة الوقوف: يرد «أستأذن بابا الأول» ويرجعلك على طول حتى لو الراجل شكله طيب. مثّلوها زي باقي التمثيليات — ومن غير تخويف: معظم الناس طيبين، بس القاعدة بتشتغل مع الكل.","say":"الكبير بيطلب المساعدة من كبير — لو حد كبير طلب منك حاجة، تعالى استأذني الأول"}],"mastery":"في التمثيلية («لو حد قالك تعالى معايا؟») بيجاوب: «أستأذن ماما وبابا الأول».","acts":[{"t":"قافية الاسم والرقم","mat":"من غير مواد — صوتكم وبس.","prep":"قسّم اسمه الثلاثي ورقم موبايلك على مقاطع قصيرة ليها إيقاع كلامي سهل يتحفظ، وخصصوا لها وقت العربية في طريق الحضانة كل يوم.","run":"كرروها بالتبادل: انت تقول مقطع وهو يكمّل اللي بعده، لحد ما تمشي على لسانه لوحدها. لما يحفظها اعمل لعبة «الامتحان المفاجئ»: تسأله فجأة في الأسانسير أو طابور الكاشير وهو يجاوب — من غير جوايز، اللعبة نفسها هي المتعة. قول له: «الكلمات دي كنز — بتوصّلك لبابا وماما من أي مكان»."},{"t":"تمثيلية «لو تهت» في الصالة","mat":"الكنبة والسفرة ووسادة عليها تيشيرت — الصالة هتتحول لمول.","prep":"اتفقوا على المشهد قبل ما تبدأوا: الكنبة محل، السفرة كاشير، والوسادة باللبس هي «الموظف بالزي».","run":"اتفرّقوا في «المول»: هو يقف مكانه، ينادي «بابا! ماما!»، وبعدين يروح للوسادة ويقول: «أنا مش لاقي بابا وماما، ممكن تساعدني؟». اقلبوا الأدوار مرة: انت التايه وهو اللي يفكّرك بالخطوات. اختم بجملة: «انت حافظ الخطة — يبقى المول مش مخيف»."}],"say":"لو تهت، اقف في مكانك ونادي.","deen":["الاستئذان يحمي","الاستئذان أدب علّمه القرآن للبيوت كلها (في سورة النور) — قدّمه لطفلك كقاعدة حماية مش كقيد: «منمشيش مع حد غير بإذن ماما أو بابا — حتى لو بنعرفه». قولها بنفس هدوء أي قاعدة تانية في البيت، من غير حكايات مخيفة عن الخطف، لأن الطفل الخايف بيتشل مش بيتصرف. وطبّقها انت قدامه بالعكس: لما تاخده من عند جدته تستأذنها بصوت مسموع — فيشوف إن الاستئذان نظام الكبار قبل الصغار."],"skill":"معلومات الطوارئ: يحفظ اسمه الثلاثي واسم ماما وبابا ورقم موبايل واحد ويقولهم بوضوح لما يُسأل — المعلومة اللي بتوصّله لأهله لو تاه في مول أو مكان زحمة.","lvl":1,"ord":5,"tag":"السلامة","src":[["قصة · مجاني","أين عمر؟","https://3asafeer.com/ar/read/31/أين-عمر؟"],["مجاني","طفولة آمنة","https://www.belarabyapps.com/%d8%b7%d9%81%d9%88%d9%84%d8%a9-%d8%a2%d9%85%d9%86%d8%a9/"]],"mistakes":[{"m":"بتقوله «متكلمش أي حد غريب أبدًا» — وبعدين لو تاه مش هيقدر يفتح بقه لموظف الأمن ولا لأم جنبه، وهي دي بالظبط اللحظة اللي لازم يكلم فيها غريب.","fix":"بدل «متكلمش غريب»، علّمه يختار مين يكلم: أم معاها أطفال أو موظف بزي المحل — دول الغرباء الآمنين وقت الضياع."},{"m":"بتهدده في المول: «امشي بقى هسيبك هنا» — فبيتخزن عنده إن السيبان عقاب بيعمله بابا، ولو تاه فعلًا ممكن يستخبى منك بدل ما ينفذ الخطة.","fix":"الضياع مشكلة ليها خطة متمرّنين عليها — عمره ما يبقى تهديد. لو عايزه يلحقك، اديله دور: «امسك عربية التسوق معايا»."},{"m":"بعد خبر مرعب شفته، بتقعد تشرح كل حاجة مرة واحدة بنبرة مذعورة — الطفل بيلقط الرعب من صوتك ومش بيحفظ الخطة.","fix":"جرعات صغيرة هادية متكررة: دقيقتين في مشوار السوبرماركت كل أسبوع أنفع من محاضرة ساعة بعد خبر."}],"adapt":[{"kid":"الخجول","how":"نداء «بابا! ماما!» بصوت عالي وكلام موظف غريب — دول أصعب حاجتين عنده بالذات. ركّز على اللي يقدر عليه: الوقوف في المكان (أسهل خطوة وأهمها)، وجملة واحدة قصيرة محفوظة صم: «أنا مش لاقي بابا — رقمه كذا» بدل حوار مفتوح. وزوّد بروفات السوبرماركت — التكرار هو اللي بيفك لسانه."},{"kid":"كثير الحركة","how":"مشكلته الأولى إنه بيفلت ويجري قبل ما أي خطة تشتغل. اربطه بمهمة جسدية في كل مشوار: هو اللي ماسك الليستة أو دافع عربية التسوق — الإيد المشغولة بمهمة مش بتفلت. واتفقوا قبل النزول على لعبة «في نظري دايمًا»: «لو شفتني ببص عليك وشاورت — تشاورلي»."},{"kid":"العنيد","how":"أي قاعدة بتتقال له بيختبرها — هيبعد كام خطوة قصدًا يشوف هتعمل إيه. اقلب الملكية: هو «قائد الأمان» اللي بيسمّع الخطة ويمتحنك انت فيها («طب انت لو تهت يا بابا تعمل إيه؟») — العند بيدوب لما تبقى القاعدة بتاعته هو مش مفروضة عليه."}]},
{"name":"السلامة في الشارع","cat":"جسد وأمان","age":[3,9],"how":"قواعد قليلة جدًا وثابتة وبتتقال كل مرة بنفس الكلمات لحد ما تبقى تلقائية.","steps":[{"t":"الحزام بيتفتح لما أقول انزل","d":"العربية نفسها ليها قاعدتين ثابتتين: الحزام مبيتفتحش غير لما العربية تقف وانت تقول «انزل»، والنزول دايمًا من الباب اللي ناحية الرصيف مش ناحية الشارع — حتى لو قاعد جنب الباب التاني. في مواقف المدرسة والمولات، أخطر ثانية هي اللي بين باب العربية وإيدك — فخلّي التسليم فوري: أول ما رجله تنزل الأرض، إيده في إيدك. لو فتح الحزام قبل الإشارة، العربية بتفضل واقفة ومفيش نزول لحد ما يرجع يقعد ويستنى.","say":"الحزام بيتفتح لما أقول انزل — وبننزل من باب الرصيف"},{"t":"«إيدك في إيدي» بنفس الكلمات","d":"من لحظة ما باب الأسانسير يفتح على الباركينج: مد إيدك وقول نفس الجملة حرفيًا كل مرة — «إيدك في إيدي» — مش «تعالى هنا» مرة و«خلي بالك» مرة، التكرار الحرفي هو اللي بيحوّلها لتلقائية. الباركينج بالذات أخطر من الشارع: العربيات بتطلع من أماكن الركن بالعكس ومبتشوفش طفل قصير. لو سحب إيده، اقف انت عن المشي خالص لحد ما يرجع يمسك — من غير زعيق: المشي نفسه مربوط بالإيد.","say":"إيدك في إيدي — كده بنمشي"},{"t":"وقفة الرصيف بلا استثناء واحد","d":"عند أي رصيف — حتى الشارع الداخلي الفاضي في الكمبوند — قف وقول التسلسل بصوت عالي بنفس الكلمات: «نقف... نبص شمال... نبص يمين... العربية وقفت وشافتنا... نعدي». إوعى تعدي مرة واحدة من غير الوقفة عشان مستعجل — الاستثناء الواحد بيعلّمه إن القاعدة ليها مزاج. بعد أسبوعين هتلاقيه بيفرمل لوحده قبل الرصيف وانت لسه ماشي.","say":"نقف... نبص شمال... نبص يمين... يلا نعدي"},{"t":"لعبة إشارة المرور في الصالة","d":"قص تلات دواير من ورق ملون — أحمر وأصفر وأخضر — والعبوها في الصالة: يجري لما ترفع الأخضر، يقف تمثال على الأحمر، يمشي بالراحة على الأصفر. بعدين اقلبوا الأدوار: هو اللي يرفع الدواير وانت اللي تتحرك — وغلّط غلطة مقصودة عشان يمسكها عليك: «بابا! دي حمرا لازم تقف!». اللي بيصحح القاعدة لغيره بيبقى فاهمها مش حافظها.","say":"الأحمر يعني إيه؟ ورّيني بجسمك"},{"t":"قاعدة الكورة: اللي راح الشارع بيجيبه الكبير","d":"أخطر لحظة مش وانتو ماشيين — هي لما الكورة تفلت وتنزل الشارع ورجليه تجري وراها من غير تفكير. قاعدة واحدة بنفس الكلمات كل مرة: «اللي بينزل الشارع — كورة، سكوتر، أي حاجة — الكبير هو اللي بيجيبه». واتمرنوا عليها فعليًا في الجنينة: ارمي الكورة بعيد قصدًا وقول «الكورة راحت بعيد — مين بيجيبها؟» وخليه يقف وينده لك. الرجل اللي اتمرنت تقف في اللعب هي اللي هتقف في اللحظة الحقيقية.","say":"الكورة راحت الشارع؟ رجلك بتقف — وبتنده للكبير"},{"t":"خليه قائد المشوار المعروف","d":"في المشوار الثابت — من العربية لباب الحضانة أو من البيت للبقالة — اقلب الأدوار: «انت اللي هتوصلني النهارده». هو يمسك إيدك، يوقّفك عند الرصيف، يبص الناحيتين، ويقولك امتى تعدوا — وانت مثّل إنك ناسي القواعد عشان يفكّرك بيها. وبعد ما توصلوا صِف اللي عمله: «انت وقفت عند الرصيف وبصيت شمال ويمين قبل ما نعدي».","say":"انت القائد النهارده — وصّلني بالسلامة"}],"mastery":"بيقف عند الرصيف وبيمد إيده من نفسه قبل ما تطلب.","acts":[{"t":"لعبة إشارة المرور","mat":"ورقة حمرا وصفرا وخضرا (أو تلات أطباق ورق ملونة) ومقص.","prep":"قص تلات دواير بالتلات ألوان، وافتحوا مساحة في الصالة تنفع لجري خفيف.","run":"امسك الدواير زي عسكري المرور، وهو يتحرك حسب اللون: أخضر يجري، أصفر يمشي بالراحة، أحمر يتجمد تمثال. بعد كام جولة بدّلوا الأدوار — هو المرور وانت العربية، وغلّط قصدًا عشان يوقّفك بنفسه. الجملة الثابتة: «في الشارع الحقيقي بنعمل نفس الحاجة — الأحمر وقوف»."},{"t":"مشوار «انت القائد»","mat":"من غير مواد — مشواركم المعروف نفسه.","prep":"اختار مشوار قصير متعوّدين عليه — من الباركينج لباب الحضانة أو للبقالة اللي جنب البيت — وقول له من الأول: «النهارده انت اللي موصّلني — أنا هنسى القواعد وانت تفكرني».","run":"امشي وانت «ناسي»: اتجه ناحية الرصيف من غير وقفة وسيبه يشدك: «لأ! نقف الأول!». خليه هو اللي يعلن إمتى تقفوا وإمتى تعدّوا طول السكة. في آخر المشوار صِف اللي حصل: «وقّفتني عند الرصيف مرتين — انت عارف قواعد الشارع كلها»."}],"say":"إيدك في إيدي.","deen":["إماطة الأذى عن الطريق صدقة","النبي ﷺ علّمنا إن «إماطة الأذى عن الطريق صدقة» (متفق عليه من حديث أبي هريرة) — والمعنى ده بيخلّي الشارع مكان إحنا مسؤولين عنه، مش بس بنعدّي فيه. طبّقها قدامه: لما تشوف قزازة أو فرع شجرة في السكة وتشيله بأمان على جنب، سمّي الفعل: «دي صدقة — شيلنا حاجة كانت ممكن تأذي حد». ولو هو اللي لاحظ حاجة، هو يشاور عليها وانت اللي تشيلها — فيتربى عنده إن حماية نفسه وحماية الناس في الطريق حاجة واحدة ربنا بيحبها."],"skill":"وقفة الرصيف التلقائية: يقف عند حرف الرصيف ويمد إيده لإيدك من نفسه قبل أي عبور — الحركة اللي بتفرق كل يوم في باركينج المول وعند باب الحضانة.","lvl":1,"ord":12,"tag":"السلامة","src":[["قصة · عصافير مميز","إشارة المرور","https://3asafeer.com/ar/read/182/إشارة-المرور"],["قصة · عصافير مميز","احذر يا جواد","https://3asafeer.com/ar/read/254/احذر-يا-جواد"]],"mistakes":[{"m":"بتعدي انت من نص الشارع وهو معاك عشان مستعجل — «مرة واحدة مش هتفرق». بتفرق: هو لسه بيبني القاعدة، والاستثناء الواحد بيقوله إن القواعد ليها مزاج.","fix":"قدامه التزم حرفيًا حتى لو الشارع فاضي والمعاد ضاغط — لحد باب العمارة نفسه."},{"m":"كل التعليم بيحصل وقت الخضة: بيجري، تمسكه، تزعق، خلاص — الطفل بيفتكر خضتك وزعيقك ومش بيفتكر ولا قاعدة.","fix":"وقت الخطر امسكه طبعًا — ده إنقاذ مش تعليم. التعليم بيحصل بعدها بساعة بهدوء، وبالبروفات واللعب في وقت رايق."},{"m":"ماشي جنبه على الرصيف وعينك في الموبايل — هو شايفك وبيتعلم إن الشارع مكان بنسرح فيه، وغير كده انت فعليًا مش هتلحقه لو فلت.","fix":"مشوار الطفل من غير موبايل — قاعدة عليك انت. الشارع وقت انتباه للكبير قبل الصغير."}],"adapt":[{"kid":"كثير الحركة","how":"الإيد والكلام مش كفاية — جسمه أسرع من قواعده. حوّل كل قاعدة لمهمة جسدية: هو «فرامل» العيلة اللي بيقف الأول ويوقّف الكل عند الرصيف، وزوّد جرعات لعبة إشارة المرور في البيت، وفي الأماكن المفتوحة اتفقوا على نقط وقوف: «بنجري لحد الشجرة دي ونقف»."},{"kid":"العنيد","how":"مسك الإيد بالعافية معركة يومية بيكسبها بالزن أو بالفلتان. اديله اختيارين انت موافق عليهم الاتنين: «إيدك في إيدي ولا ماسك عربية التسوق؟» — الاتنين آمنين وهو اللي قرر. وقدّم له دور القائد بدري — العنيد بينفذ القاعدة اللي حاسس إنها بتاعته."},{"kid":"الحساس","how":"لو القواعد اتقالت بنبرة تحذير من العربيات اللي بتخبط، ممكن يتحول لطفل مرعوب يرفض يمشي جنب الشارع أصلًا. قدّمها كمهارة بطولة: «انت عارف إزاي بنعدي» — من غير وصف حوادث ولا صور مخيفة. الثقة بتيجي من البروفات مش من التحذير."}]},
{"name":"الأكل الصحي كاختيار","cat":"جسد وأمان","age":[4,9],"how":"الحياد التام: أنت بتقدّم وهو بيقرر. أي ضغط بيقلب الأكل لساحة معركة.","steps":[{"t":"بدّل لغة الأكل كلها","d":"امسح من البيت «أكل وحش» و«ممنوع» و«لو مخلصتش طبقك مفيش حلو» — الممنوع بيبقى أحلى حاجة، والحلو اللي بيتقدم كجايزة بيبقى هو البطل. اللغة البديلة: «الجزر بيقوّي عينيك»، «العيش بيديك طاقة تجري بيها»، «البسكوت بيفرّحنا وبناخد منه شوية». قدام رف الشيبسي في السوبرماركت قول: «ده من الأكل اللي بيفرّحنا — واخدين منه حاجة النهارده خلاص»، مش «سيبه ده وحش».","say":"فيه أكل بيقوّينا وأكل بيفرّحنا — والاتنين ليهم وقت وقد"},{"t":"مواعيد ثابتة وسفرة واحدة","d":"من غير مواعيد مفيش جوع حقيقي — والطفل اللي رفض الغدا وواخد بسكوت الساعة خمسة عمره ما هيتعشى. تلات وجبات وسناكين في مواعيد شبه ثابتة، والأكل قاعدين على السفرة مش قدام التلفزيون ولا معلقة بتجري وراه في الصالة. اللي مكلش في الغدا بيستنى السناك الجاي — من غير عقاب ولا محاضرة. الجوع الطبيعي بين المواعيد أقوى فاتح شهية، وأصدق من أي إقناع.","say":"مكلتش في الغدا؟ ماشي — السناك الساعة أربعة"},{"t":"إيده في التحضير مش على السفرة بس","d":"اديله مهمة حقيقية في المطبخ كل يوم: يغسل الطماطم في المصفاة، يقطّع الخيار بسكينة بلاستيك، يرص شرايح الجبنة في الطبق. الطفل اللي حضّر السلطة بإيده بيدوقها من غير ما حد يقوله — الفخر بيشتغل مكان الضغط. واقبل النتيجة زي ما هي: خيار متقطع عوجة بيتاكل عادي.","say":"انت اللي عملت الطبق ده — حطه انت في نص السفرة"},{"t":"الجديد جنب المألوف وبسكوت","d":"أي صنف جديد — بروكلي، كوسة، سمك — حطه في طبقه جنب حاجة بيحبها زي المكرونة أو الأرز، ومتقولش عنه ولا كلمة. لو ماكلوش شيله في هدوء تام وقدّمه تاني بعد كام يوم: الصنف الجديد ساعات بيحتاج عشر تقديمات قبل أول تجربة، وده طبيعي مش فشل. الممنوع الوحيد هو الضغط بكل أشكاله: «دوق بس»، «علشان خاطري»، «لقمة واحدة».","say":"ده موجود في طبقك — تاكله لو حبيت"},{"t":"أسبوع كامل بلا تعليق على الكمية","d":"جرّب التقسيمة دي أسبوع كامل: انت مسؤول عن إيه اللي يتقدّم وامتى، وهو مسؤول عن ياكل منه قد إيه — يعني لا «كمّل»، ولا «لقمتين كمان»، ولا نظرة قلق على الطبق اللي مخلصش. لما يقول خلصت، رد بجملة محايدة وشيل الطبق من غير مفاوضات. وكُل انت قدامه نفس الأكل بحب — طفلك بيقلد اللي في طبقك، مش اللي في محاضرتك.","say":"خلصت؟ ماشي — الأكل الجاي على العشا"}],"mastery":"بيسمي الأكل «بيقوّي» و«بنقلل منه» وبيجرب اللي في طبقه.","acts":[{"t":"الطباخ الصغير","mat":"خيارة وطماطم وقطعة جبنة، سكينة بلاستيك، مصفاة، ولوح تقطيع صغير.","prep":"قبل الغدا، رتّب له ركن تحضير على ترابيزة المطبخ في متناوله، وأعلنها من الأول: المهمة كلها بتاعته هو.","run":"هو اللي يغسل في المصفاة، ويقطّع على اللوح، ويرصّ في طبق التقديم، ويحطه بنفسه على السفرة قدام الكل. متلمسش الطبق ولا تظبطه وراه — طبقه العوج أهم من طبقك المظبوط. قول قدام الكل: «السلطة دي هو اللي عملها من الأول للآخر»."},{"t":"لعبة ألوان الطبق","mat":"اللي في التلاجة عادي — طماطم حمرا، خيار أخضر، جبنة بيضا، جزر برتقاني.","prep":"من غير تجهيز خاص — اللعبة بتحصل على سفرة الغدا العادية.","run":"اسأله: «نعد مع بعض كام لون في طبقك النهارده؟» — بنعد الألوان مش اللقم، ومفيش مطلوب منه ياكل أي حاجة. اللي بيحصل لوحده: عشان يزوّد العدد بيطلب لون جديد بنفسه. الجملة الثابتة: «كام لون معاك النهارده؟»."}],"say":"جسمك محتاج إيه دلوقتي؟","deen":["ثلث لطعامك","النبي ﷺ علّمنا إن أحسن الأكل بالتلت: تلت للطعام وتلت للشراب وتلت للنَفَس (حديث رواه الترمذي) — ولطفل السنين دي المعنى يتقال بسيط: «بطنك ليها حق عليك — بناكل لما نجوع وبنقف لما نشبع». خليها عادة سفرة حية مش محاضرة: سمّوا بالله قبل الأكل، ولما تشبع انت قول بصوت مسموع «أنا اكتفيت، الحمد لله» — فيشوف قدامه إن الوقوف عند الشبع أدب بيتعمل مش كلام بيتقال. وأبدًا متربطش الأكل بالذنب أو العقاب — الأكل نعمة بنشكر ربنا عليها، والجسم أمانة بنديله اللي يقوّيه."],"skill":"تحضير الأكل الذاتي: يغسل ويقطّع ويرصّ طبق فاكهة أو خضار بسيط بسكينة بلاستيك من الأول للآخر — نفس الاستقلالية اللي بتخليه يفتح علبة أكله في الحضانة من غير ما يستنى حد.","lvl":2,"ord":14,"tag":"الأكل","src":[["قصة · عصافير مميز","لقمة واحدة فقط","https://3asafeer.com/ar/read/209/لقمة-واحدة-فقط"],["قصة · عصافير مميز","ماذا سيأكل حمد؟","https://3asafeer.com/ar/read/1113/ماذا-سيأكل-حـمد؟"]],"mistakes":[{"m":"«خلّص الخضار عشان تاخد الشوكولاتة» — كده انت رسميًا صنّفت: الخضار شغل والشوكولاتة جايزة. بتعلي قيمة الحلو وبتحوّل الخضار لعقوبة — عكس الهدف بالظبط.","fix":"الحلو بيظهر أحيانًا كجزء عادي من الوجبة أو بعدها — مش مشروط بحاجة، ومش كنز مخبي."},{"m":"المطاردة بالمعلقة والتابلت شغال «عشان المهم يدخل بطنه أكل» — بياكل وهو سرحان، مبيحسش لا بجوع ولا بشبع، وبيتعود إن الأكل حاجة بتتعملّه مش حاجة بيعملها.","fix":"الأكل قاعدين على السفرة ومن غير شاشة. مكلش؟ الطبق بيتشال بهدوء والوجبة الجاية قريبة — جسمه هيظبط نفسه في يومين."},{"m":"بتوصفه قدام الناس وهو سامع: «ده مبياكلش، ده صعب أوي في الأكل» — فبياخد الدور وبيلعبه: أنا الطفل اللي مبياكلش.","fix":"صفر كلام عن أكله قدامه أو قدام الضيوف. هويته في الأكل لسه بتتكتب — متكتبهاش انت غلط."}],"adapt":[{"kid":"العنيد","how":"أي ضغط — حتى النظرة المتفائلة وانت مقدّم البروكلي — بيقلبها معركة إرادات، وهو مستعد يكسبها بالجوع. الحياد الكامل معاه مش نصيحة، ده شرط تشغيل. وزوّد مساحة تحكمه: يغرف لنفسه بالمعلقة الكبيرة، يختار بين صنفين، يرتّب طبقه بنفسه."},{"kid":"الحساس","how":"حساسية القوام والريحة عنده حقيقية مش دلع — البروكلي «المقرف» مقرف فعلًا في بقه. قدّم الصنف الواحد بأشكال مختلفة: مسلوق، مشوي في الفرن، ني بالتغميسة. وخلي التعرف باللمس والشم وقت التحضير في المطبخ خطوة كاملة لوحدها — قبل ما التذوق يبقى مطروح أصلًا."},{"kid":"كثير الحركة","how":"مش هيقعد ربع ساعة على السفرة — بياخد لقمة وبيطير. عشر دقايق قعاد حقيقي أحسن من أربعين دقيقة مطاردة: قصّر الوجبة رسميًا، واديله دور حركي قبلها بيربطه بالسفرة — يرص الأطباق، يوزع المعالق، ينده الكل — فبيوصل وهو جزء من الحكاية مش أسير فيها."}]},
{"name":"الفضول وطرح الأسئلة","cat":"عقل ومهارة","age":[3,10],"how":"«مش عارف، تعالى ندوّر» بتعلّمه إن الجهل بداية بحث مش عيب.","steps":[{"t":"اقلب السؤال عليه الأول","d":"معظم أسئلته انت عارف إجابتها — وهنا الفخ: المعلومة الجاهزة بتقفل التفكير. قبل ما تجاوب، ارمي السؤال عليه: «تفتكر انت ليه السمكة مش بتعيش بره المية؟» واستنى بجد. لو الإجابة خيالية — «عشان بتحب صحابها» — متضحكش ومتصححش بسرعة: قول «فكرة! طب تعالى نشوف» وبعدين قدّم المعلومة. السؤال المرتد بيعلّمه إن دماغه هي أول مكان بيدوّر فيه — قبل بابا وقبل أي حد.","say":"سؤال حلو — طب انت تفتكر إيه؟"},{"t":"«مش عارف» إجابة محترمة","d":"لما يسألك سؤال مش عارف إجابته — «ليه القمر ماشي معانا؟» وانتو راجعين بالليل بالعربية — قاوم الإجابة المخترعة و«عشان كده» اللي بتقفل الباب. قول: «سؤال جامد — والله مش عارف، نوصل البيت وندوّر سوا»، وأول ما توصلوا دوّروا فعلًا ولو دقيقتين. اللي بيتعلمه مش معلومة القمر — بيتعلم إن اللي ميعرفش مش عيب، العيب إنه ميدوّرش.","say":"سؤال جامد — مش عارف والله، تعالى نعرف سوا"},{"t":"دفتر الأسئلة على التلاجة","d":"علّق نوتة صغيرة وقلم بمغناطيس على التلاجة في مستوى نظره. أي سؤال مالوش وقت دلوقتي — انت بتسوق، هو داخل ينام — قوله: «ده سؤال يستاهل الدفتر»، واكتبه قدامه بالحرف وهو شايفك بتكتب. الكتابة نفسها رسالة: أسئلتك غالية لدرجة إننا مش بنسيبها تضيع.","say":"سؤالك ده يستاهل الدفتر — تعالى نكتبه عشان مننساهوش"},{"t":"جاوب سؤال بتجربة بإيده","d":"يوم الأجازة افتحوا الدفتر واختاروا سؤال ينفع يتجرب: «التلج بيروح فين؟» — مكعب تلج في طبق على البلكونة ومكعب في الفريزر، ونتفرج بعد ساعة. «الورد بيشرب منين؟» — عرق كرفس في كوباية مية بلون طعام أحمر ونشوف تاني يوم. هو اللي يعمل الخطوات بإيده، وانت وظيفتك سؤالين بس: «تفتكر هيحصل إيه؟» قبل، و«ليه كده في رأيك؟» بعد.","say":"تفتكر هيحصل إيه؟ نجرب ونشوف بعنينا"},{"t":"وصّله بصاحب التخصص","d":"لما يبقى السؤال في تخصص حد بتقابلوه، خلي السؤال يوصل لصاحبه: «ليه بتحط السماعة على ضهري؟» يسألها للدكتور بنفسه، و«ليه بتقص الشجر؟» لعم الجنايني في الكمبوند. اتفقوا قبل ما تدخلوا: «السؤال ده بتاعك انت — انت اللي هتسأله». لو اتكسف ابدأ انت الجملة وسيبه يكمّلها — المرة الجاية هيسأل لوحده.","say":"ده سؤال لعم الجنايني نفسه — اسأله وأنا واقف جنبك"}],"mastery":"بيسأل «ليه» و«إزاي» كل يوم — وبيستنى الإجابة فعلًا.","acts":[{"t":"تجربة الكرفس الشارب","mat":"عرق كرفس بورقه (أو ورقة كرنب بيضا)، كوباية مية، ولون طعام أحمر من السوبرماركت.","prep":"بالليل قبل النوم: هو اللي يحط اللون في المية ويغرس الكرفس، وسيبوا الكوباية على شباك المطبخ.","run":"اسأله قبل النوم: «تفتكر هنلاقيه إزاي الصبح؟» — وارسموا توقعه على ورقة جنب الكوباية. الصبح هيلاقي العروق اتلوّنت أحمر: قارنوا اللي حصل بالرسمة، وسيبه هو اللي يشرح لماما اللي حصل. الجملة: «شفت؟ سألنا وجربنا فعرفنا»."},{"t":"دفتر أسئلة التلاجة","mat":"نوتة صغيرة وقلم ومغناطيس تلاجة.","prep":"علّق النوتة والقلم على التلاجة، واتفقوا إن أي سؤال ميتجاوبش في وقته يتكتب فيها قدامه بالتاريخ.","run":"يوم الجمعة بعد الفطار «جلسة الدفتر»: هو يختار سؤال واحد وتدوّروا على إجابته سوا — تجربة، صورة، فيديو دقيقة، أو مكالمة لجدو لو السؤال من تخصصه. الجملة الثابتة: «مين معاه سؤال جديد للدفتر؟»."}],"say":"سؤال حلو! نعرف إزاي؟","deen":["اقرأ — أول كلمة نزلت","أول كلمة نزلت من القرآن كانت «اقرأ» (أول سورة العلق) — استخدمها مع طفلك كده: «ربنا بيحب اللي بيسأل وبيتعلم». أسئلته عن ربنا — «ربنا فين؟ ربنا بيشوفني؟» — استقبلها بترحيب حقيقي: «سؤال جميل!»، ولو مش عارف الإجابة قول «مش عارف — نسأل ونعرف مع بعض» بدل ما تتكسف أو تخترع. الممنوع الوحيد هو الزجر: طفل اتنهر عن سؤال في الدين بيبطل يسأل فيه خالص — والباب ده لازم يفضل مفتوح ليك انت بالذات."],"skill":"السؤال المكتمل: يسأل «ليه؟» و«إزاي؟» ويستنى الإجابة فعلًا بدل ما ينط لسؤال جديد — نفس المهارة اللي بتخليه يستفيد من شرح المس في الحضانة بدل ما يسمع نصه.","lvl":3,"ord":13,"tag":"الفضول والعلوم","src":[["قصة · عصافير مميز","لماذا؟ لماذا؟ لماذا؟","https://3asafeer.com/ar/read/1080/لماذا؟-لماذا؟-لماذا؟"],["قصة · عصافير مميز","أسئلة غريبة","https://3asafeer.com/ar/read/514/أسئلة-غريبة"]],"mistakes":[{"m":"في اليوم الطويل بترد «بس بقى كتّرت أسئلة» أو «هو انت هتفضل تسأل؟» — سؤالين زي دول والحنفية بتقفل: الطفل بيتعلم إن أسئلته عبء عليك.","fix":"التعب حقك، بس بدّل الكتم بتأجيل حقيقي: «سؤالك حلو وأنا تعبان دلوقتي — نكتبه في الدفتر ونجاوبه بعد العشا» — والتزم فعلًا."},{"m":"بتألف إجابة عشان تخلص («القمر بينام في السحاب») — هيكتشف بعد سنة إنك كنت بتألف، وساعتها هيشك في إجاباتك الصح كمان.","fix":"«مش عارف والله — نعرف سوا» أشرف وأنفع: بتعلّمه إن الجهل بداية بحث مش عيب."},{"m":"السؤال الصغير بياخد وراه محاضرة عشر دقايق عن الكواكب والجاذبية — فبيتعلم إن السؤال غالي التمن، ويبطل يسأل.","fix":"إجابة قد السؤال: جملة أو جملتين وبس. لو عايز أكتر هيسأل سؤال تاني — وده هو المطلوب أصلًا."}],"adapt":[{"kid":"الخجول","how":"خطوة «اسأل الدكتور بنفسك» فوق طاقته. متلغيهاش — صغّرها: يقولك السؤال في ودنك وانت تقوله بصوت عالي وتنسبه ليه: «آدم بيسأل ليه السماعة على الضهر؟» — ومع التكرار خليه هو اللي يكمّل آخر كلمة، لحد ما ييجي يوم يسأل لوحده."},{"kid":"كثير الحركة","how":"تجربة الكرفس اللي نتيجتها بكره مش هتمسكه. اختار تجارب فورية النتيجة: خلط ألوان في كوبايات، إيه اللي بيعوم وإيه اللي بيغرق في طشت مية — سؤال ونتيجة في نفس الدقيقة. والدفتر خليه هو اللي يرسم فيه علامة استفهام سريعة بدل قعدة كتابة."},{"kid":"العنيد","how":"بيرفض إجابتك وبيصمم على نظريته: «لأ! القمر بيمشي معانا!». متدخلش معركة إقناع بصوتك — خلي التجربة هي الحكم: «ممكن — طب نقف مكاننا ونشوف القمر هيعمل إيه؟». ولو صمم حتى بعد التجربة سيبها من غير «شفت؟ قلتلك» — البذرة اتزرعت، والعنيد بيراجع نفسه لوحده مش قدامك."}]},
{"name":"حل المشكلة قبل النداء","cat":"عقل ومهارة","age":[4,10],"how":"استنى قبل ما تتدخل. كل مشكلة تحلها له، بتاخد منه فرصة تعلّم.","steps":[{"t":"قاعدة «جرّب حاجتين الأول»","d":"أعلن القاعدة في وقت رايق: «قبل ما تنادي ماما أو بابا — جرّب حاجتين». ولما ييجي بعدها صارخ «العلبة مش بتفتح!»، متفتحهاش على طول — اسأل الأول: «جربت إيه؟ طب فيه حاجة تانية تتجرب؟ تلفها؟ تخبطها في الترابيزة بالراحة؟». السؤال ده بيحوّل النداء من طلب إنقاذ لحكاية محاولة — وده الفرق كله.","say":"جربت حاجتين؟ احكيلي جربت إيه الأول"},{"t":"استنى لعشرة — وادخل بأصغر مساعدة","d":"لما تشوفه واقف قدام سوستة الجاكيت اللي مش راضية تقفل، عد في سرك لعشرة قبل أي كلمة أو حركة — أغلب المرات بيحلها عند الثانية السابعة، واللحظة دي بالذات هي اللي بتبني «أنا أقدر». ولو طلب مساعدة بعد ما جرّب فعلًا، ادخل بالسلم: كلمة قبل الإيد («جرب تمسك القماشة من تحت»)، ولو الكلمة مكفتش — أصغر حركة ممكنة: افتح الغطا نص لفة وسيبه هو اللي يكمّل ويحس إنه هو اللي فتح. ولو حسيت إيدك بتتمد لوحدها، حطها ورا ضهرك.","say":"أنا شايفك بتحاول — خد وقتك، ولو احتجتني قولّي"},{"t":"مشكلة صغيرة في متناوله كل يوم","d":"بدل ما تمهّد له كل حاجة، سيب له كل يوم عقبة واحدة على مقاسه: الكوباية بتاعته على رف أعلى شوية فيحتاج يجر الكرسي الصغير، جزمته اتخبطت تحت السرير فيحتاج يقلّب، اللعبة اتفصلت فيحتاج يدوّر على الزرار. المقاس المظبوط: أكبر من مجهود ثانية، وأصغر من إنها تكسّر أعصابه. ولما يحلها صِف الحل نفسه: «جريت الكرسي ووصلت للرف لوحدك».","say":"شكلها مشكلة — تفتكر ليها حل إزاي؟"},{"t":"حكاية الحل على السفرة","d":"خلي سؤال العشا الثابت: «إيه المشكلة اللي حليتها النهارده؟» — وخليه يحكي بالتفصيل: جرب إيه الأول، وإيه اللي نفع في الآخر. واحكي انت مشكلتك بنفس الشكل: «العربية رفضت تدور الصبح، فجربت كذا وبعدين كذا». البيت اللي بيتحكي فيه عن الحلول كل يوم بيطلع طفل أول جملته «هجرّب كده» مش «مامااا».","say":"احكيلي عملتها إزاي بالظبط — من الأول"}],"mastery":"بتسمعه بيقول «هجرب كده» قبل «مامااا» — أغلب المرات.","acts":[{"t":"صندوق العلب المستعصية","mat":"أربع علب مقفولة بطرق مختلفة — برطمان بغطا بيتلف، علبة بكبسة، كيس بسوستة، شنطة صغيرة بإبزيم — وبازل صغير مقسوم أربع حتت.","prep":"حط جوا كل علبة حتة واحدة من البازل، واقفلهم، وقدّمهم له كصندوق واحد.","run":"اقعد بعيد وسيبه يفتح الأربعة بإيده — كل علبة محتاجة حركة مختلفة، وده هو التمرين نفسه. لما يجمع الحتت ويركّب الصورة صِف اللي عمله: «أربع علب بأربع طرق — وانت طلعت حل كل واحدة»."},{"t":"مهمة «أنقذ اللعبة»","mat":"عربيته أو لعبة بيحبها، ومعاها أدوات من البيت: مسطرة طويلة، شمسية مقفولة، مقشة صغيرة.","prep":"التجهيز دقيقة واحدة: زق العربية تحت الكنبة أبعد شوية من دراعه، وحط الأدوات جنب الكنبة — حتى اللي مش هتنفع.","run":"قول له: «العربية محتاجة إنقاذ — إيه اللي ممكن يطوّل دراعك؟» وسيبه يجرب الأدوات واحدة واحدة. لو نادى قبل ما يجرب رجّعه: «جرّب أداة الأول وشوف». وبعد الإنقاذ صِف: «المسطرة نفعت والشمسية لأ — انت جربت لحد ما وصلت»."}],"say":"جرّب إيه ممكن يفتحه؟","deen":["اعقلها وتوكل","الصحابي اللي سأل النبي ﷺ يسيب ناقته من غير ربط ويتوكل على ربنا، قال له: «اعقلها وتوكّل» (حديث رواه الترمذي) — يعني المحاولة والأخذ بالأسباب جزء من الإيمان مش نقص فيه. لطفلك المعنى يتقال بسيط وقت المحاولة نفسها: «بنجرب الأول وبعدين نطلب مساعدة — وربنا بيحب اللي بيحاول». ولما ينجح بعد محاولة، اربط الاتنين ببعض: «انت جربت وربنا وفقك» — فمجهوده ليه قيمة وفضل ربنا حاضر، من غير ما واحدة تلغي التانية."],"skill":"المحاولة قبل الاستنجاد: يجرب حلين مختلفين بإيده قبل ما ينادي عليك — زي ما بيحصل يوميًا مع اللعبة اللي دخلت تحت الكنبة أو السوستة اللي زنقت في شنطة الحضانة.","lvl":4,"ord":7,"tag":"الفضول والعلوم","src":[["قصة · عصافير مميز","أبي! كيف أصلح هذا؟","https://3asafeer.com/ar/read/1644/أبي-كيف-أصلح-هذا؟-اللمبة-المحترقة"],["قصة · عصافير مميز","ماذا أستطيع أن أفعل؟","https://3asafeer.com/ar/read/1223/ماذا-أستطيع-أن-أفعل؟"]],"mistakes":[{"m":"بتحل قبل ما يطلب أصلًا: شايفه بيتعب مع الجزمة فبتلبسهاله وهو ساكت «عشان نلحق» — كل مرة بتعملها بتاخد منه تمرين كامل، وبتقوله من غير كلام: انت مش قدها.","fix":"الاستعجال عدو القيمة دي: حط ربع ساعة زيادة في حساب أي خروجة، واعتبرها تمن التمرين."},{"m":"لما بيغلط في الحل — بيلف الغطا في الاتجاه الغلط — بتصحح فورًا: «لأ مش كده! كده!» — فبيتعلم يستنى تعليماتك بدل ما يجرب.","fix":"سيب المحاولة الغلط تكمل — الغطا اللي اتلف غلط هيعلّمه أكتر من تصحيحك. متتدخلش غير لو هيبوظ حاجة أو هيتأذى."},{"m":"القاعدة شغالة عليه هو بس: مطلوب منه «يجرب حاجتين»، وانت أول ما موبايلك يهنج بتزعق وتستسلم قدامه — وهو بيقلد اللي بيشوفه وقت مشكلتك انت، مش اللي بتقوله وقت مشكلته هو.","fix":"فكّر بصوت عالي قدامه وقت مشاكلك الصغيرة: «الريموت مش شغال... أجرب أقلب البطارية... لأ... أجرب بطارية جديدة» — دي أقوى حصة في القيمة كلها."}],"adapt":[{"kid":"عالي الشدة","how":"الإحباط عنده بيوصل من صفر لمية في ثواني — العلبة اللي مش بتفتح بتترمي في الحيطة قبل المحاولة التانية. حط خطوة تهدئة جوه القاعدة نفسها: «زعلان من العلبة؟ نفس عميق... دلوقتي نجرب حاجتين». وابدأ بمشاكل أسهل من مستواه شوية — هو محتاج رصيد نجاحات قبل ما يستحمل مشاكل على مقاسه."},{"kid":"الحساس","how":"كلمة «جرب لوحدك» ممكن يسمعها «بابا مش عايز يساعدني» وينسحب من المحاولة أصلًا. خليك قريب جسديًا وهو بيحاول — اقعد جنبه من غير ما تتدخل: «أنا قاعد معاك وانت بتجرب». وجودك الصامت هو الأمان اللي بيخليه يجرب."},{"kid":"كثير الحركة","how":"بيسيب المشكلة مش عشان صعبة — عشان حاجة تانية لمعت في عينه بعد تلاتين ثانية. رجّعه بنداء اللعب مش باللوم: «العلبة لسه مستنياك — هتستسلم لها؟». وخلي المشاكل اليومية اللي بتسيبهاله حركية بطبيعتها: يجر الكرسي، يقلّب تحت السرير، يطلع يجيب."}]},
{"name":"الاعتناء بالكتب","cat":"عقل ومهارة","age":[3,10],"how":"كتب قليلة متاحة ومتغيّرة أحسن من مكتبة كبيرة — والقلة بتخلي كل كتاب مهم.","steps":[{"t":"ركن صغير وهو أمينه","d":"خصص رف واطي أو سلة في أوضته فيها أربع كتب بس، أغلفتهم باينة للقدام مش أضهرهم — الغلاف الباين بينده عليه. باقي الكتب اخزنها في دولاب فوق بعيد عن نظره. وآخر كل أسبوع اعملوا طقس التبديل: هو اللي ينقّي أربعة جداد من الدولاب ويرجّع بتوع الأسبوع اللي فات بإيده لمكانهم. ولو فيه مكتبة عامة قريبة منكم، هو اللي يسلّم الكتب المستعارة للموظف بنفسه ويقول شكرًا. الأربعة القليلين بيبقوا معروفين بالاسم وليهم بيت بيرجعوله — المكتبة الكبيرة المكركبة بتعلّم إن الكتب كومة، والركن الصغير بيعلّم إن كل كتاب ليه قيمة.","say":"انت أمين المكتبة — دول أصحابنا الأسبوع ده، وده بيتهم اللي بيرجعوله"},{"t":"التقليب من طرف الصفحة","d":"التقطيع في السن دي أغلبه مش عناد — إيد صغيرة لسه بتتدرب على حركة دقيقة. اقعد جنبه ووريه بحركة بطيئة مبالغ فيها: «بنمسك الصفحة من طرفها اللي تحت... ونقلبها براحة». خليه يتمرن على كتاب كرتون سميك الأول، ولما يتقنها انقلوا لكتب الورق الرفيع. ولما يقلب صح صِف الفعل: «قلبت عشر صفحات والكتاب سليم».","say":"من الطرف... براحة... زي ما بنقلب جناح فراشة"},{"t":"عملية إصلاح مش مشهد عتاب","d":"أول ما صفحة تتقطع متزعقش ومتشيلش الكتاب — أعلن عملية: «الكتاب اتجرح، هاتوا السلوتيب». هو يمسك الصفحة في مكانها بالظبط وانت تلزق، أو بالعكس، وانتو شغالين اتكلموا عن الكتاب كصاحب بيتعالج وهيخف. والكتاب المتعالج ده خليه أول كتاب تقروه بالليل عشان يشوفه رجع زي ما كان. الكتاب اللي صلّحه بإيده بيبقى أعز كتبه — وإيده بتبقى أرحم على الباقيين بعدها.","say":"الكتاب اتجرح — هات السلوتيب نعالجه سوا"}],"mastery":"بيقلّب الصفحات براحة وبيرجّع الكتاب للرف من غير تذكير.","acts":[{"t":"مستشفى الكتب","mat":"سلوتيب شفاف عريض، مقص، الكتب المقطوعة اللي في البيت، وكرتونة مرسوم عليها بلاستر.","prep":"اجمعوا الكتب المجروحة في الكرتونة على مدار الأسبوع، وحددوا سوا «يوم العمليات» — وقت هادي مش مستعجلين فيه.","run":"هو الدكتور المساعد: يمسك الصفحة المقطوعة في مكانها بالظبط، وانت تقص السلوتيب وتلزق. كل كتاب «يخف» يرجع الرف على طول بإيده هو. الجملة الثابتة وانتوا شغالين: «إحنا دكاترة الكتب — مفيش كتاب بيتساب مجروح»."},{"t":"طقس التبديل الأسبوعي","mat":"كتبه نفسها — أربعة على الرف الواطي والباقي في دولاب التخزين.","prep":"رتّب مرة واحدة: أربع كتب بس على رف واطي في مستوى إيده، والباقي متخزن في الدولاب — والموعد الثابت كل جمعة بعد الفطار.","run":"كل جمعة ينزّل الأربعة اللي خلصوا أسبوعهم ويرجّعهم للدولاب بإيده، وبعدين يختار أربعة جداد ويرصهم بالغلاف للقدام. سيبه يقلّب ويتردد براحته — التردد ده قراءة أولى مش لعب. قول له: «اختار أربعة بس — اللي هيسهروا معانا الأسبوع ده»."}],"say":"الكتاب صاحبنا، نحافظ عليه.","deen":["المصحف له مكان","خصّص للمصحف أعلى مكان على الرف — أعلى من كل الكتب — وخلّي طفلك يشوفك بتمسكه بإيدين نضيفة وبتقفله بهدوء وبترجّعه مكانه كل مرة. هات له مصحف صغير بتاعه هو، وقول له: «ده أغلى كتاب في بيتنا، عشان كده مكانه فوق وإيدينا نضيفة لما نمسكه». ربنا قال ﴿ومن يعظّم شعائر الله فإنها من تقوى القلوب﴾ (الحج 32) — والتعظيم ده بيتنقل بالمشاهدة والتكرار مش بالأوامر: كل مرة يشوفك بتتعامل مع المصحف باحترام، بيتعلم إن فيه كتب غالية بنحافظ عليها — ومن المصحف بتتمد العادة لكل الكتب."],"skill":"العناية بالممتلكات: يقلّب صفحات الكتاب من طرفها ويرجّعه مكانه على الرف بعد القراية — نفس العادة اللي هتخلي كتب المدرسة وكراريسه تعيش السنة كلها من غير ما تتقطع.","lvl":3,"ord":14,"tag":"الكتب والقراءة","src":[["قصة · عصافير مميز","أيها القارئ","https://3asafeer.com/ar/read/579/أيها-القارئ"],["قصة · عصافير مميز","لمن هذا الكتاب؟","https://3asafeer.com/ar/read/619/لمن-هذا-الكتاب؟"]],"mistakes":[{"m":"مخبّي الكتب كلها فوق «عشان ميقطعهاش» — فالكتاب بقى حاجة ممنوعة بتتشاف من بعيد، وإيده عمرها ما اتدربت عليه أصلًا.","fix":"سيب كتب الكرتون السميك في متناوله من دلوقتي — الإيد اللي بتتمرن كل يوم هي اللي هتبقى أمينة على كتب الورق الرفيع بعدين."},{"m":"أول ما صفحة تتقطع بتزعق: «شفت؟ عشان مش بتحافظ!» — فبيتعلم يخبّي الكتاب الممزق تحت السرير بدل ما يجيبه يتصلح.","fix":"التقطيع في السن دي إيد لسه بتتدرب مش عناد — أعلن عملية علاج: «هات السلوتيب»، وخليه شريك في اللزق مش متهم في محاكمة."},{"m":"بتشتري عشرين كتاب مرة واحدة وكلهم متكومين في سلة مع اللعب — فالكتاب بقى واحد من الكراكيب، بيتداس عليه على السجادة عادي.","fix":"أربعة بس ظاهرين بأغلفتهم والباقي مخزون بيتبدل كل أسبوع — القلة هي اللي بتدي لكل كتاب اسم ومكان وقيمة."}],"adapt":[{"kid":"كثير الحركة","how":"القعدة الطويلة مع الكتاب مش هتحصل — والمطلوب أصلًا إيد أمينة مش قعدة طويلة. خلي الكتب قصيرة، واديله الأدوار الحركية: هو اللي يجري يجيب كتاب الليلة، وهو اللي يقلب لما توقّف وتقوله «اقلب» — خلي التقليب نفسه هو حركته."},{"kid":"الحساس","how":"لو الصفحة اتقطعت من إيده ممكن يعيط ويرفض يمسك الكتاب تاني عشان «خربه». طمّنه فورًا إن الكتب بتتعالج وبتخف، وخلي عملية السلوتيب طقس هادي بينكم — مش إصلاح مستعجل انت بتعمله لوحدك وهو متكسف على جنب."},{"kid":"العنيد","how":"«بالراحة على الكتاب!» المتكررة هتجيب تقليب أعنف. بدّل الأمر بالمنصب: هو أمين المكتبة والمسؤول عن الركن، والقواعد تطلع منه هو — اسأله: «إيه نظام ركنك؟ الكتاب بيرجع فين؟» — بيحافظ على مملكته اللي بيحكمها أضعاف ما بينفذ تعليماتك."}]},
{"name":"العفو وقبول الاعتذار","cat":"تعامل","age":[3,12],"how":"طفلك اتعلم يقول آسف — دلوقتي بيتعلم النص التاني من الدايرة: يستقبل الاعتذار ويسامح. في السن ده القيمة دي مش بتتشرح، بتتمثل: مشهد بيتكرر قدامه باللعب وفي البيت — حد بيغلط، حد بيعتذر، حد بيسامح، والاتنين بيرجعوا يلعبوا.","steps":[{"t":"نلعبها بالدبدوب الأول","d":"قبل أي موقف حقيقي، اعمل المشهد باللعب على السجادة: الدبدوب يوقّع برج المكعبات بتاع الأرنب ويقول «آسف، معملتش قصدي». وقّف اللعب واسأل طفلك: «الأرنب يعمل إيه دلوقتي؟ يفضل زعلان طول اليوم، ولا يقول مسامحك ونبني البرج تاني؟». خلي الأرنب يسامح ويرجعوا يبنوا مع بعض — المشهد اللي اتحفظ باللعب بييجي جاهز وقت الموقف الحقيقي.","say":"قال آسف — نقول له: مسامحك"},{"t":"أول اعتذار حقيقي — وقّف جنبه","d":"أول ما ابن عمه أو صاحبه في الحضانة يخبط له البرج أو ياخد لعبته ويرجع يقول آسف، انزل لمستوى طفلك واتكلم بصوت هادي: «هو قال آسف. تعرف تقول له مسامحك؟». لو قالها ورجعوا يلعبوا، صف اللي حصل بعدها: «هو غلط، واعتذر، وانت سامحته ورجعتوا تلعبوا — ده اسمه العفو».","say":"مسامحك — تعالى نكمّل لعب"},{"t":"لسه زعلان؟ العفو مش بالعافية","d":"لو قال «لأ! أنا زعلان منه» متعصرش الكلمة منه — «مسامحك» المتقالة بالعافية تمثيلية، والنار اللي جواه شغالة وهتطلع تاني بعد ساعة. سمّي وقفته: «انت لسه زعلان — من حقك، خد وقتك». واديله جملة الوسط يقولها لصاحبه: «أنا زعلان دلوقتي — هسامحك بعد شوية». غالبًا بعد دقايق هتلاقيهم بيلعبوا — ساعتها صف: «هديت وسامحت لوحدك من غير ما حد يقولك».","say":"خد وقتك — ولما تهدى قولها بجد"},{"t":"اللي اتسامح خلص — منفتحوش تاني","d":"العفو الحقيقي مش كلمة «مسامحك» بس — هو إننا منرجعش نعاير بالغلطة. لو بعد ساعة طفلك قال «هو ضربني الصبح»، فكّره بهدوء: «ده خلص — هو اعتذر وانت سامحته، والصفحة دي اتقفلت». وطبّق نفس القاعدة على نفسك: لما تسامح طفلك على كوباية اتكسرت، متجبش سيرتها تاني قدامه أبدًا.","say":"اللي اتسامح خلص — مبنرجعش نفتحه"},{"t":"خليه يشوفك بتسامح","d":"لما طفلك يقول لك آسف، اقبلها بوش مبسوط مش بوش محاضرة: «مسامحك، وأنا فرحان إنك اعتذرت» — وبعدها احضنه واقفل الموضوع فعلًا. وقدامه، لما ماما تقول «آسفة اتأخرت عليكم» يسمع الرد: «ولا يهمك، مسامحك». طفلك بياخد شكل العفو من نبرة صوتك انت، أكتر من أي كلام موجه ليه.","say":"مسامحك — وخلاص، اتقفلت"}],"mastery":"صاحبه يقول له آسف فيرد «مسامحك» ويرجع يلعب معاه فعلًا في نفس الدقيقة — من غير ما يرد الضربة ولا يجي يشتكي لك، ومن غير ما يرجع يجيب سيرة الغلطة بعدها.","acts":[{"t":"مسرحية الغلطة والسماح","mat":"دبدوبين من لعبه.","prep":"وقت هادي على السرير أو السجادة — قبل النوم مناسب جدًا.","run":"مثّل المشهد: دبدوب يدوس على رجل التاني بالغلط ويقول «آسف»، وطفلك ماسك الدبدوب المظلوم — هو اللي يقرر يسامح وهو اللي يقول الجملة. بعدين اقلبوا الأدوار: مرة هو اللي بيعتذر ومرة هو اللي بيسامح، عشان يحس بالجهتين. اختموا كل مشهد بنفس الجملة: «مسامحك، تعالى نلعب»."},{"t":"لعبة الحجر التقيل","mat":"حجر صغير أو كيس رز، مكعبات، وسلة.","prep":"جهّز الحجر والمكعبات في وقت لعب عادي ورايق — مش وقت خناقة ولا زعل.","run":"خليه يحاول يلعب مكعبات وهو ماسك الحجر في إيده — هيلاقي اللعب صعب ومضايقه. قول له: «الزعل اللي بنشيله جوانا زي الحجر ده بالظبط». لما يقول «مسامحك» يرمي الحجر في السلة ويرجع يلعب بإيدين فاضيين — كده «الزعل بيتقّل القلب» بقت حاجة إيده حستها مش كلمة سمعها."}],"say":"قال آسف؟ أقول مسامحك — والزعل مبنشيلوش معانا","deen":["العفو خلق ربنا بيحبه: ﴿وليعفوا وليصفحوا﴾","اربط العفو بحب ربنا مش بالإحراج: «لما بتسامح، ربنا بيحبك وبيغفر لك انت كمان» — من قوله تعالى ﴿وليعفوا وليصفحوا ألا تحبون أن يغفر الله لكم﴾ (النور 22). واحكي له إن النبي ﷺ قال «وما زاد الله عبدًا بعفوٍ إلا عزًا» (مسلم) — يعني اللي بيسامح مش ضعيف، ده اللي قلبه كبير وقدره بيعلى. الجمل دي تتقال وقت المواقف نفسها بالتكرار والحب مش كدرس منفصل — ولما تسامح انت حد قدامه، سمّيها بصوت مسموع عشان يشوف العفو بيتعمل مش بيتشرح."],"skill":"إدارة الخلاف وإصلاح العلاقة: لما صاحبه يقول له آسف يرد «مسامحك» ويرجع يلعب معاه فعلًا بدل ما يقاطع أو يرد بإيده — نفس المهارة اللي بتخلي خناقة الفسحة في المدرسة تخلص في دقيقة بدل ما تبقى عداوة أسبوع.","lvl":3,"ord":15,"tag":"الاعتذار والإصلاح","src":[["قصة","قصة جميلة عن التسامح مكتوبة للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%A9-%D8%B9%D9%86-%D8%A7%D9%84%D8%AA%D8%B3%D8%A7%D9%85%D8%AD-%D9%85%D9%83%D8%AA%D9%88%D8%A8%D8%A9/"]],"mistakes":[{"m":"بتجبره يسامح فورًا قدام الناس: «قول مسامحك بسرعة، عيب!» وهو لسه مكشّر — فبيتعلم إن العفو كلمة بتتقال عشان الكبار يسكتوا، وأول ما تمشوا بيرد الضربة.","fix":"الكلمة من غير هدوء ملهاش قيمة — اسمح بالوقت: «لما تهدى قولها»، ولما تيجي منه بجد سمّيها: «انت سامحت من قلبك»."},{"m":"بتقول له «اللي فات مات» وبعدين انت نفسك بتعاير: «زي ما دلقت العصير امبارح برضه» — فبيشوف إن الصفح عندك أرشيف بيتفتح وقت اللزوم.","fix":"اللي سامحته فيه ميترجعش سيرته أبدًا — طفلك بياخد معنى «الصفحة اتقفلت» من صفحك انت الأول، مش من شرحك."},{"m":"أول ما ييجي شاكي «ضربني!» بتروح مزعق للطفل التاني وخلاص — العقاب نزل، بس دايرة الاعتذار والعفو نفسها عمرها ما اكتملت قدام عينه.","fix":"بعد التهدئة كمّل الدايرة للآخر قدامه: التاني يعتذر، هو يسامح، والاتنين يرجعوا يلعبوا — المشهد الكامل ده هو الدرس، مش الزعقة."}],"adapt":[{"kid":"الحساس","how":"الخبطة بتقعد معاه ساعات، و«خلاص بقى سامحه» بتقوله إن وجعه مش مهم. طوّل مرحلة التسمية الأول: «اتخبطت والكلمة وجعتك من جوه» — وسيب العفو لآخر اليوم لو احتاج. العفو المتأخر الصادق أحسن ألف مرة من السريع المتمثل."},{"kid":"العنيد","how":"«قول مسامحك» أمر مباشر — هيرفضه حتى لو جواه سامح فعلًا. حط القرار في إيده: «انت اللي بتقرر إمتى تسامحه — قولي لما تبقى جاهز». ولما يقرر لوحده صف القرار: «انت اخترت تسامح» — العنيد بينفذ قراره هو، مش قرارك."},{"kid":"عالي الشدة","how":"بيرد الضربة قبل ما كلمة «آسف» توصل ودنه أصلًا. الترتيب عنده مختلف: فصل جسدي وتهدئة الأول — خطوتين بعيد، حضن، نفس — وبعد ما الجسم ينزل من الفوران، ابدأ دايرة الاعتذار والعفو. العفو كلام، والكلام مبيدخلش وقت الولعة."}]},
{"name":"تكوين الصداقات والانضمام للعب","cat":"تعامل","age":[3,12],"how":"الصداقة في السن ده مهارة بتتدرب زي ركوب العجلة، مش حاجة بتحصل لوحدها: جملة انضمام محفوظة + خطوات بسيطة (اقرب، اتفرج، اسأل) + تكرار في مواقف حقيقية. وطفل 3-4 سنين لعبه جنب الأطفال مش معاهم لسه طبيعي — متستعجلش عليه.","steps":[{"t":"جملة الانضمام — بروفة في البيت","d":"في البيت، رصّ الدباديب على السجادة كأنهم بيلعبوا مكعبات، وخلي طفلك يتمرن الخطوات كاملة: يقرّب، يقف ثانية يتفرج، وبعدين يقول «أنا اسمي (اسمه) — ممكن ألعب معاكم؟». اعملها انت الأول بصوتك عشان يسمع النبرة، وبعدين دوره هو. كرروها لحد ما الجملة تطلع من غير تفكير — دي المفتاح اللي هيفتح له أي جنينة.","say":"أنا اسمي (...) — ممكن ألعب معاكم؟"},{"t":"أول محاولة حقيقية — وانت وراه مش بداله","d":"في الجنينة تحت العمارة أو منطقة اللعب في المول، لما يبص على أطفال بيلعبوا رملة، متقولش انت بدلًا منه «ممكن يلعب معاكم؟» — دي شغلته هو. افكّره بالخطوات في ودنه: «اقرب، اتفرج شوية، وبعدين قول جملتك»، ووقف على بعد خطوتين وسيبه. لو اتكسف ورجع لك، مفيش لوم: «انت قربت منهم النهارده — المرة الجاية نقول الجملة».","say":"اقرب، اتفرج، وبعدين قول جملتك"},{"t":"لو قالوا لأ — عندنا خطة تانية","d":"جهّز طفلك إن ساعات الأطفال بيقولوا «لأ، إحنا مكملين» — ودي مش نهاية الدنيا ولا معناها إنهم مش بيحبوه. اتفقوا على خطة ب من قبل ما تحصل: «تلاقي لك لعبة جنبهم، وغالبًا بعد شوية هما اللي هييجوا لك». ولو رجع لك مكسور، سمّي من غير تهويل: «قالوا لأ وده ضايقك — نلعب جنبهم شوية ونشوف؟».","say":"قالوا لأ؟ عادي — نلعب جنبهم، وبعدين نحاول تاني"},{"t":"اعزم صاحب واحد على البيت","d":"الصداقة بتتعمق في البيت مش في الجنينة: اسأله «مين من الحضانة تحب ييجي يلعب معاك؟» واتفق مع أهل الطفل على ساعة ونص بس — الزيارة القصيرة بتخلص والاتنين لسه عايزين كمان، ودي أحسن نهاية. جهزوا سوا قبلها: يختار لعبتين «خاصين» يطلعهم على الرف العالي، ويختار لعبة هيقدمها لصاحبه أول ما يدخل، وهو اللي يصب العصير لضيفه بإيده. وبعد ما الضيف يمشي اسأله: «إيه أحلى حاجة عملتوها سوا؟».","say":"نعزم مين يوم الجمعة؟ انت صاحب البيت"},{"t":"خليك انت أول واحد بيتعرف على الناس","d":"طفلك بيتفرج عليك في الأسانسير وعند البواب وفي الجنينة: لما تقابل أب تاني قول قدامه «أنا والد فلان، ساكنين في الدور الرابع» — هو بيسجل المشهد ده كله. واعمل سؤال ثابت على سفرة العشا: «مين لعبت معاه النهارده؟ كان في حد جديد؟». السؤال الثابت بيخلي التعرف على الناس حاجة العيلة بتفرح بيها مش مهمة تقيلة.","say":"إحنا عيلة بتحب تتعرف على ناس جديدة"}],"mastery":"في مكان لعب جديد، يسيب إيدك ويروح لوحده لأطفال مايعرفهمش، يقول جملة الانضمام بصوت مسموع، ويدخل اللعب — من غير ما تدفعه أو تتكلم بداله.","acts":[{"t":"بروفة الجنينة في الصالة","mat":"مكعبات أو أي لعبة جماعية.","prep":"انت وماما اقعدوا على السجادة العبوا كأنكم أطفال في الجنينة، وطفلك مستني بره باب الأوضة.","run":"يدخل ويطبق الخطوات التلاتة: يقرب، يتفرج شوية، ويقول جملة الانضمام بصوت مسموع: «أنا اسمي… ممكن ألعب معاكم؟». مرة وافقوا على طول، ومرة قولوا «إحنا مكملين» عشان يتمرن على خطة ب من غير ما يتجرح. بعدين اقلبوا الأدوار: هو اللي بيلعب وانت اللي بتيجي تستأذن — وخليه يجرب إحساس إنه يقول «اتفضل العب معانا»."},{"t":"عزومة لعب ساعة واحدة","mat":"لعبه نفسها — لعبتين يختارهم بنفسه للضيف.","prep":"اتفق مع أهل صاحب من الحضانة على ساعة لعب واحدة في بيتكم، وقبلها خلّي طفلك هو اللي يجهز: يختار اللعبتين اللي هيطلعهم للضيف.","run":"يستقبل صاحبه على الباب بنفسه ويقول «أهلًا، تعالى»، وهو اللي يقدم له اللعب. ساعة واحدة بس وتخلص والاتنين لسه مبسوطين — كده أول عزومة تبقى ذكرى حلوة نفسه يعيدها، مش يوم طويل خلص بخناقة."}],"say":"أنا اسمي (...) — ممكن ألعب معاكم؟","deen":["النبي ﷺ كان بيصاحب حتى الأطفال ويسأل عليهم","احكي لطفلك إن النبي ﷺ كان له صاحب صغير اسمه أبو عمير، كان يزوره ويهزر معاه ويسأله عن عصفوره: «يا أبا عمير، ما فعل النُّغَير؟» (متفق عليه) — نبينا نفسه كان بيتعرف على الصغيرين ويصاحبهم. وعلّمه معنى «المؤمن يألف ويؤلف» (رواه أحمد): بيحب الناس والناس بتحبه. والأهم القدوة: لما يشوفك بتسلم وتبتسم وتتعرف على الناس، الصداقة عنده هتبقى مرتبطة بسنة النبي مش بواجب تقيل."],"skill":"التقديم الذاتي: يقول اسمه ويطلب الانضمام لمجموعة بجملة واضحة («أنا اسمي… ممكن ألعب معاكم؟») — نفس المهارة اللي هيحتاجها أول يوم مدرسة وكل أول يوم في حياته.","lvl":2,"ord":16,"tag":"الصداقة والجيرة","src":[["قصص","أجمل 7 قصص مصورة عن الأصدقاء للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%B5-%D9%85%D8%B5%D9%88%D8%B1%D8%A9-%D8%A7%D9%84%D8%A7%D8%B5%D8%AF%D9%82%D8%A7%D8%A1-%D9%84%D9%84%D8%A7%D8%B7%D9%81%D8%A7%D9%84/"]],"mistakes":[{"m":"بتتكلم انت بداله: «ممكن يلعب معاكم يا شباب؟» — الجملة اتقالت واللعب حصل، بس اللي اتعلم فعلًا هو إن صوته مش كافي وإن بابا هو اللي بيفتح الأبواب.","fix":"افكّره بالخطوات في ودنه ووقف على بعد خطوتين — الجملة لازم تطلع من بقه هو، حتى لو استنيت عشر زيارات للجنينة."},{"m":"شايف لعبه جنب الأطفال «فشل» وبتزق فيه: «ما تروح تلعب معاهم! هما بياكلوش» — مع إن اللعب المتوازي في 3-4 سنين مرحلة طبيعية مش مشكلة بتتحل.","fix":"سيبه على الحافة براحته — القرب الجسدي نفسه خطوة كاملة، والدخول بييجي لما هو يبقى جاهز مش لما انت تستعجل."},{"m":"بتقدمه للناس بلقب جاهز: «معلش هو خجول» — فبيلبس اللقب وبيبقى عذره الرسمي: «أنا مش بعرف أكلم حد، أنا خجول».","fix":"صف الموقف مش الطفل: «هو بياخد وقته الأول وبعدين بيلعب» — الوصف ده بيسيب الباب مفتوح، واللقب بيقفله."}],"adapt":[{"kid":"الخجول","how":"الجملة بصوت عالي قدام مجموعة غريبة جبل مش هيطلعه. قسّم السلم: أسبوع هدفه يقرّب ويلعب جنبهم بس، بعدها يبص ويبتسم، والجملة في الآخر. ويفضل يبدأ بطفل واحد مش مجموعة — وعزومة البيت (أرضه هو) تيجي قبل اقتحام الجنينة."},{"kid":"كثير الحركة","how":"مشكلته مش الكسوف — الاقتحام: بيخش يجري في نص لعبتهم فيخرب الرملة ويتطرد. درّبه على وقفة إشارة المرور: «قرب، قف ثانيتين، شوف بيلعبوا إيه، وبعدين اسأل» — الوقفة الصغيرة دي هي كل الفرق بين «تعالى» و«امشي من هنا»."},{"kid":"الحساس","how":"«لأ» واحدة ممكن تقفله أسابيع عن المحاولة. كتّر بروفات الرفض في البيت بالدباديب بنبرة هزار لحد ما «لأ» تبقى صوت مألوف مش صدمة، وبعد أي رفض حقيقي سمّي وجعه الأول، وبعدين فكّره بمرة قالوا له فيها «تعالى»."}]},
{"name":"ضم الآخرين: محدش يتساب لوحده","cat":"تعامل","age":[4,12],"how":"الضم خطوة فوق الصداقة: مش بس أعرف أدخل اللعب — أنا كمان أدخّل غيري. بيتعلم بحاجتين: عين بتتدرب تشوف اللي واقف لوحده، ولسان بيتدرب على جملة الدعوة. والدافع مش أمر «روح العب معاه»، لكن سؤال «هو حاسس بإيه دلوقتي؟».","steps":[{"t":"درّب عينه تشوف اللي لوحده","d":"في الجنينة أو حفلة عيد ميلاد، اقعد جنب طفلك دقيقة واعملوا لعبة الملاحظة بصوت واطي: «بص كده... كل واحد بيلعب مع مين؟ في حد قاعد لوحده؟». أول ما يلاقيه، اسأله عن الإحساس مش عن الفعل: «تفتكر حاسس بإيه دلوقتي؟». متطلبش منه يعمل حاجة لسه — النهارده بنتعلم نشوف بس.","say":"بص حواليك — في حد لوحده؟"},{"t":"جملة الدعوة — تعالى العب معانا","d":"لما يلاحظ طفل واقف لوحده جنب الزحليقة، ادّي له الجملة جاهزة في ودنه: «روح قول له: تعالى العب معانا». لو اتكسف، امشي معاه نص السكة ووقف — الخطوة الأخيرة بإيده هو. وبعد ما يعملها، صف اللي شافه بعينه: «كان قاعد لوحده، وانت ندهت له، وبقى بيضحك — كلمتك انت اللي عملت كده».","say":"تعالى العب معانا"},{"t":"خلّي الضم ثقافة البيت","d":"اعمل انت اللي بتطلبه منه: في العزومة العائلية لما تلاقي ابن خالته الصغير قاعد لوحده على الكنبة، خلي طفلك يشوفك بتقوم تجيبه بنفسك: «تعالى يا حبيبي اقعد معانا». وجيران جداد نقلوا جنبكم؟ خدوا لهم طبق حلو وطفلك ماسكه معاك على الباب. وثبّت على سفرة العشا سؤال أسبوعي: «مين لعبت معاه أول مرة؟ في حد جديد في الحضانة؟» — ولما يحكي إنه ضم حد كان لوحده، اسمع الحكاية باهتمام واضح وطويل: الحكاية اللي بتتسمع باهتمام بتتكرر.","say":"محدش يتساب لوحده — لا في اللعب ولا في القعدة"}],"mastery":"من غير أي تلميح منك، يشوف طفل واقف لوحده في الجنينة أو طفل جديد في الحضانة ويروح له بنفسه يقول «تعالى العب معانا» — وتسمعها منه كحكاية عادية على العشا.","acts":[{"t":"لعبة الدبدوب اللي بره اللعبة","mat":"العرايس والدباديب بتوعه.","prep":"رص العرايس في حلقة كأنهم بيلعبوا مع بعض، وحط دبدوب واحد بعيد في ركن الأوضة.","run":"اسأله: «في حد مش معانا… مين؟» وسيبه هو اللي يكتشفه ويروح يجيبه ويحطه في نص الحلقة ويقول له «تعالى العب معانا». بعدين اقلبوا الأدوار: هو اللي يخبي دبدوب بعيد وانت اللي تدور عليه وتضمه."},{"t":"رسمة ترحيب للجديد","mat":"ورقة وألوان.","prep":"لو في طفل جديد دخل الحضانة، اقعدوا بالليل واعملوا له رسمة أو بطاقة صغيرة بإيد طفلك.","run":"الصبح هو اللي يدي البطاقة للطفل الجديد بنفسه ويقول «دي عشانك». الحاجة اللي شغلتها إيده بتكسر الكسوف عنده هو نفسه — والبطاقة بتديله سبب جاهز يفتح بيه الكلام مع الجديد."}],"say":"محدش يتساب لوحده","deen":["«لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه»","اربطها بإحساسه هو: «انت لما بتقعد لوحدك، بتحب حد ييجي يندهلك؟ يبقى التاني بيحب نفس الحاجة بالظبط». ده معنى حديث النبي ﷺ: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه» (متفق عليه). قولها له وقت الموقف نفسه — وهو شايف الطفل الواقف لوحده — مش كدرس، وبالتكرار الهادي هتبقى منطقه هو مش كلامك انت."],"skill":"الملاحظة الاجتماعية: يبص على مجموعة الأطفال ويلاحظ مين واقف بره الحلقة — في الجنينة أو حفلة عيد ميلاد — نواة الطفل اللي بيكبر يعرف يلمّ فريق حواليه بدل ما يستنى حد يضمه.","lvl":3,"ord":16,"tag":"الصداقة والجيرة","src":[["قصة","قصص عن الصديق المختلف وذوي الهمم للأطفال — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%A9-%D8%B9%D9%86-%D8%B0%D9%88%D9%8A-%D8%A7%D9%84%D8%A7%D8%AD%D8%AA%D9%8A%D8%A7%D8%AC%D8%A7%D8%AA-%D8%A7%D9%84%D8%AE%D8%A7%D8%B5%D8%A9/"]],"mistakes":[{"m":"بتحوّلها لأمر بنبرة لوم: «روح العب مع الولد ده، عيب اللي انت عامله فيه» — فالضم بقى واجب تقيل بيتعمل قدام عينك بس، وبيختفي أول ما تغيب.","fix":"ابدأ بسؤال العين والإحساس: «شايف حد لوحده؟ حاسس بإيه؟» — الفعل اللي بيطلع من التعاطف بيعيش، واللي بيطلع من اللوم بيموت."},{"m":"بتجر انت الطفل الواقف لوحده وتحطه في نص اللعب: «يلا العبوا مع بعض!» — الطفلين الاتنين اتكسفوا، ومحدش فيهم اتعلم حاجة.","fix":"اهمس لطفلك بالجملة وسيب الخطوة الأخيرة له — الضم اللي حصل بإيده هو بس اللي هيتكرر من غيرك."},{"m":"بتفرض عليه يضم أخوه الصغير في كل لعبة: «لازم تلعّب أخوك دايمًا!» — فبيربط الضم بالغصب، وتلاقيه بقى بيستخبى يلعب في الأوضة التانية.","fix":"من حقه وقت لعب لوحده — خلي الضم اختيار بيتوصف لما يحصل: «شفتك دخّلت أخوك اللعبة من نفسك» — مش قانون بيتحاسب عليه."}],"adapt":[{"kid":"الخجول","how":"عينه شايفة اللي لوحده وقلبه معاه، بس جملة الدعوة نفسها أصعب حاجة عنده. اديله ضم من غير كلام: يوصّل الكورة للطفل الواقف لوحده، يقعد جنبه ويلعب، يقدم له بسكوتة — الفعل الصامت ضم كامل، والجملة هتيجي وراه بعدين."},{"kid":"كثير الحركة","how":"مش بيقف أصلًا عشان يلاحظ — بيعدي جنب عشر أطفال قاعدين لوحدهم وهو طاير على الزحليقة. حوّل الملاحظة للعبة سريعة على باب الجنينة قبل ما ينطلق: «أول واحد يلاقي حد قاعد لوحده يقول لي» — دقيقة واحدة كفاية."},{"kid":"الحساس","how":"لو عزم طفل والطفل رد «لأ، مش عايز»، بياخدها جرح شخصي وبيبطل يعزم خالص. جهّزه قبلها: «ساعات اللي قاعد لوحده عايز يقعد لوحده — وده حقه». وبعد الرفض صف: «انت عملت الحتة بتاعتك وعزمته — رده مش شغلتك»."}]},
{"name":"المساعدة: إيدي بتفرق","cat":"تعامل","age":[3,12],"how":"المبادرة بالمساعدة بتتبني على حاجتين: مهام حقيقية مش تمثيلية — طفل 3 سنين بيفرق معاه جدًا إن شغله بجد بيفرق — ووصف أثر المساعدة بدل مدح الطفل: «لميت المعالق فالسفرة خلصت بدري» أنفع بكتير من «انت شاطر».","steps":[{"t":"شغلانة حقيقية باسمه","d":"ادّي طفلك شغلانة حقيقية ثابتة في البيت مش تمثيلية: هو اللي بيحط المعالق على السفرة قبل الغدا، أو اللي بيدوس على زرار الغسالة. حقيقية يعني لو معملهاش السفرة فعلًا هتتأخر — وسيبها تتأخر دقيقة فعلًا عشان يشوف إن إيده بتفرق. وبعدها صف الأثر: «انت حطيت المعالق، فقدرنا ناكل على طول».","say":"من غيرك السفرة مكنتش هتخلص"},{"t":"الحاجة اللي وقعت — استنى ثانيتين","d":"لما تقع منك ورقة أو ليمونة وانتو مطلعين مشتريات السوبرماركت، متلمهاش انت بسرعة — بطّئ ثانيتين وبص ناحيتها. الثانيتين دول هما المساحة اللي المبادرة بتتولد فيها. لو لمّها، صف من غير ما تكون طلبت: «شفتها وقعت ولميتها من نفسك — وأنا كانت إيدي مليانة». لو ملحقش يلاحظ، متحولهاش لأمر — مرة تانية هتيجي.","say":"شفتها من نفسك — إيدك فرقت معايا"},{"t":"مساعدة اللي أصغر — بإذن مش باقتحام","d":"لما أخوه الصغير أو ابن الجيران يتعب في لبس جزمته، علّم طفلك يسأل الأول: «تحب أساعدك؟» — عشان يتعلم إن المساعدة بتبدأ باستئذان مش بخطف الشغلة. ولو التاني قال «أنا لوحدي»، نحترم: «ماشي، أنا جنبك لو احتجتني». اللي بيعمل الحاجة بدل صاحبها مش بيساعده — بيقعده على جنب.","say":"تحب أساعدك؟"},{"t":"ساعد انت بصوت عالي","d":"خلي مساعدتك انت مسموعة ومشروحة قدامه: «شنطة الست دي تقيلة، همسك لها الباب»، «هنساعد عمو البواب يدخل الكراتين». في الأسانسير والسوبرماركت والجراج — طفلك بيبني مكتبة مواقف من اللي بيشوفك بتعمله مش من اللي بتقوله. وبعدها اسأله على العشا: «إيدك فرقت مع مين النهارده؟».","say":"إحنا عيلة إيدينا بتفرق"}],"mastery":"يشوف الموقف — حاجة وقعت من ماما، أخوه الصغير واقف قدام الجزمة — ويتحرك من نفسه في ثواني، من غير «ساعد أخوك» ومن غير مقابل، ويجي يحكي لك هو بفرحة إنه ساعد.","acts":[{"t":"علبة المهمات الصغيرة","mat":"علبة، وورق وألوان لكروت المهمات.","prep":"اعملوا سوا كروت مرسومة لمهمات حقيقية في البيت — وصّل الغسيل للغسالة، حط الشبشب جنب السرير، املا طبق مية للعصافير في البلكونة — وحطوها في العلبة.","run":"كل يوم الصبح يسحب كارت — ودي «مهمة إيده» النهارده. آخر اليوم السؤال مش «عملتها؟» لكن «مين استفاد منها؟» — عشان يربط المهمة بأثرها على الناس مش بمجرد إنجازها."},{"t":"مساعد المطبخ الحقيقي","mat":"خضار السلطة، مصفاة، وطبق التقديم.","prep":"في طبخة يوم الجمعة، خصص له خطوة حقيقية جوا الطبخة قبل ما تبدأوا — مش شغلانة شكلية على الجنب.","run":"هو اللي يغسل الخضار في المصفاة أو يرص طبق السلطة، والطبق اللي ساعد فيه يتقدم على السفرة باسمه. اعلنها قدام الكل: «السلطة دي هو اللي جهزها». الطفل اللي شغله بيتاكل على سفرة العيلة بيفهم إن مساعدته مش لعبة — دي مكانته في البيت."}],"say":"إيدي الصغيرة بتفرق فرق كبير","deen":["النبي ﷺ كان بيساعد في شغل البيت بإيده","احكي لطفلك إن السيدة عائشة لما اتسألت: النبي ﷺ كان بيعمل إيه في بيته؟ قالت: «كان في مهنة أهله» — يعني بيساعد في شغل البيت بإيده الشريفة (البخاري). وعلّمه وهو بيساعد فعلًا — وهو شايل الطبق مش في درس منفصل — إن «الله في عون العبد ما كان العبد في عون أخيه» (مسلم): اللي بيساعد الناس، ربنا بيساعده هو. وخليه يشوفك انت بتساعد في البيت بشكل طبيعي — القدوة هنا أقوى من أي كلام."],"skill":"الملاحظة والمبادرة: يشوف الشغل اللي محتاج إيد — حاجة وقعت من ماما، سفرة بتتجهز — ويتحرك من نفسه من غير ما حد يقول له «ساعد» — نواة تحمل المسؤولية في المدرسة وبعدين في أي شغل.","lvl":2,"ord":17,"tag":"التعاطف والمساعدة","src":[["قصة","قصة «الصديق وقت الضيق» عن مساعدة الأصدقاء — بالعربي نتعلم","https://www.belarabyapps.com/BelarabyStories/%D9%82%D8%B5%D8%A9-%D8%B9%D9%86-%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%D8%A9-%D8%A7%D9%84%D8%A7%D8%B5%D8%AF%D9%82%D8%A7%D8%A1/"]],"mistakes":[{"m":"أول ما يمسك طبق البيض أو يصب المية بتخطفها منه: «سيبك انت، أنا أعملها أسرع» — فبيتعلم إن مساعدته عبء، وبعد سنتين هتستغرب ليه مبيساعدش.","fix":"استحمل البطء والدلقة — دول تمن التدريب مش خسارة. واديله الجزء اللي على قده كامل: يصب من قزازة صغيرة مش من الكبيرة."},{"m":"بتدفع مقابل: «لو لميت اللعب هجيبلك شوكولاتة» — فالمساعدة بقت صفقة تجارية، وأول ما الشوكولاتة تختفي الإيد بتختفي معاها.","fix":"المقابل الوحيد هو وصف الأثر: «انت حطيت المعالق فقدرنا ناكل على طول» — إحساسه إن إيده بتفرق هو الأجر اللي مبيخلصش."},{"m":"بتطلب المساعدة وانت مولّع: «قوم ساعد بقى! مش شايف الدنيا مقلوبة؟!» — فارتبطت كلمة «ساعد» في ودنه بالزعيق والخناقة.","fix":"اطلب وانت هادي وبمهمة محددة ليها أول وآخر: «شيل المعالق دي للحوض» — الطلب الواضح الهادي هو اللي بيتلبى ويتكرر."}],"adapt":[{"kid":"كثير الحركة","how":"مهام القعدة والترتيب الهادي بتموت في نصها. اديله المهام اللي فيها جري: يوصّل المشتريات من باب الشقة للمطبخ، يدوس زرار الغسالة، يجري يجيب الفوطة اللي نسيتوها — طاقته هي أداة المساعدة مش عدوها."},{"kid":"الخجول","how":"مساعدة الغرباء — يسلّم الطبق لعمو البواب أو يمسك الباب لست غريبة — بتقفله. خليه المساعد الخلفي الأول: هو اللي يجهز الطبق ويغلفه، وانت اللي تسلمه وهو واقف جنبك. ومع الوقت اعرض من غير زق: «تحب انت اللي تديهوله النهارده؟»."},{"kid":"العنيد","how":"«قوم ساعدني» بتتقابل بـ«لأ» — مش عشان مش عايز يساعد، عشان جت في شكل أمر. المدخل هو الملكية: «المعالق دي شغلتك انت في البيت ده، محدش غيرك بيعملها» — العنيد بيحرس المهمة اللي باسمه، وبيهرب من اللي بتتطلب منه."}]},
{"name":"طلب المساعدة","cat":"ذات","age":[3,8],"how":"طلب المساعدة بيتعلم كقاعدة واضحة مش كإحساس — «جرّب مرتين وبعدين اطلب» — وطفلك بيصدق إنها شطارة مش عيب لما يشوفك انت نفسك بتطلب مساعدة قدامه من غير كسوف.","steps":[{"t":"قاعدة المرتين","d":"أول ما طفلك يتنرفز من سوستة الجاكيت أو غطا العلبة اللي مش راضي يفتح، انزل لمستوى عينه وقول له القاعدة: «جرّب مرتين لوحدك، لو مظبطتش، اطلب مساعدة». ارفع صباعين قدامه وهو بيجرب: «دي واحدة... دي اتنين... تمام، دلوقتي من حقك تطلب». كده الطلب بقى خطوة في خطة، مش استسلام ولا فشل.","say":"جرّبت مرتين؟ يبقى من حقك تطلب مساعدة"},{"t":"درّبه يقول الجملة كاملة","d":"الفرق بين العياط والطلب هو الجملة. لما يجيلك ماسك الجزمة وبيزن، متلبسهاش له على طول — اطلب الجملة الأول: «قول لي: يا بابا، ممكن تساعدني في الجزمة؟». أول ما يقولها، ساعده فورًا وبنفس راضية، عشان يتعلم إن الكلام الواضح بيجيب نتيجة أسرع من الزن.","say":"قول لي عايز مساعدة في إيه بالظبط، وأنا جاي حالًا"},{"t":"ساعد في الحتة الصعبة بس","d":"لما تيجي تساعد، متخطفش المهمة منه. قطعة الليجو اللي مش راكبة: امسكها وثبّتها له وسيبه هو اللي يضغط. السوستة: ابدأها له وسيبه يكملها لفوق. كده بيتعلم إن المساعدة بتكمّل شغله مش بتلغيه، ويرجع يجرب لوحده تاني المرة الجاية.","say":"أنا أمسك، وانت اللي تكمّل"},{"t":"اطلب انت مساعدة قدامه","d":"خليه يشوفك بتعملها: «الكرتونة دي تقيلة عليّا، ممكن تساعدني نشيلها سوا؟» أو قول لماما قدامه «مش لاقي المفاتيح، تساعديني أدوّر؟». الطفل اللي شايف أبوه بيطلب مساعدة من غير كسوف بيصدق إن الطلب شطارة — أما اللي شايفه بيتعصب لوحده على الرف المقفول ولا يطلب من حد، بيتعلم إن الطلب عيب مهما قلت له عكس كده.","say":"شايف؟ أنا كمان بطلب مساعدة — كلنا بنساعد بعض"},{"t":"وسّع الدايرة: الميس والناس برا","d":"الخطوة الأخيرة إن الطلب يشتغل من غيرك: قبل الحضانة قول له «لو احتجت حاجة أو حد ضايقك، قول للميس — هي زي ماما هناك»، واسأله بعد ما يرجع: «طلبت مساعدة النهارده في إيه؟». وفي السوبرماركت اديله مهمة حقيقية: «اسأل عمو اللي لابس المريلة فين اللبن» وانت واقف جنبه بخطوة. أول مرة تنجح مع شخص غريب، الجملة بقت بتاعته في أي مكان.","say":"الميس هناك زي ماما هنا — اطلب منها براحتك"}],"mastery":"بدل نوبة العياط قدام المهمة الصعبة، بتلاقيه بيجرب مرة واتنين وبعدين بييجي لوحده يقول «ممكن تساعدني في...» بجملة واضحة — وفي الحضانة بيروح للميس لما يحتاج، مش بيقعد يعيط في ركن لوحده.","acts":[{"t":"أقدر لوحدي ولّا محتاج مساعدة؟","mat":"من غير مواد.","prep":"قعدة سريعة على السجادة في أي وقت هادي — خمس دقايق كفاية.","run":"قول مواقف وهو يجاوب بإيده: إيد على صدره يعني «أقدر لوحدي»، إيد مرفوعة يعني «محتاج مساعدة» — «تلبس الشبشب؟ تولّع البوتاجاز؟ تجيب كوباية مية؟ تنزل من السرير العالي؟». علّق على إجاباته وانتوا بتلعبوا: «فيه حاجات بنجرّبها الأول، وحاجات خطر بنطلب فيها مساعدة على طول من غير تجريب»."},{"t":"الدبدوب اللي مبيطلبش","mat":"دبدوب وعربية أو أي لعبة يحبها.","prep":"حط اللعبة فوق الدولاب في مكان الدبدوب ميوصلوش، وجهّز المشهد قبل وقت اللعب.","run":"مثّل: الدبدوب عايز يوصل للعربية اللي فوق الدولاب — بيقفز وبيقع وبيعيّط ومش بيقول حاجة. اسأل طفلك: «هو محتاج إيه؟ طب يقول إيه؟» وسيبه هو اللي يعلّم الدبدوب الجملة: «قول: ممكن تساعدني؟» — وبعدين يساعده بنفسه. اقلبوا الأدوار في الآخر: خلّي الدبدوب يجرب مرتين الأول وبعدين يطلب صح."}],"say":"طلب المساعدة شطارة مش عيب","deen":["الاستعانة: بنطلب من ربنا وبنطلب من بعض","احكي لطفلك إن سيدنا موسى نفسه طلب مساعدة: دعا ربنا يبعت معاه أخوه هارون يساعده في المهمة الصعبة (سورة طه) — يعني حتى الأنبياء بيطلبوا. والنبي ﷺ قال «والله في عون العبد ما كان العبد في عون أخيه» (مسلم): ربنا بيحب لما نساعد بعض. علّمه قبل المهمة الصعبة يقول «يا رب سهّلها» وبعدين يطلب من اللي جنبه — بالتكرار في المواقف نفسها، مش بمحاضرة."],"skill":"صياغة طلب واضح: يقول لمين بيتكلم ومحتاج إيه بالظبط («يا ميس، ممكن تفتحي لي العلبة؟») بدل الزن والعياط — مهارة تواصل هيستخدمها في المدرسة وعند الدكتور وفي أي مكان طول عمره.","lvl":1,"ord":13,"tag":"الإحباط والمحاولة","src":[],"mistakes":[{"m":"بتطير تنجده من أول نفخة — لسه بيحاول في السوستة وانت خلصتها له — فبيتعلم إن أول علامة ضيق بتجيب إيد بتحل، وبيبطل يحاول أصلًا.","fix":"امسك نفسك واستنى المرتين — النرفزة الصغيرة اللي قبل الطلب هي المساحة اللي بيتولد فيها التعلم."},{"m":"بتستقبل طلبه بتعيير: «انت كبير، عيب، اعملها لوحدك» — فبيتعلم إن الطلب فضيحة، وبعدين تلاقيه بيفشل في صمت أو يعيط في ركن من غير ما يقول عايز إيه.","fix":"الطلب اللي جه بعد محاولة استقبله بنفس راضية وساعد فورًا — ده مش دلع، ده هو التمرين نفسه بينجح."},{"m":"لما يزن وينوح بتساعده على طول عشان يسكت — فاتعلم إن الزن هو لغة الطلب اللي بتجيب نتيجة في البيت ده.","fix":"الجملة الأول: «قول: ممكن تساعدني في الجزمة؟» — وأول ما يقولها ساعد فورًا. بالتكرار بتترسخ المعادلة: الزن ميجيبش، الجملة بتجيب."}],"adapt":[{"kid":"العنيد","how":"بيصرخ «أنا لوحدي!» وهو غرقان في الجاكت المقلوب — رافض المساعدة نفسها. متفرضهاش: قدّم مساعدة صامتة صغيرة (ثبّت له الكم من غير كلام) أو اعرض وامشي: «أنا على الكنبة لو غيّرت رأيك» — وأول ما يطلب ولو بإشارة، لبّي من غير «شفت؟ قلت لك»."},{"kid":"الحساس","how":"مش بيوصل للمرة التانية أصلًا — أول تعثر بيقلب عياط. نزّل العتبة: «جرّب مرة واحدة وبعدين اطلب»، وسمّي الإحساس قبل القاعدة: «السوستة نرفزتك». ولما يهدى ويكبر في التمرين، رجّع العتبة تطلع لمرتين بالتدريج."},{"kid":"الخجول","how":"في البيت بيطلب منك عادي، وفي الحضانة بيقعد ساكت والشراب مبلول طول اليوم. مثّلوا مشهد الميس بالدباديب في البيت — هو الطفل وانت الميس وبعدين بالعكس — واتفق مع الميس نفسها إنها تيجي تسأله هي فترة، لحد ما جملة «ممكن تساعديني؟» تجري على لسانه هناك زي ما بتجري قدامك."}]},
{"name":"التواضع وعدم السخرية","cat":"دين وأخلاق","age":[4,12],"how":"السخرية والتفاخر في السن ده مش خبث — طفلك لسه بيكتشف إنه بيكسب وبيتفوق ومش عارف يعمل إيه بالإحساس ده. بنعلّمه إن الفرحة حقه والتريقة لأ، وإن «أنا كسبت» غير «انت خسران يا بطيء».","steps":[{"t":"لحظة المكسب: افرح من غير ما توجع","d":"قبل أي لعبة ليها كسبان — على السجادة أو مع ولاد عمه — اتفقوا على طقس النهاية: الكسبان يقول «لعبة حلوة! تاني؟» ويسلّم على اللي قدامه. وجرّبها انت الأول: اكسب وقولها، واخسر وقول «مبروك! المرة الجاية أكسبك». وأول ما يكسب هو ويبتدي «أنا كسبتك! انت خسران!» أوقفه بهدوء من غير تكشيرة: «افرح براحتك — بس بص على وش أخوك، حاسس بإيه دلوقتي؟». علّمه الفرق بالجملتين: «أنا كسبت» فرحة ومن حقك — «انت خسران يا بطيء» تريقة وبتوجع.","say":"الكسبان الشاطر بيقول: لعبة حلوة، تاني؟"},{"t":"اقفل باب أنا أحسن منك","d":"لما تسمعه يقول لصاحبه «عربيتي أحلى من عربيتك» أو «أنا أشطر منك»، متعديهاش: «عربيتك عجباك؟ قول: بحب عربيتي — من غير ما تصغّر بتاعة حد». وفي مدحك انت ليه، وصّف الفعل بدل الأفضلية: «ركّبت البازل لوحدك» مش «انت أشطر واحد في الحضانة» — اللي بيتربى على «أنا الأحسن» بيحتاج يدوس على غيره عشان يحس بقيمته.","say":"كل واحد شاطر في حاجة — قول بحب لعبتي، مش لعبتي أحسن"},{"t":"الشاطر بيعلّم مش بيتريق","d":"التواضع الحقيقي بيبان لما يعرف حاجة غيره لسه معرفهاش: هو بيركب السكوتر وابن عمه الأصغر بيقع — لو ضحك عليه، حوّل التفوق لمهمة: «انت فعلًا بتعرف — تعالى ورّيه، انت معلمه النهارده». وقف جنبهم وهو بيعلّم، وبعدها صف اللي حصل: «انت ورّيته يحط رجله فين — هو عرف بسببك انت». اللي بيتعود يحوّل شطارته لخدمة، مش بيحتاج يحوّلها لتريقة.","say":"انت عارف وهو لسه بيتعلم — ورّيه، متضحكش عليه"},{"t":"خلّي بيتك نضيف من التريقة","d":"طفلك مش هيبطل يتريق لو سامعك بتتريق — على سواقة حد في الشارع، على لبس حد في التلفزيون، أو حتى «هزار» على نطق أخوه الصغير للحروف. القاعدة للبيت كله: منضحكش على شكل حد ولا كلامه ولا هدومه. ولو حد ضحك على طفلك، علّمه يقول «أنا مش بحب الكلام ده» ويمشي — من غير ما يرد بتريقة زيها.","say":"في بيتنا منضحكش على حد — بنضحك مع بعض"}],"mastery":"يكسب اللعبة ويقول «لعبة حلوة، تاني؟» من نفسه من غير ما تبص له، ولما حد ينطق غلط أو يقع بيساعده أو بيسكت — مش بيضحك. ولو سمعته بيقول «بحب عربيتي» بدل «عربيتي أحسن من بتاعتك» — القيمة ركبت.","acts":[{"t":"مسرحية الأرنب المغرور","mat":"لعبتين من اللي عندكم — واحدة تعمل أرنب وواحدة سلحفاة.","prep":"وقت الحدوتة قبل النوم أو بعد العصر — جهّز اللعبتين وخط بداية ونهاية للسباق على السجادة.","run":"مثّلوا قصة الأرنب والسلحفاة: الأرنب بيتريق «يا مسكينة، انتي بطيئة قوي!» وبينام تحت الشجرة، والسلحفاة بتكمّل وتكسب. اسأل طفلك: «التريقة كسّبت الأرنب ولا خسّرته؟ لو انت مكان السلحفاة كنت حسيت بإيه؟». وبعدين اقلبوا النهاية: أرنب متواضع بيقول للسلحفاة «برافو عليكي» — واسأله: «مين فيهم تحب تكون؟»."},{"t":"دايرة كل واحد شاطر في إيه","mat":"من غير مواد.","prep":"على سفرة العشا والكل موجود — خليها عادة أسبوعية ثابتة.","run":"كل واحد بالدور يقول حاجة اللي جنبه شاطر فيها: «ماما شاطرة في المحشي»، «بابا شاطر في إصلاح العجلة»، «انت شاطر في تركيب المكعبات». طفلك بيشوف عمليًا إن الشطارة موزعة على الكل — محدش أحسن من حد في كل حاجة، وإن الكلام الحلو عن الناس أحلى من التفاخر بالنفس."}],"say":"محدش أحسن من حد — كل واحد شاطر في حاجة","deen":["ربنا نهانا عن السخرية ووعد المتواضع بالرفعة","ربنا قال في القرآن ﴿لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ عَسَىٰ أَن يَكُونُوا خَيْرًا مِّنْهُمْ﴾ (الحجرات 11) — قولها لطفلك ببساطة في اللحظة نفسها: «اللي بنضحك عليه، يمكن يكون أحسن مننا عند ربنا». والنبي ﷺ قال «وما تواضع أحدٌ لله إلا رفعه الله» (مسلم) — اللي مبيتكبرش، ربنا بيعلّي قدره. علّمه بالقدوة والتكرار في لحظة الكسب نفسها، من غير تهديد — التواضع بيخلي ربنا والناس يحبوك."],"skill":"الروح الرياضية: يقفل اللعبة بجملة «لعبة حلوة، تاني؟» كسبان أو خسران — المهارة اللي بتخلي أصحابه يحبوا يلعبوا معاه تاني ويتعزم على اللعب مش يتفادوه.","lvl":3,"ord":17,"tag":"","src":[["قصة","قصة الأرنب والسلحفاة مكتوبة بالصور — بالعربي نتعلم","https://www.belarabyapps.com/%D9%82%D8%B5%D8%A9-%D8%A7%D9%84%D8%A3%D8%B1%D9%86%D8%A8-%D9%88%D8%A7%D9%84%D8%B3%D9%84%D8%AD%D9%81%D8%A7%D8%A9-%D8%A8%D8%A7%D9%84%D8%B5%D9%88%D8%B1/"]],"mistakes":[{"m":"بتقارن ولادك ببعض قدامهم: «بص أخوك خلص أكله وانت لسه» — المقارنة دي هي المدرسة اللي بيتخرج منها «أنا أحسن منك».","fix":"قارن الطفل بنفسه بس: «امبارح لبست في عشر دقايق والنهارده في خمسة» — المنافسة الوحيدة المسموحة في البيت هي مع نفسه امبارح."},{"m":"بتضحّك الضيوف على لقطاته: بتقلد نطقه الغلط لكلمة «مقص» والقعدة كلها بتضحك — فاتعلم إن التريقة على حد فرجة حلوة بتلم الجمهور.","fix":"حكاياته المضحكة ملكه — تتحكى بإذنه أو متتحكيش. ولو عايز تضحّك القعدة، احكي موقف على نفسك انت."},{"m":"بتمدحه بصيغة أفضلية: «انت أشطر واحد في الحضانة كلها» — فربطت قيمته بإنه فوق حد، وبقى محتاج يدوّر على اللي تحته عشان يحس بنفسه.","fix":"صف الفعل من غير مقارنة: «ركبت البازل الأربعة وعشرين قطعة لوحدك» — الوصف بيشبع من غير ما يحتاج ضحية."}],"adapt":[{"kid":"عالي الشدة","how":"فرحة المكسب عنده انفجار جسم كامل — بيقفز ويصرخ في وش الخسران مش عشان يجرحه، عشان مش شايل الفرحة. متطفيش الفرحة — وجّهها: «اقفز واصرخ براحتك، بس بعيد عن وشه»، وطقس «لعبة حلوة» ييجي بعد ما الجسم يفضّى مش قبله."},{"kid":"الحساس","how":"لما توقفه عن التريقة بياخدها على نفسه: «أنا وحش» وييجي العياط. افصل الفعل عن الطفل بوضوح: «الكلمة دي بتوجع — الكلمة هي اللي مش حلوة، مش انت». وبعدها فورًا اديله فرصة يصلّح: «قوله: تعالى نلعب تاني»."},{"kid":"العنيد","how":"«قول لعبة حلوة» كتعليمة هيرفضها على طول الخط. اقلب الأدوار: خليه هو حارس قانون الكسبان الشاطر اللي بيحاسبك انت عليه — «لو كسبت وقلت انت خسران، هتعمل فيا إيه؟» — العنيد بينفذ القانون اللي هو حارسه، مش اللي هو محكوم بيه."}]},
{"name":"احترام القواعد","cat":"تعامل","age":[3,12],"how":"طفل 3-5 مش بيحترم القاعدة عشان منطقية — بيحترمها عشان ثابتة. قاعدتين واضحين بيتنفذوا كل مرة أقوى من عشر قواعد بتتفاوض. والسر إنه يفهم إن القاعدة بتحمي مش بتضايق.","steps":[{"t":"ابدأ بقاعدتين بس","d":"اختار قاعدتين للبيت واضحين وقابلين للتنفيذ — مثلًا: «الأكل على الطبلية مش قدام التلفزيون» و«قبل ما نطلع لعبة جديدة، القديمة ترجع مكانها». ارسمهم مع طفلك على ورقة وعلّقوها على التلاجة. القاعدة اللي على التلاجة بقت بتاعة البيت كله — مش أوامر مزاجية منك بتتغير حسب تعبك.","say":"دي قاعدة بيتنا — مكتوبة أهي على التلاجة"},{"t":"خلّي القاعدة هي اللي ترفض، مش انت","d":"لما يطلب ياكل قدام التلفزيون، متدخلش في مفاوضات ولا تزعق — أشّر على الورقة: «القاعدة بتقول: الأكل على الطبلية». لو نفّذ، علّق بهدوء: «مشيت على القاعدة». ولو يوم عدّيتها لأنك تعبان، اعرف إنك رجّعت التدريب لورا — الثبات نفسه هو الدرس.","say":"القاعدة قاعدة — حتى لو مش عاجباني النهارده"},{"t":"لكل قاعدة سبب — قوله","d":"عرّفه إن كل قاعدة بتحمينا من حاجة: «بنمسك السلم في السلالم عشان منقعش»، «بنرجع اللعب عشان منتعثرش فيها بالليل». ولو سأل «ليه لازم؟» متقولش «عشان أنا قلت كده» — قول السبب، ولو القاعدة فعلًا مبقاش ليها سبب، غيّروها سوا بالنور. الطفل اللي فاهم القاعدة بتحمي مين، بيمشي عليها وانت مش موجود.","say":"القاعدة دي بتحمينا من إيه؟ افتكر"},{"t":"ورّيه إنك انت كمان ليك قواعد","d":"في السوبرماركت قول له قاعدة المكان قبل ما تدخلوا: «هنا بنمشي جنب العربية ومنجريش بين الرفوف». وعند إشارة المشاة استغل اللحظة: «شايف؟ أنا واقف عشان الإشارة حمرا — مفيش عربيات جاية، بس القاعدة قاعدة». وفي البيت سمّي قواعدك انت بصوت عالي: «أنا مش بفتح الموبايل على السفرة — دي قاعدتي». الطفل اللي شايف الكبار محكومين بقواعد، بيبطل يشوف القاعدة سلاح الكبار ضد الصغيرين.","say":"كل مكان له قواعد — وأنا كمان بمشي عليها"},{"t":"خليه هو اللي يشرّع","d":"في سن 4-5 افتح له باب التشريع: «بيتنا محتاج قاعدة جديدة — اقترح انت». لو اقترح قاعدة معقولة («محدش يقاطع حد وهو بيتكلم») ارسموها وعلقوها جنب الباقيين. والأهم: خليه يشوفك بتتمسك بيها انت — لو قاطعت ماما وهو سمع، وقّف نفسك قدامه: «صح، قاعدتك — اتفضلي كملي يا ماما». الطفل اللي قاعدته مشيت على بابا وماما فهم أعمق درس في الباب ده: القواعد فوق الكل، مش عصاية في إيد الأقوى.","say":"اقترح قاعدة لبيتنا — وهنمشي عليها كلنا، حتى أنا"}],"mastery":"بيرجع اللعبة القديمة قبل ما يطلع الجديدة من غير ما حد يفكّره، ولما تدخلوا مكان جديد بيسألك «إيه قواعد المكان ده؟» — ولو غيّرت انت القاعدة بمزاجك بيحتج عليك: «بس القاعدة بتقول!»","acts":[{"t":"لعبة من غير قواعد","mat":"سبت الغسيل وكور صغيرة أو شرابات ملفوفة.","prep":"حط السبت في نص الصالة واتفقوا على القواعد بصوت عالي قبل البداية: كل واحد له رمية بالدور، واللي يجيب ياخد خطوة لورا.","run":"العبوا شوية بالقواعد، وبعدين أعلن: «خلاص، اللعبة من غير قواعد!» — هيرمي الكل مع بعض، هتضيع الكور، وهيزعل حد في ثواني. وقّف اللعب واسأل: «كانت أحلى بالقواعد ولا من غيرها؟ ليه؟». خليها تجربة محسوسة إن القواعد هي اللي بتخلي اللعبة تنفع أصلًا."},{"t":"لوحة قواعد بيتنا","mat":"ورقة كبيرة وألوان وسلوتيب.","prep":"اقعدوا سوا في وقت رايق، وابدأ انت: ارسم قاعدتين من قواعد البيت.","run":"سيبه هو يختار ويرسم قاعدة من عنده — حتى لو اختار «ممنوع حد ياخد لعبي من غير إذن»، دي أحسن قاعدة ممكنة لأنها بتاعته. علّقوا اللوحة في مكان ظاهر، وخليه هو «حارس القواعد» اللي يفكّر أي حد نسي — حتى انت. قول له: «القواعد دي بتاعتنا كلنا — انت اللي بتحرسها»."}],"say":"القواعد بتخلينا كلنا مبسوطين وفي أمان","deen":["النظام عبادة: حتى الصلاة ليها صفوف مظبوطة ومواعيد","خد طفلك الجامع وورّيه الصفوف: «شايف الناس واقفة في سطور مظبوطة جنب بعض؟ النبي ﷺ قال: سوّوا صفوفكم» (متفق عليه) — يعني حتى في بيت ربنا فيه نظام والكل ماشي عليه. والصلاة نفسها ليها مواعيد ثابتة: النبي ﷺ سُئل أي العمل أحب إلى الله، قال «الصلاة على وقتها» (متفق عليه). بالمشاهدة والتكرار بيفهم إن النظام مش قيود — ده شكل حبنا لربنا وللناس."],"skill":"الانتقال السلس بين الأماكن: يدخل مكان جديد — نادي، بيت أقارب، فصل — ويسأل «إيه قواعد المكان ده؟» ويمشي عليها — المهارة اللي بتخلي الحضانة والزيارات تعدي من غير معارك.","lvl":1,"ord":14,"tag":"الروتين والاستقلال","src":[["مطبوعات","ملصقات القوانين الصفية لرياض الأطفال PDF — بالعربي نتعلم","https://www.belarabyapps.com/%D9%85%D9%84%D8%B5%D9%82%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D9%86%D9%8A%D9%86-%D8%A7%D9%84%D8%B5%D9%81%D9%8A%D8%A9/"]],"mistakes":[{"m":"القاعدة بتتغير بمزاجك: يوم الأكل قدام التلفزيون ممنوع، ويوم مسموح عشان انت راجع تعبان وعايز تخلص — فاتعلم إن القاعدة مزاج، وإن الزن هو مفتاح الفتح.","fix":"متحطش غير قاعدة تقدر تثبت عليها في أسوأ يوم تعب — قاعدة صغيرة بتتنفذ كل مرة أقوى من قاعدة مثالية بتقع كل يومين."},{"m":"عشر قواعد نزلوا في أسبوع واحد: الأكل والنوم واللعب والشاشة والحمام — فولا واحدة اتنفذت فعلًا، وكلهم بقوا كلام بيتقال في الهوا.","fix":"اتنين بس لحد ما يبقوا زي غسيل السنان — بيحصلوا من غير معركة — وساعتها بس ضيف التالتة."},{"m":"بتستخدم القاعدة كتهديد وقت الغضب: «خلاص! التلفزيون اتلغى من البيت خالص!» — تهديد انت وهو عارفين إنه مش هيتنفذ، فكل القواعد فقدت وزنها.","fix":"النتيجة الصغيرة اللي بتتنفذ فعلًا («التلفزيون قفل النهارده») أتقل ألف مرة من التهديد الكبير اللي بيتنسي بكره."}],"adapt":[{"kid":"العنيد","how":"القاعدة النازلة من فوق إعلان حرب. خليه شريك من أول يوم: هو اللي يرسمها وهو اللي يعلقها على التلاجة، واديله اختيار جوا القاعدة مش عليها: «الأكل على الطبلية — تحب تقعد جنب الشباك ولا جنبي؟» — بينفذ القاعدة اللي حس إن ليه فيها إيد."},{"kid":"كثير الحركة","how":"مش بيتحدى القاعدة — بينساها: جسمه بيوصل قبل ما افتكاره يلحق. قلل الاعتماد على الذاكرة: صورة القاعدة تتلزق في مكان الفعل نفسه (رسمة اللعب الراجعة للرف على الرف نفسه)، والتذكير يبقى قبل الموقف — «فاكر قاعدة السوبرماركت؟» على الباب — مش توبيخ بعده."},{"kid":"الحساس","how":"لما تنفذ القاعدة بحزم بياخدها زعل شخصي: «انت مش بتحبني». افصل الاتنين بصوتك في نفس الجملة: «أنا بحبك وانت زعلان — والقاعدة برضه هتتنفذ». نبرة دافية مع تنفيذ ثابت، الاتنين مع بعض — مش واحدة بدل التانية."}]},
{"name":"الانتماء وهويتي: أنا مين","cat":"ذات","age":[3,8],"how":"الهوية للطفل المغترب مش بتيجي لوحدها — بتتبني بالحكايات والصور والأسماء المتكررة. طفلك محتاج إجابة ثابتة على «أنا مين؟»: اسمه الكامل، وعيلته، ومصر بلده، والإمارات بيته، ودينه — كلهم مع بعض مش ضد بعض.","steps":[{"t":"اسمه الكامل بحكاية مش بتسميع","d":"طفلك اسمه مش «حبيبي» ولا «الواد» — علّمه اسمه التلاتي وهو بيلعب، وحط ورا الاسم حكاية: «انت اسمك من جدك — جدك ده اللي ساكن في مصر واللي بيبعت لك هدية العيد». الأسماء اللي ليها حكايات بتتحفظ لوحدها، واللي بيتسمّع زي النشيد بيتنسي.","say":"انت فلان ابن فلان — وليك عيلة كبيرة بتحبك"},{"t":"حيطة العيلة","d":"اطبع صور جدو وتيتة وأخواله وعمامه وعلّقها في مستوى نظره — جنب سريره أو في طرقة الشقة. مرة في الأسبوع قبل النوم اعملوا «جولة الحيطة»: هو يسمّي الصور، وانت تحكي حكاية صغيرة حقيقية عن واحد فيهم: «تيتة دي اللي علمتني أعمل العجوة». الوش اللي له حكاية بيبقى شخص، مش صورة.","say":"دول ناسنا — إحنا مش لوحدنا هنا"},{"t":"مكالمة الأسبوع بدور حقيقي ليه","d":"مكالمة الفيديو مع مصر خليها موعد ثابت في الأسبوع مش صدفة، وقبلها بشوية اسأله: «هتوري جدو إيه النهارده؟» — يوري رسمته، يحكي عن الزحليقة الجديدة، يسأل تيتة سؤال هو مجهزه. المكالمة اللي كلها «قول وحشتني، بوس الكاميرا» تلقين بيكرّهه فيها — الدور الحقيقي هو اللي بيخلي جدو شخص بيستناه.","say":"جدو مستنيك — هتوريه إيه النهارده؟"},{"t":"إجابة واحدة ثابتة على «إحنا منين»","d":"لما يسأل «إحنا منين؟» — وهيسأل، لأن في الحضانة كل طفل من بلد — جاوب إجابة واحدة متتغيرش: «إحنا مصريين، بلدنا مصر، وعايشين في الإمارات وبنحبها». والبلدين مش ضد بعض ولا في مسابقة. ولما يسأل عن أصحابه: «عيلة صاحبك من الهند، وإحنا من مصر — كل واحد له بلد وحكاية».","say":"إحنا مصريين وعايشين في الإمارات — والاتنين حلوين"},{"t":"مصر بتتعاش مش بتتحكي","d":"مصر متبقاش صور على حيطة بس: اعملوا أكلة بلدي سوا وسمّيها باسمها — «النهارده هنعمل كشري زي اللي في مصر» — واحكيله عن شارع بيت جدو ورمضان هناك. وفي زيارة مصر خليه هو اللي يعرّف عن نفسه: يسلم على الجيران ويقول اسمه الكامل بنفسه.","say":"لينا حكاية — وإحنا جزء منها"},{"t":"هويته الشخصية: أنا بعرف وأنا بحب","d":"الهوية مش جذور بس — دي كمان قدراته واهتماماته. العبوها قبل النوم: كل واحد يكمّل جملتين — «أنا بعرف...» و«أنا بحب...»: «أنا بعرف أركّب المكعبات، أنا بحب الديناصورات». الطفل اللي عنده إجابة جاهزة من جوه على «أنا مين» بيقف ثابت وسط عشرين جنسية في الفصل.","say":"قولي انت بقى — بتعرف إيه وبتحب إيه؟"}],"mastery":"لما حد يسأله «انت مين؟ انت منين؟» يرد من غير ما يبص لك: «أنا فلان فلان، أنا مصري وعايش في الشارقة» — وبيسمّي جدو وتيتة في مكالمة الفيديو من غير تلقين، وبيقول عن نفسه «أنا بعرف...» بثقة.","acts":[{"t":"شجرة عيلتنا","mat":"نموذج شجرة العائلة المطبوع (المطبوعة في المصادر تحت)، صور حقيقية لأفراد العيلة مش رسومات، صمغ أو شريط لازق","prep":"اطبع النموذج وجهّز الصور — اطبعها من موبايلك أو هات صور موجودة عندكم — واختار وقت هادي بعد العصر تقعدوا فيه سوا","run":"هو اللي يلصق بإيده: نفسه في الجذع، وفوقه بابا وماما، وفوقهم جدو وتيتة من الناحيتين. مع كل صورة بيلصقها احكي له معلومة واحدة عن صاحبها: «عمو ده كان بيلعب كورة جامد». علّقوا الشجرة جنب سريره، وارجعوا لها كل ما حد من العيلة يتصل: «مين ده اللي بيكلمنا؟ ورّيني مكانه في الشجرة»."},{"t":"صندوق حكايات مصر","mat":"علبة أو كرتونة، صور من آخر زيارة لمصر، عملة مصرية قديمة، صورة بيت جدو، أي حاجة صغيرة من هناك","prep":"خصصوا العلبة مرة واحدة واكتبوا عليها «صندوق مصر»، واجمعوا فيها الحاجات دي، وحطوها في مكان ثابت يعرفه","run":"مرة كل أسبوع افتحوه سوا: هو يختار حاجة وانت تحكي حكايتها — «اختار حاجة من الصندوق وأنا أحكيلك جابتها منين». وقبل أي مكالمة أو سفرية لمصر افتحوا الصندوق الأول — بيربط مصر الحقيقية بالحاجات اللي في إيده مش بكلام مرسل."}],"say":"أنا عارف أنا مين: ليّا اسم وعيلة وبلد ودين","deen":["أكبر انتماء: إحنا مسلمين — عيلة كبيرة في كل البلاد","علّمه إن فوق العيلة والبلد في انتماء أوسع: «إحنا مسلمين — في مصر والإمارات وكل مكان». النبي ﷺ شبّه المسلمين في توادّهم وتراحمهم بالجسد الواحد (متفق عليه) — قولها له ببساطة لما يشوف المصلين في الجامع من كل الجنسيات: «كل دول إخواتنا». وصلة الرحم نفسها عبادة: النبي ﷺ قال «من أحب أن يُبسط له في رزقه ويُنسأ له في أثره فليصل رحمه» (متفق عليه) — فمكالمة جدو وتيتة الأسبوعية مش مجاملة، دي عبادة بنعملها بحب، وقولها له كده وانتوا بتتصلوا."],"skill":"التقديم الذاتي: يعرّف نفسه لأي حد جديد — اسمه الكامل وسنّه وبلده — في جملتين واضحين، نفس المهارة اللي هيحتاجها أول يوم في المدرسة ومع أي طفل جديد في الجنينة","lvl":4,"ord":9,"tag":"الأسرة","src":[["مطبوعات","نماذج شجرة العائلة للأطفال بالصور PDF — بالعربي نتعلم","https://www.belarabyapps.com/%D8%B4%D8%AC%D8%B1%D8%A9-%D8%A7%D9%84%D8%B9%D8%A7%D8%A6%D9%84%D8%A9-%D9%84%D9%84%D8%A7%D8%B7%D9%81%D8%A7%D9%84-%D8%A8%D8%A7%D9%84%D8%B5%D9%88%D8%B1/"],["بطاقات","بطاقات أفراد العائلة بالعربية PDF — بالعربي نتعلم","https://www.belarabyapps.com/%D8%A8%D8%B7%D8%A7%D9%82%D8%A7%D8%AA-%D8%A3%D9%81%D8%B1%D8%A7%D8%AF-%D8%A7%D9%84%D8%B9%D8%A7%D8%A6%D9%84%D8%A9-%D8%A8%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A%D8%A9/"]],"mistakes":[{"m":"بتتكلم عن مصر قدامه بس وقت الشكوى — «الزحمة، البلد تعبت، طوابير المطار» — وبعدين مستني منه يحب بلد ما سمعش عنها غير المصايب.","fix":"الطفل بياخد صورة بلده من نبرة صوتك مش من الجغرافيا. احكي قدامه اللي بتحبه فعلًا: شارع بيت جدو، فطير تيتة، البحر في إسكندرية — والشكوى خليها بعيد عن وداني الصغيرة."},{"m":"بتحوّل هويته لفقرة قدام الضيوف: «قول للطنط انت منين! سمّعنا بتتكلم مصري!» — فبيربط الهوية بالكسوف والاستعراض.","fix":"الهوية بتتبني في الحوارات اليومية بينكم، مش على المسرح. قدام الناس سيبه — اللي اتبنى جوه هيطلع لوحده لما يحب هو."},{"m":"بتحط البلدين في مقارنة — «هنا أنضف من عندنا» أو «مفيش زي بلدنا وكل اللي هنا مش بتاعنا» — فيتربى على إن حب مكان لازمه كره التاني، وهو عايش في الاتنين.","fix":"صيغة جامعة ثابتة ومتتناقضش: بلدنا مصر وبنحبها، وبيتنا هنا وبنحبه. الطفل يقدر يحب الاتنين لو انت سيبتله المساحة."}],"adapt":[{"kid":"الخجول","how":"تعريف نفسه للجيران في مصر أو الكلام في المكالمة عذاب ليه. شيل الكلام من المهمة الأول: دوره في المكالمة يوري رسمته للكاميرا من غير ولا كلمة وانت اللي بتعلق، وفي مصر يسلم بإيده وانت تقول اسمه. الكلام بييجي لما الوشوش تبقى مألوفة — مش قبلها."},{"kid":"كثير الحركة","how":"مش هيثبت لجولة حيطة ولا حدوتة طويلة. خلّي الهوية بالجسم: يعجن الكشري بإيده، جولة الحيطة تبقى لعبة سرعة «شاور على خالو قبل ما أعد لتلاتة»، والحكايات تتحكي وهو بيتنطط جنبك مش قاعد في حجرك."},{"kid":"الحساس","how":"وداع المطار في آخر زيارة مصر بيكسره، وممكن الحنين يقلب وجع. جهّزه للوداع قبلها بيومين: «فاضل نامتين وبعدين نرجع بيتنا — وهنكلم تيتة يوم الجمعة زي كل مرة». المكالمة الثابتة هي اللي بتطمنه إن جدو مش بيختفي — البعد المنظم أرحم من البعد المفاجئ."}]},
{"name":"تقبّل التغيير والمرونة","cat":"ذات","age":[3,8],"how":"المرونة مش بتتبني بالمفاجآت — بتتبني فوق روتين ثابت وأمان. الطفل اللي عارف يومه ماشي إزاي هو اللي بيقدر يستحمل لما حاجة فيه تتغير. شغلك تلات حاجات: تحضير قبل التغيير، تسمية للمشاعر وقته، وحاجات صغيرة ثابتة متتغيرش أبدًا.","steps":[{"t":"بلّغ قبل النقلة وسيب المؤقت يعلن النهاية","d":"أي نقلة في اليوم — قفل التلفزيون، الخروج من البانيو، المشي من عند أصحابه — ابدأها بتحذير مش بأمر مفاجئ: «كمان خمس دقايق بنقفل ونروح نتعشى». اضبط مؤقت المطبخ أو موبايلك قدامه، ولما يرن خلي الرنة هي اللي بتقول خلاص، مش صوتك. الطفل بيقاوم المفاجأة أكتر ما بيقاوم النقلة نفسها.","say":"كمان خمس دقايق — لما المؤقت يرن بنقفل"},{"t":"سمّي التغيير الصغير أول ما يحصل","d":"لبن الفراولة خلص، الكوباية الخضرا في الغسالة، التيشيرت المفضل لسه منشف — دي فرص التدريب اليومية. أعلنها بجملة ثابتة وهادية: «الخطة اتغيرت»، وسمّي اللي حاسس بيه: «انت متضايق عشان كنت مجهز نفسك للكوباية الخضرا — من حقك». التسمية بتنزل نص الانفعال قبل ما توصلوا للحل.","say":"الخطة اتغيرت — ومن حقك تتضايق"},{"t":"ودّيه هو لخطة ب","d":"بعد التسمية ييجي السؤال: «نعمل إيه بدالها؟» — وسيبه هو يقترح، أو اديله اختيارين: نزلة الحديقة اتلغت عشان الحر — خيمة بالملايات تحت السفرة ولا مكعبات في البلكونة بعد المغرب؟ البديل اللي يختاره هو بيبقى «خطته هو»، فبيدخلها من غير مقاومة.","say":"مش هنعرف نعمل الأولانية — يلا نختار خطة ب"},{"t":"سمّي مرونتك انت بصوت عالي","d":"كل يوم فيه فرص حقيقية قدامه: «كنت ناوي أعمل كشري، الرز خلص — هنعمل مكرونة وخلاص»، «الجراج مليان — هنركن بعيد ونمشي شوية». قولها بصوت مسموع وبنبرة عادية، من غير تنهيد ولا نكد. مشهد أبوه وهو الجدول بيتقلب عليه ومش بينهار بيعلّمه أكتر من أي تدريب مقصود.","say":"الخطة اتغيرت عليا أنا كمان — هعمل زيك: خطة ب"},{"t":"التغييرات الكبيرة: حضّر بدري وثبّت الصغير","d":"سفرية مصر، حضانة جديدة، بيت جديد — قبلها بأسبوع ابدأ احكي: صور المكان، مين هيكون هناك، واليوم هيمشي إزاي. وخد معاك الثوابت الصغيرة: مخدته، دبدوبه، ونفس ترتيب طقس النوم حتى في بيت تيتة في مصر. الدنيا كلها تتغير حواليه وهو ماسك في حاجات صغيرة متتغيرش — دي اللي بتخليه ي
