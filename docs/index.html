<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قُرّة عين — مرجع التربية من 3 لـ 5 سنين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#14201C;--soft:#54615B;--paper:#E9EDE7;--card:#fff;--line:#D4DACF;
 --c1:#1D6A6A;--c2:#6B4A86;--c3:#A9552F;--c4:#2F6E86;--c5:#3F7A46;--c6:#B5731E;--c7:#33413A;--c8:#8C2F39;
 --a:var(--c1);--r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.72}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 90px}
a{color:var(--a)}
.top{position:sticky;top:0;z-index:30;background:rgba(233,237,231,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .inner{max-width:1040px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.brand b{font-family:"Aref Ruqaa",serif;font-size:19px}
.brand span{font-size:12px;color:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
 background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 12px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--tc);margin-inline-end:6px}
section.view{display:none;padding-top:26px}
section.view.on{display:block}
h1{font-family:"Aref Ruqaa",serif;font-size:clamp(27px,6vw,44px);line-height:1.28;margin:0 0 10px}
h2.sec{font-family:"Aref Ruqaa",serif;font-size:23px;margin:34px 0 4px;padding-top:12px;border-top:2px solid var(--a)}
p.lede{max-width:62ch;color:var(--soft);font-size:15px;margin:0 0 18px}
p.note{font-size:14px;color:var(--soft);max-width:66ch;margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin:14px 0}
.panel h3{margin:0 0 8px;font-size:16.5px}
.panel p,.panel li{font-size:14.5px}
.panel ul,.panel ol{margin:0;padding-inline-start:20px}
.panel li{margin-bottom:6px}
.big{font-size:16.5px;font-weight:600;border-inline-start:3px solid var(--a);background:#F3F6F2;padding:9px 12px;border-radius:0 8px 8px 0;margin:0 0 13px}
.warn{border-inline-start:3px solid var(--c8);background:#FAF0F1;padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:13px}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);
 border:1px solid var(--line);border-radius:9px;padding:5px 12px;color:var(--ink)}
.filter button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=search]{font:inherit;font-size:14px;width:100%;padding:8px 12px;border:1px solid var(--line);
 border-radius:9px;background:var(--card);color:var(--ink);margin-bottom:10px}
.count{font-size:12.5px;color:var(--soft);margin-bottom:12px}
.hidden{display:none}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:9px 11px;text-align:right;font-size:14px;border-bottom:1px solid #EFF1ED;vertical-align:top}
th{background:#DFE4DB;font-size:12.5px;font-weight:700}
tr:last-child td{border-bottom:0}
td.k{white-space:nowrap;font-size:12.5px;color:var(--soft)}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#EFF2ED;color:var(--ink);
 border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.chip:hover,.chip:focus-visible{background:var(--ink);color:#fff;border-color:var(--ink);outline:none}
.chip i{font-style:normal;font-size:10.5px;opacity:.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--cc)}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:0;font-size:13.5px;color:var(--soft)}
.card .meta{margin-top:8px;font-size:11.5px;color:var(--soft);display:flex;gap:7px;flex-wrap:wrap}
.card .meta span{background:#F1F3EE;border-radius:6px;padding:1px 7px}
.stack{margin:22px 0}
.layer{display:grid;grid-template-columns:64px 1fr;gap:10px 14px;align-items:center;background:var(--card);border:1px solid var(--line);
 border-inline-start:5px solid var(--lc);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;cursor:pointer}
.layer:hover{border-color:var(--ink)}
.layer .scale{font-family:"Aref Ruqaa",serif;font-size:19px;color:var(--lc)}
.layer h3{margin:0;font-size:16.5px}
.layer p{margin:3px 0 0;font-size:13.5px;color:var(--soft)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;margin:4px 0 8px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--c1),var(--c2),var(--c6))}
.hero h1{margin:0 0 8px}
.hero .lede{margin-bottom:14px}
.cta{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.cta button{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border-radius:11px;padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.cta button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.cta button:hover{border-color:var(--ink)}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;border-top:4px solid var(--hc);cursor:pointer}
.hcard:hover{border-color:var(--ink)}
.hcard h3{margin:0 0 3px;font-size:16px}
.hcard p{margin:0;font-size:13px;color:var(--soft)}
.hcard .n{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--hc);background:#F3F5F1;border-radius:6px;padding:2px 8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.stat b{color:var(--a)}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden;border-inline-start:5px solid var(--mc)}
.m-head{display:flex;gap:13px;padding:14px 16px;border-bottom:1px dashed var(--line);align-items:flex-start}
.m-badge{flex:0 0 auto;width:46px;height:46px;border-radius:11px;background:var(--mc);color:#fff;display:grid;place-content:center;font-family:"Aref Ruqaa",serif;font-size:20px}
.m-head h3{margin:0;font-size:17px}
.m-head p{margin:2px 0 0;font-size:13px;color:var(--soft)}
.m-body{padding:12px 16px 15px}
.wk{display:grid;grid-template-columns:62px 1fr;gap:0 11px;padding:7px 0;border-bottom:1px solid #F0F2EE;font-size:14.5px}
.wk:last-of-type{border-bottom:0}
.wk b{color:var(--mc);font-size:12.5px}
.deen{margin-top:11px;border:1px solid #CBE0D2;background:#F1F7F3;border-radius:10px;padding:10px 12px}
.deen h4{margin:0 0 3px;font-size:13.5px;color:#2C6E49}
.deen p{margin:0;font-size:14px}
.v{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--vc);border-radius:var(--r);margin:11px 0;padding:15px 17px}
.v-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.v h3{margin:0;font-size:17.5px}
.v .cat{font-size:11.5px;font-weight:700;color:#fff;background:var(--vc);border-radius:6px;padding:2px 8px}
.v .age{font-size:12px;color:var(--soft)}
.acts{margin:9px 0 0;padding:0;list-style:none}
.acts li{font-size:14.5px;padding:5px 0;border-bottom:1px solid #F1F3EF}
.acts li:last-child{border-bottom:0}
.acts b{color:var(--vc);font-size:12.5px;display:block}
.say{margin:8px 0 0;font-size:14px;background:#F6F7F5;border-radius:8px;padding:6px 10px}
details.vx{margin-top:9px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#FCFCFB}
details.vx summary{cursor:pointer;font-size:13.5px;font-weight:700}
details.vx[data-k="mis"] summary{color:var(--c8)}
details.vx[data-k="adp"] summary{color:#1D6A6A}
.mx{padding:9px 0;border-bottom:1px solid #F0F2EE;font-size:14px}
.mx:last-child{border-bottom:0}
.mx p{margin:0;line-height:1.7}
.mx .mm{font-weight:600}
.mx .mf{margin-top:3px;color:#2F5D50}
h2.sec{margin:46px 0 10px;padding-top:14px}
.panel{padding:18px 20px;margin:16px 0}
.panel p,.panel li{line-height:1.75}
.panel li{margin-bottom:8px}
ul.pts{list-style:none;padding:0;margin:0}
ul.pts li{padding:11px 0;margin:0;border-bottom:1px solid #EFF1ED}
ul.pts li:first-child{padding-top:2px}
ul.pts li:last-child{border-bottom:0;padding-bottom:2px}
ul.quotes{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.quotes li{background:#F6F7F5;border-inline-start:3px solid var(--a);border-radius:0 10px 10px 0;padding:9px 13px;margin:0;font-size:14.5px;line-height:1.7}
details.srcs{margin:10px 0 0}
details.srcs summary{cursor:pointer;font-size:12.5px;color:var(--soft);font-weight:600}
details.srcs .src{margin:7px 0 0}
p.src{font-size:12.5px;color:var(--soft);line-height:1.9}
p.src a{color:var(--soft)}
.rel{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel .lbl{font-size:12px;color:var(--soft);font-weight:700;margin-inline-end:2px}
.tocr a[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvlidx .chip{font-size:12px}
.v>*+*{margin-top:10px}
.v .v-head{margin-top:0}
.deen{margin-top:12px}
.stack .layer{margin-bottom:10px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:9px 0;display:grid;grid-template-columns:88px 1fr;overflow:hidden}
.slot .t{background:#F5F6F3;border-inline-end:4px solid var(--sc);padding:13px 11px;font-size:12.5px;font-weight:700;color:var(--soft)}
.slot .t b{display:block;color:var(--ink);font-size:14px}
.slot .c{padding:12px 15px}
.slot h3{margin:0;font-size:16px}
.slot p{margin:5px 0 0;font-size:14.5px}
.slot .role{margin:7px 0 0;font-size:13px;color:var(--soft);border-top:1px dashed var(--line);padding-top:6px}
.bar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:18px 0 9px;border:1px solid var(--line)}
.bar div{display:grid;place-content:center;color:#fff;font-size:11px;font-weight:600;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:9px 15px;font-size:12.5px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px}
.picker{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;margin:16px 0}
.picker h3{margin:0 0 3px;font-family:"Aref Ruqaa",serif;font-size:19px}
.picker p.s{margin:0 0 12px;font-size:13px;opacity:.75}
.pout{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:13px;min-height:82px}
.pout h4{margin:0 0 4px;font-size:17px}
.pout p{margin:0;font-size:14px;opacity:.85}
.pout .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.pout .meta span{background:rgba(255,255,255,.14);border-radius:6px;padding:2px 8px}
.picker button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin-top:11px;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:9px 18px}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.box h4{margin:0 0 5px;font-size:14px;color:var(--c5)}
.box ul{margin:0;padding-inline-start:17px}
.box li{font-size:13.5px;margin-bottom:2px}
/* situations */
.sit{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c8);border-radius:var(--r);margin:11px 0;padding:15px 17px}
.sit h3{margin:0 0 3px;font-size:17.5px}
.sit .why{font-size:14px;color:var(--soft);margin:0 0 9px}
.sit .row{display:grid;grid-template-columns:96px 1fr;gap:0 10px;padding:6px 0;border-bottom:1px solid #F1F3EF;font-size:14.5px}
.sit .row:last-of-type{border-bottom:0}
.sit .row b{font-size:12.5px;color:var(--c8)}
.sit .sch{margin-top:9px;font-size:13.5px;background:#F5F6F4;border-radius:8px;padding:8px 11px}
.sit .sch b{color:var(--c2)}
.school{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:9px 0;border-top:4px solid var(--c2)}
.school h4{margin:0 0 2px;font-size:16px}
.school .src{font-size:12.5px;color:var(--soft);margin:0 0 6px}
.school p{margin:4px 0 0;font-size:14px}
footer{margin-top:44px;padding-top:18px;border-top:2px solid var(--ink);font-size:13.5px;color:var(--soft)}
footer b{color:var(--ink)}
.brand .gh{align-self:center;display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;direction:ltr;white-space:nowrap}
.brand .gh:hover{background:var(--line)}
/* ponytail: on phones the brand row can't hold title+subtitle+age+star — drop the subtitle and the star's label */
@media (max-width:640px){.brand .ghl{display:none}.brand>span{display:none}.brand{gap:8px}}
@media(max-width:620px){
 .slot,.wk,.sit .row{grid-template-columns:1fr;gap:4px}
 .layer{grid-template-columns:44px 1fr;gap:4px 10px}
 .slot .t{border-inline-end:0;border-bottom:4px solid var(--sc);display:flex;gap:8px;align-items:baseline}
 th.hide,td.hide{display:none}
}
h2.sec{scroll-margin-top:calc(var(--toph,86px) + 56px)}
article.sit{scroll-margin-top:calc(var(--toph,86px) + 68px)}
.agebar{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft);margin-inline-start:10px}
.agebar select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.agehide{display:none!important}
#agenote{margin-bottom:0;padding-top:10px}
/* community */
.cform{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.cform label{display:block;font-size:13.5px;font-weight:700;margin-bottom:13px}
.cform .req{color:var(--c8)}
.cform input,.cform textarea,.cform select{font:inherit;font-size:14.5px;font-weight:400;width:100%;margin-top:5px;
 padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.cform textarea{resize:vertical;line-height:1.7}
.cform .hint{display:block;font-weight:400;font-size:11.5px;color:var(--soft);margin-top:4px}
.cform .ages{display:inline-flex;align-items:center;gap:7px;margin-top:5px;font-weight:400}
.cform .ages select{width:auto;margin-top:0;padding:8px 10px}
.cform .ages span{font-size:13px;color:var(--soft)}
.kpick{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.kpick button{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--paper);
 border:1px solid var(--line);border-radius:10px;padding:8px 16px;color:var(--ink)}
.kpick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cactions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cactions button{font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;
 border:0;border-radius:10px;padding:10px 20px}
.cactions button:disabled{opacity:.55;cursor:default}
.cmsg{font-size:13px;color:var(--soft)}
.cmsg.err{color:var(--c8);font-weight:700}
.cmsg.ok{color:#2C6E49;font-weight:700}
.linkbtn{font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:transparent;border:0;
 color:var(--c1);text-decoration:underline;padding:0}
.cpost{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--kc);
 border-radius:var(--r);margin:11px 0;padding:15px 17px}
.cpost h3{margin:0;font-size:17px}
.cmeta{font-size:12px;color:var(--soft);margin:5px 0 9px}
.cbody{font-size:14.5px;line-height:1.75;margin:0 0 9px;white-space:normal}
.likebtn{font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper);border:1px solid var(--line);
 border-radius:999px;padding:5px 13px;color:var(--soft);margin-top:9px}
.likebtn.on{background:#FBEEF0;border-color:var(--c8);color:var(--c8)}
.likebtn:disabled{opacity:.6}
/* unified in-tab index */
.navbar{position:sticky;top:var(--toph,86px);z-index:21;display:flex;align-items:center;gap:8px;
 background:rgba(233,237,231,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:7px 0;margin:0 0 8px}
.navbar .ix{flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
 background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 14px}
.navbar .ix svg{width:13px;height:13px;fill:currentColor}
.navbar .here{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar .fchip{flex:0 0 auto;display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
 background:#FBF6EA;border:1px solid #C9A94E;color:#7A5A18;border-radius:999px;padding:4px 6px 4px 11px;max-width:52vw}
.navbar .fchip.on{display:inline-flex}
.navbar .fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar .fchip button{flex:0 0 auto;font:inherit;font-size:14px;line-height:1;cursor:pointer;border:0;border-radius:50%;
 width:19px;height:19px;background:#C9A94E;color:#fff;display:grid;place-content:center;padding:0}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(20,32,28,.45)}
.sheet .pnl{position:absolute;inset-inline:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;
 background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.sheet .hd h3{margin:0;font-size:16px;flex:1}
.sheet .hd button{font:inherit;font-size:19px;line-height:1;cursor:pointer;background:transparent;border:0;color:var(--soft);padding:2px 6px}
.sheet .sr{padding:0 16px 11px;border-bottom:1px solid var(--line)}
.sheet .sr input{margin:0}
.sheet .none{padding:22px 10px;text-align:center;color:var(--soft);font-size:14px}
.sheet .bdy{overflow-y:auto;padding:8px 12px 26px;-webkit-overflow-scrolling:touch}
.sheet .gp{font-size:12px;font-weight:800;color:var(--soft);padding:12px 8px 5px;position:sticky;top:0;background:var(--paper)}
.sheet .it{display:block;width:100%;text-align:start;font:inherit;font-size:14.5px;cursor:pointer;background:var(--card);
 border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:6px;color:var(--ink)}

const VALUES=[
{"name":"الروتين والأمان","cat":"ذات","age":[3,8],"how":"القيمة دي مش بتتعلّم بالكلام، بتتعلّم بالتكرار الحرفي. نفس الترتيب كل يوم لمدة شهر لحد ما يبقى متوقّع، والتوقّع نفسه هو الأمان.","steps":[{"t":"جدول اليوم المصوّر","d":"اعمل مع طفلك جدول مصوّر لليوم — 5 صور (فطار، حضانة، غدا، لعب، حمام، نوم) ملزوقة على باب أوضته في مستوى نظره هو، مش نظرك انت. أول أسبوع انت اللي تشاور كل صبح: «خلصنا الفطار — جاي إيه؟»، وبعدها سيبه هو اللي يشاور ويقولك. الأمان بييجي من إنه يعرف إيه الجاي قبل ما يحصل.","say":"بص في جدولك — إحنا خلصنا إيه؟ وإيه الجاي؟"},{"t":"إنذار قبل كل انتقال","d":"الانتقال المفاجئ هو سبب معظم النوبات: طفل مندمج في المكعبات واتشال منها فجأة عشان الحمام. قبل أي انتقال — قفل التلفزيون، الخروج من البيت، لم اللعب — اديله إنذار بخمس دقايق وإنذار تاني بدقيقة، بنفس الجملة كل مرة. والتزم انت بالإنذار: لو قلت خمس دقايق متخليهاش عشرة.","say":"كمان خمس دقايق وبنلم المكعبات — هقولك تاني قبلها بشوية."},{"t":"روتين نوم ثابت لشهر","d":"ثبّت ترتيب النوم حرفيًا لمدة شهر: حمام، بيجاما، غسيل سنان، حدوتة واحدة، دعاء، نور مطفي — بنفس الترتيب حتى يوم الأجازة. التكرار الحرفي ده هو اللي بيحوّل الترتيب من قايمة أوامر لأمان: جسمه بيبدأ يهدى لوحده من عند غسيل السنان لأنه عارف إيه الجاي بالظبط.","say":"الأول بيجاما، وبعدين سنان، وبعدين حدوتة — زي كل يوم."},{"t":"نسخة يوم الكسر","d":"الروتين هيتكسر أكيد — عزومة رجعتوا منها متأخر، ضيوف قعدوا لبعد ميعاد النوم، سفر مصر في الأجازة. جهّز نسخة مختصرة بنفس الترتيب (سنان، دعاء، نور) تتعمل في أي مكان، بدل ما تشيله نايم من على الكنبة. ولو فيه يوم مختلف جاي — أجازة، سفر، عيد — قوله من بليل إيه اللي هيتغير وإيه اللي ثابت. الروتين القوي مش اللي عمره ما بيتكسر — ده اللي بيرجع بسرعة.","say":"النهارده مختلف شوية — بس السنان والدعا زي كل يوم، في أي حتة."}],"mastery":"بيقول هو اللي جاي في اليوم («وبعدين نستحمى») من غير ما يبص في الجدول.","acts":[{"t":"جدول اليوم المصوّر","mat":"موبايلك للتصوير، 5 صور مطبوعة أو كروت ترسموها، سلوتيب.","prep":"صوّر 5 لقطات حقيقية من يوم طفلك — بيفطر، لابس شنطة الحضانة، بيلعب، بيستحمى، نايم — واطبعها أو ارسموها سوا على كروت.","run":"خليه هو اللي يرتّب الكروت بترتيب اليوم ويلزقها بالسلوتيب على باب أوضته في مستوى نظره. كل صبح قفوا قدامها ثانية واحدة واسأله: «إحنا فين دلوقتي؟ وجاي إيه؟». وقوله: «انت اللي رتّبت يومك بنفسك»."},{"t":"بروفة النوم على الدبدوب","mat":"دبدوبه، بطانية صغيرة، فرشة سنان قديمة.","prep":"قبل معاد النوم بشوية، حضّر الحاجات وقوله: «الدبدوب هينام — نوّمه بنفس ترتيبنا إحنا».","run":"هو اللي يمشّي الدبدوب على الخطوات بالترتيب: بيجاما، سنان، حدوتة قصيرة، دعاء، نور مطفي — ولما بيعلّم الترتيب لحد تاني، الترتيب بيثبت في دماغه هو. في الآخر قوله: «شوف، الدبدوب عرف إيه اللي جاي عشان الترتيب ثابت»."}],"say":"الأول… وبعدين…","deen":["بسم الله والحمد لله","اربط الذكر بمحطات اليوم الثابتة نفسها اللي في الجدول: «بسم الله» قبل كل أكلة، و«الحمد لله» بعدها، ودعاء النوم آخر خطوة في روتين السرير كل ليلة — قولها انت بصوت واضح من غير ما تطلب منه يعيد، والتكرار اليومي في نفس اللحظة هو اللي هيخليها تطلع منه لوحده بعد أسابيع. والنبي ﷺ علّم الطفل عمر بن أبي سلمة على السفرة نفسها: «يا غلام، سمِّ الله وكُل بيمينك» (متفق عليه) — تعليم بجملة حانية في لحظة الفعل، مش محاضرة بعده. وكده الذكر بيبقى جزء من الأمان نفسه: علامة ثابتة بتقول لطفلك اليوم ماشي زي ما اتعودنا."],"skill":"يلبس بنفسه: يحط رجله في البنطلون ويدخل التيشيرت لوحده كخطوة ثابتة من روتين الصبح — لما اللبس ليه معاد ومكان ثابتين، بيبقى شغلانته هو مش معركة الصبح.","lvl":1,"ord":1,"tag":"الروتين والاستقلال","src":[["مجاني","قصص أطفال","https://www.belarabyapps.com/%d9%82%d8%b5%d8%b5-%d8%a3%d8%b7%d9%81%d8%a7%d9%84/"],["قصة · عصافير مميز","وقت النوم","https://3asafeer.com/ar/read/310/وقت-النوم"],["قصة · عصافير مميز","في المنزل","https://3asafeer.com/ar/read/126/في-المنزل"]],"mistakes":[{"m":"بتكسر الروتين بإيدك ليلة الخميس — «خليه يسهر معانا، بكره أجازة» — وبعدين تستغرب النوبة صبح يوم الحضانة. الروتين اللي شغال 5 أيام وواقع يومين بيتحول عنده من أمان لحاجة بتتفاوض.","fix":"يوم الأجازة ليه نسخة أرخى — مواعيد متأخرة شوية — بس بنفس الترتيب: حمام، بيجاما، حدوتة. الترتيب هو الثابت، مش الساعة."},{"m":"بتستعمل الجدول كتهديد: «مش ماشي في الجدول؟ يبقى مفيش حدوتة». كده الجدول اتحول من حاجة بتطمّنه لسلاح متشهر في وشه.","fix":"الجدول بيوصف اليوم، مش بيتساوم بيه. لو اتعطلتوا، شاور عليه بحياد: «إحنا هنا دلوقتي — جاي إيه؟» من غير خصم ولا مكافأة."},{"m":"الإنذار عندك بيتمط مع الزن: قلت «خمس دقايق»، زن شوية فبقوا عشرة، زن تاني فبقوا ربع ساعة. اللي اتعلمه مش الصبر — اتعلم إن كلامك ليه سعر بيتفاصل عليه.","fix":"خمس دقايق تبقى خمسة فعلًا. لو زن، قولها بهدوء ونفّذ: «أنا قلت خمس دقايق وخلصوا — بنلم دلوقتي» من غير ما صوتك يعلى."}],"adapt":[{"kid":"الحساس","how":"أي تغيير مفاجئ — حتى الحلو زي «هنروح الملاهي بدل الحضانة!» — بيقلبه. حضّره لأي خروج عن الجدول من بليل، وارسموا اليوم المختلف على ورقة صغيرة تتلزق جنب الجدول. المفاجآت مع الطفل الحساس بتتحكى قبلها، مش بتتزف عليه."},{"kid":"العنيد","how":"لو حس إن الجدول أوامر متعلقة على الحيطة هيحاربه. خليه هو اللي يلزق الصور ويقرر ترتيب اللي ينفع يتغير (يلعب قبل الحمام ولا بعده؟). لما الجدول يبقى بتاعه هو، هيدافع عنه بدالك."},{"kid":"كثير الحركة","how":"الانتقالات هي معركته: مش بيسمع الإنذار وهو مندمج. خلّي الإنذار يتلمس مش يتقال من بعيد — تيجي جنبه، إيدك على كتفه، يبصلك ويعيد وراك: «كمان خمس دقايق». والانتقال نفسه اعمله حركة: «مين يوصل الحمام الأول؟»"}]},
{"name":"تسمية المشاعر","cat":"ذات","age":[3,8],"how":"الطفل مش بيقدر يسمّي إحساس محدش سمّاه له. فالطريقة إنك تسمّي إحساسك وإحساسه بصوت عالي عشرات المرات قبل ما تتوقع منه يقولها.","steps":[{"t":"سمّي مشاعرك انت الأول","d":"طفلك مش هيسمّي إحساس عمره ما سمع حد بيسمّيه. سمّي مشاعرك انت بصوت عالي 3 مرات في اليوم في مواقف حقيقية: طابور الكاشير طويل — «أنا متضايق عشان الطابور طويل، هستنى وأنا واخد نفس»؛ جدو اتصل — «أنا مبسوط عشان جدو كلمنا». انت كده بتديله القاموس اللي هيستعمله بعدين.","say":"أنا متضايق شوية عشان اتأخرنا — مش زعلان منك انت."},{"t":"لوحة الأربع وشوش","d":"ارسموا سوا لوحة فيها 4 وشوش: فرحان، زعلان، خايف، متنرفز — والزقها على التلاجة في مستوى نظره. كل يوم في وقت ثابت (بعد ما يرجع من الحضانة مثلًا) اسأله يشاور هو أنهي وش النهارده، وانت كمان شاور على وشّك انت. الشور على الصورة أسهل له من الكلام في الأول.","say":"شاورلي على اللوحة — انت أنهي وش دلوقتي؟"},{"t":"سمّي إحساسه وقت الموقف","d":"وقت الموقف نفسه، سمّي إحساسه قبل أي حل أو نصيحة: برج المكعبات وقع وهو بيصرخ — انزل لمستواه وقول: «انت متنرفز عشان البرج وقع بعد تعب». استنى ثواني يهدى، وبعدين اسأله عايز يعمل إيه. التسمية لوحدها بتنزّل نص الانفعال.","say":"انت متنرفز عشان البرج وقع — ده فعلًا يغيظ."},{"t":"اقلب الاتجاه: هو اللي يسمّي","d":"بعد ما الأربع مشاعر يثبتوا في لسانه، بطّل تسبقه: لما ييجي زعلان اسأل الأول «انت حاسس بإيه؟» واستنى فعلًا — عشر ثواني سكوت صعبين عليك انت، بس هما اللي بيدوله فرصة يدوّر جواه. لو مش لاقي الكلمة، اعرض اتنين: «زعلان ولا متنرفز؟» وسيبه يختار.","say":"قبل ما تصرخ — قولهالي بكلمة: انت حاسس بإيه؟"},{"t":"وسّع القاموس","d":"ضيف كلمات جديدة واحدة واحدة — مكسوف، مخنوق، متشوق، مشتاق — في القصص وفي الشارع، مش في درس: الطفل اللي بيعيط عند باب الحضانة — «هو حاسس بإيه في رأيك؟ خايف ولا مكسوف؟». وكل ما كلمة تثبت، ارسموا لها وش جديد يتضاف للوحة التلاجة. فيه فرق كبير بين طفل يعرف يقول «أنا زعلان» وطفل يعرف يقول «أنا مكسوف».","say":"انت زعلان بس، ولا كمان مكسوف؟ فيه فرق."}],"mastery":"بيقول «أنا زعلان» أو «متضايق» وقت الموقف نفسه بدل الصريخ — حتى لو بعدها انفعل.","acts":[{"t":"لوحة الأربع وشوش","mat":"ورقة A4، ألوان، سلوتيب.","prep":"ارسم انت 4 دواير فاضية على الورقة، وحددوا وقت ثابت يوميًا للوقفة قدامها — بعد الرجوع من الحضانة مثلًا.","run":"طفلك يكمّل الوشوش جوه الدواير — فرحان، زعلان، خايف، متنرفز — ويلوّنهم، والزقوها على التلاجة في مستوى نظره. كل يوم في الوقت الثابت كل واحد فيكم يشاور على وشّه. قوله: «أنا النهارده الوش ده عشان حصل كذا — وانت؟»."},{"t":"مرايا المشاعر","mat":"من غير مواد — مراية الحمام أو مراية الدولاب بس.","prep":"قفوا انت وهو قدام المراية في أي وقت رايق — قبل الحمام أو بعد اللبس.","run":"اعمل انت وش (زعلان، خايف، مندهش) وطفلك يخمّن الإحساس، وبعدين اقلبوا الأدوار — هو يمثّل وانت تخمّن. تلات جولات كفاية، والضحك في النص جزء من التمرين مش تشويش عليه. قوله: «خمّن أنا حاسس بإيه دلوقتي؟»."}],"say":"انت مضايق عشان…","deen":["السلام وردّه","خلّي «السلام عليكم» عادة البيت الثابتة: انت اللي تبدأ بيها بصوت مبسوط كل ما تدخل أو تخرج، وبعدين اقلبوها لعبة — مين يكسب السلام الأولاني النهارده؟ النبي ﷺ قال: «أفشوا السلام بينكم» (رواه مسلم من حديث أبي هريرة)، والسلام نفسه كلمة بتنقل إحساس: اللي بيقولها بيقول لقدامه «اطمّن مني». ولما طفلك يلمس إن كلمة واحدة بتغيّر جو البيت كله، بيقرب من قلب المحور ده: الكلام بيسمّي المشاعر وبيوصّلها."],"skill":"غسل الإيدين والأسنان: يغسل إيديه بالصابون لوحده قبل كل أكلة، ويمسك فرشته بنفسه صبح وليل وانت بس بتراجع في الآخر — نفس الروتين اللي هيتطلب منه لوحده في حمام الحضانة.","lvl":1,"ord":2,"tag":"المشاعر","src":[["قناة","أهلاً سمسم","https://www.youtube.com/channel/UC48pfslXOUx-PZTLQxZjS4g"],["قصة · عصافير مميز","كتاب الوجوه","https://3asafeer.com/ar/read/199/كتاب-الوجوه"],["قصة · عصافير مميز","فرحان وغضبان","https://3asafeer.com/ar/read/689/فرحان-وغضبان"]],"mistakes":[{"m":"بتسمّي وتلغي في نفس الجملة: «انت زعلان — بس دي حاجة متزعلش». النص التاني بيمسح النص الأول، والرسالة اللي بتوصل: إحساسك غلط.","fix":"سمّي واسكت: «انت زعلان عشان البالونة طارت». خلاص. النصايح والحلول بعد ما يهدى — لو لسه ليها لزمة أصلًا."},{"m":"بتستعمل التسمية كزرار إطفاء: بتقول «انت متنرفز» وتستنى يسكت في ثانيتين، ولما ميسكتش بتتنرفز انت — «أنا فاهمك أهو! بس بقى!».","fix":"التسمية بتنزّل الانفعال، مش بتلغيه. سمّي مرة واحدة واستحمل باقي الموجة جنبه من غير تكرار ولا استعجال."},{"m":"في العزومات بتلبّسه إحساس مؤدب: «قول لطنط إنك مبسوط» وهو باين عليه العكس — كده بيتعلم إن فيه مشاعر رسمية بتتقال ومشاعر حقيقية بتتخبى.","fix":"قدام الناس اكتفي بالسلام المؤدب، ومشاعره الحقيقية اتكلموا فيها في العربية وانتو راجعين: «انت كنت مش مرتاح عند طنط — كنت حاسس بإيه؟»"}],"adapt":[{"kid":"الخجول","how":"الكلام عن المشاعر قدام حد تالت مستحيل عنده. خلّي التسمية في اللحظات الخاصة — في العربية، قبل النوم، وانتو لوحدكم — واقبل الإشارة بدل الكلمة: إنه يشاور على وش في اللوحة كفاية جدًا كبداية."},{"kid":"عالي الشدة","how":"من الشرارة للانفجار عنده ثانيتين — التسمية وقت النوبة بتيجي متأخرة. اشتغل على أول إشارة جسم: «إيدك اتقفلت — بتبدأ تتنرفز؟». ووقت العاصفة نفسها كلمة واحدة قصيرة أحسن من جملة كاملة."},{"kid":"العنيد","how":"لو سمّيت له هيرد «لأ أنا مش زعلان!» — متتجادلش على إحساسه، دي أرضه هو. قول «ماشي، أنا اللي شفت كده» وسيبها، أو سمّي من بعيد عن طريق لعبته: «الديناصور شكله متنرفز» — التسمية بالوكالة بتعدي من غير معركة."}]},
{"name":"الصبر والانتظار","cat":"ذات","age":[3,8],"how":"الوقت مفهوم مجرّد في السن ده، فلازم يبقى محسوس: تايمر يتشاف أو رمل ينزل. الانتظار بيتدرّب بالتدريج من 10 ثواني لدقيقة.","steps":[{"t":"لما تكون مشغول: تايمر وإشارة","d":"«استنى» كلمة مالهاش شكل عند طفل 4 سنين — الوقت لازم يتشاف. لما يطلبك وانت بتسخّن الغدا، اقلب ساعة رملية قدامه: «أول ما الرمل يخلص أنا معاك»، وخليه هو اللي يمسكها ويراقبها — المراقبة نفسها بتشغله عن الزن. ولما تكون بتتكلم مع حد، اتفقوا على إشارة بدل المقاطعة: هو يحط إيده على دراعك، وانت تحط إيدك فوق إيده — يعني «شفتك، ثواني وجايلك» — وبعدين اقطع كلامك فعلًا في أقرب فرصة. الإشارة بتعيش بس لو بتوفي بيها بسرعة في الأول.","say":"بص على الرمل — أول ما يخلص أنا جاي لك على طول."},{"t":"لعبة استنى الإشارة","d":"درّب الكبح باللعب: قفوا في طرقة البيت وقوله «مش هنجري غير لما أقول يلا» — وعدّ بصوت مسموع لخمسة قبل الإشارة. زوّد بالتدريج: خمسة، عشرة، خمستاشر، ومرة اعمل إشارة كاذبة («يـ… لأ لسه!») وهو يمسك نفسه. الجسم اللي اتدرّب يستنى في اللعب بيستنى أسهل في الحقيقة.","say":"استعد… استنى… استنى… يلا!"},{"t":"تأجيل صغير وبنلتزم بيه","d":"لما يطلب بسكوتة قبل الغدا، بدل «لأ» أو الاستسلام، اديله موعد محدد ونفّذه بالحرف: «بعد الغدا على طول». اللي بيبني الصبر مش التأجيل نفسه — إنه يكتشف بالتجربة إن الحاجة المتأجلة بتيجي فعلًا في معادها. لو وعدت ونسيت، علّمته إن الانتظار خسارة.","say":"مش قبل الغدا — بعد الغدا على طول، وأنا مش بنسى وعدي."},{"t":"الصبر في الأماكن العامة","d":"طابور الكاشير وأوضة انتظار الدكتور هما امتحان الصبر الحقيقي. جهّزه قبل ما تدخلوا: «هنستنى شوية في الطابور — نعدّ الحاجات الحمرا اللي على الرف؟»، وبعد ما تخلصوا سمّي اللي عمله بالوصف: «انت استنيت الطابور كله وإحنا بنتكلم». التجهيز قبل الموقف بينجح أكتر من التهدئة وقت الزن.","say":"انت استنيت لحد ما جه دورنا — ده اللي اسمه صبر."}],"mastery":"بيستحمل انتظار دقايق معدودة (بالتايمر أو العد) من غير زن — أغلب المرات.","acts":[{"t":"ساعة الرمل بتاعتنا","mat":"ساعة رملية (من لعبة طاولة قديمة أو محل ألعاب)، أو تايمر الموبايل بشاشة عدّاد ظاهرة قدامه.","prep":"خلّي الساعة جاهزة في مكان معروف، واستنى أول موقف انتظار حقيقي — هو عايز التابلت وأخوه ماسكه.","run":"اقلب الساعة قدامه وقول: «أول ما الرمل يخلص، دورك». خليه هو اللي يمسكها وهو اللي يعلن إن الوقت خلص — الإعلان ده بيخليه شريك في الانتظار مش ضحيته."},{"t":"لعبة استنى الإشارة","mat":"حتة سلوتيب على الأرض كخط بداية.","prep":"في الطرقة أو الريسبشن، الزق خط البداية واتفقوا على القاعدة: مفيش جري غير بعد «يلا».","run":"ابدأ بعدّ لخمسة وزوّد بالتدريج لحد خمستاشر، ودخّل إشارات كاذبة («يـ… لأ!») يمسك نفسه فيها. جولتين تلاتة كل مرة كفاية. قوله بعدها: «انت مسكت رجليك لحد الإشارة — ده أصعب جزء في اللعبة»."}],"say":"لما التايمر يرنّ.","deen":["إن الله مع الصابرين","الآية من سورة البقرة، ومكانها الصح مش كرسي التحفيظ — لحظة الانتظار نفسها: وهو ماسك ساعة الرمل مستني دوره، قول له بهدوء وابتسامة: «انت دلوقتي صابر، وربنا قال إن الله مع الصابرين». واستعملها على نفسك قدامه: في طابور السوبر ماركت قول بصوت مسموع «هنستنى دورنا — وربنا مع الصابرين». وخلي بالك: عمرها ما تتقال بنبرة تهديد ولا «اصبر وإلا» — أول ما الآية تبقى عقاب بتخسر معناها كله."],"skill":"فرز الغسيل: يقسم كومة الغسيل فاتح وغامق حتة حتة قبل ما الغسالة تدور — شغلانة بطيئة بطبيعتها بتعلّمه إن فيه حاجات نتيجتها بتيجي بعد ما نخلص، مش في نص الشغل.","lvl":1,"ord":7,"tag":"الإحباط والمحاولة","src":[["قصة · مجاني","لا تدع الحمامة تطيل السهر","https://3asafeer.com/ar/read/6/لا-تدع-الحمامة-تطيل-السهر"],["قصة · عصافير مميز","كم من الوقت تحتاج؟","https://3asafeer.com/ar/read/142/كم-من-الوقت-تحتاج؟"]],"mistakes":[{"m":"«ثانية واحدة» بتاعتك بتبقى ربع ساعة — فكلمة الوقت منك بقت بلا معنى، وبيزن فورًا لأن تجربته بتقوله إن الانتظار معاك مالوش آخر.","fix":"قول وقت حقيقي والتزم بيه: «هخلص الطبقين دول وجايلك» — حاجة بتتشاف وبتخلص فعلًا. ولو مش عارف قد إيه، متقولش رقم كذاب."},{"m":"بتستسلم عند الزنة العاشرة: «طب خلاص خد» — كده علّمته إن الصبر مدته عشر زنات بالظبط. اللأ اللي بتنجح مرة كل عشر مرات بتعلّم الزن أقوى من اللأ اللي بتنجح كل مرة.","fix":"اللي اتقال اتقال: «قلنا بعد الغدا — يبقى بعد الغدا»، بنفس النبرة الهادية في المرة الأولى والخامسة والعاشرة. الثبات هو اللي بيوقف الزن، مش الشرح."},{"m":"أي انتظار — مطعم، عربية، طابور — بتسده بالموبايل أو التابلت فورًا. كده هو عمره ما استنى أصلًا: اتنقل من تسلية لتسلية، وعضلة الانتظار محصلش إنها اشتغلت مرة.","fix":"الشاشة آخر حل مش أول حل: شنطة انتظار صغيرة فيها ورقة وقلمين وكتاب صغير، ولعب الملاحظة — «نعد الحاجات الحمرا» — قبل أي شاشة."}],"adapt":[{"kid":"كثير الحركة","how":"الانتظار الساكن مش واقعي معاه — جسمه لازم يشتغل عشان يستحمل. حوّل كل انتظار لمهمة حركية: في الطابور يعد البلاطات برجله، عند الدكتور يوصّلك حاجة من الشنطة، في العربية «مين يشوف عربية صفرا الأول». الصبر عنده حركة موجّهة، مش قعود."},{"kid":"عالي الشدة","how":"كلمة «استنى» نفسها ممكن تولّع النوبة. ابدأ بالاعتراف قبل الطلب: «انت عايزها دلوقتي دلوقتي، أنا عارف — وهي جاية بعد الغدا». وابني الانتظار من ثواني فعلًا (عشرة بالعد) قبل الدقايق، وعمرك ما تدرّب صبر وهو جعان أو نعسان — دي مش ساعة تمرين."},{"kid":"الحساس","how":"«استنى» ممكن توصله كأنها «انت مش مهم دلوقتي». اربط الانتظار بالاتصال مش بالرفض: «أنا شايفك ومستنيك — خليك انت ماسك الساعة الرملية ليّا». الساعة بتريحه لأن اللي بيقوله استنى بقى الرمل، مش انت."}]},
{"name":"الشجاعة وتجربة الجديد","cat":"ذات","age":[3,8],"how":"الشجاعة بتتبني من نجاح في حاجة صعبة شوية، مش من التشجيع الكلامي. خليه يقع ويحاول تاني وأنت متتدخلش بسرعة.","steps":[{"t":"الخوف مسموح يتقال","d":"الشجاعة مش إن الخوف يختفي — إنه يجرّب وهو خايف. فأول حاجة: الخوف في بيتكم حاجة بتتقال عادي، مش بتتخبى. لما يقف عند الزحليقة العالية ويشد في إيدك، سمّي من غير تكسيف: «انت خايف من العلو — الخوف بييجي لكل الناس». واحكيله عن خوفك انت: «أنا كنت بخاف من العوم وأنا صغير». الطفل اللي خوفه ليه اسم بيقدر يعدّيه — اللي بيتكسف منه بيخبيه وبيكبر معاه.","say":"انت خايف — والخايف اللي بيجرب هو الشجاع بجد."},{"t":"كلمة لسه","d":"خد كلمة «لسه» قاعدة بيت: كل ما يقول «أنا مش عارف» كمّلها له — «مش عارف… لسه». وطبّقها على نفسك قدامه: وانت مش قادر تفتح برطمان المربى — «مش قادر أفتحه… لسه، هجرّب بطريقة تانية». الكلمة دي بتحوّل الفشل من حكم نهائي لمحطة في الطريق.","say":"انت مش عارف تعملها… لسه."},{"t":"عدّ لعشرة قبل التدخل","d":"اديله تحدي أصعب من مستواه بدرجة واحدة — بازل 24 قطعة بدل 12 — ولما يتزنق، عدّ في سرك لعشرة قبل ما تقرّب. لو طلب مساعدة، اديله أصغر مساعدة ممكنة: لف القطعة الصح ناحيته، متركبهاش له. الشجاعة بتتبني من تجربة «كانت صعبة وعملتها» — مش من التشجيع الكلامي.","say":"جرّب تلفها كده — انت قرّبت."},{"t":"الجديد على السفرة وفي الجنينة","d":"على السفرة: حط الحاجة الجديدة جنب المألوف، جرّب انت قدامه بحماس وقول رأيك بصراحة — والقرار قراره، من غير طلب ولا مدح لو جرّب. وفي الجنينة نفس المنطق معكوس: درجة أعلى في الزحليقة أو تسلق جديد — شجّعه يجرب وانت واقف قريب من غير ما تشيله.","say":"أنا هجرّب — انت براحتك، الطبق موجود."},{"t":"مكان جديد وانت جنبه","d":"في المكان الجديد — أول حصة كاراتيه، عزومة فيها أطفال ميعرفهمش — متدفعوش بـ«روح العب معاهم» ومتشيلوش من الموقف كمان. اقعد جنبه على الحافة وسمّي اللي بيحصل: «انت بتتفرج الأول عشان تفهم — لما تحب تدخل أنا هنا». وبعد ما يجرب، صف اللي عمله: «كنت متوتر ودخلت لعبت برضه».","say":"خد وقتك وانت بتتفرج — أول ما تحب تدخل، أنا واقف هنا."}],"mastery":"بيقول «هجرب» لحاجة جديدة حتى وهو متوتر — وانت جنبه.","acts":[{"t":"تحدي الدرجة الأصعب","mat":"من لعبه الموجودة: بازل أو تركيبة أصعب بدرجة واحدة من المعتاد — بازل 24 بدل 12، أو مكعبات لبرج أطول من اللي بيبنيه.","prep":"اختارها وحطها على الترابيزة في وقت رايق، واقعد قريب منه من غير ما إيدك تتحرك.","run":"قول: «ده صعب شوية — نشوف هتوصل لفين»، وسيبه يشتغل لوحده. لما يتزنق عدّ لعشرة في سرك، ولو طلب مساعدة لف له قطعة واحدة بس. في الآخر صف المجهود: «القطعة دي غلّطتك تلات مرات وفضلت تحاول لحد ما ركبت»."},{"t":"طبق التجربة","mat":"3 حاجات بيحبها + حاجة واحدة جديدة من المطبخ (زيتون، جبنة مختلفة، خيار مقطع طولي بدل دواير).","prep":"على العشا، حط الأربع حاجات في الطبق وأعلن القاعدة: كل واحد على السفرة — انت كمان — بيجرّب لقمة من الحاجة الجديدة ويقول رأيه بصراحة.","run":"جرّب انت الأول وقول: «همم… طعمها غريب، بس هاخد كمان لقمة». لو رفض، مفيش أي تعليق — الطبق هيرجع يظهر تاني الأسبوع الجاي."}],"say":"صعبة… لسه.","deen":["الله معانا","احكي له قصة الغار ببساطة قبل النوم: النبي ﷺ وصاحبه أبو بكر كانوا مستخبيين في الغار والخطر واقف على بابه، فطمّنه النبي: «لا تحزن إن الله معنا» (سورة التوبة) — خوف حقيقي، وكلمة واحدة هدّته. وبعدين استعمل نفس الكلمة في مواقفه هو: قدام الأوضة الضلمة أو أول يوم في مكان جديد، قول له وانت ماسك إيده: «جرّب — أنا جنبك وربنا معانا». وخليها طمأنينة بس: عمرك ما تستخدم ربنا للتخويف — الطفل اللي بيسمع «الله معانا» وقت خوفه بيكبر وربنا عنده مصدر أمان مش مصدر رعب."],"skill":"لبس وقفل الجزمة: يعرف رجله اليمين من الشمال ويقفل اللزقة بنفسه وهو قاعد جنب الباب قبل النزول — مهارة كانت صعبة عليه من شهر، وكل صبح بيثبت لنفسه إن الصعب بيتعمل.","lvl":2,"ord":6,"tag":"الخوف والشجاعة","src":[["قصة · مجاني","مرحى مرحى للفشل","https://3asafeer.com/ar/read/18/مرحى-مرحى-للفشل"],["قصة · مجاني","كتاب الوحش المخيف","https://3asafeer.com/ar/read/40/كتاب-الوحش-المخيف"]],"mistakes":[{"m":"بتقوله «متخافش، مفيش حاجة تخوّف» — انت كده بتنكر إحساس هو حاسه فعلًا، فبيتعلم إن فيه حاجة غلط فيه هو مش في الموقف. النفي عمره ما شجّع حد.","fix":"اعترف وبعدين صغّر الخطوة: «انت خايف من الكلب — تعالى نتفرج عليه من هنا الأول». الخوف يتسمى، والخطوة تتصغّر."},{"m":"بتعرّفه للناس بصفته: «معلش هو خوّاف» أو «ده حساس شوية» وهو واقف بيسمع — الجملة اللي بتتقال عنه قدامه بتتحول لهوية بيلبسها ويتصرف على أساسها.","fix":"قدام الناس قول وصف مؤقت ومفتوح: «هو بياخد وقته الأول وبعدين بيدخل» — ودي بتتحول لحقيقة لما بتفضل تتقال."},{"m":"لما بيجرب وينجح بتقول «شفت؟ قلتلك مفيش حاجة تخوف!» — كده لغيت بطولته: هو عاش إنها كانت صعبة، وانت بتأكدله إن إحساسه كان وهم.","fix":"الصعوبة هي البطولة — سمّيها: «دي كانت صعبة عليك، وعملتها وانت خايف». دي الجملة اللي بتخليه يجرب تاني."}],"adapt":[{"kid":"الحساس","how":"محتاج ضعف وقت التفرج قبل ما يدخل، ومحتاج يعرف قبلها: قبل الحفلة أو الحصة الجديدة بيوم، احكيله هيلاقي إيه — مين هيبقى موجود، شكل المكان، إيه اللي هيحصل بالترتيب. الجديد المفاجئ عنده تهديد؛ الجديد المتحكي عنه قبلها بيبقى خطة."},{"kid":"كثير الحركة","how":"مشكلته العكس — بينط قبل ما يبص. الشجاعة عنده مش محتاجة تشجيع، محتاجة فرملة: درّبه على وقفة الثانية — «بص الأول: عالية قد إيه؟ هتنزل منين؟ يلا». الجملة اللي بيسمعها منك مش «جرّب» — «خد ثانية وبعدين جرّب»."},{"kid":"الخجول","how":"الصعب عنده مش الزحليقة — البشر. في العزومة وصلوا بدري قبل ما الأطفال يتلموا: اللي بييجي الأول بيبقى صاحب المكان، واللي بييجي متأخر بيقتحم مجموعة جاهزة. واديله دور معاه — هو اللي ماسك طبق البسكوت — الدور بيديله سبب يقرّب من غير ما يحتاج يتكلم."}]},
{"name":"الاستقلال","cat":"ذات","age":[3,8],"how":"كل مرة تعمل له حاجة يقدر يعملها، بتاخد منه ثقة. الطريقة: اديه وقت أطول، واقبل نتيجة أقل إتقانًا.","steps":[{"t":"بيت على مقاسه","d":"الاستقلال بيبدأ من إن الحاجة أصلًا في متناوله: علاقة واطية لشنطة الحضانة جنب الباب، كوباية بلاستيك على رف يوصله، سلمة صغيرة قدام حوض الحمام، وجزمته في مكان ثابت. لف البيت واسأل نفسك: إيه اللي بيطلبه مني كل يوم وهو يقدر ياخده بنفسه لو وطّيته له؟","say":"ده مكانك انت — تقدر توصله من غير ما تنادي حد."},{"t":"قرار يومي من اختيارين","d":"اديله قرار حقيقي واحد كل يوم من اختيارين انت موافق عليهم الاتنين: «التيشيرت الأزرق ولا الأصفر؟»، «تفاحة ولا موزة في علبة الحضانة؟». واحترم اختياره للآخر حتى لو الألوان طلعت مش متناسقة — لو لغيت اختياره بعد ما اختار، علّمته إن قراره شكلي.","say":"انت اللي بتقرر النهارده — أنهي واحد فيهم؟"},{"t":"مهمة كاملة بلا تدخل","d":"اختار مهمة واحدة يعملها من الأول للآخر بلا إيد منك: يجهّز شنطة الحضانة — يحط الزمزمية وعلبة الأكل والمنديل بنفسه — وانت مراجعتك بالكلام بس: «بص جوه… افتكرنا كل حاجة؟». لو السوستة مقفولة نص قفلة، سيبها زي ما هي؛ لو قفلتها وراه أخدت المهمة منه تاني.","say":"دي مهمتك انت من الأول للآخر — أنا هنا لو احتجتني."},{"t":"لما يقولك اعملهالي انت","d":"هييجي يوم يقف قدامك بالجزمة اللي بيلبسها لوحده من شهر ويقول «البسهالي انت». دي مش خسارة للي اتعلمه — ساعات بيكون تعبان، وساعات عايز قربك مش خدمتك. متشتمش فيه («انت كبير بقى!») ومتلبسهاش له كاملة: اعرض شراكة — «أنا أفك الشريط وانت تدخل رجلك». ولو اليوم كله كان صعب عليه، اعملها له المرة دي واحضنه — الاستقلال المبني على أمان بيرجع لوحده تاني يوم.","say":"تعالى نعملها سوا — انت حتة وأنا حتة."},{"t":"روتين الصبح بالكلام بس","d":"الهدف النهائي: روتين الصبح كله بمساعدة كلامية بس. الهدوم متحطة من بليل على الكرسي، وانت الصبح بتقول الخطوة الجاية من غير ما إيدك تتحرك: «خلصت الهدوم — إيه اللي بعدها؟». صحّيه ربع ساعة بدري: الوقت الزيادة ده هو تمن الاستقلال، والاستعجال هو اللي بيرجّعك تلبّسه بنفسك.","say":"انت خلصت هدومك لوحدك — فاضل إيه في جدول الصبح؟"}],"mastery":"بيخلّص روتين الصبح (هدوم، شنطة) بمساعدة كلامية بس.","acts":[{"t":"شنطة الحضانة عليه هو","mat":"ورقة وألوان للستة المصورة، سلوتيب، والتلات حاجات بتوع الشنطة: زمزمية، علبة أكل، منديل.","prep":"ارسموا سوا لستة مصورة بالتلات حاجات والزقوها جنب علاقة الشنطة.","run":"كل يوم بليل هو اللي يحط التلاتة بنفسه وانت تراجع بالكلام بس: «بص في اللستة — كل حاجة دخلت؟». لو نسي حاجة، خليه يكتشفها في الحضانة مرة — النسيان الصغير ده معلم أحسن من تذكيرك الدايم. قوله: «الشنطة دي شغلك انت — أنا بس بسأل»."},{"t":"سندوتش بإيده","mat":"عيش توست، جبنة قابلة للفرد، سكينة بلاستيك، طبق.","prep":"طلّع الحاجات على الترابيزة وبس — دورك يقف عند هنا.","run":"هو يفرد الجبنة ويقفل التوست ويقطعه نصين بالسكينة البلاستيك، والكركبة اللي هتحصل جزء من التمرين مش غلطة. امسحوها سوا في الآخر وهو ياكل اللي عمله. قوله: «انت عملت سندوتشك بنفسك من الأول للآخر»."}],"say":"انت تقدر تعمل دي لوحدك.","deen":["مراجعة: الأذكار عادة مش تلقين","دي محطة مراجعة مش ذكر جديد: الاستقلال في الدين معناه إن اللي زرعته قبل كده — «بسم الله» قبل الأكل، و«الحمد لله» بعده، ودعاء النوم — يطلع من طفلك لوحده من غير تلقين. جرّب أسبوع كامل: متقولش انت الذكر الأول، واستنى ثانيتين قبل اللقمة الأولى وشوف هيفتكر ولا لأ — ولو نسي، قولها انت عادي من غير عتاب، لأن القدوة بترجّع العادة أسرع من التصحيح. ولما تطلع منه لوحدها، افرح بيها قدامه: «قلتها من نفسك من غير ما حد يفكّرك» — العبادة اللي طالعة بحب أثبت من اللي طالعة بأمر."],"skill":"روتين الصبح كامل: يقوم يلبس ويفطر ويشيل شنطته لحد الباب بمساعدة كلامية بس («إيه الجاي؟») من غير ما إيدك تتدخل — نفس الاستقلالية اللي المس بتستناها منه في يوم الحضانة.","lvl":1,"ord":6,"tag":"الروتين والاستقلال","src":[["قصة · عصافير مميز","أريد أن أكون","https://3asafeer.com/ar/read/59/أريد-أن-أكون"],["قصة · عصافير مميز","عندما أكبر","https://3asafeer.com/ar/read/50/عندما-أكبر"]],"mistakes":[{"m":"بتصلّح شغله قدامه: رص السرير فتظبطه وراه، قفل السوستة نص قفلة فتكملها. كل تصليح قدام عينه رسالة واحدة: «محاولتك مش كفاية» — فبيبطل يحاول وبيستناك.","fix":"النتيجة الناقصة تفضل زي ما هي — التيشيرت بالمقلوب مش هيأذي حد. ولو التصليح ضروري فعلًا، اعمله بعيد عن عينه."},{"m":"طول الأسبوع «يلا أنا هلبسك إحنا متأخرين» وبعدين بتستغرب إنه مش بيحاول. الاستعجال الصباحي بيمسح تدريب الأسبوع كله — هو فهم إن اللبس شغلتك انت، والزن بيسرّعك.","fix":"ربع ساعة صحيان بدري هي تمن الاستقلال — أرخص تمن هتدفعه. واليوم اللي انت فعلًا مزنوق فيه قولها صريحة: «النهارده أنا هساعدك عشان مستعجلين — ده مش كل يوم»."},{"m":"بتديله اختيار وهمي: «تحب تلبس بقى؟» — وهو أصلًا لازم يلبس، فلما يقول «لأ» بتفرض عليه. كده الاختيار بقى خدعة، والكلمة خسرت معناها.","fix":"الاختيار بين حاجتين انت موافق عليهم الاتنين: «الأزرق ولا الأصفر؟» — مش على القرار نفسه. واللي مش قابل للنقاش قوله كخبر، مش كسؤال."}],"adapt":[{"kid":"العنيد","how":"الاستقلال وقوده الطبيعي — بس أي مهمة توصله كأمر هيرفضها حتى لو بيحبها. غلّف كل حاجة بالملكية: مش «اجمع شنطتك» — «شنطتك دي مسؤوليتك انت، محدش غيرك بيفتحها». العنيد اللي عنده سلطة حقيقية على حاجاته بيبطل يتخانق على سلطة وهمية."},{"kid":"الحساس","how":"أول غلطة — المية اتدلقت، السوستة علقت — ممكن تنهيه: يرمي كل حاجة ويعيط. قسّم المهمة لمكاسب صغيرة، وخليك قريب جسديًا في أول مرات من غير ما تتدخل، وسمّي المحاولة قبل النتيجة: «انت جربت تلات مرات» — حضورك الهادي جنبه هو اللي بيخليه يستحمل التعثر."},{"kid":"كثير الحركة","how":"بيبدأ يجهز الشنطة وينتهي بيلعب بالزمزمية — الخيط بيضيع في نص المهمة. متكبرش المهام: خطوة واحدة بالاسم («الزمزمية في الشنطة — خلصت؟ دلوقتي علبة الأكل»)، وصور الخطوات ملزوقة جنب الباب بترجّعه للخيط من غير صوتك."}]},
{"name":"ضبط الغضب","cat":"ذات","age":[4,8],"how":"التدريب بيحصل وهو هادي مش وقت النوبة. وقت النوبة الهدف تهدئة بس؛ التعليم بعدين.","steps":[{"t":"سمّي غضبك انت","d":"طفلك بيتعلم إدارة الغضب من مشاهدتك انت وانت غضبان أكتر من أي تمرين: العربية واقفة في الزحمة — قول بصوت مسموع: «أنا متنرفز من الزحمة… هاخد نفسين». ولما تشوفوا طفل بينوّب في السوبرماركت، اتكلموا بعدها بهدوء: «هو كان حاسس بإيه؟ إيه اللي كان ممكن يساعده؟».","say":"أنا متنرفز دلوقتي — هاخد نفسين وبعدين أرد عليك."},{"t":"بالونة النفس وقت الهدوء","d":"التنفس بيتدرّب وهو رايق — قبل النوم أو بعد الاستحمام — مش وقت النوبة: قوله «هنملا البطن هوا زي البالونة ونفضّيها بالراحة»، وحط إيده على بطنه يحسها بتعلى وتنزل، تلات مرات. اللي اتمرّن عليه مية مرة في الهدوء هو بس اللي ممكن يطلع وقت الغضب.","say":"تعالى ننفخ بالونة البطن — شهيق… وفضّيها بشويش."},{"t":"ركن الهدوء مش عقاب","d":"في وقت هادي اسأله: «لما جواك نار بتحب تروح فين؟» وجهّزوا سوا ركن هدوء: مخدة وكتاب مصور ودبدوبه في ركن الأوضة — هو اللي يختار اللي فيه. ده مش خانة عقاب ولا «روح اقعد هناك»: هو اللي بيروحه بمزاجه وبيرجع لما يهدى.","say":"ده ركنك لما تحس إن جواك نار — تروحه وترجع لما تهدى."},{"t":"علامات البركان","d":"علّمه يمسك الغضب وهو لسه شرارة: في وقت هادي اسأله «لما بتبدأ تتنرفز، جسمك بيعمل إيه؟» — وساعده يلاقيها: «إيدي بتتقفل»، «وشي بيسخن»، «صوتي بيعلى». وانت لما تشوف العلامة عليه، سمّيها بحياد قبل الانفجار: «شايف إيدك اتقفلت — البركان بيسخن؟». الطفل اللي بيحس بالبركان وهو بيسخن بيلحق يعمل حاجة قبل ما يفور — ودي مهارة كتير من الكبار نفسهم مش عندهم.","say":"إيدك اتقفلت — حاسس بالنار بتبدأ؟ تحب تروح لركنك؟"},{"t":"وقت النوبة أمان بس","d":"وقت النوبة نفسها الهدف واحد: أمان وكلام قليل. انزل لمستواه، ولو إيده بتضرب امسكها بهدوء وقول: «مش هسيبك تضرب» — من غير شرح ولا تفاوض ولا محاضرة. المخ وقت العاصفة مقفول، وكل جملة زيادة حطب على النار.","say":"أنا هنا معاك — مش هسيبك تضرب، ولما تهدى نتكلم."},{"t":"بعد ما يهدى: الحكاية والخطة","d":"بعد الهدوء بوقت كافي — مش أول ما يسكت — ارجعوا للي حصل كحكاية مش كمحاكمة: «انت كنت بتلعب، وأخوك خد العربية، وجواك ولعت نار، وضربت». وبعدين سؤالين: «نعمل إيه المرة الجاية بدل الضرب؟» و«نصلّح إزاي؟» — لو ضرب يطمن على أخوه، لو رمى المكعبات يلمها. الإصلاح بيقفل الدايرة من غير ذنب معلق، والخطة بتجهّز للنوبة الجاية.","say":"النار ولعت وعدّت — دلوقتي نفكر: المرة الجاية نعمل إيه بدالها؟"}],"mastery":"لما يتنرفز بيروح لركن الهدوء أو ياخد نفس بدل الضرب — حتى لو مش كل مرة.","acts":[{"t":"بالونة حقيقية للنفس","mat":"بالونة حقيقية.","prep":"اختار وقت هادي — قبل الحدوتة بالليل أنسب معاد — مش وقت النوبة نفسها.","run":"انفخ البالونة قدامه بالراحة، وبعدين سيب الهوا يطلع منها بشويش وقوله: «بطنك بتعمل زي كده بالظبط». بعدها اعملوا تلات أنفاس سوا وإيده على بطنه: شهيق يملا البالونة، وزفير طويل يفضّيها — وكرروها كل ليلة عشان الحركة تتحفظ في جسمه. قوله: «املا بطنك زي البالونة… وفضّيها بشويش»."},{"t":"بناء ركن الهدوء","mat":"كرتونة كبيرة أو الركن اللي ورا الكنبة، مخدة، بطانية صغيرة، كتاب مصوّر، دبدوبه.","prep":"في يوم رايق اختاروا المكان سوا، وهو اللي يختار كل حتة ويرتّبها بنفسه.","run":"أول ما يخلص اعملوا بروفة وانتوا مبسوطين: يدخل يقعد دقيقة ويطلع — عشان الركن يتربط في دماغه بالأمان مش بالعقاب. قوله: «ده ركنك انت — نجرّبه دلوقتي وإحنا رايقين عشان نعرفه كويس»."}],"say":"خلينا ننفخ بالونة.","deen":["«لا تغضب»","راجل جه للنبي ﷺ يطلب وصية، فقال له كلمة واحدة وكرّرها كل ما الراجل يعيد السؤال: «لا تغضب» (رواه البخاري من حديث أبي هريرة) — احكيها لطفلك كحدوتة قصيرة في وقت رايق، مش وقت النوبة. والفعل العملي: بعد ما يهدى شوية، خده ناحية الحنفية «تعالى نغسل وشنا وإيدينا بمية باردة» — ورد عند أبي داود إن الغضب يُطفى بالمية، وجسم الطفل فعلًا بيهدى بيها. والقدوة قبل كل ده: لما تتنرفز انت، قول قدامه بصوت مسموع «أنا متنرفز — هاخد نفس وأهدى»، فيشوف بعينه إن الكبار كمان بيضبطوا غضبهم."],"skill":"يعبّر عن اعتراضه بجملة: يقول «أنا متضايق عشان خدت اللعبة» بدل ما يضرب أو يرمي — نفس الجملة اللي هتحل له خناقات الحضانة قبل ما المس تضطر تتدخل.","lvl":2,"ord":1,"tag":"الغضب","src":[["مجاني","آداب وسلوكيات","https://www.belarabyapps.com/%d8%a7%d9%84%d8%b7%d9%81%d9%84-%d8%a7%d9%84%d9%85%d8%b3%d9%84%d9%85/%d8%a7%d8%af%d8%a7%d8%a8-%d9%88%d8%b3%d9%84%d9%88%d9%83%d9%8a%d8%a7%d8%aa-ar/"],["قصة · عصافير مميز","عندما أغضب","https://3asafeer.com/ar/read/189/عندما-اغضب"],["قصة · عصافير مميز","اهدأ يا منفوخ","https://3asafeer.com/ar/read/1467/اهدأ-يا-منفوخ"]],"mistakes":[{"m":"بتحاول تعلّم وقت النوبة نفسها: شرح ومحاضرة و«اهدى بقى وخد نفس زي ما اتفقنا» وهو في قمة الانفجار — المخ وقتها مقفول، وكلامك بيزود الحمل مش بينزله.","fix":"وقت النوبة: حضور وأمان وكلام قليل جدًا. كل التعليم — النفس، الركن، الخطة — مكانه وقت الهدوء، قبلها أو بعدها."},{"m":"بتعاقب على الإحساس مش على السلوك: «ادخل أوضتك عشان انت غضبان» — فبيتعلم إن الغضب نفسه ذنب، ويبدأ يكتمه لحد ما ينفجر أكبر، أو يخاف من نفسه لما يحس بيه.","fix":"افصلهم بصوت عالي: «الغضب مسموح — الضرب لأ». الإحساس كله مقبول، والسلوك بس هو اللي عليه حدود."},{"m":"بتطفي النوبة بالتنازل: نوّب عشان التابلت فديتهوله «خد بس اسكت» — من اللحظة دي النوبة بقت مفتاح شغال، وهتتكرر أكتر لأنها ببساطة بتنجح.","fix":"هدّي من غير ما تلغي القرار: انزل لمستواه، سمّي إحساسه، استحمل العياط — والتابلت يفضل مقفول. الحنية في الصوت، والثبات في القرار."}],"adapt":[{"kid":"عالي الشدة","how":"نوباته أطول وأعلى من أقرانه — ودي طبيعته مش فشلك. ركن الهدوء لوحده مش هيشتغل في عز العاصفة: هو محتاجك أقرب مش أبعد — قعدة صامتة جنبه لحد ما الموجة تعدي. اديله مخرج جسدي مسموح (مخدة يعصرها، ينط)، وقيس التقدم بالشهور: النوبة اللي كانت نص ساعة وبقت عشر دقايق دي مكسب كبير."},{"kid":"الحساس","how":"فخّه بييجي بعد النوبة: بيخجل من نفسه — «أنا وحش» — وده أخطر من الغضب نفسه. في حكاية ما بعد الهدوء افصل بوضوح: «انت مش وحش — انت اتنرفزت والنرفزة عدّت، وأنا بحبك وانت غضبان زي ما بحبك وانت مبسوط». من غير الجملة دي كل نوبة بتاكل من صورته عن نفسه."},{"kid":"كثير الحركة","how":"قعدة التنفس الهادية مش لغته — جسمه بيهدى بالحركة مش بالسكون. بدل الركن الساكن: يجري لآخر الطرقة ويرجع عشر مرات، ينط ويعد النطات بصوت عالي، يزق الحيطة بكل قوته. بعد ما الطاقة تنزل بالحركة، ساعتها النفس والكلام بيلاقوا مكان."}]},
{"name":"الإصرار وإتمام العمل","cat":"ذات","age":[4,8],"how":"احتفل بالإتمام مش بالنتيجة. ومشروع واحد صغير يخلص أحسن من عشرة يبدأوا.","steps":[{"t":"نخلّص اللي بدأناه","d":"خليها قاعدة بيت معلنة وبتتقال قبل البدايات مش بعدها: قبل ما يفتح علبة المكعبات والبازل لسه مفروش على الترابيزة — «فيه حاجة مفتوحة… نخلّصها ولا نلمّها الأول؟». والقاعدة على الكبار كمان: قوله «أنا مش هفتح الكتاب الجديد غير لما أخلّص اللي في إيدي».","say":"إحنا في البيت ده بنخلّص اللي بدأناه قبل ما نفتح جديد."},{"t":"قسّم الصعب لحتت صغيرة","d":"لما يزهق في نص لم اللعب أو نص البازل، متكملش انت وراه — صغّر الخطوة الجاية بس: «مش هنلم الأوضة كلها… المكعبات الحمرا بس. خلصت؟ دلوقتي الصفرا». النهاية القريبة اللي بيشوفها بعينه هي اللي بتخليه يكمل، مش صوتك العالي.","say":"مش كله مرة واحدة — الحتة الصغيرة دي بس، وبعدين نبص للي بعدها."},{"t":"لما يقع تعبه","d":"أصعب لحظة في الإصرار مش الزهق — الانهيار: البرج اللي خد نص ساعة وقع، الرسمة اتقطعت وهو بيمسح. سمّي الأول من غير تهوين: «انت تعبت فيه ووقع — ده يوجع فعلًا». استنى الموجة تعدي، وبعدين متقولش «ابنيه تاني» — دي كبيرة أوي دلوقتي. قول «نحط أول مكعبين بس؟» وابدأ معاه إيد بإيد. أول مكعبين بيكسروا سحر الانهيار — والباقي بييجي لوحده.","say":"وقع بعد تعب — بيوجع فعلًا. تعالى نحط أول مكعبين وبس."},{"t":"مشروع التلات أيام","d":"اعملوا مشروع بيخلص على تلات أيام مش في قعدة واحدة: عدس في قطنة مبلولة، رسمة كبيرة بتتلوّن على مراحل، مجسّم مكعبات كبير. كل يوم شغل شوية، والمشروع يفضل في مكان ظاهر — على رف المطبخ — بعلامة «لسه شغالين فيه». كده بيعيش تجربة إن الحاجات الكبيرة بتخلص بالتقسيط، وإن الوقفة المعلنة مش سيبان.","say":"إحنا مخلصناش — إحنا كمّلنا حتة النهارده، وبكره نكمّل اللي بعدها."},{"t":"احتفل بالإتمام مش النتيجة","d":"لما يخلّص، خلّي وصفك على الإتمام مش على الجمال: «انت كمّلت البازل للآخر مع إنه كان صعب» — مش «رسمتك أحلى رسمة في الدنيا». ورجّعوا سوا شريط المحاولة: «فاكر لما كنت هتسيبها في النص؟ وبعدين عملت إيه؟» — عشان يسمع قصة نفسه كواحد بيكمّل للآخر.","say":"انت كنت هتسيبها في النص — وكمّلتها للآخر."}],"mastery":"بيكمل المهمة الصعبة للآخر (بازل، تركيب) بدل ما يسيبها في النص.","acts":[{"t":"مزرعة العدس","mat":"كوباية بلاستيك شفافة، قطن من علبة القطن، حبات عدس أو فول من رف المطبخ.","prep":"حددوا مكانها من الأول: على شباك المطبخ، في حتة بيعدي عليها كل يوم.","run":"هو اللي يحط القطن ويبلّه ويرص الحبات، ومهمته اليومية يبص عليها ويرش نقط مية — لو نسي فكّره بس ومتعملهاش عنه. لما تنبت بعد كام يوم قوله: «ده حصل عشان انت كمّلت كل يوم — يوم واحد بس مكنش هيطلع حاجة»."},{"t":"صينية لسه شغالين","mat":"صينية قديمة أو غطا كرتونة، وورقة مكتوب عليها «لسه».","prep":"ارسموا الورقة سوا والزقوها على الصينية، وحطوها في مكان ثابت في أوضة اللعب.","run":"أي شغل اتبدأ ووقف — بازل ناقص، رسمة في نصها — يتحط على الصينية بدل ما يتلم، وقبل أي لعبة جديدة تبصوا فيها سوا: «نخلّص اللي هنا الأول ولا نلمّه خالص؟». الصينية الفاضية آخر الأسبوع إنجاز بيتشاف. قوله: «الصينية فضيت — انت قفلت كل حاجة انت فتحتها»."}],"say":"خلّص اللي بدأته.","deen":["مراجعة شاملة: أحب الأعمال أدومها","اعمل قعدة مراجعة أسبوعية كاحتفال مش امتحان: بعد المغرب وحواليكم حاجة بيحبها، قول له «وريني أحلى حاجة بتحبها من اللي بنقولها» وسيبه يعرض الأذكار والسور القصيرة اللي يعرفها — ولو وقف، كمّل انت الجملة عادي وامدح اللي فضل مش اللي وقع. واربطها بالمحور نفسه: زي ما بنكمّل البازل للآخر، بنكمّل السورة القصيرة لآخر آية. والنبي ﷺ قال: «أحب الأعمال إلى الله أدومها وإن قلّ» (متفق عليه من حديث عائشة) — شوية ثابتة كل يوم أحسن من كتير بينقطع، ودي نفسها فكرة الإصرار."],"skill":"يبدأ حاجة ويخلّصها: البازل اللي فتحه يتقفل والرسمة اللي بدأها تتلوّن لآخرها قبل ما ينط للعبة تانية — نفس العضلة اللي هيذاكر بيها واجب كامل بعد كام سنة.","lvl":4,"ord":3,"tag":"الإحباط والمحاولة","src":[["قصة · عصافير مميز","هل يمكنك فعلها؟","https://3asafeer.com/ar/read/1659/هل-يمكنك-فعلها؟"],["قصة · عصافير مميز","كأس التفوق","https://3asafeer.com/ar/read/792/كأس-التفوق"]],"mistakes":[{"m":"بتكمّل انت وراه: ساب البازل ناقص فركّبت الباقي عشان «الترابيزة تتلم» — خلصت المهمة وقتلت الدرس. اللي وصله: اللي يستنى كفاية، حد تاني هيكمل بداله.","fix":"البازل الناقص يفضل مفروش أو يطلع على الرف بعلامة «لسه شغالين فيه» — وبكره صغّرله الخطوة: «الحتة الزرقا دي بس». الإتمام حقه هو، حتى لو اتأخر."},{"m":"بتديله مهام أكبر من مستواه وبعدين بتعتبر انسحابه «قلة إصرار»: بازل 100 قطعة لطفل 4 سنين مش تدريب إصرار — ده تدريب منظم على الفشل والانسحاب.","fix":"أصعب بدرجة واحدة بس من آخر نجاح: خلّص الـ12 قطعة بسهولة؟ هات 24. الإصرار بيتبني من سلسلة «كانت صعبة شوية وخلصتها» — مش من جبل."},{"m":"«انت اللي اخترتها يبقى تكمّلها!» بنبرة العقاب — حوّلت الإتمام من إنجاز بيفرّح لحكم بينفّذ، وهيبدأ يخاف يبدأ أي حاجة عشان ميتحبسش فيها.","fix":"نفس القاعدة بنبرة الشراكة: «نكمّلها سوا شوية ولا نحطها على الرف لبكره؟» — الإتمام صنعة بنتعلمها مع بعض، مش عقوبة على الاختيار."}],"adapt":[{"kid":"كثير الحركة","how":"القعدة الطويلة هي العدو، مش المهمة. خلّي المشاريع حركية — مجسم كبير على الأرض، زرع في البلكونة — والجلسات قصيرة: عشر دقايق شغل وبريك حركة، والبريك جزء من الشغل مش هروب منه: «هنجري للباب وراجعين نكمل»."},{"kid":"الحساس","how":"بينهار عند أول قطعة مش راكبة، وكوم القطع الباقي بيرعبه. غطّي الباقي بفوطة ووريه اللي خلص بس — «بص عملت قد إيه» — واقعد أقرب في المهام الصعبة: مش عشان تساعد، عشان وجودك نفسه بيهدي."},{"kid":"العنيد","how":"بيرفض يكمل أي حاجة كانت فكرتك انت — الإتمام عنده مربوط بمين صاحب الفكرة. سيبه يختار المشروع بنفسه، ولما يزنق اعرض اختيارين اتنينهم إتمام: «نكمل المكعبات ولا نرجع للرسمة؟» — هو اللي اختار، وهو اللي كمّل."}]},
{"name":"القناعة: أحتاج ولا أريد","cat":"ذات","age":[4,8],"how":"الفرق بيتعلّم بالفرز المحسوس والتأجيل الفعلي، مش بالمواعظ. والاعتراف بالرغبة مش موافقة عليها.","steps":[{"t":"كلمتين: محتاج ونفسي فيه","d":"ابدأ بالفرز المحسوس على السفرة أو وانتو بتلموا اللعب: امسك كوباية المية واسأله «نقدر نعيش من غيرها؟»، وبعدها امسك عربية اللعب واسأل نفس السؤال. الكوباية «محتاجينها»، والعربية «نفسنا فيها» — كرر الكلمتين دول لحد ما يبقوا لغة البيت. متشرحش نظري: كل حاجة يمسكها هي فرصة سؤال.","say":"المية محتاجينها عشان نعيش — العربية نفسنا فيها، وفيه فرق"},{"t":"سمّي الرغبة من غير شرا","d":"في السوبرماركت اتفقوا قبل الدخول: «جايين نجيب اللي في الورقة». لما يمسك شوكولاتة عند الكاشير متقولش «لأ» ناشفة ومتشتريش: اعترف بالرغبة بصوت هادي الأول، وبعدها القرار. الاعتراف بيطفي نص النوبة لأنه حس إنك فاهمه — والاعتراف بالرغبة مش موافقة عليها.","say":"أنا شايف إن نفسك فيها فعلًا — واحنا مش هنشتريها النهارده"},{"t":"لستة نفسي والتأجيل الفعلي","d":"علّق ورقة على التلاجة اسمها «لستة نفسي»: كل حاجة يطلبها في الشارع أو من إعلان، يرسمها فيها أول ما ترجعوا. مرة كل أسبوعين بصوا في اللستة واختاروا حاجة واحدة بس تتنفذ — هيكتشف بنفسه إن نص الحاجات مبقاش عايزها أصلًا. كده الرغبة ليها مكان محترم، بس مش كل رغبة بتتنفذ فورًا.","say":"مش هنشتريها النهارده — بس تعالى نرسمها في لستة نفسي"},{"t":"عضلة عندنا","d":"عضلة «عايز» بتتمرن لوحدها طول اليوم — عضلة «عندنا» انت اللي بتمرّنها. عادة صغيرة قبل النوم أو على عشا الجمعة: كل واحد يقول حاجة عنده فرّحته النهارده — «أنا فرحان بالبسكلتة»، «أنا فرحان إن جدو اتصل». مش درس عن الشكر ولا مقارنة بأطفال محرومين — مجرد تسمية الموجود بصوت عالي. الطفل اللي بيعدّ اللي عنده كل ليلة، عينه بتتدرب تشوف الملي في الكوباية.","say":"قولّي حاجة عندك فرّحتك النهارده — وأنا هقولك بتاعتي"},{"t":"قناعتك انت بصوت عالي","d":"خليه يسمعك بتاخد نفس القرار على نفسك: قدام فاترينة الموبايلات قول بصوت مسموع «نفسي في الموبايل ده، بس موبايلي شغال». ولما إعلان لعبة يظهر على التابلت علّق: «الإعلان شغلته يخلينا نحس إننا محتاجين». الطفل بيقلد قراراتك اللي بيشوفها، مش المواعظ اللي بيسمعها.","say":"نفسي فيها، بس أنا مش محتاجها — فمش هشتريها"}],"mastery":"بيقبل «مش هنشتري النهارده» من غير نوبة — أغلب المرات.","acts":[{"t":"لعبة كروت الفرز","mat":"10 كروت مقصوصة أو مرسومة، وورقتين مكتوب عليهم «محتاجينها» و«نفسنا فيها».","prep":"قص أو ارسم الكروت: مية، سرير، عيش، هدوم، فرشة سنان — وأيس كريم، بالونة، لعبة سيارات، شيبسي. اقلبهم على وشهم على السجادة.","run":"هو يسحب كارت كارت ويحطه على ورقة «محتاجينها» أو «نفسنا فيها» ويقول ليه. اختم بكارت صعب زي العصير وسيبه يحتار — الحيرة نفسها هي التعلم. قول له: «فيه حاجات بنعيش بيها وحاجات بتفرّحنا — والاتنين ليهم مكان»."},{"t":"حصّالة لستة نفسي","mat":"علبة بلاستيك بغطا، ألوان للتزيين، صورة الحاجة اللي نفسه فيها، درهم كل يوم.","prep":"اعمل فتحة في الغطا وخليه يزين العلبة بالألوان، واختاروا من لستة التلاجة حاجة واحدة والصقوا صورتها على الحصّالة.","run":"كل يوم بعد العشا يحط فيها درهم بإيده ويهزها يسمع صوتها. لما توصلوا للمبلغ، هو اللي يشيلها للمحل ويدفع بإيده للكاشير. قول له وانتوا بتبدأوا: «الحاجة اللي نفسنا فيها بنستناها ونحوّشلها»."}],"say":"دي حاجة نفسك فيها، مش محتاجها.","deen":["القناعة والشكر","القناعة بتتعلم بالإيد مش بالودن: في وقت رايق — مش بعد موقف شرا متوتر — جهّزوا سوا حاجة تدّوها: لعبة بحالة كويسة أو هدوم صغّرت عليه، وهو اللي يختارها ويحطها في الشنطة ويسلّمها بإيده. واشكر النعم بصوت مسموع قدامه على السفرة: «الحمد لله — عندنا أكل حلو النهارده». والنبي ﷺ قال: «ليس الغنى عن كثرة العَرَض، ولكن الغنى غنى النفس» (متفق عليه من حديث أبي هريرة) — وطفلك بياخد غنى النفس ده من بيت بيتكلم عن اللي في إيده أكتر ما بيتكلم عن اللي في المحلات."],"skill":"يختار واحدة ويسيب الباقي: قدام رف الحلويات في السوبر ماركت تقول له «اختار حاجة واحدة» فيختار ويكمّل معاك من غير زن — قرار صغير بيتمرّن عليه في كل مشوار.","lvl":4,"ord":1,"tag":"المال والقناعة","src":[["قصة · عصافير مميز","أحتاج أم أريد؟","https://3asafeer.com/ar/read/229/أحتاج-أم-أريد؟"],["قصة · عصافير مميز","أريد، ولكن","https://3asafeer.com/ar/read/1076/أريد،-ولكن"]],"mistakes":[{"m":"بتحوّل «لأ» لموعظة: «الفلوس بتيجي بتعب، وفيه أطفال ملهمش» — طفل 4 سنين مش بيطلع من الموعظة قنوع، بيطلع مذنب. والذنب بيعلّم إخفاء الرغبة، مش الرضا.","fix":"اعتراف قصير وقرار هادي: «نفسك فيها، وإحنا مش هنشتريها النهارده». خلاص — من غير محكمة."},{"m":"«مفيش فلوس» — وبعدها بدقيقتين بيشوفك بتشتري قهوتك. اكتشف إن الجملة كذبة، فبقت كل «لأ» عندك قابلة للتفاوض والزن.","fix":"قول الحقيقة: القرار مش العجز — «معانا فلوس، ومش هنصرفها في دي النهارده». الطفل بيحترم القرار الثابت أكتر ما بيحترم العذر المكشوف."},{"m":"بتكافئ كل سلوك حلو بشرا: «لو فضلت كويس في المحل هجيبلك شوكولاتة» — ربطت الأدب بالاستهلاك، وعلّمته إن كل حاجة ليها تمن بيتشرى — وده عكس القناعة بالظبط.","fix":"خلّي المكافأة وصف ووقت: «انت استنيت معايا الطابور كله — تعالى نعمل العصير سوا في البيت». القرب أغلى من الكيس."}],"adapt":[{"kid":"عالي الشدة","how":"نوبة الكاشير عنده نووية — فالشغل كله قبل الباب مش عنده. الاتفاق برّه المحل: «جايين نجيب اللي في الورقة — انت اللي ماسكها»، واديله مهمة جوه (يلاقي الجبنة، يحطها في العربية). وأول شهر خش من الممر اللي مفيهوش حلويات أصلًا — تجنّب المعركة اللي لسه مكسبهاش أذكى من خوضها كل مرة."},{"kid":"العنيد","how":"«لأ» الناشفة بتفتح معركة إرادة مش درس قناعة. سيب القرار الكبير ثابت وحطه هو في قرارات جنبه: هو اللي يرسم الحاجة في اللستة، هو اللي يختار يوم المراجعة، هو اللي يشطب اللي مبقاش عايزه. العنيد بيقبل الحد اللي هو شريك في نظامه."},{"kid":"الحساس","how":"بياخد الرفض على نفسه: «لأ» على اللعبة بيسمعها «لأ» عليه هو. افصلهم بصوت واضح: «نفسك فيها ودي حاجة طبيعية خالص — وإحنا مش هنشتريها النهارده». واللستة معاه مش رفاهية: رسمة الحاجة في الورقة دليل إن رغبته محترمة حتى لما مش بتتنفذ."}]},
{"name":"الثقة بالمحاولة","cat":"ذات","age":[3,8],"how":"الوصف بيبني تقييم داخلي، والمدح العام بيبني اعتماد على تقييمك أنت. صف الفعل، مش الطفل.","steps":[{"t":"أسبوع من غير برافو","d":"جرب على نفسك أسبوع كامل: كل ما يجيلك برسمة أو برج مكعبات، وقّف لسانك عن «برافو» و«شاطر»، وبص في اللي عمله ثانيتين بجد، وقول حاجة حقيقية شفتها: عدد الألوان، البرج اللي وقع مرتين وقام تاني. لو زلّت «شاطر» منك، كمّلها بوصف. الوصف بيقوله «أنا شايفك فعلًا»، والمدح العام بيقوله «أنا بصيت بسرعة».","say":"انت استخدمت تلات ألوان، وعملت الشمس في الركن هنا"},{"t":"مهمة أصعب بدرجة واحدة","d":"اختار حاجة فوق مستواه بدرجة واحدة بس: يقفل سوستة جاكت الحضانة، يصب المية من الزجاجة للكوباية، يفتح برطمان الجبنة. الدرجة الواحدة دي محسوبة — الأصعب بكتير بيكسّر، والأسهل من مستواه مبيبنيش. وسيب النتيجة الناقصة زي ما هي: المية اللي دلقت حبة تتمسح وخلاص، والسوستة اللي قفلت أعوج قفلت برضه.","say":"دي صعبة شوية — جرّبها انت"},{"t":"أصغر مساعدة ممكنة","d":"لما يتزنق، اقعد على إيديك حرفيًا وعدّ في سرك لعشرة. لو طلب مساعدة، اديها بالترتيب ده: كلمة الأول («امسك القماشة من تحت»)، فإشارة بصباعك، وإيدك آخر حل خالص — وحتى لما تتدخل، اعمل أصغر جزء ورجّع الباقي له يخلصه بنفسه. اللي بيقفل آخر خطوة بإيده هو صاحب جملة «أنا عملتها» — متسرقهاش منه.","say":"قولّي محتاجني في إيه بالظبط — وأنا هساعدك في الحتة دي بس"},{"t":"حائط كنت وبقيت","d":"على باب أوضته علّقوا ورقة كبيرة اسمها «كنت صغير وبقيت أعرف»: صورة أو رسمة لكل مهارة جديدة — أول مرة لبس جزمته لوحده، أول مرة ركب السكوتر. هو اللي يعلّق الجديدة بإيده. مرة في الأسبوع قبل النوم اتفرجوا عليها وافتكروا سوا: «فاكر لما كانت صعبة؟». الحائط ده دليله المادي إن الصعب بيتعلم.","say":"كل حاجة على الحيطة دي كانت صعبة عليك — وبقيت بتعملها لوحدك"},{"t":"هو اللي يعلّمك","d":"اقلب الأدوار مرة في الأسبوع: اطلب منه يعلّمك حاجة هو بيعرفها — لعبة من الحضانة، إزاي يبني جراج للعربيات، لعبة بيلعبها. اغلط غلطة حقيقية وسيبه يصححلك من غير ما تضحك عليها. لما يبقى هو المعلم، بيتأكد إن اللي عنده ليه قيمة — ودي الثقة نفسها.","say":"أنا مش عارف أعملها — علّمني انت خطوة خطوة"}],"mastery":"بيقول «أنا هعملها» وبيجرب لوحده قبل ما يطلب مساعدة.","acts":[{"t":"تحدي الصب","mat":"صينية، زجاجة مية صغيرة، كوبايتين بلاستيك، فوطة صغيرة — كله من المطبخ.","prep":"في وقت هادي، رص الحاجات على الصينية على ترابيزة المطبخ، وحط الفوطة جنبه من الأول — عشان يعرف من البداية إن الدلق محسوب حسابه.","run":"مهمته يملى الكوبايتين من الزجاجة من غير ما يدلق، ولو دلق هو اللي يمسح بالفوطة ويكمّل — الدلق جزء من اللعبة مش نهايتها. متمسكش الزجاجة معاه خالص مهما اتهزت إيده. وفي الآخر قول له: «المرة الأولانية دلقت شوية، والتانية المية كلها وصلت الكوباية»."},{"t":"حيطة كنت وبقيت","mat":"ورقة كبيرة أو كرتونة، صور مطبوعة أو رسمات صغيرة، شريط لازق.","prep":"علّق الورقة الكبيرة على باب الأوضة في مستوى نظره — هتبدأ فاضية وتتملي مع الوقت.","run":"كل ما يتعلم مهارة جديدة — يفتح العلبة لوحده، يغسل إيده لوحده — ارسموها أو صوروها، وهو اللي يلزقها على الحيطة بإيده. مرة في الأسبوع اتفرجوا عليها سوا وقول له: «بص كل دي حاجات كانت صعبة عليك — إيه الجاي اللي هتتعلمه؟»."}],"say":"لوّنت جوه الخط كله.","deen":["ما شاء الله، تبارك الله","كل ما يخلّص حاجة بمجهوده — يصب من غير ما يدلق، يقفل جزمته لوحده — قول قدامه: «ما شاء الله، جربت بإيدك وربنا وفقك»، فتربط ثقته بحاجتين مع بعض: مجهوده الحقيقي وفضل ربنا، من غير ما تلغي واحدة منهم. وأصل الكلمة في سورة الكهف: «ما شاء الله لا قوة إلا بالله». ولو حاول ومنجحش، اثبت على نفس الربط: «انت عملت اللي عليك، وربنا هيوفقك المرة الجاية» — فيتعلم يحاول وهو متطمن، مش خايف من الغلط."],"skill":"خدمة نفسه في الأكل: يغرف أكله في طبقه بنفسه على السفرة ويقرر هو الكمية — نفس الثقة اللي هيحتاجها في الحضانة لما ياخد أكله بنفسه من غير ما يستنى حد يخدمه.","lvl":4,"ord":4,"tag":"الإحباط والمحاولة","src":[["قصة · مجاني","أنا كل الألوان","https://3asafeer.com/ar/read/24/أنا-كل-الألوان"],["قصة · عصافير مميز","في داخلي جوهرة","https://3asafeer.com/ar/read/1406/في-داخلي-جوهرة"]],"mistakes":[{"m":"بتصلّح شغله وراه وهو شايف: يقفل السوستة أعوج فتظبطها، يرص المكعبات فتعدّل الصف — الرسالة اللي بتوصله: «محاولتك مش كفاية».","fix":"النتيجة الناقصة تفضل زي ما هي — سوستة أعوج بتقفل برضه. ولو التعديل ضروري فعلًا، اعمله بعيد عن عينه."},{"m":"بتقوله «انت ذكي» و«انت شاطر» على كل حاجة — مدح الصفة بيخوّفه من أي مهمة ممكن تثبت العكس، فبيبدأ يهرب من الصعب عشان يحافظ على اللقب.","fix":"صف الفعل اللي حصل مش الصفة: «انت جربت تلات مرات لحد ما ركبت» — الفعل يقدر يكرره بكره، اللقب بيقعد يحميه."},{"m":"بتعرضه قدام الضيوف: «وريهم إزاي بتعد لعشرة» — المهارة بتتحول لعرض، والغلطة قدام جمهور بتبقى فضيحة، فبيرفض يحاول قدام أي حد.","fix":"المحاولات الجديدة بينك وبينه بس، والعرض قدام الناس يطلع منه هو لو حب — مش بإعلان منك."}],"adapt":[{"kid":"الحساس","how":"أول فشل بيقلب عياط وبيرمي المهمة من إيده — متقولش «جرب تاني» في لحظة العياط. سمّي الإحساس الأول («اتضايقت إنها مقفلتش»)، وارجعوا لنفس المهمة بعد ساعة أو في يوم أهدى، وارفع الصعوبة نص درجة مش درجة."},{"kid":"العنيد","how":"بيرفض مساعدتك حتى وهو غرقان — وده كنز مش مشكلة: بطّل تعرض المساعدة أصلًا واستنى هو يطلبها بلسانه. ولما تديها، اديها كمعلومة مش كإنقاذ: «فيه ناس بتمسكها من تحت» — وسيبه ياخد الفكرة كأنها بتاعته."},{"kid":"الخجول","how":"بيحاول عادي معاك لوحدكم وبيتجمد لو حد بيتفرج — خلي المهارات الجديدة تتولد في البيت من غير جمهور، ومتعلنش قدام الناس («وريهم!») ولا تعلق لو غلط قدامهم — كلمة واحدة قدام الضيوف بتكلف أسبوع محاولات."}]},
{"name":"تحمّل الخسارة","cat":"ذات","age":[4,8],"how":"لازم تخسر أنت قدامه وتوري رد فعل هادي. لو كل اللعب بيتظبط عشان يكسب، مش هيتعلم.","steps":[{"t":"اخسر انت الأول","d":"قبل ما تطلب منه يستحمل الخسارة، وريه شكلها: العبوا لعبة الذاكرة بست كروت أو سباق لبس الجزمة، واقصد تخسر أول جولة. خلي وشك عادي وقول الجملة اللي عايزه يحفظها بعدين. هو بيتعلم رد الفعل من وشك انت في لحظة خسارتك، مش من أي شرح.","say":"أنا خسرت المرة دي — والمرة الجاية هجرب تاني"},{"t":"خسارة قصيرة بجد","d":"بطّل تظبط اللعب عشان يكسب — بس اختار ألعاب دقيقتين: مين يلاقي الجورب الأحمر الأول، لعبة الذاكرة الصغيرة. اللعبة القصيرة معناها إن الخسارة بتعدي بسرعة والإعادة قريبة. سيبه يخسر جولة بجد من كل تلاتة أربعة — مش كل مرة: طفل بيخسر كل مرة بيكره اللعب نفسه، وطفل بيكسب كل مرة بيتكسر في أول لعبة حقيقية بره البيت.","say":"نلعب تاني؟ يمكن تكسب ويمكن أكسب — نشوف"},{"t":"لحظة العياط نفسها","d":"لو خسر وعيّط أو قلب الكروت، دي اللحظة اللي القيمة بتتبني أو بتتهد فيها: سمّي الإحساس وثبّت النتيجة في نفس الجملة. متعيدش الجولة عشان يسكت، ومتقولش «لا انت اللي كسبت أصلًا»، ومتتريقش على عياطه. الإحساس مسموح والنتيجة واقفة — والإعادة الحقيقية بعد ما يهدى حق مضمون.","say":"انت متضايق عشان خسرت — الخسارة بتضايق فعلًا. لما تهدى نلعب من الأول"},{"t":"سؤال النهاية الجديد","d":"غيّر السؤال اللي بيقفل أي لعبة: بدل «مين كسب؟» اسأل «إيه أحلى حركة عملتها؟». في العربية وانتو راجعين من النادي أو من عند ولاد عمه، اسأل عن أحلى لحظة في اللعب مش عن النتيجة. مع التكرار هيبدأ يفتكر اللعب نفسه مش بس آخره.","say":"مش مهم مين كسب — إيه أحلى حركة عملتها في اللعبة؟"},{"t":"خسارة وسط أطفال","d":"الامتحان الحقيقي مع ولاد عمه أو أطفال الجيران في البلاي إريا: لعبة فيها فايز وانت قاعد بعيد. لو خسر ومسك نفسه — حتى لو وشه اتكشّر — متتدخلش في اللحظة، وسمّيها له بالليل بوصف دقيق. اللحظة اللي بيعدّي فيها الخسارة قدام أصحابه من غير ما تنقذه هي اللي بتثبّت القيمة.","say":"خسرت النهارده وكمّلت لعب مع أصحابك — دي أصعب حاجة وانت عملتها"}],"mastery":"بيكمّل اللعبة اللي بيخسرها من غير عياط — وبيقول «المرة الجاية».","acts":[{"t":"بطولة الجولات التلاتة","mat":"لعبة الذاكرة بست كروت، أو مكعبات — أي لعبة تنافسية قصيرة عندكم.","prep":"اختار وقت انتوا الاتنين رايقين فيه، واتفقوا من الأول إنها تلات جولات قصيرة بس — مثلًا مين يجمع خمس مكعبات لركنه الأول.","run":"اخسر انت جولة بقصد وقول بوش عادي: «خسرت — المرة الجاية»، وسيبه يخسر جولة بجد، والتالتة زي ما تيجي. بعد آخر جولة السؤال الوحيد المسموح: «إيه أحلى حركة عملتها؟» — مش مين كسب."},{"t":"سباق العيلة","mat":"حاجات بألوان مختلفة من اللي في الصالة: مكعبات، شرابات.","prep":"بابا وماما والطفل، كل واحد له ركن في الصالة، وأعلنوا القاعدة قبل ما تبدأوا: اللي يخسر يقول بصوت عالي «المرة الجاية».","run":"كل واحد يجمع خمس حاجات باللون بتاعه لركنه، ومين يخلص الأول يكسب الجولة. لما ماما تخسر وتقول «المرة الجاية» بابتسامة حقيقية، بيشوف إن الجملة دي بتتقال بجد — مش حاجة مخصوصة للأطفال."}],"say":"اللعب حلو حتى لما نخسر.","deen":["قدر الله وما شاء فعل","خلّي جملة البيت الثابتة بعد أي لعبة: «كسبنا نحمد ربنا، وخسرنا نحمد ربنا ونحاول تاني». ولما تخسر انت حاجة قدامه — جولة لعب، مكان ركنة راح منك — قول بصوت مسموع «قدر الله وما شاء فعل» وكمّل يومك عادي، فيشوف الجملة بتتعاش مش بتتحفظ. وأصلها وصية النبي ﷺ في الحديث اللي رواه مسلم: لو أصابك شيء متقولش «لو إني عملت كذا»، قول «قدر الله وما شاء فعل». بالتكرار هيربط الخسارة بالرضا والمحاولة الجاية — من غير ما تلقّنه الجملة في لحظة عياطه نفسها."],"skill":"قفل اللعبة بروح رياضية: يلم الكروت والمكعبات بعد ما اللعبة تخلص حتى لو كان هو اللي خسر — نفس المهارة اللي هتخلي أصحابه في الحضانة يحبوا يلعبوا معاه تاني.","lvl":4,"ord":2,"tag":"العدل والخلاف","src":[["قصة · عصافير مميز","المتسابقون","https://3asafeer.com/ar/read/1328/المتسابقون"],["قصة · عصافير مميز","من الأفضل؟","https://3asafeer.com/ar/read/1025/من-الأفضل؟"]],"mistakes":[{"m":"بتظبط اللعب سرًا عشان يكسب كل مرة والقعدة تعدي بهدوء — انت كده بتأجل النوبة لأول لعبة حقيقية مع أطفال، وساعتها هتيجي قدام جمهور ومن غيرك جنبه.","fix":"خسارة صغيرة كل كام جولة في البيت أرخص تمرين — البيت هو الجيم، مش الماتش."},{"m":"لما بيعيط بتلغي النتيجة: «طب تعالى نعيدها وانت هتكسب» أو «أصل أنا غشيت» — بتعلّمه إن العياط بيعيد كتابة الواقع.","fix":"النتيجة ثابتة والحضن مفتوح — الاتنين مع بعض. الإعادة بعد الهدوء حق، إلغاء الخسارة لأ."},{"m":"بتزعّق للتلفزيون وتتنرفز لما فريقك يخسر الماتش وهو قاعد جنبك على الكنبة — هو بياخد منهج الخسارة من رد فعلك ده، مش من كلامك ليه.","fix":"علّق قدامه بالجملة اللي عايزه يحفظها: «خسرنا النهارده — الماتش الجاي نكسب»، حتى لو جواك مولع."}],"adapt":[{"kid":"عالي الشدة","how":"الخسارة بتفجّر نوبة كاملة — رمي وصريخ. قصّر اللعبة لأقل من دقيقتين، وخسارة واحدة بس في القعدة، وأول ما النوبة تولع اشتغل بقواعد ضبط الغضب: أمان وكلام قليل. درس الخسارة بييجي بالليل، مش في عز الصريخ."},{"kid":"الحساس","how":"بيترجم الخسارة لـ«أنا وحش» وبينسحب من اللعب كله — افصل النتيجة عن قيمته بجملة واضحة: «انت خسرت الجولة — ده عن الجولة، مش عنك»، وضاعف خطوة «اخسر انت الأول» قدامه لأسابيع قبل ما تسيبه يخسر هو."},{"kid":"العنيد","how":"بيغيّر القواعد في نص اللعبة عشان يكسب («لأ، الأحمر بقى بياخد نقطتين») — اتفقوا على القاعدة بصوت عالي قبل ما تبدأوا، ولو غيّرها في النص وقّف بهدوء واديله اختيارين: نكمل بالقاعدة اللي اتفقنا عليها، ولا نلم اللعبة. الخروج مسموح، تفصيل الفوز لأ."}]},
{"name":"إدارة الملل","cat":"ذات","age":[4,8],"how":"الملل شرط للإبداع. متملّاش كل دقيقة بنشاط — سيبها تزهق وتخترع.","steps":[{"t":"نص ساعة من غير برنامج","d":"حدد نص ساعة ثابتة — مثلًا بعد الغدا والرجوع من الحضانة — مفيش فيها تابلت ولا نشاط انت مجهزه. انت موجود في نفس الأوضة بس مشغول بحاجتك: بتطبخ، بتقرا. اعلنها كقاعدة بيت مش كعقاب، وكررها كل يوم في نفس الوقت لحد ما يتوقعها.","say":"ده وقت لعبك انت — انت اللي بتقرر تعمل إيه فيه"},{"t":"زهقان؟ متنقذوش","d":"أول ما يجيلك يقول «أنا زهقان» — دي اللحظة اللي بتتبني فيها القيمة. رد ثابت: سمّي الإحساس، وأعلن ثقتك إنه هيلاقي، ومتقترحش ولا نشاط لمدة عشر دقايق كاملة. هيزن، هيتمرمر، وبعدين — لو استحملت — هتلاقيه ماسك حاجة. الإنقاذ السريع بيعلّمه إن التسلية شغلتك انت مش شغلته.","say":"انت زهقان؟ كويس — الزهق بييجي قبل الفكرة على طول"},{"t":"صندوق الزهق المقفول","d":"جهزوا كرتونة فيها خامات مفتوحة مش لعب جاهزة: رولات مناديل فاضية، علب زبادي مغسولة، مشابك غسيل، شرايط، ورق وشريط لازق. القاعدة اللي بتخليها سحرية: متتفتحش غير وقت الزهق — لو بعد العشر دقايق لسه واقف مش لاقي، وجّهه ليها من غير ما تقعد تلعب بداله. جدد حاجة فيها كل أسبوعين من المطبخ.","say":"صندوق الزهق مستنيك — شوف النهارده هيطلع منه إيه"},{"t":"موبايلك في جيبك قدامه","d":"طفلك عمره ما شاف كبير زهقان: كل فجوة في يومك الموبايل بيسدها في ثانية، فبيتعلم إن الفراغ حاجة لازم تتسد فورًا بشاشة. في طابور الكاشير أو أوضة انتظار الدكتور، سيب الموبايل في جيبك وأعلنها بصوت مسموع، واتسلوا ببالكم: خمّنوا الراجل اللي قدامكم شاري إيه، عدّوا الحاجات الزرقا في المكان. زهقك المعلن ده أندر درس في الباب كله — القدوة في الملل نادرة وغالية.","say":"أنا زهقان ومش هطلّع الموبايل — تعالى نخمّن الراجل ده شاري إيه"},{"t":"سمّوا الاختراع بالليل","d":"لما يطلع من الزهق بحاجة — خيمة من ملاية الكنبة، عيلة ديناصورات من مشابك الغسيل — احكوها قبل النوم كحدوتة: «انت كنت زهقان، ومحدش جالك بفكرة، وبعدين انت اخترعت...». كده بيربط بنفسه إن الزهق مش نهاية — هو الحتة اللي قبل الفكرة. ومع التكرار هيبتدي يستقبل زهقه بفضول بدل الزن.","say":"انت الصبح كنت زهقان، وبعدها اخترعت الخيمة — شفت الزهق بيودّي فين؟"}],"mastery":"لما يقول «زهقان» بيلاقي لنفسه لعبة بعد شوية — بدل ما يتعلق فيك أو في الشاشة.","acts":[{"t":"صندوق الزهق","mat":"كرتونة جزم فاضية، ومن البيت: رولات مناديل، علب زبادي مغسولة، مشابك غسيل، شرايط، ورق ملون، شريط لازق.","prep":"زينوا الكرتونة سوا مرة واحدة واكتبوا عليها «صندوق الزهق»، وحطوها في مكان يوصله لوحده.","run":"القاعدة الثابتة: الصندوق متيفتحش غير لما يقول «أنا زهقان». ساعتها قول له: «افتح الصندوق وشوف إيه اللي هيطلع منه النهارده» — وسيبه يخترع من الخامات براحته من غير توجيه منك. كده كلمة «زهقان» نفسها بقت مفتاح لعبة، مش شكوى بتستناك تحلها."},{"t":"نص ساعة لعب من دماغك","mat":"تايمر المطبخ أو تايمر الموبايل — ولعبه الموجودة، من غير أي حاجة جديدة.","prep":"بعد الغدا، حط التايمر على 30 دقيقة، اقفل الشاشات، واقعد انت في نفس الأوضة بشغلك أو كتابك.","run":"سيبه يلاقي لنفسه لعبة لوحده، ولو جالك يشدك قول له: «أنا هنا جنبك، بس ده وقت لعبك انت». لما التايمر يرن اسأله: «عملت إيه في وقتك؟» واسمع الإجابة باهتمام حقيقي — الحكي في الآخر هو المكافأة الوحيدة."}],"say":"الزهق مش مشكلة، دي بداية فكرة.","deen":["سبحان الله في الملاحظة","أول ما يقول «أنا زهقان»، اقلب الزهق لعبة ملاحظة: قفوا في البلكونة أو قدام الشباك ودوروا سوا على تلات حاجات ربنا خلقها — عصفورة، سحابة، نخلة — وكل واحدة تتقفل بـ«سبحان الله». قولها انت بانبهار حقيقي — هو بيقلد نبرتك قبل كلمتك. كده التسبيح بيبقى نظرة للدنيا بيشربها منك في لحظات الفراغ نفسها — مش كلمة بتتحفظ في وقت مخصوص."],"skill":"اللعب المستقل: يقعد مع نفسه ربع ساعة بلعبة واحدة من غير شاشة ولا حد يسليه — نفس المهارة اللي هتنفعه في وقت الانتظار عند الدكتور أو في مشوار العربية الطويل.","lvl":4,"ord":5,"tag":"الفضول والعلوم","src":[["قصة · عصافير مميز","قصة مملة جدا","https://3asafeer.com/ar/read/703/قصة-مملة-جدا"],["قصة · عصافير مميز","لا توجد قصة في هذا الكتاب","https://3asafeer.com/ar/read/524/لا-توجد-قصة-في-هذا-الكتاب"]],"mistakes":[{"m":"كل ما يزهق في العربية أو المطعم بتحط التابلت في إيده على طول — الطفل اللي كل فجواته بتتسد بشاشة عمره ما هيقابل الزهق أصلًا، يبقى هيتدرب عليه إمتى؟","fix":"المشاوير القصيرة والاستنى في المطعم من غير شاشة — دي بالظبط فرص التدريب المجانية: شباك العربية والناس اللي رايحة جاية تسلية كاملة."},{"m":"حاسس بذنب إنه زهقان فمليت أسبوعه: سباحة وكاراتيه وعربي وحصة فنون — الجدول المليان بيربّي طفل مش بيعرف يقعد مع نفسه عشر دقايق.","fix":"الزهق مش تقصير منك — هو حصة زي الحصص. سيب في الأسبوع فراغات حقيقية محدش مسؤول عن ملاها غيره هو."},{"m":"«زهقان؟ طب تعالى لم أوضتك» — لما الزهق بيتحول لأمر شغل، بيتعلم يستخبى بزهقه عنك، وياخده للشاشة في السر.","fix":"الزهق مش جريمة ليها عقوبة شغل — استقبله بالرد الثابت: تسمية، ثقة إنه هيلاقي، وصبر عشر دقايق."}],"adapt":[{"kid":"كثير الحركة","how":"زهقه بيتحول جري ونط على الكنب في دقيقتين — حط الحركة جوه صندوق الزهق نفسه: حبل، كور، مخدات يبني بيها قلعة. واستقبل إن اختراعاته هتبقى جسدية — مطلوب منه يلاقي لعبة، مش يلاقي لعبة هادية."},{"kid":"عالي الشدة","how":"العشر دقايق بتاعة «متنقذوش» بتتصاعد عنده لنوبة مش زن — ابدأ بدقيقتين بس من غير إنقاذ وزوّدهم أسبوع ورا أسبوع، وشاور على صندوق الزهق بدري شوية. الهدف يتمرن على الفجوة، مش يتكسر فيها."},{"kid":"العنيد","how":"لو قلت له «افتح صندوق الزهق» هيرفضه عشان الفكرة بتاعتك — متوجّهش بالأمر: حط الصندوق في نص الأوضة وانت ساكت واتلهي بحاجتك. لما يفتحه بقراره، الاختراع اللي هيطلع منه بتاعه هو من أوله لآخره."}]},
{"name":"تنظيم الوقت البسيط","cat":"ذات","age":[5,8],"how":"الزمن بيتعلّم بالتسلسل مش بالساعة: قبل، بعد، بكره، امبارح — بالتكرار اليومي.","steps":[{"t":"الأول وبعدين في كل تعليمة","d":"بدل الأوامر المفردة، حط كل تعليمة في تسلسل: «بنلبس الجزمة بعد الشراب»، «بناكل بعد ما نغسل إيدينا»، «الحدوتة بعد غسيل السنان». وبعد أسبوع اقلبها أسئلة: «بعد الحمام بنعمل إيه؟» وسيبه هو اللي يكمّل. الزمن عنده بيتبني من السلاسل دي، مش من الساعة.","say":"الأول بنغسل سنانا، وبعدين الحدوتة"},{"t":"حدوتة اليوم قبل النوم","d":"التسلسل بيتبني لورا قبل ما يتبني لقدام: قبل النوم اسأله يحكي يومه بالترتيب — «الصبح عملنا إيه الأول؟ وبعدين؟ وبعدين؟». هيقفز وهيلخبط الترتيب، ورتّبوا سوا من غير تصحيح ناشف: «استنى — احنا رحنا النادي قبل الغدا ولا بعده؟». اللي بيعرف يحكي النهارده بترتيبها هو اللي هيعرف بكره يتوقعها، وبعدها يخططها.","say":"احكيلي يومك من الأول — عملنا إيه وبعدين إيه؟"},{"t":"تقويم التلاجة المشطوب","d":"ورقة كبيرة على التلاجة فيها سبع خانات، وفي كل خانة علامة مرسومة: شنطة الحضانة ليوم الحضانة، موجة ليوم البحر، تليفون ليوم مكالمة تيتة. كل ليلة قبل النوم هو اللي يمسك القلم ويشطب اليوم اللي خلص، ويعد كام مربع فاضل على الحاجة اللي مستنيها. الشطب بإيده هو اللي بيخلي الأيام حاجة محسوسة.","say":"النهارده خلص — اشطبه. كام يوم فاضل على يوم البحر؟"},{"t":"بكره يعني نامة واحدة","d":"لما يسأل «هنروح الحديقة؟» وانتو متفقين بكره، امنع نفسك عن «بعدين» و«قريب» الغامضين — دول بيعلموه إن الوعود سايحة. ودّيه للتقويم ووريه: «احنا هنا النهارده، والحديقة هنا». ترجمها لوحدة يحسها: نامة واحدة، فطارين. ويوم التنفيذ لازم تتنفذ — التقويم اللي بيكدب بيموت.","say":"دي بكره — يعني ننام نامة واحدة ونصحى نلاقيها جت"},{"t":"هو اللي يخطط","d":"اقلب الاتجاه: هو عايز يعمل بيتزا مع ماما أو يعزم ابن عمه — قول له «اختار اليوم على التقويم». هو يرسم علامة الحاجة في المربع اللي اختاره، وكل ليلة وهو بيشطب يعد الفاضل عليها. لما يخطط وينفذ خطته بنفسه، بيتحول من طفل بيستنى اليوم لطفل بيبني اليوم.","say":"انت اللي هتختار اليوم — نحط البيتزا في أنهي مربع؟"}],"mastery":"عارف ترتيب يومه وبيقول «لسه بدري على كذا» أو «جه وقت كذا».","acts":[
