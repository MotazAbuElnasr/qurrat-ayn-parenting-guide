<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;

h2{font-weight:600;font-size:40px;line-height:1.3}

.tag b{font-weight:700;color:#1D6A6A}
.tag i{font-style:normal;color:#8FA093;padding:0 6px}
.dom{margin-top:44px;font-size:27px;font-weight:700;color:#1D6A6A;direction:ltr}
